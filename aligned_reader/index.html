. Then Hermione had performed a tricky little charm so that the paint flashed different colors.", "begin": 17563.675, "end": 17588.435, "localBegin": 419.08, "localEnd": 443.84}, {"id": "c011_f000043", "text": "Meanwhile, in the locker room, Harry and the rest of the team were changing into their scarlet Quidditch robes (Slytherin would be playing in green).", "begin": 17588.435, "end": 17597.915, "localBegin": 443.84, "localEnd": 453.32}, {"id": "c011_f000044", "text": "Wood cleared his throat for silence.", "begin": 17597.915, "end": 17600.195, "localBegin": 453.32, "localEnd": 455.6}, {"id": "c011_f000045", "text": "\"Okay, men,\" he said.", "begin": 17600.195, "end": 17603.395, "localBegin": 455.6, "localEnd": 458.8}, {"id": "c011_f000046", "text": "\"And women,\" said Chaser Angelina Johnson.", "begin": 17603.395, "end": 17607.195, "localBegin": 458.8, "localEnd": 462.6}, {"id": "c011_f000047", "text": "\"And women,\" Wood agreed. \"This is it.\"", "begin": 17607.195, "end": 17611.035, "localBegin": 462.6, "localEnd": 466.44}, {"id": "c011_f000048", "text": "\"The big one,\" said Fred Weasley.", "begin": 17611.035, "end": 17613.595, "localBegin": 466.44, "localEnd": 469.0}, {"id": "c011_f000049", "text": "\"The one we've all been waiting for,\" said George.", "begin": 17613.595, "end": 17616.675, "localBegin": 469.0, "localEnd": 472.08}, {"id": "c011_f000050", "text": "\"We know Oliver's speech by heart,\" Fred told Harry, \"we were on the team last year.\"", "begin": 17616.675, "end": 17621.715, "localBegin": 472.08, "localEnd": 477.12}, {"id": "c011_f000051", "text": "\"Shut up, you two,\" said Wood. \"This is the best team Gryffindor's had in years. We're going to win. I know it.\"", "begin": 17621.715, "end": 17628.875, "localBegin": 477.12, "localEnd": 484.28}, {"id": "c011_f000052", "text": "He glared at them all as if to say, \"Or else.\"", "begin": 17628.875, "end": 17632.235, "localBegin": 484.28, "localEnd": 487.64}, {"id": "c011_f000053", "text": "\"Right. It's time. Good luck, all of you.\"", "begin": 17632.235, "end": 17637.875, "localBegin": 487.64, "localEnd": 493.28}, {"id": "c011_f000054", "text": "Harry followed Fred and George out of the locker room and, hoping his knees weren't going to give way, walked onto the field to loud cheers.", "begin": 17637.875, "end": 17646.155, "localBegin": 493.28, "localEnd": 501.56}, {"id": "c011_f000055", "text": "Madam Hooch was refereeing. She stood in the middle of the field waiting for the two teams, her broom in her hand.", "begin": 17646.155, "end": 17652.675, "localBegin": 501.56, "localEnd": 508.08}, {"id": "c011_f000056", "text": "\"Now, I want a nice fair game, all of you,\" she said, once they were all gathered around her. Harry noticed that she seemed to be speaking particularly to the Slytherin Captain, Marcus Flint, a fifth year. Harry thought Flint looked as if he had some troll blood in him. Out of the corner of his eye he saw the fluttering", "begin": 17652.675, "end": 17674.395, "localBegin": 508.08, "localEnd": 529.8}, {"id": "c011_f000057", "text": "banner high above, flashing Potter for President over the crowd. His heart skipped. He felt braver.", "begin": 17674.395, "end": 17680.595, "localBegin": 529.8, "localEnd": 536.0}, {"id": "c011_f000058", "text": "\"Mount your brooms, please.\"", "begin": 17680.595, "end": 17684.475, "localBegin": 536.0, "localEnd": 539.88}, {"id": "c011_f000059", "text": "Harry clambered onto his Nimbus Two Thousand.", "begin": 17684.475, "end": 17689.035, "localBegin": 539.88, "localEnd": 544.44}, {"id": "c011_f000060", "text": "Madam Hooch gave a loud blast on her silver whistle.", "begin": 17689.035, "end": 17692.635, "localBegin": 544.44, "localEnd": 548.04}, {"id": "c011_f000061", "text": "Fifteen brooms rose up, high, high into the air. They were off.", "begin": 17692.635, "end": 17697.755, "localBegin": 548.04, "localEnd": 553.16}, {"id": "c011_f000062", "text": "\"And the Quaffle is taken immediately by Angelina Johnson of Gryffindor - what an excellent Chaser that girl is, and rather attractive, too - \"", "begin": 17697.755, "end": 17707.875, "localBegin": 553.16, "localEnd": 563.28}, {"id": "c011_f000063", "text": "\"JORDAN!\"", "begin": 17707.875, "end": 17708.875, "localBegin": 563.28, "localEnd": 564.28}, {"id": "c011_f000064", "text": "\"Sorry, Professor.\"", "begin": 17708.875, "end": 17711.315, "localBegin": 564.28, "localEnd": 566.72}, {"id": "c011_f000065", "text": "The Weasley twins' friend, Lee Jordan, was doing the commentary for the match, closely watched by Professor McGonagall.", "begin": 17711.315, "end": 17717.675, "localBegin": 566.72, "localEnd": 573.08}, {"id": "c011_f000066", "text": "\"And she's really belting along up there, a neat pass to Alicia Spinnet, a good find of Oliver Wood's, last year only a reserve - back to Johnson and - no, the Slytherins have taken the Quaffle, Slytherin Captain Marcus Flint gains the Quaffle and off he goes - Flint flying like an eagle up there - he's going to scno, stopped by an excellent move by Gryffindor Keeper Wood and the Gryffindors take the Quaffle - that's Chaser Katie Bell of Gryffindor there, nice dive around Flint, off up the field and - OUCH - that must have hurt, hit in the back of the head by a Bludger - Quaffle taken by the Slytherins - that's Adrian Pucey speeding off toward the goalposts, but he's blocked by a second Bludger - sent his way by Fred or George Weasley, can't tell which - nice play by the Gryffindor Beater, anyway, and Johnson back in possession of the Quaffle, a clear field ahead and off she goes - she's really flying - dodges a speeding Bludger - the goalposts are ahead - come on, now, Angelina - Keeper Bletchley dives - misses - GRYFFINDOR SCORE!\"", "begin": 17717.675, "end": 17788.275, "localBegin": 573.08, "localEnd": 643.68}, {"id": "c011_f000067", "text": "Gryffindor cheers filled the cold air, with howls and moans from the Slytherins.", "begin": 17788.275, "end": 17793.115, "localBegin": 643.68, "localEnd": 648.52}, {"id": "c011_f000068", "text": "\"Budge up there, move along.\"", "begin": 17793.115, "end": 17796.115, "localBegin": 648.52, "localEnd": 651.52}, {"id": "c011_f000069", "text": "\"Hagrid!\"", "begin": 17796.115, "end": 17798.155, "localBegin": 651.52, "localEnd": 653.56}, {"id": "c011_f000070", "text": "Ron and Hermione squeezed together to give Hagrid enough space to join them.", "begin": 17798.155, "end": 17802.275, "localBegin": 653.56, "localEnd": 657.68}, {"id": "c011_f000071", "text": "\"Bin watchin' from me hut,\" said Hagrid, patting a large pair of binoculars around his neck, \"But it isn't the same as bein' in the crowd. No sign of the Snitch yet, eh?\"", "begin": 17802.275, "end": 17812.315, "localBegin": 657.68, "localEnd": 667.72}, {"id": "c011_f000072", "text": "\"Nope,\" said Ron. \"Harry hasn't had much to do yet.\"", "begin": 17812.315, "end": 17815.515, "localBegin": 667.72, "localEnd": 670.92}, {"id": "c011_f000073", "text": "\"Kept outta trouble, though, that's somethin',\" said Hagrid, raising his binoculars and peering skyward at the speck that was Harry.", "begin": 17815.515, "end": 17823.835, "localBegin": 670.92, "localEnd": 679.24}, {"id": "c011_f000074", "text": "Way up above them, Harry was gliding over the game, squinting about for some sign of the Snitch. This was part of his and Wood's game plan.", "begin": 17823.835, "end": 17832.715, "localBegin": 679.24, "localEnd": 688.12}, {"id": "c011_f000075", "text": "\"Keep out of the way until you catch sight of the Snitch,\" Wood had said. \"We don't want you attacked before you have to be.\"", "begin": 17832.715, "end": 17839.635, "localBegin": 688.12, "localEnd": 695.04}, {"id": "c011_f000076", "text": "When Angelina had scored, Harry had done a couple of loop-the-loops to let off his feelings. Now he was back to staring around for the Snitch. Once he caught sight of a flash of gold, but it was just a reflection from one of the Weasleys' wristwatches, and once a Bludger decided to come pelting his way, more like a cannonball than anything, but Harry dodged it and Fred Weasley came chasing after it.", "begin": 17839.635, "end": 17861.915, "localBegin": 695.04, "localEnd": 717.32}, {"id": "c011_f000077", "text": "\"All right there, Harry?\" he had time to yell, as he beat the Bludger furiously toward Marcus Flint.", "begin": 17861.915, "end": 17867.835, "localBegin": 717.32, "localEnd": 723.24}, {"id": "c011_f000078", "text": "\"Slytherin in possession,\" Lee Jordan was saying, \"Chaser Pucey ducks two Bludgers, two Weasleys, and Chaser Bell, and speeds toward the - wait a moment was that the Snitch?\"", "begin": 17867.835, "end": 17881.195, "localBegin": 723.24, "localEnd": 736.6}, {"id": "c011_f000079", "text": "A murmur ran through the crowd as Adrian Pucey dropped the Quaffle, too busy looking over his shoulder at the flash of gold that had passed his left ear.", "begin": 17881.195, "end": 17889.555, "localBegin": 736.6, "localEnd": 744.96}, {"id": "c011_f000080", "text": "Harry saw it. In a great rush of excitement he dived downward after the streak of gold. Slytherin Seeker Terence Higgs had seen it, too. Neck and neck they hurtled toward the Snitch - all the Chasers seemed to have forgotten what they were supposed to be doing as they hung in midair to watch.", "begin": 17889.555, "end": 17905.275, "localBegin": 744.96, "localEnd": 760.68}, {"id": "c011_f000081", "text": "Harry was faster than Higgs - he could see the little round ball, wings fluttering, darting up ahead - he put on an extra spurt of speed -", "begin": 17905.275, "end": 17912.915, "localBegin": 760.68, "localEnd": 768.32}, {"id": "c011_f000082", "text": "WHAM! A roar of rage echoed from the Gryffindors below - Marcus Flint had blocked Harry on purpose, and Harry's broom spun off course, Harry holding on for dear life.", "begin": 17912.915, "end": 17925.315, "localBegin": 768.32, "localEnd": 780.72}, {"id": "c011_f000083", "text": "\"Foul!\" screamed the Gryffindors.", "begin": 17925.315, "end": 17928.755, "localBegin": 780.72, "localEnd": 784.16}, {"id": "c011_f000084", "text": "Madam Hooch spoke angrily to Flint and then ordered a free shot at the goalposts for Gryffindor. But in all the confusion, of course, the Golden Snitch had disappeared from sight again.", "begin": 17928.755, "end": 17938.595, "localBegin": 784.16, "localEnd": 794.0}, {"id": "c011_f000085", "text": "Down in the stands, Dean Thomas was yelling, \"Send him off, ref! Red card!\"", "begin": 17938.595, "end": 17944.035, "localBegin": 794.0, "localEnd": 799.44}, {"id": "c011_f000086", "text": "\"What are you talking about, Dean?\" said Ron.", "begin": 17944.035, "end": 17947.475, "localBegin": 799.44, "localEnd": 802.88}, {"id": "c011_f000087", "text": "\"Red card!\" said Dean furiously. \"In soccer you get shown the red card and you're out of the game!\"", "begin": 17947.475, "end": 17953.795, "localBegin": 802.88, "localEnd": 809.2}, {"id": "c011_f000088", "text": "\"But this isn't soccer, Dean,\" Ron reminded him.", "begin": 17953.795, "end": 17957.635, "localBegin": 809.2, "localEnd": 813.04}, {"id": "c011_f000089", "text": "Hagrid, however, was on Dean's side.", "begin": 17957.635, "end": 17960.235, "localBegin": 813.04, "localEnd": 815.64}, {"id": "c011_f000090", "text": "\"They oughta change the rules. Flint coulda knocked Harry outta the air.\"", "begin": 17960.235, "end": 17965.475, "localBegin": 815.64, "localEnd": 820.88}, {"id": "c011_f000091", "text": "Lee Jordan was finding it difficult not to take sides.", "begin": 17965.475, "end": 17968.555, "localBegin": 820.88, "localEnd": 823.96}, {"id": "c011_f000092", "text": "\"So - after that obvious and disgusting bit of cheating - \"", "begin": 17968.555, "end": 17973.235, "localBegin": 823.96, "localEnd": 828.64}, {"id": "c011_f000093", "text": "\"Jordan!\" growled Professor McGonagall.", "begin": 17973.235, "end": 17976.355, "localBegin": 828.64, "localEnd": 831.76}, {"id": "c011_f000094", "text": "\"I mean, after that open and revolting foul - \"", "begin": 17976.355, "end": 17980.595, "localBegin": 831.76, "localEnd": 836.0}, {"id": "c011_f000095", "text": "\"Jordan, I'm warning you - \"", "begin": 17980.595, "end": 17982.915, "localBegin": 836.0, "localEnd": 838.32}, {"id": "c011_f000096", "text": "\"All right, all right. Flint nearly kills the Gryffindor Seeker, which could happen to anyone, I'm sure, so a penalty to Gryffindor, taken by Spinnet, who puts it away, no trouble, and we continue play, Gryffindor still in possession.\"", "begin": 17982.915, "end": 17999.195, "localBegin": 838.32, "localEnd": 854.6}, {"id": "c011_f000097", "text": "It was as Harry dodged another Bludger, which went spinning dangerously past his head, that it happened. His broom gave a sudden, frightening lurch. For a split second, he thought he was going to fall. He gripped the broom tightly with both his hands and knees. He'd never felt anything like that.", "begin": 17999.195, "end": 18015.435, "localBegin": 854.6, "localEnd": 870.84}, {"id": "c011_f000098", "text": "It happened again. It was as though the broom was trying to buck him off. But Nimbus Two Thousands did not suddenly decide to buck their riders off. Harry tried to turn back toward the Gryffindor goalposts - he had half a mind to ask Wood to call time-out - and then he realized that his broom was completely out of his control. He couldn't turn it. He couldn't direct it at all. It was zigzagging through the air, and every now and then making violent swishing movements that almost unseated him.", "begin": 18015.435, "end": 18042.715, "localBegin": 870.84, "localEnd": 898.12}, {"id": "c011_f000099", "text": "Lee was still commentating.", "begin": 18042.715, "end": 18045.675, "localBegin": 898.12, "localEnd": 901.08}, {"id": "c011_f000100", "text": "\"Slytherin in possession - Flint with the Quaffle - passes Spinnet - passes Bell - hit hard in the face by a Bludger, hope it broke his nose - only joking, Professor - Slytherins score - oh no . . .\"", "begin": 18045.675, "end": 18059.955, "localBegin": 901.08, "localEnd": 915.36}, {"id": "c011_f000101", "text": "The Slytherins were cheering. No one seemed to have noticed that Harry's broom was behaving strangely. It was carrying him slowly higher, away from the game, jerking and twitching as it went.", "begin": 18059.955, "end": 18071.555, "localBegin": 915.36, "localEnd": 926.96}, {"id": "c011_f000102", "text": "\"Dunno what Harry thinks he's doing,\" Hagrid mumbled. He stared through his binoculars. \"If I didn' know better, I'd say he'd lost control of his broom . . . but he can't have. . . .\"", "begin": 18071.555, "end": 18083.195, "localBegin": 926.96, "localEnd": 938.6}, {"id": "c011_f000103", "text": "Suddenly, people were pointing up at Harry all over the stands. His broom had started to roll over and over, with him only just managing to hold on. Then the whole crowd gasped. Harry's broom had given a wild jerk and Harry swung off it. He was now dangling from it, holding on with only one hand.", "begin": 18083.195, "end": 18102.315, "localBegin": 938.6, "localEnd": 957.72}, {"id": "c011_f000104", "text": "\"Did something happen to it when Flint blocked him?\" Seamus whispered.", "begin": 18102.315, "end": 18106.515, "localBegin": 957.72, "localEnd": 961.92}, {"id": "c011_f000105", "text": "\"Can't have,\" Hagrid said, his voice shaking. \"Can't nothing interfere with a broomstick except powerful Dark magic - no kid could do that to a Nimbus Two Thousand.\"", "begin": 18106.515, "end": 18117.675, "localBegin": 961.92, "localEnd": 973.08}, {"id": "c011_f000106", "text": "At these words, Hermione seized Hagrid's binoculars, but instead of looking up at Harry, she started looking frantically at the crowd.", "begin": 18117.675, "end": 18125.835, "localBegin": 973.08, "localEnd": 981.24}, {"id": "c011_f000107", "text": "\"What are you doing?\" moaned Ron, gray-faced.", "begin": 18125.835, "end": 18129.035, "localBegin": 981.24, "localEnd": 984.44}, {"id": "c011_f000108", "text": "\"I knew it,\" Hermione gasped, \"Snape - look.\"", "begin": 18129.035, "end": 18133.035, "localBegin": 984.44, "localEnd": 988.44}, {"id": "c011_f000109", "text": "Ron grabbed the binoculars. Snape was in the middle of the stands opposite them. He had his eyes fixed on Harry and was muttering nonstop under his breath.", "begin": 18133.035, "end": 18142.275, "localBegin": 988.44, "localEnd": 997.68}, {"id": "c011_f000110", "text": "\"He's doing something - jinxing the broom,\" said Hermione.", "begin": 18142.275, "end": 18146.675, "localBegin": 997.68, "localEnd": 1002.08}, {"id": "c011_f000111", "text": "\"What should we do?\"", "begin": 18146.675, "end": 18148.075, "localBegin": 1002.08, "localEnd": 1003.48}, {"id": "c011_f000112", "text": "\"Leave it to me.\"", "begin": 18148.075, "end": 18149.235, "localBegin": 1003.48, "localEnd": 1004.64}, {"id": "c011_f000113", "text": "Before Ron could say another word, Hermione had disappeared. Ron turned the binoculars back on Harry. His broom was vibrating so hard, it was almost impossible for him to hang on much longer. The whole crowd was on its feet, watching, terrified, as the Weasleys flew up to try and pull Harry safely onto one of their", "begin": 18149.235, "end": 18167.875, "localBegin": 1004.64, "localEnd": 1023.28}, {"id": "c011_f000114", "text": "brooms, but it was no good - every time they got near him, the broom would jump higher still. They dropped lower and circled beneath him, obviously hoping to catch him if he fell. Marcus Flint seized the Quaffle and scored five times without anyone noticing.", "begin": 18167.875, "end": 18184.555, "localBegin": 1023.28, "localEnd": 1039.96}, {"id": "c011_f000115", "text": "\"Come on, Hermione,\" Ron muttered desperately.", "begin": 18184.555, "end": 18188.395, "localBegin": 1039.96, "localEnd": 1043.8}, {"id": "c011_f000116", "text": "Hermione had fought her way across to the stand where Snape stood, and was now racing along the row behind him; she didn't even stop to say sorry as she knocked Professor Quirrell headfirst into the row in front. Reaching Snape, she crouched down, pulled out her wand, and whispered a few, well-chosen words. Bright blue flames shot from her wand onto the hem of Snape's robes.", "begin": 18188.395, "end": 18210.995, "localBegin": 1043.8, "localEnd": 1066.4}, {"id": "c011_f000117", "text": "It took perhaps thirty seconds for Snape to realize that he was on fire. A sudden yelp told her she had done her job. Scooping the fire off him into a little jar in her pocket, she scrambled back along the row - Snape would never know what had happened.", "begin": 18210.995, "end": 18224.755, "localBegin": 1066.4, "localEnd": 1080.16}, {"id": "c011_f000118", "text": "It was enough. Up in the air, Harry was suddenly able to clamber back on to his broom.", "begin": 18224.755, "end": 18231.475, "localBegin": 1080.16, "localEnd": 1086.88}, {"id": "c011_f000119", "text": "\"Neville, you can look!\" Ron said. Neville had been sobbing into Hagrid's jacket for the last five minutes.", "begin": 18231.475, "end": 18238.835, "localBegin": 1086.88, "localEnd": 1094.24}, {"id": "c011_f000120", "text": "Harry was speeding toward the ground when the crowd saw him clap his hand to his mouth as though he was about to be sick - he hit the field on all fours coughed - and something gold fell into his hand.", "begin": 18238.835, "end": 18250.915, "localBegin": 1094.24, "localEnd": 1106.32}, {"id": "c011_f000121", "text": "\"I've got the Snitch!\" he shouted, waving it above his head, and the game ended in complete confusion.", "begin": 18250.915, "end": 18259.555, "localBegin": 1106.32, "localEnd": 1114.96}, {"id": "c011_f000122", "text": "\"He didn't catch it, he nearly swallowed it,\" Flint was still howling twenty minutes later, but it made no difference - Harry hadn't broken any rules and Lee Jordan was still happily shouting the results - Gryffindor had won by one hundred and seventy points to sixty. Harry heard none of this, though. He was being made a cup of strong tea back in Hagrid's hut, with Ron and Hermione.", "begin": 18259.555, "end": 18285.475, "localBegin": 1114.96, "localEnd": 1140.88}, {"id": "c011_f000123", "text": "\"It was Snape,\" Ron was explaining, \"Hermione and I saw him. He was cursing your broomstick, muttering, he wouldn't take his eyes off you.\"", "begin": 18285.475, "end": 18295.995, "localBegin": 1140.88, "localEnd": 1151.4}, {"id": "c011_f000124", "text": "\"Rubbish,\" said Hagrid, who hadn't heard a word of what had gone on next to him in the stands. \"Why would Snape do somethin' like that?\"", "begin": 18295.995, "end": 18304.875, "localBegin": 1151.4, "localEnd": 1160.28}, {"id": "c011_f000125", "text": "Harry, Ron, and Hermione looked at one another, wondering what to tell him.", "begin": 18304.875, "end": 18309.595, "localBegin": 1160.28, "localEnd": 1165.0}, {"id": "c011_f000126", "text": "Harry decided on the truth.", "begin": 18309.595, "end": 18311.515, "localBegin": 1165.0, "localEnd": 1166.92}, {"id": "c011_f000127", "text": "\"I found out something about him,\" he told Hagrid. \"He tried to get past that three-headed dog on Halloween. It bit him. We think he was trying to steal whatever it's guarding.\"", "begin": 18311.515, "end": 18323.995, "localBegin": 1166.92, "localEnd": 1179.4}, {"id": "c011_f000128", "text": "Hagrid dropped the teapot.", "begin": 18323.995, "end": 18326.835, "localBegin": 1179.4, "localEnd": 1182.24}, {"id": "c011_f000129", "text": "\"How do you know about Fluffy?\" he said.", "begin": 18326.835, "end": 18332.235, "localBegin": 1182.24, "localEnd": 1187.64}, {"id": "c011_f000130", "text": "\"Fluffy?\"", "begin": 18332.235, "end": 18333.555, "localBegin": 1187.64, "localEnd": 1188.96}, {"id": "c011_f000131", "text": "\"Yeah - he's mine - bought him off a Greek chappie I met in the pub las' year - I lent him to Dumbledore to guard the - \"", "begin": 18333.555, "end": 18342.355, "localBegin": 1188.96, "localEnd": 1197.76}, {"id": "c011_f000132", "text": "\"Yes?\" said Harry eagerly.", "begin": 18342.355, "end": 18344.635, "localBegin": 1197.76, "localEnd": 1200.04}, {"id": "c011_f000133", "text": "\"Now, don't ask me anymore,\" said Hagrid gruffly. \"That's top secret, that is.\"", "begin": 18344.635, "end": 18351.315, "localBegin": 1200.04, "localEnd": 1206.72}, {"id": "c011_f000134", "text": "\"But Snape's trying to steal it.\"", "begin": 18351.315, "end": 18354.075, "localBegin": 1206.72, "localEnd": 1209.48}, {"id": "c011_f000135", "text": "\"Rubbish,\" said Hagrid again. \"Snape's a Hogwarts teacher, he'd do nothin' of the sort.\"", "begin": 18354.075, "end": 18360.475, "localBegin": 1209.48, "localEnd": 1215.88}, {"id": "c011_f000136", "text": "\"So why did he just try and kill Harry?\" cried Hermione.", "begin": 18360.475, "end": 18364.555, "localBegin": 1215.88, "localEnd": 1219.96}, {"id": "c011_f000137", "text": "The afternoon's events certainly seemed to have changed her mind about Snape.", "begin": 18364.555, "end": 18369.835, "localBegin": 1219.96, "localEnd": 1225.24}, {"id": "c011_f000138", "text": "\"I know a jinx when I see one, Hagrid, I've read all about them! You've got to keep eye contact, and Snape wasn't blinking at all, I saw him!\"", "begin": 18369.835, "end": 18380.195, "localBegin": 1225.24, "localEnd": 1235.6}, {"id": "c011_f000139", "text": "\"I'm tellin' yeh, yer wrong!\" said Hagrid hotly. \"I don' know why Harry's broom acted like that, but Snape wouldn' try an' kill a student! Now, listen to me, all three of yeh - yer meddlin' in things that don' concern yeh. It's dangerous. You forget that dog, an' you forget what it's guardin', that's between Professor Dumbledore an' Nicolas Flamel - \"", "begin": 18380.195, "end": 18405.835, "localBegin": 1235.6, "localEnd": 1261.24}, {"id": "c011_f000140", "text": "\"Aha!\" said Harry, \"so there's someone called Nicolas Flamel involved, is there?\"", "begin": 18405.835, "end": 18412.115, "localBegin": 1261.24, "localEnd": 1267.52}, {"id": "c011_f000141", "text": "Hagrid looked furious with himself.", "begin": 18412.115, "end": 18419.275, "localBegin": 1267.52, "localEnd": 1274.68}]}, {"kind": "chapter", "number": 12, "title": "The Mirror of Erised", "audio": "../Harry Potter and the Sorcerer's Stone, Book 1 (Unabridged)/012 - Harry Potter and the Sorcerer's Stone, Book 1 (Unabridged).mp3", "start": 18419.278, "end": 20557.789, "duration": 2138.511, "paragraphs": [{"id": "c012_f000001", "text": "Chapter Twelve. The Mirror of Erised.", "begin": 18419.278, "end": 18422.318, "localBegin": 0.0, "localEnd": 3.04}, {"id": "c012_f000002", "text": "Christmas was coming. One morning in mid-December, Hogwarts woke to find itself covered in several feet of snow. The lake froze solid and the Weasley twins were punished for bewitching several snowballs so that they followed Quirrell around, bouncing off the back of his turban. The few owls that managed to battle their way through the stormy sky to deliver mail had to be nursed back to health by Hagrid before they could fly off again.", "begin": 18422.318, "end": 18451.118, "localBegin": 3.04, "localEnd": 31.84}, {"id": "c012_f000003", "text": "No one could wait for the holidays to start. While the Gryffindor common room and the Great Hall had roaring fires, the drafty corridors had become icy and a bitter wind rattled the windows in the classrooms. Worst of all were Professor Snape's classes down in the dungeons, where their breath rose in a mist before them and they kept as close as possible to their hot cauldrons.", "begin": 18451.118, "end": 18472.078, "localBegin": 31.84, "localEnd": 52.8}, {"id": "c012_f000004", "text": "\"I do feel so sorry,\" said Draco Malfoy, one Potions class, \"for all those people who have to stay at Hogwarts for Christmas because they're not wanted at home.\"", "begin": 18472.078, "end": 18485.158, "localBegin": 52.8, "localEnd": 65.88}, {"id": "c012_f000005", "text": "He was looking over at Harry as he spoke. Crabbe and Goyle chuckled. Harry, who was measuring out powdered spine of lionfish, ignored them. Malfoy had been even more unpleasant than usual since the Quidditch match. Disgusted that the Slytherins had lost, he had tried to get everyone laughing at how a wide-mouthed tree frog would be replacing Harry as Seeker next. Then he'd realized that nobody found this funny, because they were all so impressed at the way Harry had managed to stay on his bucking broomstick. So Malfoy, jealous and angry, had gone back to taunting Harry about having no proper family.", "begin": 18485.158, "end": 18522.878, "localBegin": 65.88, "localEnd": 103.6}, {"id": "c012_f000006", "text": "It was true that Harry wasn't going back to Privet Drive for Christmas. Professor McGonagall had come around the week before, making a list of students who would be staying for the holidays, and Harry had signed up at once. He didn't feel sorry for himself at all; this would probably be the best Christmas he'd ever had. Ron and his brothers were staying, too, because Mr. and Mrs. Weasley were going to Romania to visit Charlie.", "begin": 18522.878, "end": 18547.318, "localBegin": 103.6, "localEnd": 128.04}, {"id": "c012_f000007", "text": "When they left the dungeons at the end of Potions, they found a large fir tree blocking the corridor ahead. Two enormous feet sticking out at the bottom and a loud puffing sound told them that Hagrid was behind it.", "begin": 18547.318, "end": 18559.318, "localBegin": 128.04, "localEnd": 140.04}, {"id": "c012_f000008", "text": "\"Hi, Hagrid, want any help?\" Ron asked, sticking his head through the branches.", "begin": 18559.318, "end": 18564.718, "localBegin": 140.04, "localEnd": 145.44}, {"id": "c012_f000009", "text": "\"Nah, I'm all right, thanks, Ron.\"", "begin": 18564.718, "end": 18567.238, "localBegin": 145.44, "localEnd": 147.96}, {"id": "c012_f000010", "text": "\"Would you mind moving out of the way?\" came Malfoy's cold drawl from behind them. \"Are you trying to earn some extra money, Weasley? Hoping to be gamekeeper yourself when you leave Hogwarts, I suppose - that hut of Hagrid's must seem like a palace compared to what your family's used to.\"", "begin": 18567.238, "end": 18588.238, "localBegin": 147.96, "localEnd": 168.96}, {"id": "c012_f000011", "text": "Ron dived at Malfoy just as Snape came up the stairs.", "begin": 18588.238, "end": 18591.398, "localBegin": 168.96, "localEnd": 172.12}, {"id": "c012_f000012", "text": "\"WEASLEY!\"", "begin": 18591.398, "end": 18593.518, "localBegin": 172.12, "localEnd": 174.24}, {"id": "c012_f000013", "text": "Ron let go of the front of Malfoy's robes.", "begin": 18593.518, "end": 18596.078, "localBegin": 174.24, "localEnd": 176.8}, {"id": "c012_f000014", "text": "\"He was provoked, Professor Snape,\" said Hagrid, sticking his huge hairy face out from behind the tree. \"Malfoy was insultin' his family.\"", "begin": 18596.078, "end": 18604.558, "localBegin": 176.8, "localEnd": 185.28}, {"id": "c012_f000015", "text": "\"Be that as it may, fighting is against Hogwarts rules, Hagrid,\" said Snape silkily. \"Five points from Gryffindor, Weasley, and be grateful it isn't more. Move along, all of you.\"", "begin": 18604.558, "end": 18619.678, "localBegin": 185.28, "localEnd": 200.4}, {"id": "c012_f000016", "text": "Malfoy, Crabbe, and Goyle pushed roughly past the tree, scattering needles everywhere and smirking.", "begin": 18619.678, "end": 18625.638, "localBegin": 200.4, "localEnd": 206.36}, {"id": "c012_f000017", "text": "\"I'll get him,\" said Ron, grinding his teeth at Malfoy's back, \"one of these days, I'll get him - \"", "begin": 18625.638, "end": 18633.598, "localBegin": 206.36, "localEnd": 214.32}, {"id": "c012_f000018", "text": "\"I hate them both,\" said Harry, \"Malfoy and Snape.\"", "begin": 18633.598, "end": 18638.118, "localBegin": 214.32, "localEnd": 218.84}, {"id": "c012_f000019", "text": "\"Come on, cheer up, it's nearly Christmas,\" said Hagrid. \"Tell yeh what, come with me an' see the Great Hall, looks a treat.\"", "begin": 18638.118, "end": 18647.598, "localBegin": 218.84, "localEnd": 228.32}, {"id": "c012_f000020", "text": "So the three of them followed Hagrid and his tree off to the Great Hall, where Professor McGonagall and Professor Flitwick were busy with the Christmas decorations.", "begin": 18647.598, "end": 18656.158, "localBegin": 228.32, "localEnd": 236.88}, {"id": "c012_f000021", "text": "\"Ah, Hagrid, the last tree - put it in the far corner, would you?\"", "begin": 18656.158, "end": 18662.318, "localBegin": 236.88, "localEnd": 243.04}, {"id": "c012_f000022", "text": "The hall looked spectacular. Festoons of holly and mistletoe hung all around the walls, and no less than twelve towering Christmas trees stood around the room, some sparkling with tiny icicles, some glittering with hundreds of candles.", "begin": 18662.318, "end": 18676.358, "localBegin": 243.04, "localEnd": 257.08}, {"id": "c012_f000023", "text": "\"How many days you got left until yer holidays?\" Hagrid asked.", "begin": 18676.358, "end": 18680.918, "localBegin": 257.08, "localEnd": 261.64}, {"id": "c012_f000024", "text": "\"Just one,\" said Hermione. \"And that reminds me - Harry, Ron, we've got half an hour before lunch, we should be in the library.\"", "begin": 18680.918, "end": 18688.598, "localBegin": 261.64, "localEnd": 269.32}, {"id": "c012_f000025", "text": "\"Oh yeah, you're right,\" said Ron, tearing his eyes away from Professor", "begin": 18688.598, "end": 18693.078, "localBegin": 269.32, "localEnd": 273.8}, {"id": "c012_f000026", "text": "Flitwick, who had golden bubbles blossoming out of his wand and was trailing them over the branches of the new tree.", "begin": 18693.078, "end": 18698.998, "localBegin": 273.8, "localEnd": 279.72}, {"id": "c012_f000027", "text": "\"The library?\" said Hagrid, following them out of the hall. \"Just before the holidays? Bit keen, aren't yeh?\"", "begin": 18698.998, "end": 18705.518, "localBegin": 279.72, "localEnd": 286.24}, {"id": "c012_f000028", "text": "\"Oh, we're not working,\" Harry told him brightly. \"Ever since you mentioned Nicolas Flamel we've been trying to find out who he is.\"", "begin": 18705.518, "end": 18712.678, "localBegin": 286.24, "localEnd": 293.4}, {"id": "c012_f000029", "text": "\"You what?\" Hagrid looked shocked. \"Listen here - I've told yeh - drop it. It's nothin' to you what that dog's guardin'.\"", "begin": 18712.678, "end": 18720.358, "localBegin": 293.4, "localEnd": 301.08}, {"id": "c012_f000030", "text": "\"We just want to know who Nicolas Flamel is, that's all,\" said Hermione.", "begin": 18720.358, "end": 18725.558, "localBegin": 301.08, "localEnd": 306.28}, {"id": "c012_f000031", "text": "\"Unless you'd like to tell us and save us the trouble?\" Harry added. \"We must've been through hundreds of books already and we can't find him anywhere just give us a hint - I know I've read his name somewhere.\"", "begin": 18725.558, "end": 18738.638, "localBegin": 306.28, "localEnd": 319.36}, {"id": "c012_f000032", "text": "\"I'm sayin' nothin',\" said Hagrid flatly.", "begin": 18738.638, "end": 18741.838, "localBegin": 319.36, "localEnd": 322.56}, {"id": "c012_f000033", "text": "\"Just have to find out for ourselves, then,\" said Ron, and they left Hagrid looking disgruntled and hurried off to the library.", "begin": 18741.838, "end": 18750.238, "localBegin": 322.56, "localEnd": 330.96}, {"id": "c012_f000034", "text": "They had indeed been searching books for Flamel's name ever since Hagrid had let it slip, because how else were they going to find out what Snape was trying to steal? The trouble was, it was very hard to know where to begin, not knowing what Flamel might have done to get himself into a book. He wasn't in Great Wizards of the Twentieth Century, or Notable Magical Names of Our Time; he was missing, too, from Important Modern Magical Discoveries, and A Study of Recent Developments in Wizardry. And then, of course, there was the sheer size of the library; tens of thousands of books; thousands of shelves; hundreds of narrow rows.", "begin": 18750.238, "end": 18789.118, "localBegin": 330.96, "localEnd": 369.84}, {"id": "c012_f000035", "text": "Hermione took out a list of subjects and titles she had decided to search while Ron strode off down a row of books and started pulling them off the shelves at random. Harry wandered over to the Restricted Section. He had been wondering for a while if Flamel wasn't somewhere in there. Unfortunately, you needed a specially signed note from one of the teachers to look in any of the restricted books, and he knew he'd never get one. These were the books containing powerful Dark Magic never taught at Hogwarts, and only read by older students studying advanced Defense Against the Dark Arts.", "begin": 18789.118, "end": 18823.798, "localBegin": 369.84, "localEnd": 404.52}, {"id": "c012_f000036", "text": "\"What are you looking for, boy?\"", "begin": 18823.798, "end": 18827.238, "localBegin": 404.52, "localEnd": 407.96}, {"id": "c012_f000037", "text": "\"Nothing,\" said Harry.", "begin": 18827.238, "end": 18830.078, "localBegin": 407.96, "localEnd": 410.8}, {"id": "c012_f000038", "text": "Madam Pince the librarian brandished a feather duster at him.", "begin": 18830.078, "end": 18833.198, "localBegin": 410.8, "localEnd": 413.92}, {"id": "c012_f000039", "text": "\"You'd better get out, then. Go on - out!\"", "begin": 18833.198, "end": 18839.398, "localBegin": 413.92, "localEnd": 420.12}, {"id": "c012_f000040", "text": "Wishing he'd been a bit quicker at thinking up some story, Harry left the library. He, Ron, and Hermione had already agreed they'd better not ask Madam Pince where they could find Flamel. They were sure she'd be able to tell them, but they couldn't risk Snape hearing what they were up to.", "begin": 18839.398, "end": 18857.238, "localBegin": 420.12, "localEnd": 437.96}, {"id": "c012_f000041", "text": "Harry waited outside in the corridor to see if the other two had found anything, but he wasn't very hopeful. They had been looking for two weeks, after all, but as they only had odd moments between lessons it wasn't surprising they'd found nothing. What they really needed was a nice long search without Madam Pince breathing down their necks.", "begin": 18857.238, "end": 18877.238, "localBegin": 437.96, "localEnd": 457.96}, {"id": "c012_f000042", "text": "Five minutes later, Ron and Hermione joined him, shaking their heads. They went off to lunch.", "begin": 18877.238, "end": 18882.638, "localBegin": 457.96, "localEnd": 463.36}, {"id": "c012_f000043", "text": "\"You will keep looking while I'm away, won't you?\" said Hermione. \"And send me an owl if you find anything.\"", "begin": 18882.638, "end": 18888.438, "localBegin": 463.36, "localEnd": 469.16}, {"id": "c012_f000044", "text": "\"And you could ask your parents if they know who Flamel is,\" said Ron. \"It'd be safe to ask them.\"", "begin": 18888.438, "end": 18895.598, "localBegin": 469.16, "localEnd": 476.32}, {"id": "c012_f000045", "text": "\"Very safe, as they're both dentists,\" said Hermione.", "begin": 18895.598, "end": 18901.958, "localBegin": 476.32, "localEnd": 482.68}, {"id": "c012_f000046", "text": "Once the holidays had started, Ron and Harry were having too good a time to think much about Flamel. They had the dormitory to themselves and the common room was far emptier than usual, so they were able to get the good armchairs by the fire. They sat by the hour eating anything they could spear on a toasting fork bread, English muffins, marshmallows - and plotting ways of getting Malfoy expelled, which were fun to talk about even if they wouldn't work.", "begin": 18901.958, "end": 18930.078, "localBegin": 482.68, "localEnd": 510.8}, {"id": "c012_f000047", "text": "Ron also started teaching Harry wizard chess. This was exactly like Muggle chess except that the figures were alive, which made it a lot like directing troops in battle. Ron's set was very old and battered. Like everything else he owned, it had once belonged to someone else in his family - in this case, his grandfather. However, old chessmen weren't a drawback at all. Ron knew them so well he never had trouble getting them to do what he wanted.", "begin": 18930.078, "end": 18957.158, "localBegin": 510.8, "localEnd": 537.88}, {"id": "c012_f000048", "text": "Harry played with chessmen Seamus Finnigan had lent him, and they didn't trust him at all. He wasn't a very good player yet and they kept shouting different bits of advice at him, which was confusing. \"Don't send me there, can't you see his knight? Send him, we can afford to lose him.\"", "begin": 18957.158, "end": 18976.598, "localBegin": 537.88, "localEnd": 557.32}, {"id": "c012_f000049", "text": "On Christmas Eve, Harry went to bed looking forward to the next day for the food and the fun, but not expecting any presents at all. When he woke early in the morning, however, the first thing he saw was a small pile of packages at the foot of his bed.", "begin": 18976.598, "end": 18990.878, "localBegin": 557.32, "localEnd": 571.6}, {"id": "c012_f000050", "text": "\"Merry Christmas,\" said Ron sleepily as Harry scrambled out of bed and pulled on his bathrobe.", "begin": 18990.878, "end": 18998.438, "localBegin": 571.6, "localEnd": 579.16}, {"id": "c012_f000051", "text": "\"You, too,\" said Harry. \"Will you look at this? I've got some presents!\"", "begin": 18998.438, "end": 19004.718, "localBegin": 579.16, "localEnd": 585.44}, {"id": "c012_f000052", "text": "\"What did you expect, turnips?\" said Ron, turning to his own pile, which was a lot bigger than Harry's.", "begin": 19004.718, "end": 19011.838, "localBegin": 585.44, "localEnd": 592.56}, {"id": "c012_f000053", "text": "Harry picked up the top parcel. It was wrapped in thick brown paper and scrawled across it was To Harry, from Hagrid. Inside was a roughly cut wooden flute. Hagrid had obviously whittled it himself. Harry blew it - it sounded a bit like an owl.", "begin": 19011.838, "end": 19029.558, "localBegin": 592.56, "localEnd": 610.28}, {"id": "c012_f000054", "text": "A second, very small parcel contained a note.", "begin": 19029.558, "end": 19033.558, "localBegin": 610.28, "localEnd": 614.28}, {"id": "c012_f000055", "text": "We received your message and enclose your Christmas present. From Uncle Vernon and Aunt Petunia. Taped to the note was a fifty-pence piece.", "begin": 19033.558, "end": 19043.198, "localBegin": 614.28, "localEnd": 623.92}, {"id": "c012_f000056", "text": "\"That's friendly,\" said Harry.", "begin": 19043.198, "end": 19046.678, "localBegin": 623.92, "localEnd": 627.4}, {"id": "c012_f000057", "text": "Ron was fascinated by the fifty pence.", "begin": 19046.678, "end": 19048.678, "localBegin": 627.4, "localEnd": 629.4}, {"id": "c012_f000058", "text": "\"Weird!\" he said, \"What a shape! This is money?\"", "begin": 19048.678, "end": 19053.478, "localBegin": 629.4, "localEnd": 634.2}, {"id": "c012_f000059", "text": "\"You can keep it,\" said Harry, laughing at how pleased Ron was. \"Hagrid and my aunt and uncle - so who sent these?\"", "begin": 19053.478, "end": 19062.478, "localBegin": 634.2, "localEnd": 643.2}, {"id": "c012_f000060", "text": "\"I think I know who that one's from,\" said Ron, turning a bit pink and pointing to a very lumpy parcel. \"My mum. I told her you didn't expect any presents and - oh, no,\" he groaned, \"she's made you a Weasley sweater.\"", "begin": 19062.478, "end": 19078.798, "localBegin": 643.2, "localEnd": 659.52}, {"id": "c012_f000061", "text": "Harry had torn open the parcel to find a thick, hand-knitted sweater in emerald green and a large box of homemade fudge.", "begin": 19078.798, "end": 19085.958, "localBegin": 659.52, "localEnd": 666.68}, {"id": "c012_f000062", "text": "\"Every year she makes us a sweater,\" said Ron, unwrapping his own, \"and mine's always maroon.\"", "begin": 19085.958, "end": 19092.918, "localBegin": 666.68, "localEnd": 673.64}, {"id": "c012_f000063", "text": "\"That's really nice of her,\" said Harry, trying the fudge, which was very tasty.", "begin": 19092.918, "end": 19099.078, "localBegin": 673.64, "localEnd": 679.8}, {"id": "c012_f000064", "text": "His next present also contained candy - a large box of Chocolate Frogs from Hermione.", "begin": 19099.078, "end": 19105.238, "localBegin": 679.8, "localEnd": 685.96}, {"id": "c012_f000065", "text": "This only left one parcel. Harry picked it up and felt it. It was very light. He unwrapped it.", "begin": 19105.238, "end": 19112.558, "localBegin": 685.96, "localEnd": 693.28}, {"id": "c012_f000066", "text": "Something fluid and silvery gray went slithering to the floor where it lay in gleaming folds. Ron gasped.", "begin": 19112.558, "end": 19120.398, "localBegin": 693.28, "localEnd": 701.12}, {"id": "c012_f000067", "text": "\"I've heard of those,\" he said in a hushed voice, dropping the box of Every Flavor Beans he'd gotten from Hermione. \"If that's what I think it is - they're really rare, and really valuable.\"", "begin": 19120.398, "end": 19134.958, "localBegin": 701.12, "localEnd": 715.68}, {"id": "c012_f000068", "text": "\"What is it?\"", "begin": 19134.958, "end": 19137.358, "localBegin": 715.68, "localEnd": 718.08}, {"id": "c012_f000069", "text": "Harry picked the shining, silvery cloth off the floor. It was strange to the touch, like water woven into material.", "begin": 19137.358, "end": 19144.598, "localBegin": 718.08, "localEnd": 725.32}, {"id": "c012_f000070", "text": "\"It's an Invisibility Cloak,\" said Ron, a look of awe on his face. \"I'm sure it is - try it on.\"", "begin": 19144.598, "end": 19152.758, "localBegin": 725.32, "localEnd": 733.48}, {"id": "c012_f000071", "text": "Harry threw the Cloak around his shoulders and Ron gave a yell.", "begin": 19152.758, "end": 19156.958, "localBegin": 733.48, "localEnd": 737.68}, {"id": "c012_f000072", "text": "\"It is! Look down!\"", "begin": 19156.958, "end": 19159.238, "localBegin": 737.68, "localEnd": 739.96}, {"id": "c012_f000073", "text": "Harry looked down at his feet, but they were gone. He dashed to the mirror. Sure enough, his reflection looked back at him, just his head suspended in midair, his body completely invisible. He pulled the Cloak over his head and his reflection vanished completely.", "begin": 19159.238, "end": 19176.838, "localBegin": 739.96, "localEnd": 757.56}, {"id": "c012_f000074", "text": "\"There's a note!\" said Ron suddenly. \"A note fell out of it!\"", "begin": 19176.838, "end": 19181.718, "localBegin": 757.56, "localEnd": 762.44}, {"id": "c012_f000075", "text": "Harry pulled off the Cloak and seized the letter. Written in narrow, loopy writing he had never seen before were the following words:", "begin": 19181.718, "end": 19190.838, "localBegin": 762.44, "localEnd": 771.56}, {"id": "c012_f000076", "text": "Your father left this in my possession before he died. It is time it", "begin": 19190.838, "end": 19195.758, "localBegin": 771.56, "localEnd": 776.48}, {"id": "c012_f000077", "text": "was returned to you.", "begin": 19195.758, "end": 19197.918, "localBegin": 776.48, "localEnd": 778.64}, {"id": "c012_f000078", "text": "Use it well.", "begin": 19197.918, "end": 19199.558, "localBegin": 778.64, "localEnd": 780.28}, {"id": "c012_f000079", "text": "A Very Merry Christmas to you", "begin": 19199.558, "end": 19201.998, "localBegin": 780.28, "localEnd": 782.72}, {"id": "c012_f000080", "text": "There was no signature. Harry stared at the note. Ron was admiring the Cloak.", "begin": 19201.998, "end": 19209.358, "localBegin": 782.72, "localEnd": 790.08}, {"id": "c012_f000081", "text": "\"I'd give anything for one of these,\" he said. \"Anything. What's the matter?\"", "begin": 19209.358, "end": 19216.078, "localBegin": 790.08, "localEnd": 796.8}, {"id": "c012_f000082", "text": "\"Nothing,\" said Harry. He felt very strange. Who had sent the Cloak? Had it really once belonged to his father?", "begin": 19216.078, "end": 19225.118, "localBegin": 796.8, "localEnd": 805.84}, {"id": "c012_f000083", "text": "Before he could say or think anything else, the dormitory door was flung open and Fred and George Weasley bounded in. Harry stuffed the Cloak quickly out of sight. He didn't feel like sharing it with anyone else yet.", "begin": 19225.118, "end": 19238.078, "localBegin": 805.84, "localEnd": 818.8}, {"id": "c012_f000084", "text": "\"Merry Christmas!\"", "begin": 19238.078, "end": 19240.438, "localBegin": 818.8, "localEnd": 821.16}, {"id": "c012_f000085", "text": "\"Hey, look - Harry's got a Weasley sweater, too!\"", "begin": 19240.438, "end": 19243.518, "localBegin": 821.16, "localEnd": 824.24}, {"id": "c012_f000086", "text": "Fred and George were wearing blue sweaters, one with a large yellow F on it, the other a G.", "begin": 19243.518, "end": 19249.958, "localBegin": 824.24, "localEnd": 830.68}, {"id": "c012_f000087", "text": "\"Harry's is better than ours, though,\" said Fred, holding up Harry's sweater. \"She obviously makes more of an effort if you're not family.\"", "begin": 19249.958, "end": 19257.518, "localBegin": 830.68, "localEnd": 838.24}, {"id": "c012_f000088", "text": "\"Why aren't you wearing yours, Ron?\" George demanded. \"Come on, get it on, they're lovely and warm.\"", "begin": 19257.518, "end": 19264.598, "localBegin": 838.24, "localEnd": 845.32}, {"id": "c012_f000089", "text": "\"I hate maroon,\" Ron moaned halfheartedly as he pulled it over his head.", "begin": 19264.598, "end": 19269.518, "localBegin": 845.32, "localEnd": 850.24}, {"id": "c012_f000090", "text": "\"You haven't got a letter on yours,\" George observed. \"I suppose she thinks you don't forget your name. But we're not stupid - we know we're called Gred and Forge.\"", "begin": 19269.518, "end": 19280.198, "localBegin": 850.24, "localEnd": 860.92}, {"id": "c012_f000091", "text": "\"What's all this noise?\"", "begin": 19280.198, "end": 19282.078, "localBegin": 860.92, "localEnd": 862.8}, {"id": "c012_f000092", "text": "Percy Weasley stuck his head through the door, looking disapproving. He had clearly gotten halfway through unwrapping his presents as he, too, carried a lumpy sweater over his arm, which Fred seized.", "begin": 19282.078, "end": 19293.238, "localBegin": 862.8, "localEnd": 873.96}, {"id": "c012_f000093", "text": "\"P for prefect! Get it on, Percy, come on, we're all wearing ours, even Harry got one.\"", "begin": 19293.238, "end": 19299.638, "localBegin": 873.96, "localEnd": 880.36}, {"id": "c012_f000094", "text": "\"I - don't - want - \" said Percy thickly, as the twins forced the sweater over his head, knocking his glasses askew.", "begin": 19299.638, "end": 19307.558, "localBegin": 880.36, "localEnd": 888.28}, {"id": "c012_f000095", "text": "\"And you're not sitting with the prefects today, either,\" said George. \"Christmas is a time for family.\"", "begin": 19307.558, "end": 19314.278, "localBegin": 888.28, "localEnd": 895.0}, {"id": "c012_f000096", "text": "They frog-marched Percy from the room, his arms pinned to his side by his sweater.", "begin": 19314.278, "end": 19319.758, "localBegin": 895.0, "localEnd": 900.48}, {"id": "c012_f000097", "text": "Harry had never in all his life had such a Christmas dinner. A hundred fat,", "begin": 19319.758, "end": 19327.158, "localBegin": 900.48, "localEnd": 907.88}, {"id": "c012_f000098", "text": "roast turkeys; mountains of roast and boiled potatoes; platters of chipolatas; tureens of buttered peas, silver boats of thick, rich gravy and cranberry sauce and stacks of wizard crackers every few feet along the table. These fantastic party favors were nothing like the feeble Muggle ones the Dursleys usually bought, with their little plastic toys and their flimsy paper hats inside. Harry pulled a wizard cracker with Fred and it didn't just bang, it went off with a blast like a cannon and engulfed them all in a cloud of blue smoke, while from the inside exploded a rear admiral's hat and several live, white mice. Up at the High Table, Dumbledore had swapped his pointed wizard's hat for a flowered bonnet, and was chuckling merrily at a joke Professor Flitwick had just read him.", "begin": 19327.158, "end": 19380.238, "localBegin": 907.88, "localEnd": 960.96}, {"id": "c012_f000099", "text": "Flaming Christmas puddings followed the turkey. Percy nearly broke his teeth on a silver Sickle embedded in his slice. Harry watched Hagrid getting redder and redder in the face as he called for more wine, finally kissing Professor McGonagall on the cheek, who, to Harry's amazement, giggled and blushed, her top hat lopsided.", "begin": 19380.238, "end": 19401.678, "localBegin": 960.96, "localEnd": 982.4}, {"id": "c012_f000100", "text": "When Harry finally left the table, he was laden down with a stack of things out of the crackers, including a pack of non-explodable, luminous balloons, a Grow- Your-Own-Warts kit, and his own new wizard chess set. The white mice had disappeared and Harry had a nasty feeling they were going to end up as Mrs. Norris's Christmas dinner.", "begin": 19401.678, "end": 19422.038, "localBegin": 982.4, "localEnd": 1002.76}, {"id": "c012_f000101", "text": "Harry and the Weasleys spent a happy afternoon having a furious snowball fight on the grounds. Then, cold, wet, and gasping for breath, they returned to the fire in the Gryffindor common room, where Harry broke in his new chess set by losing spectacularly to Ron. He suspected he wouldn't have lost so badly if Percy hadn't tried to help him so much.", "begin": 19422.038, "end": 19445.318, "localBegin": 1002.76, "localEnd": 1026.04}, {"id": "c012_f000102", "text": "After a meal of turkey sandwiches, crumpets, trifle, and Christmas cake, everyone felt too full and sleepy to do much before bed except sit and watch Percy chase Fred and George all over Gryffindor Tower because they'd stolen his prefect badge.", "begin": 19445.318, "end": 19459.478, "localBegin": 1026.04, "localEnd": 1040.2}, {"id": "c012_f000103", "text": "It had been Harry's best Christmas day ever. Yet something had been nagging at the back of his mind all day. Not until he climbed into bed was he free to think about it: the Invisibility Cloak and whoever had sent it.", "begin": 19459.478, "end": 19476.158, "localBegin": 1040.2, "localEnd": 1056.88}, {"id": "c012_f000104", "text": "Ron, full of turkey and cake and with nothing mysterious to bother him, fell asleep almost as soon as he'd drawn the curtains of his four-poster. Harry leaned over the side of his own bed and pulled the Cloak out from under it.", "begin": 19476.158, "end": 19489.238, "localBegin": 1056.88, "localEnd": 1069.96}, {"id": "c012_f000105", "text": "His father's . . . this had been his father's. He let the material flow over his hands, smoother than silk, light as air. Use it well, the note had said.", "begin": 19489.238, "end": 19505.918, "localBegin": 1069.96, "localEnd": 1086.64}, {"id": "c012_f000106", "text": "He had to try it, now. He slipped out of bed and wrapped the Cloak around himself. Looking down at his legs, he saw only moonlight and shadows. It was a very funny feeling.", "begin": 19505.918, "end": 19519.198, "localBegin": 1086.64, "localEnd": 1099.92}, {"id": "c012_f000107", "text": "Use it well.", "begin": 19519.198, "end": 19521.478, "localBegin": 1099.92, "localEnd": 1102.2}, {"id": "c012_f000108", "text": "Suddenly, Harry felt wide-awake. The whole of Hogwarts was open to him in this Cloak. Excitement flooded through him as he stood there in the dark and silence. He could go anywhere in this, anywhere, and Filch would never know.", "begin": 19521.478, "end": 19540.478, "localBegin": 1102.2, "localEnd": 1121.2}, {"id": "c012_f000109", "text": "Ron grunted in his sleep. Should Harry wake him? Something held him back - his father's Cloak - he felt that this time - the first time - he wanted to use it alone.", "begin": 19540.478, "end": 19553.998, "localBegin": 1121.2, "localEnd": 1134.72}, {"id": "c012_f000110", "text": "He crept out of the dormitory, down the stairs, across the common room, and climbed through the portrait hole.", "begin": 19553.998, "end": 19560.678, "localBegin": 1134.72, "localEnd": 1141.4}, {"id": "c012_f000111", "text": "\"Who's there?\" squawked the Fat Lady. Harry said nothing. He walked quickly down the corridor.", "begin": 19560.678, "end": 19568.038, "localBegin": 1141.4, "localEnd": 1148.76}, {"id": "c012_f000112", "text": "Where should he go? He stopped, his heart racing, and thought. And then it came to him. The Restricted Section in the library. He'd be able to read as long as he liked, as long as it took to find out who Flamel was. He set off, drawing the Invisibility Cloak tight around him as he walked.", "begin": 19568.038, "end": 19587.678, "localBegin": 1148.76, "localEnd": 1168.4}, {"id": "c012_f000113", "text": "The library was pitch-black and very eerie. Harry lit a lamp to see his way along the rows of books. The lamp looked as if it was floating along in midair, and even though Harry could feel his arm supporting it, the sight gave him the creeps.", "begin": 19587.678, "end": 19603.118, "localBegin": 1168.4, "localEnd": 1183.84}, {"id": "c012_f000114", "text": "The Restricted Section was right at the back of the library. Stepping carefully over the rope that separated these books from the rest of the library, he held up his lamp to read the titles.", "begin": 19603.118, "end": 19613.958, "localBegin": 1183.84, "localEnd": 1194.68}, {"id": "c012_f000115", "text": "They didn't tell him much. Their peeling, faded gold letters spelled words in languages Harry couldn't understand. Some had no title at all. One book had a dark stain on it that looked horribly like blood. The hairs on the back of Harry's neck prickled. Maybe he was imagining it, maybe not, but he thought a faint whispering was coming from the books, as though they knew someone was there who shouldn't be.", "begin": 19613.958, "end": 19641.678, "localBegin": 1194.68, "localEnd": 1222.4}, {"id": "c012_f000116", "text": "He had to start somewhere. Setting the lamp down carefully on the floor, he looked along the bottom shelf for an interesting-looking book. A large black and silver volume caught his eye. He pulled it out with difficulty, because it was very heavy, and, balancing it on his knee, let it fall open.", "begin": 19641.678, "end": 19660.838, "localBegin": 1222.4, "localEnd": 1241.56}, {"id": "c012_f000117", "text": "A piercing, bloodcurdling shriek split the silence - the book was screaming! Harry snapped it shut, but the shriek went on and on, one high, unbroken, earsplitting note. He stumbled backward and knocked over his lamp, which went out at once. Panicking, he heard footsteps coming down the corridor outside - stuffing the shrieking book back on the shelf, he ran for it. He passed Filch in the doorway; Filch's pale, wild eyes looked straight through him, and Harry slipped under Filch's outstretched arm and streaked off up the corridor, the book's shrieks still ringing in his ears.", "begin": 19660.838, "end": 19697.518, "localBegin": 1241.56, "localEnd": 1278.24}, {"id": "c012_f000118", "text": "He came to a sudden halt in front of a tall suit of armor. He had been so busy getting away from the library, he hadn't paid attention to where he was going. Perhaps because it was dark, he didn't recognize where he was at all. There was a suit of armor near the kitchens, he knew, but he must be five floors above there.", "begin": 19697.518, "end": 19716.878, "localBegin": 1278.24, "localEnd": 1297.6}, {"id": "c012_f000119", "text": "\"You asked me to come directly to you, Professor, if anyone was wandering around at night, and somebody's been in the library - Restricted Section.\"", "begin": 19716.878, "end": 19726.438, "localBegin": 1297.6, "localEnd": 1307.16}, {"id": "c012_f000120", "text": "Harry felt the blood drain out of his face. Wherever he was, Filch must know a shortcut, because his soft, greasy voice was getting nearer, and to his horror, it was Snape who replied, \"The Restricted Section? Well, they can't be far, we'll catch them.\"", "begin": 19726.438, "end": 19744.758, "localBegin": 1307.16, "localEnd": 1325.48}, {"id": "c012_f000121", "text": "Harry stood rooted to the spot as Filch and Snape came around the corner ahead. They couldn't see him, of course, but it was a narrow corridor and if they came much nearer they'd knock right into him - the Cloak didn't stop him from being solid.", "begin": 19744.758, "end": 19759.598, "localBegin": 1325.48, "localEnd": 1340.32}, {"id": "c012_f000122", "text": "He backed away as quietly as he could. A door stood ajar to his left. It was his only hope. He squeezed through it, holding his breath, trying not to move it, and to his relief he managed to get inside the room without their noticing anything. They walked straight past, and Harry leaned against the wall, breathing deeply, listening to their footsteps dying away. That had been close, very close. It was a few seconds before he noticed anything about the room he had hidden in.", "begin": 19759.598, "end": 19790.998, "localBegin": 1340.32, "localEnd": 1371.72}, {"id": "c012_f000123", "text": "It looked like an unused classroom. The dark shapes of desks and chairs were piled against the walls, and there was an upturned wastepaper basket - but propped against the wall facing him was something that didn't look as if it belonged there, something that looked as if someone had just put it there to keep it out of the way.", "begin": 19790.998, "end": 19811.398, "localBegin": 1371.72, "localEnd": 1392.12}, {"id": "c012_f000124", "text": "It was a magnificent mirror, as high as the ceiling, with an ornate gold frame, standing on two clawed feet. There was an inscription carved around the top: Erised stra ehru oyt ube cafru oyt on wohsi.", "begin": 19811.398, "end": 19830.158, "localBegin": 1392.12, "localEnd": 1410.88}, {"id": "c012_f000125", "text": "His panic fading now that there was no sound of Filch and Snape, Harry moved nearer to the mirror, wanting to look at himself but see no reflection again. He stepped in front of it.", "begin": 19830.158, "end": 19842.438, "localBegin": 1410.88, "localEnd": 1423.16}, {"id": "c012_f000126", "text": "He had to clap his hands to his mouth to stop himself from screaming. He whirled around. His heart was pounding far more furiously than when the book had screamed - for he had seen not only himself in the mirror, but a whole crowd of people standing right behind him.", "begin": 19842.438, "end": 19860.238, "localBegin": 1423.16, "localEnd": 1440.96}, {"id": "c012_f000127", "text": "But the room was empty. Breathing very fast, he turned slowly back to the mirror.", "begin": 19860.238, "end": 19865.998, "localBegin": 1440.96, "localEnd": 1446.72}, {"id": "c012_f000128", "text": "There he was, reflected in it, white and scared-looking, and there, reflected behind him, were at least ten others. Harry looked over his shoulder - but still, no one was there. Or were they all invisible, too? Was he in fact in a room full of invisible people and this mirror's trick was that it reflected them, invisible or not?", "begin": 19865.998, "end": 19892.638, "localBegin": 1446.72, "localEnd": 1473.36}, {"id": "c012_f000129", "text": "He looked in the mirror again. A woman standing right behind his reflection was smiling at him and waving. He reached out a hand and felt the air behind him. If she was really there, he'd touch her, their reflections were so close together, but he felt only air - she and the others existed only in the mirror.", "begin": 19892.638, "end": 19914.798, "localBegin": 1473.36, "localEnd": 1495.52}, {"id": "c012_f000130", "text": "She was a very pretty woman. She had dark red hair and her eyes - her eyes are just like mine, Harry thought, edging a little closer to the glass. Bright green exactly the same shape, but then he noticed that she was crying; smiling, but crying at the same time. The tall, thin, black-haired man standing next to her put his arm around her. He wore glasses, and his hair was very untidy. It stuck up at the back, just as Harry's did.", "begin": 19914.798, "end": 19950.838, "localBegin": 1495.52, "localEnd": 1531.56}, {"id": "c012_f000131", "text": "Harry was so close to the mirror now that his nose was nearly touching that of his reflection.", "begin": 19950.838, "end": 19957.758, "localBegin": 1531.56, "localEnd": 1538.48}, {"id": "c012_f000132", "text": "\"Mum?\" he whispered. \"Dad?\"", "begin": 19957.758, "end": 19965.398, "localBegin": 1538.48, "localEnd": 1546.12}, {"id": "c012_f000133", "text": "They just looked at him, smiling. And slowly, Harry looked into the faces of the other people in the mirror, and saw other pairs of green eyes like his, other noses like his, even a little old man who looked as though he had Harry's knobbly knees - Harry was looking at his family, for the first time in his life.", "begin": 19965.398, "end": 19991.518, "localBegin": 1546.12, "localEnd": 1572.24}, {"id": "c012_f000134", "text": "The Potters smiled and waved at Harry and he stared hungrily back at them, his hands pressed flat against the glass as though he was hoping to fall right through it and reach them. He had a powerful kind of ache inside him, half joy, half", "begin": 19991.518, "end": 20008.238, "localBegin": 1572.24, "localEnd": 1588.96}, {"id": "c012_f000135", "text": "terrible sadness.", "begin": 20008.238, "end": 20009.478, "localBegin": 1588.96, "localEnd": 1590.2}, {"id": "c012_f000136", "text": "How long he stood there, he didn't know. The reflections did not fade and he looked and looked until a distant noise brought him back to his senses. He couldn't stay here, he had to find his way back to bed. He tore his eyes away from his mother's face, whispered, \"I'll come back,\" and hurried from the room.", "begin": 20009.478, "end": 20033.038, "localBegin": 1590.2, "localEnd": 1613.76}, {"id": "c012_f000137", "text": "\"You could have woken me up,\" said Ron, crossly.", "begin": 20033.038, "end": 20038.358, "localBegin": 1613.76, "localEnd": 1619.08}, {"id": "c012_f000138", "text": "\"You can come tonight, I'm going back, I want to show you the mirror.\"", "begin": 20038.358, "end": 20042.398, "localBegin": 1619.08, "localEnd": 1623.12}, {"id": "c012_f000139", "text": "\"I'd like to see your mum and dad,\" Ron said eagerly.", "begin": 20042.398, "end": 20046.878, "localBegin": 1623.12, "localEnd": 1627.6}, {"id": "c012_f000140", "text": "\"And I want to see all your family, all the Weasleys, you'll be able to show me your other brothers and everyone.\"", "begin": 20046.878, "end": 20053.198, "localBegin": 1627.6, "localEnd": 1633.92}, {"id": "c012_f000141", "text": "\"You can see them any old time,\" said Ron. \"Just come round my house this summer. Anyway, maybe it only shows dead people. Shame about not finding Flamel, though. Have some bacon or something, why aren't you eating anything?\"", "begin": 20053.198, "end": 20067.678, "localBegin": 1633.92, "localEnd": 1648.4}, {"id": "c012_f000142", "text": "Harry couldn't eat. He had seen his parents and would be seeing them again tonight. He had almost forgotten about Flamel. It didn't seem very important anymore. Who cared what the three-headed dog was guarding? What did it matter if Snape stole it, really?", "begin": 20067.678, "end": 20084.558, "localBegin": 1648.4, "localEnd": 1665.28}, {"id": "c012_f000143", "text": "\"Are you all right?\" said Ron. \"You look odd.\"", "begin": 20084.558, "end": 20088.238, "localBegin": 1665.28, "localEnd": 1668.96}, {"id": "c012_f000144", "text": "What Harry feared most was that he might not be able to find the mirror room again. With Ron covered in the Cloak, too, they had to walk much more slowly the next night. They tried retracing Harry's route from the library, wandering around the dark passageways for nearly an hour.", "begin": 20088.238, "end": 20105.398, "localBegin": 1668.96, "localEnd": 1686.12}, {"id": "c012_f000145", "text": "\"I'm freezing,\" said Ron. \"Let's forget it and go back.\"", "begin": 20105.398, "end": 20109.678, "localBegin": 1686.12, "localEnd": 1690.4}, {"id": "c012_f000146", "text": "\"No!\" Harry hissed. \"I know it's here somewhere.\"", "begin": 20109.678, "end": 20113.758, "localBegin": 1690.4, "localEnd": 1694.48}, {"id": "c012_f000147", "text": "They passed the ghost of a tall witch gliding in the opposite direction, but saw no one else. Just as Ron started moaning that his feet were dead with cold, Harry spotted the suit of armor.", "begin": 20113.758, "end": 20125.678, "localBegin": 1694.48, "localEnd": 1706.4}, {"id": "c012_f000148", "text": "\"It's here - just here - yes!\"", "begin": 20125.678, "end": 20129.678, "localBegin": 1706.4, "localEnd": 1710.4}, {"id": "c012_f000149", "text": "They pushed the door open. Harry dropped the Cloak from around his shoulders and ran to the mirror.", "begin": 20129.678, "end": 20135.958, "localBegin": 1710.4, "localEnd": 1716.68}, {"id": "c012_f000150", "text": "There they were. His mother and father beamed at the sight of him.", "begin": 20135.958, "end": 20141.398, "localBegin": 1716.68, "localEnd": 1722.12}, {"id": "c012_f000151", "text": "\"See?\" Harry whispered.", "begin": 20141.398, "end": 20144.438, "localBegin": 1722.12, "localEnd": 1725.16}, {"id": "c012_f000152", "text": "\"I can't see anything.\"", "begin": 20144.438, "end": 20146.518, "localBegin": 1725.16, "localEnd": 1727.24}, {"id": "c012_f000153", "text": "\"Look! Look at them all . . . there are loads of them. . . .\"", "begin": 20146.518, "end": 20150.478, "localBegin": 1727.24, "localEnd": 1731.2}, {"id": "c012_f000154", "text": "\"I can only see you.\"", "begin": 20150.478, "end": 20152.798, "localBegin": 1731.2, "localEnd": 1733.52}, {"id": "c012_f000155", "text": "\"Look in it properly, go on, stand where I am.\"", "begin": 20152.798, "end": 20156.878, "localBegin": 1733.52, "localEnd": 1737.6}, {"id": "c012_f000156", "text": "Harry stepped aside, but with Ron in front of the mirror, he couldn't see his family anymore, just Ron in his paisley pajamas.", "begin": 20156.878, "end": 20165.118, "localBegin": 1737.6, "localEnd": 1745.84}, {"id": "c012_f000157", "text": "Ron, though, was staring transfixed at his image.", "begin": 20165.118, "end": 20168.638, "localBegin": 1745.84, "localEnd": 1749.36}, {"id": "c012_f000158", "text": "\"Look at me!\" he said.", "begin": 20168.638, "end": 20171.958, "localBegin": 1749.36, "localEnd": 1752.68}, {"id": "c012_f000159", "text": "\"Can you see all your family standing around you?\"", "begin": 20171.958, "end": 20174.798, "localBegin": 1752.68, "localEnd": 1755.52}, {"id": "c012_f000160", "text": "\"No - I'm alone - but I'm different - I look older - and I'm Head Boy!\"", "begin": 20174.798, "end": 20182.598, "localBegin": 1755.52, "localEnd": 1763.32}, {"id": "c012_f000161", "text": "\"What?\"", "begin": 20182.598, "end": 20183.638, "localBegin": 1763.32, "localEnd": 1764.36}, {"id": "c012_f000162", "text": "\"I am - I'm wearing the badge like Bill used to - and I'm holding the House Cup and the Quidditch Cup - I'm Quidditch captain, too!\"", "begin": 20183.638, "end": 20193.278, "localBegin": 1764.36, "localEnd": 1774.0}, {"id": "c012_f000163", "text": "Ron tore his eyes away from this splendid sight to look excitedly at Harry.", "begin": 20193.278, "end": 20198.198, "localBegin": 1774.0, "localEnd": 1778.92}, {"id": "c012_f000164", "text": "\"Do you think this mirror shows the future?\"", "begin": 20198.198, "end": 20200.718, "localBegin": 1778.92, "localEnd": 1781.44}, {"id": "c012_f000165", "text": "\"How can it? All my family are dead - let me have another look - \"", "begin": 20200.718, "end": 20205.838, "localBegin": 1781.44, "localEnd": 1786.56}, {"id": "c012_f000166", "text": "\"You had it to yourself all last night, give me a bit more time.\"", "begin": 20205.838, "end": 20209.318, "localBegin": 1786.56, "localEnd": 1790.04}, {"id": "c012_f000167", "text": "\"You're only holding the Quidditch Cup, what's interesting about that? I want to see my parents.\"", "begin": 20209.318, "end": 20214.478, "localBegin": 1790.04, "localEnd": 1795.2}, {"id": "c012_f000168", "text": "\"Don't push me - \"", "begin": 20214.478, "end": 20215.438, "localBegin": 1795.2, "localEnd": 1796.16}, {"id": "c012_f000169", "text": "A sudden noise outside in the corridor put an end to their discussion. They hadn't realized how loudly they had been talking.", "begin": 20215.438, "end": 20222.358, "localBegin": 1796.16, "localEnd": 1803.08}, {"id": "c012_f000170", "text": "\"Quick!\"", "begin": 20222.358, "end": 20223.358, "localBegin": 1803.08, "localEnd": 1804.08}, {"id": "c012_f000171", "text": "Ron threw the Cloak back over them as the luminous eyes of Mrs. Norris came", "begin": 20223.358, "end": 20228.278, "localBegin": 1804.08, "localEnd": 1809.0}, {"id": "c012_f000172", "text": "round the door. Ron and Harry stood quite still, both thinking the same thing - did the Cloak work on cats? After what seemed an age, she turned and left.", "begin": 20228.278, "end": 20240.118, "localBegin": 1809.0, "localEnd": 1820.84}, {"id": "c012_f000173", "text": "\"This isn't safe - she might have gone for Filch, I bet she heard us. Come on.\"", "begin": 20240.118, "end": 20247.998, "localBegin": 1820.84, "localEnd": 1828.72}, {"id": "c012_f000174", "text": "And Ron pulled Harry out of the room.", "begin": 20247.998, "end": 20250.998, "localBegin": 1828.72, "localEnd": 1831.72}, {"id": "c012_f000175", "text": "The snow still hadn't melted the next morning.", "begin": 20250.998, "end": 20256.518, "localBegin": 1831.72, "localEnd": 1837.24}, {"id": "c012_f000176", "text": "\"Want to play chess, Harry?\" said Ron.", "begin": 20256.518, "end": 20259.238, "localBegin": 1837.24, "localEnd": 1839.96}, {"id": "c012_f000177", "text": "\"No.\"", "begin": 20259.238, "end": 20259.998, "localBegin": 1839.96, "localEnd": 1840.72}, {"id": "c012_f000178", "text": "\"Why don't we go down and visit Hagrid?\"", "begin": 20259.998, "end": 20262.678, "localBegin": 1840.72, "localEnd": 1843.4}, {"id": "c012_f000179", "text": "\"No . . . you go . . .\"", "begin": 20262.678, "end": 20264.798, "localBegin": 1843.4, "localEnd": 1845.52}, {"id": "c012_f000180", "text": "\"I know what you're thinking about, Harry, that mirror. Don't go back tonight.\"", "begin": 20264.798, "end": 20270.118, "localBegin": 1845.52, "localEnd": 1850.84}, {"id": "c012_f000181", "text": "\"Why not?\"", "begin": 20270.118, "end": 20270.998, "localBegin": 1850.84, "localEnd": 1851.72}, {"id": "c012_f000182", "text": "\"I dunno, I've just got a bad feeling about it - and anyway, you've had too many close shaves already. Filch, Snape, and Mrs. Norris are wandering around. So what if they can't see you? What if they walk into you? What if you knock something over?\"", "begin": 20270.998, "end": 20286.518, "localBegin": 1851.72, "localEnd": 1867.24}, {"id": "c012_f000183", "text": "\"You sound like Hermione.\"", "begin": 20286.518, "end": 20288.598, "localBegin": 1867.24, "localEnd": 1869.32}, {"id": "c012_f000184", "text": "\"I'm serious, Harry, don't go.\"", "begin": 20288.598, "end": 20290.958, "localBegin": 1869.32, "localEnd": 1871.68}, {"id": "c012_f000185", "text": "But Harry only had one thought in his head, which was to get back in front of the mirror, and Ron wasn't going to stop him.", "begin": 20290.958, "end": 20298.798, "localBegin": 1871.68, "localEnd": 1879.52}, {"id": "c012_f000186", "text": "That third night he found his way more quickly than before. He was walking so fast he knew he was making more noise than was wise, but he didn't meet anyone.", "begin": 20298.798, "end": 20309.758, "localBegin": 1879.52, "localEnd": 1890.48}, {"id": "c012_f000187", "text": "And there were his mother and father smiling at him again, and one of his grandfathers nodding happily. Harry sank down to sit on the floor in front of the mirror. There was nothing to stop him from staying here all night with his family. Nothing at all.", "begin": 20309.758, "end": 20327.038, "localBegin": 1890.48, "localEnd": 1907.76}, {"id": "c012_f000188", "text": "Except -", "begin": 20327.038, "end": 20328.678, "localBegin": 1907.76, "localEnd": 1909.4}, {"id": "c012_f000189", "text": "\"So - back again, Harry?\"", "begin": 20328.678, "end": 20332.918, "localBegin": 1909.4, "localEnd": 1913.64}, {"id": "c012_f000190", "text": "Harry felt as though his insides had turned to ice. He looked behind him. Sitting on one of the desks by the wall was none other than Albus Dumbledore. Harry must have walked straight past him, so desperate to get to the mirror he hadn't noticed him.", "begin": 20332.918, "end": 20349.638, "localBegin": 1913.64, "localEnd": 1930.36}, {"id": "c012_f000191", "text": "\"I - I didn't see you, sir.\"", "begin": 20349.638, "end": 20352.758, "localBegin": 1930.36, "localEnd": 1933.48}, {"id": "c012_f000192", "text": "\"Strange how nearsighted being invisible can make you,\" said Dumbledore, and Harry was relieved to see that he was smiling.", "begin": 20352.758, "end": 20361.638, "localBegin": 1933.48, "localEnd": 1942.36}, {"id": "c012_f000193", "text": "\"So,\" said Dumbledore, slipping off the desk to sit on the floor with Harry, \"you, like hundreds before you, have discovered the delights of the Mirror of Erised.\"", "begin": 20361.638, "end": 20374.478, "localBegin": 1942.36, "localEnd": 1955.2}, {"id": "c012_f000194", "text": "\"I didn't know it was called that, sir.\"", "begin": 20374.478, "end": 20377.038, "localBegin": 1955.2, "localEnd": 1957.76}, {"id": "c012_f000195", "text": "\"But I expect you've realized by now what it does?\"", "begin": 20377.038, "end": 20381.518, "localBegin": 1957.76, "localEnd": 1962.24}, {"id": "c012_f000196", "text": "\"It - well - it shows me my family - \"", "begin": 20381.518, "end": 20386.798, "localBegin": 1962.24, "localEnd": 1967.52}, {"id": "c012_f000197", "text": "\"And it showed your friend Ron himself as Head Boy.\"", "begin": 20386.798, "end": 20390.958, "localBegin": 1967.52, "localEnd": 1971.68}, {"id": "c012_f000198", "text": "\"How did you know - ?\"", "begin": 20390.958, "end": 20392.798, "localBegin": 1971.68, "localEnd": 1973.52}, {"id": "c012_f000199", "text": "\"I don't need a cloak to become invisible,\" said Dumbledore gently. \"Now, can you think what the Mirror of Erised shows us all?\"", "begin": 20392.798, "end": 20403.278, "localBegin": 1973.52, "localEnd": 1984.0}, {"id": "c012_f000200", "text": "Harry shook his head.", "begin": 20403.278, "end": 20405.118, "localBegin": 1984.0, "localEnd": 1985.84}, {"id": "c012_f000201", "text": "\"Let me explain. The happiest man on earth would be able to use the Mirror of Erised like a normal mirror, that is, he would look into it and see himself exactly as he is. Does that help?\"", "begin": 20405.118, "end": 20420.478, "localBegin": 1985.84, "localEnd": 2001.2}, {"id": "c012_f000202", "text": "Harry thought. Then he said slowly, \"It shows us what we want . . . whatever we want . . .\"", "begin": 20420.478, "end": 20427.958, "localBegin": 2001.2, "localEnd": 2008.68}, {"id": "c012_f000203", "text": "\"Yes and no,\" said Dumbledore quietly. \"It shows us nothing more or less than the deepest, most desperate desire of our hearts. You, who have never known your family, see them standing around you. Ronald Weasley, who has always been overshadowed by his brothers, sees himself standing alone, the best of all of them. However, this mirror will give us neither knowledge or truth. Men have wasted away before it, entranced by what they have seen, or been driven mad, not knowing if what it shows is real or even possible.", "begin": 20427.958, "end": 20470.318, "localBegin": 2008.68, "localEnd": 2051.04}, {"id": "c012_f000204", "text": "\"The Mirror will be moved to a new home tomorrow, Harry, and I ask you not to go looking for it again. If you ever do run across it, you will now be prepared. It does not do to dwell on dreams and forget to live, remember that. Now, why don't you put that admirable Cloak back on and get off to bed?\"", "begin": 20470.318, "end": 20496.398, "localBegin": 2051.04, "localEnd": 2077.12}, {"id": "c012_f000205", "text": "Harry stood up.", "begin": 20496.398, "end": 20498.158, "localBegin": 2077.12, "localEnd": 2078.88}, {"id": "c012_f000206", "text": "\"Sir - Professor Dumbledore? Can I ask you something?\"", "begin": 20498.158, "end": 20502.558, "localBegin": 2078.88, "localEnd": 2083.28}, {"id": "c012_f000207", "text": "\"Obviously, you've just done so,\" Dumbledore smiled. \"You may ask me one more thing, however.\"", "begin": 20502.558, "end": 20510.638, "localBegin": 2083.28, "localEnd": 2091.36}, {"id": "c012_f000208", "text": "\"What do you see when you look in the mirror?\"", "begin": 20510.638, "end": 20515.278, "localBegin": 2091.36, "localEnd": 2096.0}, {"id": "c012_f000209", "text": "\"I? I see myself holding a pair of thick, woolen socks.\"", "begin": 20515.278, "end": 20524.518, "localBegin": 2096.0, "localEnd": 2105.24}, {"id": "c012_f000210", "text": "Harry stared.", "begin": 20524.518, "end": 20526.838, "localBegin": 2105.24, "localEnd": 2107.56}, {"id": "c012_f000211", "text": "\"One can never have enough socks,\" said Dumbledore. \"Another Christmas has come and gone and I didn't get a single pair. People will insist on giving me books.\"", "begin": 20526.838, "end": 20541.438, "localBegin": 2107.56, "localEnd": 2122.16}, {"id": "c012_f000212", "text": "It was only when he was back in bed that it struck Harry that Dumbledore might not have been quite truthful. But then, he thought, as he shoved Scabbers off his pillow, it had been quite a personal question.", "begin": 20541.438, "end": 20557.758, "localBegin": 2122.16, "localEnd": 2138.48}]}, {"kind": "chapter", "number": 13, "title": "Nicolas Flamel", "audio": "../Harry Potter a
