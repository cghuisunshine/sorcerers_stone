.6, "localEnd": 536.56}, {"id": "c006_f000060", "text": "Smoke from the engine drifted over the heads of the chattering crowd, while cats of every color wound here and there between their legs. Owls hooted to one another in a disgruntled sort of way over the babble and the scraping of heavy trunks.", "begin": 9154.323, "end": 9168.123, "localBegin": 536.56, "localEnd": 550.36}, {"id": "c006_f000061", "text": "The first few carriages were already packed with students, some hanging out of the window to talk to their families, some fighting over seats. Harry pushed his cart off down the platform in search of an empty seat. He passed a round-faced boy who was saying, \"Gran, I've lost my toad again.\"", "begin": 9168.123, "end": 9185.003, "localBegin": 550.36, "localEnd": 567.24}, {"id": "c006_f000062", "text": "\"Oh, Neville,\" he heard the old woman sigh.", "begin": 9185.003, "end": 9189.443, "localBegin": 567.24, "localEnd": 571.68}, {"id": "c006_f000063", "text": "A boy with dreadlocks was surrounded by a small crowd.", "begin": 9189.443, "end": 9192.243, "localBegin": 571.68, "localEnd": 574.48}, {"id": "c006_f000064", "text": "\"Give us a look, Lee, go on.\"", "begin": 9192.243, "end": 9194.883, "localBegin": 574.48, "localEnd": 577.12}, {"id": "c006_f000065", "text": "The boy lifted the lid of a box in his arms, and the people around him shrieked and yelled as something inside poked out a long, hairy leg.", "begin": 9194.883, "end": 9204.443, "localBegin": 577.12, "localEnd": 586.68}, {"id": "c006_f000066", "text": "Harry pressed on through the crowd until he found an empty compartment near the end of the train. He put Hedwig inside first and then started to shove and heave his trunk toward the train door. He tried to lift it up the steps but could hardly raise one end and twice he dropped it painfully on his foot.", "begin": 9204.443, "end": 9221.603, "localBegin": 586.68, "localEnd": 603.84}, {"id": "c006_f000067", "text": "\"Want a hand?\" It was one of the red-haired twins he'd followed through the barrier.", "begin": 9221.603, "end": 9226.843, "localBegin": 603.84, "localEnd": 609.08}, {"id": "c006_f000068", "text": "\"Yes, please,\" Harry panted.", "begin": 9226.843, "end": 9229.603, "localBegin": 609.08, "localEnd": 611.84}, {"id": "c006_f000069", "text": "\"Oy, Fred! C'mere and help!\"", "begin": 9229.603, "end": 9232.803, "localBegin": 611.84, "localEnd": 615.04}, {"id": "c006_f000070", "text": "With the twins' help, Harry's trunk was at last tucked away in a corner of the compartment.", "begin": 9232.803, "end": 9236.803, "localBegin": 615.04, "localEnd": 619.04}, {"id": "c006_f000071", "text": "\"Thanks,\" said Harry, pushing his sweaty hair out of his eyes.", "begin": 9236.803, "end": 9240.723, "localBegin": 619.04, "localEnd": 622.96}, {"id": "c006_f000072", "text": "\"What's that?\" said one of the twins suddenly, pointing at Harry's lightning scar.", "begin": 9240.723, "end": 9246.963, "localBegin": 622.96, "localEnd": 629.2}, {"id": "c006_f000073", "text": "\"Blimey,\" said the other twin. \"Are you - ?\"", "begin": 9246.963, "end": 9251.163, "localBegin": 629.2, "localEnd": 633.4}, {"id": "c006_f000074", "text": "\"He is,\" said the first twin. \"Aren't you?\" he added to Harry.", "begin": 9251.163, "end": 9256.203, "localBegin": 633.4, "localEnd": 638.44}, {"id": "c006_f000075", "text": "\"What?\" said Harry.", "begin": 9256.203, "end": 9258.043, "localBegin": 638.44, "localEnd": 640.28}, {"id": "c006_f000076", "text": "\"Harry Potter,\" chorused the twins.", "begin": 9258.043, "end": 9260.763, "localBegin": 640.28, "localEnd": 643.0}, {"id": "c006_f000077", "text": "\"Oh, him,\" said Harry. \"I mean, yes, I am.\"", "begin": 9260.763, "end": 9266.163, "localBegin": 643.0, "localEnd": 648.4}, {"id": "c006_f000078", "text": "The two boys gawked at him, and Harry felt himself turning red. Then, to his relief, a voice came floating in through the train's open door.", "begin": 9266.163, "end": 9273.523, "localBegin": 648.4, "localEnd": 655.76}, {"id": "c006_f000079", "text": "\"Fred? George? Are you there?\"", "begin": 9273.523, "end": 9275.843, "localBegin": 655.76, "localEnd": 658.08}, {"id": "c006_f000080", "text": "\"Coming, Mum.\"", "begin": 9275.843, "end": 9278.323, "localBegin": 658.08, "localEnd": 660.56}, {"id": "c006_f000081", "text": "With a last look at Harry, the twins hopped off the train.", "begin": 9278.323, "end": 9280.803, "localBegin": 660.56, "localEnd": 663.04}, {"id": "c006_f000082", "text": "Harry sat down next to the window where, half hidden, he could watch the redhaired family on the platform and hear what they were saying. Their mother had just taken out her handkerchief.", "begin": 9280.803, "end": 9290.963, "localBegin": 663.04, "localEnd": 673.2}, {"id": "c006_f000083", "text": "\"Ron, you've got something on your nose.\"", "begin": 9290.963, "end": 9294.923, "localBegin": 673.2, "localEnd": 677.16}, {"id": "c006_f000084", "text": "The youngest boy tried to jerk out of the way, but she grabbed him and began rubbing the end of his nose.", "begin": 9294.923, "end": 9300.323, "localBegin": 677.16, "localEnd": 682.56}, {"id": "c006_f000085", "text": "\"Mum - geroff.\" He wriggled free.", "begin": 9300.323, "end": 9303.563, "localBegin": 682.56, "localEnd": 685.8}, {"id": "c006_f000086", "text": "\"Aaah, has ickle Ronnie got somefink on his nosie?\" said one of the twins.", "begin": 9303.563, "end": 9309.723, "localBegin": 685.8, "localEnd": 691.96}, {"id": "c006_f000087", "text": "\"Shut up,\" said Ron.", "begin": 9309.723, "end": 9311.323, "localBegin": 691.96, "localEnd": 693.56}, {"id": "c006_f000088", "text": "\"Where's Percy?\" said their mother.", "begin": 9311.323, "end": 9313.723, "localBegin": 693.56, "localEnd": 695.96}, {"id": "c006_f000089", "text": "\"He's coming now.\"", "begin": 9313.723, "end": 9315.963, "localBegin": 695.96, "localEnd": 698.2}, {"id": "c006_f000090", "text": "The oldest boy came striding into sight. He had already changed into his billowing black Hogwarts robes, and Harry noticed a shiny red-and-gold badge on his chest with the letter P on it.", "begin": 9315.963, "end": 9326.683, "localBegin": 698.2, "localEnd": 708.92}, {"id": "c006_f000091", "text": "\"Can't stay long, Mother,\" he said. \"I'm up front, the prefects have got two compartments to themselves - \"", "begin": 9326.683, "end": 9333.723, "localBegin": 708.92, "localEnd": 715.96}, {"id": "c006_f000092", "text": "\"Oh, are you a prefect, Percy?\" said one of the twins, with an air of great surprise. \"You should have said something, we had no idea.\"", "begin": 9333.723, "end": 9343.243, "localBegin": 715.96, "localEnd": 725.48}, {"id": "c006_f000093", "text": "\"Hang on, I think I remember him saying something about it,\" said the other twin. \"Once - \"", "begin": 9343.243, "end": 9349.163, "localBegin": 725.48, "localEnd": 731.4}, {"id": "c006_f000094", "text": "\"Or twice - \"", "begin": 9349.163, "end": 9350.003, "localBegin": 731.4, "localEnd": 732.24}, {"id": "c006_f000095", "text": "\"A minute - \"", "begin": 9350.003, "end": 9350.523, "localBegin": 732.24, "localEnd": 732.76}, {"id": "c006_f000096", "text": "\"All summer - \"", "begin": 9350.523, "end": 9351.323, "localBegin": 732.76, "localEnd": 733.56}, {"id": "c006_f000097", "text": "\"Oh, shut up,\" said Percy the Prefect.", "begin": 9351.323, "end": 9353.483, "localBegin": 733.56, "localEnd": 735.72}, {"id": "c006_f000098", "text": "\"How come Percy gets new robes, anyway?\" said one of the twins.", "begin": 9353.483, "end": 9358.083, "localBegin": 735.72, "localEnd": 740.32}, {"id": "c006_f000099", "text": "\"Because he's a prefect,\" said their mother fondly. \"All right, dear, well, have a good term - send me an owl when you get there.\"", "begin": 9358.083, "end": 9367.443, "localBegin": 740.32, "localEnd": 749.68}, {"id": "c006_f000100", "text": "She kissed Percy on the cheek and he left. Then she turned to the twins.", "begin": 9367.443, "end": 9372.683, "localBegin": 749.68, "localEnd": 754.92}, {"id": "c006_f000101", "text": "\"Now, you two - this year, you behave yourselves. If I get one more owl telling me you've - you've blown up a toilet or - \"", "begin": 9372.683, "end": 9383.203, "localBegin": 754.92, "localEnd": 765.44}, {"id": "c006_f000102", "text": "\"Blown up a toilet? We've never blown up a toilet.\"", "begin": 9383.203, "end": 9386.643, "localBegin": 765.44, "localEnd": 768.88}, {"id": "c006_f000103", "text": "\"Great idea though, thanks, Mum.\"", "begin": 9386.643, "end": 9388.603, "localBegin": 768.88, "localEnd": 770.84}, {"id": "c006_f000104", "text": "\"It's not funny. And look after Ron.\"", "begin": 9388.603, "end": 9392.283, "localBegin": 770.84, "localEnd": 774.52}, {"id": "c006_f000105", "text": "\"Don't worry, ickle Ronniekins is safe with us.\"", "begin": 9392.283, "end": 9396.243, "localBegin": 774.52, "localEnd": 778.48}, {"id": "c006_f000106", "text": "\"Shut up,\" said Ron again. He was almost as tall as the twins already and his nose was still pink where his mother had rubbed it.", "begin": 9396.243, "end": 9403.963, "localBegin": 778.48, "localEnd": 786.2}, {"id": "c006_f000107", "text": "\"Hey, Mum, guess what? Guess who we just met on the train?\"", "begin": 9403.963, "end": 9408.563, "localBegin": 786.2, "localEnd": 790.8}, {"id": "c006_f000108", "text": "Harry leaned back quickly so they couldn't see him looking.", "begin": 9408.563, "end": 9411.763, "localBegin": 790.8, "localEnd": 794.0}, {"id": "c006_f000109", "text": "\"You know that black-haired boy who was near us in the station? Know who he is?\"", "begin": 9411.763, "end": 9417.043, "localBegin": 794.0, "localEnd": 799.28}, {"id": "c006_f000110", "text": "\"Who?\"", "begin": 9417.043, "end": 9418.043, "localBegin": 799.28, "localEnd": 800.28}, {"id": "c006_f000111", "text": "\"Harry Potter!\"", "begin": 9418.043, "end": 9419.603, "localBegin": 800.28, "localEnd": 801.84}, {"id": "c006_f000112", "text": "Harry heard the little girl's voice.", "begin": 9419.603, "end": 9422.163, "localBegin": 801.84, "localEnd": 804.4}, {"id": "c006_f000113", "text": "\"Oh, Mum, can I go on the train and see him, Mum, oh please. . . .\"", "begin": 9422.163, "end": 9428.163, "localBegin": 804.4, "localEnd": 810.4}, {"id": "c006_f000114", "text": "\"You've already seen him, Ginny, and the poor boy isn't something you goggle at in a zoo. Is he really, Fred? How do you know?\"", "begin": 9428.163, "end": 9437.963, "localBegin": 810.4, "localEnd": 820.2}, {"id": "c006_f000115", "text": "\"Asked him. Saw his scar. It's really there - like lightning.\"", "begin": 9437.963, "end": 9443.083, "localBegin": 820.2, "localEnd": 825.32}, {"id": "c006_f000116", "text": "\"Poor dear - no wonder he was alone, I wondered. He was ever so polite when he asked how to get onto the platform.\"", "begin": 9443.083, "end": 9451.843, "localBegin": 825.32, "localEnd": 834.08}, {"id": "c006_f000117", "text": "\"Never mind that, do you think he remembers what You-Know-Who looks like?\"", "begin": 9451.843, "end": 9456.363, "localBegin": 834.08, "localEnd": 838.6}, {"id": "c006_f000118", "text": "Their mother suddenly became very stern.", "begin": 9456.363, "end": 9459.523, "localBegin": 838.6, "localEnd": 841.76}, {"id": "c006_f000119", "text": "\"I forbid you to ask him, Fred. No, don't you dare. As though he needs reminding of that on his first day at school.\"", "begin": 9459.523, "end": 9466.683, "localBegin": 841.76, "localEnd": 848.92}, {"id": "c006_f000120", "text": "\"All right, keep your hair on.\"", "begin": 9466.683, "end": 9470.243, "localBegin": 848.92, "localEnd": 852.48}, {"id": "c006_f000121", "text": "A whistle sounded.", "begin": 9470.243, "end": 9471.083, "localBegin": 852.48, "localEnd": 853.32}, {"id": "c006_f000122", "text": "\"Hurry up!\" their mother said, and the three boys clambered onto the train. They leaned out of the window for her to kiss them good-bye, and their younger sister began to cry.", "begin": 9471.083, "end": 9480.043, "localBegin": 853.32, "localEnd": 862.28}, {"id": "c006_f000123", "text": "\"Don't, Ginny, we'll send you loads of owls.\"", "begin": 9480.043, "end": 9484.203, "localBegin": 862.28, "localEnd": 866.44}, {"id": "c006_f000124", "text": "\"We'll send you a Hogwarts toilet seat.\"", "begin": 9484.203, "end": 9487.003, "localBegin": 866.44, "localEnd": 869.24}, {"id": "c006_f000125", "text": "\"George!\"", "begin": 9487.003, "end": 9487.443, "localBegin": 869.24, "localEnd": 869.68}, {"id": "c006_f000126", "text": "\"Only joking, Mum.\"", "begin": 9487.443, "end": 9489.163, "localBegin": 869.68, "localEnd": 871.4}, {"id": "c006_f000127", "text": "The train began to move. Harry saw the boys' mother waving and their sister, half laughing, half crying, running to keep up with the train until it gathered too much speed, then she fell back and waved.", "begin": 9489.163, "end": 9502.123, "localBegin": 871.4, "localEnd": 884.36}, {"id": "c006_f000128", "text": "Harry watched the girl and her mother disappear as the train rounded the corner. Houses flashed past the window. Harry felt a great leap of excitement. He didn't know what he was going to - but it had to be better than what he was leaving behind.", "begin": 9502.123, "end": 9517.403, "localBegin": 884.36, "localEnd": 899.64}, {"id": "c006_f000129", "text": "The door of the compartment slid open and the youngest redheaded boy came in.", "begin": 9517.403, "end": 9522.523, "localBegin": 899.64, "localEnd": 904.76}, {"id": "c006_f000130", "text": "\"Anyone sitting there?\" he asked, pointing at the seat opposite Harry. \"Everywhere else is full.\"", "begin": 9522.523, "end": 9529.243, "localBegin": 904.76, "localEnd": 911.48}, {"id": "c006_f000131", "text": "Harry shook his head and the boy sat down. He glanced at Harry and then looked quickly out of the window, pretending he hadn't looked. Harry saw he still had a black mark on his nose.", "begin": 9529.243, "end": 9540.763, "localBegin": 911.48, "localEnd": 923.0}, {"id": "c006_f000132", "text": "\"Hey, Ron.\"", "begin": 9540.763, "end": 9542.283, "localBegin": 923.0, "localEnd": 924.52}, {"id": "c006_f000133", "text": "The twins were back.", "begin": 9542.283, "end": 9543.363, "localBegin": 924.52, "localEnd": 925.6}, {"id": "c006_f000134", "text": "\"Listen, we're going down the middle of the train - Lee Jordan's got a giant tarantula down there.\"", "begin": 9543.363, "end": 9548.243, "localBegin": 925.6, "localEnd": 930.48}, {"id": "c006_f000135", "text": "\"Right,\" mumbled Ron.", "begin": 9548.243, "end": 9550.283, "localBegin": 930.48, "localEnd": 932.52}, {"id": "c006_f000136", "text": "\"Harry,\" said the other twin, \"did we introduce ourselves? Fred and George Weasley. And this is Ron, our brother. See you later, then.\"", "begin": 9550.283, "end": 9558.643, "localBegin": 932.52, "localEnd": 940.88}, {"id": "c006_f000137", "text": "\"Bye,\" said Harry and Ron. The twins slid the compartment door shut behind them.", "begin": 9558.643, "end": 9564.363, "localBegin": 940.88, "localEnd": 946.6}, {"id": "c006_f000138", "text": "\"Are you really Harry Potter?\" Ron blurted out.", "begin": 9564.363, "end": 9567.963, "localBegin": 946.6, "localEnd": 950.2}, {"id": "c006_f000139", "text": "Harry nodded.", "begin": 9567.963, "end": 9569.363, "localBegin": 950.2, "localEnd": 951.6}, {"id": "c006_f000140", "text": "\"Oh - well, I thought it might be one of Fred and George's jokes,\" said Ron. \"And have you really got - you know . . .\"", "begin": 9569.363, "end": 9578.043, "localBegin": 951.6, "localEnd": 960.28}, {"id": "c006_f000141", "text": "He pointed at Harry's forehead.", "begin": 9578.043, "end": 9580.083, "localBegin": 960.28, "localEnd": 962.32}, {"id": "c006_f000142", "text": "Harry pulled back his bangs to show the lightning scar. Ron stared.", "begin": 9580.083, "end": 9585.403, "localBegin": 962.32, "localEnd": 967.64}, {"id": "c006_f000143", "text": "\"So that's where You-Know-Who - ?\"", "begin": 9585.403, "end": 9588.803, "localBegin": 967.64, "localEnd": 971.04}, {"id": "c006_f000144", "text": "\"Yes,\" said Harry, \"but I can't remember it.\"", "begin": 9588.803, "end": 9592.043, "localBegin": 971.04, "localEnd": 974.28}, {"id": "c006_f000145", "text": "\"Nothing?\" said Ron eagerly.", "begin": 9592.043, "end": 9594.603, "localBegin": 974.28, "localEnd": 976.84}, {"id": "c006_f000146", "text": "\"Well - I remember a lot of green light, but nothing else.\"", "begin": 9594.603, "end": 9598.923, "localBegin": 976.84, "localEnd": 981.16}, {"id": "c006_f000147", "text": "\"Wow,\" said Ron. He sat and stared at Harry for a few moments, then, as though he had suddenly realized what he was doing, he looked quickly out of the window again.", "begin": 9598.923, "end": 9609.243, "localBegin": 981.16, "localEnd": 991.48}, {"id": "c006_f000148", "text": "\"Are all your family wizards?\" asked Harry, who found Ron just as interesting as Ron found him.", "begin": 9609.243, "end": 9615.763, "localBegin": 991.48, "localEnd": 998.0}, {"id": "c006_f000149", "text": "\"Er - yes, I think so,\" said Ron. \"I think Mum's got a second cousin who's an accountant, but we never talk about him.\"", "begin": 9615.763, "end": 9624.083, "localBegin": 998.0, "localEnd": 1006.32}, {"id": "c006_f000150", "text": "\"So you must know loads of magic already.\"", "begin": 9624.083, "end": 9627.363, "localBegin": 1006.32, "localEnd": 1009.6}, {"id": "c006_f000151", "text": "The Weasleys were clearly one of those old wizarding families the pale boy in Diagon Alley had talked about.", "begin": 9627.363, "end": 9634.043, "localBegin": 1009.6, "localEnd": 1016.28}, {"id": "c006_f000152", "text": "\"I heard you went to live with Muggles,\" said Ron. \"What are they like?\"", "begin": 9634.043, "end": 9639.563, "localBegin": 1016.28, "localEnd": 1021.8}, {"id": "c006_f000153", "text": "\"Horrible - well, not all of them. My aunt and uncle and cousin are, though. Wish I'd had three wizard brothers.\"", "begin": 9639.563, "end": 9647.763, "localBegin": 1021.8, "localEnd": 1030.0}, {"id": "c006_f000154", "text": "\"Five,\" said Ron. For some reason, he was looking gloomy. \"I'm the sixth in our family to go to Hogwarts. You could say I've got a lot to live up to. Bill and Charlie have already left - Bill was head boy and Charlie was captain of Quidditch. Now Percy's a prefect. Fred and George mess around a lot, but they still get really good marks and everyone thinks they're really funny. Everyone expects me to do as well as the others, but if I do, it's no big deal, because they did it first. You never get anything new, either, with five brothers. I've got Bill's old robes, Charlie's old wand, and Percy's old rat.\"", "begin": 9647.763, "end": 9688.803, "localBegin": 1030.0, "localEnd": 1071.04}, {"id": "c006_f000155", "text": "Ron reached inside his jacket and pulled out a fat gray rat, which was asleep.", "begin": 9688.803, "end": 9693.883, "localBegin": 1071.04, "localEnd": 1076.12}, {"id": "c006_f000156", "text": "\"His name's Scabbers and he's useless, he hardly ever wakes up. Percy got an owl from my dad for being made a prefect, but they couldn't aff - I mean, I got Scabbers instead.\"", "begin": 9693.883, "end": 9707.083, "localBegin": 1076.12, "localEnd": 1089.32}, {"id": "c006_f000157", "text": "Ron's ears went pink. He seemed to think he'd said too much, because he went back to staring out of the window.", "begin": 9707.083, "end": 9714.243, "localBegin": 1089.32, "localEnd": 1096.48}, {"id": "c006_f000158", "text": "Harry didn't think there was anything wrong with not being able to afford an owl. After all, he'd never had any money in his life until a month ago, and he told Ron so, all about having to wear Dudley's old clothes and never getting proper birthday presents. This seemed to cheer Ron up.", "begin": 9714.243, "end": 9731.043, "localBegin": 1096.48, "localEnd": 1113.28}, {"id": "c006_f000159", "text": "\". . . and until Hagrid told me, I didn't know anything about being a wizard or about my parents or Voldemort - \"", "begin": 9731.043, "end": 9738.123, "localBegin": 1113.28, "localEnd": 1120.36}, {"id": "c006_f000160", "text": "Ron gasped.", "begin": 9738.123, "end": 9739.403, "localBegin": 1120.36, "localEnd": 1121.64}, {"id": "c006_f000161", "text": "\"What?\" said Harry.", "begin": 9739.403, "end": 9741.243, "localBegin": 1121.64, "localEnd": 1123.48}, {"id": "c006_f000162", "text": "\"You said You-Know-Who's name!\" said Ron, sounding both shocked and impressed. \"I'd have thought you, of all people - \"", "begin": 9741.243, "end": 9750.803, "localBegin": 1123.48, "localEnd": 1133.04}, {"id": "c006_f000163", "text": "\"I'm not trying to be brave or anything, saying the name,\" said Harry, \"I just never knew you shouldn't. See what I mean? I've got loads to learn. . . . I bet,\" he added, voicing for the first time something that had been worrying him a lot lately, \"I bet I'm the worst in the class.\"", "begin": 9750.803, "end": 9769.283, "localBegin": 1133.04, "localEnd": 1151.52}, {"id": "c006_f000164", "text": "\"You won't be. There's loads of people who come from Muggle families and they learn quick enough.\"", "begin": 9769.283, "end": 9776.403, "localBegin": 1151.52, "localEnd": 1158.64}, {"id": "c006_f000165", "text": "While they had been talking, the train had carried them out of London. Now they were speeding past fields full of cows and sheep. They were quiet for a time, watching the fields and lanes flick past.", "begin": 9776.403, "end": 9789.283, "localBegin": 1158.64, "localEnd": 1171.52}, {"id": "c006_f000166", "text": "Around half past twelve there was a great clattering outside in the corridor and a smiling, dimpled woman slid back their door and said, \"Anything off the cart, dears?\"", "begin": 9789.283, "end": 9800.043, "localBegin": 1171.52, "localEnd": 1182.28}, {"id": "c006_f000167", "text": "Harry, who hadn't had any breakfast, leapt to his feet, but Ron's ears went pink again and he muttered that he'd brought sandwiches. Harry went out into the corridor.", "begin": 9800.043, "end": 9810.163, "localBegin": 1182.28, "localEnd": 1192.4}, {"id": "c006_f000168", "text": "He had never had any money for candy with the Dursleys, and now that he had pockets rattling with gold and silver he was ready to buy as many Mars Bars as he could carry - but the woman didn't have Mars Bars. What she did have were Bertie Bott's Every Flavor Beans, Drooble's Best Blowing Gum, Chocolate Frogs, Pumpkin Pasties, Cauldron Cakes, Licorice Wands, and a number of other strange things Harry had never seen in his life. Not wanting to miss anything, he got some of everything and paid the woman eleven silver Sickles and seven bronze Knuts.", "begin": 9810.163, "end": 9844.683, "localBegin": 1192.4, "localEnd": 1226.92}, {"id": "c006_f000169", "text": "Ron stared as Harry brought it all back in to the compartment and tipped it onto an empty seat.", "begin": 9844.683, "end": 9850.243, "localBegin": 1226.92, "localEnd": 1232.48}, {"id": "c006_f000170", "text": "\"Hungry, are you?\"", "begin": 9850.243, "end": 9852.123, "localBegin": 1232.48, "localEnd": 1234.36}, {"id": "c006_f000171", "text": "\"Starving,\" said Harry, taking a large bite out of a pumpkin pasty.", "begin": 9852.123, "end": 9857.123, "localBegin": 1234.36, "localEnd": 1239.36}, {"id": "c006_f000172", "text": "Ron had taken out a lumpy package and unwrapped it. There were four sandwiches inside. He pulled one of them apart and said, \"She always forgets I don't like corned beef.\"", "begin": 9857.123, "end": 9868.083, "localBegin": 1239.36, "localEnd": 1250.32}, {"id": "c006_f000173", "text": "\"Swap you for one of these,\" said Harry, holding up a pasty. \"Go on - \"", "begin": 9868.083, "end": 9873.163, "localBegin": 1250.32, "localEnd": 1255.4}, {"id": "c006_f000174", "text": "\"You don't want this, it's all dry,\" said Ron. \"She hasn't got much time,\" he added quickly, \"you know, with five of us.\"", "begin": 9873.163, "end": 9880.923, "localBegin": 1255.4, "localEnd": 1263.16}, {"id": "c006_f000175", "text": "\"Go on, have a pasty,\" said Harry, who had never had anything to share before or, indeed, anyone to share it with. It was a nice feeling, sitting there with Ron, eating their way through all Harry's pasties, cakes, and candies (the sandwiches lay forgotten).", "begin": 9880.923, "end": 9898.643, "localBegin": 1263.16, "localEnd": 1280.88}, {"id": "c006_f000176", "text": "\"What are these?\" Harry asked Ron, holding up a pack of Chocolate Frogs. \"They're not really frogs, are they?\" He was starting to feel that nothing would surprise him.", "begin": 9898.643, "end": 9909.883, "localBegin": 1280.88, "localEnd": 1292.12}, {"id": "c006_f000177", "text": "\"No,\" said Ron. \"But see what the card is. I'm missing Agrippa.\"", "begin": 9909.883, "end": 9914.923, "localBegin": 1292.12, "localEnd": 1297.16}, {"id": "c006_f000178", "text": "\"What?\"", "begin": 9914.923, "end": 9915.803, "localBegin": 1297.16, "localEnd": 1298.04}, {"id": "c006_f000179", "text": "\"Oh, of course, you wouldn't know - Chocolate Frogs have cards inside them, you know, to collect - famous witches and wizards. I've got about five hundred, but I haven't got Agrippa or Ptolemy.\"", "begin": 9915.803, "end": 9928.403, "localBegin": 1298.04, "localEnd": 1310.64}, {"id": "c006_f000180", "text": "Harry unwrapped his Chocolate Frog and picked up the card. It showed a man's face. He wore half-moon glasses, had a long, crooked nose, and flowing silver hair, beard, and mustache. Underneath the picture was the name Albus Dumbledore.", "begin": 9928.403, "end": 9945.883, "localBegin": 1310.64, "localEnd": 1328.12}, {"id": "c006_f000181", "text": "\"So this is Dumbledore!\" said Harry.", "begin": 9945.883, "end": 9950.923, "localBegin": 1328.12, "localEnd": 1333.16}, {"id": "c006_f000182", "text": "\"Don't tell me you'd never heard of Dumbledore!\" said Ron. \"Can I have a frog? I might get Agrippa - thanks - \"", "begin": 9950.923, "end": 9958.243, "localBegin": 1333.16, "localEnd": 1340.48}, {"id": "c006_f000183", "text": "Harry turned over his card and read:", "begin": 9958.243, "end": 9961.123, "localBegin": 1340.48, "localEnd": 1343.36}, {"id": "c006_f000184", "text": "ALBUS DUMBLEDORE", "begin": 9961.123, "end": 9962.923, "localBegin": 1343.36, "localEnd": 1345.16}, {"id": "c006_f000185", "text": "CURRENTLY HEADMASTER OF HOGWARTS", "begin": 9962.923, "end": 9965.403, "localBegin": 1345.16, "localEnd": 1347.64}, {"id": "c006_f000186", "text": "Considered by many the greatest wizard of modern times, Dumbledore is", "begin": 9965.403, "end": 9970.243, "localBegin": 1347.64, "localEnd": 1352.48}, {"id": "c006_f000187", "text": "particularly famous for his defeat of the Dark wizard Grindelwald in 1945,", "begin": 9970.243, "end": 9975.723, "localBegin": 1352.48, "localEnd": 1357.96}, {"id": "c006_f000188", "text": "for the discovery of the twelve uses of dragon's blood, and his work on", "begin": 9975.723, "end": 9980.523, "localBegin": 1357.96, "localEnd": 1362.76}, {"id": "c006_f000189", "text": "alchemy with his partner, Nicolas Flamel. Professor Dumbledore enjoys", "begin": 9980.523, "end": 9985.683, "localBegin": 1362.76, "localEnd": 1367.92}, {"id": "c006_f000190", "text": "chamber music and tenpin bowling.", "begin": 9985.683, "end": 9987.963, "localBegin": 1367.92, "localEnd": 1370.2}, {"id": "c006_f000191", "text": "Harry turned the card back over and saw, to his astonishment, that Dumbledore's face had disappeared.", "begin": 9987.963, "end": 9995.043, "localBegin": 1370.2, "localEnd": 1377.28}, {"id": "c006_f000192", "text": "\"He's gone!\"", "begin": 9995.043, "end": 9997.003, "localBegin": 1377.28, "localEnd": 1379.24}, {"id": "c006_f000193", "text": "\"Well, you can't expect him to hang around all day,\" said Ron. \"He'll be back. No, I've got Morgana again and I've got about six of her . . . do you want it? You can start collecting.\"", "begin": 9997.003, "end": 10009.483, "localBegin": 1379.24, "localEnd": 1391.72}, {"id": "c006_f000194", "text": "Ron's eyes strayed to the pile of Chocolate Frogs waiting to be unwrapped.", "begin": 10009.483, "end": 10014.363, "localBegin": 1391.72, "localEnd": 1396.6}, {"id": "c006_f000195", "text": "\"Help yourself,\" said Harry. \"But in, you know, the Muggle world, people just stay put in photos.\"", "begin": 10014.363, "end": 10021.563, "localBegin": 1396.6, "localEnd": 1403.8}, {"id": "c006_f000196", "text": "\"Do they? What, they don't move at all?\" Ron sounded amazed. \"Weird!\"", "begin": 10021.563, "end": 10028.763, "localBegin": 1403.8, "localEnd": 1411.0}, {"id": "c006_f000197", "text": "Harry stared as Dumbledore sidled back into the picture on his card and gave him a small smile. Ron was more interested in eating the frogs than looking at the Famous Witches and Wizards cards, but Harry couldn't keep his eyes off them. Soon he had not only Dumbledore and Morgana, but Hengist of Woodcroft, Alberic Grunnion, Circe, Paracelsus, and Merlin. He finally tore his eyes away from the druidess Cliodna, who was scratching her nose, to open a bag of Bertie Bott's Every Flavor Beans.", "begin": 10028.763, "end": 10062.843, "localBegin": 1411.0, "localEnd": 1445.08}, {"id": "c006_f000198", "text": "\"You want to be careful with those,\" Ron warned Harry. \"When they say every flavor, they mean every flavor - you know, you get all the ordinary ones like chocolate and peppermint and marmalade, but then you can get spinach and liver and tripe. George reckons he had a booger-flavored one once.\"", "begin": 10062.843, "end": 10081.283, "localBegin": 1445.08, "localEnd": 1463.52}, {"id": "c006_f000199", "text": "Ron picked up a green bean, looked at it carefully, and bit into a corner.", "begin": 10081.283, "end": 10086.243, "localBegin": 1463.52, "localEnd": 1468.48}, {"id": "c006_f000200", "text": "\"Bleaaargh - see? Sprouts.\"", "begin": 10086.243, "end": 10089.563, "localBegin": 1468.48, "localEnd": 1471.8}, {"id": "c006_f000201", "text": "They had a good time eating the Every Flavor Beans. Harry got toast, coconut, baked bean, strawberry, curry, grass, coffee, sardine, and was even brave enough to nibble the end off a funny gray one Ron wouldn't touch, which turned out to be pepper.", "begin": 10089.563, "end": 10104.883, "localBegin": 1471.8, "localEnd": 1487.12}, {"id": "c006_f000202", "text": "The countryside now flying past the window was becoming wilder. The neat fields had gone. Now there were woods, twisting rivers, and dark green hills.", "begin": 10104.883, "end": 10114.563, "localBegin": 1487.12, "localEnd": 1496.8}, {"id": "c006_f000203", "text": "There was a knock on the door of their compartment and the round-faced boy Harry had passed on platform nine and three-quarters came in. He looked tearful.", "begin": 10114.563, "end": 10121.843, "localBegin": 1496.8, "localEnd": 1504.08}, {"id": "c006_f000204", "text": "\"Sorry,\" he said, \"but have you seen a toad at all?\"", "begin": 10121.843, "end": 10125.963, "localBegin": 1504.08, "localEnd": 1508.2}, {"id": "c006_f000205", "text": "When they shook their heads, he wailed, \"I've lost him! He keeps getting away", "begin": 10125.963, "end": 10130.923, "localBegin": 1508.2, "localEnd": 1513.16}, {"id": "c006_f000206", "text": "from me!\"", "begin": 10130.923, "end": 10131.603, "localBegin": 1513.16, "localEnd": 1513.84}, {"id": "c006_f000207", "text": "\"He'll turn up,\" said Harry.", "begin": 10131.603, "end": 10134.203, "localBegin": 1513.84, "localEnd": 1516.44}, {"id": "c006_f000208", "text": "\"Yes,\" said the boy miserably. \"Well, if you see him . . .\"", "begin": 10134.203, "end": 10138.563, "localBegin": 1516.44, "localEnd": 1520.8}, {"id": "c006_f000209", "text": "He left.", "begin": 10138.563, "end": 10139.603, "localBegin": 1520.8, "localEnd": 1521.84}, {"id": "c006_f000210", "text": "\"Don't know why he's so bothered,\" said Ron. \"If I'd brought a toad I'd lose it as quick as I could. Mind you, I brought Scabbers, so I can't talk.\"", "begin": 10139.603, "end": 10148.603, "localBegin": 1521.84, "localEnd": 1530.84}, {"id": "c006_f000211", "text": "The rat was still snoozing on Ron's lap.", "begin": 10148.603, "end": 10151.723, "localBegin": 1530.84, "localEnd": 1533.96}, {"id": "c006_f000212", "text": "\"He might have died and you wouldn't know the difference,\" said Ron in disgust. \"I tried to turn him yellow yesterday to make him more interesting, but the spell didn't work. I'll show you, look . . .\"", "begin": 10151.723, "end": 10162.443, "localBegin": 1533.96, "localEnd": 1544.68}, {"id": "c006_f000213", "text": "He rummaged around in his trunk and pulled out a very battered-looking wand. It was chipped in places and something white was glinting at the end.", "begin": 10162.443, "end": 10170.483, "localBegin": 1544.68, "localEnd": 1552.72}, {"id": "c006_f000214", "text": "\"Unicorn hair's nearly poking out. Anyway - \"", "begin": 10170.483, "end": 10173.843, "localBegin": 1552.72, "localEnd": 1556.08}, {"id": "c006_f000215", "text": "He had just raised his wand when the compartment door slid open again. The toadless boy was back, but this time he had a girl with him. She was already wearing her new Hogwarts robes.", "begin": 10173.843, "end": 10184.363, "localBegin": 1556.08, "localEnd": 1566.6}, {"id": "c006_f000216", "text": "\"Has anyone seen a toad? Neville's lost one,\" she said. She had a bossy sort of voice, lots of bushy brown hair, and rather large front teeth.", "begin": 10184.363, "end": 10193.323, "localBegin": 1566.6, "localEnd": 1575.56}, {"id": "c006_f000217", "text": "\"We've already told him we haven't seen it,\" said Ron, but the girl wasn't listening, she was looking at the wand in his hand.", "begin": 10193.323, "end": 10200.483, "localBegin": 1575.56, "localEnd": 1582.72}, {"id": "c006_f000218", "text": "\"Oh, are you doing magic? Let's see it, then.\"", "begin": 10200.483, "end": 10204.403, "localBegin": 1582.72, "localEnd": 1586.64}, {"id": "c006_f000219", "text": "She sat down. Ron looked taken aback.", "begin": 10204.403, "end": 10207.363, "localBegin": 1586.64, "localEnd": 1589.6}, {"id": "c006_f000220", "text": "\"Er - all right.\"", "begin": 10207.363, "end": 10209.163, "localBegin": 1589.6, "localEnd": 1591.4}, {"id": "c006_f000221", "text": "He cleared his throat.", "begin": 10209.163, "end": 10210.883, "localBegin": 1591.4, "localEnd": 1593.12}, {"id": "c006_f000222", "text": "\"Sunshine, daisies, butter mellow,", "begin": 10210.883, "end": 10214.443, "localBegin": 1593.12, "localEnd": 1596.68}, {"id": "c006_f000223", "text": "Turn this stupid, fat rat yellow.\"", "begin": 10214.443, "end": 10217.483, "localBegin": 1596.68, "localEnd": 1599.72}, {"id": "c006_f000224", "text": "He waved his wand, but nothing happened. Scabbers stayed gray and fast asleep.", "begin": 10217.483, "end": 10223.443, "localBegin": 1599.72, "localEnd": 1605.68}, {"id": "c006_f000225", "text": "\"Are you sure that's a real spell?\" said the girl. \"Well, it's not very good, is it? I've tried a few simple spells just for practice and it's all worked for me. Nobody in my family's magic at all, it was ever such a surprise when I got my letter, but I was ever so pleased, of course, I mean, it's the very best school of witchcraft there is, I've heard - I've learned all our course books by heart, of course, I just hope it will be enough - I'm Hermione Granger, by the way, who are you?\"", "begin": 10223.443, "end": 10249.323, "localBegin": 1605.68, "localEnd": 1631.56}, {"id": "c006_f000226", "text": "She said all this very fast.", "begin": 10249.323, "end": 10251.923, "localBegin": 1631.56, "localEnd": 1634.16}, {"id": "c006_f000227", "text": "Harry looked at Ron, and was relieved to see by his stunned face that he hadn't learned all the course books by heart either.", "begin": 10251.923, "end": 10259.043, "localBegin": 1634.16, "localEnd": 1641.28}, {"id": "c006_f000228", "text": "\"I'm Ron Weasley,\" Ron muttered.", "begin": 10259.043, "end": 10261.923, "localBegin": 1641.28, "localEnd": 1644.16}, {"id": "c006_f000229", "text": "\"Harry Potter,\" said Harry.", "begin": 10261.923, "end": 10264.123, "localBegin": 1644.16, "localEnd": 1646.36}, {"id": "c006_f000230", "text": "\"Are you really?\" said Hermione. \"I know all about you, of course - I got a few extra books for background reading, and you're in Modern Magical History and The Rise and Fall of the Dark Arts and Great Wizarding Events of the Twentieth Century.\"", "begin": 10264.123, "end": 10278.803, "localBegin": 1646.36, "localEnd": 1661.04}, {"id": "c006_f000231", "text": "\"Am I?\" said Harry, feeling dazed.", "begin": 10278.803, "end": 10282.083, "localBegin": 1661.04, "localEnd": 1664.32}, {"id": "c006_f000232", "text": "\"Goodness, didn't you know, I'd have found out everything I could if it was me,\" said Hermione. \"Do either of you know what House you'll be in? I've been asking around, and I hope I'm in Gryffindor, it sounds by far the best; I hear Dumbledore himself was in it, but I suppose Ravenclaw wouldn't be too bad. . . . Anyway, we'd better go and look for Neville's toad. You two had better change, you know, I expect we'll be there soon.\"", "begin": 10282.083, "end": 10305.683, "localBegin": 1664.32, "localEnd": 1687.92}, {"id": "c006_f000233", "text": "And she left, taking the toadless boy with her.", "begin": 10305.683, "end": 10308.803, "localBegin": 1687.92, "localEnd": 1691.04}, {"id": "c006_f000234", "text": "\"Whatever House I'm in, I hope she's not in it,\" said Ron. He threw his wand back into his trunk. \"Stupid spell - George gave it to me, bet he knew it was a dud.\"", "begin": 10308.803, "end": 10320.403, "localBegin": 1691.04, "localEnd": 1702.64}, {"id": "c006_f000235", "text": "\"What House are your brothers in?\" asked Harry.", "begin": 10320.403, "end": 10324.163, "localBegin": 1702.64, "localEnd": 1706.4}, {"id": "c006_f000236", "text": "\"Gryffindor,\" said Ron. Gloom seemed to be settling on him again. \"Mum and Dad were in it, too. I don't know what they'll say if I'm not. I don't suppose Ravenclaw would be too bad, but imagine if they put me in Slytherin.\"", "begin": 10324.163, "end": 10338.323, "localBegin": 1706.4, "localEnd": 1720.56}, {"id": "c006_f000237", "text": "\"That's the House Vol-, I mean, You-Know-Who was in?\"", "begin": 10338.323, "end": 10342.563, "localBegin": 1720.56, "localEnd": 1724.8}, {"id": "c006_f000238", "text": "\"Yeah,\" said Ron. He flopped back into his seat, looking depressed.", "begin": 10342.563, "end": 10347.243, "localBegin": 1724.8, "localEnd": 1729.48}, {"id": "c006_f000239", "text": "\"You know, I think the ends of Scabbers' whiskers are a bit lighter,\" said Harry, trying to take Ron's mind off Houses. \"So what do your oldest brothers do now that they've left, anyway?\"", "begin": 10347.243, "end": 10358.883, "localBegin": 1729.48, "localEnd": 1741.12}, {"id": "c006_f000240", "text": "Harry was wondering what a wizard did once he'd finished school.", "begin": 10358.883, "end": 10362.523, "localBegin": 1741.12, "localEnd": 1744.76}, {"id": "c006_f000241", "text": "\"Charlie's in Romania studying dragons, and Bill's in Africa doing something for Gringotts,\" said Ron. \"Did you hear about Gringotts? It's been all over the Daily Prophet, but I don't suppose you get that with the Muggles - someone tried to rob a high security vault.\"", "begin": 10362.523, "end": 10380.603, "localBegin": 1744.76, "localEnd": 1762.84}, {"id": "c006_f000242", "text": "Harry stared.", "begin": 10380.603, "end": 10382.203, "localBegin": 1762.84, "localEnd": 1764.44}, {"id": "c006_f000243", "text": "\"Really? What happened to them?\"", "begin": 10382.203, "end": 10385.163, "localBegin": 1764.44, "localEnd": 1767.4}, {"id": "c006_f000244", "text": "\"Nothing, that's why it's such big news. They haven't been caught. My dad says it must've been a powerful Dark wizard to get round Gringotts, but they don't think they took anything, that's what's odd. 'Course, everyone gets scared when something like this happens in case You-Know-Who's behind it.\"", "begin": 10385.163, "end": 10403.403, "localBegin": 1767.4, "localEnd": 1785.64}, {"id": "c006_f000245", "text": "Harry turned this news over in his mind. He was starting to get a prickle of fear every time You-Know-Who was mentioned. He supposed this was all part of entering the magical world, but it had been a lot more comfortable saying \"Voldemort\" without worrying.", "begin": 10403.403, "end": 10420.003, "localBegin": 1785.64, "localEnd": 1802.24}, {"id": "c006_f000246", "text": "\"What's your Quidditch team?\" Ron asked.", "begin": 10420.003, "end": 10423.603, "localBegin": 1802.24, "localEnd": 1805.84}, {"id": "c006_f000247", "text": "\"Er - I don't know any,\" Harry confessed.", "begin": 10423.603, "end": 10427.763, "localBegin": 1805.84, "localEnd": 1810.0}, {"id": "c006_f000248", "text": "\"What!\" Ron looked dumbfounded. \"Oh, you wait, it's the best game in the world - \" And he was off, explaining all about the four balls and the positions of the seven players, describing famous games he'd been to with his brothers and the broomstick he'd like to get if he had the money. He was just taking Harry through the finer points of the game when the compartment door slid open yet again, but it wasn't Neville the toadless boy, or Hermione Granger this time.", "begin": 10427.763, "end": 10455.403, "localBegin": 1810.0, "localEnd": 1837.64}, {"id": "c006_f000249", "text": "Three boys entered, and Harry recognized the middle one at once: It was the pale boy from Madam Malkin's robe shop. He was looking at Harry with a lot more interest than he'd shown back in Diagon Alley.", "begin": 10455.403, "end": 10468.003, "localBegin": 1837.64, "localEnd": 1850.24}, {"id": "c006_f000250", "text": "\"Is it true?\" he said. \"They're saying all down the train that Harry Potter's in this compartment. So it's you, is it?\"", "begin": 10468.003, "end": 10477.163, "localBegin": 1850.24, "localEnd": 1859.4}, {"id": "c006_f000251", "text": "\"Yes,\" said Harry. He was looking at the other boys. Both of them were thickset and looked extremely mean. Standing on either side of the pale boy, they looked like bodyguards.", "begin": 10477.163, "end": 10488.843, "localBegin": 1859.4, "localEnd": 1871.08}, {"id": "c006_f000252", "text": "\"Oh, this is Crabbe and this is Goyle,\" said the pale boy carelessly, noticing where Harry was looking. \"And my name's Malfoy, Draco Malfoy.\"", "begin": 10488.843, "end": 10501.203, "localBegin": 1871.08, "localEnd": 1883.44}, {"id": "c006_f000253", "text": "Ron gave a slight cough, which might have been hiding a snigger. Draco Malfoy looked at him.", "begin": 10501.203, "end": 10507.163, "localBegin": 1883.44, "localEnd": 1889.4}, {"id": "c006_f000254", "text": "\"Think my name's funny, do you? No need to ask who you are. My father told me all the Weasleys have red hair, freckles, and more children than they can afford.\"", "begin": 10507.163, "end": 10518.843, "localBegin": 1889.4, "localEnd": 1901.08}, {"id": "c006_f000255", "text": "He turned back to Harry. \"You'll soon find out some wizarding families are much better than others, Potter. You don't want to go making friends with the wrong sort. I can help you there.\"", "begin": 10518.843, "end": 10530.923, "localBegin": 1901.08, "localEnd": 1913.16}, {"id": "c006_f000256", "text": "He held out his hand to shake Harry's, but Harry didn't take it.", "begin": 10530.923, "end": 10535.083, "localBegin": 1913.16, "localEnd": 1917.32}, {"id": "c006_f000257", "text": "\"I think I can tell who the wrong sort are for myself, thanks,\" he said coolly.", "begin": 10535.083, "end": 10540.483, "localBegin": 1917.32, "localEnd": 1922.72}, {"id": "c006_f000258", "text": "Draco Malfoy didn't go red, but a pink tinge appeared in his pale cheeks.", "begin": 10540.483, "end": 10546.363, "localBegin": 1922.72, "localEnd": 1928.6}, {"id": "c006_f000259", "text": "\"I'd be careful if I were you, Potter,\" he said slowly. \"Unless you're a bit politer you'll go the same way as your parents. They didn't know what was good for them, either. You hang around with riffraff like the Weasleys and that Hagrid, and it'll rub off on you.\"", "begin": 10546.363, "end": 10565.443, "localBegin": 1928.6, "localEnd": 1947.68}, {"id": "c006_f000260", "text": "Both Harry and Ron stood up.", "begin": 10565.443, "end": 10567.723, "localBegin": 1947.68, "localEnd": 1949.96}, {"id": "c006_f000261", "text": "\"Say that again,\" Ron said, his face as red as his hair.", "begin": 10567.723, "end": 10571.683, "localBegin": 1949.96, "localEnd": 1953.92}, {"id": "c006_f000262", "text": "\"Oh, you're going to fight us, are you?\" Malfoy sneered.", "begin": 10571.683, "end": 10575.803, "localBegin": 1953.92, "localEnd": 1958.04}, {"id": "c006_f000263", "text": "\"Unless you get out now,\" said Harry, more bravely than he felt, because Crabbe and Goyle were a lot bigger than him or Ron.", "begin": 10575.803, "end": 10583.643, "localBegin": 1958.04, "localEnd": 1965.88}, {"id": "c006_f000264", "text": "\"But we don't feel like leaving, do we, boys? We've eaten all our food and you still seem to have some.\"", "begin": 10583.643, "end": 10591.723, "localBegin": 1965.88, "localEnd": 1973.96}, {"id": "c006_f000265", "text": "Goyle reached toward the Chocolate Frogs next to Ron - Ron leapt forward, but before he'd so much as touched Goyle, Goyle let out a horrible yell.", "begin": 10591.723, "end": 10601.323, "localBegin": 1973.96, "localEnd": 1983.56}, {"id": "c006_f000266", "text": "Scabbers the rat was hanging off his finger, sharp little teeth sunk deep into", "begin": 10601.323, "end": 10606.003, "localBegin": 1983.56, "localEnd": 1988.24}, {"id": "c006_f000267", "text": "Goyle's knuckle - Crabbe and Malfoy backed away as Goyle swung Scabbers round and round, howling, and when Scabbers finally flew off and hit the window, all three of them disappeared at once. Perhaps they thought there were more rats lurking among the sweets, or perhaps they'd heard footsteps, because a second later, Hermione Granger had come in.", "begin": 10606.003, "end": 10624.923, "localBegin": 1988.24, "localEnd": 2007.16}, {"id": "c006_f000268", "text": "\"What has been going on?\" she said, looking at the sweets all over the floor and Ron picking up Scabbers by his tail.", "begin": 10624.923, "end": 10632.043, "localBegin": 2007.16, "localEnd": 2014.28}, {"id": "c006_f000269", "text": "\"I think he's been knocked out,\" Ron said to Harry. He looked closer at Scabbers. \"No - I don't believe it - he's gone back to sleep.\"", "begin": 10632.043, "end": 10641.563, "localBegin": 2014.28, "localEnd": 2023.8}, {"id": "c006_f000270", "text": "And so he had.", "begin": 10641.563, "end": 10643.363, "localBegin": 2023.8, "localEnd": 2025.6}, {"id": "c006_f000271", "text": "\"You've met Malfoy before?\"", "begin": 10643.363, "end": 10646.323, "localBegin": 2025.6, "localEnd": 2028.56}, {"id": "c006_f000272", "text": "Harry explained about their meeting in Diagon Alley.", "begin": 10646.323, "end": 10649.883, "localBegin": 2028.56, "localEnd": 2032.12}, {"id": "c006_f000273", "text": "\"I've heard of his family,\" said Ron darkly. \"They were some of the first to come back to our side after You-Know-Who disappeared. Said they'd been bewitched. My dad doesn't believe it. He says Malfoy's father didn't need an excuse to go over to the Dark Side.\" He turned to Hermione. \"Can we help you with something?\"", "begin": 10649.883, "end": 10671.443, "localBegin": 2032.12, "localEnd": 2053.68}, {"id": "c006_f000274", "text": "\"You'd better hurry up and put your robes on, I've just been up to the front to ask the conductor, and he says we're nearly there. You haven't been fighting, have you? You'll be in trouble before we even get there!\"", "begin": 10671.443, "end": 10681.643, "localBegin": 2053.68, "localEnd": 2063.88}, {"id": "c006_f000275", "text": "\"Scabbers has been fighting, not us,\" said Ron, scowling at her. \"Would you mind leaving while we change?\"", "begin": 10681.643, "end": 10688.723, "localBegin": 2063.88, "localEnd": 2070.96}, {"id": "c006_f000276", "text": "\"All right - I only came in here because people outside are behaving very childishly, racing up and down the corridors,\" said Hermione in a sniffy voice. \"And you've got dirt on your nose, by the way, did you know?\"", "begin": 10688.723, "end": 10701.923, "localBegin": 2070.96, "localEnd": 2084.16}, {"id": "c006_f000277", "text": "Ron glared at her as she left. Harry peered out of the window. It was getting dark. He could see mountains and forests under a deep purple sky. The train did seem to be slowing down.", "begin": 10701.923, "end": 10714.603, "localBegin": 2084.16, "localEnd": 2096.84}, {"id": "c006_f000278", "text": "He and Ron took off their jackets and pulled on their long black robes. Ron's were a bit short for him, you could see his sneakers underneath them.", "begin": 10714.603, "end": 10724.483, "localBegin": 2096.84, "localEnd": 2106.72}, {"id": "c006_f000279", "text": "A voice echoed through the train: \"We will be reaching Hogwarts in five minutes' time. Please leave your luggage on the train, it will be taken to the school separately.\"", "begin": 10724.483, "end": 10737.083, "localBegin": 2106.72, "localEnd": 2119.32}, {"id": "c006_f000280", "text": "Harry's stomach lurched with nerves and Ron, he saw, looked pale under his freckles. They crammed their pockets with the last of the sweets and joined the crowd thronging the corridor.", "begin": 10737.083, "end": 10748.043, "localBegin": 2119.32, "localEnd": 2130.28}, {"id": "c006_f000281", "text": "The train slowed right down and finally stopped. People pushed their way toward the door and out on to a tiny, dark platform. Harry shivered in the cold night air. Then a lamp came bobbing over the heads of the students, and Harry heard a familiar voice: \"Firs' years! Firs' years over here! All right there, Harry?\"", "begin": 10748.043, "end": 10769.363, "localBegin": 2130.28, "localEnd": 2151.6}, {"id": "c006_f000282", "text": "Hagrid's big hairy face beamed over the sea of heads.", "begin": 10769.363, "end": 10773.043, "localBegin": 2151.6, "localEnd": 2155.28}, {"id": "c006_f000283", "text": "\"C'mon, follow me - any more firs' years? Mind yer step, now! Firs' years follow me!\"", "begin": 10773.043, "end": 10779.723, "localBegin": 2155.28, "localEnd": 2161.96}, {"id": "c006_f000284", "text": "Slipping and stumbling, they followed Hagrid down what seemed to be a steep, narrow path. It was so dark on either side of them that Harry thought there must be thick trees there. Nobody spoke much. Neville, the boy who kept losing his toad, sniffed once or twice.", "begin": 10779.723, "end": 10795.283, "localBegin": 2161.96, "localEnd": 2177.52}, {"id": "c006_f000285", "text": "\"Yeh'll get yer firs' sight o' Hogwarts in a sec,\" Hagrid called over his shoulder, \"jus' round this bend here.\"", "begin": 10795.283, "end": 10802.123, "localBegin": 2177.52, "localEnd": 2184.36}, {"id": "c006_f000286", "text": "There was a loud \"Oooooh!\"", "begin": 10802.123, "end": 10807.283, "localBegin": 2184.36, "localEnd": 2189.52}, {"id": "c006_f000287", "text": "The narrow path had opened suddenly onto the edge of a great black lake. Perched atop a high mountain on the other side, its windows sparkling in the starry sky, was a vast castle with many turrets and towers.", "begin": 10807.283, "end": 10819.323, "localBegin": 2189.52, "localEnd": 2201.56}, {"id": "c006_f000288", "text": "\"No more'n four to a boat!\" Hagrid called, pointing to a fleet of little boats sitting in the water by the shore. Harry and Ron were followed into their boat by Neville and Hermione.", "begin": 10819.323, "end": 10830.003, "localBegin": 2201.56, "localEnd": 2212.24}, {"id": "c006_f000289", "text": "\"Everyone in?\" shouted Hagrid, who had a boat to himself. \"Right then - FORWARD!\"", "begin": 10830.003, "end": 10836.923, "localBegin": 2212.24, "localEnd": 2219.16}, {"id": "c006_f000290", "text": "And the fleet of little boats moved off all at once, gliding across the lake, which was as smooth as glass. Everyone was silent, staring up at the great castle overhead. It towered over them as they sailed nearer and nearer to the cliff on which it stood.", "begin": 10836.923, "end": 10852.763, "localBegin": 2219.16, "localEnd": 2235.0}, {"id": "c006_f000291", "text": "\"Heads down!\" yelled Hagrid as the first boats reached the cliff; they all bent their heads and the little boats carried them through a curtain of ivy that hid a wide opening in the cliff face. They were carried along a dark tunnel, which seemed to be taking them right underneath the castle, until they reached a kind of", "begin": 10852.763, "end": 10870.403, "localBegin": 2235.0, "localEnd": 2252.64}, {"id": "c006_f000292", "text": "underground harbor, where they clambered out onto rocks and pebbles.", "begin": 10870.403, "end": 10873.883, "localBegin": 2252.64, "localEnd": 2256.12}, {"id": "c006_f000293", "text": "\"Oy, you there! Is this your toad?\" said Hagrid, who was checking the boats as people climbed out of them.", "begin": 10873.883, "end": 10880.483, "localBegin": 2256.12, "localEnd": 2262.72}, {"id": "c006_f000294", "text": "\"Trevor!\" cried Neville blissfully, holding out his hands. Then they clambered up a passageway in the rock after Hagrid's lamp, coming out at last onto smooth, damp grass right in the shadow of the castle.", "begin": 10880.483, "end": 10893.563, "localBegin": 2262.72, "localEnd": 2275.8}, {"id": "c006_f000295", "text": "They walked up a flight of stone steps and crowded around the huge, oak front door.", "begin": 10893.563, "end": 10898.843, "localBegin": 2275.8, "localEnd": 2281.08}, {"id": "c006_f000296", "text": "\"Everyone here? You there, still got yer toad?\"", "begin": 10898.843, "end": 10903.643, "localBegin": 2281.08, "localEnd": 2285.88}, {"id": "c006_f000297", "text": "Hagrid raised a gigantic fist and knocked three times on the castle door.", "begin": 10903.643, "end": 10912.243, "localBegin": 2285.88, "localEnd": 2294.48}]}, {"kind": "chapter", "number": 7, "title": "The Sorting Hat", "audio": "../Harry Potter and the Sorcerer's Stone, Book 1 (Unabridged)/007 - Harry Potter and the Sorcerer's Stone, Book 1 (Unabridged).mp3", "start": 10912.266, "end": 12641.363, "duration": 1729.097, "paragraphs": [{"id": "c007_f000001", "text": "Chapter Seven. The Sorting Hat.", "begin": 10912.266, "end": 10916.746, "localBegin": 0.0, "localEnd": 4.48}, {"id": "c007_f000002", "text": "The door swung open at once. A tall, black-haired witch in emerald-green robes stood there. She had a very stern face and Harry's first thought was that this was not someone to cross.", "begin": 10916.746, "end": 10927.826, "localBegin": 4.48, "localEnd": 15.56}, {"id": "c007_f000003", "text": "\"The firs' years, Professor McGonagall,\" said Hagrid.", "begin": 10927.826, "end": 10931.306, "localBegin": 15.56, "localEnd": 19.04}, {"id": "c007_f000004", "text": "\"Thank you, Hagrid. I will take them from here.\"", "begin": 10931.306, "end": 10935.586, "localBegin": 19.04, "localEnd": 23.32}, {"id": "c007_f000005", "text": "She pulled the door wide. The entrance hall was so big you could have fit the whole of the Dursleys' house in it. The stone walls were lit with flaming torches like the ones at Gringotts, the ceiling was too high to make out, and a magnificent marble staircase facing them led to the upper floors.", "begin": 10935.586, "end": 10953.466, "localBegin": 23.32, "localEnd": 41.2}, {"id": "c007_f000006", "text": "They followed Professor McGonagall across the flagged stone floor. Harry could hear the drone of hundreds of voices from a doorway to the right - the rest of the school must already be here - but Professor McGonagall showed the first years into a small, empty chamber off the hall. They crowded in, standing rather closer together than they would usually have done, peering about nervously.", "begin": 10953.466, "end": 10975.386, "localBegin": 41.2, "localEnd": 63.12}, {"id": "c007_f000007", "text": "\"Welcome to Hogwarts,\" said Professor McGonagall. \"The start-of-term banquet will begin shortly, but before you take your seats in the Great Hall, you will be sorted into your Houses. The Sorting is a very important ceremony because, while you are here, your House will be something like your family within Hogwarts. You will have classes with the rest of your House, sleep in your House dormitory, and spend free time in your House common room.", "begin": 10975.386, "end": 11003.026, "localBegin": 63.12, "localEnd": 90.76}, {"id": "c007_f000008", "text": "\"The four Houses are called Gryffindor, Hufflepuff, Ravenclaw, and Slytherin. Each House has its own noble history and each has produced outstanding witches and wizards. While you are at Hogwarts, your triumphs will earn your House points, while any rule-breaking will lose House points. At the end of the year, the House with the most points is awarded the House Cup, a great honor. I hope each of you will be a credit to whichever House becomes yours.", "begin": 11003.026, "end": 11033.906, "localBegin": 90.76, "localEnd": 121.64}, {"id": "c007_f000009", "text": "\"The Sorting Ceremony will take place in a few minutes in front of the rest of the school. I suggest you all smarten yourselves up as much as you can while you are waiting.\"", "begin": 11033.906, "end": 11044.746, "localBegin": 121.64, "localEnd": 132.48}, {"id": "c007_f000010", "text": "Her eyes lingered for a moment on Neville's cloak, which was fastened under his left ear, and on Ron's smudged nose. Harry nervously tried to flatten his hair.", "begin": 11044.746, "end": 11054.266, "localBegin": 132.48, "localEnd": 142.0}, {"id": "c007_f000011", "text": "\"I shall return when we are ready for you,\" said Professor McGonagall. \"Please wait quietly.\"", "begin": 11054.266, "end": 11061.106, "localBegin": 142.0, "localEnd": 148.84}, {"id": "c007_f000012", "text": "She left the chamber. Harry swallowed.", "begin": 11061.106, "end": 11063.666, "localBegin": 148.84, "localEnd": 151.4}, {"id": "c007_f000013", "text": "\"How exactly do they sort us into Houses?\" he asked Ron.", "begin": 11063.666, "end": 11068.546, "localBegin": 151.4, "localEnd": 156.28}, {"id": "c007_f000014", "text": "\"Some sort of test, I think. Fred said it hurts a lot, but I think he was joking.\"", "begin": 11068.546, "end": 11074.546, "localBegin": 156.28, "localEnd": 162.28}, {"id": "c007_f000015", "text": "Harry's heart gave a horrible jolt. A test? In front of the whole school? But he didn't know any magic yet - what on earth would he have to do? He hadn't expected something like this the moment they arrived. He looked around anxiously and saw that everyone else looked terrified, too. No one was talking much except Hermione Granger, who was whispering very fast about all the spells she'd learned and wondering which one she'd need. Harry tried hard not to listen to her. He'd never been more nervous, never, not even when he'd had to take a school report home to the Dursleys saying that he'd somehow turned his teacher's wig blue. He kept his eyes fixed on the door. Any second now, Professor McGonagall would come back and lead him to his doom.", "begin": 11074.546, "end": 11122.626, "localBegin": 162.28, "localEnd": 210.36}, {"id": "c007_f000016", "text": "Then something happened that made him jump about a foot in the air - several people behind him screamed.", "begin": 11122.626, "end": 11127.706, "localBegin": 210.36, "localEnd": 215.44}, {"id": "c007_f000017", "text": "\"What the - ?\"", "begin": 11127.706, "end": 11128.626, "localBegin": 215.44, "localEnd": 216.36}, {"id": "c007_f000018", "text": "He gasped. So did the people around him. About twenty ghosts had just streamed through the back wall. Pearly-white and slightly transparent, they glided across the room talking to one another and hardly glancing at the first years. They seemed to be arguing. What looked like a fat little monk was saying: \"Forgive and forget, I say, we ought to give him a second chance - \"", "begin": 11128.626, "end": 11151.386, "localBegin": 216.36, "localEnd": 239.12}, {"id": "c007_f000019", "text": "\"My dear Friar, haven't we given Peeves all the chances he deserves? He gives us all a bad name and you know, he's not really even a ghost - I say, what are you all doing here?\"", "begin": 11151.386, "end": 11165.226, "localBegin": 239.12, "localEnd": 252.96}, {"id": "c007_f000020", "text": "A ghost wearing a ruff and tights had suddenly noticed the first years.", "begin": 11165.226, "end": 11169.506, "localBegin": 252.96, "localEnd": 257.24}, {"id": "c007_f000021", "text": "Nobody answered.", "begin": 11169.506, "end": 11170.306, "localBegin": 257.24, "localEnd": 258.04}, {"id": "c007_f000022", "text": "\"New students!\" said the Fat Friar, smiling around at them. \"About to be Sorted, I suppose?\"", "begin": 11170.306, "end": 11178.186, "localBegin": 258.04, "localEnd": 265.92}, {"id": "c007_f000023", "text": "A few people nodded mutely.", "begin": 11178.186, "end": 11179.666, "localBegin": 265.92, "localEnd": 267.4}, {"id": "c007_f000024", "text": "\"Hope to see you in Hufflepuff!\" said the Friar. \"My old House, you know.\"", "begin": 11179.666, "end": 11185.186, "localBegin": 267.4, "localEnd": 272.92}, {"id": "c007_f000025", "text": "\"Move along now,\" said a sharp voice. \"The Sorting Ceremony's about to start.\"", "begin": 11185.186, "end": 11191.466, "localBegin": 272.92, "localEnd": 279.2}, {"id": "c007_f000026", "text": "Professor McGonagall had returned. One by one, the ghosts floated away through the opposite wall.", "begin": 11191.466, "end": 11196.946, "localBegin": 279.2, "localEnd": 284.68}, {"id": "c007_f000027", "text": "\"Now, form a line,\" Professor McGonagall told the first years, \"and follow me.\"", "begin": 11196.946, "end": 11204.066, "localBegin": 284.68, "localEnd": 291.8}, {"id": "c007_f000028", "text": "Feeling oddly as though his legs had turned to lead, Harry got into line behind a boy with sandy hair, with Ron behind him, and they walked out of the chamber, back across the hall, and through a pair of double doors into the Great Hall.", "begin": 11204.066, "end": 11217.506, "localBegin": 291.8, "localEnd": 305.24}, {"id": "c007_f000029", "text": "Harry had never even imagined such a strange and splendid place. It was lit by thousands and thousands of candles that were floating in midair over four long tables, where the rest of the students were sitting. These tables were laid with glittering golden plates and goblets. At the top of the hall was another long table where the teachers were sitting. Professor McGonagall led the first years up here, so that they came to a halt in a line facing the other students, with the teachers behind them. The hundreds of faces staring at them looked like pale lanterns in the flickering candlelight. Dotted here and there among the students, the ghosts shone misty silver. Mainly to avoid all the staring eyes, Harry looked upward and saw a velvety black ceiling dotted with stars. He heard Hermione whisper, \"It's bewitched to look like the sky outside. I read about it in Hogwarts: A History.\"", "begin": 11217.506, "end": 11275.026, "localBegin": 305.24, "localEnd": 362.76}, {"id": "c007_f000030", "text": "It was hard to believe there was a ceiling there at all, and that the Great Hall didn't simply open on to the heavens.", "begin": 11275.026, "end": 11282.626, "localBegin": 362.76, "localEnd": 370.36}, {"id": "c007_f000031", "text": "Harry quickly looked down again as Professor McGonagall silently placed a fourlegged stool in front of the first years. On top of the stool she put a pointed wizard's hat. This hat was patched and frayed and extremely dirty. Aunt Petunia wouldn't have let it in the house.", "begin": 11282.626, "end": 11300.426, "localBegin": 370.36, "localEnd": 388.16}, {"id": "c007_f000032", "text": "Maybe they had to try and get a rabbit out of it, Harry thought wildly, that seemed the sort of thing - noticing that everyone in the hall was now staring at the hat, he stared at it, too. For a few seconds, there was complete silence. Then the hat twitched. A rip near the brim opened wide like a mouth - and the hat began to sing:", "begin": 11300.426, "end": 11321.626, "localBegin": 388.16, "localEnd": 409.36}, {"id": "c007_f000033", "text": "\"Oh, you may not think I'm pretty,", "begin": 11321.626, "end": 11324.626, "localBegin": 409.36, "localEnd": 412.36}, {"id": "c007_f000034", "text": "But don't judge on what you see,", "begin": 11324.626, "end": 11326.866, "localBegin": 412.36, "localEnd": 414.6}, {"id": "c007_f000035", "text": "I'll eat myself if you can find", "begin": 11326.866, "end": 11328.906, "localBegin": 414.6, "localEnd": 416.64}, {"id": "c007_f000036", "text": "A smarter hat than me.", "begin": 11328.906, "end": 11330.586, "localBegin": 416.64, "localEnd": 418.32}, {"id": "c007_f000037", "text": "You can keep your bowlers black,", "begin": 11330.586, "end": 11332.666, "localBegin": 418.32, "localEnd": 420.4}, {"id": "c007_f000038", "text": "Your top hats sleek and tall,", "begin": 11332.666, "end": 11334.746, "localBegin": 420.4, "localEnd": 422.48}, {"id": "c007_f000039", "text": "For I'm the Hogwarts Sorting Hat", "begin": 11334.746, "end": 11338.146, "localBegin": 422.48, "localEnd": 425.88}, {"id": "c007_f000040", "text": "And I can cap them all.", "begin": 11338.146, "end": 11340.386, "localBegin": 425.88, "localEnd": 428.12}, {"id": "c007_f000041", "text": "There's nothing hidden in your head", "begin": 11340.386, "end": 11342.386, "localBegin": 428.12, "localEnd": 430.12}, {"id": "c007_f000042", "text": "The Sorting Hat can't see,", "begin": 11342.386, "end": 11344.866, "localBegin": 430.12, "localEnd": 432.6}, {"id": "c007_f000043", "text": "So try me on and I will tell you", "begin": 11344.866, "end": 11347.866, "localBegin": 432.6, "localEnd": 435.6}, {"id": "c007_f000044", "text": "Where you ought to be.", "begin": 11347.866, "end": 11350.586, "localBegin": 435.6, "localEnd": 438.32}, {"id": "c007_f000045", "text": "You might belong in Gryffindor,", "begin": 11350.586, "end": 11353.426, "localBegin": 438.32, "localEnd": 441.16}, {"id": "c007_f000046", "text": "Where dwell the brave at heart,", "begin": 11353.426, "end": 11355.386, "localBegin": 441.16, "localEnd": 443.12}, {"id": "c007_f000047", "text": "Their daring, nerve, and chivalry", "begin": 11355.386, "end": 11357.986, "localBegin": 443.12, "localEnd": 445.72}, {"id": "c007_f000048", "text": "Set Gryffindors apart;", "begin": 11357.986, "end": 11360.346, "localBegin": 445.72, "localEnd": 448.08}, {"id": "c007_f000049", "text": "You might belong in Hufflepuff,", "begin": 11360.346, "end": 11363.306, "localBegin": 448.08, "localEnd": 451.04}, {"id": "c007_f000050", "text": "Where they are just and loyal,", "begin": 11363.306, "end": 11366.066, "localBegin": 451.04, "localEnd": 453.8}, {"id": "c007_f000051", "text": "Those patient Hufflepuffs are true", "begin": 11366.066, "end": 11369.146, "localBegin": 453.8, "localEnd": 456.88}, {"id": "c007_f000052", "text": "And unafraid of toil;", "begin": 11369.146, "end": 11371.346, "localBegin": 456.88, "localEnd": 459.08}, {"id": "c007_f000053", "text": "Or yet in wise old Ravenclaw,", "begin": 11371.346, "end": 11375.186, "localBegin": 459.08, "localEnd": 462.92}, {"id": "c007_f000054", "text": "If you've a ready mind,", "begin": 11375.186, "end": 11376.946, "localBegin": 462.92, "localEnd": 464.68}, {"id": "c007_f000055", "text": "Where those of wit and learning,", "begin": 11376.946, "end": 11379.426, "localBegin": 464.68, "localEnd": 467.16}, {"id": "c007_f000056", "text": "Will always find their kind;", "begin": 11379.426, "end": 11382.746, "localBegin": 467.16, "localEnd": 470.48}, {"id": "c007_f000057", "text": "Or perhaps in Slytherin", "begin": 11382.746, "end": 11385.866, "localBegin": 470.48, "localEnd": 473.6}, {"id": "c007_f000058", "text": "You'll make your real friends,", "begin": 11385.866, "end": 11388.266, "localBegin": 473.6, "localEnd": 476.0}, {"id": "c007_f000059", "text": "Those cunning folk use any means", "begin": 11388.266, "end": 11391.186, "localBegin": 476.0, "localEnd": 478.92}, {"id": "c007_f000060", "text": "To achieve their ends.", "begin": 11391.186, "end": 11393.386, "localBegin": 478.92, "localEnd": 481.12}, {"id": "c007_f000061", "text": "So put me on! Don't be afraid!", "begin": 11393.386, "end": 11397.866, "localBegin": 481.12, "localEnd": 485.6}, {"id": "c007_f000062", "text": "And don't get in a flap!", "begin": 11397.866, "end": 11399.746, "localBegin": 485.6, "localEnd": 487.48}, {"id": "c007_f000063", "text": "You're in safe hands (though I have none)", "begin": 11399.746, "end": 11404.266, "localBegin": 487.48, "localEnd": 492.0}, {"id": "c007_f000064", "text": "For I'm a Thinking Cap!\"", "begin": 11404.266, "end": 11407.986, "localBegin": 492.0, "localEnd": 495.72}, {"id": "c007_f000065", "text": "The whole hall burst into applause as the hat finished its song. It bowed to each of the four tables and then became quite still again.", "begin": 11407.986, "end": 11415.626, "localBegin": 495.72, "localEnd": 503.36}, {"id": "c007_f000066", "text": "\"So we've just got to try on the hat!\" Ron whispered to Harry. \"I'll kill Fred, he was going on about wrestling a troll.\"", "begin": 11415.626, "end": 11425.306, "localBegin": 503.36, "localEnd": 513.04}, {"id": "c007_f000067", "text": "Harry smiled weakly. Yes, trying on the hat was a lot better than having to do a spell, but he did wish they could have tried it on without everyone watching. The hat seemed to be asking rather a lot; Harry didn't feel brave or quick-witted or any of it at the moment. If only the hat had mentioned a House for people who felt a bit queasy, that would have been the one for him.", "begin": 11425.306, "end": 11447.466, "localBegin": 513.04, "localEnd": 535.2}, {"id": "c007_f000068", "text": "Professor McGonagall now stepped forward holding a long roll of parchment.", "begin": 11447.466, "end": 11452.986, "localBegin": 535.2, "localEnd": 540.72}, {"id": "c007_f000069", "text": "\"When I call your name, you will put on the hat and sit on the stool to be sorted,\" she said. \"Abbott, Hannah!\"", "begin": 11452.986, "end": 11462.186, "localBegin": 540.72, "localEnd": 549.92}, {"id": "c007_f000070", "text": "A pink-faced girl with blonde pigtails stumbled out of line, put on the hat, which fell right down over her eyes, and sat down. A moment's pause -", "begin": 11462.186, "end": 11470.306, "localBegin": 549.92, "localEnd": 558.04}, {"id": "c007_f000071", "text": "\"HUFFLEPUFF!\" shouted the hat.", "begin": 11470.306, "end": 11472.786, "localBegin": 558.04, "localEnd": 560.52}, {"id": "c007_f000072", "text": "The table on the right cheered and clapped as Hannah went to sit down at the Hufflepuff table. Harry saw the ghost of the Fat Friar waving merrily at her.", "begin": 11472.786, "end": 11481.746, "localBegin": 560.52, "localEnd": 569.48}, {"id": "c007_f000073", "text": "\"Bones, Susan!\"", "begin": 11481.746, "end": 11483.946, "localBegin": 569.48, "localEnd": 571.68}, {"id": "c007_f000074", "text": "\"HUFFLEPUFF!\" shouted the hat again, and Susan scuttled off to sit next to Hannah.", "begin": 11483.946, "end": 11489.626, "localBegin": 571.68, "localEnd": 577.36}, {"id": "c007_f000075", "text": "\"Boot, Terry!\"", "begin": 11489.626, "end": 11492.146, "localBegin": 577.36, "localEnd": 579.88}, {"id": "c007_f000076", "text": "\"RAVENCLAW!\"", "begin": 11492.146, "end": 11494.026, "localBegin": 579.88, "localEnd": 581.76}, {"id": "c007_f000077", "text": "The table second from the left clapped this time; several Ravenclaws stood up to shake hands with Terry as he joined them.", "begin": 11494.026, "end": 11501.026, "localBegin": 581.76, "localEnd": 588.76}, {"id": "c007_f000078", "text": "\"Brocklehurst, Mandy\" went to Ravenclaw too, but \"Brown, Lavender\" became the first new Gryffindor, and the table on the far left exploded with cheers; Harry could see Ron's twin brothers catcalling.", "begin": 11501.026, "end": 11515.426, "localBegin": 588.76, "localEnd": 603.16}, {"id": "c007_f000079", "text": "\"Bulstrode, Millicent\" then became a Slytherin. Perhaps it was Harry's imagination, after all he'd heard about Slytherin, but he thought they looked like an unpleasant lot.", "begin": 11515.426, "end": 11528.066, "localBegin": 603.16, "localEnd": 615.8}, {"id": "c007_f000080", "text": "He was starting to feel definitely sick now. He remembered being picked for teams during gym at his old school. He had always been last to be chosen, not because he was no good, but because no one wanted Dudley to think they liked him.", "begin": 11528.066, "end": 11541.866, "localBegin": 615.8, "localEnd": 629.6}, {"id": "c007_f000081", "text": "\"Finch-Fletchley, Justin!\"", "begin": 11541.866, "end": 11545.026, "localBegin": 629.6, "localEnd": 632.76}, {"id": "c007_f000082", "text": "\"HUFFLEPUFF!\"", "begin": 11545.026, "end": 11547.906, "localBegin": 632.76, "localEnd": 635.64}, {"id": "c007_f000083", "text": "Sometimes, Harry noticed, the hat shouted out the House at once, but at others it took a little while to decide. \"Finnigan, Seamus,\" the sandy-haired boy next to Harry in the line, sat on the stool for almost a whole minute before the hat declared him a Gryffindor.", "begin": 11547.906, "end": 11563.986, "localBegin": 635.64, "localEnd": 651.72}, {"id": "c007_f000084", "text": "\"Granger, Hermione!\"", "begin": 11563.986, "end": 11567.826, "localBegin": 651.72, "localEnd": 655.56}, {"id": "c007_f000085", "text": "Hermione almost ran to the stool and jammed the hat eagerly on her head.", "begin": 11567.826, "end": 11571.466, "localBegin": 655.56, "localEnd": 659.2}, {"id": "c007_f000086", "text": "\"GRYFFINDOR!\" shouted the hat. Ron groaned.", "begin": 11571.466, "end": 11575.146, "localBegin": 659.2, "localEnd": 662.88}, {"id": "c007_f000087", "text": "A horrible thought struck Harry, as horrible thoughts always do when you're very nervous. What if he wasn't chosen at all? What if he just sat there with the hat over his eyes for ages, until Professor McGonagall jerked it off his head and said there had obviously been a mistake and he'd better get back on the train?", "begin": 11575.146, "end": 11593.186, "localBegin": 662.88, "localEnd": 680.92}, {"id": "c007_f000088", "text": "When Neville Longbottom, the boy who kept losing his toad, was called, he fell over on his way to the stool. The hat took a long time to decide with Neville. When it finally shouted, \"GRYFFINDOR,\" Neville ran off still wearing it, and had to jog back amid gales of laughter to give it to \"MacDougal, Morag.\"", "begin": 11593.186, "end": 11614.626, "localBegin": 680.92, "localEnd": 702.36}, {"id": "c007_f000089", "text": "Malfoy swaggered forward when his name was called and got his wish at once: the hat had barely touched his head when it screamed, \"SLYTHERIN!\"", "begin": 11614.626, "end": 11624.786, "localBegin": 702.36, "localEnd": 712.52}, {"id": "c007_f000090", "text": "Malfoy went to join his friends Crabbe and Goyle, looking pleased with himself.", "begin": 11624.786, "end": 11629.146, "localBegin": 712.52, "localEnd": 716.88}, {"id": "c007_f000091", "text": "There weren't many people left now.", "begin": 11629.146, "end": 11632.226, "localBegin": 716.88, "localEnd": 719.96}, {"id": "c007_f000092", "text": "\"Moon\" . . . , \"Nott\" . . . , \"Parkinson\" . . . , then a pair of twin girls, \"Patil\" and \"Patil\" . . . , then \"Perks, Sally-Anne\" . . . , and then, at last -", "begin": 11632.226, "end": 11646.186, "localBegin": 719.96, "localEnd": 733.92}, {"id": "c007_f000093", "text": "\"Potter, Harry!\"", "begin": 11646.186, "end": 11648.546, "localBegin": 733.92, "localEnd": 736.28}, {"id": "c007_f000094", "text": "As Harry stepped forward, whispers suddenly broke out like little hissing fires all over the hall.", "begin": 11648.546, "end": 11654.466, "localBegin": 736.28, "localEnd": 742.2}, {"id": "c007_f000095", "text": "\"Potter, did she say?\"", "begin": 11654.466, "end": 11656.346, "localBegin": 742.2, "localEnd": 744.08}, {"id": "c007_f000096", "text": "\"The Harry Potter?\"", "begin": 11656.346, "end": 11657.746, "localBegin": 744.08, "localEnd": 745.48}, {"id": "c007_f000097", "text": "The last thing Harry saw before the hat dropped over his eyes was the hall full of people craning to get a good look at him. Next second he was looking at the black inside of the hat. He waited.", "begin": 11657.746, "end": 11669.866, "localBegin": 745.48, "localEnd": 757.6}, {"id": "c007_f000098", "text": "\"Hmm,\" said a small voice in his ear. \"Difficult. Very difficult. Plenty of courage, I see. Not a bad mind either. There's talent, oh my goodness, yes - and a nice thirst to prove yourself, now that's interesting. . . . So where shall I put you?\"", "begin": 11669.866, "end": 11692.666, "localBegin": 757.6, "localEnd": 780.4}, {"id": "c007_f000099", "text": "Harry gripped the edges of the stool and thought, Not Slytherin, not Slytherin.", "begin": 11692.666, "end": 11699.106, "localBegin": 780.4, "localEnd": 786.84}, {"id": "c007_f000100", "text": "\"Not Slytherin, eh?\" said the small voice. \"Are you sure? You could be great, you know, it's all here in your head, and Slytherin will help you on the way to greatness, no doubt about that - no? Well, if you're sure - better be GRYFFINDOR!\"", "begin": 11699.106, "end": 11718.266, "localBegin": 786.84, "localEnd": 806.0}, {"id": "c007_f000101", "text": "Harry heard the hat shout the last word to the whole hall. He took off the hat and walked shakily toward the Gryffindor table. He was so relieved to have been chosen and not put in Slytherin, he hardly noticed that he was getting the loudest cheer yet. Percy the Prefect got up and shook his hand vigorously, while the Weasley twins yelled, \"We got Potter! We got Potter!\" Harry sat down opposite the ghost in the ruff he'd seen earlier. The ghost patted his arm, giving Harry the sudden, horrible feeling he'd just plunged it into a bucket of ice-cold water.", "begin": 11718.266, "end": 11751.466, "localBegin": 806.0, "localEnd": 839.2}, {"id": "c007_f000102", "text": "He could see the High Table properly now. At the end nearest him sat Hagrid, who caught his eye and gave him the thumbs up. Harry grinned back. And there, in the center of the High Table, in a large gold chair, sat Albus Dumbledore. Harry recognized him at once from the card he'd gotten out of the Chocolate Frog on the train. Dumbledore's silver hair was the only thing in the whole hall that shone as brightly as the ghosts. Harry spotted Professor Quirrell, too, the nervous young man from the Leaky Cauldron. He was looking very peculiar in a large purple turban.", "begin": 11751.466, "end": 11787.666, "localBegin": 839.2, "localEnd": 875.4}, {"id": "c007_f000103", "text": "And now there were only four people left to be sorted. \"Thomas, Dean,\" a black", "begin": 11787.666, "end": 11794.786, "localBegin": 875.4, "localEnd": 882.52}, {"id": "c007_f000104", "text": "boy even taller than Ron, joined Harry at the Gryffindor table. \"Turpin, Lisa,\" became a Ravenclaw and then it was Ron's turn. He was pale green by now. Harry crossed his fingers under the table and a second later the hat had shouted, \"GRYFFINDOR!\"", "begin": 11794.786, "end": 11811.506, "localBegin": 882.52, "localEnd": 899.24}, {"id": "c007_f000105", "text": "Harry clapped loudly with the rest as Ron collapsed into the chair next to him.", "begin": 11811.506, "end": 11816.786, "localBegin": 899.24, "localEnd": 904.52}, {"id": "c007_f000106", "text": "\"Well done, Ron, excellent,\" sai
