to do any real damage. I bet he expected you to refuse, anyway.\"", "begin": 14813.111, "end": 14827.031, "localBegin": 1059.28, "localEnd": 1073.2}, {"id": "c009_f000114", "text": "\"And what if I wave my wand and nothing happens?\"", "begin": 14827.031, "end": 14830.871, "localBegin": 1073.2, "localEnd": 1077.04}, {"id": "c009_f000115", "text": "\"Throw it away and punch him on the nose,\" Ron suggested.", "begin": 14830.871, "end": 14834.271, "localBegin": 1077.04, "localEnd": 1080.44}, {"id": "c009_f000116", "text": "\"Excuse me.\"", "begin": 14834.271, "end": 14836.871, "localBegin": 1080.44, "localEnd": 1083.04}, {"id": "c009_f000117", "text": "They both looked up. It was Hermione Granger.", "begin": 14836.871, "end": 14839.791, "localBegin": 1083.04, "localEnd": 1085.96}, {"id": "c009_f000118", "text": "\"Can't a person eat in peace in this place?\" said Ron.", "begin": 14839.791, "end": 14843.391, "localBegin": 1085.96, "localEnd": 1089.56}, {"id": "c009_f000119", "text": "Hermione ignored him and spoke to Harry.", "begin": 14843.391, "end": 14845.631, "localBegin": 1089.56, "localEnd": 1091.8}, {"id": "c009_f000120", "text": "\"I couldn't help overhearing what you and Malfoy were saying - \"", "begin": 14845.631, "end": 14848.871, "localBegin": 1091.8, "localEnd": 1095.04}, {"id": "c009_f000121", "text": "\"Bet you could,\" Ron muttered.", "begin": 14848.871, "end": 14851.031, "localBegin": 1095.04, "localEnd": 1097.2}, {"id": "c009_f000122", "text": "\" - and you mustn't go wandering around the school at night, think of the points you'll lose Gryffindor if you're caught, and you're bound to be. It's really very selfish of you.\"", "begin": 14851.031, "end": 14860.431, "localBegin": 1097.2, "localEnd": 1106.6}, {"id": "c009_f000123", "text": "\"And it's really none of your business,\" said Harry.", "begin": 14860.431, "end": 14863.991, "localBegin": 1106.6, "localEnd": 1110.16}, {"id": "c009_f000124", "text": "\"Good-bye,\" said Ron.", "begin": 14863.991, "end": 14866.111, "localBegin": 1110.16, "localEnd": 1112.28}, {"id": "c009_f000125", "text": "All the same, it wasn't what you'd call the perfect end to the day, Harry thought, as he lay awake much later listening to Dean and Seamus falling asleep (Neville wasn't back from the hospital wing). Ron had spent all evening giving him advice such as \"If he tries to curse you, you'd better dodge it, because I can't remember how to block them.\" There was a very good chance they were going to get caught by Filch or Mrs. Norris, and Harry felt he was pushing his luck, breaking another school rule today. On the other hand, Malfoy's sneering face kept looming up out of the darkness - this was his big chance to beat Malfoy face-to-face. He couldn't miss it.", "begin": 14866.111, "end": 14904.631, "localBegin": 1112.28, "localEnd": 1150.8}, {"id": "c009_f000126", "text": "\"Half-past eleven,\" Ron muttered at last, \"we'd better go.\"", "begin": 14904.631, "end": 14909.391, "localBegin": 1150.8, "localEnd": 1155.56}, {"id": "c009_f000127", "text": "They pulled on their bathrobes, picked up their wands, and crept across the tower room, down the spiral staircase, and into the Gryffindor common room. A few embers were still glowing in the fireplace, turning all the armchairs into hunched black shadows. They had almost reached the portrait hole when a voice spoke from the chair nearest them, \"I can't believe you're going to do this, Harry.\"", "begin": 14909.391, "end": 14930.471, "localBegin": 1155.56, "localEnd": 1176.64}, {"id": "c009_f000128", "text": "A lamp flickered on. It was Hermione Granger, wearing a pink bathrobe and a frown.", "begin": 14930.471, "end": 14936.431, "localBegin": 1176.64, "localEnd": 1182.6}, {"id": "c009_f000129", "text": "\"You!\" said Ron furiously. \"Go back to bed!\"", "begin": 14936.431, "end": 14940.431, "localBegin": 1182.6, "localEnd": 1186.6}, {"id": "c009_f000130", "text": "\"I almost told your brother,\" Hermione snapped, \"Percy - he's a prefect, he'd put a stop to this.\"", "begin": 14940.431, "end": 14946.551, "localBegin": 1186.6, "localEnd": 1192.72}, {"id": "c009_f000131", "text": "Harry couldn't believe anyone could be so interfering.", "begin": 14946.551, "end": 14950.271, "localBegin": 1192.72, "localEnd": 1196.44}, {"id": "c009_f000132", "text": "\"Come on,\" he said to Ron. He pushed open the portrait of the Fat Lady and climbed through the hole.", "begin": 14950.271, "end": 14956.391, "localBegin": 1196.44, "localEnd": 1202.56}, {"id": "c009_f000133", "text": "Hermione wasn't going to give up that easily. She followed Ron through the portrait hole, hissing at them like an angry goose.", "begin": 14956.391, "end": 14962.991, "localBegin": 1202.56, "localEnd": 1209.16}, {"id": "c009_f000134", "text": "\"Don't you care about Gryffindor, do you only care about yourselves, I don't want Slytherin to win the House Cup, and you'll lose all the points I got from Professor McGonagall for knowing about Switching Spells.\"", "begin": 14962.991, "end": 14974.431, "localBegin": 1209.16, "localEnd": 1220.6}, {"id": "c009_f000135", "text": "\"Go away.\"", "begin": 14974.431, "end": 14976.351, "localBegin": 1220.6, "localEnd": 1222.52}, {"id": "c009_f000136", "text": "\"All right, but I warned you, you just remember what I said when you're on the train home tomorrow, you're so - \"", "begin": 14976.351, "end": 14982.551, "localBegin": 1222.52, "localEnd": 1228.72}, {"id": "c009_f000137", "text": "But what they were, they didn't find out. Hermione had turned to the portrait of the Fat Lady to get back inside and found herself facing an empty painting. The Fat Lady had gone on a nighttime visit and Hermione was locked out of Gryffindor Tower.", "begin": 14982.551, "end": 14998.711, "localBegin": 1228.72, "localEnd": 1244.88}, {"id": "c009_f000138", "text": "\"Now what am I going to do?\" she asked shrilly.", "begin": 14998.711, "end": 15002.311, "localBegin": 1244.88, "localEnd": 1248.48}, {"id": "c009_f000139", "text": "\"That's your problem,\" said Ron. \"We've got to go, we're going to be late.\"", "begin": 15002.311, "end": 15007.391, "localBegin": 1248.48, "localEnd": 1253.56}, {"id": "c009_f000140", "text": "They hadn't even reached the end of the corridor when Hermione caught up with them.", "begin": 15007.391, "end": 15012.151, "localBegin": 1253.56, "localEnd": 1258.32}, {"id": "c009_f000141", "text": "\"I'm coming with you,\" she said.", "begin": 15012.151, "end": 15014.151, "localBegin": 1258.32, "localEnd": 1260.32}, {"id": "c009_f000142", "text": "\"You are not.\"", "begin": 15014.151, "end": 15015.671, "localBegin": 1260.32, "localEnd": 1261.84}, {"id": "c009_f000143", "text": "\"D'you think I'm going to stand out here and wait for Filch to catch me? If he finds all three of us I'll tell him the truth, that I was trying to stop you, and you can back me up.\"", "begin": 15015.671, "end": 15025.351, "localBegin": 1261.84, "localEnd": 1271.52}, {"id": "c009_f000144", "text": "\"You've got some nerve - \" said Ron loudly.", "begin": 15025.351, "end": 15028.831, "localBegin": 1271.52, "localEnd": 1275.0}, {"id": "c009_f000145", "text": "\"Shut up, both of you!\" said Harry sharply. \"I heard something.\"", "begin": 15028.831, "end": 15033.071, "localBegin": 1275.0, "localEnd": 1279.24}, {"id": "c009_f000146", "text": "It was a sort of snuffling.", "begin": 15033.071, "end": 15035.751, "localBegin": 1279.24, "localEnd": 1281.92}, {"id": "c009_f000147", "text": "\"Mrs. Norris?\" breathed Ron, squinting through the dark.", "begin": 15035.751, "end": 15040.391, "localBegin": 1281.92, "localEnd": 1286.56}, {"id": "c009_f000148", "text": "It wasn't Mrs. Norris. It was Neville. He was curled up on the floor, fast asleep, but jerked suddenly awake as they crept nearer.", "begin": 15040.391, "end": 15049.551, "localBegin": 1286.56, "localEnd": 1295.72}, {"id": "c009_f000149", "text": "\"Thank goodness you found me! I've been out here for hours, I couldn't remember the new password to get in to bed.\"", "begin": 15049.551, "end": 15056.631, "localBegin": 1295.72, "localEnd": 1302.8}, {"id": "c009_f000150", "text": "\"Keep your voice down, Neville. The password's 'Pig snout' but it won't help you now, the Fat Lady's gone off somewhere.\"", "begin": 15056.631, "end": 15064.831, "localBegin": 1302.8, "localEnd": 1311.0}, {"id": "c009_f000151", "text": "\"How's your arm?\" said Harry.", "begin": 15064.831, "end": 15067.431, "localBegin": 1311.0, "localEnd": 1313.6}, {"id": "c009_f000152", "text": "\"Fine,\" said Neville, showing them. \"Madam Pomfrey mended it in about a minute.\"", "begin": 15067.431, "end": 15072.631, "localBegin": 1313.6, "localEnd": 1318.8}, {"id": "c009_f000153", "text": "\"Good - well, look, Neville, we've got to be somewhere, we'll see you later - \"", "begin": 15072.631, "end": 15078.831, "localBegin": 1318.8, "localEnd": 1325.0}, {"id": "c009_f000154", "text": "\"Don't leave me!\" said Neville, scrambling to his feet, \"I don't want to stay here alone, the Bloody Baron's been past twice already.\"", "begin": 15078.831, "end": 15087.551, "localBegin": 1325.0, "localEnd": 1333.72}, {"id": "c009_f000155", "text": "Ron looked at his watch and then glared furiously at Hermione and Neville.", "begin": 15087.551, "end": 15092.111, "localBegin": 1333.72, "localEnd": 1338.28}, {"id": "c009_f000156", "text": "\"If either of you get us caught, I'll never rest until I've learned that Curse of the Bogies Quirrell told us about, and used it on you.\"", "begin": 15092.111, "end": 15101.591, "localBegin": 1338.28, "localEnd": 1347.76}, {"id": "c009_f000157", "text": "Hermione opened her mouth, perhaps to tell Ron exactly how to use the Curse of the Bogies, but Harry hissed at her to be quiet and beckoned them all forward.", "begin": 15101.591, "end": 15111.431, "localBegin": 1347.76, "localEnd": 1357.6}, {"id": "c009_f000158", "text": "They flitted along corridors striped with bars of moonlight from the high windows. At every turn Harry expected to run into Filch or Mrs. Norris, but they were lucky. They sped up a staircase to the third floor and tiptoed toward the trophy room.", "begin": 15111.431, "end": 15126.991, "localBegin": 1357.6, "localEnd": 1373.16}, {"id": "c009_f000159", "text": "Malfoy and Crabbe weren't there yet. The crystal trophy cases glimmered where the moonlight caught them. Cups, shields, plates, and statues winked silver and gold in the darkness. They edged along the walls, keeping their eyes on the doors at either end of the room. Harry took out his wand in case Malfoy leapt in and started at once. The minutes crept by.", "begin": 15126.991, "end": 15149.591, "localBegin": 1373.16, "localEnd": 1395.76}, {"id": "c009_f000160", "text": "\"He's late, maybe he's chickened out,\" Ron whispered.", "begin": 15149.591, "end": 15154.951, "localBegin": 1395.76, "localEnd": 1401.12}, {"id": "c009_f000161", "text": "Then a noise in the next room made them jump. Harry had only just raised his wand when they heard someone speak - and it wasn't Malfoy.", "begin": 15154.951, "end": 15163.351, "localBegin": 1401.12, "localEnd": 1409.52}, {"id": "c009_f000162", "text": "\"Sniff around, my sweet, they might be lurking in a corner.\"", "begin": 15163.351, "end": 15168.071, "localBegin": 1409.52, "localEnd": 1414.24}, {"id": "c009_f000163", "text": "It was Filch speaking to Mrs. Norris. Horror-struck, Harry waved madly at the other three to follow him as quickly as possible; they scurried silently toward the door, away from Filch's voice. Neville's robes had barely whipped round the corner when they heard Filch enter the trophy room.", "begin": 15168.071, "end": 15186.671, "localBegin": 1414.24, "localEnd": 1432.84}, {"id": "c009_f000164", "text": "\"They're in here somewhere,\" they heard him mutter, \"probably hiding.\"", "begin": 15186.671, "end": 15191.991, "localBegin": 1432.84, "localEnd": 1438.16}, {"id": "c009_f000165", "text": "\"This way!\" Harry mouthed to the others and, petrified, they began to creep down a long gallery full of suits of armor. They could hear Filch getting nearer. Neville suddenly let out a frightened squeak and broke into a run - he tripped, grabbed Ron around the waist, and the pair of them toppled right into a suit of armor.", "begin": 15191.991, "end": 15212.071, "localBegin": 1438.16, "localEnd": 1458.24}, {"id": "c009_f000166", "text": "The clanging and crashing were enough to wake the whole castle.", "begin": 15212.071, "end": 15215.911, "localBegin": 1458.24, "localEnd": 1462.08}, {"id": "c009_f000167", "text": "\"RUN!\" Harry yelled, and the four of them sprinted down the gallery, not looking back to see whether Filch was following - they swung around the doorpost and galloped down one corridor then another, Harry in the lead, without any idea where they were or where they were going - they ripped through a tapestry and found themselves in a hidden passageway, hurtled along it and came out near their Charms classroom, which they knew was miles from the trophy room.", "begin": 15215.911, "end": 15242.351, "localBegin": 1462.08, "localEnd": 1488.52}, {"id": "c009_f000168", "text": "\"I think we've lost him,\" Harry panted, leaning against the cold wall and wiping his forehead. Neville was bent double, wheezing and spluttering.", "begin": 15242.351, "end": 15252.071, "localBegin": 1488.52, "localEnd": 1498.24}, {"id": "c009_f000169", "text": "\"I - told - you,\" Hermione gasped, clutching at the stitch in her chest, \"I told - you.\"", "begin": 15252.071, "end": 15260.071, "localBegin": 1498.24, "localEnd": 1506.24}, {"id": "c009_f000170", "text": "\"We've got to get back to Gryffindor Tower,\" said Ron, \"quickly as possible.\"", "begin": 15260.071, "end": 15264.631, "localBegin": 1506.24, "localEnd": 1510.8}, {"id": "c009_f000171", "text": "\"Malfoy tricked you,\" Hermione said to Harry. \"You realize that, don't you? He was never going to meet you - Filch knew someone was going to be in the trophy room, Malfoy must have tipped him off.\"", "begin": 15264.631, "end": 15277.951, "localBegin": 1510.8, "localEnd": 1524.12}, {"id": "c009_f000172", "text": "Harry thought she was probably right, but he wasn't going to tell her that.", "begin": 15277.951, "end": 15282.391, "localBegin": 1524.12, "localEnd": 1528.56}, {"id": "c009_f000173", "text": "\"Let's go.\"", "begin": 15282.391, "end": 15283.711, "localBegin": 1528.56, "localEnd": 1529.88}, {"id": "c009_f000174", "text": "It wasn't going to be that simple. They hadn't gone more than a dozen paces when a doorknob rattled and something came shooting out of a classroom in front of them.", "begin": 15283.711, "end": 15293.311, "localBegin": 1529.88, "localEnd": 1539.48}, {"id": "c009_f000175", "text": "It was Peeves. He caught sight of them and gave a squeal of delight.", "begin": 15293.311, "end": 15297.271, "localBegin": 1539.48, "localEnd": 1543.44}, {"id": "c009_f000176", "text": "\"Shut up, Peeves - please - you'll get us thrown out.\"", "begin": 15297.271, "end": 15301.271, "localBegin": 1543.44, "localEnd": 1547.44}, {"id": "c009_f000177", "text": "Peeves cackled.", "begin": 15301.271, "end": 15303.231, "localBegin": 1547.44, "localEnd": 1549.4}, {"id": "c009_f000178", "text": "\"Wandering around at midnight, Ickle Firsties? Tut, tut, tut. Naughty, naughty, you'll get caughty.\"", "begin": 15303.231, "end": 15311.191, "localBegin": 1549.4, "localEnd": 1557.36}, {"id": "c009_f000179", "text": "\"Not if you don't give us away, Peeves, please.\"", "begin": 15311.191, "end": 15314.911, "localBegin": 1557.36, "localEnd": 1561.08}, {"id": "c009_f000180", "text": "\"Should tell Filch, I should,\" said Peeves in a saintly voice, but his eyes glittered wickedly. \"It's for your own good, you know.\"", "begin": 15314.911, "end": 15325.111, "localBegin": 1561.08, "localEnd": 1571.28}, {"id": "c009_f000181", "text": "\"Get out of the way,\" snapped Ron, taking a swipe at Peeves - this was a big mistake.", "begin": 15325.111, "end": 15332.071, "localBegin": 1571.28, "localEnd": 1578.24}, {"id": "c009_f000182", "text": "\"STUDENTS OUT OF BED!\" Peeves bellowed, \"STUDENTS OUT OF BED DOWN THE CHARMS CORRIDOR!\"", "begin": 15332.071, "end": 15339.111, "localBegin": 1578.24, "localEnd": 1585.28}, {"id": "c009_f000183", "text": "Ducking under Peeves, they ran for their lives, right to the end of the corridor where they slammed into a door - and it was locked.", "begin": 15339.111, "end": 15346.831, "localBegin": 1585.28, "localEnd": 1593.0}, {"id": "c009_f000184", "text": "\"This is it!\" Ron moaned, as they pushed helplessly at the door, \"We're done for! This is the end!\"", "begin": 15346.831, "end": 15352.911, "localBegin": 1593.0, "localEnd": 1599.08}, {"id": "c009_f000185", "text": "They could hear footsteps, Filch running as fast as he could toward Peeves's shouts.", "begin": 15352.911, "end": 15358.871, "localBegin": 1599.08, "localEnd": 1605.04}, {"id": "c009_f000186", "text": "\"Oh, move over,\" Hermione snarled. She grabbed Harry's wand, tapped the lock, and whispered, \"Alohomora!\"", "begin": 15358.871, "end": 15366.271, "localBegin": 1605.04, "localEnd": 1612.44}, {"id": "c009_f000187", "text": "The lock clicked and the door swung open - they piled through it, shut it quickly, and pressed their ears against it, listening.", "begin": 15366.271, "end": 15373.631, "localBegin": 1612.44, "localEnd": 1619.8}, {"id": "c009_f000188", "text": "\"Which way did they go, Peeves?\" Filch was saying. \"Quick, tell me.\"", "begin": 15373.631, "end": 15378.671, "localBegin": 1619.8, "localEnd": 1624.84}, {"id": "c009_f000189", "text": "\"Say 'please.'\"", "begin": 15378.671, "end": 15381.071, "localBegin": 1624.84, "localEnd": 1627.24}, {"id": "c009_f000190", "text": "\"Don't mess with me, Peeves, now where did they go?\"", "begin": 15381.071, "end": 15384.631, "localBegin": 1627.24, "localEnd": 1630.8}, {"id": "c009_f000191", "text": "\"Shan't say nothing if you don't say please,\" said Peeves in his annoying", "begin": 15384.631, "end": 15390.551, "localBegin": 1630.8, "localEnd": 1636.72}, {"id": "c009_f000192", "text": "singsong voice.", "begin": 15390.551, "end": 15391.671, "localBegin": 1636.72, "localEnd": 1637.84}, {"id": "c009_f000193", "text": "\"All right - please.\"", "begin": 15391.671, "end": 15393.831, "localBegin": 1637.84, "localEnd": 1640.0}, {"id": "c009_f000194", "text": "\"NOTHING! Ha haaa! Told you I wouldn't say nothing if you didn't say please! Ha ha! Haaaaaa!\" And they heard the sound of Peeves whooshing away and Filch cursing in rage.", "begin": 15393.831, "end": 15407.711, "localBegin": 1640.0, "localEnd": 1653.88}, {"id": "c009_f000195", "text": "\"He thinks this door is locked,\" Harry whispered. \"I think we'll be okay - get off, Neville!\" For Neville had been tugging on the sleeve of Harry's bathrobe for the last minute. \"What?\"", "begin": 15407.711, "end": 15420.031, "localBegin": 1653.88, "localEnd": 1666.2}, {"id": "c009_f000196", "text": "Harry turned around - and saw, quite clearly, what. For a moment, he was sure he'd walked into a nightmare - this was too much, on top of everything that had happened so far.", "begin": 15420.031, "end": 15431.631, "localBegin": 1666.2, "localEnd": 1677.8}, {"id": "c009_f000197", "text": "They weren't in a room, as he had supposed. They were in a corridor. The forbidden corridor on the third floor. And now they knew why it was forbidden.", "begin": 15431.631, "end": 15442.071, "localBegin": 1677.8, "localEnd": 1688.24}, {"id": "c009_f000198", "text": "They were looking straight into the eyes of a monstrous dog, a dog that filled the whole space between ceiling and floor. It had three heads. Three pairs of rolling, mad eyes; three noses, twitching and quivering in their direction; three drooling mouths, saliva hanging in slippery ropes from yellowish fangs.", "begin": 15442.071, "end": 15463.991, "localBegin": 1688.24, "localEnd": 1710.16}, {"id": "c009_f000199", "text": "It was standing quite still, all six eyes staring at them, and Harry knew that the only reason they weren't already dead was that their sudden appearance had taken it by surprise, but it was quickly getting over that, there was no mistaking what those thunderous growls meant.", "begin": 15463.991, "end": 15482.231, "localBegin": 1710.16, "localEnd": 1728.4}, {"id": "c009_f000200", "text": "Harry groped for the doorknob - between Filch and death, he'd take Filch.", "begin": 15482.231, "end": 15486.671, "localBegin": 1728.4, "localEnd": 1732.84}, {"id": "c009_f000201", "text": "They fell backward - Harry slammed the door shut, and they ran, they almost flew, back down the corridor. Filch must have hurried off to look for them somewhere else, because they didn't see him anywhere, but they hardly cared - all they wanted to do was put as much space as possible between them and that monster. They didn't stop running until they reached the portrait of the Fat Lady on the seventh floor.", "begin": 15486.671, "end": 15508.671, "localBegin": 1732.84, "localEnd": 1754.84}, {"id": "c009_f000202", "text": "\"Where on earth have you all been?\" she asked, looking at their bathrobes hanging off their shoulders and their flushed, sweaty faces.", "begin": 15508.671, "end": 15516.311, "localBegin": 1754.84, "localEnd": 1762.48}, {"id": "c009_f000203", "text": "\"Never mind that - pig snout, pig snout,\" panted Harry, and the portrait swung forward. They scrambled into the common room and collapsed, trembling, into armchairs.", "begin": 15516.311, "end": 15526.031, "localBegin": 1762.48, "localEnd": 1772.2}, {"id": "c009_f000204", "text": "It was a while before any of them said anything. Neville, indeed, looked as if he'd never speak again.", "begin": 15526.031, "end": 15532.511, "localBegin": 1772.2, "localEnd": 1778.68}, {"id": "c009_f000205", "text": "\"What do they think they're doing, keeping a thing like that locked up in a school?\" said Ron finally. \"If any dog needs exercise, that one does.\"", "begin": 15532.511, "end": 15541.231, "localBegin": 1778.68, "localEnd": 1787.4}, {"id": "c009_f000206", "text": "Hermione had got both her breath and her bad temper back again.", "begin": 15541.231, "end": 15545.431, "localBegin": 1787.4, "localEnd": 1791.6}, {"id": "c009_f000207", "text": "\"You don't use your eyes, any of you, do you?\" she snapped. \"Didn't you see what it was standing on?\"", "begin": 15545.431, "end": 15550.871, "localBegin": 1791.6, "localEnd": 1797.04}, {"id": "c009_f000208", "text": "\"The floor?\" Harry suggested. \"I wasn't looking at its feet, I was too busy with its heads.\"", "begin": 15550.871, "end": 15556.831, "localBegin": 1797.04, "localEnd": 1803.0}, {"id": "c009_f000209", "text": "\"No, not the floor. It was standing on a trapdoor. It's obviously guarding something.\"", "begin": 15556.831, "end": 15563.631, "localBegin": 1803.0, "localEnd": 1809.8}, {"id": "c009_f000210", "text": "She stood up, glaring at them.", "begin": 15563.631, "end": 15565.791, "localBegin": 1809.8, "localEnd": 1811.96}, {"id": "c009_f000211", "text": "\"I hope you're pleased with yourselves. We could all have been killed - or worse, expelled. Now, if you don't mind, I'm going to bed.\"", "begin": 15565.791, "end": 15574.431, "localBegin": 1811.96, "localEnd": 1820.6}, {"id": "c009_f000212", "text": "Ron stared after her, his mouth open.", "begin": 15574.431, "end": 15577.711, "localBegin": 1820.6, "localEnd": 1823.88}, {"id": "c009_f000213", "text": "\"No, we don't mind,\" he said. \"You'd think we dragged her along, wouldn't you?\"", "begin": 15577.711, "end": 15583.671, "localBegin": 1823.88, "localEnd": 1829.84}, {"id": "c009_f000214", "text": "But Hermione had given Harry something else to think about as he climbed back into bed. The dog was guarding something. . . . What had Hagrid said? Gringotts was the safest place in the world for something you wanted to hide - except perhaps Hogwarts.", "begin": 15583.671, "end": 15602.471, "localBegin": 1829.84, "localEnd": 1848.64}, {"id": "c009_f000215", "text": "It looked as though Harry had found out where the grubby little package from vault seven hundred and thirteen was.", "begin": 15602.471, "end": 15612.071, "localBegin": 1848.64, "localEnd": 1858.24}]}, {"kind": "chapter", "number": 10, "title": "Halloween", "audio": "../Harry Potter and the Sorcerer's Stone, Book 1 (Unabridged)/010 - Harry Potter and the Sorcerer's Stone, Book 1 (Unabridged).mp3", "start": 15612.078, "end": 17144.595, "duration": 1532.517, "paragraphs": [{"id": "c010_f000001", "text": "Chapter Ten. Halloween.", "begin": 15612.078, "end": 15615.958, "localBegin": 0.0, "localEnd": 3.88}, {"id": "c010_f000002", "text": "Malfoy couldn't believe his eyes when he saw that Harry and Ron were still at Hogwarts the next day, looking tired but perfectly cheerful. Indeed, by the next morning Harry and Ron thought that meeting the three-headed dog had been an excellent adventure, and they were quite keen to have another one. In the meantime, Harry filled Ron in about the package that seemed to have been moved from Gringotts to Hogwarts, and they spent a lot of time wondering what could possibly need such heavy protection.", "begin": 15615.958, "end": 15643.078, "localBegin": 3.88, "localEnd": 31.0}, {"id": "c010_f000003", "text": "\"It's either really valuable or really dangerous,\" said Ron.", "begin": 15643.078, "end": 15648.638, "localBegin": 31.0, "localEnd": 36.56}, {"id": "c010_f000004", "text": "\"Or both,\" said Harry.", "begin": 15648.638, "end": 15651.678, "localBegin": 36.56, "localEnd": 39.6}, {"id": "c010_f000005", "text": "But as all they knew for sure about the mysterious object was that it was about two inches long, they didn't have much chance of guessing what it was without further clues.", "begin": 15651.678, "end": 15661.958, "localBegin": 39.6, "localEnd": 49.88}, {"id": "c010_f000006", "text": "Neither Neville nor Hermione showed the slightest interest in what lay underneath the dog and the trapdoor. All Neville cared about was never going near the dog again.", "begin": 15661.958, "end": 15671.838, "localBegin": 49.88, "localEnd": 59.76}, {"id": "c010_f000007", "text": "Hermione was now refusing to speak to Harry and Ron, but she was such a bossy know-it-all that they saw this as an added bonus. All they really wanted now was a way of getting back at Malfoy, and to their great delight, just such a thing arrived in the mail about a week later.", "begin": 15671.838, "end": 15688.638, "localBegin": 59.76, "localEnd": 76.56}, {"id": "c010_f000008", "text": "As the owls flooded into the Great Hall as usual, everyone's attention was caught at once by a long, thin package carried by six large screech owls. Harry was just as interested as everyone else to see what was in this large parcel, and was amazed when the owls soared down and dropped it right in front of him, knocking his bacon to the floor. They had hardly fluttered out of the way when another owl dropped a letter on top of the parcel.", "begin": 15688.638, "end": 15715.598, "localBegin": 76.56, "localEnd": 103.52}, {"id": "c010_f000009", "text": "Harry ripped open the letter first, which was lucky, because it said:", "begin": 15715.598, "end": 15720.318, "localBegin": 103.52, "localEnd": 108.24}, {"id": "c010_f000010", "text": "DO NOT OPEN THE PARCEL AT THE TABLE.", "begin": 15720.318, "end": 15723.198, "localBegin": 108.24, "localEnd": 111.12}, {"id": "c010_f000011", "text": "It contains your new Nimbus Two Thousand, but I don't want everybody", "begin": 15723.198, "end": 15727.878, "localBegin": 111.12, "localEnd": 115.8}, {"id": "c010_f000012", "text": "knowing you've got a broomstick or they'll all want one. Oliver Wood will", "begin": 15727.878, "end": 15732.078, "localBegin": 115.8, "localEnd": 120.0}, {"id": "c010_f000013", "text": "meet you tonight on the Quidditch field at seven o'clock for your first", "begin": 15732.078, "end": 15735.718, "localBegin": 120.0, "localEnd": 123.64}, {"id": "c010_f000014", "text": "training session.", "begin": 15735.718, "end": 15740.238, "localBegin": 123.64, "localEnd": 128.16}, {"id": "c010_f000015", "text": "Harry had difficulty hiding his glee as he handed the note to Ron to read.", "begin": 15740.238, "end": 15744.998, "localBegin": 128.16, "localEnd": 132.92}, {"id": "c010_f000016", "text": "\"A Nimbus Two Thousand!\" Ron moaned enviously. \"I've never even touched one.\"", "begin": 15744.998, "end": 15753.278, "localBegin": 132.92, "localEnd": 141.2}, {"id": "c010_f000017", "text": "They left the hall quickly, wanting to unwrap the broomstick in private before their first class, but halfway across the entrance hall they found the way upstairs barred by Crabbe and Goyle. Malfoy seized the package from Harry and felt it.", "begin": 15753.278, "end": 15767.558, "localBegin": 141.2, "localEnd": 155.48}, {"id": "c010_f000018", "text": "\"That's a broomstick,\" he said, throwing it back to Harry with a mixture of jealousy and spite on his face. \"You'll be in for it this time, Potter, first years aren't allowed them.\"", "begin": 15767.558, "end": 15781.038, "localBegin": 155.48, "localEnd": 168.96}, {"id": "c010_f000019", "text": "Ron couldn't resist it.", "begin": 15781.038, "end": 15782.318, "localBegin": 168.96, "localEnd": 170.24}, {"id": "c010_f000020", "text": "\"It's not any old broomstick,\" he said, \"it's a Nimbus Two Thousand. What did you say you've got at home, Malfoy, a Comet Two Sixty?\" Ron grinned at Harry. \"Comets look flashy, but they're not in the same league as the Nimbus.\"", "begin": 15782.318, "end": 15797.798, "localBegin": 170.24, "localEnd": 185.72}, {"id": "c010_f000021", "text": "\"What would you know about it, Weasley, you couldn't afford half the handle,\" Malfoy snapped back. \"I suppose you and your brothers have to save up twig by twig.\"", "begin": 15797.798, "end": 15808.358, "localBegin": 185.72, "localEnd": 196.28}, {"id": "c010_f000022", "text": "Before Ron could answer, Professor Flitwick appeared at Malfoy's elbow.", "begin": 15808.358, "end": 15811.998, "localBegin": 196.28, "localEnd": 199.92}, {"id": "c010_f000023", "text": "\"Not arguing, I hope, boys?\" he squeaked.", "begin": 15811.998, "end": 15814.838, "localBegin": 199.92, "localEnd": 202.76}, {"id": "c010_f000024", "text": "\"Potter's been sent a broomstick, Professor,\" said Malfoy quickly.", "begin": 15814.838, "end": 15819.758, "localBegin": 202.76, "localEnd": 207.68}, {"id": "c010_f000025", "text": "\"Yes, yes, that's right,\" said Professor Flitwick, beaming at Harry. \"Professor McGonagall told me all about the special circumstances, Potter. And what model is it?\"", "begin": 15819.758, "end": 15830.078, "localBegin": 207.68, "localEnd": 218.0}, {"id": "c010_f000026", "text": "\"A Nimbus Two Thousand, sir,\" said Harry, fighting not to laugh at the look of horror on Malfoy's face. \"And it's really thanks to Malfoy here that I've got it,\" he added.", "begin": 15830.078, "end": 15842.518, "localBegin": 218.0, "localEnd": 230.44}, {"id": "c010_f000027", "text": "Harry and Ron headed upstairs, smothering their laughter at Malfoy's obvious rage and confusion.", "begin": 15842.518, "end": 15847.918, "localBegin": 230.44, "localEnd": 235.84}, {"id": "c010_f000028", "text": "\"Well, it's true,\" Harry chortled as they reached the top of the marble staircase, \"If he hadn't stolen Neville's Remembrall I wouldn't be on the", "begin": 15847.918, "end": 15856.718, "localBegin": 235.84, "localEnd": 244.64}, {"id": "c010_f000029", "text": "team. . . .\"", "begin": 15856.718, "end": 15857.238, "localBegin": 244.64, "localEnd": 245.16}, {"id": "c010_f000030", "text": "\"So I suppose you think that's a reward for breaking rules?\" came an angry voice from just behind them. Hermione was stomping up the stairs, looking disapprovingly at the package in Harry's hand.", "begin": 15857.238, "end": 15868.358, "localBegin": 245.16, "localEnd": 256.28}, {"id": "c010_f000031", "text": "\"I thought you weren't speaking to us?\" said Harry.", "begin": 15868.358, "end": 15871.958, "localBegin": 256.28, "localEnd": 259.88}, {"id": "c010_f000032", "text": "\"Yes, don't stop now,\" said Ron, \"it's doing us so much good.\"", "begin": 15871.958, "end": 15876.798, "localBegin": 259.88, "localEnd": 264.72}, {"id": "c010_f000033", "text": "Hermione marched away with her nose in the air.", "begin": 15876.798, "end": 15880.318, "localBegin": 264.72, "localEnd": 268.24}, {"id": "c010_f000034", "text": "Harry had a lot of trouble keeping his mind on his lessons that day. It kept wandering up to the dormitory where his new broomstick was lying under his bed, or straying off to the Quidditch field where he'd be learning to play that night. He bolted his dinner that evening without noticing what he was eating, and then rushed upstairs with Ron to unwrap the Nimbus Two Thousand at last.", "begin": 15880.318, "end": 15902.518, "localBegin": 268.24, "localEnd": 290.44}, {"id": "c010_f000035", "text": "\"Wow,\" Ron sighed, as the broomstick rolled onto Harry's bedspread.", "begin": 15902.518, "end": 15909.438, "localBegin": 290.44, "localEnd": 297.36}, {"id": "c010_f000036", "text": "Even Harry, who knew nothing about the different brooms, thought it looked wonderful. Sleek and shiny, with a mahogany handle, it had a long tail of neat, straight twigs and Nimbus Two Thousand written in gold near the top.", "begin": 15909.438, "end": 15924.198, "localBegin": 297.36, "localEnd": 312.12}, {"id": "c010_f000037", "text": "As seven o'clock drew nearer, Harry left the castle and set off in the dusk toward the Quidditch field. He'd never been inside the stadium before. Hundreds of seats were raised in stands around the field so that the spectators were high enough to see what was going on. At either end of the field were three golden poles with hoops on the end. They reminded Harry of the little plastic sticks Muggle children blew bubbles through, except that they were fifty feet high.", "begin": 15924.198, "end": 15951.078, "localBegin": 312.12, "localEnd": 339.0}, {"id": "c010_f000038", "text": "Too eager to fly again to wait for Wood, Harry mounted his broomstick and kicked off from the ground. What a feeling - he swooped in and out of the goalposts and then sped up and down the field. The Nimbus Two Thousand turned wherever he wanted at his lightest touch.", "begin": 15951.078, "end": 15968.198, "localBegin": 339.0, "localEnd": 356.12}, {"id": "c010_f000039", "text": "\"Hey, Potter, come down!\"", "begin": 15968.198, "end": 15971.518, "localBegin": 356.12, "localEnd": 359.44}, {"id": "c010_f000040", "text": "Oliver Wood had arrived. He was carrying a large wooden crate under his arm. Harry landed next to him.", "begin": 15971.518, "end": 15977.678, "localBegin": 359.44, "localEnd": 365.6}, {"id": "c010_f000041", "text": "\"Very nice,\" said Wood, his eyes glinting. \"I see what McGonagall meant . . . you really are a natural. I'm just going to teach you the rules this evening, then you'll be joining team practice three times a week.\"", "begin": 15977.678, "end": 15991.958, "localBegin": 365.6, "localEnd": 379.88}, {"id": "c010_f000042", "text": "He opened the crate. Inside were four different-sized balls.", "begin": 15991.958, "end": 15996.118, "localBegin": 379.88, "localEnd": 384.04}, {"id": "c010_f000043", "text": "\"Right,\" said Wood. \"Now, Quidditch is easy enough to understand, even if it's not too easy to play. There are seven players on each side. Three of them are called Chasers.\"", "begin": 15996.118, "end": 16008.798, "localBegin": 384.04, "localEnd": 396.72}, {"id": "c010_f000044", "text": "\"Three Chasers,\" Harry repeated, as Wood took out a bright red ball about the size of a soccer ball.", "begin": 16008.798, "end": 16014.758, "localBegin": 396.72, "localEnd": 402.68}, {"id": "c010_f000045", "text": "\"This ball's called the Quaffle,\" said Wood. \"The Chasers throw the Quaffle to each other and try and get it through one of the hoops to score a goal. Ten points every time the Quaffle goes through one of the hoops. Follow me?\"", "begin": 16014.758, "end": 16027.958, "localBegin": 402.68, "localEnd": 415.88}, {"id": "c010_f000046", "text": "\"The Chasers throw the Quaffle and put it through the hoops to score,\" Harry recited. \"So - that's sort of like basketball on broomsticks with six hoops, isn't it?\"", "begin": 16027.958, "end": 16038.038, "localBegin": 415.88, "localEnd": 425.96}, {"id": "c010_f000047", "text": "\"What's basketball?\" said Wood curiously.", "begin": 16038.038, "end": 16042.238, "localBegin": 425.96, "localEnd": 430.16}, {"id": "c010_f000048", "text": "\"Never mind,\" said Harry quickly.", "begin": 16042.238, "end": 16044.918, "localBegin": 430.16, "localEnd": 432.84}, {"id": "c010_f000049", "text": "\"Now, there's another player on each side who's called the Keeper - I'm Keeper for Gryffindor. I have to fly around our hoops and stop the other team from scoring.\"", "begin": 16044.918, "end": 16054.678, "localBegin": 432.84, "localEnd": 442.6}, {"id": "c010_f000050", "text": "\"Three Chasers, one Keeper,\" said Harry, who was determined to remember it all. \"And they play with the Quaffle. Okay, got that. So what are they for?\" He pointed at the three balls left inside the box.", "begin": 16054.678, "end": 16066.678, "localBegin": 442.6, "localEnd": 454.6}, {"id": "c010_f000051", "text": "\"I'll show you now,\" said Wood. \"Take this.\"", "begin": 16066.678, "end": 16069.678, "localBegin": 454.6, "localEnd": 457.6}, {"id": "c010_f000052", "text": "He handed Harry a small club, a bit like a short baseball bat.", "begin": 16069.678, "end": 16073.278, "localBegin": 457.6, "localEnd": 461.2}, {"id": "c010_f000053", "text": "\"I'm going to show you what the Bludgers do,\" Wood said. \"These two are the Bludgers.\"", "begin": 16073.278, "end": 16078.998, "localBegin": 461.2, "localEnd": 466.92}, {"id": "c010_f000054", "text": "He showed Harry two identical balls, jet black and slightly smaller than the red Quaffle. Harry noticed that they seemed to be straining to escape the straps holding them inside the box.", "begin": 16078.998, "end": 16089.638, "localBegin": 466.92, "localEnd": 477.56}, {"id": "c010_f000055", "text": "\"Stand back,\" Wood warned Harry. He bent down and freed one of the Bludgers.", "begin": 16089.638, "end": 16094.838, "localBegin": 477.56, "localEnd": 482.76}, {"id": "c010_f000056", "text": "At once, the black ball rose high in the air and then pelted straight at Harry's face. Harry swung at it with the bat to stop it from breaking his nose, and sent it zigzagging away into the air - it zoomed around their heads and then shot", "begin": 16094.838, "end": 16107.118, "localBegin": 482.76, "localEnd": 495.04}, {"id": "c010_f000057", "text": "at Wood, who dived on top of it and managed to pin it to the ground.", "begin": 16107.118, "end": 16110.278, "localBegin": 495.04, "localEnd": 498.2}, {"id": "c010_f000058", "text": "\"See?\" Wood panted, forcing the struggling Bludger back into the crate and strapping it down safely. \"The Bludgers rocket around, trying to knock players off their brooms. That's why you have two Beaters on each team - the Weasley twins are ours - it's their job to protect their side from the Bludgers and try and knock them toward the other team. So - think you've got all that?\"", "begin": 16110.278, "end": 16131.678, "localBegin": 498.2, "localEnd": 519.6}, {"id": "c010_f000059", "text": "\"Three Chasers try and score with the Quaffle; the Keeper guards the goalposts; the Beaters keep the Bludgers away from their team,\" Harry reeled off.", "begin": 16131.678, "end": 16141.358, "localBegin": 519.6, "localEnd": 529.28}, {"id": "c010_f000060", "text": "\"Very good,\" said Wood.", "begin": 16141.358, "end": 16143.478, "localBegin": 529.28, "localEnd": 531.4}, {"id": "c010_f000061", "text": "\"Er - have the Bludgers ever killed anyone?\" Harry asked, hoping he sounded offhand.", "begin": 16143.478, "end": 16149.718, "localBegin": 531.4, "localEnd": 537.64}, {"id": "c010_f000062", "text": "\"Never at Hogwarts. We've had a couple of broken jaws but nothing worse than that. Now, the last member of the team is the Seeker. That's you. And you don't have to worry about the Quaffle or the Bludgers - \"", "begin": 16149.718, "end": 16161.438, "localBegin": 537.64, "localEnd": 549.36}, {"id": "c010_f000063", "text": "\" - unless they crack my head open.\"", "begin": 16161.438, "end": 16163.198, "localBegin": 549.36, "localEnd": 551.12}, {"id": "c010_f000064", "text": "\"Don't worry, the Weasleys are more than a match for the Bludgers - I mean, they're like a pair of human Bludgers themselves.\"", "begin": 16163.198, "end": 16171.518, "localBegin": 551.12, "localEnd": 559.44}, {"id": "c010_f000065", "text": "Wood reached into the crate and took out the fourth and last ball. Compared with the Quaffle and the Bludgers, it was tiny, about the size of a large walnut. It was bright gold and had little fluttering silver wings.", "begin": 16171.518, "end": 16184.038, "localBegin": 559.44, "localEnd": 571.96}, {"id": "c010_f000066", "text": "\"This,\" said Wood, \"is the Golden Snitch, and it's the most important ball of the lot. It's very hard to catch because it's so fast and difficult to see. It's the Seeker's job to catch it. You've got to weave in and out of the Chasers, Beaters, Bludgers, and Quaffle to get it before the other team's Seeker, because whichever Seeker catches the Snitch wins his team an extra hundred and fifty points, so they nearly always win. That's why Seekers get fouled so much. A game of Quidditch only ends when the Snitch is caught, so it can go on for ages - I think the record is three months, they had to keep bringing on substitutes so the players could get some sleep.", "begin": 16184.038, "end": 16227.998, "localBegin": 571.96, "localEnd": 615.92}, {"id": "c010_f000067", "text": "\"Well, that's it - any questions?\"", "begin": 16227.998, "end": 16232.318, "localBegin": 615.92, "localEnd": 620.24}, {"id": "c010_f000068", "text": "Harry shook his head. He understood what he had to do all right, it was doing it that was going to be the problem.", "begin": 16232.318, "end": 16238.358, "localBegin": 620.24, "localEnd": 626.28}, {"id": "c010_f000069", "text": "\"We won't practice with the Snitch yet,\" said Wood, carefully shutting it back inside the crate, \"it's too dark, we might lose it. Let's try you out with a few of these.\"", "begin": 16238.358, "end": 16249.798, "localBegin": 626.28, "localEnd": 637.72}, {"id": "c010_f000070", "text": "He pulled a bag of ordinary golf balls out of his pocket and a few minutes later, he and Harry were up in the air, Wood throwing the golf balls as hard as he could in every direction for Harry to catch.", "begin": 16249.798, "end": 16260.478, "localBegin": 637.72, "localEnd": 648.4}, {"id": "c010_f000071", "text": "Harry didn't miss a single one, and Wood was delighted. After half an hour, night had really fallen and they couldn't carry on.", "begin": 16260.478, "end": 16268.558, "localBegin": 648.4, "localEnd": 656.48}, {"id": "c010_f000072", "text": "\"That Quidditch Cup'll have our name on it this year,\" said Wood happily as they trudged back up to the castle. \"I wouldn't be surprised if you turn out better than Charlie Weasley, and he could have played for England if he hadn't gone off chasing dragons.\"", "begin": 16268.558, "end": 16283.478, "localBegin": 656.48, "localEnd": 671.4}, {"id": "c010_f000073", "text": "Perhaps it was because he was now so busy, what with Quidditch practice three evenings a week on top of all his homework, but Harry could hardly believe it when he realized that he'd already been at Hogwarts two months. The castle felt more like home than Privet Drive ever had. His lessons, too, were becoming more and more interesting now that they had mastered the basics.", "begin": 16283.478, "end": 16306.358, "localBegin": 671.4, "localEnd": 694.28}, {"id": "c010_f000074", "text": "On Halloween morning they woke to the delicious smell of baking pumpkin wafting through the corridors. Even better, Professor Flitwick announced in Charms that he thought they were ready to start making objects fly, something they had all been dying to try since they'd seen him make Neville's toad zoom around the classroom. Professor Flitwick put the class into pairs to practice. Harry's partner was Seamus Finnigan (which was a relief, because Neville had been trying to catch his eye). Ron, however, was to be working with Hermione Granger. It was hard to tell whether Ron or Hermione was angrier about this. She hadn't spoken to either of them since the day Harry's broomstick had arrived.", "begin": 16306.358, "end": 16345.318, "localBegin": 694.28, "localEnd": 733.24}, {"id": "c010_f000075", "text": "\"Now, don't forget that nice wrist movement we've been practicing!\" squeaked Professor Flitwick, perched on top of his pile of books as usual. \"Swish and flick, remember, swish and flick. And saying the magic words properly is very important, too - never forget Wizard Baruffio, who said 's' instead of 'f' and found himself on the floor with a buffalo on his chest.\"", "begin": 16345.318, "end": 16369.758, "localBegin": 733.24, "localEnd": 757.68}, {"id": "c010_f000076", "text": "It was very difficult. Harry and Seamus swished and flicked, but the feather they were supposed to be sending skyward just lay on the desktop. Seamus got so impatient that he prodded it with his wand and set fire to it - Harry had to put it out with his hat.", "begin": 16369.758, "end": 16384.518, "localBegin": 757.68, "localEnd": 772.44}, {"id": "c010_f000077", "text": "Ron, at the next table, wasn't having much more luck.", "begin": 16384.518, "end": 16387.278, "localBegin": 772.44, "localEnd": 775.2}, {"id": "c010_f000078", "text": "\"Wingardium Leviosa!\" he shouted, waving his long arms like a windmill.", "begin": 16387.278, "end": 16392.038, "localBegin": 775.2, "localEnd": 779.96}, {"id": "c010_f000079", "text": "\"You're saying it wrong,\" Harry heard Hermione snap. \"It's Wing-gar-dium Levio-sa, make the 'gar' nice and long.\"", "begin": 16392.038, "end": 16401.198, "localBegin": 779.96, "localEnd": 789.12}, {"id": "c010_f000080", "text": "\"You do it, then, if you're so clever,\" Ron snarled.", "begin": 16401.198, "end": 16405.238, "localBegin": 789.12, "localEnd": 793.16}, {"id": "c010_f000081", "text": "Hermione rolled up the sleeves of her gown, flicked her wand, and said, \"Wingardium Leviosa!\"", "begin": 16405.238, "end": 16411.998, "localBegin": 793.16, "localEnd": 799.92}, {"id": "c010_f000082", "text": "Their feather rose off the desk and hovered about four feet above their heads.", "begin": 16411.998, "end": 16415.798, "localBegin": 799.92, "localEnd": 803.72}, {"id": "c010_f000083", "text": "\"Oh, well done!\" cried Professor Flitwick, clapping. \"Everyone see here, Miss Granger's done it!\"", "begin": 16415.798, "end": 16424.318, "localBegin": 803.72, "localEnd": 812.24}, {"id": "c010_f000084", "text": "Ron was in a very bad mood by the end of the class.", "begin": 16424.318, "end": 16427.238, "localBegin": 812.24, "localEnd": 815.16}, {"id": "c010_f000085", "text": "\"It's no wonder no one can stand her,\" he said to Harry as they pushed their way into the crowded corridor, \"she's a nightmare, honestly.\"", "begin": 16427.238, "end": 16436.038, "localBegin": 815.16, "localEnd": 823.96}, {"id": "c010_f000086", "text": "Someone knocked into Harry as they hurried past him. It was Hermione. Harry caught a glimpse of her face - and was startled to see that she was in tears.", "begin": 16436.038, "end": 16444.878, "localBegin": 823.96, "localEnd": 832.8}, {"id": "c010_f000087", "text": "\"I think she heard you.\"", "begin": 16444.878, "end": 16447.878, "localBegin": 832.8, "localEnd": 835.8}, {"id": "c010_f000088", "text": "\"So?\" said Ron, but he looked a bit uncomfortable. \"She must've noticed she's got no friends.\"", "begin": 16447.878, "end": 16455.318, "localBegin": 835.8, "localEnd": 843.24}, {"id": "c010_f000089", "text": "Hermione didn't turn up for the next class and wasn't seen all afternoon. On their way down to the Great Hall for the Halloween feast, Harry and Ron overheard Parvati Patil telling her friend Lavender that Hermione was crying in the girls' bathroom and wanted to be left alone. Ron looked still more awkward at this, but a moment later they had entered the Great Hall, where the Halloween decorations put Hermione out of their minds.", "begin": 16455.318, "end": 16481.758, "localBegin": 843.24, "localEnd": 869.68}, {"id": "c010_f000090", "text": "A thousand live bats fluttered from the walls and ceiling while a thousand more swooped over the tables in low black clouds, making the candles in the pumpkins stutter. The feast appeared suddenly on the golden plates, as it had at the startof-term banquet.", "begin": 16481.758, "end": 16497.918, "localBegin": 869.68, "localEnd": 885.84}, {"id": "c010_f000091", "text": "Harry was just helping himself to a baked potato when Professor Quirrell came sprinting into the hall, his turban askew and terror on his face. Everyone stared as he reached Professor Dumbledore's chair, slumped against the table, and gasped,", "begin": 16497.918, "end": 16511.278, "localBegin": 885.84, "localEnd": 899.2}, {"id": "c010_f000092", "text": "\"Troll - in the dungeons - thought you ought to know.\"", "begin": 16511.278, "end": 16515.998, "localBegin": 899.2, "localEnd": 903.92}, {"id": "c010_f000093", "text": "He then sank to the floor in a dead faint.", "begin": 16515.998, "end": 16519.118, "localBegin": 903.92, "localEnd": 907.04}, {"id": "c010_f000094", "text": "There was an uproar. It took several purple firecrackers exploding from the end of Professor Dumbledore's wand to bring silence.", "begin": 16519.118, "end": 16526.638, "localBegin": 907.04, "localEnd": 914.56}, {"id": "c010_f000095", "text": "\"Prefects,\" he rumbled, \"lead your Houses back to the dormitories immediately!\"", "begin": 16526.638, "end": 16532.278, "localBegin": 914.56, "localEnd": 920.2}, {"id": "c010_f000096", "text": "Percy was in his element.", "begin": 16532.278, "end": 16534.278, "localBegin": 920.2, "localEnd": 922.2}, {"id": "c010_f000097", "text": "\"Follow me! Stick together, first years! No need to fear the troll if you follow my orders! Stay close behind me, now. Make way, first years coming through! Excuse me, I'm a prefect!\"", "begin": 16534.278, "end": 16543.878, "localBegin": 922.2, "localEnd": 931.8}, {"id": "c010_f000098", "text": "\"How could a troll get in?\" Harry asked as they climbed the stairs.", "begin": 16543.878, "end": 16548.798, "localBegin": 931.8, "localEnd": 936.72}, {"id": "c010_f000099", "text": "\"Don't ask me, they're supposed to be really stupid,\" said Ron. \"Maybe Peeves let it in for a Halloween joke.\"", "begin": 16548.798, "end": 16554.798, "localBegin": 936.72, "localEnd": 942.72}, {"id": "c010_f000100", "text": "They passed different groups of people hurrying in different directions. As they jostled their way through a crowd of confused Hufflepuffs, Harry suddenly grabbed Ron's arm.", "begin": 16554.798, "end": 16564.518, "localBegin": 942.72, "localEnd": 952.44}, {"id": "c010_f000101", "text": "\"I've just thought - Hermione.\"", "begin": 16564.518, "end": 16567.198, "localBegin": 952.44, "localEnd": 955.12}, {"id": "c010_f000102", "text": "\"What about her?\"", "begin": 16567.198, "end": 16568.318, "localBegin": 955.12, "localEnd": 956.24}, {"id": "c010_f000103", "text": "\"She doesn't know about the troll.\"", "begin": 16568.318, "end": 16571.318, "localBegin": 956.24, "localEnd": 959.24}, {"id": "c010_f000104", "text": "Ron bit his lip.", "begin": 16571.318, "end": 16572.038, "localBegin": 959.24, "localEnd": 959.96}, {"id": "c010_f000105", "text": "\"Oh, all right,\" he snapped. \"But Percy'd better not see us.\"", "begin": 16572.038, "end": 16576.678, "localBegin": 959.96, "localEnd": 964.6}, {"id": "c010_f000106", "text": "Ducking down, they joined the Hufflepuffs going the other way, slipped down a deserted side corridor, and hurried off toward the girls' bathroom. They had just turned the corner when they heard quick footsteps behind them.", "begin": 16576.678, "end": 16588.558, "localBegin": 964.6, "localEnd": 976.48}, {"id": "c010_f000107", "text": "\"Percy!\" hissed Ron, pulling Harry behind a large stone griffin.", "begin": 16588.558, "end": 16592.998, "localBegin": 976.48, "localEnd": 980.92}, {"id": "c010_f000108", "text": "Peering around it, however, they saw not Percy but Snape. He crossed the corridor and disappeared from view.", "begin": 16592.998, "end": 16600.478, "localBegin": 980.92, "localEnd": 988.4}, {"id": "c010_f000109", "text": "\"What's he doing?\" Harry whispered. \"Why isn't he down in the dungeons with the rest of the teachers?\"", "begin": 16600.478, "end": 16607.878, "localBegin": 988.4, "localEnd": 995.8}, {"id": "c010_f000110", "text": "\"Search me.\"", "begin": 16607.878, "end": 16609.518, "localBegin": 995.8, "localEnd": 997.44}, {"id": "c010_f000111", "text": "Quietly as possible, they crept along the next corridor after Snape's fading footsteps.", "begin": 16609.518, "end": 16615.318, "localBegin": 997.44, "localEnd": 1003.24}, {"id": "c010_f000112", "text": "\"He's heading for the third floor,\" Harry said, but Ron held up his hand.", "begin": 16615.318, "end": 16620.838, "localBegin": 1003.24, "localEnd": 1008.76}, {"id": "c010_f000113", "text": "\"Can you smell something?\"", "begin": 16620.838, "end": 16624.118, "localBegin": 1008.76, "localEnd": 1012.04}, {"id": "c010_f000114", "text": "Harry sniffed and a foul stench reached his nostrils, a mixture of old socks and the kind of public toilet no one seems to clean.", "begin": 16624.118, "end": 16632.318, "localBegin": 1012.04, "localEnd": 1020.24}, {"id": "c010_f000115", "text": "And then they heard it - a low grunting, and the shuffling footfalls of gigantic feet. Ron pointed - at the end of a passage to the left, something huge was moving toward them. They shrank into the shadows and watched as it emerged into a patch of moonlight.", "begin": 16632.318, "end": 16650.198, "localBegin": 1020.24, "localEnd": 1038.12}, {"id": "c010_f000116", "text": "It was a horrible sight. Twelve feet tall, its skin was a dull, granite gray, its great lumpy body like a boulder with its small bald head perched on top like a coconut. It had short legs thick as tree trunks with flat, horny feet. The smell coming from it was incredible. It was holding a huge wooden club, which dragged along the floor because its arms were so long.", "begin": 16650.198, "end": 16675.518, "localBegin": 1038.12, "localEnd": 1063.44}, {"id": "c010_f000117", "text": "The troll stopped next to a doorway and peered inside. It waggled its long ears, making up its tiny mind, then slouched slowly into the room.", "begin": 16675.518, "end": 16684.758, "localBegin": 1063.44, "localEnd": 1072.68}, {"id": "c010_f000118", "text": "\"The key's in the lock,\" Harry muttered. \"We could lock it in.\"", "begin": 16684.758, "end": 16689.798, "localBegin": 1072.68, "localEnd": 1077.72}, {"id": "c010_f000119", "text": "\"Good idea,\" said Ron nervously.", "begin": 16689.798, "end": 16692.878, "localBegin": 1077.72, "localEnd": 1080.8}, {"id": "c010_f000120", "text": "They edged toward the open door, mouths dry, praying the troll wasn't about to come out of it. With one great leap, Harry managed to grab the key, slam the door, and lock it.", "begin": 16692.878, "end": 16703.998, "localBegin": 1080.8, "localEnd": 1091.92}, {"id": "c010_f000121", "text": "\"Yes!\"", "begin": 16703.998, "end": 16704.798, "localBegin": 1091.92, "localEnd": 1092.72}, {"id": "c010_f000122", "text": "Flushed with their victory, they started to run back up the passage, but as they reached the corner they heard something that made their hearts stop - a high, petrified scream - and it was coming from the chamber they'd just chained up.", "begin": 16704.798, "end": 16718.558, "localBegin": 1092.72, "localEnd": 1106.48}, {"id": "c010_f000123", "text": "\"Oh, no,\" said Ron, pale as the Bloody Baron.", "begin": 16718.558, "end": 16723.278, "localBegin": 1106.48, "localEnd": 1111.2}, {"id": "c010_f000124", "text": "\"It's the girls' bathroom!\" Harry gasped.", "begin": 16723.278, "end": 16726.678, "localBegin": 1111.2, "localEnd": 1114.6}, {"id": "c010_f000125", "text": "\"Hermione!\" they said together.", "begin": 16726.678, "end": 16730.078, "localBegin": 1114.6, "localEnd": 1118.0}, {"id": "c010_f000126", "text": "It was the last thing they wanted to do, but what choice did they have? Wheeling around, they sprinted back to the door and turned the key, fumbling in their panic. Harry pulled the door open and they ran inside.", "begin": 16730.078, "end": 16740.758, "localBegin": 1118.0, "localEnd": 1128.68}, {"id": "c010_f000127", "text": "Hermione Granger was shrinking against the wall opposite, looking as if she was about to faint. The troll was advancing on her, knocking the sinks off the walls as it went.", "begin": 16740.758, "end": 16750.718, "localBegin": 1128.68, "localEnd": 1138.64}, {"id": "c010_f000128", "text": "\"Confuse it!\" Harry said desperately to Ron, and, seizing a tap, he threw it as hard as he could against the wall.", "begin": 16750.718, "end": 16757.558, "localBegin": 1138.64, "localEnd": 1145.48}, {"id": "c010_f000129", "text": "The troll stopped a few feet from Hermione. It lumbered around, blinking stupidly, to see what had made the noise. Its mean little eyes saw Harry. It hesitated, then made for him instead, lifting its club as it went.", "begin": 16757.558, "end": 16773.118, "localBegin": 1145.48, "localEnd": 1161.04}, {"id": "c010_f000130", "text": "\"Oy, pea-brain!\" yelled Ron from the other side of the chamber, and he threw a metal pipe at it. The troll didn't even seem to notice the pipe hitting its shoulder, but it heard the yell and paused again, turning its ugly snout toward Ron instead, giving Harry time to run around it.", "begin": 16773.118, "end": 16789.558, "localBegin": 1161.04, "localEnd": 1177.48}, {"id": "c010_f000131", "text": "\"Come on, run, run!\" Harry yelled at Hermione, trying to pull her toward the door, but she couldn't move, she was still flat against the wall, her mouth open with terror.", "begin": 16789.558, "end": 16800.438, "localBegin": 1177.48, "localEnd": 1188.36}, {"id": "c010_f000132", "text": "The shouting and the echoes seemed to be driving the troll berserk. It roared again and started toward Ron, who was nearest and had no way to escape.", "begin": 16800.438, "end": 16809.478, "localBegin": 1188.36, "localEnd": 1197.4}, {"id": "c010_f000133", "text": "Harry then did something that was both very brave and very stupid: He took a great running jump and managed to fasten his arms around the troll's neck from behind. The troll couldn't feel Harry hanging there, but even a troll will notice if you stick a long bit of wood up its nose, and Harry's wand had still been in his hand when he'd jumped - it had gone straight up one of the troll's nostrils.", "begin": 16809.478, "end": 16833.478, "localBegin": 1197.4, "localEnd": 1221.4}, {"id": "c010_f000134", "text": "Howling with pain, the troll twisted and flailed its club, with Harry clinging on for dear life; any second, the troll was going to rip him off or catch him a terrible blow with the club.", "begin": 16833.478, "end": 16844.758, "localBegin": 1221.4, "localEnd": 1232.68}, {"id": "c010_f000135", "text": "Hermione had sunk to the floor in fright; Ron pulled out his own wand - not knowing what he was going to do he heard himself cry the first spell that came into his head: \"Wingardium Leviosa!\"", "begin": 16844.758, "end": 16857.718, "localBegin": 1232.68, "localEnd": 1245.64}, {"id": "c010_f000136", "text": "The club flew suddenly out of the troll's hand, rose high, high up into the", "begin": 16857.718, "end": 16862.518, "localBegin": 1245.64, "localEnd": 1250.44}, {"id": "c010_f000137", "text": "air, turned slowly over - and dropped, with a sickening crack, onto its owner's head. The troll swayed on the spot and then fell flat on its face, with a thud that made the whole room tremble.", "begin": 16862.518, "end": 16876.358, "localBegin": 1250.44, "localEnd": 1264.28}, {"id": "c010_f000138", "text": "Harry got to his feet. He was shaking and out of breath. Ron was standing there with his wand still raised, staring at what he had done.", "begin": 16876.358, "end": 16886.438, "localBegin": 1264.28, "localEnd": 1274.36}, {"id": "c010_f000139", "text": "It was Hermione who spoke first.", "begin": 16886.438, "end": 16889.078, "localBegin": 1274.36, "localEnd": 1277.0}, {"id": "c010_f000140", "text": "\"Is it - dead?\"", "begin": 16889.078, "end": 16890.958, "localBegin": 1277.0, "localEnd": 1278.88}, {"id": "c010_f000141", "text": "\"I don't think so,\" said Harry, \"I think it's just been knocked out.\"", "begin": 16890.958, "end": 16896.718, "localBegin": 1278.88, "localEnd": 1284.64}, {"id": "c010_f000142", "text": "He bent down and pulled his wand out of the troll's nose. It was covered in what looked like lumpy gray glue.", "begin": 16896.718, "end": 16905.518, "localBegin": 1284.64, "localEnd": 1293.44}, {"id": "c010_f000143", "text": "\"Urgh - troll boogers.\"", "begin": 16905.518, "end": 16909.118, "localBegin": 1293.44, "localEnd": 1297.04}, {"id": "c010_f000144", "text": "He wiped it on the troll's trousers.", "begin": 16909.118, "end": 16913.078, "localBegin": 1297.04, "localEnd": 1301.0}, {"id": "c010_f000145", "text": "A sudden slamming and loud footsteps made the three of them look up. They hadn't realized what a racket they had been making, but of course, someone downstairs must have heard the crashes and the troll's roars. A moment later, Professor McGonagall had come bursting into the room, closely followed by Snape, with Quirrell bringing up the rear. Quirrell took one look at the troll, let out a faint whimper, and sat quickly down on a toilet, clutching his heart.", "begin": 16913.078, "end": 16938.758, "localBegin": 1301.0, "localEnd": 1326.68}, {"id": "c010_f000146", "text": "Snape bent over the troll. Professor McGonagall was looking at Ron and Harry. Harry had never seen her look so angry. Her lips were white. Hopes of winning fifty points for Gryffindor faded quickly from Harry's mind.", "begin": 16938.758, "end": 16952.558, "localBegin": 1326.68, "localEnd": 1340.48}, {"id": "c010_f000147", "text": "\"What on earth were you thinking of?\" said Professor McGonagall, with cold fury in her voice. Harry looked at Ron, who was still standing with his wand in the air. \"You're lucky you weren't killed. Why aren't you in your dormitory?\"", "begin": 16952.558, "end": 16966.518, "localBegin": 1340.48, "localEnd": 1354.44}, {"id": "c010_f000148", "text": "Snape gave Harry a swift, piercing look. Harry looked at the floor. He wished Ron would put his wand down.", "begin": 16966.518, "end": 16973.238, "localBegin": 1354.44, "localEnd": 1361.16}, {"id": "c010_f000149", "text": "Then a small voice came out of the shadows.", "begin": 16973.238, "end": 16975.798, "localBegin": 1361.16, "localEnd": 1363.72}, {"id": "c010_f000150", "text": "\"Please, Professor McGonagall - they were looking for me.\"", "begin": 16975.798, "end": 16979.838, "localBegin": 1363.72, "localEnd": 1367.76}, {"id": "c010_f000151", "text": "\"Miss Granger!\"", "begin": 16979.838, "end": 16981.718, "localBegin": 1367.76, "localEnd": 1369.64}, {"id": "c010_f000152", "text": "Hermione had managed to get to her feet at last.", "begin": 16981.718, "end": 16984.798, "localBegin": 1369.64, "localEnd": 1372.72}, {"id": "c010_f000153", "text": "\"I went looking for the troll because I - I thought I could deal with it on my own - you know, because I've read all about them.\"", "begin": 16984.798, "end": 16991.518, "localBegin": 1372.72, "localEnd": 1379.44}, {"id": "c010_f000154", "text": "Ron dropped his wand. Hermione Granger, telling a downright lie to a teacher?", "begin": 16991.518, "end": 16997.278, "localBegin": 1379.44, "localEnd": 1385.2}, {"id": "c010_f000155", "text": "\"If they hadn't found me, I'd be dead now. Harry stuck his wand up its nose and Ron knocked it out with its own club. They didn't have time to come and fetch anyone. It was about to finish me off when they arrived.\"", "begin": 16997.278, "end": 17008.878, "localBegin": 1385.2, "localEnd": 1396.8}, {"id": "c010_f000156", "text": "Harry and Ron tried to look as though this story wasn't new to them.", "begin": 17008.878, "end": 17013.198, "localBegin": 1396.8, "localEnd": 1401.12}, {"id": "c010_f000157", "text": "\"Well - in that case . . .\" said Professor McGonagall, staring at the three of them, \"Miss Granger, you foolish girl, how could you think of tackling a mountain troll on your own?\"", "begin": 17013.198, "end": 17025.078, "localBegin": 1401.12, "localEnd": 1413.0}, {"id": "c010_f000158", "text": "Hermione hung her head. Harry was speechless. Hermione was the last person to do anything against the rules, and here she was, pretending she had, to get them out of trouble. It was as if Snape had started handing out sweets.", "begin": 17025.078, "end": 17039.798, "localBegin": 1413.0, "localEnd": 1427.72}, {"id": "c010_f000159", "text": "\"Miss Granger, five points will be taken from Gryffindor for this,\" said Professor McGonagall. \"I'm very disappointed in you. If you're not hurt at all, you'd better get off to Gryffindor Tower. Students are finishing the feast in their Houses.\"", "begin": 17039.798, "end": 17054.318, "localBegin": 1427.72, "localEnd": 1442.24}, {"id": "c010_f000160", "text": "Hermione left.", "begin": 17054.318, "end": 17055.798, "localBegin": 1442.24, "localEnd": 1443.72}, {"id": "c010_f000161", "text": "Professor McGonagall turned to Harry and Ron.", "begin": 17055.798, "end": 17058.758, "localBegin": 1443.72, "localEnd": 1446.68}, {"id": "c010_f000162", "text": "\"Well, I still say you were lucky, but not many first years could have taken on a full-grown mountain troll. You each win Gryffindor five points. Professor Dumbledore will be informed of this. You may go.\"", "begin": 17058.758, "end": 17073.478, "localBegin": 1446.68, "localEnd": 1461.4}, {"id": "c010_f000163", "text": "They hurried out of the chamber and didn't speak at all until they had climbed two floors up. It was a relief to be away from the smell of the troll, quite apart from anything else.", "begin": 17073.478, "end": 17083.238, "localBegin": 1461.4, "localEnd": 1471.16}, {"id": "c010_f000164", "text": "\"We should have gotten more than ten points,\" Ron grumbled.", "begin": 17083.238, "end": 17086.958, "localBegin": 1471.16, "localEnd": 1474.88}, {"id": "c010_f000165", "text": "\"Five, you mean, once she's taken off Hermione's.\"", "begin": 17086.958, "end": 17090.558, "localBegin": 1474.88, "localEnd": 1478.48}, {"id": "c010_f000166", "text": "\"Good of her to get us out of trouble like that,\" Ron admitted. \"Mind you, we did save her.\"", "begin": 17090.558, "end": 17096.358, "localBegin": 1478.48, "localEnd": 1484.28}, {"id": "c010_f000167", "text": "\"She might not have needed saving if we hadn't locked the thing in with her,\" Harry reminded him.", "begin": 17096.358, "end": 17101.838, "localBegin": 1484.28, "localEnd": 1489.76}, {"id": "c010_f000168", "text": "They had reached the portrait of the Fat Lady.", "begin": 17101.838, "end": 17104.638, "localBegin": 1489.76, "localEnd": 1492.56}, {"id": "c010_f000169", "text": "\"Pig snout,\" they said and entered.", "begin": 17104.638, "end": 17107.958, "localBegin": 1492.56, "localEnd": 1495.88}, {"id": "c010_f000170", "text": "The common room was packed and noisy. Everyone was eating the food that had been sent up. Hermione, however, stood alone by the door, waiting for them. There was a very embarrassed pause. Then, none of them looking at each other, they all said \"Thanks,\" and hurried off to get plates.", "begin": 17107.958, "end": 17128.078, "localBegin": 1495.88, "localEnd": 1516.0}, {"id": "c010_f000171", "text": "But from that moment on, Hermione Granger became their friend. There are some things you can't share without ending up liking each other, and knocking out a twelve-foot mountain troll is one of them.", "begin": 17128.078, "end": 17144.558, "localBegin": 1516.0, "localEnd": 1532.48}]}, {"kind": "chapter", "number": 11, "title": "Quidditch", "audio": "../Harry Potter and the Sorcerer's Stone, Book 1 (Unabridged)/011 - Harry Potter and the Sorcerer's Stone, Book 1 (Unabridged).mp3", "start": 17144.595, "end": 18419.278, "duration": 1274.683, "paragraphs": [{"id": "c011_f000001", "text": "Chapter Eleven. Quidditch.", "begin": 17144.595, "end": 17148.955, "localBegin": 0.0, "localEnd": 4.36}, {"id": "c011_f000002", "text": "As they entered November, the weather turned very cold. The mountains around the school became icy gray and the lake like chilled steel. Every morning the ground was covered in frost. Hagrid could be seen from the upstairs windows defrosting broomsticks on the Quidditch field, bundled up in a long moleskin overcoat, rabbit fur gloves, and enormous beaverskin boots.", "begin": 17148.955, "end": 17173.875, "localBegin": 4.36, "localEnd": 29.28}, {"id": "c011_f000003", "text": "The Quidditch season had begun. On Saturday, Harry would be playing in his first match after weeks of training: Gryffindor versus Slytherin. If Gryffindor won, they would move up into second place in the House Championship.", "begin": 17173.875, "end": 17188.595, "localBegin": 29.28, "localEnd": 44.0}, {"id": "c011_f000004", "text": "Hardly anyone had seen Harry play because Wood had decided that, as their secret weapon, Harry should be kept, well, secret. But the news that he was playing Seeker had leaked out somehow, and Harry didn't know which was worse - people telling him he'd be brilliant or people telling him they'd be running around underneath him holding a mattress.", "begin": 17188.595, "end": 17210.835, "localBegin": 44.0, "localEnd": 66.24}, {"id": "c011_f000005", "text": "It was really lucky that Harry now had Hermione as a friend. He didn't know how he'd have gotten through all his homework without her, what with all the lastminute Quidditch practice Wood was making them do. She had also lent him Quidditch Through the Ages, which turned out to be a very interesting read.", "begin": 17210.835, "end": 17228.795, "localBegin": 66.24, "localEnd": 84.2}, {"id": "c011_f000006", "text": "Harry learned that there were seven hundred ways of committing a Quidditch foul and that all of them had happened during a World Cup match in 1473; that Seekers were usually the smallest and fastest players, and that most serious Quidditch accidents seemed to happen to them; that although people rarely died playing Quidditch, referees had been known to vanish and turn up months later in the Sahara Desert.", "begin": 17228.795, "end": 17255.355, "localBegin": 84.2, "localEnd": 110.76}, {"id": "c011_f000007", "text": "Hermione had become a bit more relaxed about breaking rules since Harry and Ron had saved her from the mountain troll, and she was much nicer for it. The day before Harry's first Quidditch match the three of them were out in the freezing courtyard during break, and she had conjured them up a bright blue fire that could be carried around in a jam jar. They were standing with their backs to it, getting warm, when Snape crossed the yard. Harry noticed at once that Snape was limping. Harry, Ron, and Hermione moved closer together to block the fire from view; they were sure it wouldn't be allowed. Unfortunately, something about their guilty faces caught Snape's eye. He limped over. He hadn't seen the fire, but he seemed to be looking for a reason to tell them off anyway.", "begin": 17255.355, "end": 17300.595, "localBegin": 110.76, "localEnd": 156.0}, {"id": "c011_f000008", "text": "\"What's that you've got there, Potter?\"", "begin": 17300.595, "end": 17305.395, "localBegin": 156.0, "localEnd": 160.8}, {"id": "c011_f000009", "text": "It was Quidditch Through the Ages. Harry showed him.", "begin": 17305.395, "end": 17308.795, "localBegin": 160.8, "localEnd": 164.2}, {"id": "c011_f000010", "text": "\"Library books are not to be taken outside the school,\" said Snape. \"Give it to me. Five points from Gryffindor.\"", "begin": 17308.795, "end": 17317.795, "localBegin": 164.2, "localEnd": 173.2}, {"id": "c011_f000011", "text": "\"He's just made that rule up,\" Harry muttered angrily as Snape limped away. \"Wonder what's wrong with his leg?\"", "begin": 17317.795, "end": 17325.915, "localBegin": 173.2, "localEnd": 181.32}, {"id": "c011_f000012", "text": "\"Dunno, but I hope it's really hurting him,\" said Ron bitterly.", "begin": 17325.915, "end": 17334.315, "localBegin": 181.32, "localEnd": 189.72}, {"id": "c011_f000013", "text": "The Gryffindor common room was very noisy that evening. Harry, Ron, and Hermione sat together next to a window. Hermione was checking Harry and Ron's Charms homework for them. She would never let them copy (\"How will you learn?\"), but by asking her to read it through, they got the right answers anyway.", "begin": 17334.315, "end": 17353.355, "localBegin": 189.72, "localEnd": 208.76}, {"id": "c011_f000014", "text": "Harry felt restless. He wanted Quidditch Through the Ages back, to take his mind off his nerves about tomorrow. Why should he be afraid of Snape? Getting up, he told Ron and Hermione he was going to ask Snape if he could have it.", "begin": 17353.355, "end": 17366.915, "localBegin": 208.76, "localEnd": 222.32}, {"id": "c011_f000015", "text": "\"Better you than me,\" they said together, but Harry had an idea that Snape wouldn't refuse if there were other teachers listening.", "begin": 17366.915, "end": 17375.235, "localBegin": 222.32, "localEnd": 230.64}, {"id": "c011_f000016", "text": "He made his way down to the staffroom and knocked. There was no answer. He knocked again. Nothing.", "begin": 17375.235, "end": 17382.155, "localBegin": 230.64, "localEnd": 237.56}, {"id": "c011_f000017", "text": "Perhaps Snape had left the book in there? It was worth a try. He pushed the door ajar and peered inside - and a horrible scene met his eyes.", "begin": 17382.155, "end": 17392.195, "localBegin": 237.56, "localEnd": 247.6}, {"id": "c011_f000018", "text": "Snape and Filch were inside, alone. Snape was holding his robes above his knees. One of his legs was bloody and mangled. Filch was handing Snape bandages.", "begin": 17392.195, "end": 17403.795, "localBegin": 247.6, "localEnd": 259.2}, {"id": "c011_f000019", "text": "\"Blasted thing,\" Snape was saying. \"How are you supposed to keep your eyes on all three heads at once?\"", "begin": 17403.795, "end": 17412.835, "localBegin": 259.2, "localEnd": 268.24}, {"id": "c011_f000020", "text": "Harry tried to shut the door quietly, but -", "begin": 17412.835, "end": 17415.195, "localBegin": 268.24, "localEnd": 270.6}, {"id": "c011_f000021", "text": "\"POTTER!\"", "begin": 17415.195, "end": 17417.395, "localBegin": 270.6, "localEnd": 272.8}, {"id": "c011_f000022", "text": "Snape's face was twisted with fury as he dropped his robes quickly to hide his leg. Harry gulped.", "begin": 17417.395, "end": 17422.875, "localBegin": 272.8, "localEnd": 278.28}, {"id": "c011_f000023", "text": "\"I just wondered if I could have my book back.\"", "begin": 17422.875, "end": 17426.395, "localBegin": 278.28, "localEnd": 281.8}, {"id": "c011_f000024", "text": "\"GET OUT! OUT!\"", "begin": 17426.395, "end": 17429.755, "localBegin": 281.8, "localEnd": 285.16}, {"id": "c011_f000025", "text": "Harry left, before Snape could take any more points from Gryffindor. He sprinted back upstairs.", "begin": 17429.755, "end": 17435.395, "localBegin": 285.16, "localEnd": 290.8}, {"id": "c011_f000026", "text": "\"Did you get it?\" Ron asked as Harry joined them. \"What's the matter?\"", "begin": 17435.395, "end": 17441.155, "localBegin": 290.8, "localEnd": 296.56}, {"id": "c011_f000027", "text": "In a low whisper, Harry told them what he'd seen.", "begin": 17441.155, "end": 17443.475, "localBegin": 296.56, "localEnd": 298.88}, {"id": "c011_f000028", "text": "\"You know what this means?\" he finished breathlessly. \"He tried to get past that three-headed dog at Halloween! That's where he was going when we saw him he's after whatever it's guarding! And I'd bet my broomstick he let that troll in, to make a diversion!\"", "begin": 17443.475, "end": 17461.875, "localBegin": 298.88, "localEnd": 317.28}, {"id": "c011_f000029", "text": "Hermione's eyes were wide.", "begin": 17461.875, "end": 17463.555, "localBegin": 317.28, "localEnd": 318.96}, {"id": "c011_f000030", "text": "\"No - he wouldn't,\" she said. \"I know he's not very nice, but he wouldn't try and steal something Dumbledore was keeping safe.\"", "begin": 17463.555, "end": 17472.835, "localBegin": 318.96, "localEnd": 328.24}, {"id": "c011_f000031", "text": "\"Honestly, Hermione, you think all teachers are saints or something,\" snapped Ron. \"I'm with Harry. I wouldn't put anything past Snape. But what's he after? What's that dog guarding?\"", "begin": 17472.835, "end": 17486.555, "localBegin": 328.24, "localEnd": 341.96}, {"id": "c011_f000032", "text": "Harry went to bed with his head buzzing with the same question. Neville was snoring loudly, but Harry couldn't sleep. He tried to empty his mind - he needed to sleep, he had to, he had his first Quidditch match in a few hours - but the expression on Snape's face when Harry had seen his leg wasn't easy to forget.", "begin": 17486.555, "end": 17509.675, "localBegin": 341.96, "localEnd": 365.08}, {"id": "c011_f000033", "text": "The next morning dawned very bright and cold. The Great Hall was full of the delicious smell of fried sausages and the cheerful chatter of everyone looking forward to a good Quidditch match.", "begin": 17509.675, "end": 17520.635, "localBegin": 365.08, "localEnd": 376.04}, {"id": "c011_f000034", "text": "\"You've got to eat some breakfast.\"", "begin": 17520.635, "end": 17522.675, "localBegin": 376.04, "localEnd": 378.08}, {"id": "c011_f000035", "text": "\"I don't want anything.\"", "begin": 17522.675, "end": 17523.715, "localBegin": 378.08, "localEnd": 379.12}, {"id": "c011_f000036", "text": "\"Just a bit of toast,\" wheedled Hermione.", "begin": 17523.715, "end": 17526.115, "localBegin": 379.12, "localEnd": 381.52}, {"id": "c011_f000037", "text": "\"I'm not hungry.\"", "begin": 17526.115, "end": 17528.435, "localBegin": 381.52, "localEnd": 383.84}, {"id": "c011_f000038", "text": "Harry felt terrible. In an hour's time he'd be walking onto the field.", "begin": 17528.435, "end": 17533.035, "localBegin": 383.84, "localEnd": 388.44}, {"id": "c011_f000039", "text": "\"Harry, you need your strength,\" said Seamus Finnigan. \"Seekers are always the ones who get clobbered by the other team.\"", "begin": 17533.035, "end": 17541.315, "localBegin": 388.44, "localEnd": 396.72}, {"id": "c011_f000040", "text": "\"Thanks, Seamus,\" said Harry, watching Seamus pile ketchup on his sausages.", "begin": 17541.315, "end": 17549.915, "localBegin": 396.72, "localEnd": 405.32}, {"id": "c011_f000041", "text": "By eleven o'clock the whole school seemed to be out in the stands around the Quidditch pitch. Many students had binoculars. The seats might be raised high in the air, but it was still difficult to see what was going on sometimes.", "begin": 17549.915, "end": 17563.675, "localBegin": 405.32, "localEnd": 419.08}, {"id": "c011_f000042", "text": "Ron and Hermione joined Neville, Seamus, and Dean the West Ham fan up in the top row. As a surprise for Harry, they had painted a large banner on one of the sheets Scabbers had ruined. It said Potter for President, and Dean, who was good at drawing, had done a large Gryffindor lion underneath
