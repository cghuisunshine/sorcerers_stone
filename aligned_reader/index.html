d Percy Weasley pompously across Harry as \"Zabini, Blaise,\" was made a Slytherin. Professor McGonagall rolled up her scroll and took the Sorting Hat away.", "begin": 11816.786, "end": 11830.826, "localBegin": 904.52, "localEnd": 918.56}, {"id": "c007_f000107", "text": "Harry looked down at his empty gold plate. He had only just realized how hungry he was. The pumpkin pasties seemed ages ago.", "begin": 11830.826, "end": 11840.306, "localBegin": 918.56, "localEnd": 928.04}, {"id": "c007_f000108", "text": "Albus Dumbledore had gotten to his feet. He was beaming at the students, his arms opened wide, as if nothing could have pleased him more than to see them all there.", "begin": 11840.306, "end": 11849.706, "localBegin": 928.04, "localEnd": 937.44}, {"id": "c007_f000109", "text": "\"Welcome!\" he said. \"Welcome to a new year at Hogwarts! Before we begin our banquet, I would like to say a few words. And here they are: Nitwit! Blubber! Oddment! Tweak!", "begin": 11849.706, "end": 11867.826, "localBegin": 937.44, "localEnd": 955.56}, {"id": "c007_f000110", "text": "\"Thank you!\"", "begin": 11867.826, "end": 11869.066, "localBegin": 955.56, "localEnd": 956.8}, {"id": "c007_f000111", "text": "He sat back down. Everybody clapped and cheered. Harry didn't know whether to laugh or not.", "begin": 11869.066, "end": 11875.346, "localBegin": 956.8, "localEnd": 963.08}, {"id": "c007_f000112", "text": "\"Is he - a bit mad?\" he asked Percy uncertainly.", "begin": 11875.346, "end": 11879.626, "localBegin": 963.08, "localEnd": 967.36}, {"id": "c007_f000113", "text": "\"Mad?\" said Percy airily. \"He's a genius! Best wizard in the world! But he is a bit mad, yes. Potatoes, Harry?\"", "begin": 11879.626, "end": 11890.386, "localBegin": 967.36, "localEnd": 978.12}, {"id": "c007_f000114", "text": "Harry's mouth fell open. The dishes in front of him were now piled with food. He had never seen so many things he liked to eat on one table: roast beef, roast chicken, pork chops and lamb chops, sausages, bacon and steak, boiled potatoes, roast potatoes, fries, Yorkshire pudding, peas, carrots, gravy, ketchup, and, for some strange reason, peppermint humbugs.", "begin": 11890.386, "end": 11914.546, "localBegin": 978.12, "localEnd": 1002.28}, {"id": "c007_f000115", "text": "The Dursleys had never exactly starved Harry, but he'd never been allowed to eat as much as he liked. Dudley had always taken anything that Harry really wanted, even if it made him sick. Harry piled his plate with a bit of everything except the peppermints and began to eat. It was all delicious.", "begin": 11914.546, "end": 11934.266, "localBegin": 1002.28, "localEnd": 1022.0}, {"id": "c007_f000116", "text": "\"That does look good,\" said the ghost in the ruff sadly, watching Harry cut up", "begin": 11934.266, "end": 11940.226, "localBegin": 1022.0, "localEnd": 1027.96}, {"id": "c007_f000117", "text": "his steak.", "begin": 11940.226, "end": 11940.826, "localBegin": 1027.96, "localEnd": 1028.56}, {"id": "c007_f000118", "text": "\"Can't you - ?\"", "begin": 11940.826, "end": 11942.346, "localBegin": 1028.56, "localEnd": 1030.08}, {"id": "c007_f000119", "text": "\"I haven't eaten for nearly five hundred years,\" said the ghost. \"I don't need to, of course, but one does miss it. I don't think I've introduced myself? Sir Nicholas de Mimsy-Porpington at your service. Resident ghost of Gryffindor Tower.\"", "begin": 11942.346, "end": 11960.546, "localBegin": 1030.08, "localEnd": 1048.28}, {"id": "c007_f000120", "text": "\"I know who you are!\" said Ron suddenly. \"My brothers told me about you you're Nearly Headless Nick!\"", "begin": 11960.546, "end": 11967.346, "localBegin": 1048.28, "localEnd": 1055.08}, {"id": "c007_f000121", "text": "\"I would prefer you to call me Sir Nicholas de Mimsy - \" the ghost began stiffly, but sandy-haired Seamus Finnigan interrupted.", "begin": 11967.346, "end": 11976.626, "localBegin": 1055.08, "localEnd": 1064.36}, {"id": "c007_f000122", "text": "\"Nearly Headless? How can you be nearly headless?\"", "begin": 11976.626, "end": 11981.066, "localBegin": 1064.36, "localEnd": 1068.8}, {"id": "c007_f000123", "text": "Sir Nicholas looked extremely miffed, as if their little chat wasn't going at all the way he wanted.", "begin": 11981.066, "end": 11987.306, "localBegin": 1068.8, "localEnd": 1075.04}, {"id": "c007_f000124", "text": "\"Like this,\" he said irritably. He seized his left ear and pulled. His whole head swung off his neck and fell onto his shoulder as if it was on a hinge. Someone had obviously tried to behead him, but not done it properly. Looking pleased at the stunned looks on their faces, Nearly Headless Nick flipped his head back onto his neck, coughed, and said, \"So - new Gryffindors! I hope you're going to help us win the House Championship this year? Gryffindors have never gone so long without winning. Slytherins have got the Cup six years in a row! The Bloody Baron's becoming almost unbearable - he's the Slytherin ghost.\"", "begin": 11987.306, "end": 12033.306, "localBegin": 1075.04, "localEnd": 1121.04}, {"id": "c007_f000125", "text": "Harry looked over at the Slytherin table and saw a horrible ghost sitting there, with blank staring eyes, a gaunt face, and robes stained with silver blood. He was right next to Malfoy who, Harry was pleased to see, didn't look too pleased with the seating arrangements.", "begin": 12033.306, "end": 12052.266, "localBegin": 1121.04, "localEnd": 1140.0}, {"id": "c007_f000126", "text": "\"How did he get covered in blood?\" asked Seamus with great interest.", "begin": 12052.266, "end": 12057.506, "localBegin": 1140.0, "localEnd": 1145.24}, {"id": "c007_f000127", "text": "\"I've never asked,\" said Nearly Headless Nick delicately.", "begin": 12057.506, "end": 12063.106, "localBegin": 1145.24, "localEnd": 1150.84}, {"id": "c007_f000128", "text": "When everyone had eaten as much as they could, the remains of the food faded from the plates, leaving them sparkling clean as before. A moment later the desserts appeared. Blocks of ice cream in every flavor you could think of, apple pies, treacle tarts, chocolate éclairs and jam doughnuts, trifle, strawberries, Jell-O, rice pudding . . .", "begin": 12063.106, "end": 12085.666, "localBegin": 1150.84, "localEnd": 1173.4}, {"id": "c007_f000129", "text": "As Harry helped himself to a treacle tart, the talk turned to their families.", "begin": 12085.666, "end": 12090.306, "localBegin": 1173.4, "localEnd": 1178.04}, {"id": "c007_f000130", "text": "\"I'm half-and-half,\" said Seamus. \"Me dad's a Muggle. Mum didn't tell him she was a witch 'til after they were married. Bit of a nasty shock for him.\"", "begin": 12090.306, "end": 12100.986, "localBegin": 1178.04, "localEnd": 1188.72}, {"id": "c007_f000131", "text": "The others laughed.", "begin": 12100.986, "end": 12102.586, "localBegin": 1188.72, "localEnd": 1190.32}, {"id": "c007_f000132", "text": "\"What about you, Neville?\" said Ron.", "begin": 12102.586, "end": 12104.906, "localBegin": 1190.32, "localEnd": 1192.64}, {"id": "c007_f000133", "text": "\"Well, my gran brought me up and she's a witch,\" said Neville, \"but the family thought I was all-Muggle for ages. My Great Uncle Algie kept trying to catch me off my guard and force some magic out of me - he pushed me off the end of Blackpool pier once, I nearly drowned - but nothing happened until I was eight. Great Uncle Algie came round for dinner, and he was hanging me out of an upstairs window by the ankles when my Great Auntie Enid offered him a meringue and he accidentally let go. But I bounced - all the way down the garden and into the road. They were all really pleased, Gran was crying, she was so happy. And you should have seen their faces when I got in here - they thought I might not be magic enough to come, you see. Great Uncle Algie was so pleased he bought me my toad.\"", "begin": 12104.906, "end": 12160.786, "localBegin": 1192.64, "localEnd": 1248.52}, {"id": "c007_f000134", "text": "On Harry's other side, Percy Weasley and Hermione were talking about lessons (\"I do hope they start right away, there's so much to learn, I'm particularly interested in Transfiguration, you know, turning something into something else, of course, it's supposed to be very difficult - \"; \"You'll be starting small, just matches into needles and that sort of thing - \").", "begin": 12160.786, "end": 12183.066, "localBegin": 1248.52, "localEnd": 1270.8}, {"id": "c007_f000135", "text": "Harry, who was starting to feel warm and sleepy, looked up at the High Table again. Hagrid was drinking deeply from his goblet. Professor McGonagall was talking to Professor Dumbledore. Professor Quirrell, in his absurd turban, was talking to a teacher with greasy black hair, a hooked nose, and sallow skin.", "begin": 12183.066, "end": 12202.746, "localBegin": 1270.8, "localEnd": 1290.48}, {"id": "c007_f000136", "text": "It happened very suddenly. The hook-nosed teacher looked past Quirrell's turban straight into Harry's eyes - and a sharp, hot pain shot across the scar on Harry's forehead.", "begin": 12202.746, "end": 12212.866, "localBegin": 1290.48, "localEnd": 1300.6}, {"id": "c007_f000137", "text": "\"Ouch!\" Harry clapped a hand to his head.", "begin": 12212.866, "end": 12215.386, "localBegin": 1300.6, "localEnd": 1303.12}, {"id": "c007_f000138", "text": "\"What is it?\" asked Percy.", "begin": 12215.386, "end": 12217.306, "localBegin": 1303.12, "localEnd": 1305.04}, {"id": "c007_f000139", "text": "\"N-nothing.\"", "begin": 12217.306, "end": 12218.226, "localBegin": 1305.04, "localEnd": 1305.96}, {"id": "c007_f000140", "text": "The pain had gone as quickly as it had come. Harder to shake off was the feeling Harry had gotten from the teacher's look - a feeling that he didn't like Harry at all.", "begin": 12218.226, "end": 12228.226, "localBegin": 1305.96, "localEnd": 1315.96}, {"id": "c007_f000141", "text": "\"Who's that teacher talking to Professor Quirrell?\" he asked Percy.", "begin": 12228.226, "end": 12233.346, "localBegin": 1315.96, "localEnd": 1321.08}, {"id": "c007_f000142", "text": "\"Oh, you know Quirrell already, do you? No wonder he's looking so nervous, that's Professor Snape. He teaches Potions, but he doesn't want to - everyone knows he's after Quirrell's job. Knows an awful lot about the Dark Arts, Snape.\"", "begin": 12233.346, "end": 12248.826, "localBegin": 1321.08, "localEnd": 1336.56}, {"id": "c007_f000143", "text": "Harry watched Snape for a while, but Snape didn't look at him again.", "begin": 12248.826, "end": 12253.266, "localBegin": 1336.56, "localEnd": 1341.0}, {"id": "c007_f000144", "text": "At last, the desserts too disappeared, and Professor Dumbledore got to his feet again. The hall fell silent.", "begin": 12253.266, "end": 12261.186, "localBegin": 1341.0, "localEnd": 1348.92}, {"id": "c007_f000145", "text": "\"Ahem - just a few more words now that we are all fed and watered. I have a few start-of-term notices to give you.", "begin": 12261.186, "end": 12271.306, "localBegin": 1348.92, "localEnd": 1359.04}, {"id": "c007_f000146", "text": "\"First years should note that the forest on the grounds is forbidden to all pupils. And a few of our older students would do well to remember that as well.\"", "begin": 12271.306, "end": 12282.146, "localBegin": 1359.04, "localEnd": 1369.88}, {"id": "c007_f000147", "text": "Dumbledore's twinkling eyes flashed in the direction of the Weasley twins.", "begin": 12282.146, "end": 12286.626, "localBegin": 1369.88, "localEnd": 1374.36}, {"id": "c007_f000148", "text": "\"I have also been asked by Mr. Filch, the caretaker, to remind you all that no magic should be used between classes in the corridors.", "begin": 12286.626, "end": 12296.186, "localBegin": 1374.36, "localEnd": 1383.92}, {"id": "c007_f000149", "text": "\"Quidditch trials will be held in the second week of the term. Anyone interested in playing for their House teams should contact Madam Hooch.", "begin": 12296.186, "end": 12305.706, "localBegin": 1383.92, "localEnd": 1393.44}, {"id": "c007_f000150", "text": "\"And finally, I must tell you that this year, the third-floor corridor on the right-hand side is out of bounds to everyone who does not wish to die a very painful death.\"", "begin": 12305.706, "end": 12318.546, "localBegin": 1393.44, "localEnd": 1406.28}, {"id": "c007_f000151", "text": "Harry laughed, but he was one of the few who did.", "begin": 12318.546, "end": 12322.506, "localBegin": 1406.28, "localEnd": 1410.24}, {"id": "c007_f000152", "text": "\"He's not serious?\" he muttered to Percy.", "begin": 12322.506, "end": 12326.466, "localBegin": 1410.24, "localEnd": 1414.2}, {"id": "c007_f000153", "text": "\"Must be,\" said Percy, frowning at Dumbledore. \"It's odd, because he usually gives us a reason why we're not allowed to go somewhere - the forest's full of dangerous beasts, everyone knows that. I do think he might have told us prefects, at least.\"", "begin": 12326.466, "end": 12341.746, "localBegin": 1414.2, "localEnd": 1429.48}, {"id": "c007_f000154", "text": "\"And now, before we go to bed, let us sing the school song!\" cried Dumbledore. Harry noticed that the other teachers' smiles had become rather fixed.", "begin": 12341.746, "end": 12353.586, "localBegin": 1429.48, "localEnd": 1441.32}, {"id": "c007_f000155", "text": "Dumbledore gave his wand a little flick, as if he was trying to get a fly off the end, and a long golden ribbon flew out of it, which rose high above the tables and twisted itself, snakelike, into words.", "begin": 12353.586, "end": 12366.626, "localBegin": 1441.32, "localEnd": 1454.36}, {"id": "c007_f000156", "text": "\"Everyone pick their favorite tune,\" said Dumbledore, \"and off we go!\"", "begin": 12366.626, "end": 12373.586, "localBegin": 1454.36, "localEnd": 1461.32}, {"id": "c007_f000157", "text": "And the school bellowed:", "begin": 12373.586, "end": 12375.626, "localBegin": 1461.32, "localEnd": 1463.36}, {"id": "c007_f000158", "text": "\"Hogwarts, Hogwarts, Hoggy Warty Hogwarts,", "begin": 12375.626, "end": 12378.786, "localBegin": 1463.36, "localEnd": 1466.52}, {"id": "c007_f000159", "text": "Teach us something please,", "begin": 12378.786, "end": 12380.866, "localBegin": 1466.52, "localEnd": 1468.6}, {"id": "c007_f000160", "text": "Whether we be old and bald", "begin": 12380.866, "end": 12383.266, "localBegin": 1468.6, "localEnd": 1471.0}, {"id": "c007_f000161", "text": "Or young with scabby knees,", "begin": 12383.266, "end": 12385.506, "localBegin": 1471.0, "localEnd": 1473.24}, {"id": "c007_f000162", "text": "Our heads could do with filling", "begin": 12385.506, "end": 12387.666, "localBegin": 1473.24, "localEnd": 1475.4}, {"id": "c007_f000163", "text": "With some interesting stuff,", "begin": 12387.666, "end": 12389.746, "localBegin": 1475.4, "localEnd": 1477.48}, {"id": "c007_f000164", "text": "For now they're bare and full of air,", "begin": 12389.746, "end": 12392.506, "localBegin": 1477.48, "localEnd": 1480.24}, {"id": "c007_f000165", "text": "Dead flies and bits of fluff,", "begin": 12392.506, "end": 12394.346, "localBegin": 1480.24, "localEnd": 1482.08}, {"id": "c007_f000166", "text": "So teach us things worth knowing,", "begin": 12394.346, "end": 12396.906, "localBegin": 1482.08, "localEnd": 1484.64}, {"id": "c007_f000167", "text": "Bring back what we've forgot,", "begin": 12396.906, "end": 12398.986, "localBegin": 1484.64, "localEnd": 1486.72}, {"id": "c007_f000168", "text": "Just do your best, we'll do the rest,", "begin": 12398.986, "end": 12401.786, "localBegin": 1486.72, "localEnd": 1489.52}, {"id": "c007_f000169", "text": "And learn until our brains all rot.\"", "begin": 12401.786, "end": 12405.626, "localBegin": 1489.52, "localEnd": 1493.36}, {"id": "c007_f000170", "text": "Everybody finished the song at different times. At last, only the Weasley twins were left singing along to a very slow funeral march. Dumbledore conducted their last few lines with his wand and when they had finished, he was one of those who clapped loudest.", "begin": 12405.626, "end": 12420.386, "localBegin": 1493.36, "localEnd": 1508.12}, {"id": "c007_f000171", "text": "\"Ah, music,\" he said, wiping his eyes. \"A magic beyond all we do here! And now, bedtime. Off you trot!\"", "begin": 12420.386, "end": 12430.506, "localBegin": 1508.12, "localEnd": 1518.24}, {"id": "c007_f000172", "text": "The Gryffindor first years followed Percy through the chattering crowds, out of the Great Hall, and up the marble staircase. Harry's legs were like lead again, but only because he was so tired and full of food. He was too sleepy even to be surprised that the people in the portraits along the corridors whispered and pointed as they passed, or that twice Percy led them through doorways hidden behind sliding panels and hanging tapestries. They climbed more staircases, yawning and dragging their feet, and Harry was just wondering how much farther they had to go when they came to a sudden halt.", "begin": 12430.506, "end": 12465.746, "localBegin": 1518.24, "localEnd": 1553.48}, {"id": "c007_f000173", "text": "A bundle of walking sticks was floating in midair ahead of them, and as Percy took a step toward them they started throwing themselves at him.", "begin": 12465.746, "end": 12474.306, "localBegin": 1553.48, "localEnd": 1562.04}, {"id": "c007_f000174", "text": "\"Peeves,\" Percy whispered to the first years. \"A poltergeist.\" He raised his voice, \"Peeves - show yourself.\"", "begin": 12474.306, "end": 12482.106, "localBegin": 1562.04, "localEnd": 1569.84}, {"id": "c007_f000175", "text": "A loud, rude sound, like the air being let out of a balloon, answered.", "begin": 12482.106, "end": 12487.586, "localBegin": 1569.84, "localEnd": 1575.32}, {"id": "c007_f000176", "text": "\"Do you want me to go to the Bloody Baron?\"", "begin": 12487.586, "end": 12490.986, "localBegin": 1575.32, "localEnd": 1578.72}, {"id": "c007_f000177", "text": "There was a pop, and a little man with wicked, dark eyes and a wide mouth appeared, floating cross-legged in the air, clutching the walking sticks.", "begin": 12490.986, "end": 12500.466, "localBegin": 1578.72, "localEnd": 1588.2}, {"id": "c007_f000178", "text": "\"Oooooooh!\" he said, with an evil cackle. \"Ickle Firsties! What fun!\"", "begin": 12500.466, "end": 12506.746, "localBegin": 1588.2, "localEnd": 1594.48}, {"id": "c007_f000179", "text": "He swooped suddenly at them. They all ducked.", "begin": 12506.746, "end": 12509.826, "localBegin": 1594.48, "localEnd": 1597.56}, {"id": "c007_f000180", "text": "\"Go away, Peeves, or the Baron'll hear about this, I mean it!\" barked Percy.", "begin": 12509.826, "end": 12515.346, "localBegin": 1597.56, "localEnd": 1603.08}, {"id": "c007_f000181", "text": "Peeves stuck out his tongue and vanished, dropping the walking sticks on Neville's head. They heard him zooming away, rattling coats of armor as he passed.", "begin": 12515.346, "end": 12524.786, "localBegin": 1603.08, "localEnd": 1612.52}, {"id": "c007_f000182", "text": "\"You want to watch out for Peeves,\" said Percy, as they set off again. \"The Bloody Baron's the only one who can control him, he won't even listen to us prefects. Here we are.\"", "begin": 12524.786, "end": 12535.786, "localBegin": 1612.52, "localEnd": 1623.52}, {"id": "c007_f000183", "text": "At the very end of the corridor hung a portrait of a very fat woman in a pink silk dress.", "begin": 12535.786, "end": 12542.306, "localBegin": 1623.52, "localEnd": 1630.04}, {"id": "c007_f000184", "text": "\"Password?\" she said.", "begin": 12542.306, "end": 12544.386, "localBegin": 1630.04, "localEnd": 1632.12}, {"id": "c007_f000185", "text": "\"Caput Draconis,\" said Percy, and the portrait swung forward to reveal a round hole in the wall. They all scrambled through it - Neville needed a leg up - and found themselves in the Gryffindor common room, a cozy, round room full of squashy armchairs.", "begin": 12544.386, "end": 12561.786, "localBegin": 1632.12, "localEnd": 1649.52}, {"id": "c007_f000186", "text": "Percy directed the girls through one door to their dormitory and the boys through another. At the top of a spiral staircase - they were obviously in one of the towers - they found their beds at last: five four-posters hung with deep red, velvet curtains. Their trunks had already been brought up. Too tired to talk much, they pulled on their pajamas and fell into bed.", "begin": 12561.786, "end": 12583.546, "localBegin": 1649.52, "localEnd": 1671.28}, {"id": "c007_f000187", "text": "\"Great food, isn't it?\" Ron muttered to Harry through the hangings. \"Get off, Scabbers! He's chewing my sheets.\"", "begin": 12583.546, "end": 12591.906, "localBegin": 1671.28, "localEnd": 1679.64}, {"id": "c007_f000188", "text": "Harry was going to ask Ron if he'd had any of the treacle tart, but he fell asleep almost at once.", "begin": 12591.906, "end": 12598.386, "localBegin": 1679.64, "localEnd": 1686.12}, {"id": "c007_f000189", "text": "Perhaps Harry had eaten a bit too much, because he had a very strange dream. He was wearing Professor Quirrell's turban, which kept talking to him, telling him he must transfer to Slytherin at once, because it was his destiny. Harry told the turban he didn't want to be in Slytherin; it got heavier and heavier; he tried to pull it off but it tightened painfully - and there was Malfoy, laughing at him as he struggled with it - then Malfoy turned into the hook-nosed teacher, Snape, whose laugh became high and cold - there was a burst of green light and Harry woke, sweating and shaking.", "begin": 12598.386, "end": 12631.786, "localBegin": 1686.12, "localEnd": 1719.52}, {"id": "c007_f000190", "text": "He rolled over and fell asleep again, and when he woke next day, he didn't remember the dream at all.", "begin": 12631.786, "end": 12641.346, "localBegin": 1719.52, "localEnd": 1729.08}]}, {"kind": "chapter", "number": 8, "title": "The Potions Master", "audio": "../Harry Potter and the Sorcerer's Stone, Book 1 (Unabridged)/008 - Harry Potter and the Sorcerer's Stone, Book 1 (Unabridged).mp3", "start": 12641.363, "end": 13753.831, "duration": 1112.468, "paragraphs": [{"id": "c008_f000001", "text": "Chapter Eight. The Potions Master.", "begin": 12641.363, "end": 12646.323, "localBegin": 0.0, "localEnd": 4.96}, {"id": "c008_f000002", "text": "There, look.\"", "begin": 12646.323, "end": 12647.323, "localBegin": 4.96, "localEnd": 5.96}, {"id": "c008_f000003", "text": "\"Where?\"", "begin": 12647.323, "end": 12647.683, "localBegin": 5.96, "localEnd": 6.32}, {"id": "c008_f000004", "text": "\"Next to the tall kid with the red hair.\"", "begin": 12647.683, "end": 12649.963, "localBegin": 6.32, "localEnd": 8.6}, {"id": "c008_f000005", "text": "\"Wearing the glasses?\"", "begin": 12649.963, "end": 12650.803, "localBegin": 8.6, "localEnd": 9.44}, {"id": "c008_f000006", "text": "\"Did you see his face?\"", "begin": 12650.803, "end": 12652.043, "localBegin": 9.44, "localEnd": 10.68}, {"id": "c008_f000007", "text": "\"Did you see his scar?\"", "begin": 12652.043, "end": 12654.243, "localBegin": 10.68, "localEnd": 12.88}, {"id": "c008_f000008", "text": "Whispers followed Harry from the moment he left his dormitory the next day. People lining up outside classrooms stood on tiptoe to get a look at him, or doubled back to pass him in the corridors again, staring. Harry wished they wouldn't, because he was trying to concentrate on finding his way to classes.", "begin": 12654.243, "end": 12672.603, "localBegin": 12.88, "localEnd": 31.24}, {"id": "c008_f000009", "text": "There were a hundred and forty-two staircases at Hogwarts: wide, sweeping ones; narrow, rickety ones; some that led somewhere different on a Friday; some with a vanishing step halfway up that you had to remember to jump. Then there were doors that wouldn't open unless you asked politely, or tickled them in exactly the right place, and doors that weren't really doors at all, but solid walls just pretending. It was also very hard to remember where anything was, because it all seemed to move around a lot. The people in the portraits kept going to visit each other, and Harry was sure the coats of armor could walk.", "begin": 12672.603, "end": 12710.523, "localBegin": 31.24, "localEnd": 69.16}, {"id": "c008_f000010", "text": "The ghosts didn't help, either. It was always a nasty shock when one of them glided suddenly through a door you were trying to open. Nearly Headless Nick was always happy to point new Gryffindors in the right direction, but Peeves the Poltergeist was worth two locked doors and a trick staircase if you met him when you were late for class. He would drop wastepaper baskets on your head, pull rugs from under your feet, pelt you with bits of chalk, or sneak up behind you, invisible, grab your nose, and screech, \"GOT YOUR CONK!\"", "begin": 12710.523, "end": 12743.843, "localBegin": 69.16, "localEnd": 102.48}, {"id": "c008_f000011", "text": "Even worse than Peeves, if that was possible, was the caretaker, Argus Filch. Harry and Ron managed to get on the wrong side of him on their very first morning. Filch found them trying to force their way through a door that unluckily turned out to be the entrance to the out-of-bounds corridor on the third floor. He wouldn't believe they were lost, was sure they were trying to break into it on purpose, and was threatening to lock them in the dungeons when they were rescued by Professor Quirrell, who was passing.", "begin": 12743.843, "end": 12772.803, "localBegin": 102.48, "localEnd": 131.44}, {"id": "c008_f000012", "text": "Filch owned a cat called Mrs. Norris, a scrawny, dust-colored creature with bulging, lamplike eyes just like Filch's. She patrolled the corridors alone. Break a rule in front of her, put just one toe out of line, and she'd whisk off for Filch, who'd appear, wheezing, two seconds later. Filch knew the secret passageways of the school better than anyone (except perhaps the Weasley twins) and could pop up as suddenly as any of the ghosts. The students all hated him, and it was the dearest ambition of many to give Mrs. Norris a good kick.", "begin": 12772.803, "end": 12807.843, "localBegin": 131.44, "localEnd": 166.48}, {"id": "c008_f000013", "text": "And then, once you had managed to find them, there were the classes themselves. There was a lot more to magic, as Harry quickly found out, than waving your wand and saying a few funny words.", "begin": 12807.843, "end": 12818.523, "localBegin": 166.48, "localEnd": 177.16}, {"id": "c008_f000014", "text": "They had to study the night skies through their telescopes every Wednesday at midnight and learn the names of different stars and the movements of the planets. Three times a week they went out to the greenhouses behind the castle to study Herbology, with a dumpy little witch called Professor Sprout, where they learned how to take care of all the strange plants and fungi, and found out what they were used for.", "begin": 12818.523, "end": 12841.523, "localBegin": 177.16, "localEnd": 200.16}, {"id": "c008_f000015", "text": "Easily the most boring class was History of Magic, which was the only one taught by a ghost. Professor Binns had been very old indeed when he had fallen asleep in front of the staffroom fire and got up next morning to teach, leaving his body behind him. Binns droned on and on while they scribbled down names and dates, and got Emeric the Evil and Uric the Oddball mixed up.", "begin": 12841.523, "end": 12866.003, "localBegin": 200.16, "localEnd": 224.64}, {"id": "c008_f000016", "text": "Professor Flitwick, the Charms teacher, was a tiny little wizard who had to stand on a pile of books to see over his desk. At the start of their first class he took the roll call, and when he reached Harry's name he gave an excited squeak and toppled out of sight.", "begin": 12866.003, "end": 12882.123, "localBegin": 224.64, "localEnd": 240.76}, {"id": "c008_f000017", "text": "Professor McGonagall was again different. Harry had been quite right to think she wasn't a teacher to cross. Strict and clever, she gave them a talking-to the moment they sat down in her first class.", "begin": 12882.123, "end": 12894.723, "localBegin": 240.76, "localEnd": 253.36}, {"id": "c008_f000018", "text": "\"Transfiguration is some of the most complex and dangerous magic you will learn at Hogwarts,\" she said. \"Anyone messing around in my class will leave and not come back. You have been warned.\"", "begin": 12894.723, "end": 12910.803, "localBegin": 253.36, "localEnd": 269.44}, {"id": "c008_f000019", "text": "Then she changed her desk into a pig and back again. They were all very impressed and couldn't wait to get started, but soon realized they weren't going to be changing the furniture into animals for a long time. After taking a lot of complicated notes, they were each given a match and started trying to turn it into a needle. By the end of the lesson, only Hermione Granger had made any difference", "begin": 12910.803, "end": 12932.603, "localBegin": 269.44, "localEnd": 291.24}, {"id": "c008_f000020", "text": "to her match; Professor McGonagall showed the class how it had gone all silver and pointy and gave Hermione a rare smile.", "begin": 12932.603, "end": 12941.243, "localBegin": 291.24, "localEnd": 299.88}, {"id": "c008_f000021", "text": "The class everyone had really been looking forward to was Defense Against the Dark Arts, but Quirrell's lessons turned out to be a bit of a joke. His classroom smelled strongly of garlic, which everyone said was to ward off a vampire he'd met in Romania and was afraid would be coming back to get him one of these days. His turban, he told them, had been given to him by an African prince as a thank-you for getting rid of a troublesome zombie, but they weren't sure they believed this story. For one thing, when Seamus Finnigan asked eagerly to hear how Quirrell had fought off the zombie, Quirrell went pink and started talking about the weather; for another, they had noticed that a funny smell hung around the turban, and the Weasley twins insisted that it was stuffed full of garlic as well, so that Quirrell was protected wherever he went.", "begin": 12941.243, "end": 12992.963, "localBegin": 299.88, "localEnd": 351.6}, {"id": "c008_f000022", "text": "Harry was very relieved to find out that he wasn't miles behind everyone else. Lots of people had come from Muggle families and, like him, hadn't had any idea that they were witches and wizards. There was so much to learn that even people like Ron didn't have much of a head start.", "begin": 12992.963, "end": 13010.243, "localBegin": 351.6, "localEnd": 368.88}, {"id": "c008_f000023", "text": "Friday was an important day for Harry and Ron. They finally managed to find their way down to the Great Hall for breakfast without getting lost once.", "begin": 13010.243, "end": 13018.283, "localBegin": 368.88, "localEnd": 376.92}, {"id": "c008_f000024", "text": "\"What have we got today?\" Harry asked Ron as he poured sugar on his porridge.", "begin": 13018.283, "end": 13022.843, "localBegin": 376.92, "localEnd": 381.48}, {"id": "c008_f000025", "text": "\"Double Potions with the Slytherins,\" said Ron. \"Snape's Head of Slytherin House. They say he always favors them - we'll be able to see if it's true.\"", "begin": 13022.843, "end": 13031.323, "localBegin": 381.48, "localEnd": 389.96}, {"id": "c008_f000026", "text": "\"Wish McGonagall favored us,\" said Harry. Professor McGonagall was head of Gryffindor House, but it hadn't stopped her from giving them a huge pile of homework the day before.", "begin": 13031.323, "end": 13043.003, "localBegin": 389.96, "localEnd": 401.64}, {"id": "c008_f000027", "text": "Just then, the mail arrived. Harry had gotten used to this by now, but it had given him a bit of a shock on the first morning, when about a hundred owls had suddenly streamed into the Great Hall during breakfast, circling the tables until they saw their owners, and dropping letters and packages onto their laps.", "begin": 13043.003, "end": 13059.763, "localBegin": 401.64, "localEnd": 418.4}, {"id": "c008_f000028", "text": "Hedwig hadn't brought Harry anything so far. She sometimes flew in to nibble his ear and have a bit of toast before going off to sleep in the owlery with the other school owls. This morning, however, she fluttered down between the marmalade and the sugar bowl and dropped a note onto Harry's plate. Harry tore it open at once. It said, in a very untidy scrawl:", "begin": 13059.763, "end": 13081.043, "localBegin": 418.4, "localEnd": 439.68}, {"id": "c008_f000029", "text": "Dear Harry,", "begin": 13081.043, "end": 13082.163, "localBegin": 439.68, "localEnd": 440.8}, {"id": "c008_f000030", "text": "I know you get Friday afternoons off, so would you like to come and have a cup of tea with me around three? I want to hear all about your first week. Send us an answer back with Hedwig.", "begin": 13082.163, "end": 13094.003, "localBegin": 440.8, "localEnd": 452.64}, {"id": "c008_f000031", "text": "Hagrid", "begin": 13094.003, "end": 13095.723, "localBegin": 452.64, "localEnd": 454.36}, {"id": "c008_f000032", "text": "Harry borrowed Ron's quill, scribbled Yes, please, see you later on the back of the note, and sent Hedwig off again.", "begin": 13095.723, "end": 13104.963, "localBegin": 454.36, "localEnd": 463.6}, {"id": "c008_f000033", "text": "It was lucky that Harry had tea with Hagrid to look forward to, because the Potions lesson turned out to be the worst thing that had happened to him so far.", "begin": 13104.963, "end": 13114.123, "localBegin": 463.6, "localEnd": 472.76}, {"id": "c008_f000034", "text": "At the start-of-term banquet, Harry had gotten the idea that Professor Snape disliked him. By the end of the first Potions lesson, he knew he'd been wrong. Snape didn't dislike Harry - he hated him.", "begin": 13114.123, "end": 13126.043, "localBegin": 472.76, "localEnd": 484.68}, {"id": "c008_f000035", "text": "Potions lessons took place down in one of the dungeons. It was colder here than up in the main castle, and would have been quite creepy enough without the pickled animals floating in glass jars all around the walls.", "begin": 13126.043, "end": 13139.083, "localBegin": 484.68, "localEnd": 497.72}, {"id": "c008_f000036", "text": "Snape, like Flitwick, started the class by taking the roll call, and like Flitwick, he paused at Harry's name.", "begin": 13139.083, "end": 13146.563, "localBegin": 497.72, "localEnd": 505.2}, {"id": "c008_f000037", "text": "\"Ah, yes,\" he said softly, \"Harry Potter. Our new - celebrity.\"", "begin": 13146.563, "end": 13156.243, "localBegin": 505.2, "localEnd": 514.88}, {"id": "c008_f000038", "text": "Draco Malfoy and his friends Crabbe and Goyle sniggered behind their hands. Snape finished calling the names and looked up at the class. His eyes were black like Hagrid's, but they had none of Hagrid's warmth. They were cold and empty and made you think of dark tunnels.", "begin": 13156.243, "end": 13171.723, "localBegin": 514.88, "localEnd": 530.36}, {"id": "c008_f000039", "text": "\"You are here to learn the subtle science and exact art of potion-making,\" he began. He spoke in barely more than a whisper, but they caught every word - like Professor McGonagall, Snape had the gift of keeping a class silent without effort. \"As there is little foolish wand-waving here, many of you will hardly believe this is magic. I don't expect you will really understand the beauty of the softly simmering cauldron with its shimmering fumes, the delicate power of liquids that creep through human veins, bewitching the mind, ensnaring the senses. . . . I can teach you how to bottle fame, brew glory, even stopper death - if you aren't as big a bunch of dunderheads as I usually have to teach.\"", "begin": 13171.723, "end": 13222.963, "localBegin": 530.36, "localEnd": 581.6}, {"id": "c008_f000040", "text": "More silence followed this little speech. Harry and Ron exchanged looks with raised eyebrows. Hermione Granger was on the edge of her seat and looked desperate", "begin": 13222.963, "end": 13231.323, "localBegin": 581.6, "localEnd": 589.96}, {"id": "c008_f000041", "text": "to start proving that she wasn't a dunderhead.", "begin": 13231.323, "end": 13233.643, "localBegin": 589.96, "localEnd": 592.28}, {"id": "c008_f000042", "text": "\"Potter!\" said Snape suddenly. \"What would I get if I added powdered root of asphodel to an infusion of wormwood?\"", "begin": 13233.643, "end": 13243.883, "localBegin": 592.28, "localEnd": 602.52}, {"id": "c008_f000043", "text": "Powdered root of what to an infusion of what? Harry glanced at Ron, who looked as stumped as he was; Hermione's hand had shot into the air.", "begin": 13243.883, "end": 13253.323, "localBegin": 602.52, "localEnd": 611.96}, {"id": "c008_f000044", "text": "\"I don't know, sir,\" said Harry.", "begin": 13253.323, "end": 13257.723, "localBegin": 611.96, "localEnd": 616.36}, {"id": "c008_f000045", "text": "Snape's lips curled into a sneer.", "begin": 13257.723, "end": 13259.803, "localBegin": 616.36, "localEnd": 618.44}, {"id": "c008_f000046", "text": "\"Tut, tut - fame clearly isn't everything.\"", "begin": 13259.803, "end": 13264.803, "localBegin": 618.44, "localEnd": 623.44}, {"id": "c008_f000047", "text": "He ignored Hermione's hand.", "begin": 13264.803, "end": 13266.203, "localBegin": 623.44, "localEnd": 624.84}, {"id": "c008_f000048", "text": "\"Let's try again. Potter, where would you look if I told you to find me a bezoar?\"", "begin": 13266.203, "end": 13275.163, "localBegin": 624.84, "localEnd": 633.8}, {"id": "c008_f000049", "text": "Hermione stretched her hand as high into the air as it would go without her leaving her seat, but Harry didn't have the faintest idea what a bezoar was. He tried not to look at Malfoy, Crabbe, and Goyle, who were shaking with laughter.", "begin": 13275.163, "end": 13289.043, "localBegin": 633.8, "localEnd": 647.68}, {"id": "c008_f000050", "text": "\"I don't know, sir.\"", "begin": 13289.043, "end": 13291.683, "localBegin": 647.68, "localEnd": 650.32}, {"id": "c008_f000051", "text": "\"Thought you wouldn't open a book before coming, eh, Potter?\"", "begin": 13291.683, "end": 13297.763, "localBegin": 650.32, "localEnd": 656.4}, {"id": "c008_f000052", "text": "Harry forced himself to keep looking straight into those cold eyes. He had looked through his books at the Dursleys', but did Snape expect him to remember everything in One Thousand Magical Herbs and Fungi?", "begin": 13297.763, "end": 13310.243, "localBegin": 656.4, "localEnd": 668.88}, {"id": "c008_f000053", "text": "Snape was still ignoring Hermione's quivering hand.", "begin": 13310.243, "end": 13314.363, "localBegin": 668.88, "localEnd": 673.0}, {"id": "c008_f000054", "text": "\"What is the difference, Potter, between monkshood and wolfsbane?\"", "begin": 13314.363, "end": 13320.603, "localBegin": 673.0, "localEnd": 679.24}, {"id": "c008_f000055", "text": "At this, Hermione stood up, her hand stretching toward the dungeon ceiling.", "begin": 13320.603, "end": 13324.763, "localBegin": 679.24, "localEnd": 683.4}, {"id": "c008_f000056", "text": "\"I don't know,\" said Harry quietly. \"I think Hermione does, though, why don't you try her?\"", "begin": 13324.763, "end": 13333.283, "localBegin": 683.4, "localEnd": 691.92}, {"id": "c008_f000057", "text": "A few people laughed; Harry caught Seamus's eye, and Seamus winked. Snape, however, was not pleased.", "begin": 13333.283, "end": 13339.603, "localBegin": 691.92, "localEnd": 698.24}, {"id": "c008_f000058", "text": "\"Sit down,\" he snapped at Hermione. \"For your information, Potter, asphodel and wormwood make a sleeping potion so powerful it is known as the Draught of Living Death. A bezoar is a stone taken from the stomach of a goat and it will save", "begin": 13339.603, "end": 13358.563, "localBegin": 698.24, "localEnd": 717.2}, {"id": "c008_f000059", "text": "you from most poisons. As for monkshood and wolfsbane, they are the same plant, which also goes by the name of aconite. Well? Why aren't you all copying that down?\"", "begin": 13358.563, "end": 13370.403, "localBegin": 717.2, "localEnd": 729.04}, {"id": "c008_f000060", "text": "There was a sudden rummaging for quills and parchment. Over the noise, Snape said, \"And a point will be taken from Gryffindor House for your cheek, Potter.\"", "begin": 13370.403, "end": 13382.603, "localBegin": 729.04, "localEnd": 741.24}, {"id": "c008_f000061", "text": "Things didn't improve for the Gryffindors as the Potions lesson continued. Snape put them all into pairs and set them to mixing up a simple potion to cure boils. He swept around in his long black cloak, watching them weigh dried nettles and crush snake fangs, criticizing almost everyone except Malfoy, whom he seemed to like. He was just telling everyone to look at the perfect way Malfoy had stewed his horned slugs when clouds of acid green smoke and a loud hissing filled the dungeon. Neville had somehow managed to melt Seamus's cauldron into a twisted blob, and their potion was seeping across the stone floor, burning holes in people's shoes. Within seconds, the whole class was standing on their stools while Neville, who had been drenched in the potion when the cauldron collapsed, moaned in pain as angry red boils sprang up all over his arms and legs.", "begin": 13382.603, "end": 13435.803, "localBegin": 741.24, "localEnd": 794.44}, {"id": "c008_f000062", "text": "\"Idiot boy!\" snarled Snape, clearing the spilled potion away with one wave of his wand. \"I suppose you added the porcupine quills before taking the cauldron off the fire?\"", "begin": 13435.803, "end": 13448.923, "localBegin": 794.44, "localEnd": 807.56}, {"id": "c008_f000063", "text": "Neville whimpered as boils started to pop up all over his nose.", "begin": 13448.923, "end": 13452.483, "localBegin": 807.56, "localEnd": 811.12}, {"id": "c008_f000064", "text": "\"Take him up to the hospital wing,\" Snape spat at Seamus. Then he rounded on Harry and Ron, who had been working next to Neville.", "begin": 13452.483, "end": 13459.963, "localBegin": 811.12, "localEnd": 818.6}, {"id": "c008_f000065", "text": "\"You - Potter - why didn't you tell him not to add the quills? Thought he'd make you look good if he got it wrong, did you? That's another point you've lost for Gryffindor.\"", "begin": 13459.963, "end": 13471.123, "localBegin": 818.6, "localEnd": 829.76}, {"id": "c008_f000066", "text": "This was so unfair that Harry opened his mouth to argue, but Ron kicked him behind their cauldron.", "begin": 13471.123, "end": 13478.243, "localBegin": 829.76, "localEnd": 836.88}, {"id": "c008_f000067", "text": "\"Don't push it,\" he muttered, \"I've heard Snape can turn very nasty.\"", "begin": 13478.243, "end": 13485.123, "localBegin": 836.88, "localEnd": 843.76}, {"id": "c008_f000068", "text": "As they climbed the steps out of the dungeon an hour later, Harry's mind was racing and his spirits were low. He'd lost two points for Gryffindor in his very first week - why did Snape hate him so much?", "begin": 13485.123, "end": 13496.963, "localBegin": 843.76, "localEnd": 855.6}, {"id": "c008_f000069", "text": "\"Cheer up,\" said Ron, \"Snape's always taking points off Fred and George. Can I come and meet Hagrid with you?\"", "begin": 13496.963, "end": 13506.163, "localBegin": 855.6, "localEnd": 864.8}, {"id": "c008_f000070", "text": "At five to three they left the castle and made their way across the grounds. Hagrid lived in a small wooden house on the edge of the forbidden forest. A crossbow and a pair of galoshes were outside the front door.", "begin": 13506.163, "end": 13517.803, "localBegin": 864.8, "localEnd": 876.44}, {"id": "c008_f000071", "text": "When Harry knocked they heard a frantic scrabbling from inside and several booming barks. Then Hagrid's voice rang out, saying, \"Back, Fang - back.\"", "begin": 13517.803, "end": 13527.403, "localBegin": 876.44, "localEnd": 886.04}, {"id": "c008_f000072", "text": "Hagrid's big, hairy face appeared in the crack as he pulled the door open.", "begin": 13527.403, "end": 13531.443, "localBegin": 886.04, "localEnd": 890.08}, {"id": "c008_f000073", "text": "\"Hang on,\" he said. \"Back, Fang.\"", "begin": 13531.443, "end": 13535.923, "localBegin": 890.08, "localEnd": 894.56}, {"id": "c008_f000074", "text": "He let them in, struggling to keep a hold on the collar of an enormous black boarhound.", "begin": 13535.923, "end": 13542.163, "localBegin": 894.56, "localEnd": 900.8}, {"id": "c008_f000075", "text": "There was only one room inside. Hams and pheasants were hanging from the ceiling, a copper kettle was boiling on the open fire, and in the corner stood a massive bed with a patchwork quilt over it.", "begin": 13542.163, "end": 13553.083, "localBegin": 900.8, "localEnd": 911.72}, {"id": "c008_f000076", "text": "\"Make yerselves at home,\" said Hagrid, letting go of Fang, who bounded straight at Ron and started licking his ears. Like Hagrid, Fang was clearly not as fierce as he looked.", "begin": 13553.083, "end": 13564.363, "localBegin": 911.72, "localEnd": 923.0}, {"id": "c008_f000077", "text": "\"This is Ron,\" Harry told Hagrid, who was pouring boiling water into a large teapot and putting rock cakes onto a plate.", "begin": 13564.363, "end": 13572.003, "localBegin": 923.0, "localEnd": 930.64}, {"id": "c008_f000078", "text": "\"Another Weasley, eh?\" said Hagrid, glancing at Ron's freckles. \"I spent half me life chasin' yer twin brothers away from the forest.\"", "begin": 13572.003, "end": 13582.483, "localBegin": 930.64, "localEnd": 941.12}, {"id": "c008_f000079", "text": "The rock cakes were shapeless lumps with raisins that almost broke their teeth, but Harry and Ron pretended to be enjoying them as they told Hagrid all about their first lessons. Fang rested his head on Harry's knee and drooled all over his robes.", "begin": 13582.483, "end": 13596.123, "localBegin": 941.12, "localEnd": 954.76}, {"id": "c008_f000080", "text": "Harry and Ron were delighted to hear Hagrid call Filch \"that old git.\"", "begin": 13596.123, "end": 13601.523, "localBegin": 954.76, "localEnd": 960.16}, {"id": "c008_f000081", "text": "\"An' as fer that cat, Mrs. Norris, I'd like ter introduce her to Fang sometime. D'yeh know, every time I go up ter the school, she follows me everywhere? Can't get rid of her - Filch puts her up to it.\"", "begin": 13601.523, "end": 13615.923, "localBegin": 960.16, "localEnd": 974.56}, {"id": "c008_f000082", "text": "Harry told Hagrid about Snape's lesson. Hagrid, like Ron, told Harry not to worry about it, that Snape liked hardly any of the students.", "begin": 13615.923, "end": 13623.643, "localBegin": 974.56, "localEnd": 982.28}, {"id": "c008_f000083", "text": "\"But he seemed to really hate me.\"", "begin": 13623.643, "end": 13625.763, "localBegin": 982.28, "localEnd": 984.4}, {"id": "c008_f000084", "text": "\"Rubbish!\" said Hagrid. \"Why should he?\"", "begin": 13625.763, "end": 13629.123, "localBegin": 984.4, "localEnd": 987.76}, {"id": "c008_f000085", "text": "Yet Harry couldn't help thinking that Hagrid didn't quite meet his eyes when he said that.", "begin": 13629.123, "end": 13635.203, "localBegin": 987.76, "localEnd": 993.84}, {"id": "c008_f000086", "text": "\"How's yer brother Charlie?\" Hagrid asked Ron. \"I liked him a lot - great with animals.\"", "begin": 13635.203, "end": 13643.683, "localBegin": 993.84, "localEnd": 1002.32}, {"id": "c008_f000087", "text": "Harry wondered if Hagrid had changed the subject on purpose. While Ron told Hagrid all about Charlie's work with dragons, Harry picked up a piece of paper that was lying on the table under the tea cozy. It was a cutting from the Daily Prophet:", "begin": 13643.683, "end": 13658.403, "localBegin": 1002.32, "localEnd": 1017.04}, {"id": "c008_f000088", "text": "GRINGOTTS BREAK-IN LATEST", "begin": 13658.403, "end": 13661.723, "localBegin": 1017.04, "localEnd": 1020.36}, {"id": "c008_f000089", "text": "Investigations continue into the break-in at Gringotts on 31 July,", "begin": 13661.723, "end": 13665.963, "localBegin": 1020.36, "localEnd": 1024.6}, {"id": "c008_f000090", "text": "widely believed to be the work of Dark wizards or witches unknown.", "begin": 13665.963, "end": 13670.323, "localBegin": 1024.6, "localEnd": 1028.96}, {"id": "c008_f000091", "text": "Gringotts goblins today insisted that nothing had been taken. The vault", "begin": 13670.323, "end": 13674.163, "localBegin": 1028.96, "localEnd": 1032.8}, {"id": "c008_f000092", "text": "that was searched had in fact been emptied the same day.", "begin": 13674.163, "end": 13677.363, "localBegin": 1032.8, "localEnd": 1036.0}, {"id": "c008_f000093", "text": "\"But we're not telling you what was in there, so keep your noses out", "begin": 13677.363, "end": 13681.643, "localBegin": 1036.0, "localEnd": 1040.28}, {"id": "c008_f000094", "text": "if you know what's good for you,\" said a Gringotts spokesgoblin this", "begin": 13681.643, "end": 13685.683, "localBegin": 1040.28, "localEnd": 1044.32}, {"id": "c008_f000095", "text": "afternoon.", "begin": 13685.683, "end": 13687.603, "localBegin": 1044.32, "localEnd": 1046.24}, {"id": "c008_f000096", "text": "Harry remembered Ron telling him on the train that someone had tried to rob Gringotts, but Ron hadn't mentioned the date.", "begin": 13687.603, "end": 13693.803, "localBegin": 1046.24, "localEnd": 1052.44}, {"id": "c008_f000097", "text": "\"Hagrid!\" said Harry, \"that Gringotts break-in happened on my birthday! It might've been happening while we were there!\"", "begin": 13693.803, "end": 13702.883, "localBegin": 1052.44, "localEnd": 1061.52}, {"id": "c008_f000098", "text": "There was no doubt about it, Hagrid definitely didn't meet Harry's eyes this time. He grunted and offered him another rock cake. Harry read the story again. The vault that was searched had in fact been emptied earlier that same day. Hagrid had emptied vault seven hundred and thirteen, if you could call it emptying, taking out that grubby little package. Had that been what the thieves were looking for?", "begin": 13702.883, "end": 13726.723, "localBegin": 1061.52, "localEnd": 1085.36}, {"id": "c008_f000099", "text": "As Harry and Ron walked back to the castle for dinner, their pockets weighed down with rock cakes they'd been too polite to refuse, Harry thought that none of the lessons he'd had so far had given him as much to think about as tea with Hagrid. Had Hagrid collected that package just in time? Where was it now? And did Hagrid know something about Snape that he didn't want to tell Harry?", "begin": 13726.723, "end": 13753.803, "localBegin": 1085.36, "localEnd": 1112.44}]}, {"kind": "chapter", "number": 9, "title": "The Midnight Duel", "audio": "../Harry Potter and the Sorcerer's Stone, Book 1 (Unabridged)/009 - Harry Potter and the Sorcerer's Stone, Book 1 (Unabridged).mp3", "start": 13753.831, "end": 15612.078, "duration": 1858.247, "paragraphs": [{"id": "c009_f000001", "text": "Chapter Nine. The Midnight Duel.", "begin": 13753.831, "end": 13758.151, "localBegin": 0.0, "localEnd": 4.32}, {"id": "c009_f000002", "text": "Harry had never believed he would meet a boy he hated more than Dudley, but that was before he met Draco Malfoy. Still, first-year Gryffindors only had Potions with the Slytherins, so they didn't have to put up with Malfoy much. Or at least, they didn't until they spotted a notice pinned up in the Gryffindor common room that made them all groan. Flying lessons would be starting on Thursday - and Gryffindor and Slytherin would be learning together.", "begin": 13758.151, "end": 13784.551, "localBegin": 4.32, "localEnd": 30.72}, {"id": "c009_f000003", "text": "\"Typical,\" said Harry darkly. \"Just what I always wanted. To make a fool of myself on a broomstick in front of Malfoy.\"", "begin": 13784.551, "end": 13794.551, "localBegin": 30.72, "localEnd": 40.72}, {"id": "c009_f000004", "text": "He had been looking forward to learning to fly more than anything else.", "begin": 13794.551, "end": 13797.711, "localBegin": 40.72, "localEnd": 43.88}, {"id": "c009_f000005", "text": "\"You don't know that you'll make a fool of yourself,\" said Ron reasonably. \"Anyway, I know Malfoy's always going on about how good he is at Quidditch, but I bet that's all talk.\"", "begin": 13797.711, "end": 13811.391, "localBegin": 43.88, "localEnd": 57.56}, {"id": "c009_f000006", "text": "Malfoy certainly did talk about flying a lot. He complained loudly about first years never getting on the House Quidditch teams and told long, boastful stories that always seemed to end with him narrowly escaping Muggles in helicopters. He wasn't the only one, though: the way Seamus Finnigan told it, he'd spent most of his childhood zooming around the countryside on his broomstick. Even Ron would tell anyone who'd listen about the time he'd almost hit a hang glider on Charlie's old broom. Everyone from wizarding families talked about Quidditch constantly. Ron had already had a big argument with Dean Thomas, who shared their dormitory, about soccer. Ron couldn't see what was exciting about a game with only one ball where no one was allowed to fly. Harry had caught Ron prodding Dean's poster of West Ham soccer team, trying to make the players move.", "begin": 13811.391, "end": 13864.111, "localBegin": 57.56, "localEnd": 110.28}, {"id": "c009_f000007", "text": "Neville had never been on a broomstick in his life, because his grandmother had never let him near one. Privately, Harry felt she'd had good reason, because Neville managed to have an extraordinary number of accidents even with both feet on the ground.", "begin": 13864.111, "end": 13878.271, "localBegin": 110.28, "localEnd": 124.44}, {"id": "c009_f000008", "text": "Hermione Granger was almost as nervous about flying as Neville was. This was something you couldn't learn by heart out of a book - not that she hadn't tried. At breakfast on Thursday she bored them all stupid with flying tips she'd gotten out of a library book called Quidditch Through the Ages. Neville was hanging on to her every word, desperate for anything that might help him hang on to his broomstick later, but everybody else was very pleased when Hermione's lecture was interrupted by the arrival of the mail.", "begin": 13878.271, "end": 13909.111, "localBegin": 124.44, "localEnd": 155.28}, {"id": "c009_f000009", "text": "Harry hadn't had a single letter since Hagrid's note, something that Malfoy had been quick to notice, of course. Malfoy's eagle owl was always bringing him packages of sweets from home, which he opened gloatingly at the Slytherin table.", "begin": 13909.111, "end": 13923.391, "localBegin": 155.28, "localEnd": 169.56}, {"id": "c009_f000010", "text": "A barn owl brought Neville a small package from his grandmother. He opened it excitedly and showed them a glass ball the size of a large marble, which seemed to be full of white smoke.", "begin": 13923.391, "end": 13934.431, "localBegin": 169.56, "localEnd": 180.6}, {"id": "c009_f000011", "text": "\"It's a Remembrall!\" he explained. \"Gran knows I forget things - this tells you if there's something you've forgotten to do. Look, you hold it tight like this and if it turns red - oh . . .\" His face fell, because the Remembrall had suddenly glowed scarlet, \". . . you've forgotten something . . .\"", "begin": 13934.431, "end": 13956.711, "localBegin": 180.6, "localEnd": 202.88}, {"id": "c009_f000012", "text": "Neville was trying to remember what he'd forgotten when Draco Malfoy, who was passing the Gryffindor table, snatched the Remembrall out of his hand.", "begin": 13956.711, "end": 13964.831, "localBegin": 202.88, "localEnd": 211.0}, {"id": "c009_f000013", "text": "Harry and Ron jumped to their feet. They were half hoping for a reason to fight Malfoy, but Professor McGonagall, who could spot trouble quicker than any teacher in the school, was there in a flash.", "begin": 13964.831, "end": 13974.631, "localBegin": 211.0, "localEnd": 220.8}, {"id": "c009_f000014", "text": "\"What's going on?\"", "begin": 13974.631, "end": 13977.551, "localBegin": 220.8, "localEnd": 223.72}, {"id": "c009_f000015", "text": "\"Malfoy's got my Remembrall, Professor.\"", "begin": 13977.551, "end": 13981.591, "localBegin": 223.72, "localEnd": 227.76}, {"id": "c009_f000016", "text": "Scowling, Malfoy quickly dropped the Remembrall back on the table.", "begin": 13981.591, "end": 13985.191, "localBegin": 227.76, "localEnd": 231.36}, {"id": "c009_f000017", "text": "\"Just looking,\" he said, and he sloped away with Crabbe and Goyle behind him.", "begin": 13985.191, "end": 13993.871, "localBegin": 231.36, "localEnd": 240.04}, {"id": "c009_f000018", "text": "At three-thirty that afternoon, Harry, Ron, and the other Gryffindors hurried down the front steps onto the grounds for their first flying lesson. It was a clear, breezy day, and the grass rippled under their feet as they marched down the sloping lawns toward a smooth, flat lawn on the opposite side of the grounds to the forbidden forest, whose trees were swaying darkly in the distance.", "begin": 13993.871, "end": 14016.711, "localBegin": 240.04, "localEnd": 262.88}, {"id": "c009_f000019", "text": "The Slytherins were already there, and so were twenty broomsticks lying in neat lines on the ground. Harry had heard Fred and George Weasley complain about the school brooms, saying that some of them started to vibrate if you flew too high, or always flew slightly to the left.", "begin": 14016.711, "end": 14033.911, "localBegin": 262.88, "localEnd": 280.08}, {"id": "c009_f000020", "text": "Their teacher, Madam Hooch, arrived. She had short, gray hair, and yellow eyes like a hawk.", "begin": 14033.911, "end": 14039.751, "localBegin": 280.08, "localEnd": 285.92}, {"id": "c009_f000021", "text": "\"Well, what are you all waiting for?\" she barked. \"Everyone stand by a broomstick. Come on, hurry up.\"", "begin": 14039.751, "end": 14048.431, "localBegin": 285.92, "localEnd": 294.6}, {"id": "c009_f000022", "text": "Harry glanced down at his broom. It was old and some of the twigs stuck out at odd angles.", "begin": 14048.431, "end": 14053.471, "localBegin": 294.6, "localEnd": 299.64}, {"id": "c009_f000023", "text": "\"Stick out your right hand over your broom,\" called Madam Hooch at the front, \"and say 'Up!'\"", "begin": 14053.471, "end": 14061.311, "localBegin": 299.64, "localEnd": 307.48}, {"id": "c009_f000024", "text": "\"UP!\" everyone shouted.", "begin": 14061.311, "end": 14065.031, "localBegin": 307.48, "localEnd": 311.2}, {"id": "c009_f000025", "text": "Harry's broom jumped into his hand at once, but it was one of the few that did. Hermione Granger's had simply rolled over on the ground, and Neville's hadn't moved at all. Perhaps brooms, like horses, could tell when you were afraid, thought Harry; there was a quaver in Neville's voice that said only too clearly that he wanted to keep his feet on the ground.", "begin": 14065.031, "end": 14086.151, "localBegin": 311.2, "localEnd": 332.32}, {"id": "c009_f000026", "text": "Madam Hooch then showed them how to mount their brooms without sliding off the end, and walked up and down the rows correcting their grips. Harry and Ron were delighted when she told Malfoy he'd been doing it wrong for years.", "begin": 14086.151, "end": 14097.871, "localBegin": 332.32, "localEnd": 344.04}, {"id": "c009_f000027", "text": "\"Now, when I blow my whistle, you kick off from the ground, hard,\" said Madam Hooch. \"Keep your brooms steady, rise a few feet, and then come straight back down by leaning forward slightly. On my whistle - three - two - \"", "begin": 14097.871, "end": 14116.951, "localBegin": 344.04, "localEnd": 363.12}, {"id": "c009_f000028", "text": "But Neville, nervous and jumpy and frightened of being left on the ground, pushed off hard before the whistle had touched Madam Hooch's lips.", "begin": 14116.951, "end": 14124.271, "localBegin": 363.12, "localEnd": 370.44}, {"id": "c009_f000029", "text": "\"Come back, boy!\" she shouted, but Neville was rising straight up like a cork shot out of a bottle - twelve feet - twenty feet. Harry saw his scared white face look down at the ground falling away, saw him gasp, slip sideways off the broom and -", "begin": 14124.271, "end": 14143.191, "localBegin": 370.44, "localEnd": 389.36}, {"id": "c009_f000030", "text": "WHAM - a thud and a nasty crack and Neville lay facedown on the grass in a heap. His broomstick was still rising higher and higher, and started to drift lazily toward the forbidden forest and out of sight.", "begin": 14143.191, "end": 14157.031, "localBegin": 389.36, "localEnd": 403.2}, {"id": "c009_f000031", "text": "Madam Hooch was bending over Neville, her face as white as his.", "begin": 14157.031, "end": 14160.431, "localBegin": 403.2, "localEnd": 406.6}, {"id": "c009_f000032", "text": "\"Broken wrist,\" Harry heard her mutter. \"Come on, boy - it's all right, up you get.\"", "begin": 14160.431, "end": 14168.871, "localBegin": 406.6, "localEnd": 415.04}, {"id": "c009_f000033", "text": "She turned to the rest of the class.", "begin": 14168.871, "end": 14170.391, "localBegin": 415.04, "localEnd": 416.56}, {"id": "c009_f000034", "text": "\"None of you is to move while I take this boy to the hospital wing! You leave those brooms where they are or you'll be out of Hogwarts before you can say 'Quidditch.' Come on, dear.\"", "begin": 14170.391, "end": 14184.151, "localBegin": 416.56, "localEnd": 430.32}, {"id": "c009_f000035", "text": "Neville, his face tear-streaked, clutching his wrist, hobbled off with Madam Hooch, who had her arm around him.", "begin": 14184.151, "end": 14191.551, "localBegin": 430.32, "localEnd": 437.72}, {"id": "c009_f000036", "text": "No sooner were they out of earshot than Malfoy burst into laughter.", "begin": 14191.551, "end": 14195.351, "localBegin": 437.72, "localEnd": 441.52}, {"id": "c009_f000037", "text": "\"Did you see his face, the great lump?\"", "begin": 14195.351, "end": 14200.231, "localBegin": 441.52, "localEnd": 446.4}, {"id": "c009_f000038", "text": "The other Slytherins joined in.", "begin": 14200.231, "end": 14201.951, "localBegin": 446.4, "localEnd": 448.12}, {"id": "c009_f000039", "text": "\"Shut up, Malfoy,\" snapped Parvati Patil.", "begin": 14201.951, "end": 14205.671, "localBegin": 448.12, "localEnd": 451.84}, {"id": "c009_f000040", "text": "\"Ooh, sticking up for Longbottom?\" said Pansy Parkinson, a hard-faced Slytherin girl. \"Never thought you'd like fat little crybabies, Parvati.\"", "begin": 14205.671, "end": 14217.631, "localBegin": 451.84, "localEnd": 463.8}, {"id": "c009_f000041", "text": "\"Look!\" said Malfoy, darting forward and snatching something out of the grass. \"It's that stupid thing Longbottom's gran sent him.\"", "begin": 14217.631, "end": 14227.511, "localBegin": 463.8, "localEnd": 473.68}, {"id": "c009_f000042", "text": "The Remembrall glittered in the sun as he held it up.", "begin": 14227.511, "end": 14230.671, "localBegin": 473.68, "localEnd": 476.84}, {"id": "c009_f000043", "text": "\"Give that here, Malfoy,\" said Harry quietly. Everyone stopped talking to watch.", "begin": 14230.671, "end": 14237.711, "localBegin": 476.84, "localEnd": 483.88}, {"id": "c009_f000044", "text": "Malfoy smiled nastily.", "begin": 14237.711, "end": 14239.311, "localBegin": 483.88, "localEnd": 485.48}, {"id": "c009_f000045", "text": "\"I think I'll leave it somewhere for Longbottom to find - how about - up a tree?\"", "begin": 14239.311, "end": 14246.631, "localBegin": 485.48, "localEnd": 492.8}, {"id": "c009_f000046", "text": "\"Give it here!\" Harry yelled, but Malfoy had leapt onto his broomstick and taken off. He hadn't been lying, he could fly well. Hovering level with the topmost branches of an oak he called, \"Come and get it, Potter!\"", "begin": 14246.631, "end": 14262.071, "localBegin": 492.8, "localEnd": 508.24}, {"id": "c009_f000047", "text": "Harry grabbed his broom.", "begin": 14262.071, "end": 14263.351, "localBegin": 508.24, "localEnd": 509.52}, {"id": "c009_f000048", "text": "\"No!\" shouted Hermione Granger. \"Madam Hooch told us not to move - you'll get us all into trouble.\"", "begin": 14263.351, "end": 14270.111, "localBegin": 509.52, "localEnd": 516.28}, {"id": "c009_f000049", "text": "Harry ignored her. Blood was pounding in his ears. He mounted the broom and kicked hard against the ground and up, up he soared; air rushed through his hair, and his robes whipped out behind him - and in a rush of fierce joy he realized he'd found something he could do without being taught - this was easy, this was wonderful. He pulled his broomstick up a little to take it even higher, and heard screams and gasps of girls back on the ground and an admiring whoop from Ron.", "begin": 14270.111, "end": 14299.951, "localBegin": 516.28, "localEnd": 546.12}, {"id": "c009_f000050", "text": "He turned his broomstick sharply to face Malfoy in midair. Malfoy looked stunned.", "begin": 14299.951, "end": 14305.511, "localBegin": 546.12, "localEnd": 551.68}, {"id": "c009_f000051", "text": "\"Give it here,\" Harry called, \"or I'll knock you off that broom!\"", "begin": 14305.511, "end": 14310.351, "localBegin": 551.68, "localEnd": 556.52}, {"id": "c009_f000052", "text": "\"Oh, yeah?\" said Malfoy, trying to sneer, but looking worried.", "begin": 14310.351, "end": 14315.671, "localBegin": 556.52, "localEnd": 561.84}, {"id": "c009_f000053", "text": "Harry knew, somehow, what to do. He leaned forward and grasped the broom tightly in both hands, and it shot toward Malfoy like a javelin. Malfoy only just got out of the way in time; Harry made a sharp about-face and held the broom steady. A few people below were clapping.", "begin": 14315.671, "end": 14333.991, "localBegin": 561.84, "localEnd": 580.16}, {"id": "c009_f000054", "text": "\"No Crabbe and Goyle up here to save your neck, Malfoy,\" Harry called.", "begin": 14333.991, "end": 14340.351, "localBegin": 580.16, "localEnd": 586.52}, {"id": "c009_f000055", "text": "The same thought seemed to have struck Malfoy.", "begin": 14340.351, "end": 14342.551, "localBegin": 586.52, "localEnd": 588.72}, {"id": "c009_f000056", "text": "\"Catch it if you can, then!\" he shouted, and he threw the glass ball high into the air and streaked back toward the ground.", "begin": 14342.551, "end": 14351.431, "localBegin": 588.72, "localEnd": 597.6}, {"id": "c009_f000057", "text": "Harry saw, as though in slow motion, the ball rise up in the air and then start to fall. He leaned forward and pointed his broom handle down - next second he was gathering speed in a steep dive, racing the ball - wind whistled in his ears, mingled with the screams of people watching - he stretched out his hand - a foot from the ground he caught it, just in time to pull his broom straight, and he toppled gently onto the grass with the Remembrall clutched safely in his fist.", "begin": 14351.431, "end": 14380.751, "localBegin": 597.6, "localEnd": 626.92}, {"id": "c009_f000058", "text": "\"HARRY POTTER!\"", "begin": 14380.751, "end": 14383.071, "localBegin": 626.92, "localEnd": 629.24}, {"id": "c009_f000059", "text": "His heart sank faster than he'd just dived. Professor McGonagall was running toward them. He got to his feet, trembling.", "begin": 14383.071, "end": 14390.791, "localBegin": 629.24, "localEnd": 636.96}, {"id": "c009_f000060", "text": "\"Never - in all my time at Hogwarts - \"", "begin": 14390.791, "end": 14394.471, "localBegin": 636.96, "localEnd": 640.64}, {"id": "c009_f000061", "text": "Professor McGonagall was almost speechless with shock, and her glasses flashed furiously, \" - how dare you - might have broken your neck - \"", "begin": 14394.471, "end": 14404.751, "localBegin": 640.64, "localEnd": 650.92}, {"id": "c009_f000062", "text": "\"It wasn't his fault, Professor - \"", "begin": 14404.751, "end": 14407.031, "localBegin": 650.92, "localEnd": 653.2}, {"id": "c009_f000063", "text": "\"Be quiet, Miss Patil - \"", "begin": 14407.031, "end": 14409.071, "localBegin": 653.2, "localEnd": 655.24}, {"id": "c009_f000064", "text": "\"But Malfoy - \"", "begin": 14409.071, "end": 14410.231, "localBegin": 655.24, "localEnd": 656.4}, {"id": "c009_f000065", "text": "\"That's enough, Mr. Weasley. Potter, follow me, now.\"", "begin": 14410.231, "end": 14417.311, "localBegin": 656.4, "localEnd": 663.48}, {"id": "c009_f000066", "text": "Harry caught sight of Malfoy, Crabbe, and Goyle's triumphant faces as he left, walking numbly in Professor McGonagall's wake as she strode toward the castle. He was going to be expelled, he just knew it. He wanted to say something to defend himself, but there seemed to be something wrong with his voice. Professor", "begin": 14417.311, "end": 14434.791, "localBegin": 663.48, "localEnd": 680.96}, {"id": "c009_f000067", "text": "McGonagall was sweeping along without even looking at him; he had to jog to keep up. Now he'd done it. He hadn't even lasted two weeks. He'd be packing his bags in ten minutes. What would the Dursleys say when he turned up on the doorstep?", "begin": 14434.791, "end": 14450.471, "localBegin": 680.96, "localEnd": 696.64}, {"id": "c009_f000068", "text": "Up the front steps, up the marble staircase inside, and still Professor McGonagall didn't say a word to him. She wrenched open doors and marched along corridors with Harry trotting miserably behind her. Maybe she was taking him to Dumbledore. He thought of Hagrid, expelled but allowed to stay on as gamekeeper. Perhaps he could be Hagrid's assistant. His stomach twisted as he imagined it, watching Ron and the others becoming wizards while he stumped around the grounds carrying Hagrid's bag.", "begin": 14450.471, "end": 14480.951, "localBegin": 696.64, "localEnd": 727.12}, {"id": "c009_f000069", "text": "Professor McGonagall stopped outside a classroom. She opened the door and poked her head inside.", "begin": 14480.951, "end": 14487.231, "localBegin": 727.12, "localEnd": 733.4}, {"id": "c009_f000070", "text": "\"Excuse me, Professor Flitwick, could I borrow Wood for a moment?\"", "begin": 14487.231, "end": 14492.551, "localBegin": 733.4, "localEnd": 738.72}, {"id": "c009_f000071", "text": "Wood? thought Harry, bewildered; was Wood a cane she was going to use on him?", "begin": 14492.551, "end": 14498.271, "localBegin": 738.72, "localEnd": 744.44}, {"id": "c009_f000072", "text": "But Wood turned out to be a person, a burly fifth-year boy who came out of Flitwick's class looking confused.", "begin": 14498.271, "end": 14504.831, "localBegin": 744.44, "localEnd": 751.0}, {"id": "c009_f000073", "text": "\"Follow me, you two,\" said Professor McGonagall, and they marched on up the corridor, Wood looking curiously at Harry.", "begin": 14504.831, "end": 14512.551, "localBegin": 751.0, "localEnd": 758.72}, {"id": "c009_f000074", "text": "\"In here.\"", "begin": 14512.551, "end": 14513.671, "localBegin": 758.72, "localEnd": 759.84}, {"id": "c009_f000075", "text": "Professor McGonagall pointed them into a classroom that was empty except for Peeves, who was busy writing rude words on the blackboard.", "begin": 14513.671, "end": 14521.431, "localBegin": 759.84, "localEnd": 767.6}, {"id": "c009_f000076", "text": "\"Out, Peeves!\" she barked. Peeves threw the chalk into a bin, which clanged loudly, and he swooped out cursing. Professor McGonagall slammed the door behind him and turned to face the two boys.", "begin": 14521.431, "end": 14535.351, "localBegin": 767.6, "localEnd": 781.52}, {"id": "c009_f000077", "text": "\"Potter, this is Oliver Wood. Wood - I've found you a Seeker.\"", "begin": 14535.351, "end": 14542.591, "localBegin": 781.52, "localEnd": 788.76}, {"id": "c009_f000078", "text": "Wood's expression changed from puzzlement to delight.", "begin": 14542.591, "end": 14545.231, "localBegin": 788.76, "localEnd": 791.4}, {"id": "c009_f000079", "text": "\"Are you serious, Professor?\"", "begin": 14545.231, "end": 14548.071, "localBegin": 791.4, "localEnd": 794.24}, {"id": "c009_f000080", "text": "\"Absolutely,\" said Professor McGonagall crisply. \"The boy's a natural. I've never seen anything like it. Was that your first time on a broomstick, Potter?\"", "begin": 14548.071, "end": 14559.551, "localBegin": 794.24, "localEnd": 805.72}, {"id": "c009_f000081", "text": "Harry nodded silently. He didn't have a clue what was going on, but he didn't seem to be being expelled, and some of the feeling started coming back to his legs.", "begin": 14559.551, "end": 14568.791, "localBegin": 805.72, "localEnd": 814.96}, {"id": "c009_f000082", "text": "\"He caught that thing in his hand after a fifty-foot dive,\" Professor McGonagall told Wood. \"Didn't even scratch himself. Charlie Weasley couldn't have done it.\"", "begin": 14568.791, "end": 14579.951, "localBegin": 814.96, "localEnd": 826.12}, {"id": "c009_f000083", "text": "Wood was now looking as though all his dreams had come true at once.", "begin": 14579.951, "end": 14584.271, "localBegin": 826.12, "localEnd": 830.44}, {"id": "c009_f000084", "text": "\"Ever seen a game of Quidditch, Potter?\" he asked excitedly.", "begin": 14584.271, "end": 14589.671, "localBegin": 830.44, "localEnd": 835.84}, {"id": "c009_f000085", "text": "\"Wood's captain of the Gryffindor team,\" Professor McGonagall explained.", "begin": 14589.671, "end": 14594.711, "localBegin": 835.84, "localEnd": 840.88}, {"id": "c009_f000086", "text": "\"He's just the build for a Seeker, too,\" said Wood, now walking around Harry and staring at him. \"Light - speedy - we'll have to get him a decent broom, Professor - a Nimbus Two Thousand or a Cleansweep Seven, I'd say.\"", "begin": 14594.711, "end": 14610.351, "localBegin": 840.88, "localEnd": 856.52}, {"id": "c009_f000087", "text": "\"I shall speak to Professor Dumbledore and see if we can't bend the first-year rule. Heaven knows, we need a better team than last year. Flattened in that last match by Slytherin, I couldn't look Severus Snape in the face for weeks. . . .\"", "begin": 14610.351, "end": 14625.831, "localBegin": 856.52, "localEnd": 872.0}, {"id": "c009_f000088", "text": "Professor McGonagall peered sternly over her glasses at Harry.", "begin": 14625.831, "end": 14629.711, "localBegin": 872.0, "localEnd": 875.88}, {"id": "c009_f000089", "text": "\"I want to hear you're training hard, Potter, or I may change my mind about punishing you.\"", "begin": 14629.711, "end": 14636.111, "localBegin": 875.88, "localEnd": 882.28}, {"id": "c009_f000090", "text": "Then she suddenly smiled.", "begin": 14636.111, "end": 14638.391, "localBegin": 882.28, "localEnd": 884.56}, {"id": "c009_f000091", "text": "\"Your father would have been proud,\" she said. \"He was an excellent Quidditch player himself.\"", "begin": 14638.391, "end": 14646.191, "localBegin": 884.56, "localEnd": 892.36}, {"id": "c009_f000092", "text": "\"You're joking.\"", "begin": 14646.191, "end": 14650.591, "localBegin": 892.36, "localEnd": 896.76}, {"id": "c009_f000093", "text": "It was dinnertime. Harry had just finished telling Ron what had happened when he'd left the grounds with Professor McGonagall. Ron had a piece of steak and kidney pie halfway to his mouth, but he'd forgotten all about it.", "begin": 14650.591, "end": 14662.671, "localBegin": 896.76, "localEnd": 908.84}, {"id": "c009_f000094", "text": "\"Seeker?\" he said. \"But first years never - you must be the youngest House player in about - \"", "begin": 14662.671, "end": 14670.791, "localBegin": 908.84, "localEnd": 916.96}, {"id": "c009_f000095", "text": "\" - a century,\" said Harry, shoveling pie into his mouth. He felt particularly hungry after the excitement of the afternoon. \"Wood told me.\"", "begin": 14670.791, "end": 14679.471, "localBegin": 916.96, "localEnd": 925.64}, {"id": "c009_f000096", "text": "Ron was so amazed, so impressed, he just sat and gaped at Harry.", "begin": 14679.471, "end": 14684.471, "localBegin": 925.64, "localEnd": 930.64}, {"id": "c009_f000097", "text": "\"I start training next week,\" said Harry. \"Only don't tell anyone, Wood wants to keep it a secret.\"", "begin": 14684.471, "end": 14690.351, "localBegin": 930.64, "localEnd": 936.52}, {"id": "c009_f000098", "text": "Fred and George Weasley now came into the hall, spotted Harry, and hurried over.", "begin": 14690.351, "end": 14694.711, "localBegin": 936.52, "localEnd": 940.88}, {"id": "c009_f000099", "text": "\"Well done,\" said George in a low voice. \"Wood told us. We're on the team too - Beaters.\"", "begin": 14694.711, "end": 14701.111, "localBegin": 940.88, "localEnd": 947.28}, {"id": "c009_f000100", "text": "\"I tell you, we're going to win that Quidditch Cup for sure this year,\" said Fred. \"We haven't won since Charlie left, but this year's team is going to be brilliant. You must be good, Harry, Wood was almost skipping when he told us.\"", "begin": 14701.111, "end": 14715.631, "localBegin": 947.28, "localEnd": 961.8}, {"id": "c009_f000101", "text": "\"Anyway, we've got to go, Lee Jordan reckons he's found a new secret passageway out of the school.\"", "begin": 14715.631, "end": 14721.791, "localBegin": 961.8, "localEnd": 967.96}, {"id": "c009_f000102", "text": "\"Bet it's that one behind the statue of Gregory the Smarmy that we found in our first week. See you.\"", "begin": 14721.791, "end": 14728.351, "localBegin": 967.96, "localEnd": 974.52}, {"id": "c009_f000103", "text": "Fred and George had hardly disappeared when someone far less welcome turned up: Malfoy, flanked by Crabbe and Goyle.", "begin": 14728.351, "end": 14736.671, "localBegin": 974.52, "localEnd": 982.84}, {"id": "c009_f000104", "text": "\"Having a last meal, Potter? When are you getting the train back to the Muggles?\"", "begin": 14736.671, "end": 14743.311, "localBegin": 982.84, "localEnd": 989.48}, {"id": "c009_f000105", "text": "\"You're a lot braver now that you're back on the ground and you've got your little friends with you,\" said Harry coolly. There was of course nothing at all little about Crabbe and Goyle, but as the High Table was full of teachers, neither of them could do more than crack their knuckles and scowl.", "begin": 14743.311, "end": 14760.191, "localBegin": 989.48, "localEnd": 1006.36}, {"id": "c009_f000106", "text": "\"I'd take you on anytime on my own,\" said Malfoy. \"Tonight, if you want. Wizard's duel. Wands only - no contact. What's the matter? Never heard of a wizard's duel before, I suppose?\"", "begin": 14760.191, "end": 14774.591, "localBegin": 1006.36, "localEnd": 1020.76}, {"id": "c009_f000107", "text": "\"Of course he has,\" said Ron, wheeling around. \"I'm his second, who's yours?\"", "begin": 14774.591, "end": 14779.711, "localBegin": 1020.76, "localEnd": 1025.88}, {"id": "c009_f000108", "text": "Malfoy looked at Crabbe and Goyle, sizing them up.", "begin": 14779.711, "end": 14782.991, "localBegin": 1025.88, "localEnd": 1029.16}, {"id": "c009_f000109", "text": "\"Crabbe,\" he said. \"Midnight all right? We'll meet you in the trophy room; that's always unlocked.\"", "begin": 14782.991, "end": 14791.551, "localBegin": 1029.16, "localEnd": 1037.72}, {"id": "c009_f000110", "text": "When Malfoy had gone, Ron and Harry looked at each other.", "begin": 14791.551, "end": 14795.511, "localBegin": 1037.72, "localEnd": 1041.68}, {"id": "c009_f000111", "text": "\"What is a wizard's duel?\" said Harry. \"And what do you mean, you're my second?\"", "begin": 14795.511, "end": 14801.751, "localBegin": 1041.68, "localEnd": 1047.92}, {"id": "c009_f000112", "text": "\"Well, a second's there to take over if you die,\" said Ron casually, getting started at last on his cold pie. Catching the look on Harry's face, he added", "begin": 14801.751, "end": 14813.111, "localBegin": 1047.92, "localEnd": 1059.28}, {"id": "c009_f000113", "text": "quickly, \"But people only die in proper duels, you know, with real wizards. The most you and Malfoy'll be able to do is send sparks at each other. Neither of you knows enough magic
