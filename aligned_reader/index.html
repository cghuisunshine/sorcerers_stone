  <title>Harry Potter and the Sorcerer&#x27;s Stone</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f5f4;
      --surface: #ffffff;
      --line: #d7d3cc;
      --text: #1c1917;
      --muted: #6b6258;
      --active: #fff3c4;
      --active-line: #b45309;
      --button: #1c1917;
      --button-text: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      font-size: 16px;
      line-height: 1.55;
    }
    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
    }
    aside {
      border-right: 1px solid var(--line);
      background: var(--surface);
      height: 100vh;
      position: sticky;
      top: 0;
      overflow: auto;
      padding: 20px 16px;
    }
    .book-title {
      font-size: 15px;
      font-weight: 700;
      margin: 0 0 16px;
      line-height: 1.3;
    }
    .chapter-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .chapter-link {
      width: 100%;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      display: grid;
      grid-template-columns: 32px 1fr;
      gap: 8px;
      padding: 8px;
      text-align: left;
      font: inherit;
      line-height: 1.3;
    }
    .chapter-link:hover { background: #f0eee9; }
    .chapter-link.active {
      background: #e7e1d8;
      font-weight: 650;
    }
    .chapter-number { color: var(--muted); font-variant-numeric: tabular-nums; }
    main {
      min-width: 0;
      padding: 28px 32px 112px;
    }
    .topbar {
      max-width: 840px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    h1 {
      font-size: 22px;
      line-height: 1.25;
      margin: 0;
      font-weight: 750;
    }
    .time {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .reader {
      max-width: 840px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 28px 34px;
    }
    .chapter-heading {
      font-size: 20px;
      margin: 0 0 22px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }
    .paragraph {
      margin: 0 0 14px;
      padding: 3px 6px;
      border-left: 3px solid transparent;
      border-radius: 4px;
      cursor: pointer;
    }
    .paragraph:hover { background: #f8f6f1; }
    .paragraph.active {
      background: var(--active);
      border-left-color: var(--active-line);
    }
    .outro {
      color: var(--muted);
      margin: 0;
    }
    .player {
      position: fixed;
      left: 280px;
      right: 0;
      bottom: 0;
      border-top: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.96);
      display: grid;
      grid-template-columns: auto auto auto minmax(120px, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: 12px 20px;
    }
    button.control {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      min-height: 36px;
      padding: 0 12px;
      font: inherit;
      font-weight: 650;
    }
    button.primary {
      background: var(--button);
      color: var(--button-text);
      border-color: var(--button);
      min-width: 68px;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #b45309;
    }
    @media (max-width: 760px) {
      .app { display: block; }
      aside {
        position: static;
        height: auto;
        max-height: 240px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      main { padding: 20px 16px 120px; }
      .reader { padding: 22px 18px; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .player {
        left: 0;
        grid-template-columns: auto auto auto;
      }
      .player input[type="range"] {
        grid-column: 1 / -1;
      }
    }
  </style>

  <script>
    const manifest = {"title": "Harry Potter and the Sorcerer's Stone", "duration": 30810.5, "chapters": [{"kind": "chapter", "number": 1, "title": "The Boy Who Lived", "audio": "../Harry Potter and the Sorcerer's Stone, Book 1 (Unabridged)/001 - Harry Potter and the Sorcerer's Stone, Book 1 (Unabridged).mp3", "start": 0.0, "end": 1758.961, "duration": 1758.961, "paragraphs": [{"id": "c001_f000001", "text": "Chapter One. The Boy Who Lived.", "begin": 0.0, "end": 10.16, "localBegin": 0.0, "localEnd": 10.16}, {"id": "c001_f000002", "text": "Mr. and Mrs. Dursley, of number four, Privet Drive, were proud to say that they were perfectly normal, thank you very much. They were the last people you'd expect to be involved in anything strange or mysterious, because they just didn't hold with such nonsense.", "begin": 10.16, "end": 49.16, "localBegin": 10.16, "localEnd": 49.16}, {"id": "c001_f000003", "text": "Mr. Dursley was the director of a firm called Grunnings, which made drills. He was a big, beefy man with hardly any neck, although he did have a very large mustache. Mrs. Dursley was thin and blonde and had nearly twice the usual amount of neck, which came in very useful as she spent so much of her time craning over garden fences, spying on the neighbors. The Dursleys had a small son called Dudley and in their opinion there was no finer boy anywhere.", "begin": 49.16, "end": 77.28, "localBegin": 49.16, "localEnd": 77.28}, {"id": "c001_f000004", "text": "The Dursleys had everything they wanted, but they also had a secret, and their greatest fear was that somebody would discover it. They didn't think they could bear it if anyone found out about the Potters. Mrs. Potter was Mrs. Dursley's sister, but they hadn't met for several years; in fact, Mrs. Dursley pretended she didn't have a sister, because her sister and her good-for-nothing husband were as unDursleyish as it was possible to be. The Dursleys shuddered to think what the neighbors would say if the Potters arrived in the street. The Dursleys knew that the Potters had a small son, too, but they had never even seen him. This boy was another good reason for keeping the Potters away; they didn't want Dudley mixing with a child like that.", "begin": 77.28, "end": 121.24, "localBegin": 77.28, "localEnd": 121.24}, {"id": "c001_f000005", "text": "When Mr. and Mrs. Dursley woke up on the dull, gray Tuesday our story starts, there was nothing about the cloudy sky outside to suggest that strange and mysterious things would soon be happening all over the country. Mr. Dursley hummed as he picked out his most boring tie for work, and Mrs. Dursley gossiped away happily as she wrestled a screaming Dudley into his high chair.", "begin": 121.24, "end": 141.92, "localBegin": 121.24, "localEnd": 141.92}, {"id": "c001_f000006", "text": "None of them noticed a large, tawny owl flutter past the window.", "begin": 141.92, "end": 147.4, "localBegin": 141.92, "localEnd": 147.4}, {"id": "c001_f000007", "text": "At half past eight, Mr. Dursley picked up his briefcase, pecked Mrs. Dursley on the cheek, and tried to kiss Dudley good-bye but missed, because Dudley was now having a tantrum and throwing his cereal at the walls. \"Little tyke,\" chortled Mr. Dursley as he left the house. He got into his car and backed out of number four's drive.", "begin": 147.4, "end": 167.44, "localBegin": 147.4, "localEnd": 167.44}, {"id": "c001_f000008", "text": "It was on the corner of the street that he noticed the first sign of something peculiar - a cat reading a map. For a second, Mr. Dursley didn't realize what he had seen - then he jerked his head around to look again. There was a tabby cat standing on the corner of Privet Drive, but there wasn't a map in sight. What could", "begin": 167.44, "end": 188.52, "localBegin": 167.44, "localEnd": 188.52}, {"id": "c001_f000009", "text": "he have been thinking of? It must have been a trick of the light. Mr. Dursley blinked and stared at the cat. It stared back. As Mr. Dursley drove around the corner and up the road, he watched the cat in his mirror. It was now reading the sign that said Privet Drive - no, looking at the sign; cats couldn't read maps or signs. Mr. Dursley gave himself a little shake and put the cat out of his mind. As he drove toward town he thought of nothing except a large order of drills he was hoping to get that day.", "begin": 188.52, "end": 221.4, "localBegin": 188.52, "localEnd": 221.4}, {"id": "c001_f000010", "text": "But on the edge of town, drills were driven out of his mind by something else. As he sat in the usual morning traffic jam, he couldn't help noticing that there seemed to be a lot of strangely dressed people about. People in cloaks. Mr. Dursley couldn't bear people who dressed in funny clothes - the getups you saw on young people! He supposed this was some stupid new fashion. He drummed his fingers on the steering wheel and his eyes fell on a huddle of these weirdos standing quite close by. They were whispering excitedly together. Mr. Dursley was enraged to see that a couple of them weren't young at all; why, that man had to be older than he was, and wearing an emerald-green cloak! The nerve of him! But then it struck Mr. Dursley that this was probably some silly stunt - these people were obviously collecting for something . . . yes, that would be it. The traffic moved on and a few minutes later, Mr. Dursley arrived in the Grunnings parking lot, his mind back on drills.", "begin": 221.4, "end": 285.52, "localBegin": 221.4, "localEnd": 285.52}, {"id": "c001_f000011", "text": "Mr. Dursley always sat with his back to the window in his office on the ninth floor. If he hadn't, he might have found it harder to concentrate on drills that morning. He didn't see the owls swooping past in broad daylight, though people down in the street did; they pointed and gazed open-mouthed as owl after owl sped overhead. Most of them had never seen an owl even at nighttime. Mr. Dursley, however, had a perfectly normal, owl-free morning. He yelled at five different people. He made several important telephone calls and shouted a bit more. He was in a very good mood until lunchtime, when he thought he'd stretch his legs and walk across the road to buy himself a bun from the bakery.", "begin": 285.52, "end": 328.8, "localBegin": 285.52, "localEnd": 328.8}, {"id": "c001_f000012", "text": "He'd forgotten all about the people in cloaks until he passed a group of them next to the baker's. He eyed them angrily as he passed. He didn't know why, but they made him uneasy. This bunch were whispering excitedly, too, and he couldn't see a single collecting tin. It was on his way back past them, clutching a large doughnut in a bag, that he caught a few words of what they were saying.", "begin": 328.8, "end": 349.92, "localBegin": 328.8, "localEnd": 349.92}, {"id": "c001_f000013", "text": "\"The Potters, that's right, that's what I heard - \"", "begin": 349.92, "end": 353.52, "localBegin": 349.92, "localEnd": 353.52}, {"id": "c001_f000014", "text": "\" - yes, their son, Harry - \"", "begin": 353.52, "end": 356.76, "localBegin": 353.52, "localEnd": 356.76}, {"id": "c001_f000015", "text": "Mr. Dursley stopped dead. Fear flooded him. He looked back at the whisperers as", "begin": 356.76, "end": 361.56, "localBegin": 356.76, "localEnd": 361.56}, {"id": "c001_f000016", "text": "if he wanted to say something to them, but thought better of it.", "begin": 361.56, "end": 365.88, "localBegin": 361.56, "localEnd": 365.88}, {"id": "c001_f000017", "text": "He dashed back across the road, hurried up to his office, snapped at his secretary not to disturb him, seized his telephone, and had almost finished dialing his home number when he changed his mind. He put the receiver back down and stroked his mustache, thinking . . . no, he was being stupid. Potter wasn't such an unusual name. He was sure there were lots of people called Potter who had a son called Harry. Come to think of it, he wasn't even sure his nephew was called Harry. He'd never even seen the boy. It might have been Harvey. Or Harold. There was no point in worrying Mrs. Dursley; she always got so upset at any mention of her sister. He didn't blame her - if he'd had a sister like that . . . but all the same, those people in cloaks . . .", "begin": 365.88, "end": 410.32, "localBegin": 365.88, "localEnd": 410.32}, {"id": "c001_f000018", "text": "He found it a lot harder to concentrate on drills that afternoon and when he left the building at five o'clock, he was still so worried that he walked straight into someone just outside the door.", "begin": 410.32, "end": 419.2, "localBegin": 410.32, "localEnd": 419.2}, {"id": "c001_f000019", "text": "\"Sorry,\" he grunted, as the tiny old man stumbled and almost fell. It was a few seconds before Mr. Dursley realized that the man was wearing a violet cloak. He didn't seem at all upset at being almost knocked to the ground. On the contrary, his face split into a wide smile and he said in a squeaky voice that made passersby stare, \"Don't be sorry, my dear sir, for nothing could upset me today! Rejoice, for You-Know-Who has gone at last! Even Muggles like yourself should be celebrating, this happy, happy day!\"", "begin": 419.2, "end": 452.56, "localBegin": 419.2, "localEnd": 452.56}, {"id": "c001_f000020", "text": "And the old man hugged Mr. Dursley around the middle and walked off.", "begin": 452.56, "end": 457.0, "localBegin": 452.56, "localEnd": 457.0}, {"id": "c001_f000021", "text": "Mr. Dursley stood rooted to the spot. He had been hugged by a complete stranger. He also thought he had been called a Muggle, whatever that was. He was rattled. He hurried to his car and set off for home, hoping he was imagining things, which he had never hoped before, because he didn't approve of imagination.", "begin": 457.0, "end": 477.92, "localBegin": 457.0, "localEnd": 477.92}, {"id": "c001_f000022", "text": "As he pulled into the driveway of number four, the first thing he saw - and it didn't improve his mood - was the tabby cat he'd spotted that morning. It was now sitting on his garden wall. He was sure it was the same one; it had the same markings around its eyes.", "begin": 477.92, "end": 491.84, "localBegin": 477.92, "localEnd": 491.84}, {"id": "c001_f000023", "text": "\"Shoo!\" said Mr. Dursley loudly.", "begin": 491.84, "end": 496.24, "localBegin": 491.84, "localEnd": 496.24}, {"id": "c001_f000024", "text": "The cat didn't move. It just gave him a stern look. Was this normal cat behavior? Mr. Dursley wondered. Trying to pull himself together, he let himself into the house. He was still determined not to mention anything to his wife.", "begin": 496.24, "end": 510.36, "localBegin": 496.24, "localEnd": 510.36}, {"id": "c001_f000025", "text": "Mrs. Dursley had had a nice, normal day. She told him over dinner all about Mrs. Next Door's problems with her daughter and how Dudley had learned a new word (\"Won't!\"). Mr. Dursley tried to act normally. When Dudley had been put to bed, he went into the living room in time to catch the last report on the evening news:", "begin": 510.36, "end": 530.24, "localBegin": 510.36, "localEnd": 530.24}, {"id": "c001_f000026", "text": "\"And finally, bird-watchers everywhere have reported that the nation's owls have been behaving very unusually today. Although owls normally hunt at night and are hardly ever seen in daylight, there have been hundreds of sightings of these birds flying in every direction since sunrise. Experts are unable to explain why the owls have suddenly changed their sleeping pattern.\" The newscaster allowed himself a grin. \"Most mysterious. And now, over to Jim McGuffin with the weather. Going to be any more showers of owls tonight, Jim?\"", "begin": 530.24, "end": 564.84, "localBegin": 530.24, "localEnd": 564.84}, {"id": "c001_f000027", "text": "\"Well, Ted,\" said the weatherman, \"I don't know about that, but it's not only the owls that have been acting oddly today. Viewers as far apart as Kent, Yorkshire, and Dundee have been phoning in to tell me that instead of the rain I promised yesterday, they've had a downpour of shooting stars! Perhaps people have been celebrating Bonfire Night early - it's not until next week, folks! But I can promise a wet night tonight.\"", "begin": 564.84, "end": 593.92, "localBegin": 564.84, "localEnd": 593.92}, {"id": "c001_f000028", "text": "Mr. Dursley sat frozen in his armchair. Shooting stars all over Britain? Owls flying by daylight? Mysterious people in cloaks all over the place? And a whisper, a whisper about the Potters . . .", "begin": 593.92, "end": 607.8, "localBegin": 593.92, "localEnd": 607.8}, {"id": "c001_f000029", "text": "Mrs. Dursley came into the living room carrying two cups of tea. It was no good. He'd have to say something to her. He cleared his throat nervously. \"Er - Petunia, dear - you haven't heard from your sister lately, have you?\"", "begin": 607.8, "end": 622.24, "localBegin": 607.8, "localEnd": 622.24}, {"id": "c001_f000030", "text": "As he had expected, Mrs. Dursley looked shocked and angry. After all, they normally pretended she didn't have a sister.", "begin": 622.24, "end": 628.28, "localBegin": 622.24, "localEnd": 628.28}, {"id": "c001_f000031", "text": "\"No,\" she said sharply. \"Why?\"", "begin": 628.28, "end": 630.96, "localBegin": 628.28, "localEnd": 630.96}, {"id": "c001_f000032", "text": "\"Funny stuff on the news,\" Mr. Dursley mumbled. \"Owls . . . shooting stars . . . and there were a lot of funny-looking people in town today . . .\"", "begin": 630.96, "end": 641.36, "localBegin": 630.96, "localEnd": 641.36}, {"id": "c001_f000033", "text": "\"So?\" snapped Mrs. Dursley.", "begin": 641.36, "end": 643.88, "localBegin": 641.36, "localEnd": 643.88}, {"id": "c001_f000034", "text": "\"Well, I just thought . . . maybe . . . it was something to do with . . . you know . . . her crowd.\"", "begin": 643.88, "end": 652.32, "localBegin": 643.88, "localEnd": 652.32}, {"id": "c001_f000035", "text": "Mrs. Dursley sipped her tea through pursed lips. Mr. Dursley wondered whether he dared tell her he'd heard the name \"Potter.\" He decided he didn't dare. Instead he said, as casually as he could, \"Their son - he'd be about Dudley's age now,", "begin": 652.32, "end": 668.84, "localBegin": 652.32, "localEnd": 668.84}, {"id": "c001_f000036", "text": "wouldn't he?\"", "begin": 668.84, "end": 669.36, "localBegin": 668.84, "localEnd": 669.36}, {"id": "c001_f000037", "text": "\"I suppose so,\" said Mrs. Dursley stiffly.", "begin": 669.36, "end": 673.64, "localBegin": 669.36, "localEnd": 673.64}, {"id": "c001_f000038", "text": "\"What's his name again? Howard, isn't it?\"", "begin": 673.64, "end": 677.12, "localBegin": 673.64, "localEnd": 677.12}, {"id": "c001_f000039", "text": "\"Harry. Nasty, common name, if you ask me.\"", "begin": 677.12, "end": 680.68, "localBegin": 677.12, "localEnd": 680.68}, {"id": "c001_f000040", "text": "\"Oh, yes,\" said Mr. Dursley, his heart sinking horribly. \"Yes, I quite agree.\"", "begin": 680.68, "end": 688.64, "localBegin": 680.68, "localEnd": 688.64}, {"id": "c001_f000041", "text": "He didn't say another word on the subject as they went upstairs to bed. While Mrs. Dursley was in the bathroom, Mr. Dursley crept to the bedroom window and peered down into the front garden. The cat was still there. It was staring down Privet Drive as though it were waiting for something.", "begin": 688.64, "end": 705.4, "localBegin": 688.64, "localEnd": 705.4}, {"id": "c001_f000042", "text": "Was he imagining things? Could all this have anything to do with the Potters? If it did . . . if it got out that they were related to a pair of - well, he didn't think he could bear it.", "begin": 705.4, "end": 718.4, "localBegin": 705.4, "localEnd": 718.4}, {"id": "c001_f000043", "text": "The Dursleys got into bed. Mrs. Dursley fell asleep quickly but Mr. Dursley lay awake, turning it all over in his mind. His last, comforting thought before he fell asleep was that even if the Potters were involved, there was no reason for them to come near him and Mrs. Dursley. The Potters knew very well what he and Petunia thought about them and their kind. . . . He couldn't see how he and Petunia could get mixed up in anything that might be going on - he yawned and turned over - it couldn't affect them. . . .", "begin": 718.4, "end": 750.08, "localBegin": 718.4, "localEnd": 750.08}, {"id": "c001_f000044", "text": "How very wrong he was.", "begin": 750.08, "end": 753.96, "localBegin": 750.08, "localEnd": 753.96}, {"id": "c001_f000045", "text": "Mr. Dursley might have been drifting into an uneasy sleep, but the cat on the wall outside was showing no sign of sleepiness. It was sitting as still as a statue, its eyes fixed unblinkingly on the far corner of Privet Drive. It didn't so much as quiver when a car door slammed on the next street, nor when two owls swooped overhead. In fact, it was nearly midnight before the cat moved at all.", "begin": 753.96, "end": 781.56, "localBegin": 753.96, "localEnd": 781.56}, {"id": "c001_f000046", "text": "A man appeared on the corner the cat had been watching, appeared so suddenly and silently you'd have thought he'd just popped out of the ground. The cat's tail twitched and its eyes narrowed.", "begin": 781.56, "end": 793.8, "localBegin": 781.56, "localEnd": 793.8}, {"id": "c001_f000047", "text": "Nothing like this man had ever been seen on Privet Drive. He was tall, thin, and very old, judging by the silver of his hair and beard, which were both long enough to tuck into his belt. He was wearing long robes, a purple cloak that swept the ground, and high-heeled, buckled boots. His blue eyes were light, bright, and sparkling behind half-moon spectacles and his nose was very long and crooked, as", "begin": 793.8, "end": 820.96, "localBegin": 793.8, "localEnd": 820.96}, {"id": "c001_f000048", "text": "though it had been broken at least twice. This man's name was Albus Dumbledore.", "begin": 820.96, "end": 828.48, "localBegin": 820.96, "localEnd": 828.48}, {"id": "c001_f000049", "text": "Albus Dumbledore didn't seem to realize that he had just arrived in a street where everything from his name to his boots was unwelcome. He was busy rummaging in his cloak, looking for something. But he did seem to realize he was being watched, because he looked up suddenly at the cat, which was still staring at him from the other end of the street. For some reason, the sight of the cat seemed to amuse him. He chuckled and muttered, \"I should have known.\"", "begin": 828.48, "end": 856.08, "localBegin": 828.48, "localEnd": 856.08}, {"id": "c001_f000050", "text": "He found what he was looking for in his inside pocket. It seemed to be a silver cigarette lighter. He flicked it open, held it up in the air, and clicked it. The nearest street lamp went out with a little pop. He clicked it again - the next lamp flickered into darkness. Twelve times he clicked the Put-Outer, until the only lights left on the whole street were two tiny pinpricks in the distance, which were the eyes of the cat watching him. If anyone looked out of their window now, even beady-eyed Mrs. Dursley, they wouldn't be able to see anything that was happening down on the pavement. Dumbledore slipped the Put-Outer back inside his cloak and set off down the street toward number four, where he sat down on the wall next to the cat. He didn't look at it, but after a moment he spoke to it.", "begin": 856.08, "end": 903.76, "localBegin": 856.08, "localEnd": 903.76}, {"id": "c001_f000051", "text": "\"Fancy seeing you here, Professor McGonagall.\"", "begin": 903.76, "end": 910.0, "localBegin": 903.76, "localEnd": 910.0}, {"id": "c001_f000052", "text": "He turned to smile at the tabby, but it had gone. Instead he was smiling at a rather severe-looking woman who was wearing square glasses exactly the shape of the markings the cat had had around its eyes. She, too, was wearing a cloak, an emerald one. Her black hair was drawn into a tight bun. She looked distinctly ruffled.", "begin": 910.0, "end": 930.56, "localBegin": 910.0, "localEnd": 930.56}, {"id": "c001_f000053", "text": "\"How did you know it was me?\" she asked.", "begin": 930.56, "end": 934.28, "localBegin": 930.56, "localEnd": 934.28}, {"id": "c001_f000054", "text": "\"My dear Professor, I've never seen a cat sit so stiffly.\"", "begin": 934.28, "end": 939.8, "localBegin": 934.28, "localEnd": 939.8}, {"id": "c001_f000055", "text": "\"You'd be stiff if you'd been sitting on a brick wall all day,\" said Professor McGonagall.", "begin": 939.8, "end": 945.4, "localBegin": 939.8, "localEnd": 945.4}, {"id": "c001_f000056", "text": "\"All day? When you could have been celebrating? I must have passed a dozen feasts and parties on my way here.\"", "begin": 945.4, "end": 953.48, "localBegin": 945.4, "localEnd": 953.48}, {"id": "c001_f000057", "text": "Professor McGonagall sniffed angrily.", "begin": 953.48, "end": 956.2, "localBegin": 953.48, "localEnd": 956.2}, {"id": "c001_f000058", "text": "\"Oh yes, everyone's celebrating, all right,\" she said impatiently. \"You'd think they'd be a bit more careful, but no - even the Muggles have noticed something's going on. It was on their news.\" She jerked her head back at the Dursleys' dark living-room window. \"I heard it. Flocks of owls . . . shooting stars. . . . Well, they're not completely stupid. They were bound to notice", "begin": 956.2, "end": 977.68, "localBegin": 956.2, "localEnd": 977.68}, {"id": "c001_f000059", "text": "something. Shooting stars down in Kent - I'll bet that was Dedalus Diggle. He never had much sense.\"", "begin": 977.68, "end": 984.6, "localBegin": 977.68, "localEnd": 984.6}, {"id": "c001_f000060", "text": "\"You can't blame them,\" said Dumbledore gently. \"We've had precious little to celebrate for eleven years.\"", "begin": 984.6, "end": 992.44, "localBegin": 984.6, "localEnd": 992.44}, {"id": "c001_f000061", "text": "\"I know that,\" said Professor McGonagall irritably. \"But that's no reason to lose our heads. People are being downright careless, out on the streets in broad daylight, not even dressed in Muggle clothes, swapping rumors.\"", "begin": 992.44, "end": 1008.32, "localBegin": 992.44, "localEnd": 1008.32}, {"id": "c001_f000062", "text": "She threw a sharp, sideways glance at Dumbledore here, as though hoping he was going to tell her something, but he didn't, so she went on. \"A fine thing it would be if, on the very day You-Know-Who seems to have disappeared at last, the Muggles found out about us all. I suppose he really has gone, Dumbledore?\"", "begin": 1008.32, "end": 1029.08, "localBegin": 1008.32, "localEnd": 1029.08}, {"id": "c001_f000063", "text": "\"It certainly seems so,\" said Dumbledore. \"We have much to be thankful for. Would you care for a lemon drop?\"", "begin": 1029.08, "end": 1038.12, "localBegin": 1029.08, "localEnd": 1038.12}, {"id": "c001_f000064", "text": "\"A what?\"", "begin": 1038.12, "end": 1039.36, "localBegin": 1038.12, "localEnd": 1039.36}, {"id": "c001_f000065", "text": "\"A lemon drop. They're a kind of Muggle sweet I'm rather fond of.\"", "begin": 1039.36, "end": 1044.92, "localBegin": 1039.36, "localEnd": 1044.92}, {"id": "c001_f000066", "text": "\"No, thank you,\" said Professor McGonagall coldly, as though she didn't think this was the moment for lemon drops. \"As I say, even if You-Know-Who has gone - \"", "begin": 1044.92, "end": 1055.56, "localBegin": 1044.92, "localEnd": 1055.56}, {"id": "c001_f000067", "text": "\"My dear Professor, surely a sensible person like yourself can call him by his name? All this 'You-Know-Who' nonsense - for eleven years I have been trying to persuade people to call him by his proper name: Voldemort.\" Professor McGonagall flinched, but Dumbledore, who was unsticking two lemon drops, seemed not to notice. \"It all gets so confusing if we keep saying 'You-Know-Who.' I have never seen any reason to be frightened of saying Voldemort's name.\"", "begin": 1055.56, "end": 1087.6, "localBegin": 1055.56, "localEnd": 1087.6}, {"id": "c001_f000068", "text": "\"I know you haven't,\" said Professor McGonagall, sounding half exasperated, half admiring. \"But you're different. Everyone knows you're the only one You-Know-oh, all right, Voldemort, was frightened of.\"", "begin": 1087.6, "end": 1103.0, "localBegin": 1087.6, "localEnd": 1103.0}, {"id": "c001_f000069", "text": "\"You flatter me,\" said Dumbledore calmly. \"Voldemort had powers I will never have.\"", "begin": 1103.0, "end": 1109.88, "localBegin": 1103.0, "localEnd": 1109.88}, {"id": "c001_f000070", "text": "\"Only because you're too - well - noble to use them.\"", "begin": 1109.88, "end": 1115.56, "localBegin": 1109.88, "localEnd": 1115.56}, {"id": "c001_f000071", "text": "\"It's lucky it's dark. I haven't blushed so much since Madam Pomfrey told me she liked my new earmuffs.\"", "begin": 1115.56, "end": 1124.04, "localBegin": 1115.56, "localEnd": 1124.04}, {"id": "c001_f000072", "text": "Professor McGonagall shot a sharp look at Dumbledore and said, \"The owls are nothing next to the rumors that are flying around. You know what everyone's saying? About why he's disappeared? About what finally stopped him?\"", "begin": 1124.04, "end": 1139.72, "localBegin": 1124.04, "localEnd": 1139.72}, {"id": "c001_f000073", "text": "It seemed that Professor McGonagall had reached the point she was most anxious to discuss, the real reason she had been waiting on a cold, hard wall all day, for neither as a cat nor as a woman had she fixed Dumbledore with such a piercing stare as she did now. It was plain that whatever \"everyone\" was saying, she was not going to believe it until Dumbledore told her it was true. Dumbledore, however, was choosing another lemon drop and did not answer.", "begin": 1139.72, "end": 1167.12, "localBegin": 1139.72, "localEnd": 1167.12}, {"id": "c001_f000074", "text": "\"What they're saying,\" she pressed on, \"is that last night Voldemort turned up in Godric's Hollow. He went to find the Potters. The rumor is that Lily and James Potter are - are - that they're - dead.\"", "begin": 1167.12, "end": 1186.12, "localBegin": 1167.12, "localEnd": 1186.12}, {"id": "c001_f000075", "text": "Dumbledore bowed his head. Professor McGonagall gasped.", "begin": 1186.12, "end": 1189.8, "localBegin": 1186.12, "localEnd": 1189.8}, {"id": "c001_f000076", "text": "\"Lily and James . . . I can't believe it . . . I didn't want to believe it . . . Oh, Albus . . .\"", "begin": 1189.8, "end": 1197.2, "localBegin": 1189.8, "localEnd": 1197.2}, {"id": "c001_f000077", "text": "Dumbledore reached out and patted her on the shoulder. \"I know . . . I know . . .\" he said heavily.", "begin": 1197.2, "end": 1204.64, "localBegin": 1197.2, "localEnd": 1204.64}, {"id": "c001_f000078", "text": "Professor McGonagall's voice trembled as she went on. \"That's not all. They're saying he tried to kill the Potters' son, Harry. But - he couldn't. He couldn't kill that little boy. No one knows why, or how, but they're saying that when he couldn't kill Harry Potter, Voldemort's power somehow broke - and that's why he's gone.\"", "begin": 1204.64, "end": 1230.08, "localBegin": 1204.64, "localEnd": 1230.08}, {"id": "c001_f000079", "text": "Dumbledore nodded glumly.", "begin": 1230.08, "end": 1231.48, "localBegin": 1230.08, "localEnd": 1231.48}, {"id": "c001_f000080", "text": "\"It's - it's true?\" faltered Professor McGonagall. \"After all he's done . . . all the people he's killed . . . he couldn't kill a little boy? It's just astounding . . . of all the things to stop him . . . but how in the name of heaven did Harry survive?\"", "begin": 1231.48, "end": 1250.04, "localBegin": 1231.48, "localEnd": 1250.04}, {"id": "c001_f000081", "text": "\"We can only guess,\" said Dumbledore. \"We may never know.\"", "begin": 1250.04, "end": 1255.16, "localBegin": 1250.04, "localEnd": 1255.16}, {"id": "c001_f000082", "text": "Professor McGonagall pulled out a lace handkerchief and dabbed at her eyes beneath her spectacles. Dumbledore gave a great sniff as he took a golden watch from his pocket and examined it. It was a very odd watch. It had twelve hands but no numbers; instead, little planets were moving around the edge. It must have made sense to Dumbledore, though, because he put it back in his pocket and said, \"Hagrid's late. I suppose it was he who told you I'd be here, by the way?\"", "begin": 1255.16, "end": 1285.08, "localBegin": 1255.16, "localEnd": 1285.08}, {"id": "c001_f000083", "text": "\"Yes,\" said Professor McGonagall. \"And I don't suppose you're going to tell me why you're here, of all places?\"", "begin": 1285.08, "end": 1292.48, "localBegin": 1285.08, "localEnd": 1292.48}, {"id": "c001_f000084", "text": "\"I've come to bring Harry to his aunt and uncle. They're the only family he has left now.\"", "begin": 1292.48, "end": 1299.4, "localBegin": 1292.48, "localEnd": 1299.4}, {"id": "c001_f000085", "text": "\"You don't mean - you can't mean the people who live here?\" cried Professor McGonagall, jumping to her feet and pointing at number four. \"Dumbledore - you can't. I've been watching them all day. You couldn't find two people who are less like us. And they've got this son - I saw him kicking his mother all the way up the street, screaming for sweets. Harry Potter come and live here!\"", "begin": 1299.4, "end": 1324.6, "localBegin": 1299.4, "localEnd": 1324.6}, {"id": "c001_f000086", "text": "\"It's the best place for him,\" said Dumbledore firmly. \"His aunt and uncle will be able to explain everything to him when he's older. I've written them a letter.\"", "begin": 1324.6, "end": 1334.84, "localBegin": 1324.6, "localEnd": 1334.84}, {"id": "c001_f000087", "text": "\"A letter?\" repeated Professor McGonagall faintly, sitting back down on the wall. \"Really, Dumbledore, you think you can explain all this in a letter? These people will never understand him! He'll be famous - a legend - I wouldn't be surprised if today was known as Harry Potter Day in the future - there will be books written about Harry - every child in our world will know his name!\"", "begin": 1334.84, "end": 1360.72, "localBegin": 1334.84, "localEnd": 1360.72}, {"id": "c001_f000088", "text": "\"Exactly,\" said Dumbledore, looking very seriously over the top of his halfmoon glasses. \"It would be enough to turn any boy's head. Famous before he can walk and talk! Famous for something he won't even remember! Can't you see how much better off he'll be, growing up away from all that until he's ready to take it?\"", "begin": 1360.72, "end": 1384.52, "localBegin": 1360.72, "localEnd": 1384.52}, {"id": "c001_f000089", "text": "Professor McGonagall opened her mouth, changed her mind, swallowed, and then said, \"Yes - yes, you're right, of course. But how is the boy getting here, Dumbledore?\" She eyed his cloak suddenly as though she thought he might be hiding Harry underneath it.", "begin": 1384.52, "end": 1401.92, "localBegin": 1384.52, "localEnd": 1401.92}, {"id": "c001_f000090", "text": "\"Hagrid's bringing him.\"", "begin": 1401.92, "end": 1404.24, "localBegin": 1401.92, "localEnd": 1404.24}, {"id": "c001_f000091", "text": "\"You think it - wise - to trust Hagrid with something as important as this?\"", "begin": 1404.24, "end": 1410.0, "localBegin": 1404.24, "localEnd": 1410.0}, {"id": "c001_f000092", "text": "\"I would trust Hagrid with my life,\" said Dumbledore.", "begin": 1410.0, "end": 1414.36, "localBegin": 1410.0, "localEnd": 1414.36}, {"id": "c001_f000093", "text": "\"I'm not saying his heart isn't in the right place,\" said Professor McGonagall grudgingly, \"but you can't pretend he's not careless. He does tend to - what was that?\"", "begin": 1414.36, "end": 1425.52, "localBegin": 1414.36, "localEnd": 1425.52}, {"id": "c001_f000094", "text": "A low rumbling sound had broken the silence around them. It grew steadily", "begin": 1425.52, "end": 1429.36, "localBegin": 1425.52, "localEnd": 1429.36}, {"id": "c001_f000095", "text": "louder as they looked up and down the street for some sign of a headlight; it swelled to a roar as they both looked up at the sky - and a huge motorcycle fell out of the air and landed on the road in front of them.", "begin": 1429.36, "end": 1442.6, "localBegin": 1429.36, "localEnd": 1442.6}, {"id": "c001_f000096", "text": "If the motorcycle was huge, it was nothing to the man sitting astride it. He was almost twice as tall as a normal man and at least five times as wide. He looked simply too big to be allowed, and so wild - long tangles of bushy black hair and beard hid most of his face, he had hands the size of trash can lids, and his feet in their leather boots were like baby dolphins. In his vast, muscular arms he was holding a bundle of blankets.", "begin": 1442.6, "end": 1475.16, "localBegin": 1442.6, "localEnd": 1475.16}, {"id": "c001_f000097", "text": "\"Hagrid,\" said Dumbledore, sounding relieved. \"At last. And where did you get that motorcycle?\"", "begin": 1475.16, "end": 1483.72, "localBegin": 1475.16, "localEnd": 1483.72}, {"id": "c001_f000098", "text": "\"Borrowed it, Professor Dumbledore, sir,\" said the giant, climbing carefully off the motorcycle as he spoke. \"Young Sirius Black lent it to me. I've got him, sir.\"", "begin": 1483.72, "end": 1494.72, "localBegin": 1483.72, "localEnd": 1494.72}, {"id": "c001_f000099", "text": "\"No problems, were there?\"", "begin": 1494.72, "end": 1496.96, "localBegin": 1494.72, "localEnd": 1496.96}, {"id": "c001_f000100", "text": "\"No, sir - house was almost destroyed, but I got him out all right before the Muggles started swarmin' around. He fell asleep as we was flyin' over Bristol.\"", "begin": 1496.96, "end": 1507.64, "localBegin": 1496.96, "localEnd": 1507.64}, {"id": "c001_f000101", "text": "Dumbledore and Professor McGonagall bent forward over the bundle of blankets. Inside, just visible, was a baby boy, fast asleep. Under a tuft of jet-black hair over his forehead they could see a curiously shaped cut, like a bolt of lightning.", "begin": 1507.64, "end": 1524.24, "localBegin": 1507.64, "localEnd": 1524.24}, {"id": "c001_f000102", "text": "\"Is that where - ?\" whispered Professor McGonagall.", "begin": 1524.24, "end": 1527.56, "localBegin": 1524.24, "localEnd": 1527.56}, {"id": "c001_f000103", "text": "\"Yes,\" said Dumbledore. \"He'll have that scar forever.\"", "begin": 1527.56, "end": 1532.52, "localBegin": 1527.56, "localEnd": 1532.52}, {"id": "c001_f000104", "text": "\"Couldn't you do something about it, Dumbledore?\"", "begin": 1532.52, "end": 1536.0, "localBegin": 1532.52, "localEnd": 1536.0}, {"id": "c001_f000105", "text": "\"Even if I could, I wouldn't. Scars can come in handy. I have one myself above my left knee that is a perfect map of the London Underground. Well - give him here, Hagrid - we'd better get this over with.\"", "begin": 1536.0, "end": 1551.48, "localBegin": 1536.0, "localEnd": 1551.48}, {"id": "c001_f000106", "text": "Dumbledore took Harry in his arms and turned toward the Dursleys' house.", "begin": 1551.48, "end": 1556.56, "localBegin": 1551.48, "localEnd": 1556.56}, {"id": "c001_f000107", "text": "\"Could I - could I say good-bye to him, sir?\" asked Hagrid. He bent his great, shaggy head over Harry and gave him what must have been a very scratchy, whiskery kiss. Then, suddenly, Hagrid let out a howl like a wounded dog.", "begin": 1556.56, "end": 1572.2, "localBegin": 1556.56, "localEnd": 1572.2}, {"id": "c001_f000108", "text": "\"Shhh!\" hissed Professor McGonagall, \"you'll wake the Muggles!\"", "begin": 1572.2, "end": 1576.64, "localBegin": 1572.2, "localEnd": 1576.64}, {"id": "c001_f000109", "text": "\"S-s-sorry,\" sobbed Hagrid, taking out a large, spotted handkerchief and burying his face in it. \"But I c-c-can't stand it - Lily an' James dead - an' poor little Harry off ter live with Muggles - \"", "begin": 1576.64, "end": 1591.56, "localBegin": 1576.64, "localEnd": 1591.56}, {"id": "c001_f000110", "text": "\"Yes, yes, it's all very sad, but get a grip on yourself, Hagrid, or we'll be found,\" Professor McGonagall whispered, patting Hagrid gingerly on the arm as Dumbledore stepped over the low garden wall and walked to the front door. He laid Harry gently on the doorstep, took a letter out of his cloak, tucked it inside Harry's blankets, and then came back to the other two. For a full minute the three of them stood and looked at the little bundle; Hagrid's shoulders shook, Professor McGonagall blinked furiously, and the twinkling light that usually shone from Dumbledore's eyes seemed to have gone out.", "begin": 1591.56, "end": 1628.16, "localBegin": 1591.56, "localEnd": 1628.16}, {"id": "c001_f000111", "text": "\"Well,\" said Dumbledore finally, \"that's that. We've no business staying here. We may as well go and join the celebrations.\"", "begin": 1628.16, "end": 1637.52, "localBegin": 1628.16, "localEnd": 1637.52}, {"id": "c001_f000112", "text": "\"Yeah,\" said Hagrid in a very muffled voice, \"I'd best get this bike away. G'night, Professor McGonagall - Professor Dumbledore, sir.\"", "begin": 1637.52, "end": 1647.72, "localBegin": 1637.52, "localEnd": 1647.72}, {"id": "c001_f000113", "text": "Wiping his streaming eyes on his jacket sleeve, Hagrid swung himself onto the motorcycle and kicked the engine into life; with a roar it rose into the air and off into the night.", "begin": 1647.72, "end": 1659.52, "localBegin": 1647.72, "localEnd": 1659.52}, {"id": "c001_f000114", "text": "\"I shall see you soon, I expect, Professor McGonagall,\" said Dumbledore, nodding to her. Professor McGonagall blew her nose in reply.", "begin": 1659.52, "end": 1669.36, "localBegin": 1659.52, "localEnd": 1669.36}, {"id": "c001_f000115", "text": "Dumbledore turned and walked back down the street. On the corner he stopped and took out the silver Put-Outer. He clicked it once, and twelve balls of light sped back to their street lamps so that Privet Drive glowed suddenly orange and he could make out a tabby cat slinking around the corner at the other end of the street. He could just see the bundle of blankets on the step of number four.", "begin": 1669.36, "end": 1691.96, "localBegin": 1669.36, "localEnd": 1691.96}, {"id": "c001_f000116", "text": "\"Good luck, Harry,\" he murmured. He turned on his heel and with a swish of his cloak, he was gone.", "begin": 1691.96, "end": 1700.88, "localBegin": 1691.96, "localEnd": 1700.88}, {"id": "c001_f000117", "text": "A breeze ruffled the neat hedges of Privet Drive, which lay silent and tidy under the inky sky, the very last place you would expect astonishing things to happen. Harry Potter rolled over inside his blankets without waking up. One small hand closed on the letter beside him and he slept on, not knowing he was special, not knowing he was famous, not knowing he would be woken in a few hours' time by Mrs. Dursley's scream as she opened the front door to put out the milk bottles, nor that he would spend the next few weeks being prodded and pinched by his cousin Dudley. . . . He couldn't know that at this very moment, people meeting in secret", "begin": 1700.88, "end": 1747.12, "localBegin": 1700.88, "localEnd": 1747.12}, {"id": "c001_f000118", "text": "all over the country were holding up their glasses and saying in hushed voices: \"To Harry Potter - the boy who lived!\"", "begin": 1747.12, "end": 1758.96, "localBegin": 1747.12, "localEnd": 1758.96}]}, {"kind": "chapter", "number": 2, "title": "The Vanishing Glass", "audio": "../Harry Potter and the Sorcerer's Stone, Book 1 (Unabridged)/002 - Harry Potter and the Sorcerer's Stone, Book 1 (Unabridged).mp3", "start": 1758.961, "end": 3064.758, "duration": 1305.797, "paragraphs": [{"id": "c002_f000001", "text": "Chapter Two. The Vanishing Glass.", "begin": 1758.961, "end": 1764.001, "localBegin": 0.0, "localEnd": 5.04}, {"id": "c002_f000002", "text": "Nearly ten years had passed since the Dursleys had woken up to find their nephew on the front step, but Privet Drive had hardly changed at all. The sun rose on the same tidy front gardens and lit up the brass number four on the Dursleys' front door; it crept into their living room, which was almost exactly the same as it had been on the night when Mr. Dursley had seen that fateful news report about the owls. Only the photographs on the mantelpiece really showed how much time had passed. Ten years ago, there had been lots of pictures of what looked like a large pink beach ball wearing different-colored bonnets - but Dudley Dursley was no longer a baby, and now the photographs showed a large blond boy riding his first bicycle, on a carousel at the fair, playing a computer game with his father, being hugged and kissed by his mother. The room held no sign at all that another boy lived in the house, too.", "begin": 1764.001, "end": 1822.081, "localBegin": 5.04, "localEnd": 63.12}, {"id": "c002_f000003", "text": "Yet Harry Potter was still there, asleep at the moment, but not for long. His Aunt Petunia was awake and it was her shrill voice that made the first noise of the day.", "begin": 1822.081, "end": 1832.761, "localBegin": 63.12, "localEnd": 73.8}, {"id": "c002_f000004", "text": "\"Up! Get up! Now!\"", "begin": 1832.761, "end": 1836.081, "localBegin": 73.8, "localEnd": 77.12}, {"id": "c002_f000005", "text": "Harry woke with a start. His aunt rapped on the door again.", "begin": 1836.081, "end": 1838.881, "localBegin": 77.12, "localEnd": 79.92}, {"id": "c002_f000006", "text": "\"Up!\" she screeched. Harry heard her walking toward the kitchen and then the sound of the frying pan being put on the stove. He rolled onto his back and tried to remember the dream he had been having. It had been a good one. There had been a flying motorcycle in it. He had a funny feeling he'd had the same dream before.", "begin": 1838.881, "end": 1860.281, "localBegin": 79.92, "localEnd": 101.32}, {"id": "c002_f000007", "text": "His aunt was back outside the door.", "begin": 1860.281, "end": 1862.081, "localBegin": 101.32, "localEnd": 103.12}, {"id": "c002_f000008", "text": "\"Are you up yet?\" she demanded.", "begin": 1862.081, "end": 1864.521, "localBegin": 103.12, "localEnd": 105.56}, {"id": "c002_f000009", "text": "\"Nearly,\" said Harry.", "begin": 1864.521, "end": 1866.321, "localBegin": 105.56, "localEnd": 107.36}, {"id": "c002_f000010", "text": "\"Well, get a move on, I want you to look after the bacon. And don't you dare let it burn, I want everything perfect on Duddy's birthday.\"", "begin": 1866.321, "end": 1875.241, "localBegin": 107.36, "localEnd": 116.28}, {"id": "c002_f000011", "text": "Harry groaned.", "begin": 1875.241, "end": 1876.001, "localBegin": 116.28, "localEnd": 117.04}, {"id": "c002_f000012", "text": "\"What did you say?\" his aunt snapped through the door.", "begin": 1876.001, "end": 1879.681, "localBegin": 117.04, "localEnd": 120.72}, {"id": "c002_f000013", "text": "\"Nothing, nothing . . .\"", "begin": 1879.681, "end": 1883.881, "localBegin": 120.72, "localEnd": 124.92}, {"id": "c002_f000014", "text": "Dudley's birthday - how could he have forgotten? Harry got slowly out of bed", "begin": 1883.881, "end": 1889.001, "localBegin": 124.92, "localEnd": 130.04}, {"id": "c002_f000015", "text": "and started looking for socks. He found a pair under his bed and, after pulling a spider off one of them, put them on. Harry was used to spiders, because the cupboard under the stairs was full of them, and that was where he slept.", "begin": 1889.001, "end": 1905.201, "localBegin": 130.04, "localEnd": 146.24}, {"id": "c002_f000016", "text": "When he was dressed he went down the hall into the kitchen. The table was almost hidden beneath all Dudley's birthday presents. It looked as though Dudley had gotten the new computer he wanted, not to mention the second television and the racing bike. Exactly why Dudley wanted a racing bike was a mystery to Harry, as Dudley was very fat and hated exercise - unless of course it involved punching somebody. Dudley's favorite punching bag was Harry, but he couldn't often catch him. Harry didn't look it, but he was very fast.", "begin": 1905.201, "end": 1939.201, "localBegin": 146.24, "localEnd": 180.24}, {"id": "c002_f000017", "text": "Perhaps it had something to do with living in a dark cupboard, but Harry had always been small and skinny for his age. He looked even smaller and skinnier than he really was because all he had to wear were old clothes of Dudley's, and Dudley was about four times bigger than he was. Harry had a thin face, knobbly knees, black hair, and bright green eyes. He wore round glasses held together with a lot of Scotch tape because of all the times Dudley had punched him on the nose. The only thing Harry liked about his own appearance was a very thin scar on his forehead that was shaped like a bolt of lightning. He had had it as long as he could remember, and the first question he could ever remember asking his Aunt Petunia was how he had gotten it.", "begin": 1939.201, "end": 1987.201, "localBegin": 180.24, "localEnd": 228.24}, {"id": "c002_f000018", "text": "\"In the car crash when your parents died,\" she had said. \"And don't ask questions.\"", "begin": 1987.201, "end": 1995.641, "localBegin": 228.24, "localEnd": 236.68}, {"id": "c002_f000019", "text": "Don't ask questions - that was the first rule for a quiet life with the Dursleys.", "begin": 1995.641, "end": 2002.961, "localBegin": 236.68, "localEnd": 244.0}, {"id": "c002_f000020", "text": "Uncle Vernon entered the kitchen as Harry was turning over the bacon.", "begin": 2002.961, "end": 2006.121, "localBegin": 244.0, "localEnd": 247.16}, {"id": "c002_f000021", "text": "\"Comb your hair!\" he barked, by way of a morning greeting.", "begin": 2006.121, "end": 2011.321, "localBegin": 247.16, "localEnd": 252.36}, {"id": "c002_f000022", "text": "About once a week, Uncle Vernon looked over the top of his newspaper and shouted that Harry needed a haircut. Harry must have had more haircuts than the rest of the boys in his class put together, but it made no difference, his hair simply grew that way - all over the place.", "begin": 2011.321, "end": 2029.001, "localBegin": 252.36, "localEnd": 270.04}, {"id": "c002_f000023", "text": "Harry was frying eggs by the time Dudley arrived in the kitchen with his mother. Dudley looked a lot like Uncle Vernon. He had a large pink face, not much neck, small, watery blue eyes, and thick blond hair that lay smoothly on his thick, fat head. Aunt Petunia often said that Dudley looked like a baby angel - Harry often said that Dudley looked like a pig in a wig.", "begin": 2029.001, "end": 2054.881, "localBegin": 270.04, "localEnd": 295.92}, {"id": "c002_f000024", "text": "Harry put the plates of egg and bacon on the table, which was difficult as there wasn't much room. Dudley, meanwhile, was counting his presents. His face fell.", "begin": 2054.881, "end": 2064.881, "localBegin": 295.92, "localEnd": 305.92}, {"id": "c002_f000025", "text": "\"Thirty-six,\" he said, looking up at his mother and father. \"That's two less than last year.\"", "begin": 2064.881, "end": 2073.201, "localBegin": 305.92, "localEnd": 314.24}, {"id": "c002_f000026", "text": "\"Darling, you haven't counted Auntie Marge's present, see, it's here under this big one from Mummy and Daddy.\"", "begin": 2073.201, "end": 2082.761, "localBegin": 314.24, "localEnd": 323.8}, {"id": "c002_f000027", "text": "\"All right, thirty-seven then,\" said Dudley, going red in the face. Harry, who could see a huge Dudley tantrum coming on, began wolfing down his bacon as fast as possible in case Dudley turned the table over.", "begin": 2082.761, "end": 2097.921, "localBegin": 323.8, "localEnd": 338.96}, {"id": "c002_f000028", "text": "Aunt Petunia obviously scented danger, too, because she said quickly, \"And we'll buy you another two presents while we're out today. How's that, popkin? Two more presents. Is that all right?\"", "begin": 2097.921, "end": 2111.001, "localBegin": 338.96, "localEnd": 352.04}, {"id": "c002_f000029", "text": "Dudley thought for a moment. It looked like hard work. Finally he said slowly, \"So I'll have thirty . . . thirty . . .\"", "begin": 2111.001, "end": 2122.121, "localBegin": 352.04, "localEnd": 363.16}, {"id": "c002_f000030", "text": "\"Thirty-nine, sweetums,\" said Aunt Petunia.", "begin": 2122.121, "end": 2126.201, "localBegin": 363.16, "localEnd": 367.24}, {"id": "c002_f000031", "text": "\"Oh.\" Dudley sat down heavily and grabbed the nearest parcel. \"All right then.\"", "begin": 2126.201, "end": 2132.281, "localBegin": 367.24, "localEnd": 373.32}, {"id": "c002_f000032", "text": "Uncle Vernon chuckled.", "begin": 2132.281, "end": 2133.521, "localBegin": 373.32, "localEnd": 374.56}, {"id": "c002_f000033", "text": "\"Little tyke wants his money's worth, just like his father. 'Atta boy, Dudley!\" He ruffled Dudley's hair.", "begin": 2133.521, "end": 2142.881, "localBegin": 374.56, "localEnd": 383.92}, {"id": "c002_f000034", "text": "At that moment the telephone rang and Aunt Petunia went to answer it while Harry and Uncle Vernon watched Dudley unwrap the racing bike, a video camera, a remote control airplane, sixteen new computer games, and a VCR. He was ripping the paper off a gold wristwatch when Aunt Petunia came back from the telephone looking both angry and worried.", "begin": 2142.881, "end": 2164.201, "localBegin": 383.92, "localEnd": 405.24}, {"id": "c002_f000035", "text": "\"Bad news, Vernon,\" she said. \"Mrs. Figg's broken her leg. She can't take him.\" She jerked her head in Harry's direction.", "begin": 2164.201, "end": 2175.041, "localBegin": 405.24, "localEnd": 416.08}, {"id": "c002_f000036", "text": "Dudley's mouth fell open in horror, but Harry's heart gave a leap. Every year on Dudley's birthday, his parents took him and a friend out for the day, to adventure parks, hamburger restaurants, or the movies. Every year, Harry was left behind with Mrs. Figg, a mad old lady who lived two streets away. Harry hated it", "begin": 2175.041, "end": 2195.561, "localBegin": 416.08, "localEnd": 436.6}, {"id": "c002_f000037", "text": "there. The whole house smelled of cabbage and Mrs. Figg made him look at photographs of all the cats she'd ever owned.", "begin": 2195.561, "end": 2202.121, "localBegin": 436.6, "localEnd": 443.16}, {"id": "c002_f000038", "text": "\"Now what?\" said Aunt Petunia, looking furiously at Harry as though he'd planned this. Harry knew he ought to feel sorry that Mrs. Figg had broken her leg, but it wasn't easy when he reminded himself it would be a whole year before he had to look at Tibbles, Snowy, Mr. Paws, and Tufty again.", "begin": 2202.121, "end": 2221.841, "localBegin": 443.16, "localEnd": 462.88}, {"id": "c002_f000039", "text": "\"We could phone Marge,\" Uncle Vernon suggested.", "begin": 2221.841, "end": 2226.281, "localBegin": 462.88, "localEnd": 467.32}, {"id": "c002_f000040", "text": "\"Don't be silly, Vernon, she hates the boy.\"", "begin": 2226.281, "end": 2230.081, "localBegin": 467.32, "localEnd": 471.12}, {"id": "c002_f000041", "text": "The Dursleys often spoke about Harry like this, as though he wasn't there - or rather, as though he was something very nasty that couldn't understand them, like a slug.", "begin": 2230.081, "end": 2240.321, "localBegin": 471.12, "localEnd": 481.36}, {"id": "c002_f000042", "text": "\"What about what's-her-name, your friend - Yvonne?\"", "begin": 2240.321, "end": 2245.201, "localBegin": 481.36, "localEnd": 486.24}, {"id": "c002_f000043", "text": "\"On vacation in Majorca,\" snapped Aunt Petunia.", "begin": 2245.201, "end": 2249.161, "localBegin": 486.24, "localEnd": 490.2}, {"id": "c002_f000044", "text": "\"You could just leave me here,\" Harry put in hopefully (he'd be able to watch what he wanted on television for a change and maybe even have a go on Dudley's computer).", "begin": 2249.161, "end": 2260.641, "localBegin": 490.2, "localEnd": 501.68}, {"id": "c002_f000045", "text": "Aunt Petunia looked as though she'd just swallowed a lemon.", "begin": 2260.641, "end": 2263.281, "localBegin": 501.68, "localEnd": 504.32}, {"id": "c002_f000046", "text": "\"And come back and find the house in ruins?\" she snarled.", "begin": 2263.281, "end": 2267.361, "localBegin": 504.32, "localEnd": 508.4}, {"id": "c002_f000047", "text": "\"I won't blow up the house,\" said Harry, but they weren't listening.", "begin": 2267.361, "end": 2272.321, "localBegin": 508.4, "localEnd": 513.36}, {"id": "c002_f000048", "text": "\"I suppose we could take him to the zoo,\" said Aunt Petunia slowly, \". . . and leave him in the car. . . .\"", "begin": 2272.321, "end": 2280.641, "localBegin": 513.36, "localEnd": 521.68}, {"id": "c002_f000049", "text": "\"That car's new, he's not sitting in it alone. . . .\"", "begin": 2280.641, "end": 2285.881, "localBegin": 521.68, "localEnd": 526.92}, {"id": "c002_f000050", "text": "Dudley began to cry loudly. In fact, he wasn't really crying - it had been years since he'd really cried - but he knew that if he screwed up his face and wailed, his mother would give him anything he wanted.", "begin": 2285.881, "end": 2295.641, "localBegin": 526.92, "localEnd": 536.68}, {"id": "c002_f000051", "text": "\"Dinky Duddydums, don't cry, Mummy won't let him spoil your special day!\" she cried, flinging her arms around him.", "begin": 2295.641, "end": 2304.801, "localBegin": 536.68, "localEnd": 545.84}, {"id": "c002_f000052", "text": "\"I . . . don't . . . want . . . him . . . t-t-to come!\" Dudley yelled between huge, pretend sobs. \"He always sp-spoils everything!\" He shot Harry a nasty grin through the gap in his mother's arms.", "begin": 2304.801, "end": 2321.521, "localBegin": 545.84, "localEnd": 562.56}, {"id": "c002_f000053", "text": "Just then, the doorbell rang - \"Oh, good Lord, they're here!\" said Aunt Petunia frantically - and a moment later, Dudley's best friend, Piers Polkiss, walked in with his mother. Piers was a scrawny boy with a face like a rat. He was usually the one who held people's arms behind their backs while Dudley hit them. Dudley stopped pretending to cry at once.", "begin": 2321.521, "end": 2345.241, "localBegin": 562.56, "localEnd": 586.28}, {"id": "c002_f000054", "text": "Half an hour later, Harry, who couldn't believe his luck, was sitting in the back of the Dursleys' car with Piers and Dudley, on the way to the zoo for the first time in his life. His aunt and uncle hadn't been able to think of anything else to do with him, but before they'd left, Uncle Vernon had taken Harry aside.", "begin": 2345.241, "end": 2364.801, "localBegin": 586.28, "localEnd": 605.84}, {"id": "c002_f000055", "text": "\"I'm warning you,\" he had said, putting his large purple face right up close to Harry's, \"I'm warning you now, boy - any funny business, anything at all - and you'll be in that cupboard from now until Christmas.\"", "begin": 2364.801, "end": 2380.961, "localBegin": 605.84, "localEnd": 622.0}, {"id": "c002_f000056", "text": "\"I'm not going to do anything,\" said Harry, \"honestly . . .\"", "begin": 2380.961, "end": 2386.681, "localBegin": 622.0, "localEnd": 627.72}, {"id": "c002_f000057", "text": "But Uncle Vernon didn't believe him. No one ever did.", "begin": 2386.681, "end": 2390.641, "localBegin": 627.72, "localEnd": 631.68}, {"id": "c002_f000058", "text": "The problem was, strange things often happened around Harry and it was just no good telling the Dursleys he didn't make them happen.", "begin": 2390.641, "end": 2398.241, "localBegin": 631.68, "localEnd": 639.28}, {"id": "c002_f000059", "text": "Once, Aunt Petunia, tired of Harry coming back from the barbers looking as though he hadn't been at all, had taken a pair of kitchen scissors and cut his hair so short he was almost bald except for his bangs, which she left \"to hide that horrible scar.\" Dudley had laughed himself silly at Harry, who spent a sleepless night imagining school the next day, where he was already laughed at for his baggy clothes and taped glasses. Next morning, however, he had gotten up to find his hair exactly as it had been before Aunt Petunia had sheared it off. He had been given a week in his cupboard for this, even though he had tried to explain that he couldn't explain how it had grown back so quickly.", "begin": 2398.241, "end": 2440.761, "localBegin": 639.28, "localEnd": 681.8}, {"id": "c002_f000060", "text": "Another time, Aunt Petunia had been trying to force him into a revolting old sweater of Dudley's (brown with orange puff balls). The harder she tried to pull it over his head, the smaller it seemed to become, until finally it might have fitted a hand puppet, but certainly wouldn't fit Harry. Aunt Petunia had decided it must have shrunk in the wash and, to his great relief, Harry wasn't punished.", "begin": 2440.761, "end": 2465.641, "localBegin": 681.8, "localEnd": 706.68}, {"id": "c002_f000061", "text": "On the other hand, he'd gotten into terrible trouble for being found on the roof of the school kitchens. Dudley's gang had been chasing him as usual when, as much to Harry's surprise as anyone else's, there he was sitting on the chimney. The Dursleys had received a very angry letter from Harry's headmistress telling them Harry had been climbing school buildings. But all he'd tried to do (as he", "begin": 2465.641, "end": 2488.241, "localBegin": 706.68, "localEnd": 729.28}, {"id": "c002_f000062", "text": "shouted at Uncle Vernon through the locked door of his cupboard) was jump behind the big trash cans outside the kitchen doors. Harry supposed that the wind must have caught him in mid-jump.", "begin": 2488.241, "end": 2498.841, "localBegin": 729.28, "localEnd": 739.88}, {"id": "c002_f000063", "text": "But today, nothing was going to go wrong. It was even worth being with Dudley and Piers to be spending the day somewhere that wasn't school, his cupboard, or Mrs. Figg's cabbage-smelling living room.", "begin": 2498.841, "end": 2511.321, "localBegin": 739.88, "localEnd": 752.36}, {"id": "c002_f000064", "text": "While he drove, Uncle Vernon complained to Aunt Petunia. He liked to complain about things: people at work, Harry, the council, Harry, the bank, and Harry were just a few of his favorite subjects. This morning, it was motorcycles.", "begin": 2511.321, "end": 2526.721, "localBegin": 752.36, "localEnd": 767.76}, {"id": "c002_f000065", "text": "\". . . roaring along like maniacs, the young hoodlums,\" he said, as a motorcycle overtook them.", "begin": 2526.721, "end": 2533.961, "localBegin": 767.76, "localEnd": 775.0}, {"id": "c002_f000066", "text": "\"I had a dream about a motorcycle,\" said Harry, remembering suddenly. \"It was flying.\"", "begin": 2533.961, "end": 2540.961, "localBegin": 775.0, "localEnd": 782.0}, {"id": "c002_f000067", "text": "Uncle Vernon nearly crashed into the car in front. He turned right around in his seat and yelled at Harry, his face like a gigantic beet with a mustache: \"MOTORCYCLES DON'T FLY!\"", "begin": 2540.961, "end": 2552.881, "localBegin": 782.0, "localEnd": 793.92}, {"id": "c002_f000068", "text": "Dudley and Piers sniggered.", "begin": 2552.881, "end": 2554.321, "localBegin": 793.92, "localEnd": 795.36}, {"id": "c002_f000069", "text": "\"I know they don't,\" said Harry. \"It was only a dream.\"", "begin": 2554.321, "end": 2559.201, "localBegin": 795.36, "localEnd": 800.24}, {"id": "c002_f000070", "text": "But he wished he hadn't said anything. If there was one thing the Dursleys hated even more than his asking questions, it was his talking about anything acting in a way it shouldn't, no matter if it was in a dream or even a cartoon - they seemed to think he might get dangerous ideas.", "begin": 2559.201, "end": 2576.761, "localBegin": 800.24, "localEnd": 817.8}, {"id": "c002_f000071", "text": "It was a very sunny Saturday and the zoo was crowded with families. The Dursleys bought Dudley and Piers large chocolate ice creams at the entrance and then, because the smiling lady in the van had asked Harry what he wanted before they could hurry him away, they bought him a cheap lemon ice pop. It wasn't bad, either, Harry thought, licking it as they watched a gorilla scratching its head who looked remarkably like Dudley, except that it wasn't blond.", "begin": 2576.761, "end": 2604.801, "localBegin": 817.8, "localEnd": 845.84}, {"id": "c002_f000072", "text": "Harry had the best morning he'd had in a long time. He was careful to walk a little way apart from the Dursleys so that Dudley and Piers, who were starting to get bored with the animals by lunchtime, wouldn't fall back on their favorite hobby of hitting him. They ate in the zoo restaurant, and when Dudley had a tantrum because his knickerbocker glory didn't have enough ice cream on top, Uncle Vernon bought him another one and Harry was allowed to finish the first.", "begin": 2604.801, "end": 2632.361, "localBegin": 845.84, "localEnd": 873.4}, {"id": "c002_f000073", "text": "Harry felt, afterward, that he should have known it was all too good to last.", "begin": 2632.361, "end": 2638.041, "localBegin": 873.4, "localEnd": 879.08}, {"id": "c002_f000074", "text": "After lunch they went to the reptile house. It was cool and dark in there, with lit windows all along the walls. Behind the glass, all sorts of lizards and snakes were crawling and slithering over bits of wood and stone. Dudley and Piers wanted to see huge, poisonous cobras and thick, man-crushing pythons. Dudley quickly found the largest snake in the place. It could have wrapped its body twice around Uncle Vernon's car and crushed it into a trash can - but at the moment it didn't look in the mood. In fact, it was fast asleep.", "begin": 2638.041, "end": 2673.201, "localBegin": 879.08, "localEnd": 914.24}, {"id": "c002_f000075", "text": "Dudley stood with his nose pressed against the glass, staring at the glistening brown coils.", "begin": 2673.201, "end": 2678.321, "localBegin": 914.24, "localEnd": 919.36}, {"id": "c002_f000076", "text": "\"Make it move,\" he whined at his father. Uncle Vernon tapped on the glass, but the snake didn't budge.", "begin": 2678.321, "end": 2686.881, "localBegin": 919.36, "localEnd": 927.92}, {"id": "c002_f000077", "text": "\"Do it again,\" Dudley ordered. Uncle Vernon rapped the glass smartly with his knuckles, but the snake just snoozed on.", "begin": 2686.881, "end": 2694.601, "localBegin": 927.92, "localEnd": 935.64}, {"id": "c002_f000078", "text": "\"This is boring,\" Dudley moaned. He shuffled away.", "begin": 2694.601, "end": 2701.921, "localBegin": 935.64, "localEnd": 942.96}, {"id": "c002_f000079", "text": "Harry moved in front of the tank and looked intently at the snake. He wouldn't have been surprised if it had died of boredom itself - no company except stupid people drumming their fingers on the glass trying to disturb it all day long. It was worse than having a cupboard as a bedroom, where the only visitor was Aunt Petunia hammering on the door to wake you up; at least he got to visit the rest of the house.", "begin": 2701.921, "end": 2727.441, "localBegin": 942.96, "localEnd": 968.48}, {"id": "c002_f000080", "text": "The snake suddenly opened its beady eyes. Slowly, very slowly, it raised its head until its eyes were on a level with Harry's.", "begin": 2727.441, "end": 2738.361, "localBegin": 968.48, "localEnd": 979.4}, {"id": "c002_f000081", "text": "It winked.", "begin": 2738.361, "end": 2739.481, "localBegin": 979.4, "localEnd": 980.52}, {"id": "c002_f000082", "text": "Harry stared. Then he looked quickly around to see if anyone was watching. They weren't. He looked back at the snake and winked, too.", "begin": 2739.481, "end": 2750.041, "localBegin": 980.52, "localEnd": 991.08}, {"id": "c002_f000083", "text": "The snake jerked its head toward Uncle Vernon and Dudley, then raised its eyes to the ceiling. It gave Harry a look that said quite plainly:", "begin": 2750.041, "end": 2759.521, "localBegin": 991.08, "localEnd": 1000.56}, {"id": "c002_f000084", "text": "\"I get that all the time.\"", "begin": 2759.521, "end": 2762.121, "localBegin": 1000.56, "localEnd": 1003.16}, {"id": "c002_f000085", "text": "\"I know,\" Harry murmured through the glass, though he wasn't sure the snake could hear him. \"It must be really annoying.\"", "begin": 2762.121, "end": 2771.201, "localBegin": 1003.16, "localEnd": 1012.24}, {"id": "c002_f000086", "text": "The snake nodded vigorously.", "begin": 2771.201, "end": 2774.081, "localBegin": 1012.24, "localEnd": 1015.12}, {"id": "c002_f000087", "text": "\"Where do you come from, anyway?\" Harry asked.", "begin": 2774.081, "end": 2778.201, "localBegin": 1015.12, "localEnd": 1019.24}, {"id": "c002_f000088", "text": "The snake jabbed its tail at a little sign next to the glass. Harry peered at it.", "begin": 2778.201, "end": 2784.161, "localBegin": 1019.24, "localEnd": 1025.2}, {"id": "c002_f000089", "text": "Boa Constrictor, Brazil.", "begin": 2784.161, "end": 2786.161, "localBegin": 1025.2, "localEnd": 1027.2}, {"id": "c002_f000090", "text": "\"Was it nice there?\"", "begin": 2786.161, "end": 2789.801, "localBegin": 1027.2, "localEnd": 1030.84}, {"id": "c002_f000091", "text": "The boa constrictor jabbed its tail at the sign again and Harry read on: This specimen was bred in the zoo. \"Oh, I see - so you've never been to Brazil?\"", "begin": 2789.801, "end": 2801.201, "localBegin": 1030.84, "localEnd": 1042.24}, {"id": "c002_f000092", "text": "As the snake shook its head, a deafening shout behind Harry made both of them jump. \"DUDLEY! MR. DURSLEY! COME AND LOOK AT THIS SNAKE! YOU WON'T BELIEVE WHAT IT'S DOING!\"", "begin": 2801.201, "end": 2812.681, "localBegin": 1042.24, "localEnd": 1053.72}, {"id": "c002_f000093", "text": "Dudley came waddling toward them as fast as he could.", "begin": 2812.681, "end": 2816.281, "localBegin": 1053.72, "localEnd": 1057.32}, {"id": "c002_f000094", "text": "\"Out of the way, you,\" he said, punching Harry in the ribs. Caught by surprise, Harry fell hard on the concrete floor. What came next happened so fast no one saw how it happened - one second, Piers and Dudley were leaning right up close to the glass, the next, they had leapt back with howls of horror.", "begin": 2816.281, "end": 2834.881, "localBegin": 1057.32, "localEnd": 1075.92}, {"id": "c002_f000095", "text": "Harry sat up and gasped; the glass front of the boa constrictor's tank had vanished. The great snake was uncoiling itself rapidly, slithering out onto the floor. People throughout the reptile house screamed and started running for the exits.", "begin": 2834.881, "end": 2850.241, "localBegin": 1075.92, "localEnd": 1091.28}, {"id": "c002_f000096", "text": "As the snake slid swiftly past him, Harry could have sworn a low, hissing voice said, \"Brazil, here I come. . . . Thanksss, amigo.\"", "begin": 2850.241, "end": 2861.481, "localBegin": 1091.28, "localEnd": 1102.52}, {"id": "c002_f000097", "text": "The keeper of the reptile house was in shock.", "begin": 2861.481, "end": 2865.281, "localBegin": 1102.52, "localEnd": 1106.32}, {"id": "c002_f000098", "text": "\"But the glass,\" he kept saying, \"where did the glass go?\"", "begin": 2865.281, "end": 2871.521, "localBegin": 1106.32, "localEnd": 1112.56}, {"id": "c002_f000099", "text": "The zoo director himself made Aunt Petunia a cup of strong, sweet tea while he apologized over and over again. Piers and Dudley could only gibber. As far as Harry had seen, the snake hadn't done anything except snap playfully at their heels as it passed, but by the time they were all back in Uncle Vernon's car, Dudley was telling them how it had nearly bitten off his leg, while Piers was swearing it had tried to squeeze him to death. But worst of all, for Harry at least, was Piers calming down enough to say, \"Harry was talking to it, weren't you, Harry?\"", "begin": 2871.521, "end": 2908.001, "localBegin": 1112.56, "localEnd": 1149.04}, {"id": "c002_f000100", "text": "Uncle Vernon waited until Piers was safely out of the house before starting on Harry. He was so angry he could hardly speak. He managed to say, \"Go - cupboard stay - no meals,\" before he collapsed into a chair, and Aunt Petunia had to run and get him a large brandy.", "begin": 2908.001, "end": 2930.361, "localBegin": 1149.04, "localEnd": 1171.4}, {"id": "c002_f000101", "text": "Harry lay in his dark cupboard much later, wishing he had a watch. He didn't know what time it was and he couldn't be sure the Dursleys were asleep yet. Until they were, he couldn't risk sneaking to the kitchen for some food.", "begin": 2930.361, "end": 2944.481, "localBegin": 1171.4, "localEnd": 1185.52}, {"id": "c002_f000102", "text": "He'd lived with the Dursleys almost ten years, ten miserable years, as long as he could remember, ever since he'd been a baby and his parents had died in that car crash. He couldn't remember being in the car when his parents had died. Sometimes, when he strained his memory during long hours in his cupboard, he came up with a strange vision: a blinding flash of green light and a burning pain on his forehead. This, he supposed, was the crash, though he couldn't imagine where all the green light came from. He couldn't remember his parents at all. His aunt and uncle never spoke about them, and of course he was forbidden to ask questions. There were no photographs of them in the house.", "begin": 2944.481, "end": 2987.961, "localBegin": 1185.52, "localEnd": 1229.0}, {"id": "c002_f000103", "text": "When he had been younger, Harry had dreamed and dreamed of some unknown relation coming to take him away, but it had never happened; the Dursleys were his only family. Yet sometimes he thought (or maybe hoped) that strangers in the street seemed to know him. Very strange strangers they were, too. A tiny man in a violet top hat had bowed to him once while out shopping with Aunt Petunia and Dudley. After asking Harry furiously if he knew the man, Aunt Petunia had rushed them out of the shop without buying anything. A wild-looking old woman dressed all in green had waved merrily at him once on a bus. A bald man in a very long purple coat had actually shaken his hand in the street the other day and then walked away without a word. The weirdest thing about all these people was the way they seemed to vanish the second Harry tried to get a closer look.", "begin": 2987.961, "end": 3050.081, "localBegin": 1229.0, "localEnd": 1291.12}, {"id": "c002_f000104", "text": "At school, Harry had no one. Everybody knew that Dudley's gang hated that odd Harry Potter in his baggy old clothes and broken glasses, and nobody liked to disagree with Dudley's gang.", "begin": 3050.081, "end": 3064.721, "localBegin": 1291.12, "localEnd": 1305.76}]}, {"kind": "chapter", "number": 3, "title": "The Letters from No One", "audio": "../Harry Potter and the Sorcerer's Stone, Book 1 (Unabridged)/003 - Harry Potter and the Sorcerer's Stone, Book 1 (Unabridged).mp3", "start": 3064.758, "end": 4519.813, "duration": 1455.055, "paragraphs": [{"id": "c003_f000001", "text": "Chapter Three. The Letters from No One.", "begin": 3064.758, "end": 3069.278, "localBegin": 0.0, "localEnd": 4.52}, {"id": "c003_f000002", "text": "The escape of the Brazilian boa constrictor earned Harry his longestever punishment. By the time he was allowed out of his cupboard again, the summer holidays had started and Dudley had already broken his new video camera, crashed his remote control airplane, and, first time out on his racing bike, knocked down old Mrs. Figg as she crossed Privet Drive on her crutches.", "begin": 3069.278, "end": 3092.918, "localBegin": 4.52, "localEnd": 28.16}, {"id": "c003_f000003", "text": "Harry was glad school was over, but there was no escaping Dudley's gang, who visited the house every single day. Piers, Dennis, Malcolm, and Gordon were all big and stupid, but as Dudley was the biggest and stupidest of the lot, he was the leader. The rest of them were all quite happy to join in Dudley's favorite sport: Harry Hunting.", "begin": 3092.918, "end": 3114.678, "localBegin": 28.16, "localEnd": 49.92}, {"id": "c003_f000004", "text": "This was why Harry spent as much time as possible out of the house, wandering around and thinking about the end of the holidays, where he could see a tiny ray of hope. When September came he would be going off to secondary school and, for the first time in his life, he wouldn't be with Dudley. Dudley had been accepted at Uncle Vernon's old private school, Smeltings. Piers Polkiss was going there too. Harry, on the other hand, was going to Stonewall High, the local public school. Dudley thought this was very funny.", "begin": 3114.678, "end": 3145.798, "localBegin": 49.92, "localEnd": 81.04}, {"id": "c003_f000005", "text": "\"They stuff people's heads down the toilet the first day at Stonewall,\" he told Harry. \"Want to come upstairs and practice?\"", "begin": 3145.798, "end": 3155.158, "localBegin": 81.04, "localEnd": 90.4}, {"id": "c003_f000006", "text": "\"No, thanks,\" said Harry. \"The poor toilet's never had anything as horrible as your head down it - it might be sick.\" Then he ran, before Dudley could work out what he'd said.", "begin": 3155.158, "end": 3167.678, "localBegin": 90.4, "localEnd": 102.92}, {"id": "c003_f000007", "text": "One day in July, Aunt Petunia took Dudley to London to buy his Smeltings uniform, leaving Harry at Mrs. Figg's. Mrs. Figg wasn't as bad as usual. It turned out she'd broken her leg tripping over one of her cats, and she didn't seem quite as fond of them as before. She let Harry watch television and gave him a bit of chocolate cake that tasted as though she'd had it for several years.", "begin": 3167.678, "end": 3192.158, "localBegin": 102.92, "localEnd": 127.4}, {"id": "c003_f000008", "text": "That evening, Dudley paraded around the living room for the family in his brand-new uniform. Smeltings boys wore maroon tailcoats, orange knickerbockers, and flat straw hats called boaters. They also carried knobbly sticks, used for h
