localEnd": 1270.08}, {"id": "c016_f000156", "text": "\"We're coming,\" said Hermione.", "begin": 26232.788, "end": 26235.268, "localBegin": 1270.08, "localEnd": 1272.56}, {"id": "c016_f000157", "text": "Harry pushed the door open.", "begin": 26235.268, "end": 26237.468, "localBegin": 1272.56, "localEnd": 1274.76}, {"id": "c016_f000158", "text": "As the door creaked, low, rumbling growls met their ears. All three of the dog's noses sniffed madly in their direction, even though it couldn't see them.", "begin": 26237.468, "end": 26247.508, "localBegin": 1274.76, "localEnd": 1284.8}, {"id": "c016_f000159", "text": "\"What's that at its feet?\" Hermione whispered.", "begin": 26247.508, "end": 26251.188, "localBegin": 1284.8, "localEnd": 1288.48}, {"id": "c016_f000160", "text": "\"Looks like a harp,\" said Ron. \"Snape must have left it there.\"", "begin": 26251.188, "end": 26256.628, "localBegin": 1288.48, "localEnd": 1293.92}, {"id": "c016_f000161", "text": "\"It must wake up the moment you stop playing,\" said Harry. \"Well, here goes . . .\"", "begin": 26256.628, "end": 26263.308, "localBegin": 1293.92, "localEnd": 1300.6}, {"id": "c016_f000162", "text": "He put Hagrid's flute to his lips and blew. It wasn't really a tune, but from the first note the beast's eyes began to droop. Harry hardly drew breath. Slowly, the dog's growls ceased - it tottered on its paws and fell to its knees, then it slumped to the ground, fast asleep.", "begin": 26263.308, "end": 26281.748, "localBegin": 1300.6, "localEnd": 1319.04}, {"id": "c016_f000163", "text": "\"Keep playing,\" Ron warned Harry as they slipped out of the Cloak and crept toward the trapdoor. They could feel the dog's hot, smelly breath as they approached the giant heads.", "begin": 26281.748, "end": 26292.788, "localBegin": 1319.04, "localEnd": 1330.08}, {"id": "c016_f000164", "text": "\"I think we'll be able to pull the door open,\" said Ron, peering over the dog's back. \"Want to go first, Hermione?\"", "begin": 26292.788, "end": 26300.948, "localBegin": 1330.08, "localEnd": 1338.24}, {"id": "c016_f000165", "text": "\"No, I don't!\"", "begin": 26300.948, "end": 26303.388, "localBegin": 1338.24, "localEnd": 1340.68}, {"id": "c016_f000166", "text": "\"All right.\" Ron gritted his teeth and stepped carefully over the dog's legs. He bent and pulled the ring of the trapdoor, which swung up and open.", "begin": 26303.388, "end": 26312.268, "localBegin": 1340.68, "localEnd": 1349.56}, {"id": "c016_f000167", "text": "\"What can you see?\" Hermione said anxiously.", "begin": 26312.268, "end": 26316.468, "localBegin": 1349.56, "localEnd": 1353.76}, {"id": "c016_f000168", "text": "\"Nothing - just black - there's no way of climbing down, we'll just have to drop.\"", "begin": 26316.468, "end": 26322.548, "localBegin": 1353.76, "localEnd": 1359.84}, {"id": "c016_f000169", "text": "Harry, who was still playing the flute, waved at Ron to get his attention and pointed at himself.", "begin": 26322.548, "end": 26328.828, "localBegin": 1359.84, "localEnd": 1366.12}, {"id": "c016_f000170", "text": "\"You want to go first? Are you sure?\" said Ron. \"I don't know how deep this thing goes. Give the flute to Hermione so she can keep him asleep.\"", "begin": 26328.828, "end": 26337.828, "localBegin": 1366.12, "localEnd": 1375.12}, {"id": "c016_f000171", "text": "Harry handed the flute over. In the few seconds' silence, the dog growled and twitched, but the moment Hermione began to play, it fell back into its deep sleep.", "begin": 26337.828, "end": 26347.948, "localBegin": 1375.12, "localEnd": 1385.24}, {"id": "c016_f000172", "text": "Harry climbed over it and looked down through the trapdoor. There was no sign of the bottom.", "begin": 26347.948, "end": 26353.748, "localBegin": 1385.24, "localEnd": 1391.04}, {"id": "c016_f000173", "text": "He lowered himself through the hole until he was hanging on by his fingertips. Then he looked up at Ron and said, \"If anything happens to me, don't follow. Go straight to the owlery and send Hedwig to Dumbledore, right?\"", "begin": 26353.748, "end": 26365.868, "localBegin": 1391.04, "localEnd": 1403.16}, {"id": "c016_f000174", "text": "\"Right,\" said Ron.", "begin": 26365.868, "end": 26367.268, "localBegin": 1403.16, "localEnd": 1404.56}, {"id": "c016_f000175", "text": "\"See you in a minute, I hope. . . .\"", "begin": 26367.268, "end": 26369.148, "localBegin": 1404.56, "localEnd": 1406.44}, {"id": "c016_f000176", "text": "And Harry let go. Cold, damp air rushed past him as he fell down, down, down and -", "begin": 26369.148, "end": 26376.148, "localBegin": 1406.44, "localEnd": 1413.44}, {"id": "c016_f000177", "text": "FLUMP. With a funny, muffled sort of thump he landed on something soft. He sat up and felt around, his eyes not used to the gloom. It felt as though he was sitting on some sort of plant.", "begin": 26376.148, "end": 26390.388, "localBegin": 1413.44, "localEnd": 1427.68}, {"id": "c016_f000178", "text": "\"It's okay!\" he called up to the light the size of a postage stamp, which was the open trapdoor, \"it's a soft landing, you can jump!\"", "begin": 26390.388, "end": 26399.988, "localBegin": 1427.68, "localEnd": 1437.28}, {"id": "c016_f000179", "text": "Ron followed right away. He landed, sprawled next to Harry.", "begin": 26399.988, "end": 26404.548, "localBegin": 1437.28, "localEnd": 1441.84}, {"id": "c016_f000180", "text": "\"What's this stuff?\" were his first words.", "begin": 26404.548, "end": 26407.908, "localBegin": 1441.84, "localEnd": 1445.2}, {"id": "c016_f000181", "text": "\"Dunno, some sort of plant thing. I suppose it's here to break the fall. Come on, Hermione!\"", "begin": 26407.908, "end": 26413.908, "localBegin": 1445.2, "localEnd": 1451.2}, {"id": "c016_f000182", "text": "The distant music stopped. There was a loud bark from the dog, but Hermione had already jumped. She landed on Harry's other side.", "begin": 26413.908, "end": 26422.308, "localBegin": 1451.2, "localEnd": 1459.6}, {"id": "c016_f000183", "text": "\"We must be miles under the school,\" she said.", "begin": 26422.308, "end": 26426.108, "localBegin": 1459.6, "localEnd": 1463.4}, {"id": "c016_f000184", "text": "\"Lucky this plant thing's here, really,\" said Ron.", "begin": 26426.108, "end": 26429.308, "localBegin": 1463.4, "localEnd": 1466.6}, {"id": "c016_f000185", "text": "\"Lucky!\" shrieked Hermione. \"Look at you both!\"", "begin": 26429.308, "end": 26434.028, "localBegin": 1466.6, "localEnd": 1471.32}, {"id": "c016_f000186", "text": "She leapt up and struggled toward a damp wall. She had to struggle because the moment she had landed, the plant had started to twist snakelike tendrils around her ankles. As for Harry and Ron, their legs had already been bound tightly in long creepers without their noticing.", "begin": 26434.028, "end": 26450.388, "localBegin": 1471.32, "localEnd": 1487.68}, {"id": "c016_f000187", "text": "Hermione had managed to free herself before the plant got a firm grip on her. Now she watched in horror as the two boys fought to pull the plant off them, but the more they strained against it, the tighter and faster the plant wound around them.", "begin": 26450.388, "end": 26463.988, "localBegin": 1487.68, "localEnd": 1501.28}, {"id": "c016_f000188", "text": "\"Stop moving!\" Hermione ordered them. \"I know what this is - it's Devil's Snare!\"", "begin": 26463.988, "end": 26469.988, "localBegin": 1501.28, "localEnd": 1507.28}, {"id": "c016_f000189", "text": "\"Oh, I'm so glad we know what it's called, that's a great help,\" snarled Ron, leaning back, trying to stop the plant from curling around his neck.", "begin": 26469.988, "end": 26479.948, "localBegin": 1507.28, "localEnd": 1517.24}, {"id": "c016_f000190", "text": "\"Shut up, I'm trying to remember how to kill it!\" said Hermione.", "begin": 26479.948, "end": 26484.668, "localBegin": 1517.24, "localEnd": 1521.96}, {"id": "c016_f000191", "text": "\"Well, hurry up, I can't breathe!\" Harry gasped, wrestling with it as it curled around his chest.", "begin": 26484.668, "end": 26490.428, "localBegin": 1521.96, "localEnd": 1527.72}, {"id": "c016_f000192", "text": "\"Devil's Snare, Devil's Snare . . . what did Professor Sprout say? - it likes the dark and the damp - \"", "begin": 26490.428, "end": 26496.428, "localBegin": 1527.72, "localEnd": 1533.72}, {"id": "c016_f000193", "text": "\"So light a fire!\" Harry choked.", "begin": 26496.428, "end": 26499.228, "localBegin": 1533.72, "localEnd": 1536.52}, {"id": "c016_f000194", "text": "\"Yes - of course - but there's no wood!\" Hermione cried, wringing her hands.", "begin": 26499.228, "end": 26504.708, "localBegin": 1536.52, "localEnd": 1542.0}, {"id": "c016_f000195", "text": "\"HAVE YOU GONE MAD?\" Ron bellowed. \"ARE YOU A WITCH OR NOT?\"", "begin": 26504.708, "end": 26510.308, "localBegin": 1542.0, "localEnd": 1547.6}, {"id": "c016_f000196", "text": "\"Oh, right!\" said Hermione, and she whipped out her wand, waved it, muttered something, and sent a jet of the same bluebell flames she had used on Snape at the plant. In a matter of seconds, the two boys felt it loosening its grip as it cringed away from the light and warmth. Wriggling and flailing, it unraveled itself from their bodies, and they were able to pull free.", "begin": 26510.308, "end": 26533.268, "localBegin": 1547.6, "localEnd": 1570.56}, {"id": "c016_f000197", "text": "\"Lucky you pay attention in Herbology, Hermione,\" said Harry as he joined her by the wall, wiping sweat off his face.", "begin": 26533.268, "end": 26541.228, "localBegin": 1570.56, "localEnd": 1578.52}, {"id": "c016_f000198", "text": "\"Yeah,\" said Ron, \"and lucky Harry doesn't lose his head in a crisis - 'there's no wood,' honestly.\"", "begin": 26541.228, "end": 26549.508, "localBegin": 1578.52, "localEnd": 1586.8}, {"id": "c016_f000199", "text": "\"This way,\" said Harry, pointing down a stone passageway, which was the only way forward.", "begin": 26549.508, "end": 26554.988, "localBegin": 1586.8, "localEnd": 1592.28}, {"id": "c016_f000200", "text": "All they could hear apart from their footsteps was the gentle drip of water trickling down the walls. The passageway sloped downward, and Harry was reminded of Gringotts. With an unpleasant jolt of the heart, he remembered the dragons said to be guarding vaults in the wizards' bank. If they met a dragon, a fully-grown dragon - Norbert had been bad enough . . .", "begin": 26554.988, "end": 26577.468, "localBegin": 1592.28, "localEnd": 1614.76}, {"id": "c016_f000201", "text": "\"Can you hear something?\" Ron whispered.", "begin": 26577.468, "end": 26581.228, "localBegin": 1614.76, "localEnd": 1618.52}, {"id": "c016_f000202", "text": "Harry listened. A soft rustling and clinking seemed to be coming from up ahead.", "begin": 26581.228, "end": 26586.468, "localBegin": 1618.52, "localEnd": 1623.76}, {"id": "c016_f000203", "text": "\"Do you think it's a ghost?\"", "begin": 26586.468, "end": 26588.348, "localBegin": 1623.76, "localEnd": 1625.64}, {"id": "c016_f000204", "text": "\"I don't know . . . sounds like wings to me.\"", "begin": 26588.348, "end": 26592.308, "localBegin": 1625.64, "localEnd": 1629.6}, {"id": "c016_f000205", "text": "\"There's light ahead - I can see something moving.\"", "begin": 26592.308, "end": 26596.308, "localBegin": 1629.6, "localEnd": 1633.6}, {"id": "c016_f000206", "text": "They reached the end of the passageway and saw before them a brilliantly lit chamber, its ceiling arching high above them. It was full of small, jewel-bright birds, fluttering and tumbling all around the room. On the opposite side of the chamber was a heavy wooden door.", "begin": 26596.308, "end": 26614.068, "localBegin": 1633.6, "localEnd": 1651.36}, {"id": "c016_f000207", "text": "\"Do you think they'll attack us if we cross the room?\" said Ron.", "begin": 26614.068, "end": 26618.268, "localBegin": 1651.36, "localEnd": 1655.56}, {"id": "c016_f000208", "text": "\"Probably,\" said Harry. \"They don't look very vicious, but I suppose if they all swooped down at once . . . well, there's no other choice . . . I'll run.\"", "begin": 26618.268, "end": 26628.788, "localBegin": 1655.56, "localEnd": 1666.08}, {"id": "c016_f000209", "text": "He took a deep breath, covered his face with his arms, and sprinted across the room. He expected to feel sharp beaks and claws tearing at him any second, but nothing happened. He reached the door untouched. He pulled the handle, but it was locked.", "begin": 26628.788, "end": 26644.908, "localBegin": 1666.08, "localEnd": 1682.2}, {"id": "c016_f000210", "text": "The other two followed him. They tugged and heaved at the door, but it wouldn't budge, not even when Hermione tried her Alohomora Charm.", "begin": 26644.908, "end": 26654.948, "localBegin": 1682.2, "localEnd": 1692.24}, {"id": "c016_f000211", "text": "\"Now what?\" said Ron.", "begin": 26654.948, "end": 26657.508, "localBegin": 1692.24, "localEnd": 1694.8}, {"id": "c016_f000212", "text": "\"These birds . . . they can't be here just for decoration,\" said Hermione.", "begin": 26657.508, "end": 26663.028, "localBegin": 1694.8, "localEnd": 1700.32}, {"id": "c016_f000213", "text": "They watched the birds soaring overhead, glittering - glittering?", "begin": 26663.028, "end": 26668.868, "localBegin": 1700.32, "localEnd": 1706.16}, {"id": "c016_f000214", "text": "\"They're not birds!\" Harry said suddenly. \"They're keys! Winged keys - look carefully. So that must mean . . .\" he looked around the chamber while the other", "begin": 26668.868, "end": 26680.548, "localBegin": 1706.16, "localEnd": 1717.84}, {"id": "c016_f000215", "text": "two squinted up at the flock of keys. \". . . yes - look! Broomsticks! We've got to catch the key to the door!\"", "begin": 26680.548, "end": 26688.588, "localBegin": 1717.84, "localEnd": 1725.88}, {"id": "c016_f000216", "text": "\"But there are hundreds of them!\"", "begin": 26688.588, "end": 26691.268, "localBegin": 1725.88, "localEnd": 1728.56}, {"id": "c016_f000217", "text": "Ron examined the lock on the door.", "begin": 26691.268, "end": 26693.908, "localBegin": 1728.56, "localEnd": 1731.2}, {"id": "c016_f000218", "text": "\"We're looking for a big, old-fashioned one - probably silver, like the handle.\"", "begin": 26693.908, "end": 26699.828, "localBegin": 1731.2, "localEnd": 1737.12}, {"id": "c016_f000219", "text": "They each seized a broomstick and kicked off into the air, soaring into the midst of the cloud of keys. They grabbed and snatched, but the bewitched keys darted and dived so quickly it was almost impossible to catch one.", "begin": 26699.828, "end": 26713.388, "localBegin": 1737.12, "localEnd": 1750.68}, {"id": "c016_f000220", "text": "Not for nothing, though, was Harry the youngest Seeker in a century. He had a knack for spotting things other people didn't. After a minute's weaving about through the whirl of rainbow feathers, he noticed a large silver key that had a bent wing, as if it had already been caught and stuffed roughly into the keyhole.", "begin": 26713.388, "end": 26732.108, "localBegin": 1750.68, "localEnd": 1769.4}, {"id": "c016_f000221", "text": "\"That one!\" he called to the others. \"That big one - there - no, there - with bright blue wings - the feathers are all crumpled on one side.\"", "begin": 26732.108, "end": 26739.948, "localBegin": 1769.4, "localEnd": 1777.24}, {"id": "c016_f000222", "text": "Ron went speeding in the direction that Harry was pointing, crashed into the ceiling, and nearly fell off his broom.", "begin": 26739.948, "end": 26746.668, "localBegin": 1777.24, "localEnd": 1783.96}, {"id": "c016_f000223", "text": "\"We've got to close in on it!\" Harry called, not taking his eyes off the key with the damaged wing. \"Ron, you come at it from above - Hermione, stay below and stop it from going down - and I'll try and catch it. Right, NOW!\"", "begin": 26746.668, "end": 26761.788, "localBegin": 1783.96, "localEnd": 1799.08}, {"id": "c016_f000224", "text": "Ron dived, Hermione rocketed upward, the key dodged them both, and Harry streaked after it; it sped toward the wall, Harry leaned forward and with a nasty, crunching noise, pinned it against the stone with one hand. Ron and Hermione's cheers echoed around the high chamber.", "begin": 26761.788, "end": 26779.388, "localBegin": 1799.08, "localEnd": 1816.68}, {"id": "c016_f000225", "text": "They landed quickly, and Harry ran to the door, the key struggling in his hand. He rammed it into the lock and turned - it worked. The moment the lock had clicked open, the key took flight again, looking very battered now that it had been caught twice.", "begin": 26779.388, "end": 26794.708, "localBegin": 1816.68, "localEnd": 1832.0}, {"id": "c016_f000226", "text": "\"Ready?\" Harry asked the other two, his hand on the door handle. They nodded. He pulled the door open.", "begin": 26794.708, "end": 26801.828, "localBegin": 1832.0, "localEnd": 1839.12}, {"id": "c016_f000227", "text": "The next chamber was so dark they couldn't see anything at all. But as they stepped into it, light suddenly flooded the room to reveal an astonishing sight.", "begin": 26801.828, "end": 26812.228, "localBegin": 1839.12, "localEnd": 1849.52}, {"id": "c016_f000228", "text": "They were standing on the edge of a huge chessboard, behind the black chessmen, which were all taller than they were and carved from what looked like black stone. Facing them, way across the chamber, were the white pieces. Harry, Ron and Hermione shivered slightly - the towering white chessmen had no faces.", "begin": 26812.228, "end": 26832.028, "localBegin": 1849.52, "localEnd": 1869.32}, {"id": "c016_f000229", "text": "\"Now what do we do?\" Harry whispered.", "begin": 26832.028, "end": 26835.868, "localBegin": 1869.32, "localEnd": 1873.16}, {"id": "c016_f000230", "text": "\"It's obvious, isn't it?\" said Ron. \"We've got to play our way across the room.\"", "begin": 26835.868, "end": 26841.908, "localBegin": 1873.16, "localEnd": 1879.2}, {"id": "c016_f000231", "text": "Behind the white pieces they could see another door.", "begin": 26841.908, "end": 26845.708, "localBegin": 1879.2, "localEnd": 1883.0}, {"id": "c016_f000232", "text": "\"How?\" said Hermione nervously.", "begin": 26845.708, "end": 26849.268, "localBegin": 1883.0, "localEnd": 1886.56}, {"id": "c016_f000233", "text": "\"I think,\" said Ron, \"we're going to have to be chessmen.\"", "begin": 26849.268, "end": 26853.908, "localBegin": 1886.56, "localEnd": 1891.2}, {"id": "c016_f000234", "text": "He walked up to a black knight and put his hand out to touch the knight's horse. At once, the stone sprang to life. The horse pawed the ground and the knight turned his helmeted head to look down at Ron.", "begin": 26853.908, "end": 26866.308, "localBegin": 1891.2, "localEnd": 1903.6}, {"id": "c016_f000235", "text": "\"Do we - er - have to join you to get across?\"", "begin": 26866.308, "end": 26870.948, "localBegin": 1903.6, "localEnd": 1908.24}, {"id": "c016_f000236", "text": "The black knight nodded. Ron turned to the other two.", "begin": 26870.948, "end": 26874.988, "localBegin": 1908.24, "localEnd": 1912.28}, {"id": "c016_f000237", "text": "\"This needs thinking about. . . .\" he said. \"I suppose we've got to take the place of three of the black pieces. . . .\"", "begin": 26874.988, "end": 26883.188, "localBegin": 1912.28, "localEnd": 1920.48}, {"id": "c016_f000238", "text": "Harry and Hermione stayed quiet, watching Ron think. Finally he said, \"Now, don't be offended or anything, but neither of you are that good at chess - \"", "begin": 26883.188, "end": 26893.508, "localBegin": 1920.48, "localEnd": 1930.8}, {"id": "c016_f000239", "text": "\"We're not offended,\" said Harry quickly. \"Just tell us what to do.\"", "begin": 26893.508, "end": 26897.628, "localBegin": 1930.8, "localEnd": 1934.92}, {"id": "c016_f000240", "text": "\"Well, Harry, you take the place of that bishop, and Hermione, you go there instead of that castle.\"", "begin": 26897.628, "end": 26905.428, "localBegin": 1934.92, "localEnd": 1942.72}, {"id": "c016_f000241", "text": "\"What about you?\"", "begin": 26905.428, "end": 26906.828, "localBegin": 1942.72, "localEnd": 1944.12}, {"id": "c016_f000242", "text": "\"I'm going to be a knight,\" said Ron.", "begin": 26906.828, "end": 26909.668, "localBegin": 1944.12, "localEnd": 1946.96}, {"id": "c016_f000243", "text": "The chessmen seemed to have been listening, because at these words a knight, a bishop, and a castle turned their backs on the white pieces and walked off the board, leaving three empty squares that Harry, Ron, and Hermione took.", "begin": 26909.668, "end": 26925.108, "localBegin": 1946.96, "localEnd": 1962.4}, {"id": "c016_f000244", "text": "\"White always plays first in chess,\" said Ron, peering across the board. \"Yes . . . look . . .\"", "begin": 26925.108, "end": 26933.948, "localBegin": 1962.4, "localEnd": 1971.24}, {"id": "c016_f000245", "text": "A white pawn had moved forward two squares.", "begin": 26933.948, "end": 26938.268, "localBegin": 1971.24, "localEnd": 1975.56}, {"id": "c016_f000246", "text": "Ron started to direct the black pieces. They moved silently wherever he sent them. Harry's knees were trembling. What if they lost?", "begin": 26938.268, "end": 26948.508, "localBegin": 1975.56, "localEnd": 1985.8}, {"id": "c016_f000247", "text": "\"Harry - move diagonally four squares to the right.\"", "begin": 26948.508, "end": 26954.628, "localBegin": 1985.8, "localEnd": 1991.92}, {"id": "c016_f000248", "text": "Their first real shock came when their other knight was taken. The white queen smashed him to the floor and dragged him off the board, where he lay quite still, facedown.", "begin": 26954.628, "end": 26966.028, "localBegin": 1991.92, "localEnd": 2003.32}, {"id": "c016_f000249", "text": "\"Had to let that happen,\" said Ron, looking shaken. \"Leaves you free to take that bishop, Hermione, go on.\"", "begin": 26966.028, "end": 26974.508, "localBegin": 2003.32, "localEnd": 2011.8}, {"id": "c016_f000250", "text": "Every time one of their men was lost, the white pieces showed no mercy. Soon there was a huddle of limp black players slumped along the wall. Twice, Ron only just noticed in time that Harry and Hermione were in danger. He himself darted around the board, taking almost as many white pieces as they had lost black ones.", "begin": 26974.508, "end": 26994.228, "localBegin": 2011.8, "localEnd": 2031.52}, {"id": "c016_f000251", "text": "\"We're nearly there,\" he muttered suddenly. \"Let me think - let me think . . .\"", "begin": 26994.228, "end": 26999.748, "localBegin": 2031.52, "localEnd": 2037.04}, {"id": "c016_f000252", "text": "The white queen turned her blank face toward him.", "begin": 26999.748, "end": 27003.508, "localBegin": 2037.04, "localEnd": 2040.8}, {"id": "c016_f000253", "text": "\"Yes . . .\" said Ron softly, \"it's the only way . . . I've got to be taken.\"", "begin": 27003.508, "end": 27011.988, "localBegin": 2040.8, "localEnd": 2049.28}, {"id": "c016_f000254", "text": "\"NO!\" Harry and Hermione shouted.", "begin": 27011.988, "end": 27015.268, "localBegin": 2049.28, "localEnd": 2052.56}, {"id": "c016_f000255", "text": "\"That's chess!\" snapped Ron. \"You've got to make some sacrifices! I'll make my move and she'll take me - that leaves you free to checkmate the king, Harry!\"", "begin": 27015.268, "end": 27024.948, "localBegin": 2052.56, "localEnd": 2062.24}, {"id": "c016_f000256", "text": "\"But - \"", "begin": 27024.948, "end": 27025.628, "localBegin": 2062.24, "localEnd": 2062.92}, {"id": "c016_f000257", "text": "\"Do you want to stop Snape or not?\"", "begin": 27025.628, "end": 27027.548, "localBegin": 2062.92, "localEnd": 2064.84}, {"id": "c016_f000258", "text": "\"Ron - \"", "begin": 27027.548, "end": 27028.348, "localBegin": 2064.84, "localEnd": 2065.64}, {"id": "c016_f000259", "text": "\"Look, if you don't hurry up, he'll already have the Stone!\"", "begin": 27028.348, "end": 27031.188, "localBegin": 2065.64, "localEnd": 2068.48}, {"id": "c016_f000260", "text": "There was no alternative.", "begin": 27031.188, "end": 27033.148, "localBegin": 2068.48, "localEnd": 2070.44}, {"id": "c016_f000261", "text": "\"Ready?\" Ron called, his face pale but determined. \"Here I go - now, don't hang around once you've won.\"", "begin": 27033.148, "end": 27039.948, "localBegin": 2070.44, "localEnd": 2077.24}, {"id": "c016_f000262", "text": "He stepped forward, and the white queen pounced. She struck Ron hard across the head with her stone arm, and he crashed to the floor - Hermione screamed but stayed", "begin": 27039.948, "end": 27049.908, "localBegin": 2077.24, "localEnd": 2087.2}, {"id": "c016_f000263", "text": "on her square - the white queen dragged Ron to one side. He looked as if he'd been knocked out.", "begin": 27049.908, "end": 27054.828, "localBegin": 2087.2, "localEnd": 2092.12}, {"id": "c016_f000264", "text": "Shaking, Harry moved three spaces to the left.", "begin": 27054.828, "end": 27058.948, "localBegin": 2092.12, "localEnd": 2096.24}, {"id": "c016_f000265", "text": "The white king took off his crown and threw it at Harry's feet. They had won. The chessmen parted and bowed, leaving the door ahead clear. With one last desperate look back at Ron, Harry and Hermione charged through the door and up the next passageway.", "begin": 27058.948, "end": 27075.188, "localBegin": 2096.24, "localEnd": 2112.48}, {"id": "c016_f000266", "text": "\"What if he's - ?\"", "begin": 27075.188, "end": 27076.388, "localBegin": 2112.48, "localEnd": 2113.68}, {"id": "c016_f000267", "text": "\"He'll be all right,\" said Harry, trying to convince himself. \"What do you reckon's next?\"", "begin": 27076.388, "end": 27081.908, "localBegin": 2113.68, "localEnd": 2119.2}, {"id": "c016_f000268", "text": "\"We've had Sprout's, that was the Devil's Snare; Flitwick must've put charms on the keys; McGonagall transfigured the chessmen to make them alive; that leaves Quirrell's spell, and Snape's . . .\"", "begin": 27081.908, "end": 27096.348, "localBegin": 2119.2, "localEnd": 2133.64}, {"id": "c016_f000269", "text": "They had reached another door.", "begin": 27096.348, "end": 27098.308, "localBegin": 2133.64, "localEnd": 2135.6}, {"id": "c016_f000270", "text": "\"All right?\" Harry whispered.", "begin": 27098.308, "end": 27101.348, "localBegin": 2135.6, "localEnd": 2138.64}, {"id": "c016_f000271", "text": "\"Go on.\"", "begin": 27101.348, "end": 27102.468, "localBegin": 2138.64, "localEnd": 2139.76}, {"id": "c016_f000272", "text": "Harry pushed it open.", "begin": 27102.468, "end": 27104.268, "localBegin": 2139.76, "localEnd": 2141.56}, {"id": "c016_f000273", "text": "A disgusting smell filled their nostrils, making both of them pull their robes up over their noses. Eyes watering, they saw, flat on the floor in front of them, a troll even larger than the one they had tackled, out cold with a bloody lump on its head.", "begin": 27104.268, "end": 27121.308, "localBegin": 2141.56, "localEnd": 2158.6}, {"id": "c016_f000274", "text": "\"I'm glad we didn't have to fight that one,\" Harry whispered as they stepped carefully over one of its massive legs. \"Come on, I can't breathe.\"", "begin": 27121.308, "end": 27131.108, "localBegin": 2158.6, "localEnd": 2168.4}, {"id": "c016_f000275", "text": "He pulled open the next door, both of them hardly daring to look at what came next - but there was nothing very frightening in here, just a table with seven differently shaped bottles standing on it in a line.", "begin": 27131.108, "end": 27144.348, "localBegin": 2168.4, "localEnd": 2181.64}, {"id": "c016_f000276", "text": "\"Snape's,\" said Harry. \"What do we have to do?\"", "begin": 27144.348, "end": 27149.668, "localBegin": 2181.64, "localEnd": 2186.96}, {"id": "c016_f000277", "text": "They stepped over the threshold, and immediately a fire sprang up behind them in the doorway. It wasn't ordinary fire either; it was purple. At the same instant, black flames shot up in the doorway leading onward. They were trapped.", "begin": 27149.668, "end": 27164.108, "localBegin": 2186.96, "localEnd": 2201.4}, {"id": "c016_f000278", "text": "\"Look!\" Hermione seized a roll of paper lying next to the bottles. Harry looked over her shoulder to read it:", "begin": 27164.108, "end": 27171.948, "localBegin": 2201.4, "localEnd": 2209.24}, {"id": "c016_f000279", "text": "Danger lies before you, while safety lies behind,", "begin": 27171.948, "end": 27176.428, "localBegin": 2209.24, "localEnd": 2213.72}, {"id": "c016_f000280", "text": "Two of us will help you, whichever you would find,", "begin": 27176.428, "end": 27179.868, "localBegin": 2213.72, "localEnd": 2217.16}, {"id": "c016_f000281", "text": "One among us seven will let you move ahead,", "begin": 27179.868, "end": 27183.228, "localBegin": 2217.16, "localEnd": 2220.52}, {"id": "c016_f000282", "text": "Another will transport the drinker back instead,", "begin": 27183.228, "end": 27187.548, "localBegin": 2220.52, "localEnd": 2224.84}, {"id": "c016_f000283", "text": "Two among our number hold only nettle wine,", "begin": 27187.548, "end": 27191.068, "localBegin": 2224.84, "localEnd": 2228.36}, {"id": "c016_f000284", "text": "Three of us are killers, waiting hidden in line.", "begin": 27191.068, "end": 27194.828, "localBegin": 2228.36, "localEnd": 2232.12}, {"id": "c016_f000285", "text": "Choose, unless you wish to stay here forevermore,", "begin": 27194.828, "end": 27198.788, "localBegin": 2232.12, "localEnd": 2236.08}, {"id": "c016_f000286", "text": "To help you in your choice, we give you these clues four:", "begin": 27198.788, "end": 27202.948, "localBegin": 2236.08, "localEnd": 2240.24}, {"id": "c016_f000287", "text": "First, however slyly the poison tries to hide", "begin": 27202.948, "end": 27206.868, "localBegin": 2240.24, "localEnd": 2244.16}, {"id": "c016_f000288", "text": "You will always find some on nettle wine's left side;", "begin": 27206.868, "end": 27211.108, "localBegin": 2244.16, "localEnd": 2248.4}, {"id": "c016_f000289", "text": "Second, different are those who stand at either end,", "begin": 27211.108, "end": 27215.188, "localBegin": 2248.4, "localEnd": 2252.48}, {"id": "c016_f000290", "text": "But if you would move onward, neither is your friend;", "begin": 27215.188, "end": 27219.308, "localBegin": 2252.48, "localEnd": 2256.6}, {"id": "c016_f000291", "text": "Third, as you see clearly, all are different size,", "begin": 27219.308, "end": 27223.308, "localBegin": 2256.6, "localEnd": 2260.6}, {"id": "c016_f000292", "text": "Neither dwarf nor giant holds death in their insides;", "begin": 27223.308, "end": 27227.428, "localBegin": 2260.6, "localEnd": 2264.72}, {"id": "c016_f000293", "text": "Fourth, the second left and the second on the right", "begin": 27227.428, "end": 27231.268, "localBegin": 2264.72, "localEnd": 2268.56}, {"id": "c016_f000294", "text": "Are twins once you taste them, though different at first sight.", "begin": 27231.268, "end": 27235.948, "localBegin": 2268.56, "localEnd": 2273.24}, {"id": "c016_f000295", "text": "Hermione let out a great sigh and Harry, amazed, saw that she was smiling, the very last thing he felt like doing.", "begin": 27235.948, "end": 27245.108, "localBegin": 2273.24, "localEnd": 2282.4}, {"id": "c016_f000296", "text": "\"Brilliant,\" said Hermione. \"This isn't magic - it's logic - a puzzle. A lot of the greatest wizards haven't got an ounce of logic, they'd be stuck in here forever.\"", "begin": 27245.108, "end": 27256.988, "localBegin": 2282.4, "localEnd": 2294.28}, {"id": "c016_f000297", "text": "\"But so will we, won't we?\"", "begin": 27256.988, "end": 27259.748, "localBegin": 2294.28, "localEnd": 2297.04}, {"id": "c016_f000298", "text": "\"Of course not,\" said Hermione. \"Everything we need is here on this paper. Seven bottles: three are poison; two are wine; one will get us safely through the", "begin": 27259.748, "end": 27270.108, "localBegin": 2297.04, "localEnd": 2307.4}, {"id": "c016_f000299", "text": "black fire, and one will get us back through the purple.\"", "begin": 27270.108, "end": 27272.948, "localBegin": 2307.4, "localEnd": 2310.24}, {"id": "c016_f000300", "text": "\"But how do we know which to drink?\"", "begin": 27272.948, "end": 27275.388, "localBegin": 2310.24, "localEnd": 2312.68}, {"id": "c016_f000301", "text": "\"Give me a minute.\"", "begin": 27275.388, "end": 27277.108, "localBegin": 2312.68, "localEnd": 2314.4}, {"id": "c016_f000302", "text": "Hermione read the paper several times. Then she walked up and down the line of bottles, muttering to herself and pointing at them. At last, she clapped her hands.", "begin": 27277.108, "end": 27286.788, "localBegin": 2314.4, "localEnd": 2324.08}, {"id": "c016_f000303", "text": "\"Got it,\" she said. \"The smallest bottle will get us through the black fire toward the Stone.\"", "begin": 27286.788, "end": 27292.468, "localBegin": 2324.08, "localEnd": 2329.76}, {"id": "c016_f000304", "text": "Harry looked at the tiny bottle.", "begin": 27292.468, "end": 27294.988, "localBegin": 2329.76, "localEnd": 2332.28}, {"id": "c016_f000305", "text": "\"There's only enough there for one of us,\" he said. \"That's hardly one swallow.\"", "begin": 27294.988, "end": 27300.308, "localBegin": 2332.28, "localEnd": 2337.6}, {"id": "c016_f000306", "text": "They looked at each other.", "begin": 27300.308, "end": 27302.468, "localBegin": 2337.6, "localEnd": 2339.76}, {"id": "c016_f000307", "text": "\"Which one will get you back through the purple flames?\"", "begin": 27302.468, "end": 27306.388, "localBegin": 2339.76, "localEnd": 2343.68}, {"id": "c016_f000308", "text": "Hermione pointed at a rounded bottle at the right end of the line.", "begin": 27306.388, "end": 27310.348, "localBegin": 2343.68, "localEnd": 2347.64}, {"id": "c016_f000309", "text": "\"You drink that,\" said Harry. \"No, listen, get back and get Ron. Grab brooms from the flying-key room, they'll get you out of the trapdoor and past Fluffy - go straight to the owlery and send Hedwig to Dumbledore, we need him. I might be able to hold Snape off for a while, but I'm no match for him, really.\"", "begin": 27310.348, "end": 27329.948, "localBegin": 2347.64, "localEnd": 2367.24}, {"id": "c016_f000310", "text": "\"But Harry - what if You-Know-Who's with him?\"", "begin": 27329.948, "end": 27334.148, "localBegin": 2367.24, "localEnd": 2371.44}, {"id": "c016_f000311", "text": "\"Well - I was lucky once, wasn't I?\" said Harry, pointing at his scar. \"I might get lucky again.\"", "begin": 27334.148, "end": 27340.868, "localBegin": 2371.44, "localEnd": 2378.16}, {"id": "c016_f000312", "text": "Hermione's lip trembled, and she suddenly dashed at Harry and threw her arms around him.", "begin": 27340.868, "end": 27346.708, "localBegin": 2378.16, "localEnd": 2384.0}, {"id": "c016_f000313", "text": "\"Hermione!\"", "begin": 27346.708, "end": 27348.028, "localBegin": 2384.0, "localEnd": 2385.32}, {"id": "c016_f000314", "text": "\"Harry - you're a great wizard, you know.\"", "begin": 27348.028, "end": 27351.868, "localBegin": 2385.32, "localEnd": 2389.16}, {"id": "c016_f000315", "text": "\"I'm not as good as you,\" said Harry, very embarrassed, as she let go of him.", "begin": 27351.868, "end": 27357.348, "localBegin": 2389.16, "localEnd": 2394.64}, {"id": "c016_f000316", "text": "\"Me!\" said Hermione. \"Books! And cleverness! There are more important things friendship and bravery and - oh Harry - be careful!\"", "begin": 27357.348, "end": 27367.908, "localBegin": 2394.64, "localEnd": 2405.2}, {"id": "c016_f000317", "text": "\"You drink first,\" said Harry. \"You are sure which is which, aren't you?\"", "begin": 27367.908, "end": 27373.188, "localBegin": 2405.2, "localEnd": 2410.48}, {"id": "c016_f000318", "text": "\"Positive,\" said Hermione. She took a long drink from the round bottle at the end, and shuddered.", "begin": 27373.188, "end": 27379.508, "localBegin": 2410.48, "localEnd": 2416.8}, {"id": "c016_f000319", "text": "\"It's not poison?\" said Harry anxiously.", "begin": 27379.508, "end": 27382.348, "localBegin": 2416.8, "localEnd": 2419.64}, {"id": "c016_f000320", "text": "\"No - but it's like ice.\"", "begin": 27382.348, "end": 27385.148, "localBegin": 2419.64, "localEnd": 2422.44}, {"id": "c016_f000321", "text": "\"Quick, go, before it wears off.\"", "begin": 27385.148, "end": 27387.668, "localBegin": 2422.44, "localEnd": 2424.96}, {"id": "c016_f000322", "text": "\"Good luck - take care - \"", "begin": 27387.668, "end": 27389.668, "localBegin": 2424.96, "localEnd": 2426.96}, {"id": "c016_f000323", "text": "\"GO!\"", "begin": 27389.668, "end": 27390.828, "localBegin": 2426.96, "localEnd": 2428.12}, {"id": "c016_f000324", "text": "Hermione turned and walked straight through the purple fire.", "begin": 27390.828, "end": 27395.068, "localBegin": 2428.12, "localEnd": 2432.36}, {"id": "c016_f000325", "text": "Harry took a deep breath and picked up the smallest bottle. He turned to face the black flames.", "begin": 27395.068, "end": 27400.868, "localBegin": 2432.36, "localEnd": 2438.16}, {"id": "c016_f000326", "text": "\"Here I come,\" he said, and he drained the little bottle in one gulp.", "begin": 27400.868, "end": 27406.068, "localBegin": 2438.16, "localEnd": 2443.36}, {"id": "c016_f000327", "text": "It was indeed as though ice was flooding his body. He put the bottle down and walked forward; he braced himself, saw the black flames licking his body, but couldn't feel them - for a moment he could see nothing but dark fire - then he was on the other side, in the last chamber.", "begin": 27406.068, "end": 27425.628, "localBegin": 2443.36, "localEnd": 2462.92}, {"id": "c016_f000328", "text": "There was already someone there - but it wasn't Snape. It wasn't even Voldemort.", "begin": 27425.628, "end": 27436.628, "localBegin": 2462.92, "localEnd": 2473.92}]}, {"kind": "chapter", "number": 17, "title": "The Man with Two Faces", "audio": "../Harry Potter and the Sorcerer's Stone, Book 1 (Unabridged)/017 - Harry Potter and the Sorcerer's Stone, Book 1 (Unabridged).mp3", "start": 27436.655, "end": 29853.574, "duration": 2416.919, "paragraphs": [{"id": "c017_f000001", "text": "Chapter Seventeen. The Man with Two Faces.", "begin": 27436.655, "end": 27442.255, "localBegin": 0.0, "localEnd": 5.6}, {"id": "c017_f000002", "text": "It was Quirrell.", "begin": 27442.255, "end": 27443.095, "localBegin": 5.6, "localEnd": 6.44}, {"id": "c017_f000003", "text": "\"You!\" gasped Harry.", "begin": 27443.095, "end": 27447.255, "localBegin": 6.44, "localEnd": 10.6}, {"id": "c017_f000004", "text": "Quirrell smiled. His face wasn't twitching at all.", "begin": 27447.255, "end": 27450.575, "localBegin": 10.6, "localEnd": 13.92}, {"id": "c017_f000005", "text": "\"Me,\" he said calmly. \"I wondered whether I'd be meeting you here, Potter.\"", "begin": 27450.575, "end": 27456.055, "localBegin": 13.92, "localEnd": 19.4}, {"id": "c017_f000006", "text": "\"But I thought - Snape - \"", "begin": 27456.055, "end": 27458.535, "localBegin": 19.4, "localEnd": 21.88}, {"id": "c017_f000007", "text": "\"Severus?\" Quirrell laughed, and it wasn't his usual quivering treble, either, but cold and sharp. \"Yes, Severus does seem the type, doesn't he? So useful to have him swooping around like an overgrown bat. Next to him, who would suspect p-p-poor, st-stuttering P-Professor Quirrell?\"", "begin": 27458.535, "end": 27479.535, "localBegin": 21.88, "localEnd": 42.88}, {"id": "c017_f000008", "text": "Harry couldn't take it in. This couldn't be true, it couldn't.", "begin": 27479.535, "end": 27483.455, "localBegin": 42.88, "localEnd": 46.8}, {"id": "c017_f000009", "text": "\"But Snape tried to kill me!\"", "begin": 27483.455, "end": 27485.735, "localBegin": 46.8, "localEnd": 49.08}, {"id": "c017_f000010", "text": "\"No, no, no. I tried to kill you. Your friend Miss Granger accidentally knocked me over as she rushed to set fire to Snape at that Quidditch match. She broke my eye contact with you. Another few seconds and I'd have got you off that broom. I'd have managed it before then if Snape hadn't been muttering a countercurse, trying to save you.\"", "begin": 27485.735, "end": 27507.535, "localBegin": 49.08, "localEnd": 70.88}, {"id": "c017_f000011", "text": "\"Snape was trying to save me?\"", "begin": 27507.535, "end": 27510.775, "localBegin": 70.88, "localEnd": 74.12}, {"id": "c017_f000012", "text": "\"Of course,\" said Quirrell coolly. \"Why do you think he wanted to referee your next match? He was trying to make sure I didn't do it again. Funny, really . . . he needn't have bothered. I couldn't do anything with Dumbledore watching. All the other teachers thought Snape was trying to stop Gryffindor from winning, he did make himself unpopular . . . and what a waste of time, when after all that, I'm going to kill you tonight.\"", "begin": 27510.775, "end": 27542.775, "localBegin": 74.12, "localEnd": 106.12}, {"id": "c017_f000013", "text": "Quirrell snapped his fingers. Ropes sprang out of thin air and wrapped themselves tightly around Harry.", "begin": 27542.775, "end": 27547.895, "localBegin": 106.12, "localEnd": 111.24}, {"id": "c017_f000014", "text": "\"You're too nosy to live, Potter. Scurrying around the school on Halloween like that, for all I knew you'd seen me coming to look at what was guarding the Stone.\"", "begin": 27547.895, "end": 27558.375, "localBegin": 111.24, "localEnd": 121.72}, {"id": "c017_f000015", "text": "\"You let the troll in?\"", "begin": 27558.375, "end": 27560.575, "localBegin": 121.72, "localEnd": 123.92}, {"id": "c017_f000016", "text": "\"Certainly. I have a special gift with trolls - you must have seen what I did to the one in the chamber back there? Unfortunately, while everyone else was running around looking for it, Snape, who already suspected me, went straight to the third floor to head me off - and not only did my troll fail to beat you to death, that three-headed dog didn't even manage to bite Snape's leg off properly.", "begin": 27560.575, "end": 27586.055, "localBegin": 123.92, "localEnd": 149.4}, {"id": "c017_f000017", "text": "\"Now, wait quietly, Potter. I need to examine this interesting mirror.\"", "begin": 27586.055, "end": 27593.095, "localBegin": 149.4, "localEnd": 156.44}, {"id": "c017_f000018", "text": "It was only then that Harry realized what was standing behind Quirrell. It was the Mirror of Erised.", "begin": 27593.095, "end": 27598.335, "localBegin": 156.44, "localEnd": 161.68}, {"id": "c017_f000019", "text": "\"This mirror is the key to finding the Stone,\" Quirrell murmured, tapping his way around the frame. \"Trust Dumbledore to come up with something like this . . . but he's in London . . . I'll be far away by the time he gets back. . . .\"", "begin": 27598.335, "end": 27615.855, "localBegin": 161.68, "localEnd": 179.2}, {"id": "c017_f000020", "text": "All Harry could think of doing was to keep Quirrell talking and stop him from concentrating on the mirror.", "begin": 27615.855, "end": 27620.975, "localBegin": 179.2, "localEnd": 184.32}, {"id": "c017_f000021", "text": "\"I saw you and Snape in the forest - \" he blurted out.", "begin": 27620.975, "end": 27625.215, "localBegin": 184.32, "localEnd": 188.56}, {"id": "c017_f000022", "text": "\"Yes,\" said Quirrell idly, walking around the mirror to look at the back. \"He was on to me by that time, trying to find out how far I'd got. He suspected me all along. Tried to frighten me - as though he could, when I had Lord Voldemort on my side. . . .\"", "begin": 27625.215, "end": 27641.415, "localBegin": 188.56, "localEnd": 204.76}, {"id": "c017_f000023", "text": "Quirrell came back out from behind the mirror and stared hungrily into it.", "begin": 27641.415, "end": 27646.335, "localBegin": 204.76, "localEnd": 209.68}, {"id": "c017_f000024", "text": "\"I see the Stone . . . I'm presenting it to my master . . . but where is it?\"", "begin": 27646.335, "end": 27654.575, "localBegin": 209.68, "localEnd": 217.92}, {"id": "c017_f000025", "text": "Harry struggled against the ropes binding him, but they didn't give. He had to keep Quirrell from giving his whole attention to the mirror.", "begin": 27654.575, "end": 27661.735, "localBegin": 217.92, "localEnd": 225.08}, {"id": "c017_f000026", "text": "\"But Snape always seemed to hate me so much.\"", "begin": 27661.735, "end": 27665.135, "localBegin": 225.08, "localEnd": 228.48}, {"id": "c017_f000027", "text": "\"Oh, he does,\" said Quirrell casually, \"heavens, yes. He was at Hogwarts with your father, didn't you know? They loathed each other. But he never wanted you dead.\"", "begin": 27665.135, "end": 27676.615, "localBegin": 228.48, "localEnd": 239.96}, {"id": "c017_f000028", "text": "\"But I heard you a few days ago, sobbing - I thought Snape was threatening you. . . .\"", "begin": 27676.615, "end": 27682.735, "localBegin": 239.96, "localEnd": 246.08}, {"id": "c017_f000029", "text": "For the first time, a spasm of fear flitted across Quirrell's face.", "begin": 27682.735, "end": 27686.215, "localBegin": 246.08, "localEnd": 249.56}, {"id": "c017_f000030", "text": "\"Sometimes,\" he said, \"I find it hard to follow my master's instructions - he is a great wizard and I am weak - \"", "begin": 27686.215, "end": 27695.215, "localBegin": 249.56, "localEnd": 258.56}, {"id": "c017_f000031", "text": "\"You mean he was there in the classroom with you?\" Harry gasped.", "begin": 27695.215, "end": 27700.535, "localBegin": 258.56, "localEnd": 263.88}, {"id": "c017_f000032", "text": "\"He is with me wherever I go,\" said Quirrell quietly. \"I met him when I traveled around the world. A foolish young man I was then, full of ridiculous ideas about good and evil. Lord Voldemort showed me how wrong I was. There is no good and evil, there is only power, and those too weak to seek it. . . . Since then, I have served him faithfully, although I have let him down many times. He has had to be very hard on me.\" Quirrell shivered suddenly. \"He does not forgive mistakes easily. When I failed to steal the Stone from Gringotts, he was most displeased. He punished me . . . decided he would have to keep a closer watch on me. . . .\"", "begin": 27700.535, "end": 27745.495, "localBegin": 263.88, "localEnd": 308.84}, {"id": "c017_f000033", "text": "Quirrell's voice trailed away. Harry was remembering his trip to Diagon Alley - how could he have been so stupid? He'd seen Quirrell there that very day, shaken hands with him in the Leaky Cauldron.", "begin": 27745.495, "end": 27759.015, "localBegin": 308.84, "localEnd": 322.36}, {"id": "c017_f000034", "text": "Quirrell cursed under his breath.", "begin": 27759.015, "end": 27761.455, "localBegin": 322.36, "localEnd": 324.8}, {"id": "c017_f000035", "text": "\"I don't understand . . . is the Stone inside the mirror? Should I break it?\"", "begin": 27761.455, "end": 27769.255, "localBegin": 324.8, "localEnd": 332.6}, {"id": "c017_f000036", "text": "Harry's mind was racing.", "begin": 27769.255, "end": 27771.495, "localBegin": 332.6, "localEnd": 334.84}, {"id": "c017_f000037", "text": "What I want more than anything else in the world at the moment, he thought, is to find the Stone before Quirrell does. So if I look in the mirror, I should see myself finding it - which means I'll see where it's hidden! But how can I look without Quirrell realizing what I'm up to?", "begin": 27771.495, "end": 27788.335, "localBegin": 334.84, "localEnd": 351.68}, {"id": "c017_f000038", "text": "He tried to edge to the left, to get in front of the glass without Quirrell noticing, but the ropes around his ankles were too tight: he tripped and fell over. Quirrell ignored him. He was still talking to himself.", "begin": 27788.335, "end": 27800.615, "localBegin": 351.68, "localEnd": 363.96}, {"id": "c017_f000039", "text": "\"What does this mirror do? How does it work? Help me, Master!\"", "begin": 27800.615, "end": 27808.535, "localBegin": 363.96, "localEnd": 371.88}, {"id": "c017_f000040", "text": "And to Harry's horror, a voice answered, and the voice seemed to come from Quirrell himself.", "begin": 27808.535, "end": 27814.055, "localBegin": 371.88, "localEnd": 377.4}, {"id": "c017_f000041", "text": "\"Use the boy . . . Use the boy . . .\"", "begin": 27814.055, "end": 27820.695, "localBegin": 377.4, "localEnd": 384.04}, {"id": "c017_f000042", "text": "Quirrell rounded on Harry.", "begin": 27820.695, "end": 27822.135, "localBegin": 384.04, "localEnd": 385.48}, {"id": "c017_f000043", "text": "\"Yes - Potter - come here.\"", "begin": 27822.135, "end": 27825.815, "localBegin": 385.48, "localEnd": 389.16}, {"id": "c017_f000044", "text": "He clapped his hands once, and the ropes binding Harry fell off. Harry got slowly to his feet.", "begin": 27825.815, "end": 27831.015, "localBegin": 389.16, "localEnd": 394.36}, {"id": "c017_f000045", "text": "\"Come here,\" Quirrell repeated. \"Look in the mirror and tell me what you see.\"", "begin": 27831.015, "end": 27838.095, "localBegin": 394.36, "localEnd": 401.44}, {"id": "c017_f000046", "text": "Harry walked toward him.", "begin": 27838.095, "end": 27840.015, "localBegin": 401.44, "localEnd": 403.36}, {"id": "c017_f000047", "text": "I must lie, he thought desperately. I must look and lie about what I see, that's all.", "begin": 27840.015, "end": 27846.775, "localBegin": 403.36, "localEnd": 410.12}, {"id": "c017_f000048", "text": "Quirrell moved close behind him. Harry breathed in the funny smell that seemed to come from Quirrell's turban. He closed his eyes, stepped in front of the mirror, and opened them again.", "begin": 27846.775, "end": 27858.455, "localBegin": 410.12, "localEnd": 421.8}, {"id": "c017_f000049", "text": "He saw his reflection, pale and scared-looking at first. But a moment later, the reflection smiled at him. It put its hand into its pocket and pulled out a blood-red stone. It winked and put the Stone back in its pocket - and as it did so, Harry felt something heavy drop into his real pocket. Somehow - incredibly - he'd gotten the Stone.", "begin": 27858.455, "end": 27882.815, "localBegin": 421.8, "localEnd": 446.16}, {"id": "c017_f000050", "text": "\"Well?\" said Quirrell impatiently. \"What do you see?\"", "begin": 27882.815, "end": 27888.775, "localBegin": 446.16, "localEnd": 452.12}, {"id": "c017_f000051", "text": "Harry screwed up his courage.", "begin": 27888.775, "end": 27890.495, "localBegin": 452.12, "localEnd": 453.84}, {"id": "c017_f000052", "text": "\"I see myself shaking hands with Dumbledore,\" he invented. \"I - I've won the House Cup for Gryffindor.\"", "begin": 27890.495, "end": 27897.135, "localBegin": 453.84, "localEnd": 460.48}, {"id": "c017_f000053", "text": "Quirrell cursed again.", "begin": 27897.135, "end": 27899.375, "localBegin": 460.48, "localEnd": 462.72}, {"id": "c017_f000054", "text": "\"Get out of the way,\" he said. As Harry moved aside, he felt the Sorcerer's Stone against his leg. Dare he make a break for it?", "begin": 27899.375, "end": 27908.775, "localBegin": 462.72, "localEnd": 472.12}, {"id": "c017_f000055", "text": "But he hadn't walked five paces before a high voice spoke, though Quirrell wasn't moving his lips.", "begin": 27908.775, "end": 27915.335, "localBegin": 472.12, "localEnd": 478.68}, {"id": "c017_f000056", "text": "\"He lies . . . He lies . . .\"", "begin": 27915.335, "end": 27919.015, "localBegin": 478.68, "localEnd": 482.36}, {"id": "c017_f000057", "text": "\"Potter, come back here!\" Quirrell shouted. \"Tell me the truth! What did you just see?\"", "begin": 27919.015, "end": 27925.295, "localBegin": 482.36, "localEnd": 488.64}, {"id": "c017_f000058", "text": "The high voice spoke again.", "begin": 27925.295, "end": 27926.735, "localBegin": 488.64, "localEnd": 490.08}, {"id": "c017_f000059", "text": "\"Let me speak to him . . . face-to-face. . . .\"", "begin": 27926.735, "end": 27930.455, "localBegin": 490.08, "localEnd": 493.8}, {"id": "c017_f000060", "text": "\"Master, you are not strong enough!\"", "begin": 27930.455, "end": 27933.335, "localBegin": 493.8, "localEnd": 496.68}, {"id": "c017_f000061", "text": "\"I have strength enough . . . for this. . . .\"", "begin": 27933.335, "end": 27937.535, "localBegin": 496.68, "localEnd": 500.88}, {"id": "c017_f000062", "text": "Harry felt as if Devil's Snare was rooting him to the spot. He couldn't move a muscle. Petrified, he watched as Quirrell reached up and began to unwrap his", "begin": 27937.535, "end": 27947.575, "localBegin": 500.88, "localEnd": 510.92}, {"id": "c017_f000063", "text": "turban. What was going on? The turban fell away. Quirrell's head looked strangely small without it. Then he turned slowly on the spot.", "begin": 27947.575, "end": 27957.175, "localBegin": 510.92, "localEnd": 520.52}, {"id": "c017_f000064", "text": "Harry would have screamed, but he couldn't make a sound. Where there should have been a back to Quirrell's head, there was a face, the most terrible face Harry had ever seen. It was chalk white with glaring red eyes and slits for nostrils, like a snake.", "begin": 27957.175, "end": 27971.815, "localBegin": 520.52, "localEnd": 535.16}, {"id": "c017_f000065", "text": "\"Harry Potter . . .\" it whispered.", "begin": 27971.815, "end": 27977.935, "localBegin": 535.16, "localEnd": 541.28}, {"id": "c017_f000066", "text": "Harry tried to take a step backward but his legs wouldn't move.", "begin": 27977.935, "end": 27981.575, "localBegin": 541.28, "localEnd": 544.92}, {"id": "c017_f000067", "text": "\"See what I have become?\" the face said. \"Mere shadow and vapor . . . I have form only when I can share another's body . . . but there have always been those willing to let me into their hearts and minds. . . . Unicorn blood has strengthened me, these past weeks . . . you saw faithful Quirrell drinking it for me in the forest . . . and once I have the Elixir of Life, I will be able to create a body of my own. . . . Now . . . why don't you give me that Stone in your pocket?\"", "begin": 27981.575, "end": 28022.575, "localBegin": 544.92, "localEnd": 585.92}, {"id": "c017_f000068", "text": "So he knew. The feeling suddenly surged back into Harry's legs. He stumbled backward.", "begin": 28022.575, "end": 28030.015, "localBegin": 585.92, "localEnd": 593.36}, {"id": "c017_f000069", "text": "\"Don't be a fool,\" snarled the face. \"Better save your own life and join me . . . or you'll meet the same end as your parents. . . . They died begging me for mercy. . . .\"", "begin": 28030.015, "end": 28045.255, "localBegin": 593.36, "localEnd": 608.6}, {"id": "c017_f000070", "text": "\"LIAR!\" Harry shouted suddenly.", "begin": 28045.255, "end": 28049.055, "localBegin": 608.6, "localEnd": 612.4}, {"id": "c017_f000071", "text": "Quirrell was walking backward at him, so that Voldemort could still see him. The evil face was now smiling.", "begin": 28049.055, "end": 28055.815, "localBegin": 612.4, "localEnd": 619.16}, {"id": "c017_f000072", "text": "\"How touching . . .\" it hissed. \"I always value bravery. . . . Yes, boy, your parents were brave. . . . I killed your father first, and he put up a courageous fight . . . but your mother needn't have died . . . she was trying to protect you. . . . Now give me the Stone, unless you want her to have died in vain.\"", "begin": 28055.815, "end": 28083.095, "localBegin": 619.16, "localEnd": 646.44}, {"id": "c017_f000073", "text": "\"NEVER!\"", "begin": 28083.095, "end": 28085.415, "localBegin": 646.44, "localEnd": 648.76}, {"id": "c017_f000074", "text": "Harry sprang toward the flame door, but Voldemort screamed \"SEIZE HIM!\" and the next second, Harry felt Quirrell's hand close on his wrist. At once, a needlesharp pain seared across Harry's scar; his head felt as though it was about to split in two; he yelled, struggling with all his might, and to his surprise, Quirrell let go of him. The pain in his head lessened - he looked around wildly to see where Quirrell had gone, and saw him hunched in pain, looking at his fingers -", "begin": 28085.415, "end": 28117.135, "localBegin": 648.76, "localEnd": 680.48}, {"id": "c017_f000075", "text": "they were blistering before his eyes.", "begin": 28117.135, "end": 28119.375, "localBegin": 680.48, "localEnd": 682.72}, {"id": "c017_f000076", "text": "\"Seize him! SEIZE HIM!\" shrieked Voldemort again, and Quirrell lunged, knocking Harry clean off his feet, landing on top of him, both hands around Harry's neck - Harry's scar was almost blinding him with pain, yet he could see Quirrell howling in agony.", "begin": 28119.375, "end": 28138.135, "localBegin": 682.72, "localEnd": 701.48}, {"id": "c017_f000077", "text": "\"Master, I cannot hold him - my hands - my hands!\"", "begin": 28138.135, "end": 28145.095, "localBegin": 701.48, "localEnd": 708.44}, {"id": "c017_f000078", "text": "And Quirrell, though pinning Harry to the ground with his knees, let go of his neck and stared, bewildered, at his own palms - Harry could see they looked burned, raw, red, and shiny.", "begin": 28145.095, "end": 28156.415, "localBegin": 708.44, "localEnd": 719.76}, {"id": "c017_f000079", "text": "\"Then kill him, fool, and be done!\" screeched Voldemort.", "begin": 28156.415, "end": 28161.215, "localBegin": 719.76, "localEnd": 724.56}, {"id": "c017_f000080", "text": "Quirrell raised his hand to perform a deadly curse, but Harry, by instinct, reached up and grabbed Quirrell's face -", "begin": 28161.215, "end": 28168.135, "localBegin": 724.56, "localEnd": 731.48}, {"id": "c017_f000081", "text": "\"AAAARGH!\"", "begin": 28168.135, "end": 28169.695, "localBegin": 731.48, "localEnd": 733.04}, {"id": "c017_f000082", "text": "Quirrell rolled off him, his face blistering, too, and then Harry knew: Quirrell couldn't touch his bare skin, not without suffering terrible pain - his only chance was to keep hold of Quirrell, keep him in enough pain to stop him from doing a curse.", "begin": 28169.695, "end": 28185.935, "localBegin": 733.04, "localEnd": 749.28}, {"id": "c017_f000083", "text": "Harry jumped to his feet, caught Quirrell by the arm, and hung on as tight as he could. Quirrell screamed and tried to throw Harry off - the pain in Harry's head was building - he couldn't see - he could only hear Quirrell's terrible shrieks and Voldemort's yells of, \"KILL HIM! KILL HIM!\" and other voices, maybe in Harry's own head, crying, \"Harry! Harry!\"", "begin": 28185.935, "end": 28210.215, "localBegin": 749.28, "localEnd": 773.56}, {"id": "c017_f000084", "text": "He felt Quirrell's arm wrenched from his grasp, knew all was lost, and fell into blackness, down . . . down . . . down . . .", "begin": 28210.215, "end": 28220.615, "localBegin": 773.56, "localEnd": 783.96}, {"id": "c017_f000085", "text": "Something gold was glinting just above him. The Snitch! He tried to catch it, but his arms were too heavy.", "begin": 28220.615, "end": 28232.415, "localBegin": 783.96, "localEnd": 795.76}, {"id": "c017_f000086", "text": "He blinked. It wasn't the Snitch at all. It was a pair of glasses. How strange.", "begin": 28232.415, "end": 28238.975, "localBegin": 795.76, "localEnd": 802.32}, {"id": "c017_f000087", "text": "He blinked again. The smiling face of Albus Dumbledore swam into view above him.", "begin": 28238.975, "end": 28245.495, "localBegin": 802.32, "localEnd": 808.84}, {"id": "c017_f000088", "text": "\"Good afternoon, Harry,\" said Dumbledore.", "begin": 28245.495, "end": 28249.655, "localBegin": 808.84, "localEnd": 813.0}, {"id": "c017_f000089", "text": "Harry stared at him. Then he remembered: \"Sir! The Stone! It was Quirrell!", "begin": 28249.655, "end": 28258.415, "localBegin": 813.0, "localEnd": 821.76}, {"id": "c017_f000090", "text": "He's got the Stone! Sir, quick - \"", "begin": 28258.415, "end": 28260.335, "localBegin": 821.76, "localEnd": 823.68}, {"id": "c017_f000091", "text": "\"Calm yourself, dear boy, you are a little behind the times,\" said Dumbledore. \"Quirrell does not have the Stone.\"", "begin": 28260.335, "end": 28269.895, "localBegin": 823.68, "localEnd": 833.24}, {"id": "c017_f000092", "text": "\"Then who does? Sir, I - \"", "begin": 28269.895, "end": 28272.215, "localBegin": 833.24, "localEnd": 835.56}, {"id": "c017_f000093", "text": "\"Harry, please relax, or Madam Pomfrey will have me thrown out.\"", "begin": 28272.215, "end": 28279.175, "localBegin": 835.56, "localEnd": 842.52}, {"id": "c017_f000094", "text": "Harry swallowed and looked around him. He realized he must be in the hospital wing. He was lying in a bed with white linen sheets, and next to him was a table piled high with what looked like half the candy shop.", "begin": 28279.175, "end": 28292.815, "localBegin": 842.52, "localEnd": 856.16}, {"id": "c017_f000095", "text": "\"Tokens from your friends and admirers,\" said Dumbledore, beaming. \"What happened down in the dungeons between you and Professor Quirrell is a complete secret, so, naturally, the whole school knows. I believe your friends Misters Fred and George Weasley were responsible for trying to send you a toilet seat. No doubt they thought it would amuse you. Madam Pomfrey, however, felt it might not be very hygienic, and confiscated it.\"", "begin": 28292.815, "end": 28325.455, "localBegin": 856.16, "localEnd": 888.8}, {"id": "c017_f000096", "text": "\"How long have I been in here?\"", "begin": 28325.455, "end": 28328.735, "localBegin": 888.8, "localEnd": 892.08}, {"id": "c017_f000097", "text": "\"Three days. Mr. Ronald Weasley and Miss Granger will be most relieved you have come round, they have been extremely worried.\"", "begin": 28328.735, "end": 28338.335, "localBegin": 892.08, "localEnd": 901.68}, {"id": "c017_f000098", "text": "\"But sir, the Stone - \"", "begin": 28338.335, "end": 28340.775, "localBegin": 901.68, "localEnd": 904.12}, {"id": "c017_f000099", "text": "\"I see you are not to be distracted. Very well, the Stone. Professor Quirrell did not manage to take it from you. I arrived in time to prevent that, although you were doing very well on your own, I must say.\"", "begin": 28340.775, "end": 28356.935, "localBegin": 904.12, "localEnd": 920.28}, {"id": "c017_f000100", "text": "\"You got there? You got Hermione's owl?\"", "begin": 28356.935, "end": 28360.215, "localBegin": 920.28, "localEnd": 923.56}, {"id": "c017_f000101", "text": "\"We must have crossed in midair. No sooner had I reached London than it became clear to me that the place I should be was the one I had just left. I arrived just in time to pull Quirrell off you - \"", "begin": 28360.215, "end": 28373.055, "localBegin": 923.56, "localEnd": 936.4}, {"id": "c017_f000102", "text": "\"It was you.\"", "begin": 28373.055, "end": 28374.375, "localBegin": 936.4, "localEnd": 937.72}, {"id": "c017_f000103", "text": "\"I feared I might be too late.\"", "begin": 28374.375, "end": 28376.815, "localBegin": 937.72, "localEnd": 940.16}, {"id": "c017_f000104", "text": "\"You nearly were, I couldn't have kept him off the Stone much longer - \"", "begin": 28376.815, "end": 28381.375, "localBegin": 940.16, "localEnd": 944.72}, {"id": "c017_f000105", "text": "\"Not the Stone, boy, you - the effort involved nearly killed you. For one terrible moment there, I was afraid it had. As for the Stone, it has been", "begin": 28381.375, "end": 28394.175, "localBegin": 944.72, "localEnd": 957.52}, {"id": "c017_f000106", "text": "destroyed.\"", "begin": 28394.175, "end": 28395.015, "localBegin": 957.52, "localEnd": 958.36}, {"id": "c017_f000107", "text": "\"Destroyed?\" said Harry blankly. \"But your friend - Nicolas Flamel - \"", "begin": 28395.015, "end": 28400.895, "localBegin": 958.36, "localEnd": 964.24}, {"id": "c017_f000108", "text": "\"Oh, you know about Nicolas?\" said Dumbledore, sounding quite delighted. \"You did do the thing properly, didn't you? Well, Nicolas and I have had a little chat, and agreed it's all for the best.\"", "begin": 28400.895, "end": 28416.295, "localBegin": 964.24, "localEnd": 979.64}, {"id": "c017_f000109", "text": "\"But that means he and his wife will die, won't they?\"", "begin": 28416.295, "end": 28421.615, "localBegin": 979.64, "localEnd": 984.96}, {"id": "c017_f000110", "text": "\"They have enough Elixir stored to set their affairs in order and then, yes, they will die.\"", "begin": 28421.615, "end": 28430.535, "localBegin": 984.96, "localEnd": 993.88}, {"id": "c017_f000111", "text": "Dumbledore smiled at the look of amazement on Harry's face.", "begin": 28430.535, "end": 28435.175, "localBegin": 993.88, "localEnd": 998.52}, {"id": "c017_f000112", "text": "\"To one as young as you, I'm sure it seems incredible, but to Nicolas and Perenelle, it really is like going to bed after a very, very long day. After all, to the well-organized mind, death is but the next great adventure. You know, the Stone was really not such a wonderful thing. As much money and life as you could want! The two things most human beings would choose above all - the trouble is, humans do have a knack of choosing precisely those things that are worst for them.\"", "begin": 28435.175, "end": 28476.495, "localBegin": 998.52, "localEnd": 1039.84}, {"id": "c017_f000113", "text": "Harry lay there, lost for words. Dumbledore hummed a little and smiled at the ceiling.", "begin": 28476.495, "end": 28483.255, "localBegin": 1039.84, "localEnd": 1046.6}, {"id": "c017_f000114", "text": "\"Sir?\" said Harry. \"I've been thinking . . . Sir - even if the Stone's gone, Vol-, I mean, You-Know-Who - \"", "begin": 28483.255, "end": 28492.375, "localBegin": 1046.6, "localEnd": 1055.72}, {"id": "c017_f000115", "text": "\"Call him Voldemort, Harry. Always use the proper name for things. Fear of a name increases fear of the thing itself.\"", "begin": 28492.375, "end": 28502.975, "localBegin": 1055.72, "localEnd": 1066.32}, {"id": "c017_f000116", "text": "\"Yes, sir. Well, Voldemort's going to try other ways of coming back, isn't he? I mean, he hasn't gone, has he?\"", "begin": 28502.975, "end": 28510.415, "localBegin": 1066.32, "localEnd": 1073.76}, {"id": "c017_f000117", "text": "\"No, Harry, he has not. He is still out there somewhere, perhaps looking for another body to share . . . not being truly alive, he cannot be killed. He left Quirrell to die; he shows just as little mercy to his followers as his enemies. Nevertheless, Harry, while you may only have delayed his return to power, it will merely take someone else who is prepared to fight what seems a losing battle next time - and if he is delayed again, and again, why, he may never return to power.\"", "begin": 28510.415, "end": 28550.455, "localBegin": 1073.76, "localEnd": 1113.8}, {"id": "c017_f000118", "text": "Harry nodded, but stopped quickly, because it made his head hurt. Then he said, \"Sir, there are some other things I'd like to know, if you can tell me . . . things I want to know the truth about. . . .\"", "begin": 28550.455, "end": 28562.815, "localBegin": 1113.8, "localEnd": 1126.16}, {"id": "c017_f000119", "text": "\"The truth.\" Dumbledore sighed. \"It is a beautiful and terrible thing, and should therefore be treated with great caution. However, I shall answer your questions unless I have a very good reason not to, in which case I beg you'll forgive me. I shall not, of course, lie.\"", "begin": 28562.815, "end": 28585.015, "localBegin": 1126.16, "localEnd": 1148.36}, {"id": "c017_f000120", "text": "\"Well . . . Voldemort said that he only killed my mother because she tried to stop him from killing me. But why would he want to kill me in the first place?\"", "begin": 28585.015, "end": 28596.855, "localBegin": 1148.36, "localEnd": 1160.2}, {"id": "c017_f000121", "text": "Dumbledore sighed very deeply this time.", "begin": 28596.855, "end": 28600.575, "localBegin": 1160.2, "localEnd": 1163.92}, {"id": "c017_f000122", "text": "\"Alas, the first thing you ask me, I cannot tell you. Not today. Not now. You will know, one day . . . put it from your mind for now, Harry. When you are older . . . I know you hate to hear this . . . when you are ready, you will know.\"", "begin": 28600.575, "end": 28623.375, "localBegin": 1163.92, "localEnd": 1186.72}, {"id": "c017_f000123", "text": "And Harry knew it would be no good to argue.", "begin": 28623.375, "end": 28627.615, "localBegin": 1186.72, "localEnd": 1190.96}, {"id": "c017_f000124", "text": "\"But why couldn't Quirrell touch me?\"", "begin": 28627.615, "end": 28631.135, "localBegin": 1190.96, "localEnd": 1194.48}, {"id": "c017_f000125", "text": "\"Your mother died to save you. If there is one thing Voldemort cannot understand, it is love. He didn't realize that love as powerful as your mother's for you leaves its own mark. Not a scar, no visible sign . . . to have been loved so deeply, even though the person who loved us is gone, will give us some protection forever. It is in your very skin. Quirrell, full of hatred, greed, and ambition, sharing his soul with Voldemort, could not touch you for this reason. It was agony to touch a person marked by something so good.\"", "begin": 28631.135, "end": 28677.655, "localBegin": 1194.48, "localEnd": 1241.0}, {"id": "c017_f000126", "text": "Dumbledore now became very interested in a bird out on the windowsill, which gave Harry time to dry his eyes on the sheet. When he had found his voice again, Harry said, \"And the Invisibility Cloak - do you know who sent it to me?\"", "begin": 28677.655, "end": 28695.055, "localBegin": 1241.0, "localEnd": 1258.4}, {"id": "c017_f000127", "text": "\"Ah - your father happened to leave it in my possession, and I thought you might like it.\" Dumbledore's eyes twinkled. \"Useful things . . . your father used it mainly for sneaking off to the kitchens to steal food when he was here.\"", "begin": 28695.055, "end": 28715.135, "localBegin": 1258.4, "localEnd": 1278.48}, {"id": "c017_f000128", "text": "\"And there's something else . . .\"", "begin": 28715.135, "end": 28717.575, "localBegin": 1278.48, "localEnd": 1280.92}, {"id": "c017_f000129", "text": "\"Fire away.\"", "begin": 28717.575, "end": 28718.735, "localBegin": 1280.92, "localEnd": 1282.08}, {"id": "c017_f000130", "text": "\"Quirrell said Snape - \"", "begin": 28718.735, "end": 28721.295, "localBegin": 1282.08, "localEnd": 1284.64}, {"id": "c017_f000131", "text": "\"Professor Snape, Harry.\"", "begin": 28721.295, "end": 28723.895, "localBegin": 1284.64, "localEnd": 1287.24}, {"id": "c017_f000132", "text": "\"Yes, him - Quirrell said he hates me because he hated my father. Is that true?\"", "begin": 28723.895, "end": 28730.895, "localBegin": 1287.24, "localEnd": 1294.24}, {"id": "c017_f000133", "text": "\"Well, they did rather detest each other. Not unlike yourself and Mr. Malfoy. And then, your father did something Snape could never forgive.\"", "begin": 28730.895, "end": 28743.255, "localBegin": 1294.24, "localEnd": 1306.6}, {"id": "c017_f000134", "text": "\"What?\"", "begin": 28743.255, "end": 28744.935, "localBegin": 1306.6, "localEnd": 1308.28}, {"id": "c017_f000135", "text": "\"He saved his life.\"", "begin": 28744.935, "end": 28748.095, "localBegin": 1308.28, "localEnd": 1311.44}, {"id": "c017_f000136", "text": "\"What?\"", "begin": 28748.095, "end": 28749.775, "localBegin": 1311.44, "localEnd": 1313.12}, {"id": "c017_f000137", "text": "\"Yes . . .\" said Dumbledore dreamily. \"Funny, the way people's minds work, isn't it? Professor Snape couldn't bear being in your father's debt. . . . I do believe he worked so hard to protect you this year because he felt that would make him and your father even. Then he could go back to hating your father's memory in peace. . . .\"", "begin": 28749.775, "end": 28776.535, "localBegin": 1313.12, "localEnd": 1339.88}, {"id": "c017_f000138", "text": "Harry tried to understand this but it made his head pound, so he stopped.", "begin": 28776.535, "end": 28782.135, "localBegin": 1339.88, "localEnd": 1345.48}, {"id": "c017_f000139", "text": "\"And sir, there's one more thing . . .\"", "begin": 28782.135, "end": 28785.495, "localBegin": 1345.48, "localEnd": 1348.84}, {"id": "c017_f000140", "text": "\"Just the one?\"", "begin": 28785.495, "end": 28787.455, "localBegin": 1348.84, "localEnd": 1350.8}, {"id": "c017_f000141", "text": "\"How did I get the Stone out of the mirror?\"", "begin": 28787.455, "end": 28791.095, "localBegin": 1350.8, "localEnd": 1354.44}, {"id": "c017_f000142", "text": "\"Ah, now, I'm glad you asked me that. It was one of my more brilliant ideas, and between you and me, that's saying something. You see, only one who wanted to find the Stone - find it, but not use it - would be able to get it, otherwise they'd just see themselves making gold or drinking Elixir of Life. My brain surprises even me sometimes. . . . Now, enough questions. I suggest you make a start on these sweets. Ah! Bertie Bott's Every Flavor Beans! I was unfortunate enough in my youth to come across a vomit-flavored one, and since then I'm afraid I've rather lost my liking for them - but I think I'll be safe with a nice toffee, don't you?\"", "begin": 28791.095, "end": 28848.855, "localBegin": 1354.44, "localEnd": 1412.2}, {"id": "c017_f000143", "text": "He smiled and popped the golden-brown bean into his mouth. Then he choked and said, \"Alas! Ear wax!\"", "begin": 28848.855, "end": 28858.655, "localBegin": 1412.2, "localEnd": 1422.0}, {"id": "c017_f000144", "text": "Madam Pomfrey, the nurse, was a nice woman, but very strict.", "begin": 28858.655, "end": 28864.695, "localBegin": 1422.0, "localEnd": 1428.04}, {"id": "c017_f000145", "text": "\"Just five minutes,\" Harry pleaded.", "begin": 28864.695, "end": 28868.015, "localBegin": 1428.04, "localEnd": 1431.36}, {"id": "c017_f000146", "text": "\"Absolutely not.\"", "begin": 28868.015, "end": 28869.495, "localBegin": 1431.36, "localEnd": 1432.84}, {"id": "c017_f000147", "text": "\"You let Professor Dumbledore in. . . .\"", "begin": 28869.495, "end": 28872.655, "localBegin": 1432.84, "localEnd": 1436.0}, {"id": "c017_f000148", "text": "\"Well, of course, that was the headmaster, quite different. You need rest.\"", "begin": 28872.655, "end": 28877.615, "localBegin": 1436.0, "localEnd": 1440.96}, {"id": "c017_f000149", "text": "\"I am resting, look, lying down and everything. Oh, go on, Madam Pomfrey . . .\"", "begin": 28877.615, "end": 28884.535, "localBegin": 1440.96, "localEnd": 1447.88}, {"id": "c017_f000150", "text": "\"Oh, very well,\" she said. \"But five minutes only.\"", "begin": 28884.535, "end": 28889.375, "localBegin": 1447.88, "localEnd": 1452.72}, {"id": "c017_f000151", "text": "And she let Ron and Hermione in.", "begin": 28889.375, "end": 28892.495, "localBegin": 1452.72, "localEnd": 1455.84}, {"id": "c017_f000152", "text": "\"Harry!\"", "begin": 28892.495, "end": 28894.615, "localBegin": 1455.84, "localEnd": 1457.96}, {"id": "c017_f000153", "text": "Hermione looked ready to fling her arms around him again, but Harry was glad she held herself in as his head was still very sore.", "begin": 28894.615, "end": 28901.855, "localBegin": 1457.96, "localEnd": 1465.2}, {"id": "c017_f000154", "text": "\"Oh, Harry, we were sure you were going to - Dumbledore was so worried - \"", "begin": 28901.855, "end": 28906.975, "localBegin": 1465.2, "localEnd": 1470.32}, {"id": "c017_f000155", "text": "\"The whole school's talking about it,\" said Ron. \"What really happened?\"", "begin": 28906.975, "end": 28911.935, "localBegin": 1470.32, "localEnd": 1475.28}, {"id": "c017_f000156", "text": "It was one of those rare occasions when the true story is even more strange and exciting than the wild rumors. Harry told them everything: Quirrell; the mirror; the Stone; and Voldemort. Ron and Hermione were a very good audience; they gasped in all the right places, and when Harry told them what was under Quirrell's turban, Hermione screamed out loud.", "begin": 28911.935, "end": 28935.415, "localBegin": 1475.28, "localEnd": 1498.76}, {"id": "c017_f000157", "text": "\"So the Stone's gone?\" said Ron finally. \"Flamel's just going to die?\"", "begin": 28935.415, "end": 28941.775, "localBegin": 1498.76, "localEnd": 1505.12}, {"id": "c017_f000158", "text": "\"That's what I said, but Dumbledore thinks that - what was it? - 'to the wellorganized mind, death is but the next great adventure.'\"", "begin": 28941.775, "end": 28951.575, "localBegin": 1505.12, "localEnd": 1514.92}, {"id": "c017_f000159", "text": "\"I always said he was off his rocker,\" said Ron, looking quite impressed at how crazy his hero was.", "begin": 28951.575, "end": 28958.975, "localBegin": 1514.92, "localEnd": 1522.32}, {"id": "c017_f000160", "text": "\"So what happened to you two?\" said Harry.", "begin": 28958.975, "end": 28963.055, "localBegin": 1522.32, "localEnd": 1526.4}, {"id": "c017_f000161", "text": "\"Well, I got back all right,\" said Hermione. \"I brought Ron round - that took a while - and we were dashing up to the owlery to contact Dumbledore when we met him in the entrance hall - he already knew - he just said, 'Harry's gone after him, hasn't he?' and hurtled off to the third floor.\"", "begin": 28963.055, "end": 28980.335, "localBegin": 1526.4, "localEnd": 1543.68}, {"id": "c017_f000162", "text": "\"D'you think he meant you to do it?\" said Ron. \"Sending you your father's Cloak and everything?\"", "begin": 28980.335, "end": 28985.695, "localBegin": 1543.68, "localEnd": 1549.04}, {"id": "c017_f000163", "text": "\"Well,\" Hermione exploded, \"if he did - I mean to say - that's terrible - you could have been killed.\"", "begin": 28985.695, "end": 28992.255, "localBegin": 1549.04, "localEnd": 1555.6}, {"id": "c017_f000164", "text": "\"No, it isn't,\" said Harry thoughtfully. \"He's a funny man, Dumbledore. I think he sort of wanted to give me a chance. I think he knows more or less", "begin": 28992.255, "end": 29002.735, "localBegin": 1555.6, "localEnd": 1566.08}, {"id": "c017_f000165", "text": "everything that goes on here, you know. I reckon he had a pretty good idea we were going to try, and instead of stopping us, he just taught us enough to help. I don't think it was an accident he let me find out how the mirror worked. It's almost like he thought I had the right to face Voldemort if I could. . . .\"", "begin": 29002.735, "end": 29021.015, "localBegin": 1566.08, "localEnd": 1584.36}, {"id": "c017_f000166", "text": "\"Yeah, Dumbledore's off his rocker, all right,\" said Ron proudly. \"Listen, you've got to be up for the end-of-year feast tomorrow. The points are all in and Slytherin won, of course - you missed the last Quidditch match, we were steamrollered by Ravenclaw without you - but the food'll be good.\"", "begin": 29021.015, "end": 29040.535, "localBegin": 1584.36, "localEnd": 1603.88}, {"id": "c017_f000167", "text": "At that moment, Madam Pomfrey bustled over.", "begin": 29040.535, "end": 29044.535, "localBegin": 1603.88, "localEnd": 1607.88}, {"id": "c017_f000168", "text": "\"You've had nearly fifteen minutes, now OUT,\" she said firmly.", "begin": 29044.535, "end": 29050.015, "localBegin": 1607.88, "localEnd": 1613.36}, {"id": "c017_f000169", "text": "After a good night's sleep, Harry felt nearly back to normal.", "begin": 29050.015, "end": 29057.655, "localBegin": 1613.36, "localEnd": 1621.0}, {"id": "c017_f000170", "text": "\"I want to go to the feast,\" he told Madam Pomfrey as she straightened his many candy boxes. \"I can, can't I?\"", "begin": 29057.655, "end": 29065.655, "localBegin": 1621.0, "localEnd": 1629.0}, {"id": "c017_f000171", "text": "\"Professor Dumbledore says you are to be allowed to go,\" she said sniffily, as though in her opinion Professor Dumbledore didn't realize how risky feasts could be. \"And you have another visitor.\"", "begin": 29065.655, "end": 29077.175, "localBegin": 1629.0, "localEnd": 1640.52}, {"id": "c017_f000172", "text": "\"Oh, good,\" said Harry. \"Who is it?\"", "begin": 29077.175, "end": 29080.455, "localBegin": 1640.52, "localEnd": 1643.8}, {"id": "c017_f000173", "text": "Hagrid sidled through the door as he spoke. As usual when he was indoors, Hagrid looked too big to be a
