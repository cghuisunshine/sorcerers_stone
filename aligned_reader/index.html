nd the Sorcerer's Stone, Book 1 (Unabridged)/013 - Harry Potter and the Sorcerer's Stone, Book 1 (Unabridged).mp3", "start": 20557.789, "end": 21745.072, "duration": 1187.283, "paragraphs": [{"id": "c013_f000001", "text": "Chapter Thirteen. Nicolas Flamel.", "begin": 20557.789, "end": 20562.309, "localBegin": 0.0, "localEnd": 4.52}, {"id": "c013_f000002", "text": "Dumbledore had convinced Harry not to go looking for the Mirror of Erised again, and for the rest of the Christmas holidays the Invisibility Cloak stayed folded at the bottom of his trunk. Harry wished he could forget what he'd seen in the mirror as easily, but he couldn't. He started having nightmares. Over and over again he dreamed about his parents disappearing in a flash of green light, while a high voice cackled with laughter.", "begin": 20562.309, "end": 20586.989, "localBegin": 4.52, "localEnd": 29.2}, {"id": "c013_f000003", "text": "\"You see, Dumbledore was right, that mirror could drive you mad,\" said Ron, when Harry told him about these dreams.", "begin": 20586.989, "end": 20596.389, "localBegin": 29.2, "localEnd": 38.6}, {"id": "c013_f000004", "text": "Hermione, who came back the day before term started, took a different view of things. She was torn between horror at the idea of Harry being out of bed, roaming the school three nights in a row (\"If Filch had caught you!\"), and disappointment that he hadn't at least found out who Nicolas Flamel was.", "begin": 20596.389, "end": 20615.309, "localBegin": 38.6, "localEnd": 57.52}, {"id": "c013_f000005", "text": "They had almost given up hope of ever finding Flamel in a library book, even though Harry was still sure he'd read the name somewhere. Once term had started, they were back to skimming through books for ten minutes during their breaks. Harry had even less time than the other two, because Quidditch practice had started again.", "begin": 20615.309, "end": 20633.429, "localBegin": 57.52, "localEnd": 75.64}, {"id": "c013_f000006", "text": "Wood was working the team harder than ever. Even the endless rain that had replaced the snow couldn't dampen his spirits. The Weasleys complained that Wood was becoming a fanatic, but Harry was on Wood's side. If they won their next match, against Hufflepuff, they would overtake Slytherin in the House Championship for the first time in seven years. Quite apart from wanting to win, Harry found that he had fewer nightmares when he was tired out after training.", "begin": 20633.429, "end": 20659.549, "localBegin": 75.64, "localEnd": 101.76}, {"id": "c013_f000007", "text": "Then, during one particularly wet and muddy practice session, Wood gave the team a bit of bad news. He'd just gotten very angry with the Weasleys, who kept dive-bombing each other and pretending to fall off their brooms.", "begin": 20659.549, "end": 20671.829, "localBegin": 101.76, "localEnd": 114.04}, {"id": "c013_f000008", "text": "\"Will you stop messing around!\" he yelled. \"That's exactly the sort of thing that'll lose us the match! Snape's refereeing this time, and he'll be looking for any excuse to knock points off Gryffindor!\"", "begin": 20671.829, "end": 20685.709, "localBegin": 114.04, "localEnd": 127.92}, {"id": "c013_f000009", "text": "George Weasley really did fall off his broom at these words.", "begin": 20685.709, "end": 20688.869, "localBegin": 127.92, "localEnd": 131.08}, {"id": "c013_f000010", "text": "\"Snape's refereeing?\" he spluttered through a mouthful of mud. \"When's he ever refereed a Quidditch match? He's not going to be fair if we might overtake Slytherin.\"", "begin": 20688.869, "end": 20702.149, "localBegin": 131.08, "localEnd": 144.36}, {"id": "c013_f000011", "text": "The rest of the team landed next to George to complain, too.", "begin": 20702.149, "end": 20705.269, "localBegin": 144.36, "localEnd": 147.48}, {"id": "c013_f000012", "text": "\"It's not my fault,\" said Wood. \"We've just got to make sure we play a clean game, so Snape hasn't got an excuse to pick on us.\"", "begin": 20705.269, "end": 20715.309, "localBegin": 147.48, "localEnd": 157.52}, {"id": "c013_f000013", "text": "Which was all very well, thought Harry, but he had another reason for not wanting Snape near him while he was playing Quidditch. . . .", "begin": 20715.309, "end": 20722.909, "localBegin": 157.52, "localEnd": 165.12}, {"id": "c013_f000014", "text": "The rest of the team hung back to talk to one another as usual at the end of practice, but Harry headed straight back to the Gryffindor common room, where he found Ron and Hermione playing chess. Chess was the only thing Hermione ever lost at, something Harry and Ron thought was very good for her.", "begin": 20722.909, "end": 20739.189, "localBegin": 165.12, "localEnd": 181.4}, {"id": "c013_f000015", "text": "\"Don't talk to me for a moment,\" said Ron when Harry sat down next to him, \"I need to concen - \" He caught sight of Harry's face. \"What's the matter with you? You look terrible.\"", "begin": 20739.189, "end": 20753.269, "localBegin": 181.4, "localEnd": 195.48}, {"id": "c013_f000016", "text": "Speaking quietly so that no one else would hear, Harry told the other two about Snape's sudden, sinister desire to be a Quidditch referee.", "begin": 20753.269, "end": 20760.789, "localBegin": 195.48, "localEnd": 203.0}, {"id": "c013_f000017", "text": "\"Don't play,\" said Hermione at once.", "begin": 20760.789, "end": 20764.269, "localBegin": 203.0, "localEnd": 206.48}, {"id": "c013_f000018", "text": "\"Say you're ill,\" said Ron.", "begin": 20764.269, "end": 20766.509, "localBegin": 206.48, "localEnd": 208.72}, {"id": "c013_f000019", "text": "\"Pretend to break your leg,\" Hermione suggested.", "begin": 20766.509, "end": 20769.589, "localBegin": 208.72, "localEnd": 211.8}, {"id": "c013_f000020", "text": "\"Really break your leg,\" said Ron.", "begin": 20769.589, "end": 20772.029, "localBegin": 211.8, "localEnd": 214.24}, {"id": "c013_f000021", "text": "\"I can't,\" said Harry. \"There isn't a reserve Seeker. If I back out, Gryffindor can't play at all.\"", "begin": 20772.029, "end": 20779.909, "localBegin": 214.24, "localEnd": 222.12}, {"id": "c013_f000022", "text": "At that moment Neville toppled into the common room. How he had managed to climb through the portrait hole was anyone's guess, because his legs had been stuck together with what they recognized at once as the Leg-Locker Curse. He must have had to bunny hop all the way up to Gryffindor Tower.", "begin": 20779.909, "end": 20796.309, "localBegin": 222.12, "localEnd": 238.52}, {"id": "c013_f000023", "text": "Everyone fell over laughing except Hermione, who leapt up and performed the countercurse. Neville's legs sprang apart and he got to his feet, trembling.", "begin": 20796.309, "end": 20805.349, "localBegin": 238.52, "localEnd": 247.56}, {"id": "c013_f000024", "text": "\"What happened?\" Hermione asked him, leading him over to sit with Harry and Ron.", "begin": 20805.349, "end": 20810.349, "localBegin": 247.56, "localEnd": 252.56}, {"id": "c013_f000025", "text": "\"Malfoy,\" said Neville shakily. \"I met him outside the library. He said he'd been looking for someone to practice that on.\"", "begin": 20810.349, "end": 20818.749, "localBegin": 252.56, "localEnd": 260.96}, {"id": "c013_f000026", "text": "\"Go to Professor McGonagall!\" Hermione urged Neville. \"Report him!\"", "begin": 20818.749, "end": 20824.549, "localBegin": 260.96, "localEnd": 266.76}, {"id": "c013_f000027", "text": "Neville shook his head.", "begin": 20824.549, "end": 20825.549, "localBegin": 266.76, "localEnd": 267.76}, {"id": "c013_f000028", "text": "\"I don't want more trouble,\" he mumbled.", "begin": 20825.549, "end": 20828.349, "localBegin": 267.76, "localEnd": 270.56}, {"id": "c013_f000029", "text": "\"You've got to stand up to him, Neville!\" said Ron. \"He's used to walking all over people, but that's no reason to lie down in front of him and make it easier.\"", "begin": 20828.349, "end": 20836.989, "localBegin": 270.56, "localEnd": 279.2}, {"id": "c013_f000030", "text": "\"There's no need to tell me I'm not brave enough to be in Gryffindor, Malfoy's already done that,\" Neville choked out.", "begin": 20836.989, "end": 20845.869, "localBegin": 279.2, "localEnd": 288.08}, {"id": "c013_f000031", "text": "Harry felt in the pocket of his robes and pulled out a Chocolate Frog, the very last one from the box Hermione had given him for Christmas. He gave it to Neville, who looked as though he might cry.", "begin": 20845.869, "end": 20856.389, "localBegin": 288.08, "localEnd": 298.6}, {"id": "c013_f000032", "text": "\"You're worth twelve of Malfoy,\" Harry said. \"The Sorting Hat chose you for Gryffindor, didn't it? And where's Malfoy? In stinking Slytherin.\"", "begin": 20856.389, "end": 20868.389, "localBegin": 298.6, "localEnd": 310.6}, {"id": "c013_f000033", "text": "Neville's lips twitched in a weak smile as he unwrapped the frog.", "begin": 20868.389, "end": 20871.389, "localBegin": 310.6, "localEnd": 313.6}, {"id": "c013_f000034", "text": "\"Thanks, Harry . . . I think I'll go to bed. . . . D'you want the card, you collect them, don't you?\"", "begin": 20871.389, "end": 20879.149, "localBegin": 313.6, "localEnd": 321.36}, {"id": "c013_f000035", "text": "As Neville walked away, Harry looked at the Famous Wizard card.", "begin": 20879.149, "end": 20882.309, "localBegin": 321.36, "localEnd": 324.52}, {"id": "c013_f000036", "text": "\"Dumbledore again,\" he said, \"He was the first one I ever - \"", "begin": 20882.309, "end": 20887.549, "localBegin": 324.52, "localEnd": 329.76}, {"id": "c013_f000037", "text": "He gasped. He stared at the back of the card. Then he looked up at Ron and Hermione.", "begin": 20887.549, "end": 20892.469, "localBegin": 329.76, "localEnd": 334.68}, {"id": "c013_f000038", "text": "\"I've found him!\" he whispered. \"I've found Flamel! I told you I'd read the name somewhere before, I read it on the train coming here - listen to this: 'Dumbledore is particularly famous for his defeat of the Dark wizard Grindelwald in 1945, for the discovery of the twelve uses of dragon's blood, and his work on alchemy with his partner, Nicolas Flamel'!\"", "begin": 20892.469, "end": 20920.709, "localBegin": 334.68, "localEnd": 362.92}, {"id": "c013_f000039", "text": "Hermione jumped to her feet. She hadn't looked so excited since they'd gotten back the marks for their very first piece of homework.", "begin": 20920.709, "end": 20926.869, "localBegin": 362.92, "localEnd": 369.08}, {"id": "c013_f000040", "text": "\"Stay there!\" she said, and she sprinted up the stairs to the girls' dormitories. Harry and Ron barely had time to exchange mystified looks before she was dashing back, an enormous old book in her arms.", "begin": 20926.869, "end": 20938.749, "localBegin": 369.08, "localEnd": 380.96}, {"id": "c013_f000041", "text": "\"I never thought to look in here!\" she whispered excitedly. \"I got this out of", "begin": 20938.749, "end": 20943.309, "localBegin": 380.96, "localEnd": 385.52}, {"id": "c013_f000042", "text": "the library weeks ago for a bit of light reading.\"", "begin": 20943.309, "end": 20945.789, "localBegin": 385.52, "localEnd": 388.0}, {"id": "c013_f000043", "text": "\"Light?\" said Ron, but Hermione told him to be quiet until she'd looked something up, and started flicking frantically through the pages, muttering to herself.", "begin": 20945.789, "end": 20956.109, "localBegin": 388.0, "localEnd": 398.32}, {"id": "c013_f000044", "text": "At last she found what she was looking for.", "begin": 20956.109, "end": 20957.909, "localBegin": 398.32, "localEnd": 400.12}, {"id": "c013_f000045", "text": "\"I knew it! I knew it!\"", "begin": 20957.909, "end": 20960.829, "localBegin": 400.12, "localEnd": 403.04}, {"id": "c013_f000046", "text": "\"Are we allowed to speak yet?\" said Ron grumpily. Hermione ignored him.", "begin": 20960.829, "end": 20966.269, "localBegin": 403.04, "localEnd": 408.48}, {"id": "c013_f000047", "text": "\"Nicolas Flamel,\" she whispered dramatically, \"is the only known maker of the Sorcerer's Stone!\"", "begin": 20966.269, "end": 20974.389, "localBegin": 408.48, "localEnd": 416.6}, {"id": "c013_f000048", "text": "This didn't have quite the effect she'd expected.", "begin": 20974.389, "end": 20977.189, "localBegin": 416.6, "localEnd": 419.4}, {"id": "c013_f000049", "text": "\"The what?\" said Harry and Ron.", "begin": 20977.189, "end": 20979.869, "localBegin": 419.4, "localEnd": 422.08}, {"id": "c013_f000050", "text": "\"Oh, honestly, don't you two read? Look - read that, there.\"", "begin": 20979.869, "end": 20985.389, "localBegin": 422.08, "localEnd": 427.6}, {"id": "c013_f000051", "text": "She pushed the book toward them, and Harry and Ron read:", "begin": 20985.389, "end": 20988.149, "localBegin": 427.6, "localEnd": 430.36}, {"id": "c013_f000052", "text": "The ancient study of alchemy is concerned with making the Sorcerer's", "begin": 20988.149, "end": 20992.149, "localBegin": 430.36, "localEnd": 434.36}, {"id": "c013_f000053", "text": "Stone, a legendary substance with astonishing powers. The Stone will", "begin": 20992.149, "end": 20996.469, "localBegin": 434.36, "localEnd": 438.68}, {"id": "c013_f000054", "text": "transform any metal into pure gold. It also produces the Elixir of Life,", "begin": 20996.469, "end": 21001.749, "localBegin": 438.68, "localEnd": 443.96}, {"id": "c013_f000055", "text": "which will make the drinker immortal.", "begin": 21001.749, "end": 21003.789, "localBegin": 443.96, "localEnd": 446.0}, {"id": "c013_f000056", "text": "There have been many reports of the Sorcerer's Stone over the", "begin": 21003.789, "end": 21006.109, "localBegin": 446.0, "localEnd": 448.32}, {"id": "c013_f000057", "text": "centuries, but the only Stone currently in existence belongs to Mr. Nicolas", "begin": 21006.109, "end": 21010.829, "localBegin": 448.32, "localEnd": 453.04}, {"id": "c013_f000058", "text": "Flamel, the noted alchemist and opera lover. Mr. Flamel, who celebrated his", "begin": 21010.829, "end": 21016.029, "localBegin": 453.04, "localEnd": 458.24}, {"id": "c013_f000059", "text": "six hundred and sixty-fifth birthday last year, enjoys a quiet life in", "begin": 21016.029, "end": 21019.789, "localBegin": 458.24, "localEnd": 462.0}, {"id": "c013_f000060", "text": "Devon with his wife, Perenelle (six hundred and fifty-eight).", "begin": 21019.789, "end": 21023.629, "localBegin": 462.0, "localEnd": 465.84}, {"id": "c013_f000061", "text": "\"See?\" said Hermione, when Harry and Ron had finished. \"The dog must be guarding Flamel's Sorcerer's Stone! I bet he asked Dumbledore to keep it safe for him, because they're friends and he knew someone was after it, that's why he wanted the Stone moved out of Gringotts!\"", "begin": 21023.629, "end": 21041.109, "localBegin": 465.84, "localEnd": 483.32}, {"id": "c013_f000062", "text": "\"A stone that makes gold and stops you from ever dying!\" said Harry. \"No wonder Snape's after it! Anyone would want it.\"", "begin": 21041.109, "end": 21049.309, "localBegin": 483.32, "localEnd": 491.52}, {"id": "c013_f000063", "text": "\"And no wonder we couldn't find Flamel in that Study of Recent Developments in Wizardry,\" said Ron. \"He's not exactly recent if he's six hundred and sixty-five, is he?\"", "begin": 21049.309, "end": 21059.349, "localBegin": 491.52, "localEnd": 501.56}, {"id": "c013_f000064", "text": "The next morning in Defense Against the Dark Arts, while copying down different ways of treating werewolf bites, Harry and Ron were still discussing what they'd do with a Sorcerer's Stone if they had one. It wasn't until Ron said he'd buy his own Quidditch team that Harry remembered about Snape and the coming match.", "begin": 21059.349, "end": 21081.749, "localBegin": 501.56, "localEnd": 523.96}, {"id": "c013_f000065", "text": "\"I'm going to play,\" he told Ron and Hermione. \"If I don't, all the Slytherins will think I'm just too scared to face Snape. I'll show them . . . it'll really wipe the smiles off their faces if we win.\"", "begin": 21081.749, "end": 21095.309, "localBegin": 523.96, "localEnd": 537.52}, {"id": "c013_f000066", "text": "\"Just as long as we're not wiping you off the field,\" said Hermione.", "begin": 21095.309, "end": 21102.629, "localBegin": 537.52, "localEnd": 544.84}, {"id": "c013_f000067", "text": "As the match drew nearer, however, Harry became more and more nervous, whatever he told Ron and Hermione. The rest of the team wasn't too calm, either. The idea of overtaking Slytherin in the House Championship was wonderful, no one had done it for seven years, but would they be allowed to, with such a biased referee?", "begin": 21102.629, "end": 21121.549, "localBegin": 544.84, "localEnd": 563.76}, {"id": "c013_f000068", "text": "Harry didn't know whether he was imagining it or not, but he seemed to keep running into Snape wherever he went. At times, he even wondered whether Snape was following him, trying to catch him on his own. Potions lessons were turning into a sort of weekly torture, Snape was so horrible to Harry. Could Snape possibly know they'd found out about the Sorcerer's Stone? Harry didn't see how he could - yet he sometimes had the horrible feeling that Snape could read minds.", "begin": 21121.549, "end": 21153.589, "localBegin": 563.76, "localEnd": 595.8}, {"id": "c013_f000069", "text": "Harry knew, when they wished him good luck outside the locker rooms the next afternoon, that Ron and Hermione were wondering whether they'd ever see him alive again. This wasn't what you'd call comforting. Harry hardly heard a word of Wood's pep talk as he pulled on his Quidditch robes and picked up his Nimbus Two Thousand.", "begin": 21153.589, "end": 21172.509, "localBegin": 595.8, "localEnd": 614.72}, {"id": "c013_f000070", "text": "Ron and Hermione, meanwhile, had found a place in the stands next to Neville, who couldn't understand why they looked so grim and worried, or why they had both brought their wands to the match. Little did Harry know that Ron and Hermione had been secretly practicing the Leg-Locker Curse. They'd gotten the idea from Malfoy using it on Neville, and were ready to use it on Snape if he showed any sign of wanting to hurt Harry.", "begin": 21172.509, "end": 21195.309, "localBegin": 614.72, "localEnd": 637.52}, {"id": "c013_f000071", "text": "\"Now, don't forget, it's Locomotor Mortis,\" Hermione muttered as Ron slipped his wand up his sleeve.", "begin": 21195.309, "end": 21201.989, "localBegin": 637.52, "localEnd": 644.2}, {"id": "c013_f000072", "text": "\"I know,\" Ron snapped. \"Don't nag.\"", "begin": 21201.989, "end": 21205.029, "localBegin": 644.2, "localEnd": 647.24}, {"id": "c013_f000073", "text": "Back in the locker room, Wood had taken Harry aside.", "begin": 21205.029, "end": 21208.789, "localBegin": 647.24, "localEnd": 651.0}, {"id": "c013_f000074", "text": "\"Don't want to pressure you, Potter, but if we ever need an early capture of the Snitch it's now. Finish the game before Snape can favor Hufflepuff too much.\"", "begin": 21208.789, "end": 21218.789, "localBegin": 651.0, "localEnd": 661.0}, {"id": "c013_f000075", "text": "\"The whole school's out there!\" said Fred Weasley, peering out of the door. \"Even - blimey - Dumbledore's come to watch!\"", "begin": 21218.789, "end": 21227.549, "localBegin": 661.0, "localEnd": 669.76}, {"id": "c013_f000076", "text": "Harry's heart did a somersault.", "begin": 21227.549, "end": 21230.069, "localBegin": 669.76, "localEnd": 672.28}, {"id": "c013_f000077", "text": "\"Dumbledore?\" he said, dashing to the door to make sure. Fred was right. There was no mistaking that silver beard.", "begin": 21230.069, "end": 21237.629, "localBegin": 672.28, "localEnd": 679.84}, {"id": "c013_f000078", "text": "Harry could have laughed out loud with relief. He was safe. There was simply no way that Snape would dare to try to hurt him if Dumbledore was watching.", "begin": 21237.629, "end": 21245.869, "localBegin": 679.84, "localEnd": 688.08}, {"id": "c013_f000079", "text": "Perhaps that was why Snape was looking so angry as the teams marched onto the field, something that Ron noticed, too.", "begin": 21245.869, "end": 21252.869, "localBegin": 688.08, "localEnd": 695.08}, {"id": "c013_f000080", "text": "\"I've never seen Snape look so mean,\" he told Hermione. \"Look - they're off. Ouch!\"", "begin": 21252.869, "end": 21260.349, "localBegin": 695.08, "localEnd": 702.56}, {"id": "c013_f000081", "text": "Someone had poked Ron in the back of the head. It was Malfoy.", "begin": 21260.349, "end": 21263.389, "localBegin": 702.56, "localEnd": 705.6}, {"id": "c013_f000082", "text": "\"Oh, sorry, Weasley, didn't see you there.\"", "begin": 21263.389, "end": 21266.989, "localBegin": 705.6, "localEnd": 709.2}, {"id": "c013_f000083", "text": "Malfoy grinned broadly at Crabbe and Goyle.", "begin": 21266.989, "end": 21270.029, "localBegin": 709.2, "localEnd": 712.24}, {"id": "c013_f000084", "text": "\"Wonder how long Potter's going to stay on his broom this time? Anyone want a bet? What about you, Weasley?\"", "begin": 21270.029, "end": 21278.509, "localBegin": 712.24, "localEnd": 720.72}, {"id": "c013_f000085", "text": "Ron didn't answer; Snape had just awarded Hufflepuff a penalty because George Weasley had hit a Bludger at him. Hermione, who had all her fingers crossed in her lap, was squinting fixedly at Harry, who was circling the game like a hawk, looking for the Snitch.", "begin": 21278.509, "end": 21293.069, "localBegin": 720.72, "localEnd": 735.28}, {"id": "c013_f000086", "text": "\"You know how I think they choose people for the Gryffindor team?\" said Malfoy loudly a few minutes later, as Snape awarded Hufflepuff another penalty for no reason at all. \"It's people they feel sorry for. See, there's Potter, who's got no parents, then there's the Weasleys, who've got no money - you should be on the team, Longbottom, you've got no brains.\"", "begin": 21293.069, "end": 21316.989, "localBegin": 735.28, "localEnd": 759.2}, {"id": "c013_f000087", "text": "Neville went bright red but turned in his seat to face Malfoy.", "begin": 21316.989, "end": 21320.549, "localBegin": 759.2, "localEnd": 762.76}, {"id": "c013_f000088", "text": "\"I'm worth twelve of you, Malfoy,\" he stammered.", "begin": 21320.549, "end": 21326.629, "localBegin": 762.76, "localEnd": 768.84}, {"id": "c013_f000089", "text": "Malfoy, Crabbe, and Goyle howled with laughter, but Ron, still not daring to take his eyes from the game, said, \"You tell him, Neville.\"", "begin": 21326.629, "end": 21334.909, "localBegin": 768.84, "localEnd": 777.12}, {"id": "c013_f000090", "text": "\"Longbottom, if brains were gold you'd be poorer than Weasley, and that's saying something.\"", "begin": 21334.909, "end": 21342.509, "localBegin": 777.12, "localEnd": 784.72}, {"id": "c013_f000091", "text": "Ron's nerves were already stretched to the breaking point with anxiety about Harry.", "begin": 21342.509, "end": 21346.509, "localBegin": 784.72, "localEnd": 788.72}, {"id": "c013_f000092", "text": "\"I'm warning you, Malfoy - one more word - \"", "begin": 21346.509, "end": 21349.269, "localBegin": 788.72, "localEnd": 791.48}, {"id": "c013_f000093", "text": "\"Ron!\" said Hermione suddenly, \"Harry - !\"", "begin": 21349.269, "end": 21352.229, "localBegin": 791.48, "localEnd": 794.44}, {"id": "c013_f000094", "text": "\"What? Where?\"", "begin": 21352.229, "end": 21354.549, "localBegin": 794.44, "localEnd": 796.76}, {"id": "c013_f000095", "text": "Harry had suddenly gone into a spectacular dive, which drew gasps and cheers from the crowd. Hermione stood up, her crossed fingers in her mouth, as Harry streaked toward the ground like a bullet.", "begin": 21354.549, "end": 21365.189, "localBegin": 796.76, "localEnd": 807.4}, {"id": "c013_f000096", "text": "\"You're in luck, Weasley, Potter's obviously spotted some money on the ground!\" said Malfoy.", "begin": 21365.189, "end": 21371.829, "localBegin": 807.4, "localEnd": 814.04}, {"id": "c013_f000097", "text": "Ron snapped. Before Malfoy knew what was happening, Ron was on top of him, wrestling him to the ground. Neville hesitated, then clambered over the back of his seat to help.", "begin": 21371.829, "end": 21380.709, "localBegin": 814.04, "localEnd": 822.92}, {"id": "c013_f000098", "text": "\"Come on, Harry!\" Hermione screamed, leaping onto her seat to watch as Harry sped straight at Snape - she didn't even notice Malfoy and Ron rolling around under her seat, or the scuffles and yelps coming from the whirl of fists that was Neville, Crabbe, and Goyle.", "begin": 21380.709, "end": 21397.309, "localBegin": 822.92, "localEnd": 839.52}, {"id": "c013_f000099", "text": "Up in the air, Snape turned on his broomstick just in time to see something scarlet shoot past him, missing him by inches - the next second, Harry had pulled out of the dive, his arm raised in triumph, the Snitch clasped in his hand.", "begin": 21397.309, "end": 21411.109, "localBegin": 839.52, "localEnd": 853.32}, {"id": "c013_f000100", "text": "The stands erupted; it had to be a record, no one could ever remember the Snitch being caught so quickly.", "begin": 21411.109, "end": 21418.189, "localBegin": 853.32, "localEnd": 860.4}, {"id": "c013_f000101", "text": "\"Ron! Ron! Where are you? The game's over! Harry's won! We've won! Gryffindor is in the lead!\" shrieked Hermione, dancing up and down on her seat and hugging Parvati Patil in the row in front.", "begin": 21418.189, "end": 21431.429, "localBegin": 860.4, "localEnd": 873.64}, {"id": "c013_f000102", "text": "Harry jumped off his broom, a foot from the ground. He couldn't believe it. He'd done it - the game was over; it had barely lasted five minutes. As Gryffindors came spilling onto the field, he saw Snape land nearby, white-faced and tight-lipped - then Harry felt a hand on his shoulder and looked up into Dumbledore's smiling face.", "begin": 21431.429, "end": 21453.189, "localBegin": 873.64, "localEnd": 895.4}, {"id": "c013_f000103", "text": "\"Well done,\" said Dumbledore quietly, so that only Harry could hear. \"Nice to see you haven't been brooding about that mirror . . . been keeping busy . . . excellent . . .\"", "begin": 21453.189, "end": 21466.749, "localBegin": 895.4, "localEnd": 908.96}, {"id": "c013_f000104", "text": "Snape spat bitterly on the ground.", "begin": 21466.749, "end": 21470.509, "localBegin": 908.96, "localEnd": 912.72}, {"id": "c013_f000105", "text": "Harry left the locker room alone some time later, to take his Nimbus Two Thousand back to the broomshed. He couldn't ever remember feeling happier. He'd really done something to be proud of now - no one could say he was just a famous name any more. The evening air had never smelled so sweet. He walked over the damp grass, reliving the last hour in his head, which was a happy blur: Gryffindors running to lift him onto their shoulders; Ron and Hermione in the distance, jumping up and down, Ron cheering through a heavy nosebleed.", "begin": 21470.509, "end": 21504.629, "localBegin": 912.72, "localEnd": 946.84}, {"id": "c013_f000106", "text": "Harry had reached the shed. He leaned against the wooden door and looked up at Hogwarts, with its windows glowing red in the setting sun. Gryffindor in the lead. He'd done it, he'd shown Snape. . . .", "begin": 21504.629, "end": 21517.829, "localBegin": 946.84, "localEnd": 960.04}, {"id": "c013_f000107", "text": "And speaking of Snape . . .", "begin": 21517.829, "end": 21519.669, "localBegin": 960.04, "localEnd": 961.88}, {"id": "c013_f000108", "text": "A hooded figure came swiftly down the front steps of the castle. Clearly not wanting to be seen, it walked as fast as possible toward the forbidden forest. Harry's victory faded from his mind as he watched. He recognized the figure's prowling walk. Snape, sneaking into the forest while everyone else was at dinner what was going on?", "begin": 21519.669, "end": 21541.109, "localBegin": 961.88, "localEnd": 983.32}, {"id": "c013_f000109", "text": "Harry jumped back on his Nimbus Two Thousand and took off. Gliding silently over the castle he saw Snape enter the forest at a run. He followed.", "begin": 21541.109, "end": 21550.749, "localBegin": 983.32, "localEnd": 992.96}, {"id": "c013_f000110", "text": "The trees were so thick he couldn't see where Snape had gone. He flew in circles, lower and lower, brushing the top branches of trees until he heard voices. He glided toward them and landed noiselessly in a towering beech tree.", "begin": 21550.749, "end": 21566.349, "localBegin": 992.96, "localEnd": 1008.56}, {"id": "c013_f000111", "text": "He climbed carefully along one of the branches, holding tight to his broomstick, trying to see through the leaves.", "begin": 21566.349, "end": 21573.429, "localBegin": 1008.56, "localEnd": 1015.64}, {"id": "c013_f000112", "text": "Below, in a shadowy clearing, stood Snape, but he wasn't alone. Quirrell was there, too. Harry couldn't make out the look on his face, but he was stuttering worse than ever. Harry strained to catch what they were saying.", "begin": 21573.429, "end": 21587.949, "localBegin": 1015.64, "localEnd": 1030.16}, {"id": "c013_f000113", "text": "\". . . d-don't know why you wanted t-t-to meet here of all p-places, Severus . . .\"", "begin": 21587.949, "end": 21594.549, "localBegin": 1030.16, "localEnd": 1036.76}, {"id": "c013_f000114", "text": "\"Oh, I thought we'd keep this private,\" said Snape, his voice icy. \"Students", "begin": 21594.549, "end": 21601.629, "localBegin": 1036.76, "localEnd": 1043.84}, {"id": "c013_f000115", "text": "aren't supposed to know about the Sorcerer's Stone, after all.\"", "begin": 21601.629, "end": 21605.029, "localBegin": 1043.84, "localEnd": 1047.24}, {"id": "c013_f000116", "text": "Harry leaned forward. Quirrell was mumbling something. Snape interrupted him.", "begin": 21605.029, "end": 21610.589, "localBegin": 1047.24, "localEnd": 1052.8}, {"id": "c013_f000117", "text": "\"Have you found out how to get past that beast of Hagrid's yet?\"", "begin": 21610.589, "end": 21614.589, "localBegin": 1052.8, "localEnd": 1056.8}, {"id": "c013_f000118", "text": "\"B-b-but Severus, I - \"", "begin": 21614.589, "end": 21617.189, "localBegin": 1056.8, "localEnd": 1059.4}, {"id": "c013_f000119", "text": "\"You don't want me as your enemy, Quirrell,\" said Snape, taking a step toward him.", "begin": 21617.189, "end": 21622.989, "localBegin": 1059.4, "localEnd": 1065.2}, {"id": "c013_f000120", "text": "\"I-I don't know what you - \"", "begin": 21622.989, "end": 21624.309, "localBegin": 1065.2, "localEnd": 1066.52}, {"id": "c013_f000121", "text": "\"You know perfectly well what I mean.\"", "begin": 21624.309, "end": 21629.349, "localBegin": 1066.52, "localEnd": 1071.56}, {"id": "c013_f000122", "text": "An owl hooted loudly, and Harry nearly fell out of the tree. He steadied himself in time to hear Snape say, \" - your little bit of hocus-pocus. I'm waiting.\"", "begin": 21629.349, "end": 21639.709, "localBegin": 1071.56, "localEnd": 1081.92}, {"id": "c013_f000123", "text": "\"B-but I d-d-don't - \"", "begin": 21639.709, "end": 21642.149, "localBegin": 1081.92, "localEnd": 1084.36}, {"id": "c013_f000124", "text": "\"Very well,\" Snape cut in. \"We'll have another little chat soon, when you've had time to think things over and decided where your loyalties lie.\"", "begin": 21642.149, "end": 21651.989, "localBegin": 1084.36, "localEnd": 1094.2}, {"id": "c013_f000125", "text": "He threw his cloak over his head and strode out of the clearing. It was almost dark now, but Harry could see Quirrell, standing quite still as though he was petrified.", "begin": 21651.989, "end": 21664.389, "localBegin": 1094.2, "localEnd": 1106.6}, {"id": "c013_f000126", "text": "\"Harry, where have you been?\" Hermione squeaked.", "begin": 21664.389, "end": 21671.029, "localBegin": 1106.6, "localEnd": 1113.24}, {"id": "c013_f000127", "text": "\"We won! You won! We won!\" shouted Ron, thumping Harry on the back. \"And I gave Malfoy a black eye, and Neville tried to take on Crabbe and Goyle singlehanded! He's still out cold but Madam Pomfrey says he'll be all right - talk about showing Slytherin! Everyone's waiting for you in the common room, we're having a party, Fred and George stole some cakes and stuff from the kitchens.\"", "begin": 21671.029, "end": 21694.789, "localBegin": 1113.24, "localEnd": 1137.0}, {"id": "c013_f000128", "text": "\"Never mind that now,\" said Harry breathlessly. \"Let's find an empty room, you wait 'til you hear this. . . .\"", "begin": 21694.789, "end": 21702.029, "localBegin": 1137.0, "localEnd": 1144.24}, {"id": "c013_f000129", "text": "He made sure Peeves wasn't inside before shutting the door behind them, then he told them what he'd seen and heard.", "begin": 21702.029, "end": 21709.389, "localBegin": 1144.24, "localEnd": 1151.6}, {"id": "c013_f000130", "text": "\"So we were right, it is the Sorcerer's Stone, and Snape's trying to force Quirrell to help him get it. He asked if he knew how to get past Fluffy - and he said something about Quirrell's 'hocus-pocus' - I reckon there are other things", "begin": 21709.389, "end": 21723.509, "localBegin": 1151.6, "localEnd": 1165.72}, {"id": "c013_f000131", "text": "guarding the stone apart from Fluffy, loads of enchantments, probably, and Quirrell would have done some anti-Dark Arts spell that Snape needs to break through - \"", "begin": 21723.509, "end": 21731.909, "localBegin": 1165.72, "localEnd": 1174.12}, {"id": "c013_f000132", "text": "\"So you mean the Stone's only safe as long as Quirrell stands up to Snape?\" said Hermione in alarm.", "begin": 21731.909, "end": 21738.949, "localBegin": 1174.12, "localEnd": 1181.16}, {"id": "c013_f000133", "text": "\"It'll be gone by next Tuesday,\" said Ron.", "begin": 21738.949, "end": 21745.069, "localBegin": 1181.16, "localEnd": 1187.28}]}, {"kind": "chapter", "number": 14, "title": "Norbert the Norwegian Ridgeback", "audio": "../Harry Potter and the Sorcerer's Stone, Book 1 (Unabridged)/014 - Harry Potter and the Sorcerer's Stone, Book 1 (Unabridged).mp3", "start": 21745.072, "end": 23020.823, "duration": 1275.751, "paragraphs": [{"id": "c014_f000001", "text": "Chapter Fourteen. Norbert the Norwegian Ridgeback.", "begin": 21745.072, "end": 21750.392, "localBegin": 0.0, "localEnd": 5.32}, {"id": "c014_f000002", "text": "Quirrell, however, must have been braver than they'd thought. In the weeks that followed he did seem to be getting paler and thinner, but it didn't look as though he'd cracked yet.", "begin": 21750.392, "end": 21759.992, "localBegin": 5.32, "localEnd": 14.92}, {"id": "c014_f000003", "text": "Every time they passed the third-floor corridor, Harry, Ron, and Hermione would press their ears to the door to check that Fluffy was still growling inside. Snape was sweeping about in his usual bad temper, which surely meant that the Stone was still safe. Whenever Harry passed Quirrell these days he gave him an encouraging sort of smile, and Ron had started telling people off for laughing at Quirrell's stutter.", "begin": 21759.992, "end": 21784.672, "localBegin": 14.92, "localEnd": 39.6}, {"id": "c014_f000004", "text": "Hermione, however, had more on her mind than the Sorcerer's Stone. She had started drawing up study schedules and color-coding all her notes. Harry and Ron wouldn't have minded, but she kept nagging them to do the same.", "begin": 21784.672, "end": 21796.272, "localBegin": 39.6, "localEnd": 51.2}, {"id": "c014_f000005", "text": "\"Hermione, the exams are ages away.\"", "begin": 21796.272, "end": 21799.632, "localBegin": 51.2, "localEnd": 54.56}, {"id": "c014_f000006", "text": "\"Ten weeks,\" Hermione snapped. \"That's not ages, that's like a second to Nicolas Flamel.\"", "begin": 21799.632, "end": 21805.992, "localBegin": 54.56, "localEnd": 60.92}, {"id": "c014_f000007", "text": "\"But we're not six hundred years old,\" Ron reminded her. \"Anyway, what are you studying for, you already know it all.\"", "begin": 21805.992, "end": 21813.352, "localBegin": 60.92, "localEnd": 68.28}, {"id": "c014_f000008", "text": "\"What am I studying for? Are you crazy? You realize we need to pass these exams to get into the second year? They're very important, I should have started studying a month ago, I don't know what's gotten into me. . . .\"", "begin": 21813.352, "end": 21827.392, "localBegin": 68.28, "localEnd": 82.32}, {"id": "c014_f000009", "text": "Unfortunately, the teachers seemed to be thinking along the same lines as Hermione. They piled so much homework on them that the Easter holidays weren't nearly as much fun as the Christmas ones. It was hard to relax with Hermione next to you reciting the twelve uses of dragon's blood or practicing wand movements. Moaning and yawning, Harry and Ron spent most of their free time in the library with her, trying to get through all their extra work.", "begin": 21827.392, "end": 21852.592, "localBegin": 82.32, "localEnd": 107.52}, {"id": "c014_f000010", "text": "\"I'll never remember this,\" Ron burst out one afternoon, throwing down his quill and looking longingly out of the library window. It was the first really fine day they'd had in months. The sky was a clear, forget-me-not blue, and there was a feeling in the air of summer coming.", "begin": 21852.592, "end": 21870.312, "localBegin": 107.52, "localEnd": 125.24}, {"id": "c014_f000011", "text": "Harry, who was looking up \"Dittany\" in One Thousand Magical Herbs and Fungi, didn't look up until he heard Ron say, \"Hagrid! What are you doing in the library?\"", "begin": 21870.312, "end": 21882.112, "localBegin": 125.24, "localEnd": 137.04}, {"id": "c014_f000012", "text": "Hagrid shuffled into view, hiding something behind his back. He looked very out of place in his moleskin overcoat.", "begin": 21882.112, "end": 21888.672, "localBegin": 137.04, "localEnd": 143.6}, {"id": "c014_f000013", "text": "\"Jus' lookin',\" he said, in a shifty voice that got their interest at once. \"An' what're you lot up ter?\" He looked suddenly suspicious. \"Yer not still lookin' fer Nicolas Flamel, are yeh?\"", "begin": 21888.672, "end": 21902.192, "localBegin": 143.6, "localEnd": 157.12}, {"id": "c014_f000014", "text": "\"Oh, we found out who he is ages ago,\" said Ron impressively. \"And we know what that dog's guarding, it's a Sorcerer's St - \"", "begin": 21902.192, "end": 21911.472, "localBegin": 157.12, "localEnd": 166.4}, {"id": "c014_f000015", "text": "\"Shhhh!\" Hagrid looked around quickly to see if anyone was listening. \"Don' go shoutin' about it, what's the matter with yeh?\"", "begin": 21911.472, "end": 21920.672, "localBegin": 166.4, "localEnd": 175.6}, {"id": "c014_f000016", "text": "\"There are a few things we wanted to ask you, as a matter of fact,\" said Harry, \"about what's guarding the Stone apart from Fluffy - \"", "begin": 21920.672, "end": 21929.712, "localBegin": 175.6, "localEnd": 184.64}, {"id": "c014_f000017", "text": "\"SHHHH!\" said Hagrid again. \"Listen - come an' see me later, I'm not promisin' I'll tell yeh anythin', mind, but don' go rabbitin' about it in here, students aren' s'pposed ter know. They'll think I've told yeh - \"", "begin": 21929.712, "end": 21943.752, "localBegin": 184.64, "localEnd": 198.68}, {"id": "c014_f000018", "text": "\"See you later, then,\" said Harry.", "begin": 21943.752, "end": 21947.272, "localBegin": 198.68, "localEnd": 202.2}, {"id": "c014_f000019", "text": "Hagrid shuffled off.", "begin": 21947.272, "end": 21948.352, "localBegin": 202.2, "localEnd": 203.28}, {"id": "c014_f000020", "text": "\"What was he hiding behind his back?\" said Hermione thoughtfully.", "begin": 21948.352, "end": 21953.032, "localBegin": 203.28, "localEnd": 207.96}, {"id": "c014_f000021", "text": "\"Do you think it had anything to do with the Stone?\"", "begin": 21953.032, "end": 21955.432, "localBegin": 207.96, "localEnd": 210.36}, {"id": "c014_f000022", "text": "\"I'm going to see what section he was in,\" said Ron, who'd had enough of working. He came back a minute later with a pile of books in his arms and slammed them down on the table.", "begin": 21955.432, "end": 21965.312, "localBegin": 210.36, "localEnd": 220.24}, {"id": "c014_f000023", "text": "\"Dragons!\" he whispered. \"Hagrid was looking up stuff about dragons! Look at these: Dragon Species of Great Britain and Ireland; From Egg to Inferno, A Dragon Keeper's Guide.\"", "begin": 21965.312, "end": 21977.072, "localBegin": 220.24, "localEnd": 232.0}, {"id": "c014_f000024", "text": "\"Hagrid's always wanted a dragon, he told me so the first time I ever met him,\" said Harry.", "begin": 21977.072, "end": 21982.872, "localBegin": 232.0, "localEnd": 237.8}, {"id": "c014_f000025", "text": "\"But it's against our laws,\" said Ron. \"Dragon breeding was outlawed by the Warlocks' Convention of 1709, everyone knows that. It's hard to stop Muggles from noticing us if we're keeping dragons in the back garden - anyway, you can't tame dragons, it's dangerous. You should see the burns Charlie's got off wild ones in Romania.\"", "begin": 21982.872, "end": 22003.992, "localBegin": 237.8, "localEnd": 258.92}, {"id": "c014_f000026", "text": "\"But there aren't wild dragons in Britain?\" said Harry.", "begin": 22003.992, "end": 22008.592, "localBegin": 258.92, "localEnd": 263.52}, {"id": "c014_f000027", "text": "\"Of course there are,\" said Ron. \"Common Welsh Green and Hebridean Blacks. The Ministry of Magic has a job hushing them up, I can tell you. Our kind have to keep putting spells on Muggles who've spotted them, to make them forget.\"", "begin": 22008.592, "end": 22022.952, "localBegin": 263.52, "localEnd": 277.88}, {"id": "c014_f000028", "text": "\"So what on earth's Hagrid up to?\" said Hermione.", "begin": 22022.952, "end": 22030.032, "localBegin": 277.88, "localEnd": 284.96}, {"id": "c014_f000029", "text": "When they knocked on the door of the gamekeeper's hut an hour later, they were surprised to see that all the curtains were closed. Hagrid called \"Who is it?\" before he let them in, and then shut the door quickly behind them.", "begin": 22030.032, "end": 22043.472, "localBegin": 284.96, "localEnd": 298.4}, {"id": "c014_f000030", "text": "It was stifling hot inside. Even though it was such a warm day, there was a blazing fire in the grate. Hagrid made them tea and offered them stoat sandwiches, which they refused.", "begin": 22043.472, "end": 22054.152, "localBegin": 298.4, "localEnd": 309.08}, {"id": "c014_f000031", "text": "\"So - yeh wanted to ask me somethin'?\"", "begin": 22054.152, "end": 22057.392, "localBegin": 309.08, "localEnd": 312.32}, {"id": "c014_f000032", "text": "\"Yes,\" said Harry. There was no point beating around the bush. \"We were wondering if you could tell us what's guarding the Sorcerer's Stone apart from Fluffy.\"", "begin": 22057.392, "end": 22069.352, "localBegin": 312.32, "localEnd": 324.28}, {"id": "c014_f000033", "text": "Hagrid frowned at him.", "begin": 22069.352, "end": 22070.632, "localBegin": 324.28, "localEnd": 325.56}, {"id": "c014_f000034", "text": "\"O' course I can't,\" he said. \"Number one, I don' know meself. Number two, yeh know too much already, so I wouldn' tell yeh if I could. That Stone's here fer a good reason. It was almost stolen outta Gringotts - I s'ppose yeh've worked that out an' all? Beats me how yeh even know abou' Fluffy.\"", "begin": 22070.632, "end": 22090.872, "localBegin": 325.56, "localEnd": 345.8}, {"id": "c014_f000035", "text": "\"Oh, come on, Hagrid, you might not want to tell us, but you do know, you know everything that goes on round here,\" said Hermione in a warm, flattering voice. Hagrid's beard twitched and they could tell he was smiling. \"We only wondered who had done the guarding, really.\" Hermione went on. \"We wondered who Dumbledore had trusted enough to help him, apart from you.\"", "begin": 22090.872, "end": 22120.072, "localBegin": 345.8, "localEnd": 375.0}, {"id": "c014_f000036", "text": "Hagrid's chest swelled at these last words. Harry and Ron beamed at Hermione.", "begin": 22120.072, "end": 22125.472, "localBegin": 375.0, "localEnd": 380.4}, {"id": "c014_f000037", "text": "\"Well, I don' s'pose it could hurt ter tell yeh that . . . let's see . . . he borrowed Fluffy from me . . . then some o' the teachers did enchantments . . . Professor Sprout - Professor Flitwick - Professor McGonagall - \" he ticked them off on his fingers, \"Professor Quirrell - an' Dumbledore himself did somethin', o' course. Hang on, I've forgotten someone. Oh yeah, Professor Snape.\"", "begin": 22125.472, "end": 22150.872, "localBegin": 380.4, "localEnd": 405.8}, {"id": "c014_f000038", "text": "\"Snape?\"", "begin": 22150.872, "end": 22152.432, "localBegin": 405.8, "localEnd": 407.36}, {"id": "c014_f000039", "text": "\"Yeah - yer not still on abou' that, are yeh? Look, Snape helped protect the Stone, he's not about ter steal it.\"", "begin": 22152.432, "end": 22161.632, "localBegin": 407.36, "localEnd": 416.56}, {"id": "c014_f000040", "text": "Harry knew Ron and Hermione were thinking the same as he was. If Snape had been in on protecting the Stone, it must have been easy to find out how the other teachers had guarded it. He probably knew everything - except, it seemed, Quirrell's spell and how to get past Fluffy.", "begin": 22161.632, "end": 22176.472, "localBegin": 416.56, "localEnd": 431.4}, {"id": "c014_f000041", "text": "\"You're the only one who knows how to get past Fluffy, aren't you, Hagrid?\" said Harry anxiously. \"And you wouldn't tell anyone, would you? Not even one of the teachers?\"", "begin": 22176.472, "end": 22185.552, "localBegin": 431.4, "localEnd": 440.48}, {"id": "c014_f000042", "text": "\"Not a soul knows except me an' Dumbledore,\" said Hagrid proudly.", "begin": 22185.552, "end": 22190.392, "localBegin": 440.48, "localEnd": 445.32}, {"id": "c014_f000043", "text": "\"Well, that's something,\" Harry muttered to the others. \"Hagrid, can we have a window open? I'm boiling.\"", "begin": 22190.392, "end": 22197.352, "localBegin": 445.32, "localEnd": 452.28}, {"id": "c014_f000044", "text": "\"Can't, Harry, sorry,\" said Hagrid. Harry noticed him glance at the fire. Harry looked at it, too.", "begin": 22197.352, "end": 22204.472, "localBegin": 452.28, "localEnd": 459.4}, {"id": "c014_f000045", "text": "\"Hagrid - what's that?\"", "begin": 22204.472, "end": 22208.112, "localBegin": 459.4, "localEnd": 463.04}, {"id": "c014_f000046", "text": "But he already knew what it was. In the very heart of the fire, underneath the kettle, was a huge, black egg.", "begin": 22208.112, "end": 22215.712, "localBegin": 463.04, "localEnd": 470.64}, {"id": "c014_f000047", "text": "\"Ah,\" said Hagrid, fiddling nervously with his beard, \"That's - er . . .\"", "begin": 22215.712, "end": 22221.392, "localBegin": 470.64, "localEnd": 476.32}, {"id": "c014_f000048", "text": "\"Where did you get it, Hagrid?\" said Ron, crouching over the fire to get a closer look at the egg. \"It must've cost you a fortune.\"", "begin": 22221.392, "end": 22228.992, "localBegin": 476.32, "localEnd": 483.92}, {"id": "c014_f000049", "text": "\"Won it,\" said Hagrid. \"Las' night. I was down in the village havin' a few drinks an' got into a game o' cards with a stranger. Think he was quite glad ter get rid of it, ter be honest.\"", "begin": 22228.992, "end": 22240.232, "localBegin": 483.92, "localEnd": 495.16}, {"id": "c014_f000050", "text": "\"But what are you going to do with it when it's hatched?\" said Hermione.", "begin": 22240.232, "end": 22244.792, "localBegin": 495.16, "localEnd": 499.72}, {"id": "c014_f000051", "text": "\"Well, I've bin doin' some readin',\" said Hagrid, pulling a large book from under his pillow. \"Got this outta the library - Dragon Breeding for Pleasure and Profit - it's a bit outta date, o' course, but it's all in here. Keep the egg in the fire, 'cause their mothers breathe on 'em, see, an' when it hatches, feed it on a bucket o' brandy mixed with chicken blood every half hour. An' see here - how ter recognize diff'rent eggs - what I got there's a Norwegian Ridgeback. They're rare, them.\"", "begin": 22244.792, "end": 22278.352, "localBegin": 499.72, "localEnd": 533.28}, {"id": "c014_f000052", "text": "He looked very pleased with himself, but Hermione didn't.", "begin": 22278.352, "end": 22282.032, "localBegin": 533.28, "localEnd": 536.96}, {"id": "c014_f000053", "text": "\"Hagrid, you live in a wooden house,\" she said.", "begin": 22282.032, "end": 22286.792, "localBegin": 536.96, "localEnd": 541.72}, {"id": "c014_f000054", "text": "But Hagrid wasn't listening. He was humming merrily as he stoked the fire.", "begin": 22286.792, "end": 22292.992, "localBegin": 541.72, "localEnd": 547.92}, {"id": "c014_f000055", "text": "So now they had something else to worry about: what might happen to Hagrid if anyone found out he was hiding an illegal dragon in his hut.", "begin": 22292.992, "end": 22300.752, "localBegin": 547.92, "localEnd": 555.68}, {"id": "c014_f000056", "text": "\"Wonder what it's like to have a peaceful life,\" Ron sighed, as evening after evening they struggled through all the extra homework they were getting. Hermione had now started making study schedules for Harry and Ron, too. It was driving them nuts.", "begin": 22300.752, "end": 22317.512, "localBegin": 555.68, "localEnd": 572.44}, {"id": "c014_f000057", "text": "Then, one breakfast time, Hedwig brought Harry another note from Hagrid. He had written only two words: It's hatching.", "begin": 22317.512, "end": 22326.392, "localBegin": 572.44, "localEnd": 581.32}, {"id": "c014_f000058", "text": "Ron wanted to skip Herbology and go straight down to the hut. Hermione wouldn't hear of it.", "begin": 22326.392, "end": 22330.712, "localBegin": 581.32, "localEnd": 585.64}, {"id": "c014_f000059", "text": "\"Hermione, how many times in our lives are we going to see a dragon hatching?\"", "begin": 22330.712, "end": 22335.432, "localBegin": 585.64, "localEnd": 590.36}, {"id": "c014_f000060", "text": "\"We've got lessons, we'll get into trouble, and that's nothing to what Hagrid's going to be in when someone finds out what he's doing - \"", "begin": 22335.432, "end": 22342.752, "localBegin": 590.36, "localEnd": 597.68}, {"id": "c014_f000061", "text": "\"Shut up!\" Harry whispered.", "begin": 22342.752, "end": 22346.152, "localBegin": 597.68, "localEnd": 601.08}, {"id": "c014_f000062", "text": "Malfoy was only a few feet away and he had stopped dead to listen. How much had he heard? Harry didn't like the look on Malfoy's face at all.", "begin": 22346.152, "end": 22356.032, "localBegin": 601.08, "localEnd": 610.96}, {"id": "c014_f000063", "text": "Ron and Hermione argued all the way to Herbology and in the end, Hermione agreed to run down to Hagrid's with the other two during morning break. When the bell sounded from the castle at the end of their lesson, the three of them dropped their trowels at once and hurried through the grounds to the edge of the forest. Hagrid greeted them, looking flushed and excited.", "begin": 22356.032, "end": 22374.552, "localBegin": 610.96, "localEnd": 629.48}, {"id": "c014_f000064", "text": "\"It's nearly out.\" He ushered them inside.", "begin": 22374.552, "end": 22377.352, "localBegin": 629.48, "localEnd": 632.28}, {"id": "c014_f000065", "text": "The egg was lying on the table. There were deep cracks in it. Something was moving inside; a funny clicking noise was coming from it.", "begin": 22377.352, "end": 22385.992, "localBegin": 632.28, "localEnd": 640.92}, {"id": "c014_f000066", "text": "They all drew their chairs up to the table and watched with bated breath.", "begin": 22385.992, "end": 22392.032, "localBegin": 640.92, "localEnd": 646.96}, {"id": "c014_f000067", "text": "All at once there was a scraping noise and the egg split open. The baby dragon flopped onto the table. It wasn't exactly pretty; Harry thought it looked like a", "begin": 22392.032, "end": 22401.912, "localBegin": 646.96, "localEnd": 656.84}, {"id": "c014_f000068", "text": "crumpled, black umbrella. Its spiny wings were huge compared to its skinny jet body, it had a long snout with wide nostrils, the stubs of horns and bulging, orange eyes.", "begin": 22401.912, "end": 22414.232, "localBegin": 656.84, "localEnd": 669.16}, {"id": "c014_f000069", "text": "It sneezed. A couple of sparks flew out of its snout.", "begin": 22414.232, "end": 22417.432, "localBegin": 669.16, "localEnd": 672.36}, {"id": "c014_f000070", "text": "\"Isn't he beautiful?\" Hagrid murmured. He reached out a hand to stroke the dragon's head. It snapped at his fingers, showing pointed fangs.", "begin": 22417.432, "end": 22427.512, "localBegin": 672.36, "localEnd": 682.44}, {"id": "c014_f000071", "text": "\"Bless him, look, he knows his mummy!\" said Hagrid.", "begin": 22427.512, "end": 22431.552, "localBegin": 682.44, "localEnd": 686.48}, {"id": "c014_f000072", "text": "\"Hagrid,\" said Hermione, \"how fast do Norwegian Ridgebacks grow, exactly?\"", "begin": 22431.552, "end": 22439.312, "localBegin": 686.48, "localEnd": 694.24}, {"id": "c014_f000073", "text": "Hagrid was about to answer when the color suddenly drained from his face - he leapt to his feet and ran to the window.", "begin": 22439.312, "end": 22444.912, "localBegin": 694.24, "localEnd": 699.84}, {"id": "c014_f000074", "text": "\"What's the matter?\"", "begin": 22444.912, "end": 22445.992, "localBegin": 699.84, "localEnd": 700.92}, {"id": "c014_f000075", "text": "\"Someone was lookin' through the gap in the curtains - it's a kid - he's runnin' back up ter the school.\"", "begin": 22445.992, "end": 22452.792, "localBegin": 700.92, "localEnd": 707.72}, {"id": "c014_f000076", "text": "Harry bolted to the door and looked out. Even at a distance there was no mistaking him.", "begin": 22452.792, "end": 22458.032, "localBegin": 707.72, "localEnd": 712.96}, {"id": "c014_f000077", "text": "Malfoy had seen the dragon.", "begin": 22458.032, "end": 22463.592, "localBegin": 712.96, "localEnd": 718.52}, {"id": "c014_f000078", "text": "Something about the smile lurking on Malfoy's face during the next week made Harry, Ron, and Hermione very nervous. They spent most of their free time in Hagrid's darkened hut, trying to reason with him.", "begin": 22463.592, "end": 22475.432, "localBegin": 718.52, "localEnd": 730.36}, {"id": "c014_f000079", "text": "\"Just let him go,\" Harry urged. \"Set him free.\"", "begin": 22475.432, "end": 22479.912, "localBegin": 730.36, "localEnd": 734.84}, {"id": "c014_f000080", "text": "\"I can't,\" said Hagrid. \"He's too little. He'd die.\"", "begin": 22479.912, "end": 22484.592, "localBegin": 734.84, "localEnd": 739.52}, {"id": "c014_f000081", "text": "They looked at the dragon. It had grown three times in length in just a week. Smoke kept furling out of its nostrils. Hagrid hadn't been doing his gamekeeping duties because the dragon was keeping him so busy. There were empty brandy bottles and chicken feathers all over the floor.", "begin": 22484.592, "end": 22500.752, "localBegin": 739.52, "localEnd": 755.68}, {"id": "c014_f000082", "text": "\"I've decided to call him Norbert,\" said Hagrid, looking at the dragon with misty eyes. \"He really knows me now, watch. Norbert! Norbert! Where's Mummy?\"", "begin": 22500.752, "end": 22515.352, "localBegin": 755.68, "localEnd": 770.28}, {"id": "c014_f000083", "text": "\"He's lost his marbles,\" Ron muttered in Harry's ear.", "begin": 22515.352, "end": 22519.632, "localBegin": 770.28, "localEnd": 774.56}, {"id": "c014_f000084", "text": "\"Hagrid,\" said Harry loudly, \"give it two weeks and Norbert's going to be as", "begin": 22519.632, "end": 22524.952, "localBegin": 774.56, "localEnd": 779.88}, {"id": "c014_f000085", "text": "long as your house. Malfoy could go to Dumbledore at any moment.\"", "begin": 22524.952, "end": 22528.832, "localBegin": 779.88, "localEnd": 783.76}, {"id": "c014_f000086", "text": "Hagrid bit his lip.", "begin": 22528.832, "end": 22530.392, "localBegin": 783.76, "localEnd": 785.32}, {"id": "c014_f000087", "text": "\"I - I know I can't keep him forever, but I can't jus' dump him, I can't.\"", "begin": 22530.392, "end": 22537.472, "localBegin": 785.32, "localEnd": 792.4}, {"id": "c014_f000088", "text": "Harry suddenly turned to Ron.", "begin": 22537.472, "end": 22539.552, "localBegin": 792.4, "localEnd": 794.48}, {"id": "c014_f000089", "text": "\"Charlie,\" he said.", "begin": 22539.552, "end": 22541.032, "localBegin": 794.48, "localEnd": 795.96}, {"id": "c014_f000090", "text": "\"You're losing it, too,\" said Ron. \"I'm Ron, remember?\"", "begin": 22541.032, "end": 22544.072, "localBegin": 795.96, "localEnd": 799.0}, {"id": "c014_f000091", "text": "\"No - Charlie - your brother, Charlie. In Romania. Studying dragons. We could send Norbert to him. Charlie can take care of him and then put him back in the wild!\"", "begin": 22544.072, "end": 22554.792, "localBegin": 799.0, "localEnd": 809.72}, {"id": "c014_f000092", "text": "\"Brilliant!\" said Ron. \"How about it, Hagrid?\"", "begin": 22554.792, "end": 22558.352, "localBegin": 809.72, "localEnd": 813.28}, {"id": "c014_f000093", "text": "And in the end, Hagrid agreed that they could send an owl to Charlie to ask him.", "begin": 22558.352, "end": 22566.392, "localBegin": 813.28, "localEnd": 821.32}, {"id": "c014_f000094", "text": "The following week dragged by. Wednesday night found Hermione and Harry sitting alone in the common room, long after everyone else had gone to bed. The clock on the wall had just chimed midnight when the portrait hole burst open. Ron appeared out of nowhere as he pulled off Harry's Invisibility Cloak. He had been down at Hagrid's hut, helping him feed Norbert, who was now eating dead rats by the crate.", "begin": 22566.392, "end": 22589.872, "localBegin": 821.32, "localEnd": 844.8}, {"id": "c014_f000095", "text": "\"It bit me!\" he said, showing them his hand, which was wrapped in a bloody handkerchief. \"I'm not going to be able to hold a quill for a week. I tell you, that dragon's the most horrible animal I've ever met, but the way Hagrid goes on about it, you'd think it was a fluffy little bunny rabbit. When it bit me he told me off for frightening it. And when I left, he was singing it a lullaby.\"", "begin": 22589.872, "end": 22614.232, "localBegin": 844.8, "localEnd": 869.16}, {"id": "c014_f000096", "text": "There was a tap on the dark window.", "begin": 22614.232, "end": 22615.752, "localBegin": 869.16, "localEnd": 870.68}, {"id": "c014_f000097", "text": "\"It's Hedwig!\" said Harry, hurrying to let her in. \"She'll have Charlie's answer!\"", "begin": 22615.752, "end": 22620.712, "localBegin": 870.68, "localEnd": 875.64}, {"id": "c014_f000098", "text": "The three of them put their heads together to read the note.", "begin": 22620.712, "end": 22624.112, "localBegin": 875.64, "localEnd": 879.04}, {"id": "c014_f000099", "text": "Dear Ron,", "begin": 22624.112, "end": 22625.672, "localBegin": 879.04, "localEnd": 880.6}, {"id": "c014_f000100", "text": "How are you? Thanks for the letter - I'd be glad to take the Norwegian", "begin": 22625.672, "end": 22629.392, "localBegin": 880.6, "localEnd": 884.32}, {"id": "c014_f000101", "text": "Ridgeback, but it won't be easy getting him here. I think the best thing", "begin": 22629.392, "end": 22633.272, "localBegin": 884.32, "localEnd": 888.2}, {"id": "c014_f000102", "text": "will be to send him over with some friends of mine who are coming to visit", "begin": 22633.272, "end": 22636.912, "localBegin": 888.2, "localEnd": 891.84}, {"id": "c014_f000103", "text": "me next week. Trouble is, they mustn't be seen carrying an illegal dragon.", "begin": 22636.912, "end": 22641.872, "localBegin": 891.84, "localEnd": 896.8}, {"id": "c014_f000104", "text": "Could you get the Ridgeback up the tallest tower at midnight on", "begin": 22641.872, "end": 22645.192, "localBegin": 896.8, "localEnd": 900.12}, {"id": "c014_f000105", "text": "Saturday? They can meet you there and take him away while it's still dark.", "begin": 22645.192, "end": 22649.952, "localBegin": 900.12, "localEnd": 904.88}, {"id": "c014_f000106", "text": "Send me an answer as soon as possible.", "begin": 22649.952, "end": 22652.712, "localBegin": 904.88, "localEnd": 907.64}, {"id": "c014_f000107", "text": "Love,", "begin": 22652.712, "end": 22653.272, "localBegin": 907.64, "localEnd": 908.2}, {"id": "c014_f000108", "text": "Charlie", "begin": 22653.272, "end": 22653.992, "localBegin": 908.2, "localEnd": 908.92}, {"id": "c014_f000109", "text": "They looked at one another.", "begin": 22653.992, "end": 22656.072, "localBegin": 908.92, "localEnd": 911.0}, {"id": "c014_f000110", "text": "\"We've got the Invisibility Cloak,\" said Harry. \"It shouldn't be too difficult - I think the cloak's big enough to cover two of us and Norbert.\"", "begin": 22656.072, "end": 22663.552, "localBegin": 911.0, "localEnd": 918.48}, {"id": "c014_f000111", "text": "It was a mark of how bad the last week had been that the other two agreed with him. Anything to get rid of Norbert - and Malfoy.", "begin": 22663.552, "end": 22671.672, "localBegin": 918.48, "localEnd": 926.6}, {"id": "c014_f000112", "text": "There was a hitch. By the next morning, Ron's bitten hand had swollen to twice its usual size. He didn't know whether it was safe to go to Madam Pomfrey - would she recognize a dragon bite? By the afternoon, though, he had no choice. The cut had turned a nasty shade of green. It looked as if Norbert's fangs were poisonous.", "begin": 22671.672, "end": 22693.432, "localBegin": 926.6, "localEnd": 948.36}, {"id": "c014_f000113", "text": "Harry and Hermione rushed up to the hospital wing at the end of the day to find Ron in a terrible state in bed.", "begin": 22693.432, "end": 22699.512, "localBegin": 948.36, "localEnd": 954.44}, {"id": "c014_f000114", "text": "\"It's not just my hand,\" he whispered, \"although that feels like it's about to fall off. Malfoy told Madam Pomfrey he wanted to borrow one of my books so he could come and have a good laugh at me. He kept threatening to tell her what really bit me - I've told her it was a dog, but I don't think she believes me - I shouldn't have hit him at the Quidditch match, that's why he's doing this.\"", "begin": 22699.512, "end": 22721.792, "localBegin": 954.44, "localEnd": 976.72}, {"id": "c014_f000115", "text": "Harry and Hermione tried to calm Ron down.", "begin": 22721.792, "end": 22724.912, "localBegin": 976.72, "localEnd": 979.84}, {"id": "c014_f000116", "text": "\"It'll all be over at midnight on Saturday,\" said Hermione, but this didn't soothe Ron at all. On the contrary, he sat bolt upright and broke into a sweat.", "begin": 22724.912, "end": 22734.592, "localBegin": 979.84, "localEnd": 989.52}, {"id": "c014_f000117", "text": "\"Midnight on Saturday!\" he said in a hoarse voice. \"Oh no - oh no - I've just remembered - Charlie's letter was in that book Malfoy took, he's going to know we're getting rid of Norbert.\"", "begin": 22734.592, "end": 22747.432, "localBegin": 989.52, "localEnd": 1002.36}, {"id": "c014_f000118", "text": "Harry and Hermione didn't get a chance to answer. Madam Pomfrey came over at that moment and made them leave, saying Ron needed sleep.", "begin": 22747.432, "end": 22756.752, "localBegin": 1002.36, "localEnd": 1011.68}, {"id": "c014_f000119", "text": "\"It's too late to change the plan now,\" Harry told Hermione. \"We haven't got time to send Charlie another owl, and this could be our only chance to get rid of Norbert. We'll have to risk it. And we have got the Invisibility Cloak, Malfoy doesn't know about that.\"", "begin": 22756.752, "end": 22773.472, "localBegin": 1011.68, "localEnd": 1028.4}, {"id": "c014_f000120", "text": "They found Fang the boarhound sitting outside with a bandaged tail when they went to tell Hagrid, who opened a window to talk to them.", "begin": 22773.472, "end": 22780.872, "localBegin": 1028.4, "localEnd": 1035.8}, {"id": "c014_f000121", "text": "\"I won't let you in,\" he puffed. \"Norbert's at a tricky stage - nothin' I can't handle.\"", "begin": 22780.872, "end": 22786.832, "localBegin": 1035.8, "localEnd": 1041.76}, {"id": "c014_f000122", "text": "When they told him about Charlie's letter, his eyes filled with tears, although that might have been because Norbert had just bitten him on the leg.", "begin": 22786.832, "end": 22795.072, "localBegin": 1041.76, "localEnd": 1050.0}, {"id": "c014_f000123", "text": "\"Aargh! It's all right, he only got my boot - jus' playin' - he's only a baby, after all.\"", "begin": 22795.072, "end": 22802.512, "localBegin": 1050.0, "localEnd": 1057.44}, {"id": "c014_f000124", "text": "The baby banged its tail on the wall, making the windows rattle. Harry and Hermione walked back to the castle feeling Saturday couldn't come quickly enough.", "begin": 22802.512, "end": 22813.312, "localBegin": 1057.44, "localEnd": 1068.24}, {"id": "c014_f000125", "text": "They would have felt sorry for Hagrid when the time came for him to say goodbye to Norbert if they hadn't been so worried about what they had to do. It was a very dark, cloudy night, and they were a bit late arriving at Hagrid's hut because they'd had to wait for Peeves to get out of their way in the entrance hall, where he'd been playing tennis against the wall.", "begin": 22813.312, "end": 22834.632, "localBegin": 1068.24, "localEnd": 1089.56}, {"id": "c014_f000126", "text": "Hagrid had Norbert packed and ready in a large crate.", "begin": 22834.632, "end": 22838.472, "localBegin": 1089.56, "localEnd": 1093.4}, {"id": "c014_f000127", "text": "\"He's got lots o' rats an' some brandy fer the journey,\" said Hagrid in a muffled voice. \"An' I've packed his teddy bear in case he gets lonely.\"", "begin": 22838.472, "end": 22849.232, "localBegin": 1093.4, "localEnd": 1104.16}, {"id": "c014_f000128", "text": "From inside the crate came ripping noises that sounded to Harry as though the teddy was having his head torn off.", "begin": 22849.232, "end": 22856.352, "localBegin": 1104.16, "localEnd": 1111.28}, {"id": "c014_f000129", "text": "\"Bye-bye, Norbert!\" Hagrid sobbed, as Harry and Hermione covered the crate with the Invisibility Cloak and stepped underneath it themselves. \"Mummy will never forget you!\"", "begin": 22856.352, "end": 22869.912, "localBegin": 1111.28, "localEnd": 1124.84}, {"id": "c014_f000130", "text": "How they managed to get the crate back up to the castle, they never knew. Midnight ticked nearer as they heaved Norbert up the marble staircase in the entrance hall and along the dark corridors. Up another staircase, then another even one of Harry's shortcuts didn't make the work much easier.", "begin": 22869.912, "end": 22886.592, "localBegin": 1124.84, "localEnd": 1141.52}, {"id": "c014_f000131", "text": "\"Nearly there!\" Harry panted as they reached the corridor beneath the tallest", "begin": 22886.592, "end": 22891.632, "localBegin": 1141.52, "localEnd": 1146.56}, {"id": "c014_f000132", "text": "tower.", "begin": 22891.632, "end": 22891.992, "localBegin": 1146.56, "localEnd": 1146.92}, {"id": "c014_f000133", "text": "Then a sudden movement ahead of them made them almost drop the crate. Forgetting that they were already invisible, they shrank into the shadows, staring at the dark outlines of two people grappling with each other ten feet away. A lamp flared.", "begin": 22891.992, "end": 22906.352, "localBegin": 1146.92, "localEnd": 1161.28}, {"id": "c014_f000134", "text": "Professor McGonagall, in a tartan bathrobe and a hair net, had Malfoy by the ear.", "begin": 22906.352, "end": 22911.912, "localBegin": 1161.28, "localEnd": 1166.84}, {"id": "c014_f000135", "text": "\"Detention!\" she shouted. \"And twenty points from Slytherin! Wandering around in the middle of the night, how dare you - \"", "begin": 22911.912, "end": 22920.792, "localBegin": 1166.84, "localEnd": 1175.72}, {"id": "c014_f000136", "text": "\"You don't understand, Professor. Harry Potter's coming - he's got a dragon!\"", "begin": 22920.792, "end": 22926.552, "localBegin": 1175.72, "localEnd": 1181.48}, {"id": "c014_f000137", "text": "\"What utter rubbish! How dare you tell such lies! Come on - I shall see Professor Snape about you, Malfoy!\"", "begin": 22926.552, "end": 22934.432, "localBegin": 1181.48, "localEnd": 1189.36}, {"id": "c014_f000138", "text": "The steep spiral staircase up to the top of the tower seemed the easiest thing in the world after that. Not until they'd stepped out into the cold night air did they throw off the Cloak, glad to be able to breathe properly again. Hermione did a sort of jig.", "begin": 22934.432, "end": 22949.432, "localBegin": 1189.36, "localEnd": 1204.36}, {"id": "c014_f000139", "text": "\"Malfoy's got detention! I could sing!\"", "begin": 22949.432, "end": 22953.512, "localBegin": 1204.36, "localEnd": 1208.44}, {"id": "c014_f000140", "text": "\"Don't,\" Harry advised her.", "begin": 22953.512, "end": 22955.152, "localBegin": 1208.44, "localEnd": 1210.08}, {"id": "c014_f000141", "text": "Chuckling about Malfoy, they waited, Norbert thrashing about in his crate. About ten minutes later, four broomsticks came swooping down out of the darkness.", "begin": 22955.152, "end": 22965.512, "localBegin": 1210.08, "localEnd": 1220.44}, {"id": "c014_f000142", "text": "Charlie's friends were a cheery lot. They showed Harry and Hermione the harness they'd rigged up, so they could suspend Norbert between them. They all helped buckle Norbert safely into it and then Harry and Hermione shook hands with the others and thanked them very much.", "begin": 22965.512, "end": 22980.152, "localBegin": 1220.44, "localEnd": 1235.08}, {"id": "c014_f000143", "text": "At last, Norbert was going . . . going . . . gone.", "begin": 22980.152, "end": 22985.632, "localBegin": 1235.08, "localEnd": 1240.56}, {"id": "c014_f000144", "text": "They slipped back down the spiral staircase, their hearts as light as their hands, now that Norbert was off them. No more dragon - Malfoy in detention - what could spoil their happiness?", "begin": 22985.632, "end": 22997.752, "localBegin": 1240.56, "localEnd": 1252.68}, {"id": "c014_f000145", "text": "The answer to that was waiting at the foot of the stairs. As they stepped into the corridor, Filch's face loomed suddenly out of the darkness.", "begin": 22997.752, "end": 23007.632, "localBegin": 1252.68, "localEnd": 1262.56}, {"id": "c014_f000146", "text": "\"Well, well, well,\" he whispered, \"we are in trouble.\"", "begin": 23007.632, "end": 23013.712, "localBegin": 1262.56, "localEnd": 1268.64}, {"id": "c014_f000147", "text": "They'd left the Invisibility Cloak on top of the tower.", "begin": 23013.712, "end": 23020.792, "localBegin": 1268.64, "localEnd": 1275.72}]}, {"kind": "chapter", "number": 15, "title": "The Forbidden Forest", "audio": "../Harry Potter and the Sorcerer's Stone, Book 1 (Unabridged)/015 - Harry Potter and the Sorcerer's Stone, Book 1 (Unabridged).mp3", "start": 23020.823, "end": 24962.708, "duration": 1941.885, "paragraphs": [{"id": "c015_f000001", "text": "Chapter Fifteen. The Forbidden Forest.", "begin": 23020.823, "end": 23025.383, "localBegin": 0.0, "localEnd": 4.56}, {"id": "c015_f000002", "text": "Things couldn't have been worse.", "begin": 23025.383, "end": 23027.743, "localBegin": 4.56, "localEnd": 6.92}, {"id": "c015_f000003", "text": "Filch took them down to Professor McGonagall's study on the first floor, where they sat and waited without saying a word to each other. Hermione was trembling. Excuses, alibis, and wild cover-up stories chased each other around Harry's brain, each more feeble than the last. He couldn't see how they were going to get out of trouble this time. They were cornered. How could they have been so stupid as to forget the Cloak? There was no reason on earth that Professor McGonagall would accept for their being out of bed and creeping around the school in the dead of night, let alone being up the tallest Astronomy Tower, which was out-of-bounds except for classes. Add Norbert and the Invisibility Cloak, and they might as well be packing their bags already.", "begin": 23027.743, "end": 23071.343, "localBegin": 6.92, "localEnd": 50.52}, {"id": "c015_f000004", "text": "Had Harry thought that things couldn't have been worse? He was wrong. When Professor McGonagall appeared, she was leading Neville.", "begin": 23071.343, "end": 23078.903, "localBegin": 50.52, "localEnd": 58.08}, {"id": "c015_f000005", "text": "\"Harry!\" Neville burst out, the moment he saw the other two. \"I was trying to find you to warn you, I heard Malfoy saying he was going to catch you, he said you had a drag - \"", "begin": 23078.903, "end": 23090.183, "localBegin": 58.08, "localEnd": 69.36}, {"id": "c015_f000006", "text": "Harry shook his head violently to shut Neville up, but Professor McGonagall had seen. She looked more likely to breathe fire than Norbert as she towered over the three of them.", "begin": 23090.183, "end": 23099.543, "localBegin": 69.36, "localEnd": 78.72}, {"id": "c015_f000007", "text": "\"I would never have believed it of any of you. Mr. Filch says you were up in the Astronomy Tower. It's one o'clock in the morning. Explain yourselves.\"", "begin": 23099.543, "end": 23109.903, "localBegin": 78.72, "localEnd": 89.08}, {"id": "c015_f000008", "text": "It was the first time Hermione had ever failed to answer a teacher's question. She was staring at her slippers, as still as a statue.", "begin": 23109.903, "end": 23117.383, "localBegin": 89.08, "localEnd": 96.56}, {"id": "c015_f000009", "text": "\"I think I've got a good idea of what's been going on,\" said Professor McGonagall. \"It doesn't take a genius to work it out. You fed Draco Malfoy some cock-and-bull story about a dragon, trying to get him out of bed and into trouble. I've already caught him. I suppose you think it's funny that Longbottom here heard the story and believed it, too?\"", "begin": 23117.383, "end": 23139.543, "localBegin": 96.56, "localEnd": 118.72}, {"id": "c015_f000010", "text": "Harry caught Neville's eye and tried to tell him without words that this wasn't true, because Neville was looking stunned and hurt. Poor, blundering Neville - Harry knew what it must have cost him to try and find them in the dark, to warn them.", "begin": 23139.543, "end": 23153.103, "localBegin": 118.72, "localEnd": 132.28}, {"id": "c015_f000011", "text": "\"I'm disgusted,\" said Professor McGonagall. \"Four students out of bed in one", "begin": 23153.103, "end": 23160.023, "localBegin": 132.28, "localEnd": 139.2}, {"id": "c015_f000012", "text": "night! I've never heard of such a thing before! You, Miss Granger, I thought you had more sense. As for you, Mr. Potter, I thought Gryffindor meant more to you than this. All three of you will receive detentions - yes, you too, Mr. Longbottom, nothing gives you the right to walk around school at night, especially these days, it's very dangerous - and fifty points will be taken from Gryffindor.\"", "begin": 23160.023, "end": 23186.143, "localBegin": 139.2, "localEnd": 165.32}, {"id": "c015_f000013", "text": "\"Fifty?\" Harry gasped - they would lose the lead, the lead he'd won in the last Quidditch match.", "begin": 23186.143, "end": 23193.743, "localBegin": 165.32, "localEnd": 172.92}, {"id": "c015_f000014", "text": "\"Fifty points each,\" said Professor McGonagall, breathing heavily through her long, pointed nose.", "begin": 23193.743, "end": 23200.943, "localBegin": 172.92, "localEnd": 180.12}, {"id": "c015_f000015", "text": "\"Professor - please - \"", "begin": 23200.943, "end": 23203.303, "localBegin": 180.12, "localEnd": 182.48}, {"id": "c015_f000016", "text": "\"You can't - \"", "begin": 23203.303, "end": 23204.383, "localBegin": 182.48, "localEnd": 183.56}, {"id": "c015_f000017", "text": "\"Don't tell me what I can and can't do, Potter. Now get back to bed, all of you. I've never been more ashamed of Gryffindor students.\"", "begin": 23204.383, "end": 23214.663, "localBegin": 183.56, "localEnd": 193.84}, {"id": "c015_f000018", "text": "A hundred and fifty points lost. That put Gryffindor in last place. In one night, they'd ruined any chance Gryffindor had had for the House Cup. Harry felt as though the bottom had dropped out of his stomach. How could they ever make up for this?", "begin": 23214.663, "end": 23231.223, "localBegin": 193.84, "localEnd": 210.4}, {"id": "c015_f000019", "text": "Harry didn't sleep all night. He could hear Neville sobbing into his pillow for what seemed like hours. Harry couldn't think of anything to say to comfort him. He knew Neville, like himself, was dreading the dawn. What would happen when the rest of Gryffindor found out what they'd done?", "begin": 23231.223, "end": 23248.783, "localBegin": 210.4, "localEnd": 227.96}, {"id": "c015_f000020", "text": "At first, Gryffindors passing the giant hourglasses that recorded the House points the next day thought there'd been a mistake. How could they suddenly have a hundred and fifty points fewer than yesterday? And then the story started to spread: Harry Potter, the famous Harry Potter, their hero of two Quidditch matches, had lost them all those points, him and a couple of other stupid first years.", "begin": 23248.783, "end": 23274.183, "localBegin": 227.96, "localEnd": 253.36}, {"id": "c015_f000021", "text": "From being one of the most popular and admired people at the school, Harry was suddenly the most hated. Even Ravenclaws and Hufflepuffs turned on him, because everyone had been longing to see Slytherin lose the House Cup. Everywhere Harry went, people pointed and didn't trouble to lower their voices as they insulted him. Slytherins, on the other hand, clapped as he walked past them, whistling and cheering, \"Thanks Potter, we owe you one!\"", "begin": 23274.183, "end": 23301.223, "localBegin": 253.36, "localEnd": 280.4}, {"id": "c015_f000022", "text": "Only Ron stood by him.", "begin": 23301.223, "end": 23302.703, "localBegin": 280.4, "localEnd": 281.88}, {"id": "c015_f000023", "text": "\"They'll all forget this in a few weeks. Fred and George have lost loads of points in all the time they've been here, and people still like them.\"", "begin": 23302.703, "end": 23310.823, "localBegin": 281.88, "localEnd": 290.0}, {"id": "c015_f000024", "text": "\"They've never lost a hundred and fifty points in one go, though, have they?\" said Harry miserably.", "begin": 23310.823, "end": 23318.743, "localBegin": 290.0, "localEnd": 297.92}, {"id": "c015_f000025", "text": "\"Well - no,\" Ron admitted.", "begin": 23318.743, "end": 23323.663, "localBegin": 297.92, "localEnd": 302.84}, {"id": "c015_f000026", "text": "It was a bit late to repair the damage, but Harry swore to himself not to meddle in things that weren't his business from now on. He'd had it with sneaking around and spying. He felt so ashamed of himself that he went to Wood and offered to resign from the Quidditch team.", "begin": 23323.663, "end": 23338.103, "localBegin": 302.84, "localEnd": 317.28}, {"id": "c015_f000027", "text": "\"Resign?\" Wood thundered. \"What good'll that do? How are we going to get any points back if we can't win at Quidditch?\"", "begin": 23338.103, "end": 23346.703, "localBegin": 317.28, "localEnd": 325.88}, {"id": "c015_f000028", "text": "But even Quidditch had lost its fun. The rest of the team wouldn't speak to Harry during practice, and if they had to speak about him, they called him \"the Seeker.\"", "begin": 23346.703, "end": 23356.503, "localBegin": 325.88, "localEnd": 335.68}, {"id": "c015_f000029", "text": "Hermione and Neville were suffering, too. They didn't have as bad a time as Harry, because they weren't as well-known, but nobody would speak to them, either. Hermione had stopped drawing attention to herself in class, keeping her head down and working in silence.", "begin": 23356.503, "end": 23372.463, "localBegin": 335.68, "localEnd": 351.64}, {"id": "c015_f000030", "text": "Harry was almost
