 glad that the exams weren't far away. All the studying he had to do kept his mind off his misery. He, Ron, and Hermione kept to themselves, working late into the night, trying to remember the ingredients in complicated potions, learn charms and spells by heart, memorize the dates of magical discoveries and goblin rebellions. . . .", "begin": 23372.463, "end": 23395.383, "localBegin": 351.64, "localEnd": 374.56}, {"id": "c015_f000031", "text": "Then, about a week before the exams were due to start, Harry's new resolution not to interfere in anything that didn't concern him was put to an unexpected test. Walking back from the library on his own one afternoon, he heard somebody whimpering from a classroom up ahead. As he drew closer, he heard Quirrell's voice.", "begin": 23395.383, "end": 23413.863, "localBegin": 374.56, "localEnd": 393.04}, {"id": "c015_f000032", "text": "\"No - no - not again, please - \"", "begin": 23413.863, "end": 23418.743, "localBegin": 393.04, "localEnd": 397.92}, {"id": "c015_f000033", "text": "It sounded as though someone was threatening him. Harry moved closer.", "begin": 23418.743, "end": 23423.463, "localBegin": 397.92, "localEnd": 402.64}, {"id": "c015_f000034", "text": "\"All right - all right - \" he heard Quirrell sob.", "begin": 23423.463, "end": 23428.823, "localBegin": 402.64, "localEnd": 408.0}, {"id": "c015_f000035", "text": "Next second, Quirrell came hurrying out of the classroom straightening his turban. He was pale and looked as though he was about to cry. He strode out of", "begin": 23428.823, "end": 23437.143, "localBegin": 408.0, "localEnd": 416.32}, {"id": "c015_f000036", "text": "sight; Harry didn't think Quirrell had even noticed him. He waited until Quirrell's footsteps had disappeared, then peered into the classroom. It was empty, but a door stood ajar at the other end. Harry was halfway toward it before he remembered what he'd promised himself about not meddling.", "begin": 23437.143, "end": 23455.263, "localBegin": 416.32, "localEnd": 434.44}, {"id": "c015_f000037", "text": "All the same, he'd have gambled twelve Sorcerer's Stones that Snape had just left the room, and from what Harry had just heard, Snape would be walking with a new spring in his step - Quirrell seemed to have given in at last.", "begin": 23455.263, "end": 23468.263, "localBegin": 434.44, "localEnd": 447.44}, {"id": "c015_f000038", "text": "Harry went back to the library, where Hermione was testing Ron on Astronomy. Harry told them what he'd heard.", "begin": 23468.263, "end": 23474.903, "localBegin": 447.44, "localEnd": 454.08}, {"id": "c015_f000039", "text": "\"Snape's done it, then!\" said Ron. \"If Quirrell's told him how to break his Anti-Dark Force spell - \"", "begin": 23474.903, "end": 23482.343, "localBegin": 454.08, "localEnd": 461.52}, {"id": "c015_f000040", "text": "\"There's still Fluffy, though,\" said Hermione.", "begin": 23482.343, "end": 23485.663, "localBegin": 461.52, "localEnd": 464.84}, {"id": "c015_f000041", "text": "\"Maybe Snape's found out how to get past him without asking Hagrid,\" said Ron, looking up at the thousands of books surrounding them. \"I bet there's a book somewhere in here telling you how to get past a giant three-headed dog. So what do we do, Harry?\"", "begin": 23485.663, "end": 23502.103, "localBegin": 464.84, "localEnd": 481.28}, {"id": "c015_f000042", "text": "The light of adventure was kindling again in Ron's eyes, but Hermione answered before Harry could.", "begin": 23502.103, "end": 23507.263, "localBegin": 481.28, "localEnd": 486.44}, {"id": "c015_f000043", "text": "\"Go to Dumbledore. That's what we should have done ages ago. If we try anything ourselves we'll be thrown out for sure.\"", "begin": 23507.263, "end": 23514.503, "localBegin": 486.44, "localEnd": 493.68}, {"id": "c015_f000044", "text": "\"But we've got no proof!\" said Harry. \"Quirrell's too scared to back us up. Snape's only got to say he doesn't know how the troll got in at Halloween and that he was nowhere near the third floor - who do you think they'll believe, him or us? It's not exactly a secret we hate him, Dumbledore'll think we made it up to get him sacked. Filch wouldn't help us if his life depended on it, he's too friendly with Snape, and the more students get thrown out, the better, he'll think. And don't forget, we're not supposed to know about the Stone or Fluffy. That'll take a lot of explaining.\"", "begin": 23514.503, "end": 23550.183, "localBegin": 493.68, "localEnd": 529.36}, {"id": "c015_f000045", "text": "Hermione looked convinced, but Ron didn't.", "begin": 23550.183, "end": 23552.583, "localBegin": 529.36, "localEnd": 531.76}, {"id": "c015_f000046", "text": "\"If we just do a bit of poking around - \"", "begin": 23552.583, "end": 23556.463, "localBegin": 531.76, "localEnd": 535.64}, {"id": "c015_f000047", "text": "\"No,\" said Harry flatly, \"we've done enough poking around.\"", "begin": 23556.463, "end": 23561.503, "localBegin": 535.64, "localEnd": 540.68}, {"id": "c015_f000048", "text": "He pulled a map of Jupiter toward him and started to learn the names of its", "begin": 23561.503, "end": 23565.543, "localBegin": 540.68, "localEnd": 544.72}, {"id": "c015_f000049", "text": "moons.", "begin": 23565.543, "end": 23567.983, "localBegin": 544.72, "localEnd": 547.16}, {"id": "c015_f000050", "text": "The following morning, notes were delivered to Harry, Hermione, and Neville at the breakfast table. They were all the same:", "begin": 23567.983, "end": 23574.743, "localBegin": 547.16, "localEnd": 553.92}, {"id": "c015_f000051", "text": "Your detention will take place at eleven o'clock tonight.", "begin": 23574.743, "end": 23578.423, "localBegin": 553.92, "localEnd": 557.6}, {"id": "c015_f000052", "text": "Meet Mr. Filch in the entrance hall.", "begin": 23578.423, "end": 23584.223, "localBegin": 557.6, "localEnd": 563.4}, {"id": "c015_f000053", "text": "Harry had forgotten they still had detentions to do in the furor over the points they'd lost. He half expected Hermione to complain that this was a whole night of studying lost, but she didn't say a word. Like Harry, she felt they deserved what they'd got.", "begin": 23584.223, "end": 23599.343, "localBegin": 563.4, "localEnd": 578.52}, {"id": "c015_f000054", "text": "At eleven o'clock that night, they said good-bye to Ron in the common room and went down to the entrance hall with Neville. Filch was already there - and so was Malfoy. Harry had also forgotten that Malfoy had gotten a detention, too.", "begin": 23599.343, "end": 23613.023, "localBegin": 578.52, "localEnd": 592.2}, {"id": "c015_f000055", "text": "\"Follow me,\" said Filch, lighting a lamp and leading them outside.", "begin": 23613.023, "end": 23618.303, "localBegin": 592.2, "localEnd": 597.48}, {"id": "c015_f000056", "text": "\"I bet you'll think twice about breaking a school rule again, won't you, eh?\" he said, leering at them. \"Oh yes . . . hard work and pain are the best teachers if you ask me. . . . It's just a pity they let the old punishments die out . . . hang you by your wrists from the ceiling for a few days, I've got the chains still in my office, keep 'em well oiled in case they're ever needed. . . . Right, off we go, and don't think of running off, now, it'll be worse for you if you do.\"", "begin": 23618.303, "end": 23647.543, "localBegin": 597.48, "localEnd": 626.72}, {"id": "c015_f000057", "text": "They marched off across the dark grounds. Neville kept sniffing. Harry wondered what their punishment was going to be. It must be something really horrible, or Filch wouldn't be sounding so delighted.", "begin": 23647.543, "end": 23658.383, "localBegin": 626.72, "localEnd": 637.56}, {"id": "c015_f000058", "text": "The moon was bright, but clouds scudding across it kept throwing them into darkness. Ahead, Harry could see the lighted windows of Hagrid's hut. Then they heard a distant shout.", "begin": 23658.383, "end": 23669.463, "localBegin": 637.56, "localEnd": 648.64}, {"id": "c015_f000059", "text": "\"Is that you, Filch? Hurry up, I want ter get started.\"", "begin": 23669.463, "end": 23673.983, "localBegin": 648.64, "localEnd": 653.16}, {"id": "c015_f000060", "text": "Harry's heart rose; if they were going to be working with Hagrid it wouldn't be so bad. His relief must have showed in his face, because Filch said, \"I suppose you think you'll be enjoying yourself with that oaf? Well, think again, boy - it's", "begin": 23673.983, "end": 23689.223, "localBegin": 653.16, "localEnd": 668.4}, {"id": "c015_f000061", "text": "into the forest you're going and I'm much mistaken if you'll all come out in one piece.\"", "begin": 23689.223, "end": 23695.423, "localBegin": 668.4, "localEnd": 674.6}, {"id": "c015_f000062", "text": "At this, Neville let out a little moan, and Malfoy stopped dead in his tracks.", "begin": 23695.423, "end": 23700.023, "localBegin": 674.6, "localEnd": 679.2}, {"id": "c015_f000063", "text": "\"The forest?\" he repeated, and he didn't sound quite as cool as usual. \"We can't go in there at night - there's all sorts of things in there - werewolves, I heard.\"", "begin": 23700.023, "end": 23711.023, "localBegin": 679.2, "localEnd": 690.2}, {"id": "c015_f000064", "text": "Neville clutched the sleeve of Harry's robe and made a choking noise.", "begin": 23711.023, "end": 23714.063, "localBegin": 690.2, "localEnd": 693.24}, {"id": "c015_f000065", "text": "\"That's your problem, isn't it?\" said Filch, his voice cracking with glee. \"Should've thought of them werewolves before you got in trouble, shouldn't you?\"", "begin": 23714.063, "end": 23722.943, "localBegin": 693.24, "localEnd": 702.12}, {"id": "c015_f000066", "text": "Hagrid came striding toward them out of the dark, Fang at his heel. He was carrying his large crossbow, and a quiver of arrows hung over his shoulder.", "begin": 23722.943, "end": 23730.943, "localBegin": 702.12, "localEnd": 710.12}, {"id": "c015_f000067", "text": "\"Abou' time,\" he said. \"I bin waitin' fer half an hour already. All right, Harry, Hermione?\"", "begin": 23730.943, "end": 23737.663, "localBegin": 710.12, "localEnd": 716.84}, {"id": "c015_f000068", "text": "\"I shouldn't be too friendly to them, Hagrid,\" said Filch coldly, \"they're here to be punished, after all.\"", "begin": 23737.663, "end": 23745.503, "localBegin": 716.84, "localEnd": 724.68}, {"id": "c015_f000069", "text": "\"That's why yer late, is it?\" said Hagrid, frowning at Filch. \"Bin lecturin' them, eh? 'Snot your place ter do that. Yeh've done yer bit, I'll take over from here.\"", "begin": 23745.503, "end": 23756.503, "localBegin": 724.68, "localEnd": 735.68}, {"id": "c015_f000070", "text": "\"I'll be back at dawn,\" said Filch, \"for what's left of them,\" he added nastily, and he turned and started back toward the castle, his lamp bobbing away in the darkness.", "begin": 23756.503, "end": 23768.343, "localBegin": 735.68, "localEnd": 747.52}, {"id": "c015_f000071", "text": "Malfoy now turned to Hagrid.", "begin": 23768.343, "end": 23771.263, "localBegin": 747.52, "localEnd": 750.44}, {"id": "c015_f000072", "text": "\"I'm not going in that forest,\" he said, and Harry was pleased to hear the note of panic in his voice.", "begin": 23771.263, "end": 23778.903, "localBegin": 750.44, "localEnd": 758.08}, {"id": "c015_f000073", "text": "\"Yeh are if yeh want ter stay at Hogwarts,\" said Hagrid fiercely. \"Yeh've done wrong an' now yeh've got ter pay fer it.\"", "begin": 23778.903, "end": 23786.503, "localBegin": 758.08, "localEnd": 765.68}, {"id": "c015_f000074", "text": "\"But this is servant stuff, it's not for students to do. I thought we'd be copying lines or something, if my father knew I was doing this, he'd - \"", "begin": 23786.503, "end": 23797.543, "localBegin": 765.68, "localEnd": 776.72}, {"id": "c015_f000075", "text": "\" - tell yer that's how it is at Hogwarts,\" Hagrid growled. \"Copyin' lines! What good's that ter anyone? Yeh'll do summat useful or yeh'll get out. If yeh think yer father'd rather you were expelled, then get back off ter the castle an'", "begin": 23797.543, "end": 23813.863, "localBegin": 776.72, "localEnd": 793.04}, {"id": "c015_f000076", "text": "pack. Go on!\"", "begin": 23813.863, "end": 23815.143, "localBegin": 793.04, "localEnd": 794.32}, {"id": "c015_f000077", "text": "Malfoy didn't move. He looked at Hagrid furiously, but then dropped his gaze.", "begin": 23815.143, "end": 23821.583, "localBegin": 794.32, "localEnd": 800.76}, {"id": "c015_f000078", "text": "\"Right then,\" said Hagrid, \"now, listen carefully, 'cause it's dangerous what we're gonna do tonight, an' I don' want no one takin' risks. Follow me over here a moment.\"", "begin": 23821.583, "end": 23834.543, "localBegin": 800.76, "localEnd": 813.72}, {"id": "c015_f000079", "text": "He led them to the very edge of the forest. Holding his lamp up high, he pointed down a narrow, winding earth track that disappeared into the thick black trees. A light breeze lifted their hair as they looked into the forest.", "begin": 23834.543, "end": 23847.263, "localBegin": 813.72, "localEnd": 826.44}, {"id": "c015_f000080", "text": "\"Look there,\" said Hagrid, \"see that stuff shinin' on the ground? Silvery stuff? That's unicorn blood. There's a unicorn in there bin hurt badly by summat. This is the second time in a week. I found one dead last Wednesday. We're gonna try an' find the poor thing. We might have ter put it out of its misery.\"", "begin": 23847.263, "end": 23872.583, "localBegin": 826.44, "localEnd": 851.76}, {"id": "c015_f000081", "text": "\"And what if whatever hurt the unicorn finds us first?\" said Malfoy, unable to keep the fear out of his voice.", "begin": 23872.583, "end": 23881.303, "localBegin": 851.76, "localEnd": 860.48}, {"id": "c015_f000082", "text": "\"There's nothin' that lives in the forest that'll hurt yeh if yer with me or Fang,\" said Hagrid. \"An' keep ter the path. Right, now, we're gonna split inter two parties an' follow the trail in diff'rent directions. There's blood all over the place, it must've bin staggerin' around since last night at least.\"", "begin": 23881.303, "end": 23901.703, "localBegin": 860.48, "localEnd": 880.88}, {"id": "c015_f000083", "text": "\"I want Fang,\" said Malfoy quickly, looking at Fang's long teeth.", "begin": 23901.703, "end": 23907.703, "localBegin": 880.88, "localEnd": 886.88}, {"id": "c015_f000084", "text": "\"All right, but I warn yeh, he's a coward,\" said Hagrid. \"So me, Harry, an' Hermione'll go one way an' Draco, Neville, an' Fang'll go the other. Now, if any of us finds the unicorn, we'll send up green sparks, right? Get yer wands out an' practice now - that's it - an' if anyone gets in trouble, send up red sparks, an' we'll all come an' find yeh - so, be careful - let's go.\"", "begin": 23907.703, "end": 23937.023, "localBegin": 886.88, "localEnd": 916.2}, {"id": "c015_f000085", "text": "The forest was black and silent. A little way into it they reached a fork in the earth path, and Harry, Hermione, and Hagrid took the left path while Malfoy, Neville, and Fang took the right.", "begin": 23937.023, "end": 23948.783, "localBegin": 916.2, "localEnd": 927.96}, {"id": "c015_f000086", "text": "They walked in silence, their eyes on the ground. Every now and then a ray of moonlight through the branches above lit a spot of silver-blue blood on the fallen leaves.", "begin": 23948.783, "end": 23959.463, "localBegin": 927.96, "localEnd": 938.64}, {"id": "c015_f000087", "text": "Harry saw that Hagrid looked very worried.", "begin": 23959.463, "end": 23962.383, "localBegin": 938.64, "localEnd": 941.56}, {"id": "c015_f000088", "text": "\"Could a werewolf be killing the unicorns?\" Harry asked.", "begin": 23962.383, "end": 23966.903, "localBegin": 941.56, "localEnd": 946.08}, {"id": "c015_f000089", "text": "\"Not fast enough,\" said Hagrid. \"It's not easy ter catch a unicorn, they're powerful magic creatures. I never knew one ter be hurt before.\"", "begin": 23966.903, "end": 23976.663, "localBegin": 946.08, "localEnd": 955.84}, {"id": "c015_f000090", "text": "They walked past a mossy tree stump. Harry could hear running water; there must be a stream somewhere close by. There were still spots of unicorn blood here and there along the winding path.", "begin": 23976.663, "end": 23988.703, "localBegin": 955.84, "localEnd": 967.88}, {"id": "c015_f000091", "text": "\"You all right, Hermione?\" Hagrid whispered. \"Don' worry, it can't've gone far if it's this badly hurt, an' then we'll be able ter - GET BEHIND THAT TREE!\"", "begin": 23988.703, "end": 24000.263, "localBegin": 967.88, "localEnd": 979.44}, {"id": "c015_f000092", "text": "Hagrid seized Harry and Hermione and hoisted them off the path behind a towering oak. He pulled out an arrow and fitted it into his crossbow, raising it, ready to fire. The three of them listened. Something was slithering over dead leaves nearby: it sounded like a cloak trailing along the ground. Hagrid was squinting up the dark path, but after a few seconds, the sound faded away.", "begin": 24000.263, "end": 24024.583, "localBegin": 979.44, "localEnd": 1003.76}, {"id": "c015_f000093", "text": "\"I knew it,\" he murmured. \"There's summat in here that shouldn' be.\"", "begin": 24024.583, "end": 24031.023, "localBegin": 1003.76, "localEnd": 1010.2}, {"id": "c015_f000094", "text": "\"A werewolf?\" Harry suggested.", "begin": 24031.023, "end": 24033.823, "localBegin": 1010.2, "localEnd": 1013.0}, {"id": "c015_f000095", "text": "\"That wasn' no werewolf an' it wasn' no unicorn, neither,\" said Hagrid grimly. \"Right, follow me, but careful, now.\"", "begin": 24033.823, "end": 24042.783, "localBegin": 1013.0, "localEnd": 1021.96}, {"id": "c015_f000096", "text": "They walked more slowly, ears straining for the faintest sound. Suddenly, in a clearing ahead, something definitely moved.", "begin": 24042.783, "end": 24051.343, "localBegin": 1021.96, "localEnd": 1030.52}, {"id": "c015_f000097", "text": "\"Who's there?\" Hagrid called. \"Show yerself - I'm armed!\"", "begin": 24051.343, "end": 24056.303, "localBegin": 1030.52, "localEnd": 1035.48}, {"id": "c015_f000098", "text": "And into the clearing came - was it a man, or a horse? To the waist, a man, with red hair and beard, but below that was a horse's gleaming chestnut body with a long, reddish tail. Harry and Hermione's jaws dropped.", "begin": 24056.303, "end": 24071.863, "localBegin": 1035.48, "localEnd": 1051.04}, {"id": "c015_f000099", "text": "\"Oh, it's you, Ronan,\" said Hagrid in relief. \"How are yeh?\"", "begin": 24071.863, "end": 24076.943, "localBegin": 1051.04, "localEnd": 1056.12}, {"id": "c015_f000100", "text": "He walked forward and shook the centaur's hand.", "begin": 24076.943, "end": 24080.023, "localBegin": 1056.12, "localEnd": 1059.2}, {"id": "c015_f000101", "text": "\"Good evening to you, Hagrid,\" said Ronan. He had a deep, sorrowful voice. \"Were you going to shoot me?\"", "begin": 24080.023, "end": 24088.063, "localBegin": 1059.2, "localEnd": 1067.24}, {"id": "c015_f000102", "text": "\"Can't be too careful, Ronan,\" said Hagrid, patting his crossbow. \"There's summat bad loose in this forest. This is Harry Potter an' Hermione Granger, by the way. Students up at the school. An' this is Ronan, you two. He's a centaur.\"", "begin": 24088.063, "end": 24104.143, "localBegin": 1067.24, "localEnd": 1083.32}, {"id": "c015_f000103", "text": "\"We'd noticed,\" said Hermione faintly.", "begin": 24104.143, "end": 24107.223, "localBegin": 1083.32, "localEnd": 1086.4}, {"id": "c015_f000104", "text": "\"Good evening,\" said Ronan. \"Students, are you? And do you learn much, up at the school?\"", "begin": 24107.223, "end": 24113.623, "localBegin": 1086.4, "localEnd": 1092.8}, {"id": "c015_f000105", "text": "\"Erm - \"", "begin": 24113.623, "end": 24115.183, "localBegin": 1092.8, "localEnd": 1094.36}, {"id": "c015_f000106", "text": "\"A bit,\" said Hermione timidly.", "begin": 24115.183, "end": 24117.743, "localBegin": 1094.36, "localEnd": 1096.92}, {"id": "c015_f000107", "text": "\"A bit. Well, that's something.\" Ronan sighed. He flung back his head and stared at the sky. \"Mars is bright tonight.\"", "begin": 24117.743, "end": 24128.183, "localBegin": 1096.92, "localEnd": 1107.36}, {"id": "c015_f000108", "text": "\"Yeah,\" said Hagrid, glancing up, too. \"Listen, I'm glad we've run inter yeh, Ronan, 'cause there's a unicorn bin hurt - you seen anythin'?\"", "begin": 24128.183, "end": 24138.143, "localBegin": 1107.36, "localEnd": 1117.32}, {"id": "c015_f000109", "text": "Ronan didn't answer immediately. He stared unblinkingly upward, then sighed again.", "begin": 24138.143, "end": 24144.623, "localBegin": 1117.32, "localEnd": 1123.8}, {"id": "c015_f000110", "text": "\"Always the innocent are the first victims,\" he said. \"So it has been for ages past, so it is now.\"", "begin": 24144.623, "end": 24153.623, "localBegin": 1123.8, "localEnd": 1132.8}, {"id": "c015_f000111", "text": "\"Yeah,\" said Hagrid, \"but have yeh seen anythin', Ronan? Anythin' unusual?\"", "begin": 24153.623, "end": 24161.543, "localBegin": 1132.8, "localEnd": 1140.72}, {"id": "c015_f000112", "text": "\"Mars is bright tonight,\" Ronan repeated, while Hagrid watched him impatiently. \"Unusually bright.\"", "begin": 24161.543, "end": 24171.223, "localBegin": 1140.72, "localEnd": 1150.4}, {"id": "c015_f000113", "text": "\"Yeah, but I was meanin' anythin' unusual a bit nearer home,\" said Hagrid. \"So yeh haven't noticed anythin' strange?\"", "begin": 24171.223, "end": 24181.823, "localBegin": 1150.4, "localEnd": 1161.0}, {"id": "c015_f000114", "text": "Yet again, Ronan took a while to answer. At last, he said, \"The forest hides many secrets.\"", "begin": 24181.823, "end": 24189.743, "localBegin": 1161.0, "localEnd": 1168.92}, {"id": "c015_f000115", "text": "A movement in the trees behind Ronan made Hagrid raise his bow again, but it was only a second centaur, black-haired and -bodied and wilder-looking than Ronan.", "begin": 24189.743, "end": 24198.343, "localBegin": 1168.92, "localEnd": 1177.52}, {"id": "c015_f000116", "text": "\"Hullo, Bane,\" said Hagrid. \"All right?\"", "begin": 24198.343, "end": 24201.463, "localBegin": 1177.52, "localEnd": 1180.64}, {"id": "c015_f000117", "text": "\"Good evening, Hagrid, I hope you are well?\"", "begin": 24201.463, "end": 24204.423, "localBegin": 1180.64, "localEnd": 1183.6}, {"id": "c015_f000118", "text": "\"Well enough. Look, I've jus' bin askin' Ronan, you seen anythin' odd in here lately? There's a unicorn bin injured - would yeh know anythin' about it?\"", "begin": 24204.423, "end": 24216.463, "localBegin": 1183.6, "localEnd": 1195.64}, {"id": "c015_f000119", "text": "Bane walked over to stand next to Ronan. He looked skyward.", "begin": 24216.463, "end": 24220.383, "localBegin": 1195.64, "localEnd": 1199.56}, {"id": "c015_f000120", "text": "\"Mars is bright tonight,\" he said simply.", "begin": 24220.383, "end": 24224.383, "localBegin": 1199.56, "localEnd": 1203.56}, {"id": "c015_f000121", "text": "\"We've heard,\" said Hagrid grumpily. \"Well, if either of you do see anythin', let me know, won't yeh? We'll be off, then.\"", "begin": 24224.383, "end": 24232.943, "localBegin": 1203.56, "localEnd": 1212.12}, {"id": "c015_f000122", "text": "Harry and Hermione followed him out of the clearing, staring over their shoulders at Ronan and Bane until the trees blocked their view.", "begin": 24232.943, "end": 24240.823, "localBegin": 1212.12, "localEnd": 1220.0}, {"id": "c015_f000123", "text": "\"Never,\" said Hagrid irritably, \"try an' get a straight answer out of a centaur. Ruddy stargazers. Not interested in anythin' closer'n the moon.\"", "begin": 24240.823, "end": 24252.103, "localBegin": 1220.0, "localEnd": 1231.28}, {"id": "c015_f000124", "text": "\"Are there many of them in here?\" asked Hermione.", "begin": 24252.103, "end": 24255.863, "localBegin": 1231.28, "localEnd": 1235.04}, {"id": "c015_f000125", "text": "\"Oh, a fair few. . . . Keep themselves to themselves mostly, but they're good enough about turnin' up if ever I want a word. They're deep, mind, centaurs . . . they know things . . . jus' don' let on much.\"", "begin": 24255.863, "end": 24269.063, "localBegin": 1235.04, "localEnd": 1248.24}, {"id": "c015_f000126", "text": "\"D'you think that was a centaur we heard earlier?\" said Harry.", "begin": 24269.063, "end": 24273.583, "localBegin": 1248.24, "localEnd": 1252.76}, {"id": "c015_f000127", "text": "\"Did that sound like hooves to you? Nah, if yeh ask me, that was what's bin killin' the unicorns - never heard anythin' like it before.\"", "begin": 24273.583, "end": 24283.983, "localBegin": 1252.76, "localEnd": 1263.16}, {"id": "c015_f000128", "text": "They walked on through the dense, dark trees. Harry kept looking nervously over his shoulder. He had the nasty feeling they were being watched. He was very glad they had Hagrid and his crossbow with them. They had just passed a bend in the path when Hermione grabbed Hagrid's arm.", "begin": 24283.983, "end": 24301.343, "localBegin": 1263.16, "localEnd": 1280.52}, {"id": "c015_f000129", "text": "\"Hagrid! Look! Red sparks, the others are in trouble!\"", "begin": 24301.343, "end": 24304.863, "localBegin": 1280.52, "localEnd": 1284.04}, {"id": "c015_f000130", "text": "\"You two wait here!\" Hagrid shouted. \"Stay on the path, I'll come back for yeh!\"", "begin": 24304.863, "end": 24309.583, "localBegin": 1284.04, "localEnd": 1288.76}, {"id": "c015_f000131", "text": "They heard him crashing away through the undergrowth and stood looking at each other, very scared, until they couldn't hear anything but the rustling of leaves around them.", "begin": 24309.583, "end": 24318.743, "localBegin": 1288.76, "localEnd": 1297.92}, {"id": "c015_f000132", "text": "\"You don't think they've been hurt, do you?\" whispered Hermione.", "begin": 24318.743, "end": 24325.143, "localBegin": 1297.92, "localEnd": 1304.32}, {"id": "c015_f000133", "text": "\"I don't care if Malfoy has, but if something's got Neville . . . it's our fault he's here in the first place.\"", "begin": 24325.143, "end": 24333.303, "localBegin": 1304.32, "localEnd": 1312.48}, {"id": "c015_f000134", "text": "The minutes dragged by. Their ears seemed sharper than usual. Harry's seemed to be picking up every sigh of the wind, every cracking twig. What was going on? Where were the others?", "begin": 24333.303, "end": 24346.583, "localBegin": 1312.48, "localEnd": 1325.76}, {"id": "c015_f000135", "text": "At last, a great crunching noise announced Hagrid's return. Malfoy, Neville, and Fang were with him. Hagrid was fuming. Malfoy, it seemed, had sneaked up behind Neville and grabbed him as a joke. Neville had panicked and sent up the sparks.", "begin": 24346.583, "end": 24361.743, "localBegin": 1325.76, "localEnd": 1340.92}, {"id": "c015_f000136", "text": "\"We'll be lucky ter catch anythin' now, with the racket you two were makin'. Right, we're changin' groups - Neville, you stay with me an' Hermione, Harry, you go with Fang an' this idiot. I'm sorry,\" Hagrid added in a whisper to Harry, \"but he'll have a harder time frightenin' you, an' we've gotta get this done.\"", "begin": 24361.743, "end": 24381.863, "localBegin": 1340.92, "localEnd": 1361.04}, {"id": "c015_f000137", "text": "So Harry set off into the heart of the forest with Malfoy and Fang. They walked for nearly half an hour, deeper and deeper into the forest, until the path became almost impossible to follow because the trees were so thick. Harry thought the blood seemed to be getting thicker. There were splashes on the roots of a tree, as though the poor creature had been thrashing around in pain close by. Harry could see a clearing ahead, through the tangled branches of an ancient oak.", "begin": 24381.863, "end": 24409.303, "localBegin": 1361.04, "localEnd": 1388.48}, {"id": "c015_f000138", "text": "\"Look - \" he murmured, holding out his arm to stop Malfoy.", "begin": 24409.303, "end": 24414.823, "localBegin": 1388.48, "localEnd": 1394.0}, {"id": "c015_f000139", "text": "Something bright white was gleaming on the ground. They inched closer.", "begin": 24414.823, "end": 24420.023, "localBegin": 1394.0, "localEnd": 1399.2}, {"id": "c015_f000140", "text": "It was the unicorn all right, and it was dead. Harry had never seen anything so beautiful and sad. Its long, slender legs were stuck out at odd angles where it had fallen and its mane was spread pearly-white on the dark leaves.", "begin": 24420.023, "end": 24438.743, "localBegin": 1399.2, "localEnd": 1417.92}, {"id": "c015_f000141", "text": "Harry had taken one step toward it when a slithering sound made him freeze where he stood. A bush on the edge of the clearing quivered. . . . Then, out of the shadows, a hooded figure came crawling across the ground like some stalking beast. Harry, Malfoy, and Fang stood transfixed. The cloaked figure reached the unicorn, lowered its head over the wound in the animal's side, and began to drink its blood.", "begin": 24438.743, "end": 24467.383, "localBegin": 1417.92, "localEnd": 1446.56}, {"id": "c015_f000142", "text": "\"AAAAAAAAAAARGH!\"", "begin": 24467.383, "end": 24470.463, "localBegin": 1446.56, "localEnd": 1449.64}, {"id": "c015_f000143", "text": "Malfoy let out a terrible scream and bolted - so did Fang. The hooded figure raised its head and looked right at Harry - unicorn blood was dribbling down its front. It got to its feet and came swiftly toward Harry - he couldn't move for fear.", "begin": 24470.463, "end": 24487.063, "localBegin": 1449.64, "localEnd": 1466.24}, {"id": "c015_f000144", "text": "Then a pain like he'd never felt before pierced his head; it was as though his scar were on fire. Half blinded, he staggered backward. He heard hooves behind him, galloping, and something jumped clean over Harry, charging at the figure.", "begin": 24487.063, "end": 24501.583, "localBegin": 1466.24, "localEnd": 1480.76}, {"id": "c015_f000145", "text": "The pain in Harry's head was so bad he fell to his knees. It took a minute or two to pass. When he looked up, the figure had gone. A centaur was standing over him, not Ronan or Bane; this one looked younger; he had white-blond hair and a palomino body.", "begin": 24501.583, "end": 24520.623, "localBegin": 1480.76, "localEnd": 1499.8}, {"id": "c015_f000146", "text": "\"Are you all right?\" said the centaur, pulling Harry to his feet.", "begin": 24520.623, "end": 24524.863, "localBegin": 1499.8, "localEnd": 1504.04}, {"id": "c015_f000147", "text": "\"Yes - thank you - what was that?\"", "begin": 24524.863, "end": 24528.383, "localBegin": 1504.04, "localEnd": 1507.56}, {"id": "c015_f000148", "text": "The centaur didn't answer. He had astonishingly blue eyes, like pale sapphires. He looked carefully at Harry, his eyes lingering on the scar that stood out, livid, on Harry's forehead.", "begin": 24528.383, "end": 24541.503, "localBegin": 1507.56, "localEnd": 1520.68}, {"id": "c015_f000149", "text": "\"You are the Potter boy,\" he said. \"You had better get back to Hagrid. The forest is not safe at this time - especially for you. Can you ride? It will be quicker this way.", "begin": 24541.503, "end": 24552.623, "localBegin": 1520.68, "localEnd": 1531.8}, {"id": "c015_f000150", "text": "\"My name is Firenze,\" he added, as he lowered himself on to his front legs so that Harry could clamber onto his back.", "begin": 24552.623, "end": 24560.463, "localBegin": 1531.8, "localEnd": 1539.64}, {"id": "c015_f000151", "text": "There was suddenly a sound of more galloping from the other side of the clearing. Ronan and Bane came bursting through the trees, their flanks heaving and sweaty.", "begin": 24560.463, "end": 24569.823, "localBegin": 1539.64, "localEnd": 1549.0}, {"id": "c015_f000152", "text": "\"Firenze!\" Bane thundered. \"What are you doing? You have a human on your back! Have you no shame? Are you a common mule?\"", "begin": 24569.823, "end": 24579.383, "localBegin": 1549.0, "localEnd": 1558.56}, {"id": "c015_f000153", "text": "\"Do you realize who this is?\" said Firenze. \"This is the Potter boy. The quicker he leaves this forest, the better.\"", "begin": 24579.383, "end": 24587.343, "localBegin": 1558.56, "localEnd": 1566.52}, {"id": "c015_f000154", "text": "\"What have you been telling him?\" growled Bane. \"Remember, Firenze, we are sworn not to set ourselves against the heavens. Have we not read what is to come in the movements of the planets?\"", "begin": 24587.343, "end": 24599.103, "localBegin": 1566.52, "localEnd": 1578.28}, {"id": "c015_f000155", "text": "Ronan pawed the ground nervously. \"I'm sure Firenze thought he was acting for the best,\" he said in his gloomy voice.", "begin": 24599.103, "end": 24607.983, "localBegin": 1578.28, "localEnd": 1587.16}, {"id": "c015_f000156", "text": "Bane kicked his back legs in anger.", "begin": 24607.983, "end": 24610.423, "localBegin": 1587.16, "localEnd": 1589.6}, {"id": "c015_f000157", "text": "\"For the best! What is that to do with us? Centaurs are concerned with what has been foretold! It is not our business to run around like donkeys after stray humans in our forest!\"", "begin": 24610.423, "end": 24622.663, "localBegin": 1589.6, "localEnd": 1601.84}, {"id": "c015_f000158", "text": "Firenze suddenly reared on to his hind legs in anger, so that Harry had to grab his shoulders to stay on.", "begin": 24622.663, "end": 24629.303, "localBegin": 1601.84, "localEnd": 1608.48}, {"id": "c015_f000159", "text": "\"Do you not see that unicorn?\" Firenze bellowed at Bane. \"Do you not understand why it was killed? Or have the planets not let you in on that secret? I set myself against what is lurking in this forest, Bane, yes, with humans alongside me if I must.\"", "begin": 24629.303, "end": 24646.703, "localBegin": 1608.48, "localEnd": 1625.88}, {"id": "c015_f000160", "text": "And Firenze whisked around; with Harry clutching on as best he could, they plunged off into the trees, leaving Ronan and Bane behind them.", "begin": 24646.703, "end": 24656.183, "localBegin": 1625.88, "localEnd": 1635.36}, {"id": "c015_f000161", "text": "Harry didn't have a clue what was going on.", "begin": 24656.183, "end": 24659.703, "localBegin": 1635.36, "localEnd": 1638.88}, {"id": "c015_f000162", "text": "\"Why's Bane so angry?\" he asked. \"What was that thing you saved me from, anyway?\"", "begin": 24659.703, "end": 24666.103, "localBegin": 1638.88, "localEnd": 1645.28}, {"id": "c015_f000163", "text": "Firenze slowed to a walk, warned Harry to keep his head bowed in case of lowhanging branches, but did not answer Harry's question. They made their way through the trees in silence for so long that Harry thought Firenze didn't want to talk to him anymore. They were passing through a particularly dense patch of trees, however, when Firenze suddenly stopped.", "begin": 24666.103, "end": 24687.623, "localBegin": 1645.28, "localEnd": 1666.8}, {"id": "c015_f000164", "text": "\"Harry Potter, do you know what unicorn blood is used for?\"", "begin": 24687.623, "end": 24692.343, "localBegin": 1666.8, "localEnd": 1671.52}, {"id": "c015_f000165", "text": "\"No,\" said Harry, startled by the odd question. \"We've only used the horn and tail hair in Potions.\"", "begin": 24692.343, "end": 24698.663, "localBegin": 1671.52, "localEnd": 1677.84}, {"id": "c015_f000166", "text": "\"That is because it is a monstrous thing, to slay a unicorn,\" said Firenze. \"Only one who has nothing to lose, and everything to gain, would commit such a crime. The blood of a unicorn will keep you alive, even if you are an inch from death, but at a terrible price. You have slain something pure and defenseless to save yourself, and you will have but a half-life, a cursed life, from the moment the blood touches your lips.\"", "begin": 24698.663, "end": 24726.583, "localBegin": 1677.84, "localEnd": 1705.76}, {"id": "c015_f000167", "text": "Harry stared at the back of Firenze's head, which was dappled silver in the moonlight.", "begin": 24726.583, "end": 24732.303, "localBegin": 1705.76, "localEnd": 1711.48}, {"id": "c015_f000168", "text": "\"But who'd be that desperate?\" he wondered aloud. \"If you're going to be cursed forever, death's better, isn't it?\"", "begin": 24732.303, "end": 24741.303, "localBegin": 1711.48, "localEnd": 1720.48}, {"id": "c015_f000169", "text": "\"It is,\" Firenze agreed, \"unless all you need is to stay alive long enough to drink something else - something that will bring you back to full strength and power - something that will mean you can never die. Mr. Potter, do you know what is hidden in the school at this very moment?\"", "begin": 24741.303, "end": 24759.823, "localBegin": 1720.48, "localEnd": 1739.0}, {"id": "c015_f000170", "text": "\"The Sorcerer's Stone! Of course - the Elixir of Life! But I don't understand who - \"", "begin": 24759.823, "end": 24765.543, "localBegin": 1739.0, "localEnd": 1744.72}, {"id": "c015_f000171", "text": "\"Can you think of nobody who has waited many years to return to power, who has clung to life, awaiting their chance?\"", "begin": 24765.543, "end": 24772.943, "localBegin": 1744.72, "localEnd": 1752.12}, {"id": "c015_f000172", "text": "It was as though an iron fist had clenched suddenly around Harry's heart. Over", "begin": 24772.943, "end": 24779.343, "localBegin": 1752.12, "localEnd": 1758.52}, {"id": "c015_f000173", "text": "the rustling of the trees, he seemed to hear once more what Hagrid had told him on the night they had met: \"Some say he died. Codswallop, in my opinion. Dunno if he had enough human left in him to die.\"", "begin": 24779.343, "end": 24793.703, "localBegin": 1758.52, "localEnd": 1772.88}, {"id": "c015_f000174", "text": "\"Do you mean,\" Harry croaked, \"that was Vol - \"", "begin": 24793.703, "end": 24799.543, "localBegin": 1772.88, "localEnd": 1778.72}, {"id": "c015_f000175", "text": "\"Harry! Harry, are you all right?\"", "begin": 24799.543, "end": 24803.063, "localBegin": 1778.72, "localEnd": 1782.24}, {"id": "c015_f000176", "text": "Hermione was running toward them down the path, Hagrid puffing along behind her.", "begin": 24803.063, "end": 24808.583, "localBegin": 1782.24, "localEnd": 1787.76}, {"id": "c015_f000177", "text": "\"I'm fine,\" said Harry, hardly knowing what he was saying. \"The unicorn's dead, Hagrid, it's in that clearing back there.\"", "begin": 24808.583, "end": 24815.503, "localBegin": 1787.76, "localEnd": 1794.68}, {"id": "c015_f000178", "text": "\"This is where I leave you,\" Firenze murmured as Hagrid hurried off to examine the unicorn. \"You are safe now.\"", "begin": 24815.503, "end": 24822.583, "localBegin": 1794.68, "localEnd": 1801.76}, {"id": "c015_f000179", "text": "Harry slid off his back.", "begin": 24822.583, "end": 24824.423, "localBegin": 1801.76, "localEnd": 1803.6}, {"id": "c015_f000180", "text": "\"Good luck, Harry Potter,\" said Firenze. \"The planets have been read wrongly before now, even by centaurs. I hope this is one of those times.\"", "begin": 24824.423, "end": 24834.703, "localBegin": 1803.6, "localEnd": 1813.88}, {"id": "c015_f000181", "text": "He turned and cantered back into the depths of the forest, leaving Harry shivering behind him.", "begin": 24834.703, "end": 24840.783, "localBegin": 1813.88, "localEnd": 1819.96}, {"id": "c015_f000182", "text": "Ron had fallen asleep in the dark common room, waiting for them to return. He shouted something about Quidditch fouls when Harry roughly shook him awake. In a matter of seconds, though, he was wide-eyed as Harry began to tell him and Hermione what had happened in the forest.", "begin": 24840.783, "end": 24858.543, "localBegin": 1819.96, "localEnd": 1837.72}, {"id": "c015_f000183", "text": "Harry couldn't sit down. He paced up and down in front of the fire. He was still shaking.", "begin": 24858.543, "end": 24864.303, "localBegin": 1837.72, "localEnd": 1843.48}, {"id": "c015_f000184", "text": "\"Snape wants the Stone for Voldemort . . . and Voldemort's waiting in the forest . . . and all this time we thought Snape just wanted to get rich. . . .\"", "begin": 24864.303, "end": 24873.303, "localBegin": 1843.48, "localEnd": 1852.48}, {"id": "c015_f000185", "text": "\"Stop saying the name!\" said Ron in a terrified whisper, as if he thought Voldemort could hear them.", "begin": 24873.303, "end": 24879.823, "localBegin": 1852.48, "localEnd": 1859.0}, {"id": "c015_f000186", "text": "Harry wasn't listening.", "begin": 24879.823, "end": 24881.583, "localBegin": 1859.0, "localEnd": 1860.76}, {"id": "c015_f000187", "text": "\"Firenze saved me, but he shouldn't have done so. . . . Bane was furious . . . he was talking about interfering with what the planets say is going to happen. . . . They must show that Voldemort's coming back. . . . Bane thinks Firenze should have let Voldemort kill me. . . . I suppose that's written in the", "begin": 24881.583, "end": 24899.663, "localBegin": 1860.76, "localEnd": 1878.84}, {"id": "c015_f000188", "text": "stars as well.\"", "begin": 24899.663, "end": 24900.583, "localBegin": 1878.84, "localEnd": 1879.76}, {"id": "c015_f000189", "text": "\"Will you stop saying the name!\" Ron hissed.", "begin": 24900.583, "end": 24904.023, "localBegin": 1879.76, "localEnd": 1883.2}, {"id": "c015_f000190", "text": "\"So all I've got to wait for now is Snape to steal the Stone,\" Harry went on feverishly, \"then Voldemort will be able to come and finish me off. . . . Well, I suppose Bane'll be happy.\"", "begin": 24904.023, "end": 24915.303, "localBegin": 1883.2, "localEnd": 1894.48}, {"id": "c015_f000191", "text": "Hermione looked very frightened, but she had a word of comfort.", "begin": 24915.303, "end": 24919.303, "localBegin": 1894.48, "localEnd": 1898.48}, {"id": "c015_f000192", "text": "\"Harry, everyone says Dumbledore's the only one You-Know-Who was ever afraid of. With Dumbledore around, You-Know-Who won't touch you. Anyway, who says the centaurs are right? It sounds like fortune-telling to me, and Professor McGonagall says that's a very imprecise branch of magic.\"", "begin": 24919.303, "end": 24938.663, "localBegin": 1898.48, "localEnd": 1917.84}, {"id": "c015_f000193", "text": "The sky had turned light before they stopped talking. They went to bed exhausted, their throats sore. But the night's surprises weren't over.", "begin": 24938.663, "end": 24948.463, "localBegin": 1917.84, "localEnd": 1927.64}, {"id": "c015_f000194", "text": "When Harry pulled back his sheets, he found his Invisibility Cloak folded neatly underneath them. There was a note pinned to it:", "begin": 24948.463, "end": 24957.063, "localBegin": 1927.64, "localEnd": 1936.24}, {"id": "c015_f000195", "text": "Just in case.", "begin": 24957.063, "end": 24962.703, "localBegin": 1936.24, "localEnd": 1941.88}]}, {"kind": "chapter", "number": 16, "title": "Through the Trapdoor", "audio": "../Harry Potter and the Sorcerer's Stone, Book 1 (Unabridged)/016 - Harry Potter and the Sorcerer's Stone, Book 1 (Unabridged).mp3", "start": 24962.708, "end": 27436.655, "duration": 2473.947, "paragraphs": [{"id": "c016_f000001", "text": "Chapter Sixteen. Through the Trapdoor.", "begin": 24962.708, "end": 24967.308, "localBegin": 0.0, "localEnd": 4.6}, {"id": "c016_f000002", "text": "In years to come, Harry would never quite remember how he had managed to get through his exams when he half expected Voldemort to come bursting through the door at any moment. Yet the days crept by, and there could be no doubt that Fluffy was still alive and well behind the locked door.", "begin": 24967.308, "end": 24982.348, "localBegin": 4.6, "localEnd": 19.64}, {"id": "c016_f000003", "text": "It was sweltering hot, especially in the large classroom where they did their written papers. They had been given special, new quills for the exams, which had been bewitched with an Anti-Cheating spell.", "begin": 24982.348, "end": 24994.028, "localBegin": 19.64, "localEnd": 31.32}, {"id": "c016_f000004", "text": "They had practical exams as well. Professor Flitwick called them one by one into his class to see if they could make a pineapple tap-dance across a desk. Professor McGonagall watched them turn a mouse into a snuffbox - points were given for how pretty the snuffbox was, but taken away if it had whiskers. Snape made them all nervous, breathing down their necks while they tried to remember how to make a Forgetfulness potion.", "begin": 24994.028, "end": 25020.108, "localBegin": 31.32, "localEnd": 57.4}, {"id": "c016_f000005", "text": "Harry did the best he could, trying to ignore the stabbing pains in his forehead, which had been bothering him ever since his trip into the forest. Neville thought Harry had a bad case of exam nerves because Harry couldn't sleep, but the truth was that Harry kept being woken by his old nightmare, except that it was now worse than ever because there was a hooded figure dripping blood in it.", "begin": 25020.108, "end": 25043.708, "localBegin": 57.4, "localEnd": 81.0}, {"id": "c016_f000006", "text": "Maybe it was because they hadn't seen what Harry had seen in the forest, or because they didn't have scars burning on their foreheads, but Ron and Hermione didn't seem as worried about the Stone as Harry. The idea of Voldemort certainly scared them, but he didn't keep visiting them in dreams, and they were so busy with their studying they didn't have much time to fret about what Snape or anyone else might be up to.", "begin": 25043.708, "end": 25067.708, "localBegin": 81.0, "localEnd": 105.0}, {"id": "c016_f000007", "text": "Their very last exam was History of Magic. One hour of answering questions about batty old wizards who'd invented self-stirring cauldrons and they'd be free, free for a whole wonderful week until their exam results came out. When the ghost of Professor Binns told them to put down their quills and roll up their parchment, Harry couldn't help cheering with the rest.", "begin": 25067.708, "end": 25091.188, "localBegin": 105.0, "localEnd": 128.48}, {"id": "c016_f000008", "text": "\"That was far easier than I thought it would be,\" said Hermione as they joined the crowds flocking out onto the sunny grounds. \"I needn't have learned about the 1637 Werewolf Code of Conduct or the uprising of Elfric the Eager.\"", "begin": 25091.188, "end": 25107.228, "localBegin": 128.48, "localEnd": 144.52}, {"id": "c016_f000009", "text": "Hermione always liked to go through their exam papers afterward, but Ron said this made him feel ill, so they wandered down to the lake and flopped under a tree.", "begin": 25107.228, "end": 25116.828, "localBegin": 144.52, "localEnd": 154.12}, {"id": "c016_f000010", "text": "The Weasley twins and Lee Jordan were tickling the tentacles of a giant squid, which was basking in the warm shallows.", "begin": 25116.828, "end": 25123.748, "localBegin": 154.12, "localEnd": 161.04}, {"id": "c016_f000011", "text": "\"No more studying,\" Ron sighed happily, stretching out on the grass. \"You could look more cheerful, Harry, we've got a week before we find out how badly we've done, there's no need to worry yet.\"", "begin": 25123.748, "end": 25138.548, "localBegin": 161.04, "localEnd": 175.84}, {"id": "c016_f000012", "text": "Harry was rubbing his forehead.", "begin": 25138.548, "end": 25140.108, "localBegin": 175.84, "localEnd": 177.4}, {"id": "c016_f000013", "text": "\"I wish I knew what this means!\" he burst out angrily. \"My scar keeps hurting - it's happened before, but never as often as this.\"", "begin": 25140.108, "end": 25149.948, "localBegin": 177.4, "localEnd": 187.24}, {"id": "c016_f000014", "text": "\"Go to Madam Pomfrey,\" Hermione suggested.", "begin": 25149.948, "end": 25154.468, "localBegin": 187.24, "localEnd": 191.76}, {"id": "c016_f000015", "text": "\"I'm not ill,\" said Harry. \"I think it's a warning . . . it means danger's coming. . . .\"", "begin": 25154.468, "end": 25160.588, "localBegin": 191.76, "localEnd": 197.88}, {"id": "c016_f000016", "text": "Ron couldn't get worked up, it was too hot.", "begin": 25160.588, "end": 25162.828, "localBegin": 197.88, "localEnd": 200.12}, {"id": "c016_f000017", "text": "\"Harry, relax, Hermione's right, the Stone's safe as long as Dumbledore's around. Anyway, we've never had any proof Snape found out how to get past Fluffy. He nearly had his leg ripped off once, he's not going to try it again in a hurry. And Neville will play Quidditch for England before Hagrid lets Dumbledore down.\"", "begin": 25162.828, "end": 25184.188, "localBegin": 200.12, "localEnd": 221.48}, {"id": "c016_f000018", "text": "Harry nodded, but he couldn't shake off a lurking feeling that there was something he'd forgotten to do, something important. When he tried to explain this, Hermione said, \"That's just the exams. I woke up last night and was halfway through my Transfiguration notes before I remembered we'd done that one.\"", "begin": 25184.188, "end": 25202.508, "localBegin": 221.48, "localEnd": 239.8}, {"id": "c016_f000019", "text": "Harry was quite sure the unsettled feeling didn't have anything to do with work, though. He watched an owl flutter toward the school across the bright blue sky, a note clamped in its mouth. Hagrid was the only one who ever sent him letters. Hagrid would never betray Dumbledore. Hagrid would never tell anyone how to get past Fluffy . . . never . . . but -", "begin": 25202.508, "end": 25225.068, "localBegin": 239.8, "localEnd": 262.36}, {"id": "c016_f000020", "text": "Harry suddenly jumped to his feet.", "begin": 25225.068, "end": 25226.548, "localBegin": 262.36, "localEnd": 263.84}, {"id": "c016_f000021", "text": "\"Where're you going?\" said Ron sleepily.", "begin": 25226.548, "end": 25229.588, "localBegin": 263.84, "localEnd": 266.88}, {"id": "c016_f000022", "text": "\"I've just thought of something,\" said Harry. He had turned white. \"We've got to go and see Hagrid, now.\"", "begin": 25229.588, "end": 25235.868, "localBegin": 266.88, "localEnd": 273.16}, {"id": "c016_f000023", "text": "\"Why?\" panted Hermione, hurrying to keep up.", "begin": 25235.868, "end": 25239.828, "localBegin": 273.16, "localEnd": 277.12}, {"id": "c016_f000024", "text": "\"Don't you think it's a bit odd,\" said Harry, scrambling up the grassy slope,", "begin": 25239.828, "end": 25244.268, "localBegin": 277.12, "localEnd": 281.56}, {"id": "c016_f000025", "text": "\"that what Hagrid wants more than anything else is a dragon, and a stranger turns up who just happens to have an egg in his pocket? How many people wander around with dragon eggs if it's against wizard law? Lucky they found Hagrid, don't you think? Why didn't I see it before?\"", "begin": 25244.268, "end": 25261.388, "localBegin": 281.56, "localEnd": 298.68}, {"id": "c016_f000026", "text": "\"What are you talking about?\" said Ron, but Harry, sprinting across the grounds toward the forest, didn't answer.", "begin": 25261.388, "end": 25270.068, "localBegin": 298.68, "localEnd": 307.36}, {"id": "c016_f000027", "text": "Hagrid was sitting in an armchair outside his house; his trousers and sleeves were rolled up, and he was shelling peas into a large bowl.", "begin": 25270.068, "end": 25277.708, "localBegin": 307.36, "localEnd": 315.0}, {"id": "c016_f000028", "text": "\"Hullo,\" he said, smiling. \"Finished yer exams? Got time fer a drink?\"", "begin": 25277.708, "end": 25284.188, "localBegin": 315.0, "localEnd": 321.48}, {"id": "c016_f000029", "text": "\"Yes, please,\" said Ron, but Harry cut him off.", "begin": 25284.188, "end": 25288.268, "localBegin": 321.48, "localEnd": 325.56}, {"id": "c016_f000030", "text": "\"No, we're in a hurry. Hagrid, I've got to ask you something. You know that night you won Norbert? What did the stranger you were playing cards with look like?\"", "begin": 25288.268, "end": 25298.628, "localBegin": 325.56, "localEnd": 335.92}, {"id": "c016_f000031", "text": "\"Dunno,\" said Hagrid casually, \"he wouldn' take his cloak off.\"", "begin": 25298.628, "end": 25306.148, "localBegin": 335.92, "localEnd": 343.44}, {"id": "c016_f000032", "text": "He saw the three of them look stunned and raised his eyebrows.", "begin": 25306.148, "end": 25309.188, "localBegin": 343.44, "localEnd": 346.48}, {"id": "c016_f000033", "text": "\"It's not that unusual, yeh get a lot o' funny folk in the Hog's Head - that's one o' the pubs down in the village. Mighta bin a dragon dealer, mightn' he? I never saw his face, he kept his hood up.\"", "begin": 25309.188, "end": 25323.148, "localBegin": 346.48, "localEnd": 360.44}, {"id": "c016_f000034", "text": "Harry sank down next to the bowl of peas.", "begin": 25323.148, "end": 25325.628, "localBegin": 360.44, "localEnd": 362.92}, {"id": "c016_f000035", "text": "\"What did you talk to him about, Hagrid? Did you mention Hogwarts at all?\"", "begin": 25325.628, "end": 25332.548, "localBegin": 362.92, "localEnd": 369.84}, {"id": "c016_f000036", "text": "\"Mighta come up,\" said Hagrid, frowning as he tried to remember. \"Yeah . . . he asked what I did, an' I told him I was gamekeeper here. . . . He asked a bit about the sorta creatures I look after . . . so I told him . . . an' I said what I'd always really wanted was a dragon . . . an' then . . . I can' remember too well, 'cause he kept buyin' me drinks. . . . Let's see . . . yeah, then he said he had the dragon egg an' we could play cards fer it if I wanted . . . but he had ter be sure I could handle it, he didn' want it ter go ter any old home. . . . So I told him, after Fluffy, a dragon would be easy. . . .\"", "begin": 25332.548, "end": 25371.908, "localBegin": 369.84, "localEnd": 409.2}, {"id": "c016_f000037", "text": "\"And did he - did he seem interested in Fluffy?\" Harry asked, trying to keep his voice calm.", "begin": 25371.908, "end": 25380.108, "localBegin": 409.2, "localEnd": 417.4}, {"id": "c016_f000038", "text": "\"Well - yeah - how many three-headed dogs d'yeh meet, even around Hogwarts? So", "begin": 25380.108, "end": 25386.908, "localBegin": 417.4, "localEnd": 424.2}, {"id": "c016_f000039", "text": "I told him, Fluffy's a piece o' cake if yeh know how to calm him down, jus' play him a bit o' music an' he'll go straight off ter sleep - \"", "begin": 25386.908, "end": 25396.908, "localBegin": 424.2, "localEnd": 434.2}, {"id": "c016_f000040", "text": "Hagrid suddenly looked horrified.", "begin": 25396.908, "end": 25398.628, "localBegin": 434.2, "localEnd": 435.92}, {"id": "c016_f000041", "text": "\"I shouldn'ta told yeh that!\" he blurted out. \"Forget I said it! Hey where're yeh goin'?\"", "begin": 25398.628, "end": 25404.188, "localBegin": 435.92, "localEnd": 441.48}, {"id": "c016_f000042", "text": "Harry, Ron, and Hermione didn't speak to each other at all until they came to a halt in the entrance hall, which seemed very cold and gloomy after the grounds.", "begin": 25404.188, "end": 25414.348, "localBegin": 441.48, "localEnd": 451.64}, {"id": "c016_f000043", "text": "\"We've got to go to Dumbledore,\" said Harry. \"Hagrid told that stranger how to get past Fluffy, and it was either Snape or Voldemort under that cloak - it must've been easy, once he'd got Hagrid drunk. I just hope Dumbledore believes us. Firenze might back us up if Bane doesn't stop him. Where's Dumbledore's office?\"", "begin": 25414.348, "end": 25434.428, "localBegin": 451.64, "localEnd": 471.72}, {"id": "c016_f000044", "text": "They looked around, as if hoping to see a sign pointing them in the right direction. They had never been told where Dumbledore lived, nor did they know anyone who had been sent to see him.", "begin": 25434.428, "end": 25443.988, "localBegin": 471.72, "localEnd": 481.28}, {"id": "c016_f000045", "text": "\"We'll just have to - \" Harry began, but a voice suddenly rang across the hall.", "begin": 25443.988, "end": 25449.588, "localBegin": 481.28, "localEnd": 486.88}, {"id": "c016_f000046", "text": "\"What are you three doing inside?\"", "begin": 25449.588, "end": 25453.148, "localBegin": 486.88, "localEnd": 490.44}, {"id": "c016_f000047", "text": "It was Professor McGonagall, carrying a large pile of books.", "begin": 25453.148, "end": 25456.228, "localBegin": 490.44, "localEnd": 493.52}, {"id": "c016_f000048", "text": "\"We want to see Professor Dumbledore,\" said Hermione, rather bravely, Harry and Ron thought.", "begin": 25456.228, "end": 25462.588, "localBegin": 493.52, "localEnd": 499.88}, {"id": "c016_f000049", "text": "\"See Professor Dumbledore?\" Professor McGonagall repeated, as though this was a very fishy thing to want to do. \"Why?\"", "begin": 25462.588, "end": 25472.108, "localBegin": 499.88, "localEnd": 509.4}, {"id": "c016_f000050", "text": "Harry swallowed - now what?", "begin": 25472.108, "end": 25474.148, "localBegin": 509.4, "localEnd": 511.44}, {"id": "c016_f000051", "text": "\"It's sort of secret,\" he said, but he wished at once he hadn't, because Professor McGonagall's nostrils flared.", "begin": 25474.148, "end": 25482.268, "localBegin": 511.44, "localEnd": 519.56}, {"id": "c016_f000052", "text": "\"Professor Dumbledore left ten minutes ago,\" she said coldly. \"He received an urgent owl from the Ministry of Magic and flew off for London at once.\"", "begin": 25482.268, "end": 25492.228, "localBegin": 519.56, "localEnd": 529.52}, {"id": "c016_f000053", "text": "\"He's gone?\" said Harry frantically. \"Now?\"", "begin": 25492.228, "end": 25495.908, "localBegin": 529.52, "localEnd": 533.2}, {"id": "c016_f000054", "text": "\"Professor Dumbledore is a very great wizard, Potter, he has many demands on his time - \"", "begin": 25495.908, "end": 25502.188, "localBegin": 533.2, "localEnd": 539.48}, {"id": "c016_f000055", "text": "\"But this is important.\"", "begin": 25502.188, "end": 25503.828, "localBegin": 539.48, "localEnd": 541.12}, {"id": "c016_f000056", "text": "\"Something you have to say is more important than the Ministry of Magic, Potter?\"", "begin": 25503.828, "end": 25509.548, "localBegin": 541.12, "localEnd": 546.84}, {"id": "c016_f000057", "text": "\"Look,\" said Harry, throwing caution to the winds, \"Professor - it's about the Sorcerer's Stone - \"", "begin": 25509.548, "end": 25516.788, "localBegin": 546.84, "localEnd": 554.08}, {"id": "c016_f000058", "text": "Whatever Professor McGonagall had expected, it wasn't that. The books she was carrying tumbled out of her arms, but she didn't pick them up.", "begin": 25516.788, "end": 25525.148, "localBegin": 554.08, "localEnd": 562.44}, {"id": "c016_f000059", "text": "\"How do you know - ?\" she spluttered.", "begin": 25525.148, "end": 25528.788, "localBegin": 562.44, "localEnd": 566.08}, {"id": "c016_f000060", "text": "\"Professor, I think - I know - that Sn - that someone's going to try and steal the Stone. I've got to talk to Professor Dumbledore.\"", "begin": 25528.788, "end": 25540.028, "localBegin": 566.08, "localEnd": 577.32}, {"id": "c016_f000061", "text": "She eyed him with a mixture of shock and suspicion.", "begin": 25540.028, "end": 25542.508, "localBegin": 577.32, "localEnd": 579.8}, {"id": "c016_f000062", "text": "\"Professor Dumbledore will be back tomorrow,\" she said finally. \"I don't know how you found out about the Stone, but rest assured, no one can possibly steal it, it's too well protected.\"", "begin": 25542.508, "end": 25555.628, "localBegin": 579.8, "localEnd": 592.92}, {"id": "c016_f000063", "text": "\"But Professor - \"", "begin": 25555.628, "end": 25557.028, "localBegin": 592.92, "localEnd": 594.32}, {"id": "c016_f000064", "text": "\"Potter, I know what I'm talking about,\" she said shortly. She bent down and gathered up the fallen books. \"I suggest you all go back outside and enjoy the sunshine.\"", "begin": 25557.028, "end": 25568.588, "localBegin": 594.32, "localEnd": 605.88}, {"id": "c016_f000065", "text": "But they didn't.", "begin": 25568.588, "end": 25569.268, "localBegin": 605.88, "localEnd": 606.56}, {"id": "c016_f000066", "text": "\"It's tonight,\" said Harry, once he was sure Professor McGonagall was out of earshot. \"Snape's going through the trapdoor tonight. He's found out everything he needs, and now he's got Dumbledore out of the way. He sent that note, I bet the Ministry of Magic will get a real shock when Dumbledore turns up.\"", "begin": 25569.268, "end": 25587.588, "localBegin": 606.56, "localEnd": 624.88}, {"id": "c016_f000067", "text": "\"But what can we - \"", "begin": 25587.588, "end": 25590.188, "localBegin": 624.88, "localEnd": 627.48}, {"id": "c016_f000068", "text": "Hermione gasped. Harry and Ron wheeled round.", "begin": 25590.188, "end": 25593.668, "localBegin": 627.48, "localEnd": 630.96}, {"id": "c016_f000069", "text": "Snape was standing there.", "begin": 25593.668, "end": 25595.188, "localBegin": 630.96, "localEnd": 632.48}, {"id": "c016_f000070", "text": "\"Good afternoon,\" he said smoothly.", "begin": 25595.188, "end": 25599.748, "localBegin": 632.48, "localEnd": 637.04}, {"id": "c016_f000071", "text": "They stared at him.", "begin": 25599.748, "end": 25600.628, "localBegin": 637.04, "localEnd": 637.92}, {"id": "c016_f000072", "text": "\"You shouldn't be inside on a day like this,\" he said, with an odd, twisted", "begin": 25600.628, "end": 25606.428, "localBegin": 637.92, "localEnd": 643.72}, {"id": "c016_f000073", "text": "smile.", "begin": 25606.428, "end": 25606.908, "localBegin": 643.72, "localEnd": 644.2}, {"id": "c016_f000074", "text": "\"We were - \" Harry began, without any idea what he was going to say.", "begin": 25606.908, "end": 25612.148, "localBegin": 644.2, "localEnd": 649.44}, {"id": "c016_f000075", "text": "\"You want to be more careful,\" said Snape. \"Hanging around like this, people will think you're up to something. And Gryffindor really can't afford to lose any more points, can it?\"", "begin": 25612.148, "end": 25626.268, "localBegin": 649.44, "localEnd": 663.56}, {"id": "c016_f000076", "text": "Harry flushed. They turned to go outside, but Snape called them back.", "begin": 25626.268, "end": 25630.548, "localBegin": 663.56, "localEnd": 667.84}, {"id": "c016_f000077", "text": "\"Be warned, Potter - any more nighttime wanderings and I will personally make sure you are expelled. Good day to you.\"", "begin": 25630.548, "end": 25642.188, "localBegin": 667.84, "localEnd": 679.48}, {"id": "c016_f000078", "text": "He strode off in the direction of the staffroom.", "begin": 25642.188, "end": 25645.788, "localBegin": 679.48, "localEnd": 683.08}, {"id": "c016_f000079", "text": "Out on the stone steps, Harry turned to the others.", "begin": 25645.788, "end": 25648.548, "localBegin": 683.08, "localEnd": 685.84}, {"id": "c016_f000080", "text": "\"Right, here's what we've got to do,\" he whispered urgently. \"One of us has got to keep an eye on Snape - wait outside the staffroom and follow him if he leaves it. Hermione, you'd better do that.\"", "begin": 25648.548, "end": 25661.348, "localBegin": 685.84, "localEnd": 698.64}, {"id": "c016_f000081", "text": "\"Why me?\"", "begin": 25661.348, "end": 25662.468, "localBegin": 698.64, "localEnd": 699.76}, {"id": "c016_f000082", "text": "\"It's obvious,\" said Ron. \"You can pretend to be waiting for Professor Flitwick, you know.\" He put on a high voice, \"'Oh Professor Flitwick, I'm so worried, I think I got question fourteen b wrong. . . .'\"", "begin": 25662.468, "end": 25675.868, "localBegin": 699.76, "localEnd": 713.16}, {"id": "c016_f000083", "text": "\"Oh, shut up,\" said Hermione, but she agreed to go and watch out for Snape.", "begin": 25675.868, "end": 25680.948, "localBegin": 713.16, "localEnd": 718.24}, {"id": "c016_f000084", "text": "\"And we'd better stay outside the third-floor corridor,\" Harry told Ron. \"Come on.\"", "begin": 25680.948, "end": 25687.468, "localBegin": 718.24, "localEnd": 724.76}, {"id": "c016_f000085", "text": "But that part of the plan didn't work. No sooner had they reached the door separating Fluffy from the rest of the school than Professor McGonagall turned up again and this time, she lost her temper.", "begin": 25687.468, "end": 25698.348, "localBegin": 724.76, "localEnd": 735.64}, {"id": "c016_f000086", "text": "\"I suppose you think you're harder to get past than a pack of enchantments!\" she stormed. \"Enough of this nonsense! If I hear you've come anywhere near here again, I'll take another fifty points from Gryffindor! Yes, Weasley, from my own House!\"", "begin": 25698.348, "end": 25715.948, "localBegin": 735.64, "localEnd": 753.24}, {"id": "c016_f000087", "text": "Harry and Ron went back to the common room. Harry had just said, \"At least Hermione's on Snape's tail,\" when the portrait of the Fat Lady swung open and Hermione came in.", "begin": 25715.948, "end": 25727.588, "localBegin": 753.24, "localEnd": 764.88}, {"id": "c016_f000088", "text": "\"I'm sorry, Harry!\" she wailed. \"Snape came out and asked me what I was doing, so I said I was waiting for Flitwick, and Snape went to get him, and I've only just got away, I don't know where Snape went.\"", "begin": 25727.588, "end": 25742.548, "localBegin": 764.88, "localEnd": 779.84}, {"id": "c016_f000089", "text": "\"Well, that's it then, isn't it?\" Harry said.", "begin": 25742.548, "end": 25747.108, "localBegin": 779.84, "localEnd": 784.4}, {"id": "c016_f000090", "text": "The other two stared at him. He was pale and his eyes were glittering.", "begin": 25747.108, "end": 25751.188, "localBegin": 784.4, "localEnd": 788.48}, {"id": "c016_f000091", "text": "\"I'm going out of here tonight and I'm going to try and get to the Stone first.\"", "begin": 25751.188, "end": 25756.788, "localBegin": 788.48, "localEnd": 794.08}, {"id": "c016_f000092", "text": "\"You're mad!\" said Ron.", "begin": 25756.788, "end": 25759.068, "localBegin": 794.08, "localEnd": 796.36}, {"id": "c016_f000093", "text": "\"You can't!\" said Hermione. \"After what McGonagall and Snape have said? You'll be expelled!\"", "begin": 25759.068, "end": 25766.068, "localBegin": 796.36, "localEnd": 803.36}, {"id": "c016_f000094", "text": "\"SO WHAT?\" Harry shouted. \"Don't you understand? If Snape gets hold of the Stone, Voldemort's coming back! Haven't you heard what it was like when he was trying to take over? There won't be any Hogwarts to get expelled from! He'll flatten it, or turn it into a school for the Dark Arts! Losing points doesn't matter anymore, can't you see? D'you think he'll leave you and your families alone if Gryffindor wins the House Cup? If I get caught before I can get to the Stone, well, I'll have to go back to the Dursleys and wait for Voldemort to find me there, it's only dying a bit later than I would have, because I'm never going over to the Dark Side! I'm going through that trapdoor tonight and nothing you two say is going to stop me! Voldemort killed my parents, remember?\"", "begin": 25766.068, "end": 25815.268, "localBegin": 803.36, "localEnd": 852.56}, {"id": "c016_f000095", "text": "He glared at them.", "begin": 25815.268, "end": 25816.948, "localBegin": 852.56, "localEnd": 854.24}, {"id": "c016_f000096", "text": "\"You're right, Harry,\" said Hermione in a small voice.", "begin": 25816.948, "end": 25821.548, "localBegin": 854.24, "localEnd": 858.84}, {"id": "c016_f000097", "text": "\"I'll use the Invisibility Cloak,\" said Harry. \"It's just lucky I got it back.\"", "begin": 25821.548, "end": 25826.988, "localBegin": 858.84, "localEnd": 864.28}, {"id": "c016_f000098", "text": "\"But will it cover all three of us?\" said Ron.", "begin": 25826.988, "end": 25830.868, "localBegin": 864.28, "localEnd": 868.16}, {"id": "c016_f000099", "text": "\"All - all three of us?\"", "begin": 25830.868, "end": 25832.148, "localBegin": 868.16, "localEnd": 869.44}, {"id": "c016_f000100", "text": "\"Oh, come off it, you don't think we'd let you go alone?\"", "begin": 25832.148, "end": 25834.748, "localBegin": 869.44, "localEnd": 872.04}, {"id": "c016_f000101", "text": "\"Of course not,\" said Hermione briskly. \"How do you think you'd get to the Stone without us? I'd better go and look through my books, there might be something useful. . . .\"", "begin": 25834.748, "end": 25843.348, "localBegin": 872.04, "localEnd": 880.64}, {"id": "c016_f000102", "text": "\"But if we get caught, you two will be expelled, too.\"", "begin": 25843.348, "end": 25847.748, "localBegin": 880.64, "localEnd": 885.04}, {"id": "c016_f000103", "text": "\"Not if I can help it,\" said Hermione grimly. \"Flitwick told me in secret that I got a hundred and twelve percent on his exam. They're not throwing me out after that.\"", "begin": 25847.748, "end": 25860.748, "localBegin": 885.04, "localEnd": 898.04}, {"id": "c016_f000104", "text": "After dinner the three of them sat nervously apart in the common room. Nobody bothered them; none of the Gryffindors had anything to say to Harry any more, after all. This was the first night he hadn't been upset by it. Hermione was skimming through all her notes, hoping to come across one of the enchantments they were about to try to break. Harry and Ron didn't talk much. Both of them were thinking about what they were about to do.", "begin": 25860.748, "end": 25883.708, "localBegin": 898.04, "localEnd": 921.0}, {"id": "c016_f000105", "text": "Slowly, the room emptied as people drifted off to bed.", "begin": 25883.708, "end": 25887.348, "localBegin": 921.0, "localEnd": 924.64}, {"id": "c016_f000106", "text": "\"Better get the Cloak,\" Ron muttered, as Lee Jordan finally left, stretching and yawning. Harry ran upstairs to their dark dormitory. He pulled out the Cloak and then his eyes fell on the flute Hagrid had given him for Christmas. He pocketed it to use on Fluffy - he didn't feel much like singing.", "begin": 25887.348, "end": 25906.428, "localBegin": 924.64, "localEnd": 943.72}, {"id": "c016_f000107", "text": "He ran back down to the common room.", "begin": 25906.428, "end": 25908.828, "localBegin": 943.72, "localEnd": 946.12}, {"id": "c016_f000108", "text": "\"We'd better put the Cloak on here, and make sure it covers all three of us if Filch spots one of our feet wandering along on its own - \"", "begin": 25908.828, "end": 25917.548, "localBegin": 946.12, "localEnd": 954.84}, {"id": "c016_f000109", "text": "\"What are you doing?\" said a voice from the corner of the room. Neville appeared from behind an armchair, clutching Trevor the toad, who looked as though he'd been making another bid for freedom.", "begin": 25917.548, "end": 25929.668, "localBegin": 954.84, "localEnd": 966.96}, {"id": "c016_f000110", "text": "\"Nothing, Neville, nothing,\" said Harry, hurriedly putting the Cloak behind his back.", "begin": 25929.668, "end": 25936.228, "localBegin": 966.96, "localEnd": 973.52}, {"id": "c016_f000111", "text": "Neville stared at their guilty faces.", "begin": 25936.228, "end": 25938.148, "localBegin": 973.52, "localEnd": 975.44}, {"id": "c016_f000112", "text": "\"You're going out again,\" he said.", "begin": 25938.148, "end": 25940.988, "localBegin": 975.44, "localEnd": 978.28}, {"id": "c016_f000113", "text": "\"No, no, no,\" said Hermione. \"No, we're not. Why don't you go to bed, Neville?\"", "begin": 25940.988, "end": 25947.868, "localBegin": 978.28, "localEnd": 985.16}, {"id": "c016_f000114", "text": "Harry looked at the grandfather clock by the door. They couldn't afford to waste any more time, Snape might even now be playing Fluffy to sleep.", "begin": 25947.868, "end": 25955.988, "localBegin": 985.16, "localEnd": 993.28}, {"id": "c016_f000115", "text": "\"You can't go out,\" said Neville, \"you'll be caught again. Gryffindor will be in even more trouble.\"", "begin": 25955.988, "end": 25961.988, "localBegin": 993.28, "localEnd": 999.28}, {"id": "c016_f000116", "text": "\"You don't understand,\" said Harry, \"this is important.\"", "begin": 25961.988, "end": 25966.228, "localBegin": 999.28, "localEnd": 1003.52}, {"id": "c016_f000117", "text": "But Neville was clearly steeling himself to do something desperate.", "begin": 25966.228, "end": 25970.108, "localBegin": 1003.52, "localEnd": 1007.4}, {"id": "c016_f000118", "text": "\"I won't let you do it,\" he said, hurrying to stand in front of the portrait hole. \"I'll - I'll fight you!\"", "begin": 25970.108, "end": 25977.548, "localBegin": 1007.4, "localEnd": 1014.84}, {"id": "c016_f000119", "text": "\"Neville,\" Ron exploded, \"get away from that hole and don't be an idiot - \"", "begin": 25977.548, "end": 25983.828, "localBegin": 1014.84, "localEnd": 1021.12}, {"id": "c016_f000120", "text": "\"Don't you call me an idiot!\" said Neville. \"I don't think you should be breaking any more rules! And you were the one who told me to stand up to people!\"", "begin": 25983.828, "end": 25993.348, "localBegin": 1021.12, "localEnd": 1030.64}, {"id": "c016_f000121", "text": "\"Yes, but not to us,\" said Ron in exasperation. \"Neville, you don't know what you're doing.\"", "begin": 25993.348, "end": 26001.948, "localBegin": 1030.64, "localEnd": 1039.24}, {"id": "c016_f000122", "text": "He took a step forward and Neville dropped Trevor the toad, who leapt out of sight.", "begin": 26001.948, "end": 26006.108, "localBegin": 1039.24, "localEnd": 1043.4}, {"id": "c016_f000123", "text": "\"Go on then, try and hit me!\" said Neville, raising his fists. \"I'm ready!\"", "begin": 26006.108, "end": 26010.748, "localBegin": 1043.4, "localEnd": 1048.04}, {"id": "c016_f000124", "text": "Harry turned to Hermione.", "begin": 26010.748, "end": 26012.988, "localBegin": 1048.04, "localEnd": 1050.28}, {"id": "c016_f000125", "text": "\"Do something,\" he said desperately.", "begin": 26012.988, "end": 26016.708, "localBegin": 1050.28, "localEnd": 1054.0}, {"id": "c016_f000126", "text": "Hermione stepped forward.", "begin": 26016.708, "end": 26018.468, "localBegin": 1054.0, "localEnd": 1055.76}, {"id": "c016_f000127", "text": "\"Neville,\" she said, \"I'm really, really sorry about this.\"", "begin": 26018.468, "end": 26023.708, "localBegin": 1055.76, "localEnd": 1061.0}, {"id": "c016_f000128", "text": "She raised her wand.", "begin": 26023.708, "end": 26025.228, "localBegin": 1061.0, "localEnd": 1062.52}, {"id": "c016_f000129", "text": "\"Petrificus Totalus!\" she cried, pointing it at Neville.", "begin": 26025.228, "end": 26030.188, "localBegin": 1062.52, "localEnd": 1067.48}, {"id": "c016_f000130", "text": "Neville's arms snapped to his sides. His legs sprang together. His whole body rigid, he swayed where he stood and then fell flat on his face, stiff as a board.", "begin": 26030.188, "end": 26040.748, "localBegin": 1067.48, "localEnd": 1078.04}, {"id": "c016_f000131", "text": "Hermione ran to turn him over. Neville's jaws were jammed together so he couldn't speak. Only his eyes were moving, looking at them in horror.", "begin": 26040.748, "end": 26050.468, "localBegin": 1078.04, "localEnd": 1087.76}, {"id": "c016_f000132", "text": "\"What've you done to him?\" Harry whispered.", "begin": 26050.468, "end": 26054.548, "localBegin": 1087.76, "localEnd": 1091.84}, {"id": "c016_f000133", "text": "\"It's the full Body-Bind,\" said Hermione miserably. \"Oh, Neville, I'm so sorry.\"", "begin": 26054.548, "end": 26062.908, "localBegin": 1091.84, "localEnd": 1100.2}, {"id": "c016_f000134", "text": "\"We had to, Neville, no time to explain,\" said Harry.", "begin": 26062.908, "end": 26066.948, "localBegin": 1100.2, "localEnd": 1104.24}, {"id": "c016_f000135", "text": "\"You'll understand later, Neville,\" said Ron as they stepped over him and pulled on the Invisibility Cloak.", "begin": 26066.948, "end": 26074.108, "localBegin": 1104.24, "localEnd": 1111.4}, {"id": "c016_f000136", "text": "But leaving Neville lying motionless on the floor didn't feel like a very good omen. In their nervous state, every statue's shadow looked like Filch, every distant breath of wind sounded like Peeves swooping down on them.", "begin": 26074.108, "end": 26087.228, "localBegin": 1111.4, "localEnd": 1124.52}, {"id": "c016_f000137", "text": "At the foot of the first set of stairs, they spotted Mrs. Norris skulking near the top.", "begin": 26087.228, "end": 26093.068, "localBegin": 1124.52, "localEnd": 1130.36}, {"id": "c016_f000138", "text": "\"Oh, let's kick her, just this once,\" Ron whispered in Harry's ear, but Harry shook his head. As they climbed carefully around her, Mrs. Norris turned her lamplike eyes on them, but didn't do anything.", "begin": 26093.068, "end": 26106.708, "localBegin": 1130.36, "localEnd": 1144.0}, {"id": "c016_f000139", "text": "They didn't meet anyone else until they reached the staircase up to the third floor. Peeves was bobbing halfway up, loosening the carpet so that people would trip.", "begin": 26106.708, "end": 26117.988, "localBegin": 1144.0, "localEnd": 1155.28}, {"id": "c016_f000140", "text": "\"Who's there?\" he said suddenly as they climbed toward him. He narrowed his wicked black eyes. \"Know you're there, even if I can't see you. Are you ghoulie or ghostie or wee student beastie?\"", "begin": 26117.988, "end": 26132.628, "localBegin": 1155.28, "localEnd": 1169.92}, {"id": "c016_f000141", "text": "He rose up in the air and floated there, squinting at them.", "begin": 26132.628, "end": 26136.348, "localBegin": 1169.92, "localEnd": 1173.64}, {"id": "c016_f000142", "text": "\"Should call Filch, I should, if something's a-creeping around unseen.\"", "begin": 26136.348, "end": 26142.028, "localBegin": 1173.64, "localEnd": 1179.32}, {"id": "c016_f000143", "text": "Harry had a sudden idea.", "begin": 26142.028, "end": 26144.228, "localBegin": 1179.32, "localEnd": 1181.52}, {"id": "c016_f000144", "text": "\"Peeves,\" he said, in a hoarse whisper, \"the Bloody Baron has his own reasons for being invisible.\"", "begin": 26144.228, "end": 26154.748, "localBegin": 1181.52, "localEnd": 1192.04}, {"id": "c016_f000145", "text": "Peeves almost fell out of the air in shock. He caught himself in time and hovered about a foot off the stairs.", "begin": 26154.748, "end": 26162.388, "localBegin": 1192.04, "localEnd": 1199.68}, {"id": "c016_f000146", "text": "\"So sorry, your bloodiness, Mr. Baron, sir,\" he said greasily. \"My mistake, my mistake - I didn't see you - of course I didn't, you're invisible - forgive old Peevsie his little joke, sir.\"", "begin": 26162.388, "end": 26177.468, "localBegin": 1199.68, "localEnd": 1214.76}, {"id": "c016_f000147", "text": "\"I have business here, Peeves,\" croaked Harry. \"Stay away from this place tonight.\"", "begin": 26177.468, "end": 26185.468, "localBegin": 1214.76, "localEnd": 1222.76}, {"id": "c016_f000148", "text": "\"I will, sir, I most certainly will,\" said Peeves, rising up in the air again. \"Hope your business goes well, Baron, I'll not bother you.\"", "begin": 26185.468, "end": 26195.228, "localBegin": 1222.76, "localEnd": 1232.52}, {"id": "c016_f000149", "text": "And he scooted off.", "begin": 26195.228, "end": 26197.108, "localBegin": 1232.52, "localEnd": 1234.4}, {"id": "c016_f000150", "text": "\"Brilliant, Harry!\" whispered Ron.", "begin": 26197.108, "end": 26201.148, "localBegin": 1234.4, "localEnd": 1238.44}, {"id": "c016_f000151", "text": "A few seconds later, they were there, outside the third-floor corridor - and the door was already ajar.", "begin": 26201.148, "end": 26207.428, "localBegin": 1238.44, "localEnd": 1244.72}, {"id": "c016_f000152", "text": "\"Well, there you are,\" Harry said quietly, \"Snape's already got past Fluffy.\"", "begin": 26207.428, "end": 26214.348, "localBegin": 1244.72, "localEnd": 1251.64}, {"id": "c016_f000153", "text": "Seeing the open door somehow seemed to impress upon all three of them what was facing them. Underneath the Cloak, Harry turned to the other two.", "begin": 26214.348, "end": 26222.908, "localBegin": 1251.64, "localEnd": 1260.2}, {"id": "c016_f000154", "text": "\"If you want to go back, I won't blame you,\" he said. \"You can take the Cloak, I won't need it now.\"", "begin": 26222.908, "end": 26229.708, "localBegin": 1260.2, "localEnd": 1267.0}, {"id": "c016_f000155", "text": "\"Don't be stupid,\" said Ron.", "begin": 26229.708, "end": 26232.788, "localBegin": 1267.0, "
