lins?\"", "begin": 6171.843, "end": 6173.323, "localBegin": 189.08, "localEnd": 190.56}, {"id": "c005_f000034", "text": "\"Yeah - so yeh'd be mad ter try an' rob it, I'll tell yeh that. Never mess with goblins, Harry. Gringotts is the safest place in the world fer anything yeh want ter keep safe - 'cept maybe Hogwarts. As a matter o' fact, I gotta visit Gringotts anyway. Fer Dumbledore. Hogwarts business.\" Hagrid drew himself up", "begin": 6173.323, "end": 6195.483, "localBegin": 190.56, "localEnd": 212.72}, {"id": "c005_f000035", "text": "proudly. \"He usually gets me ter do important stuff fer him. Fetchin' you gettin' things from Gringotts - knows he can trust me, see.", "begin": 6195.483, "end": 6204.483, "localBegin": 212.72, "localEnd": 221.72}, {"id": "c005_f000036", "text": "\"Got everythin'? Come on, then.\"", "begin": 6204.483, "end": 6208.683, "localBegin": 221.72, "localEnd": 225.92}, {"id": "c005_f000037", "text": "Harry followed Hagrid out onto the rock. The sky was quite clear now and the sea gleamed in the sunlight. The boat Uncle Vernon had hired was still there, with a lot of water in the bottom after the storm.", "begin": 6208.683, "end": 6219.923, "localBegin": 225.92, "localEnd": 237.16}, {"id": "c005_f000038", "text": "\"How did you get here?\" Harry asked, looking around for another boat.", "begin": 6219.923, "end": 6224.843, "localBegin": 237.16, "localEnd": 242.08}, {"id": "c005_f000039", "text": "\"Flew,\" said Hagrid.", "begin": 6224.843, "end": 6226.963, "localBegin": 242.08, "localEnd": 244.2}, {"id": "c005_f000040", "text": "\"Flew?\"", "begin": 6226.963, "end": 6227.723, "localBegin": 244.2, "localEnd": 244.96}, {"id": "c005_f000041", "text": "\"Yeah - but we'll go back in this. Not s'pposed ter use magic now I've got yeh.\"", "begin": 6227.723, "end": 6234.483, "localBegin": 244.96, "localEnd": 251.72}, {"id": "c005_f000042", "text": "They settled down in the boat, Harry still staring at Hagrid, trying to imagine him flying.", "begin": 6234.483, "end": 6239.683, "localBegin": 251.72, "localEnd": 256.92}, {"id": "c005_f000043", "text": "\"Seems a shame ter row, though,\" said Hagrid, giving Harry another of his sideways looks. \"If I was ter - er - speed things up a bit, would yeh mind not mentionin' it at Hogwarts?\"", "begin": 6239.683, "end": 6252.283, "localBegin": 256.92, "localEnd": 269.52}, {"id": "c005_f000044", "text": "\"Of course not,\" said Harry, eager to see more magic. Hagrid pulled out the pink umbrella again, tapped it twice on the side of the boat, and they sped off toward land.", "begin": 6252.283, "end": 6262.443, "localBegin": 269.52, "localEnd": 279.68}, {"id": "c005_f000045", "text": "\"Why would you be mad to try and rob Gringotts?\" Harry asked.", "begin": 6262.443, "end": 6267.043, "localBegin": 279.68, "localEnd": 284.28}, {"id": "c005_f000046", "text": "\"Spells - enchantments,\" said Hagrid, unfolding his newspaper as he spoke. \"They say there's dragons guardin' the high-security vaults. And then yeh gotta find yer way - Gringotts is hundreds of miles under London, see. Deep under the Underground. Yeh'd die of hunger tryin' ter get out, even if yeh did manage ter get yer hands on summat.\"", "begin": 6267.043, "end": 6291.403, "localBegin": 284.28, "localEnd": 308.64}, {"id": "c005_f000047", "text": "Harry sat and thought about this while Hagrid read his newspaper, the Daily Prophet. Harry had learned from Uncle Vernon that people liked to be left alone while they did this, but it was very difficult, he'd never had so many questions in his life.", "begin": 6291.403, "end": 6306.163, "localBegin": 308.64, "localEnd": 323.4}, {"id": "c005_f000048", "text": "\"Ministry o' Magic messin' things up as usual,\" Hagrid muttered, turning the page.", "begin": 6306.163, "end": 6312.803, "localBegin": 323.4, "localEnd": 330.04}, {"id": "c005_f000049", "text": "\"There's a Ministry of Magic?\" Harry asked, before he could stop himself.", "begin": 6312.803, "end": 6316.843, "localBegin": 330.04, "localEnd": 334.08}, {"id": "c005_f000050", "text": "\"'Course,\" said Hagrid. \"They wanted Dumbledore fer Minister, o' course, but he'd never leave Hogwarts, so old Cornelius Fudge got the job. Bungler if ever there was one. So he pelts Dumbledore with owls every morning, askin' fer advice.\"", "begin": 6316.843, "end": 6333.563, "localBegin": 334.08, "localEnd": 350.8}, {"id": "c005_f000051", "text": "\"But what does a Ministry of Magic do?\"", "begin": 6333.563, "end": 6337.163, "localBegin": 350.8, "localEnd": 354.4}, {"id": "c005_f000052", "text": "\"Well, their main job is to keep it from the Muggles that there's still witches an' wizards up an' down the country.\"", "begin": 6337.163, "end": 6344.443, "localBegin": 354.4, "localEnd": 361.68}, {"id": "c005_f000053", "text": "\"Why?\"", "begin": 6344.443, "end": 6345.723, "localBegin": 361.68, "localEnd": 362.96}, {"id": "c005_f000054", "text": "\"Why? Blimey, Harry, everyone'd be wantin' magic solutions to their problems. Nah, we're best left alone.\"", "begin": 6345.723, "end": 6356.203, "localBegin": 362.96, "localEnd": 373.44}, {"id": "c005_f000055", "text": "At this moment the boat bumped gently into the harbor wall. Hagrid folded up his newspaper, and they clambered up the stone steps onto the street.", "begin": 6356.203, "end": 6363.643, "localBegin": 373.44, "localEnd": 380.88}, {"id": "c005_f000056", "text": "Passersby stared a lot at Hagrid as they walked through the little town to the station. Harry couldn't blame them. Not only was Hagrid twice as tall as anyone else, he kept pointing at perfectly ordinary things like parking meters and saying loudly, \"See that, Harry? Things these Muggles dream up, eh?\"", "begin": 6363.643, "end": 6382.843, "localBegin": 380.88, "localEnd": 400.08}, {"id": "c005_f000057", "text": "\"Hagrid,\" said Harry, panting a bit as he ran to keep up, \"did you say there are dragons at Gringotts?\"", "begin": 6382.843, "end": 6390.163, "localBegin": 400.08, "localEnd": 407.4}, {"id": "c005_f000058", "text": "\"Well, so they say,\" said Hagrid. \"Crikey, I'd like a dragon.\"", "begin": 6390.163, "end": 6395.923, "localBegin": 407.4, "localEnd": 413.16}, {"id": "c005_f000059", "text": "\"You'd like one?\"", "begin": 6395.923, "end": 6397.683, "localBegin": 413.16, "localEnd": 414.92}, {"id": "c005_f000060", "text": "\"Wanted one ever since I was a kid - here we go.\"", "begin": 6397.683, "end": 6402.883, "localBegin": 414.92, "localEnd": 420.12}, {"id": "c005_f000061", "text": "They had reached the station. There was a train to London in five minutes' time. Hagrid, who didn't understand \"Muggle money,\" as he called it, gave the bills to Harry so he could buy their tickets.", "begin": 6402.883, "end": 6413.643, "localBegin": 420.12, "localEnd": 430.88}, {"id": "c005_f000062", "text": "People stared more than ever on the train. Hagrid took up two seats and sat knitting what looked like a canary-yellow circus tent.", "begin": 6413.643, "end": 6422.403, "localBegin": 430.88, "localEnd": 439.64}, {"id": "c005_f000063", "text": "\"Still got yer letter, Harry?\" he asked as he counted stitches.", "begin": 6422.403, "end": 6427.563, "localBegin": 439.64, "localEnd": 444.8}, {"id": "c005_f000064", "text": "Harry took the parchment envelope out of his pocket.", "begin": 6427.563, "end": 6430.723, "localBegin": 444.8, "localEnd": 447.96}, {"id": "c005_f000065", "text": "\"Good,\" said Hagrid. \"There's a list there of everything yeh need.\"", "begin": 6430.723, "end": 6436.803, "localBegin": 447.96, "localEnd": 454.04}, {"id": "c005_f000066", "text": "Harry unfolded a second piece of paper he hadn't noticed the night before, and read:", "begin": 6436.803, "end": 6441.003, "localBegin": 454.04, "localEnd": 458.24}, {"id": "c005_f000067", "text": "HOGWARTS SCHOOL", "begin": 6441.003, "end": 6442.923, "localBegin": 458.24, "localEnd": 460.16}, {"id": "c005_f000068", "text": "of WITCHCRAFT and WIZARDRY", "begin": 6442.923, "end": 6445.163, "localBegin": 460.16, "localEnd": 462.4}, {"id": "c005_f000069", "text": "UNIFORM", "begin": 6445.163, "end": 6446.443, "localBegin": 462.4, "localEnd": 463.68}, {"id": "c005_f000070", "text": "First-year students will require:", "begin": 6446.443, "end": 6448.243, "localBegin": 463.68, "localEnd": 465.48}, {"id": "c005_f000071", "text": "1. Three sets of plain work robes (black)", "begin": 6448.243, "end": 6451.523, "localBegin": 465.48, "localEnd": 468.76}, {"id": "c005_f000072", "text": "2. One plain pointed hat (black) for day wear", "begin": 6451.523, "end": 6456.003, "localBegin": 468.76, "localEnd": 473.24}, {"id": "c005_f000073", "text": "3. One pair of protective gloves (dragon hide or similar)", "begin": 6456.003, "end": 6460.283, "localBegin": 473.24, "localEnd": 477.52}, {"id": "c005_f000074", "text": "4. One winter cloak (black, silver fastenings)", "begin": 6460.283, "end": 6464.163, "localBegin": 477.52, "localEnd": 481.4}, {"id": "c005_f000075", "text": "Please note that all pupils' clothes should carry name tags", "begin": 6464.163, "end": 6468.083, "localBegin": 481.4, "localEnd": 485.32}, {"id": "c005_f000076", "text": "COURSE BOOKS", "begin": 6468.083, "end": 6470.203, "localBegin": 485.32, "localEnd": 487.44}, {"id": "c005_f000077", "text": "All students should have a copy of each of the following:", "begin": 6470.203, "end": 6472.723, "localBegin": 487.44, "localEnd": 489.96}, {"id": "c005_f000078", "text": "The Standard Book of Spells (Grade 1) by Miranda Goshawk", "begin": 6472.723, "end": 6477.163, "localBegin": 489.96, "localEnd": 494.4}, {"id": "c005_f000079", "text": "A History of Magic by Bathilda Bagshot", "begin": 6477.163, "end": 6480.163, "localBegin": 494.4, "localEnd": 497.4}, {"id": "c005_f000080", "text": "Magical Theory by Adalbert Waffling", "begin": 6480.163, "end": 6483.083, "localBegin": 497.4, "localEnd": 500.32}, {"id": "c005_f000081", "text": "A Beginners' Guide to Transfiguration by Emeric Switch", "begin": 6483.083, "end": 6486.763, "localBegin": 500.32, "localEnd": 504.0}, {"id": "c005_f000082", "text": "One Thousand Magical Herbs and Fungi by Phyllida Spore", "begin": 6486.763, "end": 6490.923, "localBegin": 504.0, "localEnd": 508.16}, {"id": "c005_f000083", "text": "Magical Draughts and Potions by Arsenius Jigger", "begin": 6490.923, "end": 6494.363, "localBegin": 508.16, "localEnd": 511.6}, {"id": "c005_f000084", "text": "Fantastic Beasts and Where to Find Them by Newt Scamander", "begin": 6494.363, "end": 6499.083, "localBegin": 511.6, "localEnd": 516.32}, {"id": "c005_f000085", "text": "The Dark Forces: A Guide to Self-Protection by Quentin Trimble", "begin": 6499.083, "end": 6503.083, "localBegin": 516.32, "localEnd": 520.32}, {"id": "c005_f000086", "text": "OTHER EQUIPMENT", "begin": 6503.083, "end": 6504.923, "localBegin": 520.32, "localEnd": 522.16}, {"id": "c005_f000087", "text": "1 wand", "begin": 6504.923, "end": 6505.923, "localBegin": 522.16, "localEnd": 523.16}, {"id": "c005_f000088", "text": "1 cauldron (pewter, standard size 2)", "begin": 6505.923, "end": 6508.683, "localBegin": 523.16, "localEnd": 525.92}, {"id": "c005_f000089", "text": "1 set glass or crystal phials", "begin": 6508.683, "end": 6511.163, "localBegin": 525.92, "localEnd": 528.4}, {"id": "c005_f000090", "text": "1 telescope", "begin": 6511.163, "end": 6512.043, "localBegin": 528.4, "localEnd": 529.28}, {"id": "c005_f000091", "text": "1 set brass scales", "begin": 6512.043, "end": 6514.763, "localBegin": 529.28, "localEnd": 532.0}, {"id": "c005_f000092", "text": "Students may also bring an owl OR a cat OR a toad", "begin": 6514.763, "end": 6519.163, "localBegin": 532.0, "localEnd": 536.4}, {"id": "c005_f000093", "text": "PARENTS ARE REMINDED THAT FIRST YEARS ARE NOT ALLOWED THEIR OWN BROOMSTICKS", "begin": 6519.163, "end": 6524.403, "localBegin": 536.4, "localEnd": 541.64}, {"id": "c005_f000094", "text": "\"Can we buy all this in London?\" Harry wondered aloud.", "begin": 6524.403, "end": 6529.003, "localBegin": 541.64, "localEnd": 546.24}, {"id": "c005_f000095", "text": "\"If yeh know where to go,\" said Hagrid.", "begin": 6529.003, "end": 6532.203, "localBegin": 546.24, "localEnd": 549.44}, {"id": "c005_f000096", "text": "Harry had never been to London before. Although Hagrid seemed to know where he was going, he was obviously not used to getting there in an ordinary way. He got stuck in the ticket barrier on the Underground, and complained loudly that the seats were too small and the trains too slow.", "begin": 6532.203, "end": 6550.243, "localBegin": 549.44, "localEnd": 567.48}, {"id": "c005_f000097", "text": "\"I don't know how the Muggles manage without magic,\" he said as they climbed a broken-down escalator that led up to a bustling road lined with shops.", "begin": 6550.243, "end": 6560.763, "localBegin": 567.48, "localEnd": 578.0}, {"id": "c005_f000098", "text": "Hagrid was so huge that he parted the crowd easily; all Harry had to do was keep close behind him. They passed book shops and music stores, hamburger restaurants and cinemas, but nowhere that looked as if it could sell you a magic wand. This was just an ordinary street full of ordinary people. Could there really be piles of wizard gold buried miles beneath them? Were there really shops that sold spell books and broomsticks? Might this not all be some huge joke that the Dursleys had cooked up? If Harry hadn't known that the Dursleys had no sense of humor, he might have thought so; yet somehow, even though everything Hagrid had told him so far was unbelievable, Harry couldn't help trusting him.", "begin": 6560.763, "end": 6603.523, "localBegin": 578.0, "localEnd": 620.76}, {"id": "c005_f000099", "text": "\"This is it,\" said Hagrid, coming to a halt, \"the Leaky Cauldron. It's a famous place.\"", "begin": 6603.523, "end": 6610.483, "localBegin": 620.76, "localEnd": 627.72}, {"id": "c005_f000100", "text": "It was a tiny, grubby-looking pub. If Hagrid hadn't pointed it out, Harry wouldn't have noticed it was there. The people hurrying by didn't glance at it. Their eyes slid from the big book shop on one side to the record shop on the other as if they couldn't see the Leaky Cauldron at all. In fact, Harry had the most peculiar feeling that only he and Hagrid could see it. Before he could mention this, Hagrid had steered him inside.", "begin": 6610.483, "end": 6636.443, "localBegin": 627.72, "localEnd": 653.68}, {"id": "c005_f000101", "text": "For a famous place, it was very dark and shabby. A few old women were sitting in a corner, drinking tiny glasses of sherry. One of them was smoking a long pipe. A little man in a top hat was talking to the old bartender, who was quite bald and looked like a toothless walnut. The low buzz of chatter stopped when they walked in. Everyone seemed to know Hagrid; they waved and smiled at him, and the bartender reached for a glass, saying, \"The usual, Hagrid?\"", "begin": 6636.443, "end": 6665.203, "localBegin": 653.68, "localEnd": 682.44}, {"id": "c005_f000102", "text": "\"Can't, Tom, I'm on Hogwarts business,\" said Hagrid, clapping his great hand on Harry's shoulder and making Harry's knees buckle.", "begin": 6665.203, "end": 6673.763, "localBegin": 682.44, "localEnd": 691.0}, {"id": "c005_f000103", "text": "\"Good Lord,\" said the bartender, peering at Harry, \"is this - can this be - ?\"", "begin": 6673.763, "end": 6681.203, "localBegin": 691.0, "localEnd": 698.44}, {"id": "c005_f000104", "text": "The Leaky Cauldron had suddenly gone completely still and silent.", "begin": 6681.203, "end": 6685.203, "localBegin": 698.44, "localEnd": 702.44}, {"id": "c005_f000105", "text": "\"Bless my soul,\" whispered the old bartender, \"Harry Potter . . . what an honor.\"", "begin": 6685.203, "end": 6694.563, "localBegin": 702.44, "localEnd": 711.8}, {"id": "c005_f000106", "text": "He hurried out from behind the bar, rushed toward Harry and seized his hand, tears in his eyes.", "begin": 6694.563, "end": 6700.963, "localBegin": 711.8, "localEnd": 718.2}, {"id": "c005_f000107", "text": "\"Welcome back, Mr. Potter, welcome back.\"", "begin": 6700.963, "end": 6706.483, "localBegin": 718.2, "localEnd": 723.72}, {"id": "c005_f000108", "text": "Harry didn't know what to say. Everyone was looking at him. The old woman with the pipe was puffing on it without realizing it had gone out. Hagrid was beaming.", "begin": 6706.483, "end": 6716.043, "localBegin": 723.72, "localEnd": 733.28}, {"id": "c005_f000109", "text": "Then there was a great scraping of chairs and the next moment, Harry found himself shaking hands with everyone in the Leaky Cauldron.", "begin": 6716.043, "end": 6723.723, "localBegin": 733.28, "localEnd": 740.96}, {"id": "c005_f000110", "text": "\"Doris Crockford, Mr. Potter, can't believe I'm meeting you at last.\"", "begin": 6723.723, "end": 6727.563, "localBegin": 740.96, "localEnd": 744.8}, {"id": "c005_f000111", "text": "\"So proud, Mr. Potter, I'm just so proud.\"", "begin": 6727.563, "end": 6731.123, "localBegin": 744.8, "localEnd": 748.36}, {"id": "c005_f000112", "text": "\"Always wanted to shake your hand - I'm all of a flutter.\"", "begin": 6731.123, "end": 6734.723, "localBegin": 748.36, "localEnd": 751.96}, {"id": "c005_f000113", "text": "\"Delighted, Mr. Potter, just can't tell you, Diggle's the name, Dedalus Diggle.\"", "begin": 6734.723, "end": 6742.163, "localBegin": 751.96, "localEnd": 759.4}, {"id": "c005_f000114", "text": "\"I've seen you before!\" said Harry, as Dedalus Diggle's top hat fell off in his excitement. \"You bowed to me once in a shop.\"", "begin": 6742.163, "end": 6750.363, "localBegin": 759.4, "localEnd": 767.6}, {"id": "c005_f000115", "text": "\"He remembers!\" cried Dedalus Diggle, looking around at everyone. \"Did you hear that? He remembers me!\"", "begin": 6750.363, "end": 6758.643, "localBegin": 767.6, "localEnd": 775.88}, {"id": "c005_f000116", "text": "Harry shook hands again and again - Doris Crockford kept coming back for more.", "begin": 6758.643, "end": 6764.203, "localBegin": 775.88, "localEnd": 781.44}, {"id": "c005_f000117", "text": "A pale young man made his way forward, very nervously. One of his eyes was twitching.", "begin": 6764.203, "end": 6770.723, "localBegin": 781.44, "localEnd": 787.96}, {"id": "c005_f000118", "text": "\"Professor Quirrell!\" said Hagrid. \"Harry, Professor Quirrell will be one of your teachers at Hogwarts.\"", "begin": 6770.723, "end": 6778.443, "localBegin": 787.96, "localEnd": 795.68}, {"id": "c005_f000119", "text": "\"P-P-Potter,\" stammered Professor Quirrell, grasping Harry's hand, \"c-can't ttell you how p-pleased I am to meet you.\"", "begin": 6778.443, "end": 6788.243, "localBegin": 795.68, "localEnd": 805.48}, {"id": "c005_f000120", "text": "\"What sort of magic do you teach, Professor Quirrell?\"", "begin": 6788.243, "end": 6792.403, "localBegin": 805.48, "localEnd": 809.64}, {"id": "c005_f000121", "text": "\"D-Defense Against the D-D-Dark Arts,\" muttered Professor Quirrell, as though he'd rather not think about it. \"N-not that you n-need it, eh, P-P-Potter?\" He laughed nervously. \"You'll be g-getting all your equipment, I suppose? I've g-got to p-pick up a new b-book on vampires, m-myself.\" He looked terrified at the very thought.", "begin": 6792.403, "end": 6818.843, "localBegin": 809.64, "localEnd": 836.08}, {"id": "c005_f000122", "text": "But the others wouldn't let Professor Quirrell keep Harry to himself. It took almost ten minutes to get away from them all. At last, Hagrid managed to make himself heard over the babble.", "begin": 6818.843, "end": 6829.643, "localBegin": 836.08, "localEnd": 846.88}, {"id": "c005_f000123", "text": "\"Must get on - lots ter buy. Come on, Harry.\"", "begin": 6829.643, "end": 6833.523, "localBegin": 846.88, "localEnd": 850.76}, {"id": "c005_f000124", "text": "Doris Crockford shook Harry's hand one last time, and Hagrid led them through the bar and out into a small, walled courtyard, where there was nothing but a trash can and a few weeds.", "begin": 6833.523, "end": 6844.363, "localBegin": 850.76, "localEnd": 861.6}, {"id": "c005_f000125", "text": "Hagrid grinned at Harry.", "begin": 6844.363, "end": 6846.323, "localBegin": 861.6, "localEnd": 863.56}, {"id": "c005_f000126", "text": "\"Told yeh, didn't I? Told yeh you was famous. Even Professor Quirrell was tremblin' ter meet yeh - mind you, he's usually tremblin'.\"", "begin": 6846.323, "end": 6856.643, "localBegin": 863.56, "localEnd": 873.88}, {"id": "c005_f000127", "text": "\"Is he always that nervous?\"", "begin": 6856.643, "end": 6859.123, "localBegin": 873.88, "localEnd": 876.36}, {"id": "c005_f000128", "text": "\"Oh, yeah. Poor bloke. Brilliant mind. He was fine while he was studyin' outta books but then he took a year off ter get some first-hand experience. . . . They say he met vampires in the Black Forest, and there was a nasty bit o' trouble with a hag - never been the same since. Scared of the students, scared of his own subject - now, where's me umbrella?\"", "begin": 6859.123, "end": 6884.763, "localBegin": 876.36, "localEnd": 902.0}, {"id": "c005_f000129", "text": "Vampires? Hags? Harry's head was swimming. Hagrid, meanwhile, was counting bricks in the wall above the trash can.", "begin": 6884.763, "end": 6893.083, "localBegin": 902.0, "localEnd": 910.32}, {"id": "c005_f000130", "text": "\"Three up . . . two across . . .\" he muttered. \"Right, stand back, Harry.\"", "begin": 6893.083, "end": 6898.323, "localBegin": 910.32, "localEnd": 915.56}, {"id": "c005_f000131", "text": "He tapped the wall three times with the point of his umbrella.", "begin": 6898.323, "end": 6902.043, "localBegin": 915.56, "localEnd": 919.28}, {"id": "c005_f000132", "text": "The brick he had touched quivered - it wriggled - in the middle, a small hole appeared - it grew wider and wider - a second later they were facing an archway large enough even for Hagrid, an archway onto a cobbled street that twisted and turned out of sight.", "begin": 6902.043, "end": 6917.963, "localBegin": 919.28, "localEnd": 935.2}, {"id": "c005_f000133", "text": "\"Welcome,\" said Hagrid, \"to Diagon Alley.\"", "begin": 6917.963, "end": 6922.323, "localBegin": 935.2, "localEnd": 939.56}, {"id": "c005_f000134", "text": "He grinned at Harry's amazement. They stepped through the archway. Harry looked quickly over his shoulder and saw the archway shrink instantly back into solid wall.", "begin": 6922.323, "end": 6933.483, "localBegin": 939.56, "localEnd": 950.72}, {"id": "c005_f000135", "text": "The sun shone brightly on a stack of cauldrons outside the nearest shop. Cauldrons - All Sizes - Copper, Brass, Pewter, Silver - Self-Stirring - Collapsible, said a sign hanging over them.", "begin": 6933.483, "end": 6946.203, "localBegin": 950.72, "localEnd": 963.44}, {"id": "c005_f000136", "text": "\"Yeah, you'll be needin' one,\" said Hagrid, \"but we gotta get yer money first.\"", "begin": 6946.203, "end": 6951.883, "localBegin": 963.44, "localEnd": 969.12}, {"id": "c005_f000137", "text": "Harry wished he had about eight more eyes. He turned his head in every direction as they walked up the street, trying to look at everything at once: the shops, the things outside them, the people doing their shopping. A plump woman outside an Apothecary was shaking her head as they passed, saying, \"Dragon liver, sixteen Sickles an ounce, they're mad. . . .\"", "begin": 6951.883, "end": 6976.363, "localBegin": 969.12, "localEnd": 993.6}, {"id": "c005_f000138", "text": "A low, soft hooting came from a dark shop with a sign saying Eeylops Owl Emporium - Tawny, Screech, Barn, Brown, and Snowy. Several boys of about Harry's age had their noses pressed against a window with broomsticks in it. \"Look,\" Harry heard one of them say, \"the new Nimbus Two Thousand - fastest ever - \" There were shops selling robes, shops selling telescopes and strange silver instruments Harry had never seen before, windows stacked with barrels of bat spleens and eels' eyes, tottering piles of spell books, quills, and rolls of parchment, potion bottles, globes of the moon. . . .", "begin": 6976.363, "end": 7016.723, "localBegin": 993.6, "localEnd": 1033.96}, {"id": "c005_f000139", "text": "\"Gringotts,\" said Hagrid.", "begin": 7016.723, "end": 7019.803, "localBegin": 1033.96, "localEnd": 1037.04}, {"id": "c005_f000140", "text": "They had reached a snowy white building that towered over the other little shops. Standing beside its burnished bronze doors, wearing a uniform of scarlet and gold, was -", "begin": 7019.803, "end": 7030.363, "localBegin": 1037.04, "localEnd": 1047.6}, {"id": "c005_f000141", "text": "\"Yeah, that's a goblin,\" said Hagrid quietly as they walked up the white stone steps toward him. The goblin was about a head shorter than Harry. He had a swarthy, clever face, a pointed beard and, Harry noticed, very long fingers and feet. He", "begin": 7030.363, "end": 7049.203, "localBegin": 1047.6, "localEnd": 1066.44}, {"id": "c005_f000142", "text": "bowed as they walked inside. Now they were facing a second pair of doors, silver this time, with words engraved upon them:", "begin": 7049.203, "end": 7057.163, "localBegin": 1066.44, "localEnd": 1074.4}, {"id": "c005_f000143", "text": "Enter, stranger, but take heed", "begin": 7057.163, "end": 7060.763, "localBegin": 1074.4, "localEnd": 1078.0}, {"id": "c005_f000144", "text": "Of what awaits the sin of greed,", "begin": 7060.763, "end": 7063.123, "localBegin": 1078.0, "localEnd": 1080.36}, {"id": "c005_f000145", "text": "For those who take, but do not earn,", "begin": 7063.123, "end": 7065.883, "localBegin": 1080.36, "localEnd": 1083.12}, {"id": "c005_f000146", "text": "Must pay most dearly in their turn.", "begin": 7065.883, "end": 7068.803, "localBegin": 1083.12, "localEnd": 1086.04}, {"id": "c005_f000147", "text": "So if you seek beneath our floors", "begin": 7068.803, "end": 7071.923, "localBegin": 1086.04, "localEnd": 1089.16}, {"id": "c005_f000148", "text": "A treasure that was never yours,", "begin": 7071.923, "end": 7074.283, "localBegin": 1089.16, "localEnd": 1091.52}, {"id": "c005_f000149", "text": "Thief, you have been warned, beware", "begin": 7074.283, "end": 7077.843, "localBegin": 1091.52, "localEnd": 1095.08}, {"id": "c005_f000150", "text": "Of finding more than treasure there.", "begin": 7077.843, "end": 7080.563, "localBegin": 1095.08, "localEnd": 1097.8}, {"id": "c005_f000151", "text": "\"Like I said, yeh'd be mad ter try an' rob it,\" said Hagrid.", "begin": 7080.563, "end": 7088.043, "localBegin": 1097.8, "localEnd": 1105.28}, {"id": "c005_f000152", "text": "A pair of goblins bowed them through the silver doors and they were in a vast marble hall. About a hundred more goblins were sitting on high stools behind a long counter, scribbling in large ledgers, weighing coins in brass scales, examining precious stones through eyeglasses. There were too many doors to count leading off the hall, and yet more goblins were showing people in and out of these. Hagrid and Harry made for the counter.", "begin": 7088.043, "end": 7112.323, "localBegin": 1105.28, "localEnd": 1129.56}, {"id": "c005_f000153", "text": "\"Morning,\" said Hagrid to a free goblin. \"We've come ter take some money outta Mr. Harry Potter's safe.\"", "begin": 7112.323, "end": 7120.163, "localBegin": 1129.56, "localEnd": 1137.4}, {"id": "c005_f000154", "text": "\"You have his key, sir?\"", "begin": 7120.163, "end": 7123.003, "localBegin": 1137.4, "localEnd": 1140.24}, {"id": "c005_f000155", "text": "\"Got it here somewhere,\" said Hagrid, and he started emptying his pockets onto the counter, scattering a handful of moldy dog biscuits over the goblin's book of numbers. The goblin wrinkled his nose. Harry watched the goblin on their right weighing a pile of rubies as big as glowing coals.", "begin": 7123.003, "end": 7140.963, "localBegin": 1140.24, "localEnd": 1158.2}, {"id": "c005_f000156", "text": "\"Got it,\" said Hagrid at last, holding up a tiny golden key.", "begin": 7140.963, "end": 7145.483, "localBegin": 1158.2, "localEnd": 1162.72}, {"id": "c005_f000157", "text": "The goblin looked at it closely.", "begin": 7145.483, "end": 7147.603, "localBegin": 1162.72, "localEnd": 1164.84}, {"id": "c005_f000158", "text": "\"That seems to be in order.\"", "begin": 7147.603, "end": 7150.203, "localBegin": 1164.84, "localEnd": 1167.44}, {"id": "c005_f000159", "text": "\"An' I've also got a letter here from Professor Dumbledore,\" said Hagrid importantly, throwing out his chest. \"It's about the You-Know-What in vault seven", "begin": 7150.203, "end": 7160.643, "localBegin": 1167.44, "localEnd": 1177.88}, {"id": "c005_f000160", "text": "hundred and thirteen.\"", "begin": 7160.643, "end": 7161.963, "localBegin": 1177.88, "localEnd": 1179.2}, {"id": "c005_f000161", "text": "The goblin read the letter carefully.", "begin": 7161.963, "end": 7164.643, "localBegin": 1179.2, "localEnd": 1181.88}, {"id": "c005_f000162", "text": "\"Very well,\" he said, handing it back to Hagrid, \"I will have someone take you down to both vaults. Griphook!\"", "begin": 7164.643, "end": 7172.243, "localBegin": 1181.88, "localEnd": 1189.48}, {"id": "c005_f000163", "text": "Griphook was yet another goblin. Once Hagrid had crammed all the dog biscuits back inside his pockets, he and Harry followed Griphook toward one of the doors leading off the hall.", "begin": 7172.243, "end": 7183.243, "localBegin": 1189.48, "localEnd": 1200.48}, {"id": "c005_f000164", "text": "\"What's the You-Know-What in vault seven hundred and thirteen?\" Harry asked.", "begin": 7183.243, "end": 7188.883, "localBegin": 1200.48, "localEnd": 1206.12}, {"id": "c005_f000165", "text": "\"Can't tell yeh that,\" said Hagrid mysteriously. \"Very secret. Hogwarts business. Dumbledore's trusted me. More'n my job's worth ter tell yeh that.\"", "begin": 7188.883, "end": 7199.683, "localBegin": 1206.12, "localEnd": 1216.92}, {"id": "c005_f000166", "text": "Griphook held the door open for them. Harry, who had expected more marble, was surprised. They were in a narrow stone passageway lit with flaming torches. It sloped steeply downward and there were little railway tracks on the floor. Griphook whistled and a small cart came hurtling up the tracks toward them. They climbed in - Hagrid with some difficulty - and were off.", "begin": 7199.683, "end": 7223.803, "localBegin": 1216.92, "localEnd": 1241.04}, {"id": "c005_f000167", "text": "At first they just hurtled through a maze of twisting passages. Harry tried to remember, left, right, right, left, middle fork, right, left, but it was impossible. The rattling cart seemed to know its own way, because Griphook wasn't steering.", "begin": 7223.803, "end": 7238.083, "localBegin": 1241.04, "localEnd": 1255.32}, {"id": "c005_f000168", "text": "Harry's eyes stung as the cold air rushed past them, but he kept them wide open. Once, he thought he saw a burst of fire at the end of a passage and twisted around to see if it was a dragon, but too late - they plunged even deeper, passing an underground lake where huge stalactites and stalagmites grew from the ceiling and floor.", "begin": 7238.083, "end": 7258.283, "localBegin": 1255.32, "localEnd": 1275.52}, {"id": "c005_f000169", "text": "\"I never know,\" Harry called to Hagrid over the noise of the cart, \"what's the difference between a stalagmite and a stalactite?\"", "begin": 7258.283, "end": 7267.803, "localBegin": 1275.52, "localEnd": 1285.04}, {"id": "c005_f000170", "text": "\"Stalagmite's got an 'm' in it,\" said Hagrid. \"An' don' ask me questions just now, I think I'm gonna be sick.\"", "begin": 7267.803, "end": 7277.443, "localBegin": 1285.04, "localEnd": 1294.68}, {"id": "c005_f000171", "text": "He did look very green, and when the cart stopped at last beside a small door in the passage wall, Hagrid got out and had to lean against the wall to stop his knees from trembling.", "begin": 7277.443, "end": 7286.883, "localBegin": 1294.68, "localEnd": 1304.12}, {"id": "c005_f000172", "text": "Griphook unlocked the door. A lot of green smoke came billowing out, and as it", "begin": 7286.883, "end": 7292.763, "localBegin": 1304.12, "localEnd": 1310.0}, {"id": "c005_f000173", "text": "cleared, Harry gasped. Inside were mounds of gold coins. Columns of silver. Heaps of little bronze Knuts.", "begin": 7292.763, "end": 7302.243, "localBegin": 1310.0, "localEnd": 1319.48}, {"id": "c005_f000174", "text": "\"All yours,\" smiled Hagrid.", "begin": 7302.243, "end": 7306.723, "localBegin": 1319.48, "localEnd": 1323.96}, {"id": "c005_f000175", "text": "All Harry's - it was incredible. The Dursleys couldn't have known about this or they'd have had it from him faster than blinking. How often had they complained how much Harry cost them to keep? And all the time there had been a small fortune belonging to him, buried deep under London.", "begin": 7306.723, "end": 7324.163, "localBegin": 1323.96, "localEnd": 1341.4}, {"id": "c005_f000176", "text": "Hagrid helped Harry pile some of it into a bag.", "begin": 7324.163, "end": 7327.523, "localBegin": 1341.4, "localEnd": 1344.76}, {"id": "c005_f000177", "text": "\"The gold ones are Galleons,\" he explained. \"Seventeen silver Sickles to a Galleon and twenty-nine Knuts to a Sickle, it's easy enough. Right, that should be enough fer a couple o' terms, we'll keep the rest safe for yeh.\" He turned to Griphook. \"Vault seven hundred and thirteen now, please, and can we go more slowly?\"", "begin": 7327.523, "end": 7351.283, "localBegin": 1344.76, "localEnd": 1368.52}, {"id": "c005_f000178", "text": "\"One speed only,\" said Griphook.", "begin": 7351.283, "end": 7354.523, "localBegin": 1368.52, "localEnd": 1371.76}, {"id": "c005_f000179", "text": "They were going even deeper now and gathering speed. The air became colder and colder as they hurtled round tight corners. They went rattling over an underground ravine, and Harry leaned over the side to try to see what was down at the dark bottom, but Hagrid groaned and pulled him back by the scruff of his neck.", "begin": 7354.523, "end": 7372.563, "localBegin": 1371.76, "localEnd": 1389.8}, {"id": "c005_f000180", "text": "Vault seven hundred and thirteen had no keyhole.", "begin": 7372.563, "end": 7377.283, "localBegin": 1389.8, "localEnd": 1394.52}, {"id": "c005_f000181", "text": "\"Stand back,\" said Griphook importantly. He stroked the door gently with one of his long fingers and it simply melted away.", "begin": 7377.283, "end": 7386.763, "localBegin": 1394.52, "localEnd": 1404.0}, {"id": "c005_f000182", "text": "\"If anyone but a Gringotts goblin tried that, they'd be sucked through the door and trapped in there,\" said Griphook.", "begin": 7386.763, "end": 7395.283, "localBegin": 1404.0, "localEnd": 1412.52}, {"id": "c005_f000183", "text": "\"How often do you check to see if anyone's inside?\" Harry asked.", "begin": 7395.283, "end": 7399.763, "localBegin": 1412.52, "localEnd": 1417.0}, {"id": "c005_f000184", "text": "\"About once every ten years,\" said Griphook with a rather nasty grin.", "begin": 7399.763, "end": 7405.963, "localBegin": 1417.0, "localEnd": 1423.2}, {"id": "c005_f000185", "text": "Something really extraordinary had to be inside this top security vault, Harry was sure, and he leaned forward eagerly, expecting to see fabulous jewels at the very least - but at first he thought it was empty. Then he noticed a grubby little package wrapped up in brown paper lying on the floor. Hagrid picked it up and tucked it deep inside his coat. Harry longed to know what it was, but knew better than to ask.", "begin": 7405.963, "end": 7432.843, "localBegin": 1423.2, "localEnd": 1450.08}, {"id": "c005_f000186", "text": "\"Come on, back in this infernal cart, and don't talk to me on the way back, it's best if I keep me mouth shut,\" said Hagrid.", "begin": 7432.843, "end": 7442.203, "localBegin": 1450.08, "localEnd": 1459.44}, {"id": "c005_f000187", "text": "One wild cart ride later they stood blinking in the sunlight outside Gringotts. Harry didn't know where to run first now that he had a bag full of money. He didn't have to know how many Galleons there were to a pound to know that he was holding more money than he'd had in his whole life - more money than even Dudley had ever had.", "begin": 7442.203, "end": 7463.243, "localBegin": 1459.44, "localEnd": 1480.48}, {"id": "c005_f000188", "text": "\"Might as well get yer uniform,\" said Hagrid, nodding toward Madam Malkin's Robes for All Occasions. \"Listen, Harry, would yeh mind if I slipped off fer a pick-me-up in the Leaky Cauldron? I hate them Gringotts carts.\" He did still look a bit sick, so Harry entered Madam Malkin's shop alone, feeling nervous.", "begin": 7463.243, "end": 7484.603, "localBegin": 1480.48, "localEnd": 1501.84}, {"id": "c005_f000189", "text": "Madam Malkin was a squat, smiling witch dressed all in mauve.", "begin": 7484.603, "end": 7490.443, "localBegin": 1501.84, "localEnd": 1507.68}, {"id": "c005_f000190", "text": "\"Hogwarts, dear?\" she said, when Harry started to speak. \"Got the lot here another young man being fitted up just now, in fact.\"", "begin": 7490.443, "end": 7498.883, "localBegin": 1507.68, "localEnd": 1516.12}, {"id": "c005_f000191", "text": "In the back of the shop, a boy with a pale, pointed face was standing on a footstool while a second witch pinned up his long black robes. Madam Malkin stood Harry on a stool next to him, slipped a long robe over his head, and began to pin it to the right length.", "begin": 7498.883, "end": 7514.963, "localBegin": 1516.12, "localEnd": 1532.2}, {"id": "c005_f000192", "text": "\"Hello,\" said the boy, \"Hogwarts, too?\"", "begin": 7514.963, "end": 7519.763, "localBegin": 1532.2, "localEnd": 1537.0}, {"id": "c005_f000193", "text": "\"Yes,\" said Harry.", "begin": 7519.763, "end": 7521.363, "localBegin": 1537.0, "localEnd": 1538.6}, {"id": "c005_f000194", "text": "\"My father's next door buying my books and Mother's up the street looking at wands,\" said the boy. He had a bored, drawling voice. \"Then I'm going to drag them off to look at racing brooms. I don't see why first years can't have their own. I think I'll bully Father into getting me one and I'll smuggle it in somehow.\"", "begin": 7521.363, "end": 7542.243, "localBegin": 1538.6, "localEnd": 1559.48}, {"id": "c005_f000195", "text": "Harry was strongly reminded of Dudley.", "begin": 7542.243, "end": 7545.443, "localBegin": 1559.48, "localEnd": 1562.68}, {"id": "c005_f000196", "text": "\"Have you got your own broom?\" the boy went on.", "begin": 7545.443, "end": 7549.363, "localBegin": 1562.68, "localEnd": 1566.6}, {"id": "c005_f000197", "text": "\"No,\" said Harry.", "begin": 7549.363, "end": 7550.763, "localBegin": 1566.6, "localEnd": 1568.0}, {"id": "c005_f000198", "text": "\"Play Quidditch at all?\"", "begin": 7550.763, "end": 7552.963, "localBegin": 1568.0, "localEnd": 1570.2}, {"id": "c005_f000199", "text": "\"No,\" Harry said again, wondering what on earth Quidditch could be.", "begin": 7552.963, "end": 7557.523, "localBegin": 1570.2, "localEnd": 1574.76}, {"id": "c005_f000200", "text": "\"I do - Father says it's a crime if I'm not picked to play for my House, and I must say, I agree. Know what House you'll be in yet?\"", "begin": 7557.523, "end": 7566.963, "localBegin": 1574.76, "localEnd": 1584.2}, {"id": "c005_f000201", "text": "\"No,\" said Harry, feeling more stupid by the minute.", "begin": 7566.963, "end": 7571.323, "localBegin": 1584.2, "localEnd": 1588.56}, {"id": "c005_f000202", "text": "\"Well, no one really knows until they get there, do they, but I know I'll be in Slytherin, all our family have been - imagine being in Hufflepuff, I think I'd leave, wouldn't you?\"", "begin": 7571.323, "end": 7585.283, "localBegin": 1588.56, "localEnd": 1602.52}, {"id": "c005_f000203", "text": "\"Mmm,\" said Harry, wishing he could say something a bit more interesting.", "begin": 7585.283, "end": 7589.843, "localBegin": 1602.52, "localEnd": 1607.08}, {"id": "c005_f000204", "text": "\"I say, look at that man!\" said the boy suddenly, nodding toward the front window. Hagrid was standing there, grinning at Harry and pointing at two large ice creams to show he couldn't come in.", "begin": 7589.843, "end": 7601.523, "localBegin": 1607.08, "localEnd": 1618.76}, {"id": "c005_f000205", "text": "\"That's Hagrid,\" said Harry, pleased to know something the boy didn't. \"He works at Hogwarts.\"", "begin": 7601.523, "end": 7607.803, "localBegin": 1618.76, "localEnd": 1625.04}, {"id": "c005_f000206", "text": "\"Oh,\" said the boy, \"I've heard of him. He's a sort of servant, isn't he?\"", "begin": 7607.803, "end": 7613.283, "localBegin": 1625.04, "localEnd": 1630.52}, {"id": "c005_f000207", "text": "\"He's the gamekeeper,\" said Harry. He was liking the boy less and less every second.", "begin": 7613.283, "end": 7618.643, "localBegin": 1630.52, "localEnd": 1635.88}, {"id": "c005_f000208", "text": "\"Yes, exactly. I heard he's a sort of savage - lives in a hut on the school grounds and every now and then he gets drunk, tries to do magic, and ends up setting fire to his bed.\"", "begin": 7618.643, "end": 7632.203, "localBegin": 1635.88, "localEnd": 1649.44}, {"id": "c005_f000209", "text": "\"I think he's brilliant,\" said Harry coldly.", "begin": 7632.203, "end": 7635.363, "localBegin": 1649.44, "localEnd": 1652.6}, {"id": "c005_f000210", "text": "\"Do you?\" said the boy, with a slight sneer. \"Why is he with you? Where are your parents?\"", "begin": 7635.363, "end": 7642.323, "localBegin": 1652.6, "localEnd": 1659.56}, {"id": "c005_f000211", "text": "\"They're dead,\" said Harry shortly. He didn't feel much like going into the matter with this boy.", "begin": 7642.323, "end": 7648.243, "localBegin": 1659.56, "localEnd": 1665.48}, {"id": "c005_f000212", "text": "\"Oh, sorry,\" said the other, not sounding sorry at all. \"But they were our kind, weren't they?\"", "begin": 7648.243, "end": 7654.723, "localBegin": 1665.48, "localEnd": 1671.96}, {"id": "c005_f000213", "text": "\"They were a witch and wizard, if that's what you mean.\"", "begin": 7654.723, "end": 7657.723, "localBegin": 1671.96, "localEnd": 1674.96}, {"id": "c005_f000214", "text": "\"I really don't think they should let the other sort in, do you? They're just not the same, they've never been brought up to know our ways. Some of them have never even heard of Hogwarts until they get the letter, imagine. I think they should keep it in the old wizarding families. What's your surname, anyway?\"", "begin": 7657.723, "end": 7677.043, "localBegin": 1674.96, "localEnd": 1694.28}, {"id": "c005_f000215", "text": "But before Harry could answer, Madam Malkin said, \"That's you done, my dear,\" and Harry, not sorry for an excuse to stop talking to the boy, hopped down from the footstool.", "begin": 7677.043, "end": 7688.683, "localBegin": 1694.28, "localEnd": 1705.92}, {"id": "c005_f000216", "text": "\"Well, I'll see you at Hogwarts, I suppose,\" said the drawling boy.", "begin": 7688.683, "end": 7694.763, "localBegin": 1705.92, "localEnd": 1712.0}, {"id": "c005_f000217", "text": "Harry was rather quiet as he ate the ice cream Hagrid had bought him (chocolate and raspberry with chopped nuts).", "begin": 7694.763, "end": 7702.323, "localBegin": 1712.0, "localEnd": 1719.56}, {"id": "c005_f000218", "text": "\"What's up?\" said Hagrid.", "begin": 7702.323, "end": 7704.843, "localBegin": 1719.56, "localEnd": 1722.08}, {"id": "c005_f000219", "text": "\"Nothing,\" Harry lied. They stopped to buy parchment and quills. Harry cheered up a bit when he found a bottle of ink that changed color as you wrote. When they had left the shop, he said, \"Hagrid, what's Quidditch?\"", "begin": 7704.843, "end": 7720.083, "localBegin": 1722.08, "localEnd": 1737.32}, {"id": "c005_f000220", "text": "\"Blimey, Harry, I keep forgettin' how little yeh know - not knowin' about Quidditch!\"", "begin": 7720.083, "end": 7725.763, "localBegin": 1737.32, "localEnd": 1743.0}, {"id": "c005_f000221", "text": "\"Don't make me feel worse,\" said Harry. He told Hagrid about the pale boy in Madam Malkin's.", "begin": 7725.763, "end": 7732.523, "localBegin": 1743.0, "localEnd": 1749.76}, {"id": "c005_f000222", "text": "\" - and he said people from Muggle families shouldn't even be allowed in - \"", "begin": 7732.523, "end": 7737.483, "localBegin": 1749.76, "localEnd": 1754.72}, {"id": "c005_f000223", "text": "\"Yer not from a Muggle family. If he'd known who yeh were - he's grown up knowin' yer name if his parents are wizardin' folk. You saw what everyone in the Leaky Cauldron was like when they saw yeh. Anyway, what does he know about it, some o' the best I ever saw were the only ones with magic in 'em in a long line o' Muggles - look at yer mum! Look what she had fer a sister!\"", "begin": 7737.483, "end": 7760.403, "localBegin": 1754.72, "localEnd": 1777.64}, {"id": "c005_f000224", "text": "\"So what is Quidditch?\"", "begin": 7760.403, "end": 7763.363, "localBegin": 1777.64, "localEnd": 1780.6}, {"id": "c005_f000225", "text": "\"It's our sport. Wizard sport. It's like - like soccer in the Muggle world everyone follows Quidditch - played up in the air on broomsticks and there's four balls - sorta hard ter explain the rules.\"", "begin": 7763.363, "end": 7779.363, "localBegin": 1780.6, "localEnd": 1796.6}, {"id": "c005_f000226", "text": "\"And what are Slytherin and Hufflepuff?\"", "begin": 7779.363, "end": 7782.843, "localBegin": 1796.6, "localEnd": 1800.08}, {"id": "c005_f000227", "text": "\"School Houses. There's four. Everyone says Hufflepuff are a lot o' duffers, but - \"", "begin": 7782.843, "end": 7789.283, "localBegin": 1800.08, "localEnd": 1806.52}, {"id": "c005_f000228", "text": "\"I bet I'm in Hufflepuff,\" said Harry gloomily.", "begin": 7789.283, "end": 7792.163, "localBegin": 1806.52, "localEnd": 1809.4}, {"id": "c005_f000229", "text": "\"Better Hufflepuff than Slytherin,\" said Hagrid darkly. \"There's not a single witch or wizard who went bad who wasn't in Slytherin. You-Know-Who was one.\"", "begin": 7792.163, "end": 7804.083, "localBegin": 1809.4, "localEnd": 1821.32}, {"id": "c005_f000230", "text": "\"Vol-, sorry - You-Know-Who was at Hogwarts?\"", "begin": 7804.083, "end": 7808.603, "localBegin": 1821.32, "localEnd": 1825.84}, {"id": "c005_f000231", "text": "\"Years an' years ago,\" said Hagrid.", "begin": 7808.603, "end": 7811.163, "localBegin": 1825.84, "localEnd": 1828.4}, {"id": "c005_f000232", "text": "They bought Harry's school books in a shop called Flourish and Blotts where the shelves were stacked to the ceiling with books as large as paving stones bound in leather; books the size of postage stamps in covers of silk; books full of peculiar symbols and a few books with nothing in them at all. Even Dudley, who never read anything, would have been wild to get his hands on some of these. Hagrid almost had to drag Harry away from Curses and Counter-curses (Bewitch Your Friends and Befuddle Your Enemies with the Latest Revenges: Hair Loss, Jelly-Legs, Tongue-Tying and Much, Much More) by Professor Vindictus Viridian.", "begin": 7811.163, "end": 7850.963, "localBegin": 1828.4, "localEnd": 1868.2}, {"id": "c005_f000233", "text": "\"I was trying to find out how to curse Dudley.\"", "begin": 7850.963, "end": 7854.403, "localBegin": 1868.2, "localEnd": 1871.64}, {"id": "c005_f000234", "text": "\"I'm not sayin' that's not a good idea, but yer not ter use magic in the Muggle world except in very special circumstances,\" said Hagrid. \"An' anyway, yeh couldn' work any of them curses yet, yeh'll need a lot more study before yeh get ter that level.\"", "begin": 7854.403, "end": 7870.763, "localBegin": 1871.64, "localEnd": 1888.0}, {"id": "c005_f000235", "text": "Hagrid wouldn't let Harry buy a solid gold cauldron, either (\"It says pewter on yer list\"), but they got a nice set of scales for weighing potion ingredients and a collapsible brass telescope. Then they visited the Apothecary, which was fascinating enough to make up for its horrible smell, a mixture of bad eggs and rotted cabbages. Barrels of slimy stuff stood on the floor; jars of herbs, dried roots, and bright powders lined the walls; bundles of feathers, strings of fangs, and snarled claws hung from the ceiling. While Hagrid asked the man behind the counter for a supply of some basic potion ingredients for Harry, Harry himself examined silver unicorn horns at twenty-one Galleons each and minuscule, glitteryblack beetle eyes (five Knuts a scoop).", "begin": 7870.763, "end": 7920.563, "localBegin": 1888.0, "localEnd": 1937.8}, {"id": "c005_f000236", "text": "Outside the Apothecary, Hagrid checked Harry's list again.", "begin": 7920.563, "end": 7925.283, "localBegin": 1937.8, "localEnd": 1942.52}, {"id": "c005_f000237", "text": "\"Just yer wand left - oh yeah, an' I still haven't got yeh a birthday present.\"", "begin": 7925.283, "end": 7931.323, "localBegin": 1942.52, "localEnd": 1948.56}, {"id": "c005_f000238", "text": "Harry felt himself go red.", "begin": 7931.323, "end": 7933.523, "localBegin": 1948.56, "localEnd": 1950.76}, {"id": "c005_f000239", "text": "\"You don't have to - \"", "begin": 7933.523, "end": 7934.563, "localBegin": 1950.76, "localEnd": 1951.8}, {"id": "c005_f000240", "text": "\"I know I don't have to. Tell yeh what, I'll get yer animal. Not a toad, toads went outta fashion years ago, yeh'd be laughed at - an' I don' like cats, they make me sneeze. I'll get yer an owl. All the kids want owls, they're dead useful, carry yer mail an' everythin'.\"", "begin": 7934.563, "end": 7953.483, "localBegin": 1951.8, "localEnd": 1970.72}, {"id": "c005_f000241", "text": "Twenty minutes later, they left Eeylops Owl Emporium, which had been dark and full of rustling and flickering, jewel-bright eyes. Harry now carried a large cage", "begin": 7953.483, "end": 7965.923, "localBegin": 1970.72, "localEnd": 1983.16}, {"id": "c005_f000242", "text": "that held a beautiful snowy owl, fast asleep with her head under her wing. He couldn't stop stammering his thanks, sounding just like Professor Quirrell.", "begin": 7965.923, "end": 7975.123, "localBegin": 1983.16, "localEnd": 1992.36}, {"id": "c005_f000243", "text": "\"Don' mention it,\" said Hagrid gruffly. \"Don' expect you've had a lotta presents from them Dursleys. Just Ollivanders left now - only place fer wands, Ollivanders, and yeh gotta have the best wand.\"", "begin": 7975.123, "end": 7989.243, "localBegin": 1992.36, "localEnd": 2006.48}, {"id": "c005_f000244", "text": "A magic wand . . . this was what Harry had been really looking forward to.", "begin": 7989.243, "end": 7995.163, "localBegin": 2006.48, "localEnd": 2012.4}, {"id": "c005_f000245", "text": "The last shop was narrow and shabby. Peeling gold letters over the door read Ollivanders: Makers of Fine Wands since 382 B.C. A single wand lay on a faded purple cushion in the dusty window.", "begin": 7995.163, "end": 8010.603, "localBegin": 2012.4, "localEnd": 2027.84}, {"id": "c005_f000246", "text": "A tinkling bell rang somewhere in the depths of the shop as they stepped inside. It was a tiny place, empty except for a single, spindly chair that Hagrid sat on to wait. Harry felt strangely as though he had entered a very strict library; he swallowed a lot of new questions that had just occurred to him and looked instead at the thousands of narrow boxes piled neatly right up to the ceiling. For some reason, the back of his neck prickled. The very dust and silence in here seemed to tingle with some secret magic.", "begin": 8010.603, "end": 8043.243, "localBegin": 2027.84, "localEnd": 2060.48}, {"id": "c005_f000247", "text": "\"Good afternoon,\" said a soft voice. Harry jumped. Hagrid must have jumped, too, because there was a loud crunching noise and he got quickly off the spindly chair.", "begin": 8043.243, "end": 8055.203, "localBegin": 2060.48, "localEnd": 2072.44}, {"id": "c005_f000248", "text": "An old man was standing before them, his wide, pale eyes shining like moons through the gloom of the shop.", "begin": 8055.203, "end": 8062.163, "localBegin": 2072.44, "localEnd": 2079.4}, {"id": "c005_f000249", "text": "\"Hello,\" said Harry awkwardly.", "begin": 8062.163, "end": 8065.843, "localBegin": 2079.4, "localEnd": 2083.08}, {"id": "c005_f000250", "text": "\"Ah yes,\" said the man. \"Yes, yes. I thought I'd be seeing you soon. Harry Potter.\" It wasn't a question. \"You have your mother's eyes. It seems only yesterday she was in here herself, buying her first wand. Ten and a quarter inches long, swishy, made of willow. Nice wand for charm work.\"", "begin": 8065.843, "end": 8090.523, "localBegin": 2083.08, "localEnd": 2107.76}, {"id": "c005_f000251", "text": "Mr. Ollivander moved closer to Harry. Harry wished he would blink. Those silvery eyes were a bit creepy.", "begin": 8090.523, "end": 8098.043, "localBegin": 2107.76, "localEnd": 2115.28}, {"id": "c005_f000252", "text": "\"Your father, on the other hand, favored a mahogany wand. Eleven inches. Pliable. A little more power and excellent for transfiguration. Well, I say your father favored it - it's really the wand that chooses the wizard, of course.\"", "begin": 8098.043, "end": 8116.923, "localBegin": 2115.28, "localEnd": 2134.16}, {"id": "c005_f000253", "text": "Mr. Ollivander had come so close that he and Harry were almost nose to nose. Harry could see himself reflected in those misty eyes.", "begin": 8116.923, "end": 8125.843, "localBegin": 2134.16, "localEnd": 2143.08}, {"id": "c005_f000254", "text": "\"And that's where . . .\"", "begin": 8125.843, "end": 8128.083, "localBegin": 2143.08, "localEnd": 2145.32}, {"id": "c005_f000255", "text": "Mr. Ollivander touched the lightning scar on Harry's forehead with a long, white finger.", "begin": 8128.083, "end": 8133.763, "localBegin": 2145.32, "localEnd": 2151.0}, {"id": "c005_f000256", "text": "\"I'm sorry to say I sold the wand that did it,\" he said softly. \"Thirteen-and-a-half inches. Yew. Powerful wand, very powerful, and in the wrong hands . . . well, if I'd known what that wand was going out into the world to do. . . .\"", "begin": 8133.763, "end": 8153.283, "localBegin": 2151.0, "localEnd": 2170.52}, {"id": "c005_f000257", "text": "He shook his head and then, to Harry's relief, spotted Hagrid.", "begin": 8153.283, "end": 8157.803, "localBegin": 2170.52, "localEnd": 2175.04}, {"id": "c005_f000258", "text": "\"Rubeus! Rubeus Hagrid! How nice to see you again. . . . Oak, sixteen inches, rather bendy, wasn't it?\"", "begin": 8157.803, "end": 8166.323, "localBegin": 2175.04, "localEnd": 2183.56}, {"id": "c005_f000259", "text": "\"It was, sir, yes,\" said Hagrid.", "begin": 8166.323, "end": 8169.763, "localBegin": 2183.56, "localEnd": 2187.0}, {"id": "c005_f000260", "text": "\"Good wand, that one. But I suppose they snapped it in half when you got expelled?\" said Mr. Ollivander, suddenly stern.", "begin": 8169.763, "end": 8178.123, "localBegin": 2187.0, "localEnd": 2195.36}, {"id": "c005_f000261", "text": "\"Er - yes, they did, yes,\" said Hagrid, shuffling his feet. \"I've still got the pieces, though,\" he added brightly.", "begin": 8178.123, "end": 8186.123, "localBegin": 2195.36, "localEnd": 2203.36}, {"id": "c005_f000262", "text": "\"But you don't use them?\" said Mr. Ollivander sharply.", "begin": 8186.123, "end": 8190.363, "localBegin": 2203.36, "localEnd": 2207.6}, {"id": "c005_f000263", "text": "\"Oh, no, sir,\" said Hagrid quickly. Harry noticed he gripped his pink umbrella very tightly as he spoke.", "begin": 8190.363, "end": 8197.283, "localBegin": 2207.6, "localEnd": 2214.52}, {"id": "c005_f000264", "text": "\"Hmmm,\" said Mr. Ollivander, giving Hagrid a piercing look. \"Well, now - Mr. Potter. Let me see.\" He pulled a long tape measure with silver markings out of his pocket. \"Which is your wand arm?\"", "begin": 8197.283, "end": 8210.843, "localBegin": 2214.52, "localEnd": 2228.08}, {"id": "c005_f000265", "text": "\"Er - well, I'm right-handed,\" said Harry.", "begin": 8210.843, "end": 8215.883, "localBegin": 2228.08, "localEnd": 2233.12}, {"id": "c005_f000266", "text": "\"Hold out your arm. That's it.\" He measured Harry from shoulder to finger, then wrist to elbow, shoulder to floor, knee to armpit and round his head. As he measured, he said, \"Every Ollivander wand has a core of a powerful magical substance, Mr. Potter. We use unicorn hairs, phoenix tail feathers, and the heartstrings of dragons. No two Ollivander wands are the same, just as no two unicorns, dragons, or phoenixes are quite the same. And of course, you will never get such good results with another wizard's wand.\"", "begin": 8215.883, "end": 8253.243, "localBegin": 2233.12, "localEnd": 2270.48}, {"id": "c005_f000267", "text": "Harry suddenly realized that the tape measure, which was measuring between his nostrils, was doing this on its own. Mr. Ollivander was flitting around the shelves, taking down boxes.", "begin": 8253.243, "end": 8265.043, "localBegin": 2270.48, "localEnd": 2282.28}, {"id": "c005_f000268", "text": "\"That will do,\" he said, and the tape measure crumpled into a heap on the floor. \"Right then, Mr. Potter. Try this one. Beechwood and dragon heartstring. Nine inches. Nice and flexible. Just take it and give it a wave.\"", "begin": 8265.043, "end": 8282.403, "localBegin": 2282.28, "localEnd": 2299.64}, {"id": "c005_f000269", "text": "Harry took the wand and (feeling foolish) waved it around a bit, but Mr. Ollivander snatched it out of his hand almost at once.", "begin": 8282.403, "end": 8290.923, "localBegin": 2299.64, "localEnd": 2308.16}, {"id": "c005_f000270", "text": "\"Maple and phoenix feather. Seven inches. Quite whippy. Try - \"", "begin": 8290.923, "end": 8296.283, "localBegin": 2308.16, "localEnd": 2313.52}, {"id": "c005_f000271", "text": "Harry tried - but he had hardly raised the wand when it, too, was snatched back by Mr. Ollivander.", "begin": 8296.283, "end": 8302.443, "localBegin": 2313.52, "localEnd": 2319.68}, {"id": "c005_f000272", "text": "\"No, no - here, ebony and unicorn hair, eight and a half inches, springy. Go on, go on, try it out.\"", "begin": 8302.443, "end": 8309.923, "localBegin": 2319.68, "localEnd": 2327.16}, {"id": "c005_f000273", "text": "Harry tried. And tried. He had no idea what Mr. Ollivander was waiting for. The pile of tried wands was mounting higher and higher on the spindly chair, but the more wands Mr. Ollivander pulled from the shelves, the happier he seemed to become.", "begin": 8309.923, "end": 8325.883, "localBegin": 2327.16, "localEnd": 2343.12}, {"id": "c005_f000274", "text": "\"Tricky customer, eh? Not to worry, we'll find the perfect match here somewhere - I wonder, now - yes, why not - unusual combination - holly and phoenix feather, eleven inches, nice and supple.\"", "begin": 8325.883, "end": 8345.003, "localBegin": 2343.12, "localEnd": 2362.24}, {"id": "c005_f000275", "text": "Harry took the wand. He felt a sudden warmth in his fingers. He raised the wand above his head, brought it swishing down through the dusty air and a stream of red and gold sparks shot from the end like a firework, throwing dancing spots of light on to the walls. Hagrid whooped and clapped and Mr. Ollivander cried, \"Oh, bravo! Yes, indeed, oh, very good. Well, well, well . . . how curious . . . how very curious . . .\"", "begin": 8345.003, "end": 8376.603, "localBegin": 2362.24, "localEnd": 2393.84}, {"id": "c005_f000276", "text": "He put Harry's wand back into its box and wrapped it in brown paper, still muttering, \"Curious . . . curious . . .\"", "begin": 8376.603, "end": 8385.163, "localBegin": 2393.84, "localEnd": 2402.4}, {"id": "c005_f000277", "text": "\"Sorry,\" said Harry, \"but what's curious?\"", "begin": 8385.163, "end": 8389.403, "localBegin": 2402.4, "localEnd": 2406.64}, {"id": "c005_f000278", "text": "Mr. Ollivander fixed Harry with his pale stare.", "begin": 8389.403, "end": 8392.883, "localBegin": 2406.64, "localEnd": 2410.12}, {"id": "c005_f000279", "text": "\"I remember every wand I've ever sold, Mr. Potter. Every single wand. It so happens that the phoenix whose tail feather is in your wand, gave another feather just one other. It is very curious indeed that you should be destined for this wand when its brother - why, its brother gave you that scar.\"", "begin": 8392.883, "end": 8419.603, "localBegin": 2410.12, "localEnd": 2436.84}, {"id": "c005_f000280", "text": "Harry swallowed.", "begin": 8419.603, "end": 8421.443, "localBegin": 2436.84, "localEnd": 2438.68}, {"id": "c005_f000281", "text": "\"Yes, thirteen-and-a-half inches. Yew. Curious indeed how these things happen. The wand chooses the wizard, remember. . . . I think we must expect great things from you, Mr. Potter. . . . After all, He-Who-Must-Not-Be-Named did great things terrible, yes, but great.\"", "begin": 8421.443, "end": 8446.963, "localBegin": 2438.68, "localEnd": 2464.2}, {"id": "c005_f000282", "text": "Harry shivered. He wasn't sure he liked Mr. Ollivander too much. He paid seven gold Galleons for his wand, and Mr. Ollivander bowed them from his shop.", "begin": 8446.963, "end": 8460.563, "localBegin": 2464.2, "localEnd": 2477.8}, {"id": "c005_f000283", "text": "The late afternoon sun hung low in the sky as Harry and Hagrid made their way back down Diagon Alley, back through the wall, back through the Leaky Cauldron, now empty. Harry didn't speak at all as they walked down the road; he didn't even notice how much people were gawking at them on the Underground, laden as they were with all their funny-shaped packages, with the snowy owl asleep in its cage on Harry's lap. Up another escalator, out into Paddington station; Harry only realized where they were when Hagrid tapped him on the shoulder.", "begin": 8460.563, "end": 8494.723, "localBegin": 2477.8, "localEnd": 2511.96}, {"id": "c005_f000284", "text": "\"Got time fer a bite to eat before yer train leaves,\" he said.", "begin": 8494.723, "end": 8499.843, "localBegin": 2511.96, "localEnd": 2517.08}, {"id": "c005_f000285", "text": "He bought Harry a hamburger and they sat down on plastic seats to eat them. Harry kept looking around. Everything looked so strange, somehow.", "begin": 8499.843, "end": 8508.923, "localBegin": 2517.08, "localEnd": 2526.16}, {"id": "c005_f000286", "text": "\"You all right, Harry? Yer very quiet,\" said Hagrid.", "begin": 8508.923, "end": 8513.683, "localBegin": 2526.16, "localEnd": 2530.92}, {"id": "c005_f000287", "text": "Harry wasn't sure he could explain. He'd just had the best birthday of his life - and yet - he chewed his hamburger, trying to find the words.", "begin": 8513.683, "end": 8523.483, "localBegin": 2530.92, "localEnd": 2540.72}, {"id": "c005_f000288", "text": "\"Everyone thinks I'm special,\" he said at last. \"All those people in the Leaky Cauldron, Professor Quirrell, Mr. Ollivander . . . but I don't know anything about magic at all. How can they expect great things? I'm famous and I can't even remember what I'm famous for. I don't know what happened when Vol-, sorry - I mean, the night my parents died.\"", "begin": 8523.483, "end": 8547.963, "localBegin": 2540.72, "localEnd": 2565.2}, {"id": "c005_f000289", "text": "Hagrid leaned across the table. Behind the wild beard and eyebrows he wore a very kind smile.", "begin": 8547.963, "end": 8554.803, "localBegin": 2565.2, "localEnd": 2572.04}, {"id": "c005_f000290", "text": "\"Don' you worry, Harry. You'll learn fast enough. Everyone starts at the beginning at Hogwarts, you'll be just fine. Just be yerself. I know it's hard. Yeh've been singled out, an' that's always hard. But yeh'll have a great time at Hogwarts - I did - still do, 'smatter of fact.\"", "begin": 8554.803, "end": 8575.723, "localBegin": 2572.04, "localEnd": 2592.96}, {"id": "c005_f000291", "text": "Hagrid helped Harry on to the train that would take him back to the Dursleys, then handed him an envelope.", "begin": 8575.723, "end": 8582.883, "localBegin": 2592.96, "localEnd": 2600.12}, {"id": "c005_f000292", "text": "\"Yer ticket fer Hogwarts,\" he said. \"First o' September - King's Cross - it's", "begin": 8582.883, "end": 8590.443, "localBegin": 2600.12, "localEnd": 2607.68}, {"id": "c005_f000293", "text": "all on yer ticket. Any problems with the Dursleys, send me a letter with yer owl, she'll know where to find me. . . . See yeh soon, Harry.\"", "begin": 8590.443, "end": 8600.643, "localBegin": 2607.68, "localEnd": 2617.88}, {"id": "c005_f000294", "text": "The train pulled out of the station. Harry wanted to watch Hagrid until he was out of sight; he rose in his seat and pressed his nose against the window, but he blinked and Hagrid had gone.", "begin": 8600.643, "end": 8617.763, "localBegin": 2617.88, "localEnd": 2635.0}]}, {"kind": "chapter", "number": 6, "title": "The Journey from Platform Nine and Three-quarters", "audio": "../Harry Potter and the Sorcerer's Stone, Book 1 (Unabridged)/006 - Harry Potter and the Sorcerer's Stone, Book 1 (Unabridged).mp3", "start": 8617.763, "end": 10912.266, "duration": 2294.503, "paragraphs": [{"id": "c006_f000001", "text": "Chapter Six. The Journey from Platform Nine and Three-quarters.", "begin": 8617.763, "end": 8623.523, "localBegin": 0.0, "localEnd": 5.76}, {"id": "c006_f000002", "text": "Harry's last month with the Dursleys wasn't fun. True, Dudley was now so scared of Harry he wouldn't stay in the same room, while Aunt Petunia and Uncle Vernon didn't shut Harry in his cupboard, force him to do anything, or shout at him - in fact, they didn't speak to him at all. Half terrified, half furious, they acted as though any chair with Harry in it were empty. Although this was an improvement in many ways, it did become a bit depressing after a while.", "begin": 8623.523, "end": 8652.043, "localBegin": 5.76, "localEnd": 34.28}, {"id": "c006_f000003", "text": "Harry kept to his room, with his new owl for company. He had decided to call her Hedwig, a name he had found in A History of Magic. His school books were very interesting. He lay on his bed reading late into the night, Hedwig swooping in and out of the open window as she pleased. It was lucky that Aunt Petunia didn't come in to vacuum anymore, because Hedwig kept bringing back dead mice. Every night before he went to sleep, Harry ticked off another day on the piece of paper he had pinned to the wall, counting down to September the first.", "begin": 8652.043, "end": 8686.723, "localBegin": 34.28, "localEnd": 68.96}, {"id": "c006_f000004", "text": "On the last day of August he thought he'd better speak to his aunt and uncle about getting to King's Cross station the next day, so he went down to the living room where they were watching a quiz show on television. He cleared his throat to let them know he was there, and Dudley screamed and ran from the room.", "begin": 8686.723, "end": 8701.523, "localBegin": 68.96, "localEnd": 83.76}, {"id": "c006_f000005", "text": "\"Er - Uncle Vernon?\"", "begin": 8701.523, "end": 8704.803, "localBegin": 83.76, "localEnd": 87.04}, {"id": "c006_f000006", "text": "Uncle Vernon grunted to show he was listening.", "begin": 8704.803, "end": 8707.083, "localBegin": 87.04, "localEnd": 89.32}, {"id": "c006_f000007", "text": "\"Er - I need to be at King's Cross tomorrow to - to go to Hogwarts.\"", "begin": 8707.083, "end": 8713.843, "localBegin": 89.32, "localEnd": 96.08}, {"id": "c006_f000008", "text": "Uncle Vernon grunted again.", "begin": 8713.843, "end": 8715.123, "localBegin": 96.08, "localEnd": 97.36}, {"id": "c006_f000009", "text": "\"Would it be all right if you gave me a lift?\"", "begin": 8715.123, "end": 8718.443, "localBegin": 97.36, "localEnd": 100.68}, {"id": "c006_f000010", "text": "Grunt. Harry supposed that meant yes.", "begin": 8718.443, "end": 8720.843, "localBegin": 100.68, "localEnd": 103.08}, {"id": "c006_f000011", "text": "\"Thank you.\"", "begin": 8720.843, "end": 8723.003, "localBegin": 103.08, "localEnd": 105.24}, {"id": "c006_f000012", "text": "He was about to go back upstairs when Uncle Vernon actually spoke.", "begin": 8723.003, "end": 8726.123, "localBegin": 105.24, "localEnd": 108.36}, {"id": "c006_f000013", "text": "\"Funny way to get to a wizards' school, the train. Magic carpets all got punctures, have they?\"", "begin": 8726.123, "end": 8733.803, "localBegin": 108.36, "localEnd": 116.04}, {"id": "c006_f000014", "text": "Harry didn't say anything.", "begin": 8733.803, "end": 8734.923, "localBegin": 116.04, "localEnd": 117.16}, {"id": "c006_f000015", "text": "\"Where is this school, anyway?\"", "begin": 8734.923, "end": 8737.523, "localBegin": 117.16, "localEnd": 119.76}, {"id": "c006_f000016", "text": "\"I don't know,\" said Harry, realizing this for the first time. He pulled the ticket Hagrid had given him out of his pocket.", "begin": 8737.523, "end": 8745.043, "localBegin": 119.76, "localEnd": 127.28}, {"id": "c006_f000017", "text": "\"I just take the train from platform nine and three-quarters at eleven o'clock,\" he read.", "begin": 8745.043, "end": 8751.163, "localBegin": 127.28, "localEnd": 133.4}, {"id": "c006_f000018", "text": "His aunt and uncle stared.", "begin": 8751.163, "end": 8752.403, "localBegin": 133.4, "localEnd": 134.64}, {"id": "c006_f000019", "text": "\"Platform what?\"", "begin": 8752.403, "end": 8754.563, "localBegin": 134.64, "localEnd": 136.8}, {"id": "c006_f000020", "text": "\"Nine and three-quarters.\"", "begin": 8754.563, "end": 8756.283, "localBegin": 136.8, "localEnd": 138.52}, {"id": "c006_f000021", "text": "\"Don't talk rubbish,\" said Uncle Vernon. \"There is no platform nine and threequarters.\"", "begin": 8756.283, "end": 8762.323, "localBegin": 138.52, "localEnd": 144.56}, {"id": "c006_f000022", "text": "\"It's on my ticket.\"", "begin": 8762.323, "end": 8764.003, "localBegin": 144.56, "localEnd": 146.24}, {"id": "c006_f000023", "text": "\"Barking,\" said Uncle Vernon, \"howling mad, the lot of them. You'll see. You just wait. All right, we'll take you to King's Cross. We're going up to London tomorrow anyway, or I wouldn't bother.\"", "begin": 8764.003, "end": 8776.643, "localBegin": 146.24, "localEnd": 158.88}, {"id": "c006_f000024", "text": "\"Why are you going to London?\" Harry asked, trying to keep things friendly.", "begin": 8776.643, "end": 8780.723, "localBegin": 158.88, "localEnd": 162.96}, {"id": "c006_f000025", "text": "\"Taking Dudley to the hospital,\" growled Uncle Vernon. \"Got to have that ruddy tail removed before he goes to Smeltings.\"", "begin": 8780.723, "end": 8790.843, "localBegin": 162.96, "localEnd": 173.08}, {"id": "c006_f000026", "text": "Harry woke at five o'clock the next morning and was too excited and nervous to go back to sleep. He got up and pulled on his jeans because he didn't want to walk into the station in his wizard's robes - he'd change on the train. He checked his Hogwarts list yet again to make sure he had everything he needed, saw that Hedwig was shut safely in her cage, and then paced the room, waiting for the Dursleys to get up. Two hours later, Harry's huge, heavy trunk had been loaded into the Dursleys' car, Aunt Petunia had talked Dudley into sitting next to Harry, and they had set off.", "begin": 8790.843, "end": 8825.483, "localBegin": 173.08, "localEnd": 207.72}, {"id": "c006_f000027", "text": "They reached King's Cross at half past ten. Uncle Vernon dumped Harry's trunk onto a cart and wheeled it into the station for him. Harry thought this was strangely kind until Uncle Vernon stopped dead, facing the platforms with a nasty grin on his face.", "begin": 8825.483, "end": 8840.283, "localBegin": 207.72, "localEnd": 222.52}, {"id": "c006_f000028", "text": "\"Well, there you are, boy. Platform nine - platform ten. Your platform should be somewhere in the middle, but they don't seem to have built it yet, do they?\"", "begin": 8840.283, "end": 8853.763, "localBegin": 222.52, "localEnd": 236.0}, {"id": "c006_f000029", "text": "He was quite right, of course. There was a big plastic number nine over one", "begin": 8853.763, "end": 8858.083, "localBegin": 236.0, "localEnd": 240.32}, {"id": "c006_f000030", "text": "platform and a big plastic number ten over the one next to it, and in the middle, nothing at all.", "begin": 8858.083, "end": 8864.563, "localBegin": 240.32, "localEnd": 246.8}, {"id": "c006_f000031", "text": "\"Have a good term,\" said Uncle Vernon with an even nastier smile. He left without another word. Harry turned and saw the Dursleys drive away. All three of them were laughing. Harry's mouth went rather dry. What on earth was he going to do? He was starting to attract a lot of funny looks, because of Hedwig. He'd have to ask someone.", "begin": 8864.563, "end": 8888.363, "localBegin": 246.8, "localEnd": 270.6}, {"id": "c006_f000032", "text": "He stopped a passing guard, but didn't dare mention platform nine and threequarters. The guard had never heard of Hogwarts and when Harry couldn't even tell him what part of the country it was in, he started to get annoyed, as though Harry was being stupid on purpose. Getting desperate, Harry asked for the train that left at eleven o'clock, but the guard said there wasn't one. In the end the guard strode away, muttering about time wasters. Harry was now trying hard not to panic. According to the large clock over the arrivals board, he had ten minutes left to get on the train to Hogwarts and he had no idea how to do it; he was stranded in the middle of a station with a trunk he could hardly lift, a pocket full of wizard money, and a large owl.", "begin": 8888.363, "end": 8933.083, "localBegin": 270.6, "localEnd": 315.32}, {"id": "c006_f000033", "text": "Hagrid must have forgotten to tell him something you had to do, like tapping the third brick on the left to get into Diagon Alley. He wondered if he should get out his wand and start tapping the ticket inspector's stand between platforms nine and ten.", "begin": 8933.083, "end": 8947.603, "localBegin": 315.32, "localEnd": 329.84}, {"id": "c006_f000034", "text": "At that moment a group of people passed just behind him and he caught a few words of what they were saying.", "begin": 8947.603, "end": 8952.883, "localBegin": 329.84, "localEnd": 335.12}, {"id": "c006_f000035", "text": "\" - packed with Muggles, of course - \"", "begin": 8952.883, "end": 8956.683, "localBegin": 335.12, "localEnd": 338.92}, {"id": "c006_f000036", "text": "Harry swung round. The speaker was a plump woman who was talking to four boys, all with flaming red hair. Each of them was pushing a trunk like Harry's in front of him - and they had an owl.", "begin": 8956.683, "end": 8968.843, "localBegin": 338.92, "localEnd": 351.08}, {"id": "c006_f000037", "text": "Heart hammering, Harry pushed his cart after them. They stopped and so did he, just near enough to hear what they were saying.", "begin": 8968.843, "end": 8976.163, "localBegin": 351.08, "localEnd": 358.4}, {"id": "c006_f000038", "text": "\"Now, what's the platform number?\" said the boys' mother.", "begin": 8976.163, "end": 8980.603, "localBegin": 358.4, "localEnd": 362.84}, {"id": "c006_f000039", "text": "\"Nine and three-quarters!\" piped a small girl, also red-headed, who was holding her hand. \"Mum, can't I go . . .\"", "begin": 8980.603, "end": 8987.363, "localBegin": 362.84, "localEnd": 369.6}, {"id": "c006_f000040", "text": "\"You're not old enough, Ginny, now be quiet. All right, Percy, you go first.\"", "begin": 8987.363, "end": 8993.403, "localBegin": 369.6, "localEnd": 375.64}, {"id": "c006_f000041", "text": "What looked like the oldest boy marched toward platforms nine and ten. Harry watched, careful not to blink in case he missed it - but just as the boy reached the dividing barrier between the two platforms, a large crowd of tourists came swarming in front of him and by the time the last backpack had cleared away, the boy had vanished.", "begin": 8993.403, "end": 9011.403, "localBegin": 375.64, "localEnd": 393.64}, {"id": "c006_f000042", "text": "\"Fred, you next,\" the plump woman said.", "begin": 9011.403, "end": 9015.243, "localBegin": 393.64, "localEnd": 397.48}, {"id": "c006_f000043", "text": "\"I'm not Fred, I'm George,\" said the boy. \"Honestly, woman, you call yourself our mother? Can't you tell I'm George?\"", "begin": 9015.243, "end": 9024.283, "localBegin": 397.48, "localEnd": 406.52}, {"id": "c006_f000044", "text": "\"Sorry, George, dear.\"", "begin": 9024.283, "end": 9025.963, "localBegin": 406.52, "localEnd": 408.2}, {"id": "c006_f000045", "text": "\"Only joking, I am Fred,\" said the boy, and off he went. His twin called after him to hurry up, and he must have done so, because a second later, he had gone but how had he done it?", "begin": 9025.963, "end": 9038.963, "localBegin": 408.2, "localEnd": 421.2}, {"id": "c006_f000046", "text": "Now the third brother was walking briskly toward the barrier - he was almost there - and then, quite suddenly, he wasn't anywhere.", "begin": 9038.963, "end": 9047.003, "localBegin": 421.2, "localEnd": 429.24}, {"id": "c006_f000047", "text": "There was nothing else for it.", "begin": 9047.003, "end": 9048.483, "localBegin": 429.24, "localEnd": 430.72}, {"id": "c006_f000048", "text": "\"Excuse me,\" Harry said to the plump woman.", "begin": 9048.483, "end": 9050.963, "localBegin": 430.72, "localEnd": 433.2}, {"id": "c006_f000049", "text": "\"Hello, dear,\" she said. \"First time at Hogwarts? Ron's new, too.\"", "begin": 9050.963, "end": 9056.683, "localBegin": 433.2, "localEnd": 438.92}, {"id": "c006_f000050", "text": "She pointed at the last and youngest of her sons. He was tall, thin, and gangling, with freckles, big hands and feet, and a long nose.", "begin": 9056.683, "end": 9064.363, "localBegin": 438.92, "localEnd": 446.6}, {"id": "c006_f000051", "text": "\"Yes,\" said Harry. \"The thing is - the thing is, I don't know how to - \"", "begin": 9064.363, "end": 9070.403, "localBegin": 446.6, "localEnd": 452.64}, {"id": "c006_f000052", "text": "\"How to get onto the platform?\" she said kindly, and Harry nodded.", "begin": 9070.403, "end": 9075.163, "localBegin": 452.64, "localEnd": 457.4}, {"id": "c006_f000053", "text": "\"Not to worry,\" she said. \"All you have to do is walk straight at the barrier between platforms nine and ten. Don't stop and don't be scared you'll crash into it, that's very important. Best do it at a bit of a run if you're nervous. Go on, go now before Ron.\"", "begin": 9075.163, "end": 9095.443, "localBegin": 457.4, "localEnd": 477.68}, {"id": "c006_f000054", "text": "\"Er - okay,\" said Harry.", "begin": 9095.443, "end": 9099.243, "localBegin": 477.68, "localEnd": 481.48}, {"id": "c006_f000055", "text": "He pushed his trolley around and stared at the barrier. It looked very solid.", "begin": 9099.243, "end": 9103.843, "localBegin": 481.48, "localEnd": 486.08}, {"id": "c006_f000056", "text": "He started to walk toward it. People jostled him on their way to platforms nine and ten. Harry walked more quickly. He was going to smash right into that barrier and then he'd be in trouble - leaning forward on his cart, he broke into a heavy", "begin": 9103.843, "end": 9117.563, "localBegin": 486.08, "localEnd": 499.8}, {"id": "c006_f000057", "text": "run - the barrier was coming nearer and nearer - he wouldn't be able to stop - the cart was out of control - he was a foot away - he closed his eyes ready for the crash -", "begin": 9117.563, "end": 9127.643, "localBegin": 499.8, "localEnd": 509.88}, {"id": "c006_f000058", "text": "It didn't come . . . he kept on running . . . he opened his eyes.", "begin": 9127.643, "end": 9133.363, "localBegin": 509.88, "localEnd": 515.6}, {"id": "c006_f000059", "text": "A scarlet steam engine was waiting next to a platform packed with people. A sign overhead said Hogwarts Express, eleven o'clock. Harry looked behind him and saw a wrought-iron archway where the barrier had been, with the words Platform Nine and Three-Quarters on it. He had done it.", "begin": 9133.363, "end": 9154.323, "localBegin": 515
