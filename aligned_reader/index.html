itting each other while the teachers weren't looking. This was supposed to be good training for later life.", "begin": 3192.158, "end": 3214.558, "localBegin": 127.4, "localEnd": 149.8}, {"id": "c003_f000009", "text": "As he looked at Dudley in his new knickerbockers, Uncle Vernon said gruffly that it was the proudest moment of his life. Aunt Petunia burst into tears and said", "begin": 3214.558, "end": 3223.438, "localBegin": 149.8, "localEnd": 158.68}, {"id": "c003_f000010", "text": "she couldn't believe it was her Ickle Dudleykins, he looked so handsome and grownup. Harry didn't trust himself to speak. He thought two of his ribs might already have cracked from trying not to laugh.", "begin": 3223.438, "end": 3239.758, "localBegin": 158.68, "localEnd": 175.0}, {"id": "c003_f000011", "text": "There was a horrible smell in the kitchen the next morning when Harry went in for breakfast. It seemed to be coming from a large metal tub in the sink. He went to have a look. The tub was full of what looked like dirty rags swimming in gray water.", "begin": 3239.758, "end": 3253.518, "localBegin": 175.0, "localEnd": 188.76}, {"id": "c003_f000012", "text": "\"What's this?\" he asked Aunt Petunia. Her lips tightened as they always did if he dared to ask a question.", "begin": 3253.518, "end": 3261.758, "localBegin": 188.76, "localEnd": 197.0}, {"id": "c003_f000013", "text": "\"Your new school uniform,\" she said.", "begin": 3261.758, "end": 3266.278, "localBegin": 197.0, "localEnd": 201.52}, {"id": "c003_f000014", "text": "Harry looked in the bowl again.", "begin": 3266.278, "end": 3267.598, "localBegin": 201.52, "localEnd": 202.84}, {"id": "c003_f000015", "text": "\"Oh,\" he said, \"I didn't realize it had to be so wet.\"", "begin": 3267.598, "end": 3272.638, "localBegin": 202.84, "localEnd": 207.88}, {"id": "c003_f000016", "text": "\"Don't be stupid,\" snapped Aunt Petunia. \"I'm dyeing some of Dudley's old things gray for you. It'll look just like everyone else's when I've finished.\"", "begin": 3272.638, "end": 3284.478, "localBegin": 207.88, "localEnd": 219.72}, {"id": "c003_f000017", "text": "Harry seriously doubted this, but thought it best not to argue. He sat down at the table and tried not to think about how he was going to look on his first day at Stonewall High - like he was wearing bits of old elephant skin, probably.", "begin": 3284.478, "end": 3299.438, "localBegin": 219.72, "localEnd": 234.68}, {"id": "c003_f000018", "text": "Dudley and Uncle Vernon came in, both with wrinkled noses because of the smell from Harry's new uniform. Uncle Vernon opened his newspaper as usual and Dudley banged his Smelting stick, which he carried everywhere, on the table.", "begin": 3299.438, "end": 3313.998, "localBegin": 234.68, "localEnd": 249.24}, {"id": "c003_f000019", "text": "They heard the click of the mail slot and flop of letters on the doormat.", "begin": 3313.998, "end": 3317.398, "localBegin": 249.24, "localEnd": 252.64}, {"id": "c003_f000020", "text": "\"Get the mail, Dudley,\" said Uncle Vernon from behind his paper.", "begin": 3317.398, "end": 3321.838, "localBegin": 252.64, "localEnd": 257.08}, {"id": "c003_f000021", "text": "\"Make Harry get it.\"", "begin": 3321.838, "end": 3323.638, "localBegin": 257.08, "localEnd": 258.88}, {"id": "c003_f000022", "text": "\"Get the mail, Harry.\"", "begin": 3323.638, "end": 3326.158, "localBegin": 258.88, "localEnd": 261.4}, {"id": "c003_f000023", "text": "\"Make Dudley get it.\"", "begin": 3326.158, "end": 3328.038, "localBegin": 261.4, "localEnd": 263.28}, {"id": "c003_f000024", "text": "\"Poke him with your Smelting stick, Dudley.\"", "begin": 3328.038, "end": 3332.518, "localBegin": 263.28, "localEnd": 267.76}, {"id": "c003_f000025", "text": "Harry dodged the Smelting stick and went to get the mail. Three things lay on the doormat: a postcard from Uncle Vernon's sister Marge, who was vacationing on the Isle of Wight, a brown envelope that looked like a bill, and - a letter for Harry.", "begin": 3332.518, "end": 3350.518, "localBegin": 267.76, "localEnd": 285.76}, {"id": "c003_f000026", "text": "Harry picked it up and stared at it, his heart twanging like a giant elastic band. No one, ever, in his whole life, had written to him. Who would? He had no friends, no other relatives - he didn't belong to the library, so he'd never even got rude notes asking for books back. Yet here it was, a letter, addressed so plainly there could be no mistake:", "begin": 3350.518, "end": 3373.638, "localBegin": 285.76, "localEnd": 308.88}, {"id": "c003_f000027", "text": "Mr. H. Potter", "begin": 3373.638, "end": 3375.238, "localBegin": 308.88, "localEnd": 310.48}, {"id": "c003_f000028", "text": "The Cupboard under the Stairs", "begin": 3375.238, "end": 3377.158, "localBegin": 310.48, "localEnd": 312.4}, {"id": "c003_f000029", "text": "4 Privet Drive", "begin": 3377.158, "end": 3378.798, "localBegin": 312.4, "localEnd": 314.04}, {"id": "c003_f000030", "text": "Little Whinging", "begin": 3378.798, "end": 3380.158, "localBegin": 314.04, "localEnd": 315.4}, {"id": "c003_f000031", "text": "Surrey", "begin": 3380.158, "end": 3382.078, "localBegin": 315.4, "localEnd": 317.32}, {"id": "c003_f000032", "text": "The envelope was thick and heavy, made of yellowish parchment, and the address was written in emerald-green ink. There was no stamp.", "begin": 3382.078, "end": 3390.238, "localBegin": 317.32, "localEnd": 325.48}, {"id": "c003_f000033", "text": "Turning the envelope over, his hand trembling, Harry saw a purple wax seal bearing a coat of arms; a lion, an eagle, a badger, and a snake surrounding a large letter H.", "begin": 3390.238, "end": 3403.638, "localBegin": 325.48, "localEnd": 338.88}, {"id": "c003_f000034", "text": "\"Hurry up, boy!\" shouted Uncle Vernon from the kitchen. \"What are you doing, checking for letter bombs?\" He chuckled at his own joke.", "begin": 3403.638, "end": 3414.318, "localBegin": 338.88, "localEnd": 349.56}, {"id": "c003_f000035", "text": "Harry went back to the kitchen, still staring at his letter. He handed Uncle Vernon the bill and the postcard, sat down, and slowly began to open the yellow envelope.", "begin": 3414.318, "end": 3425.198, "localBegin": 349.56, "localEnd": 360.44}, {"id": "c003_f000036", "text": "Uncle Vernon ripped open the bill, snorted in disgust, and flipped over the postcard.", "begin": 3425.198, "end": 3430.238, "localBegin": 360.44, "localEnd": 365.48}, {"id": "c003_f000037", "text": "\"Marge's ill,\" he informed Aunt Petunia. \"Ate a funny whelk . . .\"", "begin": 3430.238, "end": 3435.358, "localBegin": 365.48, "localEnd": 370.6}, {"id": "c003_f000038", "text": "\"Dad!\" said Dudley suddenly. \"Dad, Harry's got something!\"", "begin": 3435.358, "end": 3441.078, "localBegin": 370.6, "localEnd": 376.32}, {"id": "c003_f000039", "text": "Harry was on the point of unfolding his letter, which was written on the same heavy parchment as the envelope, when it was jerked sharply out of his hand by Uncle Vernon.", "begin": 3441.078, "end": 3449.198, "localBegin": 376.32, "localEnd": 384.44}, {"id": "c003_f000040", "text": "\"That's mine!\" said Harry, trying to snatch it back.", "begin": 3449.198, "end": 3452.278, "localBegin": 384.44, "localEnd": 387.52}, {"id": "c003_f000041", "text": "\"Who'd be writing to you?\" sneered Uncle Vernon, shaking the letter open with one hand and glancing at it. His face went from red to green faster than a set of", "begin": 3452.278, "end": 3462.918, "localBegin": 387.52, "localEnd": 398.16}, {"id": "c003_f000042", "text": "traffic lights. And it didn't stop there. Within seconds it was the grayish white of old porridge.", "begin": 3462.918, "end": 3468.918, "localBegin": 398.16, "localEnd": 404.16}, {"id": "c003_f000043", "text": "\"P-P-Petunia!\" he gasped.", "begin": 3468.918, "end": 3473.118, "localBegin": 404.16, "localEnd": 408.36}, {"id": "c003_f000044", "text": "Dudley tried to grab the letter to read it, but Uncle Vernon held it high out of his reach. Aunt Petunia took it curiously and read the first line. For a moment it looked as though she might faint. She clutched her throat and made a choking noise.", "begin": 3473.118, "end": 3486.278, "localBegin": 408.36, "localEnd": 421.52}, {"id": "c003_f000045", "text": "\"Vernon! Oh my goodness - Vernon!\"", "begin": 3486.278, "end": 3494.118, "localBegin": 421.52, "localEnd": 429.36}, {"id": "c003_f000046", "text": "They stared at each other, seeming to have forgotten that Harry and Dudley were still in the room. Dudley wasn't used to being ignored. He gave his father a sharp tap on the head with his Smelting stick.", "begin": 3494.118, "end": 3505.118, "localBegin": 429.36, "localEnd": 440.36}, {"id": "c003_f000047", "text": "\"I want to read that letter,\" he said loudly.", "begin": 3505.118, "end": 3508.518, "localBegin": 440.36, "localEnd": 443.76}, {"id": "c003_f000048", "text": "\"I want to read it,\" said Harry furiously, \"as it's mine.\"", "begin": 3508.518, "end": 3512.558, "localBegin": 443.76, "localEnd": 447.8}, {"id": "c003_f000049", "text": "\"Get out, both of you,\" croaked Uncle Vernon, stuffing the letter back inside its envelope.", "begin": 3512.558, "end": 3519.398, "localBegin": 447.8, "localEnd": 454.64}, {"id": "c003_f000050", "text": "Harry didn't move.", "begin": 3519.398, "end": 3520.478, "localBegin": 454.64, "localEnd": 455.72}, {"id": "c003_f000051", "text": "\"I WANT MY LETTER!\" he shouted.", "begin": 3520.478, "end": 3523.598, "localBegin": 455.72, "localEnd": 458.84}, {"id": "c003_f000052", "text": "\"Let me see it!\" demanded Dudley.", "begin": 3523.598, "end": 3526.558, "localBegin": 458.84, "localEnd": 461.8}, {"id": "c003_f000053", "text": "\"OUT!\" roared Uncle Vernon, and he took both Harry and Dudley by the scruffs of their necks and threw them into the hall, slamming the kitchen door behind them. Harry and Dudley promptly had a furious but silent fight over who would listen at the keyhole; Dudley won, so Harry, his glasses dangling from one ear, lay flat on his stomach to listen at the crack between door and floor.", "begin": 3526.558, "end": 3550.278, "localBegin": 461.8, "localEnd": 485.52}, {"id": "c003_f000054", "text": "\"Vernon,\" Aunt Petunia was saying in a quivering voice, \"look at the address how could they possibly know where he sleeps? You don't think they're watching the house?\"", "begin": 3550.278, "end": 3562.358, "localBegin": 485.52, "localEnd": 497.6}, {"id": "c003_f000055", "text": "\"Watching - spying - might be following us,\" muttered Uncle Vernon wildly.", "begin": 3562.358, "end": 3568.958, "localBegin": 497.6, "localEnd": 504.2}, {"id": "c003_f000056", "text": "\"But what should we do, Vernon? Should we write back? Tell them we don't want - \"", "begin": 3568.958, "end": 3576.078, "localBegin": 504.2, "localEnd": 511.32}, {"id": "c003_f000057", "text": "Harry could see Uncle Vernon's shiny black shoes pacing up and down the", "begin": 3576.078, "end": 3579.838, "localBegin": 511.32, "localEnd": 515.08}, {"id": "c003_f000058", "text": "kitchen.", "begin": 3579.838, "end": 3580.518, "localBegin": 515.08, "localEnd": 515.76}, {"id": "c003_f000059", "text": "\"No,\" he said finally. \"No, we'll ignore it. If they don't get an answer. . . . Yes, that's best . . . we won't do anything. . . .\"", "begin": 3580.518, "end": 3589.038, "localBegin": 515.76, "localEnd": 524.28}, {"id": "c003_f000060", "text": "\"But - \"", "begin": 3589.038, "end": 3589.998, "localBegin": 524.28, "localEnd": 525.24}, {"id": "c003_f000061", "text": "\"I'm not having one in the house, Petunia! Didn't we swear when we took him in we'd stamp out that dangerous nonsense?\"", "begin": 3589.998, "end": 3598.998, "localBegin": 525.24, "localEnd": 534.24}, {"id": "c003_f000062", "text": "That evening when he got back from work, Uncle Vernon did something he'd never done before; he visited Harry in his cupboard.", "begin": 3598.998, "end": 3606.158, "localBegin": 534.24, "localEnd": 541.4}, {"id": "c003_f000063", "text": "\"Where's my letter?\" said Harry, the moment Uncle Vernon had squeezed through the door. \"Who's writing to me?\"", "begin": 3606.158, "end": 3612.278, "localBegin": 541.4, "localEnd": 547.52}, {"id": "c003_f000064", "text": "\"No one. It was addressed to you by mistake,\" said Uncle Vernon shortly. \"I have burned it.\"", "begin": 3612.278, "end": 3619.478, "localBegin": 547.52, "localEnd": 554.72}, {"id": "c003_f000065", "text": "\"It was not a mistake,\" said Harry angrily, \"it had my cupboard on it.\"", "begin": 3619.478, "end": 3624.598, "localBegin": 554.72, "localEnd": 559.84}, {"id": "c003_f000066", "text": "\"SILENCE!\" yelled Uncle Vernon, and a couple of spiders fell from the ceiling. He took a few deep breaths and then forced his face into a smile, which looked quite painful.", "begin": 3624.598, "end": 3635.238, "localBegin": 559.84, "localEnd": 570.48}, {"id": "c003_f000067", "text": "\"Er - yes, Harry - about this cupboard. Your aunt and I have been thinking . . . you're really getting a bit big for it . . . we think it might be nice if you moved into Dudley's second bedroom.\"", "begin": 3635.238, "end": 3649.238, "localBegin": 570.48, "localEnd": 584.48}, {"id": "c003_f000068", "text": "\"Why?\" said Harry.", "begin": 3649.238, "end": 3651.598, "localBegin": 584.48, "localEnd": 586.84}, {"id": "c003_f000069", "text": "\"Don't ask questions!\" snapped his uncle. \"Take this stuff upstairs, now.\"", "begin": 3651.598, "end": 3657.958, "localBegin": 586.84, "localEnd": 593.2}, {"id": "c003_f000070", "text": "The Dursleys' house had four bedrooms: one for Uncle Vernon and Aunt Petunia, one for visitors (usually Uncle Vernon's sister, Marge), one where Dudley slept, and one where Dudley kept all the toys and things that wouldn't fit into his first bedroom. It only took Harry one trip upstairs to move everything he owned from the cupboard to this room. He sat down on the bed and stared around him. Nearly everything in here was broken. The month-old video camera was lying on top of a small, working tank Dudley had once driven over the next door neighbor's dog; in the corner was Dudley's first-ever television set, which he'd put his foot through when his favorite program had been canceled; there was a large birdcage, which had once held a parrot that Dudley had swapped at school for a real air rifle, which was up on a shelf with the end all bent because Dudley had sat on it. Other shelves", "begin": 3657.958, "end": 3710.958, "localBegin": 593.2, "localEnd": 646.2}, {"id": "c003_f000071", "text": "were full of books. They were the only things in the room that looked as though they'd never been touched.", "begin": 3710.958, "end": 3715.958, "localBegin": 646.2, "localEnd": 651.2}, {"id": "c003_f000072", "text": "From downstairs came the sound of Dudley bawling at his mother, \"I don't want him in there . . . I need that room . . . make him get out. . . .\"", "begin": 3715.958, "end": 3727.478, "localBegin": 651.2, "localEnd": 662.72}, {"id": "c003_f000073", "text": "Harry sighed and stretched out on the bed. Yesterday he'd have given anything to be up here. Today he'd rather be back in his cupboard with that letter than up here without it.", "begin": 3727.478, "end": 3742.038, "localBegin": 662.72, "localEnd": 677.28}, {"id": "c003_f000074", "text": "Next morning at breakfast, everyone was rather quiet. Dudley was in shock. He'd screamed, whacked his father with his Smelting stick, been sick on purpose, kicked his mother, and thrown his tortoise through the greenhouse roof, and he still didn't have his room back. Harry was thinking about this time yesterday and bitterly wishing he'd opened the letter in the hall. Uncle Vernon and Aunt Petunia kept looking at each other darkly.", "begin": 3742.038, "end": 3768.278, "localBegin": 677.28, "localEnd": 703.52}, {"id": "c003_f000075", "text": "When the mail arrived, Uncle Vernon, who seemed to be trying to be nice to Harry, made Dudley go and get it. They heard him banging things with his Smelting stick all the way down the hall. Then he shouted, \"There's another one! 'Mr. H. Potter, The Smallest Bedroom, 4 Privet Drive - '\"", "begin": 3768.278, "end": 3788.878, "localBegin": 703.52, "localEnd": 724.12}, {"id": "c003_f000076", "text": "With a strangled cry, Uncle Vernon leapt from his seat and ran down the hall, Harry right behind him. Uncle Vernon had to wrestle Dudley to the ground to get the letter from him, which was made difficult by the fact that Harry had grabbed Uncle Vernon around the neck from behind. After a minute of confused fighting, in which everyone got hit a lot by the Smelting stick, Uncle Vernon straightened up, gasping for breath, with Harry's letter clutched in his hand.", "begin": 3788.878, "end": 3815.158, "localBegin": 724.12, "localEnd": 750.4}, {"id": "c003_f000077", "text": "\"Go to your cupboard - I mean, your bedroom,\" he wheezed at Harry. \"Dudley go - just go.\"", "begin": 3815.158, "end": 3826.278, "localBegin": 750.4, "localEnd": 761.52}, {"id": "c003_f000078", "text": "Harry walked round and round his new room. Someone knew he had moved out of his cupboard and they seemed to know he hadn't received his first letter. Surely that meant they'd try again? And this time he'd make sure they didn't fail. He had a plan.", "begin": 3826.278, "end": 3842.878, "localBegin": 761.52, "localEnd": 778.12}, {"id": "c003_f000079", "text": "The repaired alarm clock rang at six o'clock the next morning. Harry turned it off quickly and dressed silently. He mustn't wake the Dursleys. He stole downstairs without turning on any of the lights.", "begin": 3842.878, "end": 3856.998, "localBegin": 778.12, "localEnd": 792.24}, {"id": "c003_f000080", "text": "He was going to wait for the postman on the corner of Privet Drive and get the letters for number four first. His heart hammered as he crept across the dark hall", "begin": 3856.998, "end": 3866.238, "localBegin": 792.24, "localEnd": 801.48}, {"id": "c003_f000081", "text": "toward the front door -", "begin": 3866.238, "end": 3867.558, "localBegin": 801.48, "localEnd": 802.8}, {"id": "c003_f000082", "text": "\"AAAAARRRGH!\"", "begin": 3867.558, "end": 3869.518, "localBegin": 802.8, "localEnd": 804.76}, {"id": "c003_f000083", "text": "Harry leapt into the air; he'd trodden on something big and squashy on the doormat - something alive!", "begin": 3869.518, "end": 3877.918, "localBegin": 804.76, "localEnd": 813.16}, {"id": "c003_f000084", "text": "Lights clicked on upstairs and to his horror Harry realized that the big, squashy something had been his uncle's face. Uncle Vernon had been lying at the foot of the front door in a sleeping bag, clearly making sure that Harry didn't do exactly what he'd been trying to do. He shouted at Harry for about half an hour and then told him to go and make a cup of tea. Harry shuffled miserably off into the kitchen and by the time he got back, the mail had arrived, right into Uncle Vernon's lap. Harry could see three letters addressed in green ink.", "begin": 3877.918, "end": 3911.878, "localBegin": 813.16, "localEnd": 847.12}, {"id": "c003_f000085", "text": "\"I want - \" he began, but Uncle Vernon was tearing the letters into pieces before his eyes.", "begin": 3911.878, "end": 3920.118, "localBegin": 847.12, "localEnd": 855.36}, {"id": "c003_f000086", "text": "Uncle Vernon didn't go to work that day. He stayed at home and nailed up the mail slot.", "begin": 3920.118, "end": 3925.798, "localBegin": 855.36, "localEnd": 861.04}, {"id": "c003_f000087", "text": "\"See,\" he explained to Aunt Petunia through a mouthful of nails, \"if they can't deliver them they'll just give up.\"", "begin": 3925.798, "end": 3934.958, "localBegin": 861.04, "localEnd": 870.2}, {"id": "c003_f000088", "text": "\"I'm not sure that'll work, Vernon.\"", "begin": 3934.958, "end": 3938.358, "localBegin": 870.2, "localEnd": 873.6}, {"id": "c003_f000089", "text": "\"Oh, these people's minds work in strange ways, Petunia, they're not like you and me,\" said Uncle Vernon, trying to knock in a nail with the piece of fruitcake Aunt Petunia had just brought him.", "begin": 3938.358, "end": 3950.878, "localBegin": 873.6, "localEnd": 886.12}, {"id": "c003_f000090", "text": "On Friday, no less than twelve letters arrived for Harry. As they couldn't go through the mail slot they had been pushed under the door, slotted through the sides, and a few even forced through the small window in the downstairs bathroom.", "begin": 3950.878, "end": 3968.198, "localBegin": 886.12, "localEnd": 903.44}, {"id": "c003_f000091", "text": "Uncle Vernon stayed at home again. After burning all the letters, he got out a hammer and nails and boarded up the cracks around the front and back doors so no one could go out. He hummed \"Tiptoe Through the Tulips\" as he worked, and jumped at small noises.", "begin": 3968.198, "end": 3985.278, "localBegin": 903.44, "localEnd": 920.52}, {"id": "c003_f000092", "text": "On Saturday, things began to get out of hand. Twenty-four letters to Harry found their way into the house, rolled up and hidden inside each of the two dozen eggs that their very confused milkman had handed Aunt Petunia through the living room window. While Uncle Vernon made furious telephone calls to the post office and the dairy trying to find someone to complain to, Aunt Petunia shredded the letters", "begin": 3985.278, "end": 4009.998, "localBegin": 920.52, "localEnd": 945.24}, {"id": "c003_f000093", "text": "in her food processor.", "begin": 4009.998, "end": 4011.278, "localBegin": 945.24, "localEnd": 946.52}, {"id": "c003_f000094", "text": "\"Who on earth wants to talk to you this badly?\" Dudley asked Harry in amazement.", "begin": 4011.278, "end": 4021.918, "localBegin": 946.52, "localEnd": 957.16}, {"id": "c003_f000095", "text": "On Sunday morning, Uncle Vernon sat down at the breakfast table looking tired and rather ill, but happy.", "begin": 4021.918, "end": 4027.358, "localBegin": 957.16, "localEnd": 962.6}, {"id": "c003_f000096", "text": "\"No post on Sundays,\" he reminded them cheerfully as he spread marmalade on his newspapers, \"no damn letters today - \"", "begin": 4027.358, "end": 4036.638, "localBegin": 962.6, "localEnd": 971.88}, {"id": "c003_f000097", "text": "Something came whizzing down the kitchen chimney as he spoke and caught him sharply on the back of the head. Next moment, thirty or forty letters came pelting out of the fireplace like bullets. The Dursleys ducked, but Harry leapt into the air trying to catch one -", "begin": 4036.638, "end": 4052.158, "localBegin": 971.88, "localEnd": 987.4}, {"id": "c003_f000098", "text": "\"Out! OUT!\"", "begin": 4052.158, "end": 4054.718, "localBegin": 987.4, "localEnd": 989.96}, {"id": "c003_f000099", "text": "Uncle Vernon seized Harry around the waist and threw him into the hall. When Aunt Petunia and Dudley had run out with their arms over their faces, Uncle Vernon slammed the door shut. They could hear the letters still streaming into the room, bouncing off the walls and floor.", "begin": 4054.718, "end": 4071.078, "localBegin": 989.96, "localEnd": 1006.32}, {"id": "c003_f000100", "text": "\"That does it,\" said Uncle Vernon, trying to speak calmly but pulling great tufts out of his mustache at the same time. \"I want you all back here in five minutes ready to leave. We're going away. Just pack some clothes. No arguments!\"", "begin": 4071.078, "end": 4090.358, "localBegin": 1006.32, "localEnd": 1025.6}, {"id": "c003_f000101", "text": "He looked so dangerous with half his mustache missing that no one dared argue. Ten minutes later they had wrenched their way through the boarded-up doors and were in the car, speeding toward the highway. Dudley was sniffling in the back seat; his father had hit him round the head for holding them up while he tried to pack his television, VCR, and computer in his sports bag.", "begin": 4090.358, "end": 4113.878, "localBegin": 1025.6, "localEnd": 1049.12}, {"id": "c003_f000102", "text": "They drove. And they drove. Even Aunt Petunia didn't dare ask where they were going. Every now and then Uncle Vernon would take a sharp turn and drive in the opposite direction for a while.", "begin": 4113.878, "end": 4126.598, "localBegin": 1049.12, "localEnd": 1061.84}, {"id": "c003_f000103", "text": "\"Shake 'em off . . . shake 'em off,\" he would mutter whenever he did this.", "begin": 4126.598, "end": 4131.718, "localBegin": 1061.84, "localEnd": 1066.96}, {"id": "c003_f000104", "text": "They didn't stop to eat or drink all day. By nightfall Dudley was howling. He'd never had such a bad day in his life. He was hungry, he'd missed five television programs he'd wanted to see, and he'd never gone so long without blowing up an alien on his computer.", "begin": 4131.718, "end": 4149.278, "localBegin": 1066.96, "localEnd": 1084.52}, {"id": "c003_f000105", "text": "Uncle Vernon stopped at last outside a gloomy-looking hotel on the outskirts of a big city. Dudley and Harry shared a room with twin beds and damp, musty sheets. Dudley snored but Harry stayed awake, sitting on the windowsill, staring down at the lights of passing cars and wondering. . . .", "begin": 4149.278, "end": 4167.718, "localBegin": 1084.52, "localEnd": 1102.96}, {"id": "c003_f000106", "text": "They ate stale cornflakes and cold tinned tomatoes on toast for breakfast the next day. They had just finished when the owner of the hotel came over to their table.", "begin": 4167.718, "end": 4178.518, "localBegin": 1102.96, "localEnd": 1113.76}, {"id": "c003_f000107", "text": "\"'Scuse me, but is one of you Mr. H. Potter? Only I got about an 'undred of these at the front desk.\"", "begin": 4178.518, "end": 4185.838, "localBegin": 1113.76, "localEnd": 1121.08}, {"id": "c003_f000108", "text": "She held up a letter so they could read the green ink address:", "begin": 4185.838, "end": 4189.758, "localBegin": 1121.08, "localEnd": 1125.0}, {"id": "c003_f000109", "text": "Mr. H. Potter", "begin": 4189.758, "end": 4191.598, "localBegin": 1125.0, "localEnd": 1126.84}, {"id": "c003_f000110", "text": "Room 17", "begin": 4191.598, "end": 4193.118, "localBegin": 1126.84, "localEnd": 1128.36}, {"id": "c003_f000111", "text": "Railview Hotel", "begin": 4193.118, "end": 4194.438, "localBegin": 1128.36, "localEnd": 1129.68}, {"id": "c003_f000112", "text": "Cokeworth", "begin": 4194.438, "end": 4195.478, "localBegin": 1129.68, "localEnd": 1130.72}, {"id": "c003_f000113", "text": "Harry made a grab for the letter but Uncle Vernon knocked his hand out of the way. The woman stared.", "begin": 4195.478, "end": 4201.558, "localBegin": 1130.72, "localEnd": 1136.8}, {"id": "c003_f000114", "text": "\"I'll take them,\" said Uncle Vernon, standing up quickly and following her from the dining room.", "begin": 4201.558, "end": 4208.718, "localBegin": 1136.8, "localEnd": 1143.96}, {"id": "c003_f000115", "text": "\"Wouldn't it be better just to go home, dear?\" Aunt Petunia suggested timidly, hours later, but Uncle Vernon didn't seem to hear her. Exactly what he was looking for, none of them knew. He drove them into the middle of a forest, got out, looked around, shook his head, got back in the car, and off they went again. The same thing happened in the middle of a plowed field, halfway across a suspension bridge, and at the top of a multilevel parking garage.", "begin": 4208.718, "end": 4236.558, "localBegin": 1143.96, "localEnd": 1171.8}, {"id": "c003_f000116", "text": "\"Daddy's gone mad, hasn't he?\" Dudley asked Aunt Petunia dully late that afternoon. Uncle Vernon had parked at the coast, locked them all inside the car, and disappeared.", "begin": 4236.558, "end": 4248.958, "localBegin": 1171.8, "localEnd": 1184.2}, {"id": "c003_f000117", "text": "It started to rain. Great drops beat on the roof of the car. Dudley sniveled.", "begin": 4248.958, "end": 4254.878, "localBegin": 1184.2, "localEnd": 1190.12}, {"id": "c003_f000118", "text": "\"It's Monday,\" he told his mother. \"The Great Humberto's on tonight. I want to stay somewhere with a television.\"", "begin": 4254.878, "end": 4264.758, "localBegin": 1190.12, "localEnd": 1200.0}, {"id": "c003_f000119", "text": "Monday. This reminded Harry of something. If it was Monday - and you could", "begin": 4264.758, "end": 4270.158, "localBegin": 1200.0, "localEnd": 1205.4}, {"id": "c003_f000120", "text": "usually count on Dudley to know the days of the week, because of television - then tomorrow, Tuesday, was Harry's eleventh birthday. Of course, his birthdays were never exactly fun - last year, the Dursleys had given him a coat hanger and a pair of Uncle Vernon's old socks. Still, you weren't eleven every day.", "begin": 4270.158, "end": 4288.478, "localBegin": 1205.4, "localEnd": 1223.72}, {"id": "c003_f000121", "text": "Uncle Vernon was back and he was smiling. He was also carrying a long, thin package and didn't answer Aunt Petunia when she asked what he'd bought.", "begin": 4288.478, "end": 4296.998, "localBegin": 1223.72, "localEnd": 1232.24}, {"id": "c003_f000122", "text": "\"Found the perfect place!\" he said. \"Come on! Everyone out!\"", "begin": 4296.998, "end": 4302.358, "localBegin": 1232.24, "localEnd": 1237.6}, {"id": "c003_f000123", "text": "It was very cold outside the car. Uncle Vernon was pointing at what looked like a large rock way out at sea. Perched on top of the rock was the most miserable little shack you could imagine. One thing was certain, there was no television in there.", "begin": 4302.358, "end": 4317.558, "localBegin": 1237.6, "localEnd": 1252.8}, {"id": "c003_f000124", "text": "\"Storm forecast for tonight!\" said Uncle Vernon gleefully, clapping his hands together. \"And this gentleman's kindly agreed to lend us his boat!\"", "begin": 4317.558, "end": 4327.998, "localBegin": 1252.8, "localEnd": 1263.24}, {"id": "c003_f000125", "text": "A toothless old man came ambling up to them, pointing, with a rather wicked grin, at an old rowboat bobbing in the iron-gray water below them.", "begin": 4327.998, "end": 4336.878, "localBegin": 1263.24, "localEnd": 1272.12}, {"id": "c003_f000126", "text": "\"I've already got us some rations,\" said Uncle Vernon, \"so all aboard!\"", "begin": 4336.878, "end": 4341.918, "localBegin": 1272.12, "localEnd": 1277.16}, {"id": "c003_f000127", "text": "It was freezing in the boat. Icy sea spray and rain crept down their necks and a chilly wind whipped their faces. After what seemed like hours they reached the rock, where Uncle Vernon, slipping and sliding, led the way to the broken-down house.", "begin": 4341.918, "end": 4357.438, "localBegin": 1277.16, "localEnd": 1292.68}, {"id": "c003_f000128", "text": "The inside was horrible; it smelled strongly of seaweed, the wind whistled through the gaps in the wooden walls, and the fireplace was damp and empty. There were only two rooms.", "begin": 4357.438, "end": 4369.398, "localBegin": 1292.68, "localEnd": 1304.64}, {"id": "c003_f000129", "text": "Uncle Vernon's rations turned out to be a bag of chips each and four bananas. He tried to start a fire but the empty chip bags just smoked and shriveled up.", "begin": 4369.398, "end": 4380.718, "localBegin": 1304.64, "localEnd": 1315.96}, {"id": "c003_f000130", "text": "\"Could do with some of those letters now, eh?\" he said cheerfully.", "begin": 4380.718, "end": 4385.958, "localBegin": 1315.96, "localEnd": 1321.2}, {"id": "c003_f000131", "text": "He was in a very good mood. Obviously he thought nobody stood a chance of reaching them here in a storm to deliver mail. Harry privately agreed, though the thought didn't cheer him up at all.", "begin": 4385.958, "end": 4398.438, "localBegin": 1321.2, "localEnd": 1333.68}, {"id": "c003_f000132", "text": "As night fell, the promised storm blew up around them. Spray from the high waves splattered the walls of the hut and a fierce wind rattled the filthy windows. Aunt Petunia found a few moldy blankets in the second room and made up a bed for", "begin": 4398.438, "end": 4414.518, "localBegin": 1333.68, "localEnd": 1349.76}, {"id": "c003_f000133", "text": "Dudley on the moth-eaten sofa. She and Uncle Vernon went off to the lumpy bed next door, and Harry was left to find the softest bit of floor he could and to curl up under the thinnest, most ragged blanket.", "begin": 4414.518, "end": 4426.318, "localBegin": 1349.76, "localEnd": 1361.56}, {"id": "c003_f000134", "text": "The storm raged more and more ferociously as the night went on. Harry couldn't sleep. He shivered and turned over, trying to get comfortable, his stomach rumbling with hunger. Dudley's snores were drowned by the low rolls of thunder that started near midnight. The lighted dial of Dudley's watch, which was dangling over the edge of the sofa on his fat wrist, told Harry he'd be eleven in ten minutes' time. He lay and watched his birthday tick nearer, wondering if the Dursleys would remember at all, wondering where the letter writer was now.", "begin": 4426.318, "end": 4460.438, "localBegin": 1361.56, "localEnd": 1395.68}, {"id": "c003_f000135", "text": "Five minutes to go. Harry heard something creak outside. He hoped the roof wasn't going to fall in, although he might be warmer if it did. Four minutes to go. Maybe the house in Privet Drive would be so full of letters when they got back that he'd be able to steal one somehow.", "begin": 4460.438, "end": 4478.318, "localBegin": 1395.68, "localEnd": 1413.56}, {"id": "c003_f000136", "text": "Three minutes to go. Was that the sea, slapping hard on the rock like that? And (two minutes to go) what was that funny crunching noise? Was the rock crumbling into the sea?", "begin": 4478.318, "end": 4491.998, "localBegin": 1413.56, "localEnd": 1427.24}, {"id": "c003_f000137", "text": "One minute to go and he'd be eleven. Thirty seconds . . . twenty . . . ten . . . nine - maybe he'd wake Dudley up, just to annoy him - three . . . two . . . one . . .", "begin": 4491.998, "end": 4505.958, "localBegin": 1427.24, "localEnd": 1441.2}, {"id": "c003_f000138", "text": "BOOM.", "begin": 4505.958, "end": 4507.838, "localBegin": 1441.2, "localEnd": 1443.08}, {"id": "c003_f000139", "text": "The whole shack shivered and Harry sat bolt upright, staring at the door. Someone was outside, knocking to come in.", "begin": 4507.838, "end": 4519.798, "localBegin": 1443.08, "localEnd": 1455.04}]}, {"kind": "chapter", "number": 4, "title": "The Keeper of the Keys", "audio": "../Harry Potter and the Sorcerer's Stone, Book 1 (Unabridged)/004 - Harry Potter and the Sorcerer's Stone, Book 1 (Unabridged).mp3", "start": 4519.813, "end": 5982.763, "duration": 1462.95, "paragraphs": [{"id": "c004_f000001", "text": "Chapter Four. The Keeper of the Keys.", "begin": 4519.813, "end": 4524.373, "localBegin": 0.0, "localEnd": 4.56}, {"id": "c004_f000002", "text": "B OOM. They knocked again. Dudley jerked awake.", "begin": 4524.373, "end": 4528.653, "localBegin": 4.56, "localEnd": 8.84}, {"id": "c004_f000003", "text": "\"Where's the cannon?\" he said stupidly.", "begin": 4528.653, "end": 4533.453, "localBegin": 8.84, "localEnd": 13.64}, {"id": "c004_f000004", "text": "There was a crash behind them and Uncle Vernon came skidding into the room. He was holding a rifle in his hands - now they knew what had been in the long, thin package he had brought with them.", "begin": 4533.453, "end": 4543.213, "localBegin": 13.64, "localEnd": 23.4}, {"id": "c004_f000005", "text": "\"Who's there?\" he shouted. \"I warn you - I'm armed!\"", "begin": 4543.213, "end": 4548.333, "localBegin": 23.4, "localEnd": 28.52}, {"id": "c004_f000006", "text": "There was a pause. Then -", "begin": 4548.333, "end": 4550.253, "localBegin": 28.52, "localEnd": 30.44}, {"id": "c004_f000007", "text": "SMASH!", "begin": 4550.253, "end": 4552.253, "localBegin": 30.44, "localEnd": 32.44}, {"id": "c004_f000008", "text": "The door was hit with such force that it swung clean off its hinges and with a deafening crash landed flat on the floor.", "begin": 4552.253, "end": 4559.813, "localBegin": 32.44, "localEnd": 40.0}, {"id": "c004_f000009", "text": "A giant of a man was standing in the doorway. His face was almost completely hidden by a long, shaggy mane of hair and a wild, tangled beard, but you could make out his eyes, glinting like black beetles under all the hair.", "begin": 4559.813, "end": 4574.853, "localBegin": 40.0, "localEnd": 55.04}, {"id": "c004_f000010", "text": "The giant squeezed his way into the hut, stooping so that his head just brushed the ceiling. He bent down, picked up the door, and fitted it easily back into its frame. The noise of the storm outside dropped a little. He turned to look at them all.", "begin": 4574.853, "end": 4589.293, "localBegin": 55.04, "localEnd": 69.48}, {"id": "c004_f000011", "text": "\"Couldn't make us a cup o' tea, could yeh? It's not been an easy journey. . . .\"", "begin": 4589.293, "end": 4596.413, "localBegin": 69.48, "localEnd": 76.6}, {"id": "c004_f000012", "text": "He strode over to the sofa where Dudley sat frozen with fear.", "begin": 4596.413, "end": 4599.893, "localBegin": 76.6, "localEnd": 80.08}, {"id": "c004_f000013", "text": "\"Budge up, yeh great lump,\" said the stranger.", "begin": 4599.893, "end": 4603.973, "localBegin": 80.08, "localEnd": 84.16}, {"id": "c004_f000014", "text": "Dudley squeaked and ran to hide behind his mother, who was crouching, terrified, behind Uncle Vernon.", "begin": 4603.973, "end": 4609.533, "localBegin": 84.16, "localEnd": 89.72}, {"id": "c004_f000015", "text": "\"An' here's Harry!\" said the giant.", "begin": 4609.533, "end": 4614.173, "localBegin": 89.72, "localEnd": 94.36}, {"id": "c004_f000016", "text": "Harry looked up into the fierce, wild, shadowy face and saw that the beetle eyes were crinkled in a smile.", "begin": 4614.173, "end": 4620.213, "localBegin": 94.36, "localEnd": 100.4}, {"id": "c004_f000017", "text": "\"Las' time I saw you, you was only a baby,\" said the giant. \"Yeh look a lot like yer dad, but yeh've got yer mum's eyes.\"", "begin": 4620.213, "end": 4629.413, "localBegin": 100.4, "localEnd": 109.6}, {"id": "c004_f000018", "text": "Uncle Vernon made a funny rasping noise.", "begin": 4629.413, "end": 4631.613, "localBegin": 109.6, "localEnd": 111.8}, {"id": "c004_f000019", "text": "\"I demand that you leave at once, sir!\" he said. \"You are breaking and entering!\"", "begin": 4631.613, "end": 4637.773, "localBegin": 111.8, "localEnd": 117.96}, {"id": "c004_f000020", "text": "\"Ah, shut up, Dursley, yeh great prune,\" said the giant; he reached over the back of the sofa, jerked the gun out of Uncle Vernon's hands, bent it into a knot as easily as if it had been made of rubber, and threw it into a corner of the room.", "begin": 4637.773, "end": 4653.613, "localBegin": 117.96, "localEnd": 133.8}, {"id": "c004_f000021", "text": "Uncle Vernon made another funny noise, like a mouse being trodden on.", "begin": 4653.613, "end": 4657.693, "localBegin": 133.8, "localEnd": 137.88}, {"id": "c004_f000022", "text": "\"Anyway - Harry,\" said the giant, turning his back on the Dursleys, \"a very happy birthday to yeh. Got summat fer yeh here - I mighta sat on it at some point, but it'll taste all right.\"", "begin": 4657.693, "end": 4673.693, "localBegin": 137.88, "localEnd": 153.88}, {"id": "c004_f000023", "text": "From an inside pocket of his black overcoat he pulled a slightly squashed box. Harry opened it with trembling fingers. Inside was a large, sticky chocolate cake with Happy Birthday Harry written on it in green icing.", "begin": 4673.693, "end": 4688.933, "localBegin": 153.88, "localEnd": 169.12}, {"id": "c004_f000024", "text": "Harry looked up at the giant. He meant to say thank you, but the words got lost on the way to his mouth, and what he said instead was, \"Who are you?\"", "begin": 4688.933, "end": 4699.493, "localBegin": 169.12, "localEnd": 179.68}, {"id": "c004_f000025", "text": "The giant chuckled.", "begin": 4699.493, "end": 4700.653, "localBegin": 179.68, "localEnd": 180.84}, {"id": "c004_f000026", "text": "\"True, I haven't introduced meself. Rubeus Hagrid, Keeper of Keys and Grounds at Hogwarts.\"", "begin": 4700.653, "end": 4710.253, "localBegin": 180.84, "localEnd": 190.44}, {"id": "c004_f000027", "text": "He held out an enormous hand and shook Harry's whole arm.", "begin": 4710.253, "end": 4713.453, "localBegin": 190.44, "localEnd": 193.64}, {"id": "c004_f000028", "text": "\"What about that tea then, eh?\" he said, rubbing his hands together. \"I'd not say no ter summat stronger if yeh've got it, mind.\"", "begin": 4713.453, "end": 4722.453, "localBegin": 193.64, "localEnd": 202.64}, {"id": "c004_f000029", "text": "His eyes fell on the empty grate with the shriveled chip bags in it and he snorted. He bent down over the fireplace; they couldn't see what he was doing but when he drew back a second later, there was a roaring fire there. It filled the whole damp hut with flickering light and Harry felt the warmth wash over him as though he'd sunk into a hot bath.", "begin": 4722.453, "end": 4743.333, "localBegin": 202.64, "localEnd": 223.52}, {"id": "c004_f000030", "text": "The giant sat back down on the sofa, which sagged under his weight, and began taking all sorts of things out of the pockets of his coat: a copper kettle, a squashy package of sausages, a poker, a teapot, several chipped mugs, and a bottle of some amber liquid that he took a swig from before starting to make tea. Soon the hut was full of the sound and smell of sizzling sausage. Nobody said a thing while the giant was working, but as he slid the first six fat, juicy, slightly burnt", "begin": 4743.333, "end": 4774.853, "localBegin": 223.52, "localEnd": 255.04}, {"id": "c004_f000031", "text": "sausages from the poker, Dudley fidgeted a little. Uncle Vernon said sharply, \"Don't touch anything he gives you, Dudley.\"", "begin": 4774.853, "end": 4783.613, "localBegin": 255.04, "localEnd": 263.8}, {"id": "c004_f000032", "text": "The giant chuckled darkly.", "begin": 4783.613, "end": 4785.173, "localBegin": 263.8, "localEnd": 265.36}, {"id": "c004_f000033", "text": "\"Yer great puddin' of a son don' need fattenin' anymore, Dursley, don' worry.\"", "begin": 4785.173, "end": 4791.413, "localBegin": 265.36, "localEnd": 271.6}, {"id": "c004_f000034", "text": "He passed the sausages to Harry, who was so hungry he had never tasted anything so wonderful, but he still couldn't take his eyes off the giant. Finally, as nobody seemed about to explain anything, he said, \"I'm sorry, but I still don't really know who you are.\"", "begin": 4791.413, "end": 4807.933, "localBegin": 271.6, "localEnd": 288.12}, {"id": "c004_f000035", "text": "The giant took a gulp of tea and wiped his mouth with the back of his hand.", "begin": 4807.933, "end": 4811.813, "localBegin": 288.12, "localEnd": 292.0}, {"id": "c004_f000036", "text": "\"Call me Hagrid,\" he said, \"everyone does. An' like I told yeh, I'm Keeper of Keys at Hogwarts - yeh'll know all about Hogwarts, o' course.\"", "begin": 4811.813, "end": 4822.333, "localBegin": 292.0, "localEnd": 302.52}, {"id": "c004_f000037", "text": "\"Er - no,\" said Harry.", "begin": 4822.333, "end": 4826.093, "localBegin": 302.52, "localEnd": 306.28}, {"id": "c004_f000038", "text": "Hagrid looked shocked.", "begin": 4826.093, "end": 4827.373, "localBegin": 306.28, "localEnd": 307.56}, {"id": "c004_f000039", "text": "\"Sorry,\" Harry said quickly.", "begin": 4827.373, "end": 4829.973, "localBegin": 307.56, "localEnd": 310.16}, {"id": "c004_f000040", "text": "\"Sorry?\" barked Hagrid, turning to stare at the Dursleys, who shrank back into the shadows. \"It's them as should be sorry! I knew yeh weren't gettin' yer letters but I never thought yeh wouldn't even know abou' Hogwarts, fer cryin' out loud! Did yeh never wonder where yer parents learned it all?\"", "begin": 4829.973, "end": 4847.893, "localBegin": 310.16, "localEnd": 328.08}, {"id": "c004_f000041", "text": "\"All what?\" asked Harry.", "begin": 4847.893, "end": 4850.373, "localBegin": 328.08, "localEnd": 330.56}, {"id": "c004_f000042", "text": "\"ALL WHAT?\" Hagrid thundered. \"Now wait jus' one second!\"", "begin": 4850.373, "end": 4856.053, "localBegin": 330.56, "localEnd": 336.24}, {"id": "c004_f000043", "text": "He had leapt to his feet. In his anger he seemed to fill the whole hut. The Dursleys were cowering against the wall.", "begin": 4856.053, "end": 4862.493, "localBegin": 336.24, "localEnd": 342.68}, {"id": "c004_f000044", "text": "\"Do you mean ter tell me,\" he growled at the Dursleys, \"that this boy - this boy! - knows nothin' abou' - about ANYTHING?\"", "begin": 4862.493, "end": 4872.933, "localBegin": 342.68, "localEnd": 353.12}, {"id": "c004_f000045", "text": "Harry thought this was going a bit far. He had been to school, after all, and his marks weren't bad.", "begin": 4872.933, "end": 4878.733, "localBegin": 353.12, "localEnd": 358.92}, {"id": "c004_f000046", "text": "\"I know some things,\" he said. \"I can, you know, do math and stuff.\"", "begin": 4878.733, "end": 4885.173, "localBegin": 358.92, "localEnd": 365.36}, {"id": "c004_f000047", "text": "But Hagrid simply waved his hand and said, \"About our world, I mean. Your world. My world. Yer parents' world.\"", "begin": 4885.173, "end": 4893.053, "localBegin": 365.36, "localEnd": 373.24}, {"id": "c004_f000048", "text": "\"What world?\"", "begin": 4893.053, "end": 4895.613, "localBegin": 373.24, "localEnd": 375.8}, {"id": "c004_f000049", "text": "Hagrid looked as if he was about to explode.", "begin": 4895.613, "end": 4898.173, "localBegin": 375.8, "localEnd": 378.36}, {"id": "c004_f000050", "text": "\"DURSLEY!\" he boomed.", "begin": 4898.173, "end": 4902.053, "localBegin": 378.36, "localEnd": 382.24}, {"id": "c004_f000051", "text": "Uncle Vernon, who had gone very pale, whispered something that sounded like \"Mimblewimble.\" Hagrid stared wildly at Harry.", "begin": 4902.053, "end": 4910.133, "localBegin": 382.24, "localEnd": 390.32}, {"id": "c004_f000052", "text": "\"But yeh must know about yer mum and dad,\" he said. \"I mean, they're famous. You're famous.\"", "begin": 4910.133, "end": 4917.453, "localBegin": 390.32, "localEnd": 397.64}, {"id": "c004_f000053", "text": "\"What? My - my mum and dad weren't famous, were they?\"", "begin": 4917.453, "end": 4922.293, "localBegin": 397.64, "localEnd": 402.48}, {"id": "c004_f000054", "text": "\"Yeh don' know . . . yeh don' know . . .\" Hagrid ran his fingers through his hair, fixing Harry with a bewildered stare.", "begin": 4922.293, "end": 4929.853, "localBegin": 402.48, "localEnd": 410.04}, {"id": "c004_f000055", "text": "\"Yeh don' know what yeh are?\" he said finally.", "begin": 4929.853, "end": 4933.813, "localBegin": 410.04, "localEnd": 414.0}, {"id": "c004_f000056", "text": "Uncle Vernon suddenly found his voice.", "begin": 4933.813, "end": 4935.533, "localBegin": 414.0, "localEnd": 415.72}, {"id": "c004_f000057", "text": "\"Stop!\" he commanded. \"Stop right there, sir! I forbid you to tell the boy anything!\"", "begin": 4935.533, "end": 4941.253, "localBegin": 415.72, "localEnd": 421.44}, {"id": "c004_f000058", "text": "A braver man than Vernon Dursley would have quailed under the furious look Hagrid now gave him; when Hagrid spoke, his every syllable trembled with rage.", "begin": 4941.253, "end": 4949.853, "localBegin": 421.44, "localEnd": 430.04}, {"id": "c004_f000059", "text": "\"You never told him? Never told him what was in the letter Dumbledore left fer him? I was there! I saw Dumbledore leave it, Dursley! An' you've kept it from him all these years?\"", "begin": 4949.853, "end": 4961.493, "localBegin": 430.04, "localEnd": 441.68}, {"id": "c004_f000060", "text": "\"Kept what from me?\" said Harry eagerly.", "begin": 4961.493, "end": 4965.013, "localBegin": 441.68, "localEnd": 445.2}, {"id": "c004_f000061", "text": "\"STOP! I FORBID YOU!\" yelled Uncle Vernon in panic.", "begin": 4965.013, "end": 4969.573, "localBegin": 445.2, "localEnd": 449.76}, {"id": "c004_f000062", "text": "Aunt Petunia gave a gasp of horror.", "begin": 4969.573, "end": 4971.613, "localBegin": 449.76, "localEnd": 451.8}, {"id": "c004_f000063", "text": "\"Ah, go boil yer heads, both of yeh,\" said Hagrid. \"Harry - yer a wizard.\"", "begin": 4971.613, "end": 4980.733, "localBegin": 451.8, "localEnd": 460.92}, {"id": "c004_f000064", "text": "There was silence inside the hut. Only the sea and the whistling wind could be heard.", "begin": 4980.733, "end": 4986.253, "localBegin": 460.92, "localEnd": 466.44}, {"id": "c004_f000065", "text": "\"I'm a what?\" gasped Harry.", "begin": 4986.253, "end": 4990.653, "localBegin": 466.44, "localEnd": 470.84}, {"id": "c004_f000066", "text": "\"A wizard, o' course,\" said Hagrid, sitting back down on the sofa, which groaned and sank even lower, \"an' a thumpin' good'un, I'd say, once yeh've been", "begin": 4990.653, "end": 5002.493, "localBegin": 470.84, "localEnd": 482.68}, {"id": "c004_f000067", "text": "trained up a bit. With a mum an' dad like yours, what else would yeh be? An' I reckon it's abou' time yeh read yer letter.\"", "begin": 5002.493, "end": 5011.133, "localBegin": 482.68, "localEnd": 491.32}, {"id": "c004_f000068", "text": "Harry stretched out his hand at last to take the yellowish envelope, addressed in emerald green to Mr. H. Potter, The Floor, Hut-on-the-Rock, The Sea. He pulled out the letter and read:", "begin": 5011.133, "end": 5024.893, "localBegin": 491.32, "localEnd": 505.08}, {"id": "c004_f000069", "text": "HOGWARTS SCHOOL", "begin": 5024.893, "end": 5027.053, "localBegin": 505.08, "localEnd": 507.24}, {"id": "c004_f000070", "text": "of WITCHCRAFT and WIZARDRY", "begin": 5027.053, "end": 5029.093, "localBegin": 507.24, "localEnd": 509.28}, {"id": "c004_f000071", "text": "Headmaster: Albus Dumbledore", "begin": 5029.093, "end": 5031.733, "localBegin": 509.28, "localEnd": 511.92}, {"id": "c004_f000072", "text": "(Order of Merlin, First Class, Grand Sorc., Chf. Warlock, Supreme Mugwump, International Confed. of Wizards)", "begin": 5031.733, "end": 5041.773, "localBegin": 511.92, "localEnd": 521.96}, {"id": "c004_f000073", "text": "Dear Mr. Potter,", "begin": 5041.773, "end": 5044.573, "localBegin": 521.96, "localEnd": 524.76}, {"id": "c004_f000074", "text": "We are pleased to inform you that you have been accepted at Hogwarts School of Witchcraft and Wizardry. Please find enclosed a list of all necessary books and equipment.", "begin": 5044.573, "end": 5054.453, "localBegin": 524.76, "localEnd": 534.64}, {"id": "c004_f000075", "text": "Term begins on September 1. We await your owl by no later than July 31.", "begin": 5054.453, "end": 5061.693, "localBegin": 534.64, "localEnd": 541.88}, {"id": "c004_f000076", "text": "Yours sincerely,", "begin": 5061.693, "end": 5062.933, "localBegin": 541.88, "localEnd": 543.12}, {"id": "c004_f000077", "text": "Minerva McGonagall,", "begin": 5062.933, "end": 5065.013, "localBegin": 543.12, "localEnd": 545.2}, {"id": "c004_f000078", "text": "Deputy Headmistress", "begin": 5065.013, "end": 5066.493, "localBegin": 545.2, "localEnd": 546.68}, {"id": "c004_f000079", "text": "Questions exploded inside Harry's head like fireworks and he couldn't decide which to ask first. After a few minutes he stammered, \"What does it mean, they await my owl?\"", "begin": 5066.493, "end": 5078.693, "localBegin": 546.68, "localEnd": 558.88}, {"id": "c004_f000080", "text": "\"Gallopin' Gorgons, that reminds me,\" said Hagrid, clapping a hand to his forehead with enough force to knock over a cart horse, and from yet another pocket inside his overcoat he pulled an owl - a real, live, rather ruffled-looking owl a long quill, and a roll of parchment. With his tongue between his teeth he scribbled a note that Harry could read upside down:", "begin": 5078.693, "end": 5100.573, "localBegin": 558.88, "localEnd": 580.76}, {"id": "c004_f000081", "text": "Dear Professor Dumbledore,", "begin": 5100.573, "end": 5103.133, "localBegin": 580.76, "localEnd": 583.32}, {"id": "c004_f000082", "text": "Given Harry his letter.", "begin": 5103.133, "end": 5104.973, "localBegin": 583.32, "localEnd": 585.16}, {"id": "c004_f000083", "text": "Taking him to buy his things tomorrow.", "begin": 5104.973, "end": 5108.453, "localBegin": 585.16, "localEnd": 588.64}, {"id": "c004_f000084", "text": "Weather's horrible. Hope you're well.", "begin": 5108.453, "end": 5110.573, "localBegin": 588.64, "localEnd": 590.76}, {"id": "c004_f000085", "text": "Hagrid", "begin": 5110.573, "end": 5112.613, "localBegin": 590.76, "localEnd": 592.8}, {"id": "c004_f000086", "text": "Hagrid rolled up the note, gave it to the owl, which clamped it in its beak, went to the door, and threw the owl out into the storm. Then he came back and sat down as though this was as normal as talking on the telephone.", "begin": 5112.613, "end": 5124.373, "localBegin": 592.8, "localEnd": 604.56}, {"id": "c004_f000087", "text": "Harry realized his mouth was open and closed it quickly.", "begin": 5124.373, "end": 5128.253, "localBegin": 604.56, "localEnd": 608.44}, {"id": "c004_f000088", "text": "\"Where was I?\" said Hagrid, but at that moment, Uncle Vernon, still ashenfaced but looking very angry, moved into the firelight.", "begin": 5128.253, "end": 5137.373, "localBegin": 608.44, "localEnd": 617.56}, {"id": "c004_f000089", "text": "\"He's not going,\" he said.", "begin": 5137.373, "end": 5140.853, "localBegin": 617.56, "localEnd": 621.04}, {"id": "c004_f000090", "text": "Hagrid grunted.", "begin": 5140.853, "end": 5141.973, "localBegin": 621.04, "localEnd": 622.16}, {"id": "c004_f000091", "text": "\"I'd like ter see a great Muggle like you stop him,\" he said.", "begin": 5141.973, "end": 5146.573, "localBegin": 622.16, "localEnd": 626.76}, {"id": "c004_f000092", "text": "\"A what?\" said Harry, interested.", "begin": 5146.573, "end": 5149.413, "localBegin": 626.76, "localEnd": 629.6}, {"id": "c004_f000093", "text": "\"A Muggle,\" said Hagrid, \"it's what we call nonmagic folk like them. An' it's your bad luck you grew up in a family o' the biggest Muggles I ever laid eyes on.\"", "begin": 5149.413, "end": 5159.973, "localBegin": 629.6, "localEnd": 640.16}, {"id": "c004_f000094", "text": "\"We swore when we took him in we'd put a stop to that rubbish,\" said Uncle Vernon, \"swore we'd stamp it out of him! Wizard indeed!\"", "begin": 5159.973, "end": 5169.293, "localBegin": 640.16, "localEnd": 649.48}, {"id": "c004_f000095", "text": "\"You knew?\" said Harry. \"You knew I'm a - a wizard?\"", "begin": 5169.293, "end": 5174.653, "localBegin": 649.48, "localEnd": 654.84}, {"id": "c004_f000096", "text": "\"Knew!\" shrieked Aunt Petunia suddenly. \"Knew! Of course we knew! How could you not be, my dratted sister being what she was? Oh, she got a letter just like that and disappeared off to that - that school - and came home every vacation with her pockets full of frog spawn, turning teacups into rats. I was the only one who saw her for what she was - a freak! But for my mother and father, oh no, it was Lily this and Lily that, they were proud of having a witch in the family!\"", "begin": 5174.653, "end": 5206.693, "localBegin": 654.84, "localEnd": 686.88}, {"id": "c004_f000097", "text": "She stopped to draw a deep breath and then went ranting on. It seemed she had been wanting to say all this for years.", "begin": 5206.693, "end": 5214.453, "localBegin": 686.88, "localEnd": 694.64}, {"id": "c004_f000098", "text": "\"Then she met that Potter at school and they left and got married and had you,", "begin": 5214.453, "end": 5220.293, "localBegin": 694.64, "localEnd": 700.48}, {"id": "c004_f000099", "text": "and of course I knew you'd be just the same, just as strange, just as - as abnormal - and then, if you please, she went and got herself blown up and we got landed with you!\"", "begin": 5220.293, "end": 5233.173, "localBegin": 700.48, "localEnd": 713.36}, {"id": "c004_f000100", "text": "Harry had gone very white. As soon as he found his voice he said, \"Blown up? You told me they died in a car crash!\"", "begin": 5233.173, "end": 5243.133, "localBegin": 713.36, "localEnd": 723.32}, {"id": "c004_f000101", "text": "\"CAR CRASH!\" roared Hagrid, jumping up so angrily that the Dursleys scuttled back to their corner. \"How could a car crash kill Lily an' James Potter? It's an outrage! A scandal! Harry Potter not knowin' his own story when every kid in our world knows his name!\"", "begin": 5243.133, "end": 5262.333, "localBegin": 723.32, "localEnd": 742.52}, {"id": "c004_f000102", "text": "\"But why? What happened?\" Harry asked urgently.", "begin": 5262.333, "end": 5266.413, "localBegin": 742.52, "localEnd": 746.6}, {"id": "c004_f000103", "text": "The anger faded from Hagrid's face. He looked suddenly anxious.", "begin": 5266.413, "end": 5271.333, "localBegin": 746.6, "localEnd": 751.52}, {"id": "c004_f000104", "text": "\"I never expected this,\" he said, in a low, worried voice. \"I had no idea, when Dumbledore told me there might be trouble gettin' hold of yeh, how much yeh didn't know. Ah, Harry, I don' know if I'm the right person ter tell yeh - but someone's gotta - yeh can't go off ter Hogwarts not knowin'.\"", "begin": 5271.333, "end": 5293.573, "localBegin": 751.52, "localEnd": 773.76}, {"id": "c004_f000105", "text": "He threw a dirty look at the Dursleys.", "begin": 5293.573, "end": 5296.533, "localBegin": 773.76, "localEnd": 776.72}, {"id": "c004_f000106", "text": "\"Well, it's best yeh know as much as I can tell yeh - mind, I can't tell yeh everythin', it's a great myst'ry, parts of it. . . .\"", "begin": 5296.533, "end": 5302.933, "localBegin": 776.72, "localEnd": 783.12}, {"id": "c004_f000107", "text": "He sat down, stared into the fire for a few seconds, and then said, \"It begins, I suppose, with - with a person called - but it's incredible yeh don't know his name, everyone in our world knows - \"", "begin": 5302.933, "end": 5315.653, "localBegin": 783.12, "localEnd": 795.84}, {"id": "c004_f000108", "text": "\"Who?\"", "begin": 5315.653, "end": 5316.573, "localBegin": 795.84, "localEnd": 796.76}, {"id": "c004_f000109", "text": "\"Well - I don' like sayin' the name if I can help it. No one does.\"", "begin": 5316.573, "end": 5320.933, "localBegin": 796.76, "localEnd": 801.12}, {"id": "c004_f000110", "text": "\"Why not?\"", "begin": 5320.933, "end": 5322.053, "localBegin": 801.12, "localEnd": 802.24}, {"id": "c004_f000111", "text": "\"Gulpin' gargoyles, Harry, people are still scared. Blimey, this is difficult. See, there was this wizard who went . . . bad. As bad as you could go. Worse. Worse than worse. His name was . . .\"", "begin": 5322.053, "end": 5338.533, "localBegin": 802.24, "localEnd": 818.72}, {"id": "c004_f000112", "text": "Hagrid gulped, but no words came out.", "begin": 5338.533, "end": 5341.453, "localBegin": 818.72, "localEnd": 821.64}, {"id": "c004_f000113", "text": "\"Could you write it down?\" Harry suggested.", "begin": 5341.453, "end": 5344.853, "localBegin": 821.64, "localEnd": 825.04}, {"id": "c004_f000114", "text": "\"Nah - can't spell it. All right - Voldemort.\" Hagrid shuddered. \"Don' make", "begin": 5344.853, "end": 5353.213, "localBegin": 825.04, "localEnd": 833.4}, {"id": "c004_f000115", "text": "me say it again. Anyway, this - this wizard, about twenty years ago now, started lookin' fer followers. Got 'em, too - some were afraid, some just wanted a bit o' his power, 'cause he was gettin' himself power, all right. Dark days, Harry. Didn't know who ter trust, didn't dare get friendly with strange wizards or witches . . . terrible things happened. He was takin' over. 'Course, some stood up to him - an' he killed 'em. Horribly. One o' the only safe places left was Hogwarts. Reckon Dumbledore's the only one You-Know-Who was afraid of. Didn't dare try takin' the school, not jus' then, anyway.", "begin": 5353.213, "end": 5398.573, "localBegin": 833.4, "localEnd": 878.76}, {"id": "c004_f000116", "text": "\"Now, yer mum an' dad were as good a witch an' wizard as I ever knew. Head boy an' girl at Hogwarts in their day! Suppose the myst'ry is why You-Know-Who never tried to get 'em on his side before . . . probably knew they were too close ter Dumbledore ter want anythin' ter do with the Dark Side.", "begin": 5398.573, "end": 5418.453, "localBegin": 878.76, "localEnd": 898.64}, {"id": "c004_f000117", "text": "\"Maybe he thought he could persuade 'em . . . maybe he just wanted 'em outta the way. All anyone knows is, he turned up in the village where you was all living, on Halloween ten years ago. You was just a year old. He came ter yer house an' an' - \"", "begin": 5418.453, "end": 5436.933, "localBegin": 898.64, "localEnd": 917.12}, {"id": "c004_f000118", "text": "Hagrid suddenly pulled out a very dirty, spotted handkerchief and blew his nose with a sound like a foghorn.", "begin": 5436.933, "end": 5444.013, "localBegin": 917.12, "localEnd": 924.2}, {"id": "c004_f000119", "text": "\"Sorry,\" he said. \"But it's that sad - knew yer mum an' dad, an' nicer people yeh couldn't find - anyway . . .", "begin": 5444.013, "end": 5455.573, "localBegin": 924.2, "localEnd": 935.76}, {"id": "c004_f000120", "text": "\"You-Know-Who killed 'em. An' then - an' this is the real myst'ry of the thing - he tried to kill you, too. Wanted ter make a clean job of it, I suppose, or maybe he just liked killin' by then. But he couldn't do it. Never wondered how you got that mark on yer forehead? That was no ordinary cut. That's what yeh get when a powerful, evil curse touches yeh - took care of yer mum an' dad an' yer house, even - but it didn't work on you, an' that's why yer famous, Harry. No one ever lived after he decided ter kill 'em, no one except you, an' he'd killed some o' the best witches an' wizards of the age - the McKinnons, the Bones, the Prewetts an' you was only a baby, an' you lived.\"", "begin": 5455.573, "end": 5509.653, "localBegin": 935.76, "localEnd": 989.84}, {"id": "c004_f000121", "text": "Something very painful was going on in Harry's mind. As Hagrid's story came to a close, he saw again the blinding flash of green light, more clearly than he had ever remembered it before - and he remembered something else, for the first time in his life: a high, cold, cruel laugh.", "begin": 5509.653, "end": 5529.013, "localBegin": 989.84, "localEnd": 1009.2}, {"id": "c004_f000122", "text": "Hagrid was watching him sadly.", "begin": 5529.013, "end": 5531.933, "localBegin": 1009.2, "localEnd": 1012.12}, {"id": "c004_f000123", "text": "\"Took yeh from the ruined house myself, on Dumbledore's orders. Brought yeh", "begin": 5531.933, "end": 5538.413, "localBegin": 1012.12, "localEnd": 1018.6}, {"id": "c004_f000124", "text": "ter this lot . . .\"", "begin": 5538.413, "end": 5539.173, "localBegin": 1018.6, "localEnd": 1019.36}, {"id": "c004_f000125", "text": "\"Load of old tosh,\" said Uncle Vernon. Harry jumped; he had almost forgotten that the Dursleys were there. Uncle Vernon certainly seemed to have got back his courage. He was glaring at Hagrid and his fists were clenched.", "begin": 5539.173, "end": 5554.053, "localBegin": 1019.36, "localEnd": 1034.24}, {"id": "c004_f000126", "text": "\"Now, you listen here, boy,\" he snarled, \"I accept there's something strange about you, probably nothing a good beating wouldn't have cured - and as for all this about your parents, well, they were weirdos, no denying it, and the world's better off without them in my opinion - asked for all they got, getting mixed up with these wizarding types - just what I expected, always knew they'd come to a sticky end - \"", "begin": 5554.053, "end": 5580.933, "localBegin": 1034.24, "localEnd": 1061.12}, {"id": "c004_f000127", "text": "But at that moment, Hagrid leapt from the sofa and drew a battered pink umbrella from inside his coat. Pointing this at Uncle Vernon like a sword, he said, \"I'm warning you, Dursley - I'm warning you - one more word . . .\"", "begin": 5580.933, "end": 5596.053, "localBegin": 1061.12, "localEnd": 1076.24}, {"id": "c004_f000128", "text": "In danger of being speared on the end of an umbrella by a bearded giant, Uncle Vernon's courage failed again; he flattened himself against the wall and fell silent.", "begin": 5596.053, "end": 5606.213, "localBegin": 1076.24, "localEnd": 1086.4}, {"id": "c004_f000129", "text": "\"That's better,\" said Hagrid, breathing heavily and sitting back down on the sofa, which this time sagged right down to the floor.", "begin": 5606.213, "end": 5614.653, "localBegin": 1086.4, "localEnd": 1094.84}, {"id": "c004_f000130", "text": "Harry, meanwhile, still had questions to ask, hundreds of them.", "begin": 5614.653, "end": 5619.413, "localBegin": 1094.84, "localEnd": 1099.6}, {"id": "c004_f000131", "text": "\"But what happened to Vol-, sorry - I mean, You-Know-Who?\"", "begin": 5619.413, "end": 5624.053, "localBegin": 1099.6, "localEnd": 1104.24}, {"id": "c004_f000132", "text": "\"Good question, Harry. Disappeared. Vanished. Same night he tried ter kill you. Makes yeh even more famous. That's the biggest myst'ry, see . . . he was gettin' more an' more powerful - why'd he go?", "begin": 5624.053, "end": 5641.053, "localBegin": 1104.24, "localEnd": 1121.24}, {"id": "c004_f000133", "text": "\"Some say he died. Codswallop, in my opinion. Dunno if he had enough human left in him to die. Some say he's still out there, bidin' his time, like, but I don' believe it. People who was on his side came back ter ours. Some of 'em came outta kinda trances. Don' reckon they could've done if he was comin' back.", "begin": 5641.053, "end": 5665.333, "localBegin": 1121.24, "localEnd": 1145.52}, {"id": "c004_f000134", "text": "\"Most of us reckon he's still out there somewhere but lost his powers. Too weak to carry on. 'Cause somethin' about you finished him, Harry. There was somethin' goin' on that night he hadn't counted on - I dunno what it was, no one does - but somethin' about you stumped him, all right.\"", "begin": 5665.333, "end": 5688.253, "localBegin": 1145.52, "localEnd": 1168.44}, {"id": "c004_f000135", "text": "Hagrid looked at Harry with warmth and respect blazing in his eyes, but Harry, instead of feeling pleased and proud, felt quite sure there had been a horrible", "begin": 5688.253, "end": 5699.333, "localBegin": 1168.44, "localEnd": 1179.52}, {"id": "c004_f000136", "text": "mistake. A wizard? Him? How could he possibly be? He'd spent his life being clouted by Dudley, and bullied by Aunt Petunia and Uncle Vernon; if he was really a wizard, why hadn't they been turned into warty toads every time they'd tried to lock him in his cupboard? If he'd once defeated the greatest sorcerer in the world, how come Dudley had always been able to kick him around like a football?", "begin": 5699.333, "end": 5725.013, "localBegin": 1179.52, "localEnd": 1205.2}, {"id": "c004_f000137", "text": "\"Hagrid,\" he said quietly, \"I think you must have made a mistake. I don't think I can be a wizard.\"", "begin": 5725.013, "end": 5732.133, "localBegin": 1205.2, "localEnd": 1212.32}, {"id": "c004_f000138", "text": "To his surprise, Hagrid chuckled.", "begin": 5732.133, "end": 5735.613, "localBegin": 1212.32, "localEnd": 1215.8}, {"id": "c004_f000139", "text": "\"Not a wizard, eh? Never made things happen when you was scared or angry?\"", "begin": 5735.613, "end": 5743.133, "localBegin": 1215.8, "localEnd": 1223.32}, {"id": "c004_f000140", "text": "Harry looked into the fire. Now he came to think about it . . . every odd thing that had ever made his aunt and uncle furious with him had happened when he, Harry, had been upset or angry . . . chased by Dudley's gang, he had somehow found himself out of their reach . . . dreading going to school with that ridiculous haircut, he'd managed to make it grow back . . . and the very last time Dudley had hit him, hadn't he got his revenge, without even realizing he was doing it? Hadn't he set a boa constrictor on him?", "begin": 5743.133, "end": 5774.213, "localBegin": 1223.32, "localEnd": 1254.4}, {"id": "c004_f000141", "text": "Harry looked back at Hagrid, smiling, and saw that Hagrid was positively beaming at him.", "begin": 5774.213, "end": 5781.013, "localBegin": 1254.4, "localEnd": 1261.2}, {"id": "c004_f000142", "text": "\"See?\" said Hagrid. \"Harry Potter, not a wizard - you wait, you'll be right famous at Hogwarts.\"", "begin": 5781.013, "end": 5791.333, "localBegin": 1261.2, "localEnd": 1271.52}, {"id": "c004_f000143", "text": "But Uncle Vernon wasn't going to give in without a fight.", "begin": 5791.333, "end": 5794.853, "localBegin": 1271.52, "localEnd": 1275.04}, {"id": "c004_f000144", "text": "\"Haven't I told you he's not going?\" he hissed. \"He's going to Stonewall High and he'll be grateful for it. I've read those letters and he needs all sorts of rubbish - spell books and wands and - \"", "begin": 5794.853, "end": 5807.773, "localBegin": 1275.04, "localEnd": 1287.96}, {"id": "c004_f000145", "text": "\"If he wants ter go, a great Muggle like you won't stop him,\" growled Hagrid. \"Stop Lily an' James Potter's son goin' ter Hogwarts! Yer mad. His name's been down ever since he was born. He's off ter the finest school of witchcraft and wizardry in the world. Seven years there and he won't know himself. He'll be with youngsters of his own sort, fer a change, an' he'll be under the greatest headmaster Hogwarts ever had, Albus Dumbled - \"", "begin": 5807.773, "end": 5838.813, "localBegin": 1287.96, "localEnd": 1319.0}, {"id": "c004_f000146", "text": "\"I AM NOT PAYING FOR SOME CRACKPOT OLD FOOL TO TEACH HIM MAGIC TRICKS!\" yelled Uncle Vernon.", "begin": 5838.813, "end": 5847.333, "localBegin": 1319.0, "localEnd": 1327.52}, {"id": "c004_f000147", "text": "But he had finally gone too far. Hagrid seized his umbrella and whirled it over", "begin": 5847.333, "end": 5853.213, "localBegin": 1327.52, "localEnd": 1333.4}, {"id": "c004_f000148", "text": "his head, \"NEVER - \" he thundered, \" - INSULT - ALBUS - DUMBLEDORE - IN - FRONT - OF - ME!\"", "begin": 5853.213, "end": 5865.013, "localBegin": 1333.4, "localEnd": 1345.2}, {"id": "c004_f000149", "text": "He brought the umbrella swishing down through the air to point at Dudley there was a flash of violet light, a sound like a firecracker, a sharp squeal, and the next second, Dudley was dancing on the spot with his hands clasped over his fat bottom, howling in pain. When he turned his back on them, Harry saw a curly pig's tail poking through a hole in his trousers.", "begin": 5865.013, "end": 5887.933, "localBegin": 1345.2, "localEnd": 1368.12}, {"id": "c004_f000150", "text": "Uncle Vernon roared. Pulling Aunt Petunia and Dudley into the other room, he cast one last terrified look at Hagrid and slammed the door behind them.", "begin": 5887.933, "end": 5897.413, "localBegin": 1368.12, "localEnd": 1377.6}, {"id": "c004_f000151", "text": "Hagrid looked down at his umbrella and stroked his beard.", "begin": 5897.413, "end": 5901.253, "localBegin": 1377.6, "localEnd": 1381.44}, {"id": "c004_f000152", "text": "\"Shouldn'ta lost me temper,\" he said ruefully, \"but it didn't work anyway. Meant ter turn him into a pig, but I suppose he was so much like a pig anyway there wasn't much left ter do.\"", "begin": 5901.253, "end": 5913.853, "localBegin": 1381.44, "localEnd": 1394.04}, {"id": "c004_f000153", "text": "He cast a sideways look at Harry under his bushy eyebrows.", "begin": 5913.853, "end": 5917.893, "localBegin": 1394.04, "localEnd": 1398.08}, {"id": "c004_f000154", "text": "\"Be grateful if yeh didn't mention that ter anyone at Hogwarts,\" he said. \"I'm - er - not supposed ter do magic, strictly speakin'. I was allowed ter do a bit ter follow yeh an' get yer letters to yeh an' stuff - one o' the reasons I was so keen ter take on the job - \"", "begin": 5917.893, "end": 5935.413, "localBegin": 1398.08, "localEnd": 1415.6}, {"id": "c004_f000155", "text": "\"Why aren't you supposed to do magic?\" asked Harry.", "begin": 5935.413, "end": 5939.333, "localBegin": 1415.6, "localEnd": 1419.52}, {"id": "c004_f000156", "text": "\"Oh, well - I was at Hogwarts meself but I - er - got expelled, ter tell yeh the truth. In me third year. They snapped me wand in half an' everything. But Dumbledore let me stay on as gamekeeper. Great man, Dumbledore.\"", "begin": 5939.333, "end": 5958.653, "localBegin": 1419.52, "localEnd": 1438.84}, {"id": "c004_f000157", "text": "\"Why were you expelled?\"", "begin": 5958.653, "end": 5961.453, "localBegin": 1438.84, "localEnd": 1441.64}, {"id": "c004_f000158", "text": "\"It's gettin' late and we've got lots ter do tomorrow,\" said Hagrid loudly. \"Gotta get up ter town, get all yer books an' that.\"", "begin": 5961.453, "end": 5968.613, "localBegin": 1441.64, "localEnd": 1448.8}, {"id": "c004_f000159", "text": "He took off his thick black coat and threw it to Harry.", "begin": 5968.613, "end": 5971.973, "localBegin": 1448.8, "localEnd": 1452.16}, {"id": "c004_f000160", "text": "\"You can kip under that,\" he said. \"Don' mind if it wriggles a bit, I think I still got a couple o' dormice in one o' the pockets.\"", "begin": 5971.973, "end": 5982.733, "localBegin": 1452.16, "localEnd": 1462.92}]}, {"kind": "chapter", "number": 5, "title": "Diagon Alley", "audio": "../Harry Potter and the Sorcerer's Stone, Book 1 (Unabridged)/005 - Harry Potter and the Sorcerer's Stone, Book 1 (Unabridged).mp3", "start": 5982.763, "end": 8617.763, "duration": 2635.0, "paragraphs": [{"id": "c005_f000001", "text": "Chapter Five. Diagon Alley.", "begin": 5982.763, "end": 5987.243, "localBegin": 0.0, "localEnd": 4.48}, {"id": "c005_f000002", "text": "Harry woke early the next morning. Although he could tell it was daylight, he kept his eyes shut tight.", "begin": 5987.243, "end": 5992.203, "localBegin": 4.48, "localEnd": 9.44}, {"id": "c005_f000003", "text": "\"It was a dream,\" he told himself firmly. \"I dreamed a giant called Hagrid came to tell me I was going to a school for wizards. When I open my eyes I'll be at home in my cupboard.\"", "begin": 5992.203, "end": 6003.563, "localBegin": 9.44, "localEnd": 20.8}, {"id": "c005_f000004", "text": "There was suddenly a loud tapping noise.", "begin": 6003.563, "end": 6006.043, "localBegin": 20.8, "localEnd": 23.28}, {"id": "c005_f000005", "text": "And there's Aunt Petunia knocking on the door, Harry thought, his heart sinking. But he still didn't open his eyes. It had been such a good dream.", "begin": 6006.043, "end": 6014.843, "localBegin": 23.28, "localEnd": 32.08}, {"id": "c005_f000006", "text": "Tap. Tap. Tap.", "begin": 6014.843, "end": 6016.083, "localBegin": 32.08, "localEnd": 33.32}, {"id": "c005_f000007", "text": "\"All right,\" Harry mumbled, \"I'm getting up.\"", "begin": 6016.083, "end": 6020.363, "localBegin": 33.32, "localEnd": 37.6}, {"id": "c005_f000008", "text": "He sat up and Hagrid's heavy coat fell off him. The hut was full of sunlight, the storm was over, Hagrid himself was asleep on the collapsed sofa, and there was an owl rapping its claw on the window, a newspaper held in its beak.", "begin": 6020.363, "end": 6033.843, "localBegin": 37.6, "localEnd": 51.08}, {"id": "c005_f000009", "text": "Harry scrambled to his feet, so happy he felt as though a large balloon was swelling inside him. He went straight to the window and jerked it open. The owl swooped in and dropped the newspaper on top of Hagrid, who didn't wake up. The owl then fluttered onto the floor and began to attack Hagrid's coat.", "begin": 6033.843, "end": 6050.843, "localBegin": 51.08, "localEnd": 68.08}, {"id": "c005_f000010", "text": "\"Don't do that.\"", "begin": 6050.843, "end": 6053.363, "localBegin": 68.08, "localEnd": 70.6}, {"id": "c005_f000011", "text": "Harry tried to wave the owl out of the way, but it snapped its beak fiercely at him and carried on savaging the coat.", "begin": 6053.363, "end": 6059.323, "localBegin": 70.6, "localEnd": 76.56}, {"id": "c005_f000012", "text": "\"Hagrid!\" said Harry loudly. \"There's an owl - \"", "begin": 6059.323, "end": 6062.363, "localBegin": 76.56, "localEnd": 79.6}, {"id": "c005_f000013", "text": "\"Pay him,\" Hagrid grunted into the sofa.", "begin": 6062.363, "end": 6065.363, "localBegin": 79.6, "localEnd": 82.6}, {"id": "c005_f000014", "text": "\"What?\"", "begin": 6065.363, "end": 6066.243, "localBegin": 82.6, "localEnd": 83.48}, {"id": "c005_f000015", "text": "\"He wants payin' fer deliverin' the paper. Look in the pockets.\"", "begin": 6066.243, "end": 6072.643, "localBegin": 83.48, "localEnd": 89.88}, {"id": "c005_f000016", "text": "Hagrid's coat seemed to be made of nothing but pockets - bunches of keys, slug pellets, balls of string, peppermint humbugs, teabags . . . finally, Harry pulled out a handful of strange-looking coins.", "begin": 6072.643, "end": 6085.003, "localBegin": 89.88, "localEnd": 102.24}, {"id": "c005_f000017", "text": "\"Give him five Knuts,\" said Hagrid sleepily.", "begin": 6085.003, "end": 6089.563, "localBegin": 102.24, "localEnd": 106.8}, {"id": "c005_f000018", "text": "\"Knuts?\"", "begin": 6089.563, "end": 6090.763, "localBegin": 106.8, "localEnd": 108.0}, {"id": "c005_f000019", "text": "\"The little bronze ones.\"", "begin": 6090.763, "end": 6093.963, "localBegin": 108.0, "localEnd": 111.2}, {"id": "c005_f000020", "text": "Harry counted out five little bronze coins, and the owl held out his leg so Harry could put the money into a small leather pouch tied to it. Then he flew off through the open window.", "begin": 6093.963, "end": 6104.883, "localBegin": 111.2, "localEnd": 122.12}, {"id": "c005_f000021", "text": "Hagrid yawned loudly, sat up, and stretched.", "begin": 6104.883, "end": 6107.963, "localBegin": 122.12, "localEnd": 125.2}, {"id": "c005_f000022", "text": "\"Best be off, Harry, lots ter do today, gotta get up ter London an' buy all yer stuff fer school.\"", "begin": 6107.963, "end": 6116.323, "localBegin": 125.2, "localEnd": 133.56}, {"id": "c005_f000023", "text": "Harry was turning over the wizard coins and looking at them. He had just thought of something that made him feel as though the happy balloon inside him had got a puncture.", "begin": 6116.323, "end": 6124.803, "localBegin": 133.56, "localEnd": 142.04}, {"id": "c005_f000024", "text": "\"Um - Hagrid?\"", "begin": 6124.803, "end": 6126.723, "localBegin": 142.04, "localEnd": 143.96}, {"id": "c005_f000025", "text": "\"Mm?\" said Hagrid, who was pulling on his huge boots.", "begin": 6126.723, "end": 6130.723, "localBegin": 143.96, "localEnd": 147.96}, {"id": "c005_f000026", "text": "\"I haven't got any money - and you heard Uncle Vernon last night . . . he won't pay for me to go and learn magic.\"", "begin": 6130.723, "end": 6137.483, "localBegin": 147.96, "localEnd": 154.72}, {"id": "c005_f000027", "text": "\"Don't worry about that,\" said Hagrid, standing up and scratching his head. \"D'yeh think yer parents didn't leave yeh anything?\"", "begin": 6137.483, "end": 6144.523, "localBegin": 154.72, "localEnd": 161.76}, {"id": "c005_f000028", "text": "\"But if their house was destroyed - \"", "begin": 6144.523, "end": 6147.003, "localBegin": 161.76, "localEnd": 164.24}, {"id": "c005_f000029", "text": "\"They didn' keep their gold in the house, boy! Nah, first stop fer us is Gringotts. Wizards' bank. Have a sausage, they're not bad cold - an' I wouldn' say no teh a bit o' yer birthday cake, neither.\"", "begin": 6147.003, "end": 6162.203, "localBegin": 164.24, "localEnd": 179.44}, {"id": "c005_f000030", "text": "\"Wizards have banks?\"", "begin": 6162.203, "end": 6164.723, "localBegin": 179.44, "localEnd": 181.96}, {"id": "c005_f000031", "text": "\"Just the one. Gringotts. Run by goblins.\"", "begin": 6164.723, "end": 6169.763, "localBegin": 181.96, "localEnd": 187.0}, {"id": "c005_f000032", "text": "Harry dropped the bit of sausage he was holding.", "begin": 6169.763, "end": 6171.843, "localBegin": 187.0, "localEnd": 189.08}, {"id": "c005_f000033", "text": "\"Gob
