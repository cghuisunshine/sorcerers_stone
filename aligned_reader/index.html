llowed. He sat down next to Harry, took one look at him, and burst into tears.", "begin": 29080.455, "end": 29094.175, "localBegin": 1643.8, "localEnd": 1657.52}, {"id": "c017_f000174", "text": "\"It's - all - my - ruddy - fault!\" he sobbed, his face in his hands. \"I told the evil git how ter get past Fluffy! I told him! It was the only thing he didn't know, an' I told him! Yeh could've died! All fer a dragon egg! I'll never drink again! I should be chucked out an' made ter live as a Muggle!\"", "begin": 29094.175, "end": 29123.215, "localBegin": 1657.52, "localEnd": 1686.56}, {"id": "c017_f000175", "text": "\"Hagrid!\" said Harry, shocked to see Hagrid shaking with grief and remorse, great tears leaking down into his beard. \"Hagrid, he'd have found out somehow, this is Voldemort we're talking about, he'd have found out even if you hadn't told him.\"", "begin": 29123.215, "end": 29139.775, "localBegin": 1686.56, "localEnd": 1703.12}, {"id": "c017_f000176", "text": "\"Yeh could've died!\" sobbed Hagrid. \"An' don' say the name!\"", "begin": 29139.775, "end": 29146.575, "localBegin": 1703.12, "localEnd": 1709.92}, {"id": "c017_f000177", "text": "\"VOLDEMORT!\" Harry bellowed, and Hagrid was so shocked, he stopped crying. \"I've met him and I'm calling him by his name. Please cheer up, Hagrid, we saved the Stone, it's gone, he can't use it. Have a Chocolate Frog, I've got", "begin": 29146.575, "end": 29163.975, "localBegin": 1709.92, "localEnd": 1727.32}, {"id": "c017_f000178", "text": "loads. . . .\"", "begin": 29163.975, "end": 29164.615, "localBegin": 1727.32, "localEnd": 1727.96}, {"id": "c017_f000179", "text": "Hagrid wiped his nose on the back of his hand and said, \"That reminds me. I've got yeh a present.\"", "begin": 29164.615, "end": 29172.255, "localBegin": 1727.96, "localEnd": 1735.6}, {"id": "c017_f000180", "text": "\"It's not a stoat sandwich, is it?\" said Harry anxiously, and at last Hagrid gave a weak chuckle.", "begin": 29172.255, "end": 29179.335, "localBegin": 1735.6, "localEnd": 1742.68}, {"id": "c017_f000181", "text": "\"Nah. Dumbledore gave me the day off yesterday ter fix it. 'Course, he shoulda sacked me instead - anyway, got yeh this . . .\"", "begin": 29179.335, "end": 29188.535, "localBegin": 1742.68, "localEnd": 1751.88}, {"id": "c017_f000182", "text": "It seemed to be a handsome, leather-covered book. Harry opened it curiously. It was full of wizard photographs. Smiling and waving at him from every page were his mother and father.", "begin": 29188.535, "end": 29203.655, "localBegin": 1751.88, "localEnd": 1767.0}, {"id": "c017_f000183", "text": "\"Sent owls off ter all yer parents' old school friends, askin' fer photos . . . knew yeh didn' have any . . . d'yeh like it?\"", "begin": 29203.655, "end": 29214.495, "localBegin": 1767.0, "localEnd": 1777.84}, {"id": "c017_f000184", "text": "Harry couldn't speak, but Hagrid understood.", "begin": 29214.495, "end": 29219.095, "localBegin": 1777.84, "localEnd": 1782.44}, {"id": "c017_f000185", "text": "Harry made his way down to the end-of-year feast alone that night. He had been held up by Madam Pomfrey's fussing about, insisting on giving him one last checkup, so the Great Hall was already full. It was decked out in the Slytherin colors of green and silver to celebrate Slytherin's winning the House Cup for the seventh year in a row. A huge banner showing the Slytherin serpent covered the wall behind the High Table.", "begin": 29219.095, "end": 29246.695, "localBegin": 1782.44, "localEnd": 1810.04}, {"id": "c017_f000186", "text": "When Harry walked in there was a sudden hush, and then everybody started talking loudly at once. He slipped into a seat between Ron and Hermione at the Gryffindor table and tried to ignore the fact that people were standing up to look at him.", "begin": 29246.695, "end": 29261.095, "localBegin": 1810.04, "localEnd": 1824.44}, {"id": "c017_f000187", "text": "Fortunately, Dumbledore arrived moments later. The babble died away.", "begin": 29261.095, "end": 29266.575, "localBegin": 1824.44, "localEnd": 1829.92}, {"id": "c017_f000188", "text": "\"Another year gone!\" Dumbledore said cheerfully. \"And I must trouble you with an old man's wheezing waffle before we sink our teeth into our delicious feast. What a year it has been! Hopefully your heads are all a little fuller than they were . . . you have the whole summer ahead to get them nice and empty before next year starts. . . .", "begin": 29266.575, "end": 29293.455, "localBegin": 1829.92, "localEnd": 1856.8}, {"id": "c017_f000189", "text": "\"Now, as I understand it, the House Cup here needs awarding, and the points stand thus: In fourth place, Gryffindor, with three hundred and twelve points; in third, Hufflepuff, with three hundred and fifty-two; Ravenclaw has four hundred and twenty-six and Slytherin, four hundred and seventy-two.\"", "begin": 29293.455, "end": 29322.695, "localBegin": 1856.8, "localEnd": 1886.04}, {"id": "c017_f000190", "text": "A storm of cheering and stamping broke out from the Slytherin table. Harry could see Draco Malfoy banging his goblet on the table. It was a sickening sight.", "begin": 29322.695, "end": 29333.015, "localBegin": 1886.04, "localEnd": 1896.36}, {"id": "c017_f000191", "text": "\"Yes, yes, well done, Slytherin,\" said Dumbledore. \"However, recent events must be taken into account.\"", "begin": 29333.015, "end": 29342.895, "localBegin": 1896.36, "localEnd": 1906.24}, {"id": "c017_f000192", "text": "The room went very still. The Slytherins' smiles faded a little.", "begin": 29342.895, "end": 29348.775, "localBegin": 1906.24, "localEnd": 1912.12}, {"id": "c017_f000193", "text": "\"Ahem,\" said Dumbledore. \"I have a few last-minute points to dish out. Let me see. Yes . . .", "begin": 29348.775, "end": 29358.535, "localBegin": 1912.12, "localEnd": 1921.88}, {"id": "c017_f000194", "text": "\"First - to Mr. Ronald Weasley . . .\"", "begin": 29358.535, "end": 29362.575, "localBegin": 1921.88, "localEnd": 1925.92}, {"id": "c017_f000195", "text": "Ron went purple in the face; he looked like a radish with a bad sunburn.", "begin": 29362.575, "end": 29367.655, "localBegin": 1925.92, "localEnd": 1931.0}, {"id": "c017_f000196", "text": "\". . . for the best-played game of chess Hogwarts has seen in many years, I award Gryffindor House fifty points.\"", "begin": 29367.655, "end": 29377.335, "localBegin": 1931.0, "localEnd": 1940.68}, {"id": "c017_f000197", "text": "Gryffindor cheers nearly raised the bewitched ceiling; the stars overhead seemed to quiver. Percy could be heard telling the other prefects, \"My brother, you know! My youngest brother! Got past McGonagall's giant chess set!\"", "begin": 29377.335, "end": 29391.335, "localBegin": 1940.68, "localEnd": 1954.68}, {"id": "c017_f000198", "text": "At last there was silence again.", "begin": 29391.335, "end": 29394.175, "localBegin": 1954.68, "localEnd": 1957.52}, {"id": "c017_f000199", "text": "\"Second - to Miss Hermione Granger . . . for the use of cool logic in the face of fire, I award Gryffindor House fifty points.\"", "begin": 29394.175, "end": 29406.535, "localBegin": 1957.52, "localEnd": 1969.88}, {"id": "c017_f000200", "text": "Hermione buried her face in her arms; Harry strongly suspected she had burst into tears. Gryffindors up and down the table were beside themselves - they were a hundred points up.", "begin": 29406.535, "end": 29418.575, "localBegin": 1969.88, "localEnd": 1981.92}, {"id": "c017_f000201", "text": "\"Third - to Mr. Harry Potter . . .\" said Dumbledore. The room went deadly quiet. \". . . for pure nerve and outstanding courage, I award Gryffindor House sixty points.\"", "begin": 29418.575, "end": 29435.095, "localBegin": 1981.92, "localEnd": 1998.44}, {"id": "c017_f000202", "text": "The din was deafening. Those who could add up while yelling themselves hoarse knew that Gryffindor now had four hundred and seventy-two points - exactly the same as Slytherin. They had tied for the House Cup - if only Dumbledore had given Harry just one more point.", "begin": 29435.095, "end": 29453.695, "localBegin": 1998.44, "localEnd": 2017.04}, {"id": "c017_f000203", "text": "Dumbledore raised his hand. The room gradually fell silent.", "begin": 29453.695, "end": 29459.095, "localBegin": 2017.04, "localEnd": 2022.44}, {"id": "c017_f000204", "text": "\"There are all kinds of courage,\" said Dumbledore, smiling. \"It takes a great deal of bravery to stand up to our enemies, but just as much to stand up to our friends. I therefore award ten points to Mr. Neville Longbottom.\"", "begin": 29459.095, "end": 29482.175, "localBegin": 2022.44, "localEnd": 2045.52}, {"id": "c017_f000205", "text": "Someone standing outside the Great Hall might well have thought some sort of explosion had taken place, so loud was the noise that erupted from the Gryffindor table. Harry, Ron, and Hermione stood up to yell and cheer as Neville, white with shock, disappeared under a pile of people hugging him. He had never won so much as a point for Gryffindor before. Harry, still cheering, nudged Ron in the ribs and pointed at Malfoy, who couldn't have looked more stunned and horrified if he'd just had the Body-Bind Curse put on him.", "begin": 29482.175, "end": 29518.015, "localBegin": 2045.52, "localEnd": 2081.36}, {"id": "c017_f000206", "text": "\"Which means,\" Dumbledore called over the storm of applause, for even Ravenclaw and Hufflepuff were celebrating the downfall of Slytherin, \"we need a little change of decoration.\"", "begin": 29518.015, "end": 29532.455, "localBegin": 2081.36, "localEnd": 2095.8}, {"id": "c017_f000207", "text": "He clapped his hands. In an instant, the green hangings became scarlet and the silver became gold; the huge Slytherin serpent vanished and a towering Gryffindor lion took its place. Snape was shaking Professor McGonagall's hand, with a horrible, forced smile. He caught Harry's eye and Harry knew at once that Snape's feelings toward him hadn't changed one jot. This didn't worry Harry. It seemed as though life would be back to normal next year, or as normal as it ever was at Hogwarts.", "begin": 29532.455, "end": 29564.975, "localBegin": 2095.8, "localEnd": 2128.32}, {"id": "c017_f000208", "text": "It was the best evening of Harry's life, better than winning at Quidditch, or Christmas, or knocking out mountain trolls . . . he would never, ever forget tonight.", "begin": 29564.975, "end": 29577.855, "localBegin": 2128.32, "localEnd": 2141.2}, {"id": "c017_f000209", "text": "Harry had almost forgotten that the exam results were still to come, but come they did. To their great surprise, both he and Ron passed with good marks; Hermione, of course, had the best grades of the first years. Even Neville scraped through, his good Herbology mark making up for his abysmal Potions one. They had hoped that Goyle, who was almost as stupid as he was mean, might be thrown out, but he had passed, too. It was a shame, but as Ron said, you couldn't have everything in life.", "begin": 29577.855, "end": 29612.095, "localBegin": 2141.2, "localEnd": 2175.44}, {"id": "c017_f000210", "text": "And suddenly, their wardrobes were empty, their trunks were packed, Neville's toad was found lurking in a corner of the toilets; notes were handed out to all students, warning them not to use magic over the holidays (\"I always hope they'll forget to give us these,\" said Fred Weasley sadly); Hagrid was there to take them down to the fleet of boats that sailed across the lake; they were boarding the Hogwarts Express; talking and laughing as the countryside became greener and tidier; eating Bertie Bott's Every Flavor Beans as they sped past Muggle towns; pulling off their wizard robes and putting on jackets and coats; pulling into platform nine and three-quarters at King's Cross station.", "begin": 29612.095, "end": 29653.775, "localBegin": 2175.44, "localEnd": 2217.12}, {"id": "c017_f000211", "text": "It took quite a while for them all to get off the platform. A wizened old guard was up by the ticket barrier, letting them go through the gate in twos and threes so they didn't attract attention by all bursting out of a solid wall at once and alarming the Muggles.", "begin": 29653.775, "end": 29670.295, "localBegin": 2217.12, "localEnd": 2233.64}, {"id": "c017_f000212", "text": "\"You must come and stay this summer,\" said Ron, \"both of you - I'll send you an owl.\"", "begin": 29670.295, "end": 29675.775, "localBegin": 2233.64, "localEnd": 2239.12}, {"id": "c017_f000213", "text": "\"Thanks,\" said Harry, \"I'll need something to look forward to.\"", "begin": 29675.775, "end": 29680.055, "localBegin": 2239.12, "localEnd": 2243.4}, {"id": "c017_f000214", "text": "People jostled them as they moved forward toward the gateway back to the Muggle world. Some of them called:", "begin": 29680.055, "end": 29687.095, "localBegin": 2243.4, "localEnd": 2250.44}, {"id": "c017_f000215", "text": "\"Bye, Harry!\"", "begin": 29687.095, "end": 29687.935, "localBegin": 2250.44, "localEnd": 2251.28}, {"id": "c017_f000216", "text": "\"See you, Potter!\"", "begin": 29687.935, "end": 29689.135, "localBegin": 2251.28, "localEnd": 2252.48}, {"id": "c017_f000217", "text": "\"Still famous,\" said Ron, grinning at him.", "begin": 29689.135, "end": 29692.295, "localBegin": 2252.48, "localEnd": 2255.64}, {"id": "c017_f000218", "text": "\"Not where I'm going, I promise you,\" said Harry.", "begin": 29692.295, "end": 29695.615, "localBegin": 2255.64, "localEnd": 2258.96}, {"id": "c017_f000219", "text": "He, Ron, and Hermione passed through the gateway together.", "begin": 29695.615, "end": 29700.095, "localBegin": 2258.96, "localEnd": 2263.44}, {"id": "c017_f000220", "text": "\"There he is, Mum, there he is, look!\"", "begin": 29700.095, "end": 29703.575, "localBegin": 2263.44, "localEnd": 2266.92}, {"id": "c017_f000221", "text": "It was Ginny Weasley, Ron's younger sister, but she wasn't pointing at Ron.", "begin": 29703.575, "end": 29708.655, "localBegin": 2266.92, "localEnd": 2272.0}, {"id": "c017_f000222", "text": "\"Harry Potter!\" she squealed. \"Look, Mum! I can see - \"", "begin": 29708.655, "end": 29712.255, "localBegin": 2272.0, "localEnd": 2275.6}, {"id": "c017_f000223", "text": "\"Be quiet, Ginny, and it's rude to point.\"", "begin": 29712.255, "end": 29716.055, "localBegin": 2275.6, "localEnd": 2279.4}, {"id": "c017_f000224", "text": "Mrs. Weasley smiled down at them.", "begin": 29716.055, "end": 29718.455, "localBegin": 2279.4, "localEnd": 2281.8}, {"id": "c017_f000225", "text": "\"Busy year?\" she said.", "begin": 29718.455, "end": 29720.415, "localBegin": 2281.8, "localEnd": 2283.76}, {"id": "c017_f000226", "text": "\"Very,\" said Harry. \"Thanks for the fudge and the sweater, Mrs. Weasley.\"", "begin": 29720.415, "end": 29724.855, "localBegin": 2283.76, "localEnd": 2288.2}, {"id": "c017_f000227", "text": "\"Oh, it was nothing, dear.\"", "begin": 29724.855, "end": 29726.815, "localBegin": 2288.2, "localEnd": 2290.16}, {"id": "c017_f000228", "text": "\"Ready, are you?\"", "begin": 29726.815, "end": 29728.655, "localBegin": 2290.16, "localEnd": 2292.0}, {"id": "c017_f000229", "text": "It was Uncle Vernon, still purple-faced, still mustached, still looking furious at the nerve of Harry, carrying an owl in a cage in a station full of ordinary people. Behind him stood Aunt Petunia and Dudley, looking terrified at the very sight of Harry.", "begin": 29728.655, "end": 29745.495, "localBegin": 2292.0, "localEnd": 2308.84}, {"id": "c017_f000230", "text": "\"You must be Harry's family!\" said Mrs. Weasley.", "begin": 29745.495, "end": 29749.975, "localBegin": 2308.84, "localEnd": 2313.32}, {"id": "c017_f000231", "text": "\"In a manner of speaking,\" said Uncle Vernon. \"Hurry up, boy, we haven't got all day.\" He walked away.", "begin": 29749.975, "end": 29773.255, "localBegin": 2313.32, "localEnd": 2336.6}, {"id": "c017_f000232", "text": "Harry hung back for a last word with Ron and Hermione.", "begin": 29773.255, "end": 29789.535, "localBegin": 2336.6, "localEnd": 2352.88}, {"id": "c017_f000233", "text": "\"See you over the summer, then.\"", "begin": 29789.535, "end": 29794.015, "localBegin": 2352.88, "localEnd": 2357.36}, {"id": "c017_f000234", "text": "\"Hope you have - er - a good holiday,\" said Hermione, looking uncertainly after Uncle Vernon, shocked that anyone could be so unpleasant.", "begin": 29794.015, "end": 29813.535, "localBegin": 2357.36, "localEnd": 2376.88}, {"id": "c017_f000235", "text": "\"Oh, I will,\" said Harry, and they were surprised at the grin that was spreading over his face. \"They don't know we're not allowed to use magic at home. I'm going to have a lot of fun with Dudley this summer. . . .\"", "begin": 29813.535, "end": 29853.535, "localBegin": 2376.88, "localEnd": 2416.88}]}, {"kind": "outro", "number": null, "title": "Outro", "audio": "../Harry Potter and the Sorcerer's Stone, Book 1 (Unabridged)/018 - Harry Potter and the Sorcerer's Stone, Book 1 (Unabridged).mp3", "start": 29853.574, "end": 30810.5, "duration": 956.926, "paragraphs": []}]};
    const audio = document.getElementById('audio');
    const chapterList = document.getElementById('chapterList');

    const playButton = document.getElementById('playButton');
    const prevButton = document.getElementById('prevButton');
    const nextButton = document.getElementById('nextButton');
    const seekBar = document.getElementById('seekBar');
    const timeLabel = document.getElementById('timeLabel');
    const chapterTime = document.getElementById('chapterTime');
    const progressStorageKey = `aligned-reader:${manifest.title}:latest-position`;
    let currentIndex = 0;
    let currentParagraphId = null;
    let pendingSeekLocalTime = null;

    function formatTime(seconds) {
      seconds = Math.max(0, Math.floor(seconds || 0));
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = seconds % 60;
      return h ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${m}:${String(s).padStart(2, '0')}`;
    }

    function renderNav() {
      chapterList.innerHTML = '';
      manifest.chapters.forEach((chapter, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'chapter-link' + (index === currentIndex ? ' active' : '');
        const number = chapter.kind === 'chapter' ? String(chapter.number).padStart(2, '0') : '--';
        button.innerHTML = `<span class="chapter-number">${number}</span><span>${chapter.title}</span>`;
        button.addEventListener('click', () => loadChapter(index, true));
        chapterList.appendChild(button);
      });
    }

    function chapterAudioStart(chapter) {
      return chapter.audioStart || 0;
    }

    function seekAudioToLocalTime(chapter, localTime) {
      const targetTime = chapterAudioStart(chapter) + localTime;
      if (audio.readyState < 1 || Math.abs((audio.currentTime || 0) - targetTime) > 0.25) {
        pendingSeekLocalTime = localTime;
      }
      const seekAudio = () => {
        audio.currentTime = targetTime;
      };
      if (audio.readyState < 1) {
        audio.addEventListener('loadedmetadata', seekAudio, { once: true });
      } else {
        seekAudio();
      }
    }

    function findParagraphAt(chapter, localTime) {
      return chapter.paragraphs.find((item) => localTime >= item.localBegin && localTime < item.localEnd) || null;
    }

    function saveProgress(paragraph) {
      if (!paragraph) return;
      try {
        localStorage.setItem(progressStorageKey, JSON.stringify({
          chapterIndex: currentIndex,
          paragraphId: paragraph.id,
          localTime: paragraph.localBegin,
          updatedAt: Date.now()
        }));
      } catch {
        // Storage may be unavailable; the reader still works without persistence.
      }
    }

    function readSavedProgress() {
      try {
        const raw = localStorage.getItem(progressStorageKey);
        if (!raw) return null;
        const saved = JSON.parse(raw);
        const chapterIndex = Number(saved.chapterIndex);
        if (!Number.isInteger(chapterIndex) || chapterIndex < 0 || chapterIndex >= manifest.chapters.length) {
          return null;
        }
        const chapter = manifest.chapters[chapterIndex];
        const paragraph = chapter.paragraphs.find((item) => item.id === saved.paragraphId);
        if (!paragraph) return null;
        return {
          chapterIndex,
          localTime: paragraph.localBegin
        };
      } catch {
        return null;
      }
    }

    function loadChapter(index, autoplay = false, seek = true, startLocalTime = null) {
      currentIndex = Math.max(0, Math.min(index, manifest.chapters.length - 1));
      const chapter = manifest.chapters[currentIndex];
      currentParagraphId = null;
      const nextSource = new URL(chapter.audio, window.location.href).href;
      const sourceChanged = audio.src !== nextSource;

        audio.src = chapter.audio;
      }
      chapterTitle.textContent = chapter.kind === 'chapter' ? `Chapter ${chapter.number}. ${chapter.title}` : chapter.title;
      reader.innerHTML = '';
      if (chapter.paragraphs.length) {
        chapter.paragraphs.forEach((paragraph) => {
          const node = document.createElement('p');
          node.className = 'paragraph';
          node.id = paragraph.id;
          node.textContent = paragraph.text;
          node.addEventListener('click', () => {
            updateHighlight(paragraph.localBegin);
            seekAudioToLocalTime(chapter, paragraph.localBegin);
            audio.play();
          });
          reader.appendChild(node);
        });
      } else {
        const node = document.createElement('p');
        node.className = 'outro';
        node.textContent = 'Audio outro';
        reader.appendChild(node);
      }
      renderNav();
      const safeStartLocalTime = Number.isFinite(startLocalTime) ? startLocalTime : 0;
      if (seek) {
        if (chapter.paragraphs.length) {
          updateHighlight(safeStartLocalTime);
        }
        seekAudioToLocalTime(chapter, safeStartLocalTime);
      }
      updateTimes();
      const startPlayback = () => {
        if (autoplay) {
          audio.play();
        }
      };
      if (sourceChanged && audio.readyState < 1) {
        audio.addEventListener('loadedmetadata', startPlayback, { once: true });
      } else {
        startPlayback();
      }
    }

    function updateTimes() {
      const chapter = manifest.chapters[currentIndex];
      const audioClock = audio.currentTime || 0;
      const local = Math.max(0, audioClock - chapterAudioStart(chapter));
      const displayLocal = pendingSeekLocalTime ?? local;
      timeLabel.textContent = `${formatTime(chapter.start + displayLocal)} / ${formatTime(manifest.duration)}`;
      chapterTime.textContent = `${formatTime(displayLocal)} / ${formatTime(chapter.duration)}`;
      seekBar.value = chapter.duration ? String(Math.round((displayLocal / chapter.duration) * 1000)) : '0';
      updateHighlight(displayLocal);
      const nextChapter = manifest.chapters[currentIndex + 1];
      if (!audio.paused && nextChapter && nextChapter.audio === chapter.audio && local >= chapter.duration - 0.15) {
        loadChapter(currentIndex + 1, true, false);
      }
    }

    function updateHighlight(local) {
      const chapter = manifest.chapters[currentIndex];
      const paragraph = findParagraphAt(chapter, local);
      const nextId = paragraph ? paragraph.id : null;
      if (nextId === currentParagraphId) return;
      if (currentParagraphId) {
        document.getElementById(currentParagraphId)?.classList.remove('active');
      }
      currentParagraphId = nextId;
      if (currentParagraphId) {
        const node = document.getElementById(currentParagraphId);
        node?.classList.add('active');
        node?.scrollIntoView({ block: 'center', behavior: 'smooth' });
        saveProgress(paragraph);
      }
    }

    playButton.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
      } else {
        audio.pause();
      }
    });
    prevButton.addEventListener('click', () => loadChapter(currentIndex - 1, !audio.paused));
    nextButton.addEventListener('click', () => loadChapter(currentIndex + 1, !audio.paused));
    seekBar.addEventListener('input', () => {
      const chapter = manifest.chapters[currentIndex];
      const local = (Number(seekBar.value) / 1000) * chapter.duration;
      updateHighlight(local);
      seekAudioToLocalTime(chapter, local);
    });
    audio.addEventListener('play', () => playButton.textContent = 'Pause');
    audio.addEventListener('pause', () => playButton.textContent = 'Play');
    audio.addEventListener('seeked', () => {
      const chapter = manifest.chapters[currentIndex];
      const local = Math.max(0, (audio.currentTime || 0) - chapterAudioStart(chapter));
      if (pendingSeekLocalTime !== null && Math.abs(local - pendingSeekLocalTime) <= 0.25) {
        pendingSeekLocalTime = null;
      }
      updateTimes();
    });
    audio.addEventListener('timeupdate', updateTimes);
    audio.addEventListener('loadedmetadata', updateTimes);
    audio.addEventListener('ended', () => {
      if (currentIndex < manifest.chapters.length - 1) {
        loadChapter(currentIndex + 1, true);
      }
    });

    const savedProgress = readSavedProgress();
    if (savedProgress) {
      loadChapter(savedProgress.chapterIndex, false, true, savedProgress.localTime);
    } else {
      loadChapter(0, false);
    }
  </script>
</body>
</html>
